---
# SQL Exporter Configuration for Materialize Cloud
#
# IMPORTANT: This configuration is for Materialize Cloud environments.
# For local development with Docker Compose, use config.local.yml
#
# Connection String Format:
# postgres://USER:PASSWORD@HOST:PORT/DATABASE?sslmode=require
#
# Note: Escape special characters in username/password:
#   @ becomes %40
#   : becomes %3A
#   Example: user@domain.com becomes user%40domain.com
#
# For production use, replace the placeholder connection string below
# with your actual Materialize Cloud credentials.

jobs:
- name: "materialize"
  interval: '1m'
  connections:
  # Replace with your Materialize Cloud connection string
  - "postgres://username%40domain.com:password@servername.lb.us-east-1.aws.materialize.cloud:6875/materialize?sslmode=require"
  queries:
  - name: "cluster_replicas"
    help: "Cluster replica info"
    labels:
      - "cluster_id"
      - "replica_id"
      - "cluster_name"
      - "replica_name"
      - "size"
    values:
      - "count"
    query:  |
              SELECT 
                  c.id::text as cluster_id,
                  r.id::text as replica_id,
                  c.name::text as cluster_name,
                  r.name::text as replica_name,
                  r.size::text as size,
                  '1'::float as count
              FROM mz_catalog.mz_clusters c
                  JOIN mz_catalog.mz_cluster_replicas r on c.id = r.cluster_id
              WHERE r.id like 'u%';
  - name: "replica_uptime"
    help: "Uptime Per Cluster Replica"
    labels:
      - "replica_id"
      - "cluster_name"
      - "replica_name"
    values:
      - "container_start_time_seconds"
      - "uptime_seconds"
    query:  |
              SELECT
                  r.name :: TEXT AS replica_name,
                  c.name :: TEXT AS cluster_name,
                  s.replica_id :: TEXT AS replica_id,
                  extract(
                      epoch
                      FROM
                          max(s.updated_at)
                  ) :: FLOAT AS container_start_time_seconds,
                  extract(
                      epoch
                      FROM
                          now() - max(s.updated_at)
                  ) :: FLOAT AS uptime_seconds
              FROM
                  mz_internal.mz_cluster_replica_statuses s
                  JOIN mz_catalog.mz_cluster_replicas r ON s.replica_id = r.id
                  JOIN mz_catalog.mz_clusters c ON r.cluster_id = c.id
              WHERE
                  s.status = 'online'
                  AND replica_id LIKE 'u%'
              GROUP BY
                  replica_id,
                  r.name,
                  c.name;           
  - name: "cluster_replica_usage"
    help: "Cluster replica metrics"
    labels:
      - "replica_id"
      - "cluster_id"
      - "cluster_name"
      - "replica_name"
      - "cluster_type"
      - "replica_status_label"
      - "not_ready_reason"
    values:
      - "cpu_percent"
      - "memory_percent"
      - "disk_percent"
      - "used_memory_bytes"
      - "used_disk_bytes"
      - "used_cpu_nano_cores"
      - "total_memory_bytes"
      - "total_disk_bytes"
      - "total_cpu_nano_cores"
      - "credits_per_hour"
      - "replica_status"
    # mz_cluster_replica_utilization, mz_cluster_replica_metrics and
    # mz_cluster_replica_statuses all carry one row per process. Joining them on
    # replica_id alone is a cross product, so any replica whose size uses more
    # than one process emitted several rows with the same labels and different
    # values, which fails the whole /metrics endpoint. The joins now line up on
    # process_id and the result is aggregated back to one row per replica.
    #
    # mz_cluster_replica_sizes reports its allocations per process, so the
    # total_* values are scaled by the process count. Percentages are the
    # highest of any process, which is what "close to the limit" means for a
    # replica. Driving from mz_cluster_replicas rather than from the utilization
    # view keeps replicas with no metrics yet, so an offline replica still
    # reports its status.
    query:  |
            SELECT
              R.id::TEXT as replica_id,
              R.cluster_id::TEXT as cluster_id,
              C.name::TEXT as cluster_name,
              R.name::TEXT as replica_name,
              CASE
                WHEN bool_or(RST.status = 'offline') THEN 'offline'
                ELSE 'online'
              END as replica_status_label,
              COALESCE(max(RST.reason), '') as not_ready_reason,
              sum(COALESCE(M.memory_bytes, 0))::float as used_memory_bytes,
              sum(COALESCE(M.disk_bytes, 0))::float as used_disk_bytes,
              sum(COALESCE(M.cpu_nano_cores, 0))::float as used_cpu_nano_cores,
              (RS.memory_bytes * RS.processes)::float as total_memory_bytes,
              (COALESCE(RS.disk_bytes, 0) * RS.processes)::float as total_disk_bytes,
              (RS.cpu_nano_cores * RS.processes)::float as total_cpu_nano_cores,
              max(COALESCE(U.cpu_percent, 0))::float as cpu_percent,
              max(COALESCE(U.memory_percent, 0))::float as memory_percent,
              max(COALESCE(U.disk_percent, 0))::float as disk_percent,
              RS.credits_per_hour::float as credits_per_hour,
              CASE
                WHEN bool_or(RST.status = 'offline') THEN 1
                ELSE 0
              END::float AS replica_status,
              CASE
                WHEN S.cluster_id IS NOT NULL THEN 'source'
                WHEN SK.cluster_id IS NOT NULL THEN 'sink'
                ELSE 'compute'
              END AS cluster_type
            FROM mz_catalog.mz_cluster_replicas R
            JOIN mz_catalog.mz_clusters C ON (R.cluster_id = C.id)
            JOIN mz_catalog.mz_cluster_replica_sizes RS ON (R.size = RS.size)
            JOIN mz_internal.mz_cluster_replica_statuses RST ON (RST.replica_id = R.id)
            LEFT JOIN mz_internal.mz_cluster_replica_utilization U
              ON (U.replica_id = RST.replica_id AND U.process_id = RST.process_id)
            LEFT JOIN mz_internal.mz_cluster_replica_metrics M
              ON (M.replica_id = RST.replica_id AND M.process_id = RST.process_id)
            LEFT JOIN (
              SELECT DISTINCT cluster_id FROM mz_catalog.mz_sources WHERE cluster_id IS NOT NULL
            ) S ON (C.id = S.cluster_id)
            LEFT JOIN (
              SELECT DISTINCT cluster_id FROM mz_catalog.mz_sinks WHERE cluster_id IS NOT NULL
            ) SK ON (C.id = SK.cluster_id)
            GROUP BY
              R.id,
              R.cluster_id,
              C.name,
              R.name,
              RS.memory_bytes,
              RS.disk_bytes,
              RS.cpu_nano_cores,
              RS.processes,
              RS.credits_per_hour,
              S.cluster_id,
              SK.cluster_id;
  - name: "source_statistics"
    help: "Source statistics"
    labels:
      - "source_id"
      - "source_name"
      - "replica_id"
    values:
      - "updates_committed"
      - "rehydration_latency_seconds"
      - "offset_known"
      - "offset_committed"
    # mz_source_statistics is keyed on (id, replica_id). A source ingested by
    # more than one replica reports one row per replica, so replica_id has to be
    # a label or the scrape emits duplicate series and sql_exporter fails the
    # whole /metrics endpoint.
    #
    # Rows for a dropped replica are retained until
    # storage_statistics_retention_duration elapses (24h by default), so they
    # also have to be filtered out. Webhook sources report replica_id IS NULL,
    # which is why this is an existence check rather than a join.
    query: |
        SELECT
          s.id::TEXT as source_id,
          so.name::TEXT as source_name,
          COALESCE(s.replica_id, '')::TEXT as replica_id,
          s.updates_committed::FLOAT,
          COALESCE(extract(epoch from s.rehydration_latency)::FLOAT, 0) as rehydration_latency_seconds,
          s.offset_known::FLOAT,
          s.offset_committed::FLOAT
        FROM
          mz_internal.mz_source_statistics s
          JOIN mz_catalog.mz_sources so ON so.id = s.id
        WHERE
          s.replica_id IS NULL
          OR EXISTS (
            SELECT 1 FROM mz_catalog.mz_cluster_replicas r WHERE r.id = s.replica_id
          );
  - name: "sink_statistics"
    help: "Sink statistics"
    labels:
      - "sink_id"
      - "sink_name"
      - "sink_type"
      - "cluster_name"
      - "sink_status_label"
      - "replica_id"
    values:
      - "messages_committed"
      - "messages_staged"
    # mz_sink_statistics is keyed on (id, replica_id) and retains dropped-replica
    # rows for the same 24h as the source view above, so it needs the same
    # replica_id label and the same liveness filter.
    #
    # cluster_name was declared as a label but never selected; it is now joined
    # in through the sink's cluster.
    query: |
            SELECT
              S.id::TEXT as sink_id,
              S.name::TEXT as sink_name,
              S.type::TEXT as sink_type,
              C.name::TEXT as cluster_name,
              ST.status::TEXT as sink_status_label,
              COALESCE(SS.replica_id, '')::TEXT as replica_id,
              SS.messages_committed::FLOAT,
              SS.messages_staged::FLOAT
            FROM mz_internal.mz_sink_statistics SS
            JOIN mz_catalog.mz_sinks S ON (SS.id = S.id)
            JOIN mz_catalog.mz_clusters C ON (S.cluster_id = C.id)
            JOIN mz_internal.mz_sink_statuses ST ON (S.id = ST.id)
            WHERE
              SS.replica_id IS NULL
              OR EXISTS (
                SELECT 1 FROM mz_catalog.mz_cluster_replicas r WHERE r.id = SS.replica_id
              );
  - name: "query_latency"
    help: "Query latency"
    labels:
      - "cluster_name"
      - "replica_name"
      - "cluster_id"
      - "replica_id"
    values:
      - "max_latency"
      - "min_latency"
      - "avg_latency"
    query: |
            SELECT
              COALESCE(max(extract(epoch from MSEH.finished_at)::text::float * 1000 - extract(epoch from MSEH.began_at)::text::float * 1000)::text::float, 0.0) as max_latency,
              COALESCE(min(extract(epoch from MSEH.finished_at)::text::float * 1000 - extract(epoch from MSEH.began_at)::text::float * 1000)::text::float, 0.0) as min_latency,
              COALESCE(avg(extract(epoch from MSEH.finished_at)::text::float * 1000 - extract(epoch from MSEH.began_at)::text::float * 1000)::text::float, 0.0) as avg_latency,
              MSEH.cluster_name,
              MSEH.cluster_id,
              R.name as replica_name,
              R.id as replica_id
            FROM mz_catalog.mz_cluster_replicas as R
            JOIN mz_internal.mz_recent_activity_log_redacted as MSEH
              ON R.cluster_id = MSEH.cluster_id

            WHERE MSEH.began_at > now() - interval '1 min'
              AND MSEH.prepared_at > now() - interval '1 min'
              AND SUBSTRING(R.cluster_id, 1, 1) != 's'
            GROUP BY MSEH.cluster_name, MSEH.cluster_id, R.name, R.id;
  - name: "object_freshness"
    help: "Freshness"
    labels:
      - "object_name"
      - "object_type"
      - "object_id"
      - "cluster_name"
      - "cluster_id"
    values:
      - "lag_ms"
    query: |
            SELECT DISTINCT ON (L.object_id)
              L.object_id,
              O.name as object_name,
              O.type as object_type,
              COALESCE(C.name, '') as cluster_name,
              COALESCE(C.id, '') as cluster_id,
              COALESCE(EXTRACT(EPOCH FROM L.lag)::float * 1000, 0) as lag_ms
            FROM mz_internal.mz_wallclock_global_lag_recent_history L
            JOIN mz_catalog.mz_objects O ON L.object_id = O.id
            LEFT JOIN mz_catalog.mz_clusters C ON O.cluster_id = C.id
            -- Filter the system's catalog.
            WHERE substring(O.schema_id, 0, 2) != 's'
            ORDER BY L.object_id, L.occurred_at DESC;
