# console: nginx, with access lines on stdout and errors on stderr.
apiVersion: v1
kind: List
items:
  # Headless, so each pod is its own scrape target.
  - apiVersion: v1
    kind: Service
    metadata:
      name: bench-console
      labels:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: console
    spec:
      clusterIP: None
      selector:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: console
      ports:
        - name: metrics
          port: 6878
          targetPort: metrics
  # A StatefulSet, so a pod keeps its name across restarts, and with it the
  # seed that every identity it generates derives from.
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: bench-console
    spec:
      serviceName: bench-console
      replicas: 2
      podManagementPolicy: Parallel
      selector:
        matchLabels:
          app.kubernetes.io/name: mz-monitoring-benchmark
          app.kubernetes.io/component: console
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mz-monitoring-benchmark
            app.kubernetes.io/component: console
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            # Named for the role, because the gateway chooses its log parsing
            # (multiline panics, the JSON and text formats) by container name.
            - name: console
              image: mz-monitoring-benchmark
              args:
                - "gen-load"
                - "--role=console"
                - "--log-scenario=info=120,warn=2,error=1"
              ports:
                - name: metrics
                  containerPort: 6878
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: metrics
              resources:
                requests:
                  cpu: "50m"
                  memory: "32Mi"
                limits:
                  memory: "128Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: bench-console
      labels:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: console
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: mz-monitoring-benchmark
          app.kubernetes.io/component: console
      endpoints:
        - port: metrics
          path: /metrics
