# clusterd: one pod per replica of environmentd's 10 clusters, each holding a
# tenth of the collections, about 10,000 series per scrape.
apiVersion: v1
kind: List
items:
  # Headless, so each pod is its own scrape target.
  - apiVersion: v1
    kind: Service
    metadata:
      name: bench-clusterd
      labels:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: clusterd
    spec:
      clusterIP: None
      selector:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: clusterd
      ports:
        - name: metrics
          port: 6878
          targetPort: metrics
  # A StatefulSet, so a pod keeps its name across restarts, and with it the
  # seed that every identity it generates derives from.
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: bench-clusterd
    spec:
      serviceName: bench-clusterd
      replicas: 10
      podManagementPolicy: Parallel
      selector:
        matchLabels:
          app.kubernetes.io/name: mz-monitoring-benchmark
          app.kubernetes.io/component: clusterd
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mz-monitoring-benchmark
            app.kubernetes.io/component: clusterd
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            # Named for the role, because the gateway chooses its log parsing
            # (multiline panics, the JSON and text formats) by container name.
            - name: clusterd
              image: mz-monitoring-benchmark
              args:
                - "gen-load"
                - "--role=clusterd"
                - "--persist-shards=100"
                - "--collection-count=2500"
                - "--metric-scenario=dist=pulse180"
                - "--log-scenario=debug=500,info=2000,warn=200,error=20,panic-period=3600s"
              ports:
                - name: metrics
                  containerPort: 6878
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: metrics
              resources:
                requests:
                  cpu: "250m"
                  memory: "128Mi"
                limits:
                  memory: "512Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: bench-clusterd
      labels:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: clusterd
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: mz-monitoring-benchmark
          app.kubernetes.io/component: clusterd
      endpoints:
        - port: metrics
          path: /metrics
