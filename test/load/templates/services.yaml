{{/*
One headless Service per role, so each pod is its own scrape target.
*/}}
{{- range $role := include "mzmon.bench.roles" $ | fromJsonArray }}
  {{- $ctx := dict "root" $ "role" $role }}
  {{- if ( include "mzmon.bench.enabled" $ctx ) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mzmon.bench.name" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mzmon.bench.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "mzmon.bench.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: metrics
      port: 6878
      targetPort: metrics
  {{- end }}
{{- end }}
