# environmentd: one environment of 25,000 collections on 10 clusters, about
# 236,000 series and 24 MB per scrape across its five endpoints.
apiVersion: v1
kind: List
items:
  # Headless, so each pod is its own scrape target.
  - apiVersion: v1
    kind: Service
    metadata:
      name: bench-environmentd
      labels:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: environmentd
    spec:
      clusterIP: None
      selector:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: environmentd
      ports:
        - name: metrics
          port: 6878
          targetPort: metrics
  # A StatefulSet, so a pod keeps its name across restarts, and with it the
  # seed that every identity it generates derives from.
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: bench-environmentd
    spec:
      serviceName: bench-environmentd
      replicas: 1
      podManagementPolicy: Parallel
      selector:
        matchLabels:
          app.kubernetes.io/name: mz-monitoring-benchmark
          app.kubernetes.io/component: environmentd
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mz-monitoring-benchmark
            app.kubernetes.io/component: environmentd
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            # Named for the role, because the gateway chooses its log parsing
            # (multiline panics, the JSON and text formats) by container name.
            - name: environmentd
              image: mz-monitoring-benchmark
              args:
                - "gen-load"
                - "--role=environmentd"
                - "--persist-shards=1024"
                - "--collection-count=25000"
                - "--cluster-count=10"
                - "--metric-scenario=dist=pulse180,collection-grow=200"
                - "--log-scenario=info=5000,warn=1000,error=500,error-dist=bell,non-json=2,eicar=3,panic-period=1200s"
              ports:
                - name: metrics
                  containerPort: 6878
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: metrics
              resources:
                requests:
                  cpu: "1"
                  memory: "512Mi"
                limits:
                  memory: "2Gi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: bench-environmentd
      labels:
        app.kubernetes.io/name: mz-monitoring-benchmark
        app.kubernetes.io/component: environmentd
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: mz-monitoring-benchmark
          app.kubernetes.io/component: environmentd
      endpoints:
        - port: metrics
          path: /metrics
          # One scrape pool per path; without this their `up` series collide.
          relabelings:
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
        - port: metrics
          path: /metrics/mz_compute
          # One scrape pool per path; without this their `up` series collide.
          relabelings:
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
        - port: metrics
          path: /metrics/mz_frontier
          # One scrape pool per path; without this their `up` series collide.
          relabelings:
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
        - port: metrics
          path: /metrics/mz_storage
          # One scrape pool per path; without this their `up` series collide.
          relabelings:
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
        - port: metrics
          path: /metrics/mz_usage
          # One scrape pool per path; without this their `up` series collide.
          relabelings:
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
