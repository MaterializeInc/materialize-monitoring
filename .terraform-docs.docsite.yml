# terraform-docs config for the docsite variable reference.
#
# Separate from `.terraform-docs.yml` (which injects into module READMEs)
# because this one writes a whole Hugo page, front matter included, in replace
# mode. Both read the same `variables.tf`, so the two cannot disagree.
formatter: markdown

output:
  file: ../../../docs/content/reference/terraform/materialize-monitoring-variables.md
  mode: replace
  template: |-
    ---
    title: "Terraform variables"
    weight: 10
    ---

    <!--
    This file is automatically generated from
    `terraform/modules/materialize-monitoring/variables.tf` and
    `.terraform-docs.docsite.yml` by [terraform-docs](https://terraform-docs.io/).
    Do not edit it by hand.

    To update: edit the module's variables, then run
    `make docs/content/reference/terraform/materialize-monitoring-variables.md`.
    -->

    # Terraform variable reference

    Inputs and outputs of the common `materialize-monitoring` Terraform module.

    Most deployments do not set these directly — a per-cloud wrapper in
    [`materialize-terraform-self-managed`](https://github.com/MaterializeInc/materialize-terraform-self-managed)
    forwards the ones that matter and supplies the storage and identity inputs itself.
    See [Installing via Terraform](../../../getting-started/terraform/) for the
    variables you actually set in a `terraform.tfvars`.

    {{ .Content }}

content: |-
  {{ .Header }}

  ## Inputs

  <table class="tf-vars">
    <thead>
      <tr>
        <th>Variable</th>
        <th>Type</th>
        <th>Description</th>
        <th>Default / Schema</th>
      </tr>
    </thead>
    <tbody>
  {{- range .Module.Inputs }}
    {{- $slug := .Name }}
    {{- $schemaType := false }}
      <tr>
        <td class="tf-var-name"><a name="{{ $slug }}" href="#{{ $slug }}">{{ .Name | replace "_" "_<wbr>" }}</a></td>
        {{- if lt ( len .Type ) 20 }}
          <td class="tf-var-type"><code>{{ .Type }}</code></td>
        {{- else }}
          {{- $schemaType = true }}
          <td class="tf-var-type"><em>schema</em></td>
        {{- end }}
        <td class="tf-var-desc">{{ .Description }}</td>
        {{- if $schemaType }}
          <td class="tf-var-schema"><pre><code>{{ regexReplaceAll "\n[ \t]*\n" (printf "%s" .Type) "\n" }}</code></pre></td>
        {{- else }}
          <td class="tf-var-default"><code>{{ .Default }}</code></td>
        {{- end }}
      </tr>
  {{- end }}
    </tbody>
  </table>

  {{ .Outputs }}

sections:
  show:
    - inputs
    - outputs

sort:
  enabled: true
  by: required

settings:
  # terraform-docs escapes underscores by default for strict markdown. Hugo's
  # renderer keeps the backslash and URL-encodes it, so every in-page anchor
  # (`#input\_foo`) stops matching its target (`input_foo`). Off for the
  # docsite; the module READMEs keep the default, since GitHub handles it.
  escape: false
  html: false
