[package]
name = "mz-monitoring-check"
version = "0.1.0"
edition = "2024"

[dependencies]
mzmon-lib = { path = "../mzmon-lib" }
anyhow = "1"
# Loki's configuration is a Secret, not a ConfigMap, when static object-storage
# credentials are in play, and `helm template` writes a Secret's `data` encoded.
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
# The same harness `mz-monitoring-e2e` runs on, for the same reason: which
# render assertions apply depends on what each Terraform example declared, so
# the test list is built at runtime.
libtest-mimic = "0.8.2"
regex = "1"
serde_json = "1"
serde_yaml_ng = "0.10.0"
# Holds the plans and the value documents `helm template` reads with `-f`.
tempfile = "3"
