# Scrape materialize pods
# Environmentd has the following endpoints:
# - /metrics (prometheus metrics about environmentd itself)
# - /metrics/mz_compute (sql-based metrics for the mz_compute subsystem)
# - /metrics/mz_frontier (sql-based metrics for the mz_frontier subsystem)
# - /metrics/mz_storage (sql-based metrics for the mz_storage subsystem)
# - /metrics/mz_usage (sql-based metrics for the mz_usage subsystem)
# clusterd replicas have their own endpoint:
# - /metrics (prometheus metrics about clusterd itself)
apiVersion: monitoring.coreos.com/v1
# FIXME: switch to ServiceMonitor (can't distinguish by gen vs non-gen)
kind: PodMonitor
metadata:
  name: environmentd
  labels:
    app.kubernetes.io/part-of: materialize
    app.kubernetes.io/name: environmentd
spec:
  selector:
    matchLabels:
      # Added in v26.24.0
      # https://github.com/MaterializeInc/materialize/pull/36415
      app.kubernetes.io/name: environmentd
      # Before v26.24.0,
      # app: environmentd
  namespaceSelector:
    any: true
  # Pod labels copied onto scraped metrics (consumed by the dashboards).
  # Harmless on pods lacking a given label. Node-level labels (zone, instance
  # type, nodepool) are intentionally excluded — they are not pod labels.
  podTargetLabels:
    - materialize.cloud/organization-name
    - materialize.cloud/organization-namespace
    - materialize.cloud/organization-id
    - cluster.environmentd.materialize.cloud/cluster-id
    - cluster.environmentd.materialize.cloud/replica-id
  podMetricsEndpoints:
    - port: internal-http
      path: /metrics
      relabelings: []
      # Canonical label names from the label vocabulary (DEP-421). Each rule
      # copies an alias into its canonical name only where the canonical label
      # is empty, so a value Materialize emits under the canonical name is never
      # overwritten. Relabel regexes are fully anchored: "u1;u1" and ";" both
      # fail to match. The aliases stay until DEP-360 retires them.
      metricRelabelings:
        # `instance_id` is "none" on mz_time_to_first_row_seconds, so only a
        # cluster id is copied.
        - sourceLabels: [cluster_id, instance_id]
          separator: ";"
          regex: ";([su][0-9]+)"
          targetLabel: cluster_id
          replacement: "$1"
          action: replace
        - sourceLabels: [cluster_id, compute_instance]
          separator: ";"
          regex: ";([su][0-9]+)"
          targetLabel: cluster_id
          replacement: "$1"
          action: replace
        - sourceLabels: [collection_id, global_id]
          separator: ";"
          regex: ";(.+)"
          targetLabel: collection_id
          replacement: "$1"
          action: replace
        - sourceLabels: [shard_id, shard]
          separator: ";"
          regex: ";(.+)"
          targetLabel: shard_id
          replacement: "$1"
          action: replace
        # `name`, `type` and `size` mean other things on other families, such
        # as a persist shard's name, so these are scoped to the _info family.
        - sourceLabels: [__name__, cluster_name, name]
          separator: ";"
          regex: "mz_cluster_info;;(.+)"
          targetLabel: cluster_name
          replacement: "$1"
          action: replace
        - sourceLabels: [__name__, cluster_size, size]
          separator: ";"
          regex: "mz_cluster_info;;(.+)"
          targetLabel: cluster_size
          replacement: "$1"
          action: replace
        - sourceLabels: [__name__, replica_name, name]
          separator: ";"
          regex: "mz_replica_info;;(.+)"
          targetLabel: replica_name
          replacement: "$1"
          action: replace
        - sourceLabels: [__name__, replica_size, size]
          separator: ";"
          regex: "mz_replica_info;;(.+)"
          targetLabel: replica_size
          replacement: "$1"
          action: replace
        - sourceLabels: [__name__, object_name, name]
          separator: ";"
          regex: "mz_object_info;;(.+)"
          targetLabel: object_name
          replacement: "$1"
          action: replace
        - sourceLabels: [__name__, object_type, type]
          separator: ";"
          regex: "mz_object_info;;(.+)"
          targetLabel: object_type
          replacement: "$1"
          action: replace
