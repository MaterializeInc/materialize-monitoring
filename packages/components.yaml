# Layout of components for versioning and release management.

components:
  docs:
    changelog: false
    title: "materialize-monitoring Docs"
    version_paths: []
    content_paths:
      - docs/
    dependencies:
      - dashboards
      - pipelines
      - scrapers
      - materialize-monitoring
      - mzmon-lib
      - repo-common

  # Helm chart
  materialize-monitoring:
    changelog: true
    # Not "Helm Chart": this component is the materialize-monitoring *release*,
    # which ships two artifacts — the chart and the Terraform module that
    # installs it. One version stream covers both, so a module ref names the
    # chart version it deploys and there is no mapping to maintain between our
    # own two surfaces.
    #
    # The trade, accepted deliberately: a Terraform-only change publishes a
    # chart release identical to its predecessor except the version, and a
    # breaking module change bumps the chart's major. Both are handled in the
    # changelog rather than by splitting the stream.
    title: "materialize-monitoring (Helm chart + Terraform module)"
    version_paths:
      # The chart version is the release version. Terraform modules carry no
      # in-tree version file; they are versioned by the `<component>/vX.Y.Z`
      # tag, which this already produces.
      - charts/materialize-monitoring/Chart.yaml
    content_paths:
      - charts/materialize-monitoring/
      - terraform/
      - tools/chartlib/
    content_exclude:
      # Generated outputs; attributed to their source components (dashboards,
      # pipelines). pre-rendered/rules and pre-rendered/README are exempt until
      # they have a source component.
      - charts/materialize-monitoring/pre-rendered/
    dependencies:
      # Main content ones need to go first (to avoid ties in dependencies)
      #
      # **Not `dashboards`.** They moved to a chart of their own, so nothing this
      # chart ships comes from them and a dashboard change has no reason to bump
      # it. Left in, every dashboard edit would publish an umbrella release
      # identical to its predecessor except the version.
      - pipelines
      - scrapers
      # Common goes later
      - mzmon-lib
      - repo-common
    artifacts:
      # Anchored on the version digit rather than left open: `materialize-monitoring*`
      # also matches the `-crds` and `-dashboards` tarballs, which belong to other
      # components. In CI only one chart is packaged per run so the loose form
      # resolved to one file anyway, but a local `make charts` builds all three and
      # would attach the other two to this component's release.
      - charts/materialize-monitoring-[0-9]*.tgz

  # Optional CRDs
  materialize-monitoring-crds:
    changelog: true
    title: "materialize-monitoring Optional CRDs"
    version_paths:
      - charts/materialize-monitoring-crds/Chart.yaml
    content_paths:
      - charts/materialize-monitoring-crds/
      - tools/chartlib/
    dependencies:
      - repo-common
    artifacts:
      - charts/materialize-monitoring-crds-*.tgz

  # The dashboards: their sources, their rendered output, and the chart that
  # ships them — one component, because they are one thing.
  #
  # The chart could have had a component of its own, like the CRDs chart does.
  # It does not, because the coupling is total in a way the CRDs chart's is not:
  # this chart carries nothing *but* the rendered dashboards, so every change to
  # one is a change to the other and two version streams would move in lockstep
  # while pretending to be independent. The CRDs chart tracks upstream CRDs on
  # their own cadence, which is why that one is genuinely separate.
  dashboards:
    changelog: true
    # Retitled when the chart folded in, the same way `materialize-monitoring`
    # was when the Terraform module joined it.
    #
    # The title is the component's identity in `CHANGELOG.md` —
    # `latest_released` looks the component up by it — so a rename on its own
    # would orphan the released sections and the tooling would report the
    # component as brand new. What makes it safe is a paired edit in
    # `CHANGELOG.md`: the latest *released* heading is rewritten to the new
    # title, which re-establishes the baseline, and the open `(Unreleased)` one
    # with it so the section in flight is not duplicated. Older headings keep
    # the old title as the historical record.
    #
    # See `reference/internal/releasing.md` for the procedure.
    title: "Dashboards (Helm chart)"
    # The chart's version is the component's. `packages/dashboards` is a
    # workspace crate inheriting `version.workspace`, so it contributes no
    # version file of its own — the chart is the only one here.
    version_paths:
      - charts/materialize-monitoring-dashboards/Chart.yaml
    # The chart this component publishes. Read by the release workflow, which
    # would otherwise assume `charts/<component name>` and find nothing.
    chart: charts/materialize-monitoring-dashboards
    content_paths:
      - packages/queries/
      - packages/dashboards/
      # The chart, including the generated output under its `pre-rendered/`.
      # Not excluded the way the umbrella chart excludes its own: there the
      # generated tree belongs to another component, here it belongs to this one.
      - charts/materialize-monitoring-dashboards/
      - tools/chartlib/
    dependencies:
      - mzmon-lib
      - repo-common
    artifacts:
      - charts/materialize-monitoring-dashboards-*.tgz
      - charts/materialize-monitoring-dashboards/pre-rendered/dashboards/**/*.yaml
      - docs/assets/dashboards/**/*.json

  pipelines:
    changelog: true
    title: "Pipelines"
    version_paths: []
    content_paths:
      - packages/alloy-pipelines/
      - packages/queries/
      # Generated pipeline output bundled into the chart.
      - charts/materialize-monitoring/pre-rendered/pipelines/
      - charts/materialize-monitoring/pre-rendered/metrics/
    artifacts:
      - charts/materialize-monitoring/pre-rendered/metrics/**/*.yaml
      - charts/materialize-monitoring/pre-rendered/pipelines/**/*.alloy
    dependencies:
      - mzmon-lib
      - repo-common

  scrapers:
    changelog: true
    title: "Prometheus Scrapers"
    version_paths: []
    content_paths:
      - packages/prometheus-scrapers/
    dependencies:
      - mzmon-lib
      - repo-common
    artifacts:
      - charts/materialize-monitoring/pre-rendered/scrapers/

  # Docker images
  container-images:
    changelog: true
    title: "Container Images"
    version_paths: []
    content_paths:
      - packages/alloy/
    dependencies:
      - repo-common

  mzmon-lib:
    changelog: true
    title: "mzmon-lib (shared library)"
    version_paths:
      - Cargo.toml
      - pyproject.toml
    content_paths:
      # python shared
      - .python-version
      - pyproject.toml
      - uv.lock
      # rust shared
      - Cargo.lock
      - Cargo.toml
      # packages
      - packages/mz-monitoring-build/
      - packages/mz-monitoring-check/
      - packages/mzmon-lib/
    dependencies:
      - repo-common

  repo-common:
    changelog: false
    title: "Repository Common"
    version_paths: []
    content_paths:
      # go shared
      - go.mod
      - go.sum
      # build common
      - .github/workflows
      - .gitignore
      - bin
      - Makefile
      - packages/components.yaml
      - tools/shlib
