# Layout of components for versioning and release management.

components:
  docs:
    changelog: false
    title: "materialize-monitoring Docs"
    version_paths: []
    content_paths:
      - docs/
    dependencies:
      - dashboards
      - pipelines
      - scrapers
      - materialize-monitoring
      - mzmon-lib
      - repo-common

  # Helm chart
  materialize-monitoring:
    changelog: true
    # Not "Helm Chart": this component is the materialize-monitoring *release*,
    # which ships two artifacts — the chart and the Terraform module that
    # installs it. One version stream covers both, so a module ref names the
    # chart version it deploys and there is no mapping to maintain between our
    # own two surfaces.
    #
    # The trade, accepted deliberately: a Terraform-only change publishes a
    # chart release identical to its predecessor except the version, and a
    # breaking module change bumps the chart's major. Both are handled in the
    # changelog rather than by splitting the stream.
    title: "materialize-monitoring (Helm chart + Terraform module)"
    version_paths:
      # The chart version is the release version. Terraform modules carry no
      # in-tree version file; they are versioned by the `<component>/vX.Y.Z`
      # tag, which this already produces.
      - charts/materialize-monitoring/Chart.yaml
    content_paths:
      - charts/materialize-monitoring/
      - terraform/
      - tools/chartlib/
    content_exclude:
      # Generated outputs; attributed to their source components (dashboards,
      # pipelines). pre-rendered/rules and pre-rendered/README are exempt until
      # they have a source component.
      - charts/materialize-monitoring/pre-rendered/
    dependencies:
      # Main content ones need to go first (to avoid ties in dependencies)
      - dashboards
      - pipelines
      - scrapers
      # Common goes later
      - mzmon-lib
      - repo-common
    artifacts:
      - charts/materialize-monitoring*.tgz

  # Optional CRDs
  materialize-monitoring-crds:
    changelog: true
    title: "materialize-monitoring Optional CRDs"
    version_paths:
      - charts/materialize-monitoring-crds/Chart.yaml
    content_paths:
      - charts/materialize-monitoring-crds/
      - tools/chartlib/
    dependencies:
      - repo-common
    artifacts:
      - charts/materialize-monitoring-crds-*.tgz

  dashboards:
    changelog: true
    title: "Dashboards"
    # No independent version: `packages/dashboards` is a workspace crate that
    # inherits `version.workspace`, so the workspace `Cargo.toml` the `mzmon-lib`
    # component bumps is the only version file involved. The generated-artifact
    # components (pipelines, scrapers) are the same shape.
    version_paths: []
    content_paths:
      - packages/queries/
      - packages/dashboards/
      # Generated dashboard output bundled into the chart.
      - charts/materialize-monitoring/pre-rendered/dashboards/
    dependencies:
      - mzmon-lib
      - repo-common
    artifacts:
      - charts/materialize-monitoring/pre-rendered/dashboards/**/*.yaml
      - docs/assets/dashboards/**/*.json

  pipelines:
    changelog: true
    title: "Pipelines"
    version_paths: []
    content_paths:
      - packages/alloy-pipelines/
      - packages/queries/
      # Generated pipeline output bundled into the chart.
      - charts/materialize-monitoring/pre-rendered/pipelines/
      - charts/materialize-monitoring/pre-rendered/metrics/
    artifacts:
      - charts/materialize-monitoring/pre-rendered/metrics/**/*.yaml
      - charts/materialize-monitoring/pre-rendered/pipelines/**/*.alloy
    dependencies:
      - mzmon-lib
      - repo-common

  scrapers:
    changelog: true
    title: "Prometheus Scrapers"
    version_paths: []
    content_paths:
      - packages/prometheus-scrapers/
    dependencies:
      - mzmon-lib
      - repo-common
    artifacts:
      - charts/materialize-monitoring/pre-rendered/scrapers/

  # Docker images
  container-images:
    changelog: true
    title: "Container Images"
    version_paths: []
    content_paths:
      - packages/alloy/
    dependencies:
      - repo-common

  mzmon-lib:
    changelog: true
    title: "mzmon-lib (shared library)"
    version_paths:
      - Cargo.toml
      - pyproject.toml
    content_paths:
      # python shared
      - .python-version
      - pyproject.toml
      - uv.lock
      # rust shared
      - Cargo.lock
      - Cargo.toml
      # packages
      - packages/mz-monitoring-build/
      - packages/mz-monitoring-check/
      - packages/mzmon-lib/
    dependencies:
      - repo-common

  repo-common:
    changelog: false
    title: "Repository Common"
    version_paths: []
    content_paths:
      # go shared
      - go.mod
      - go.sum
      # build common
      - .github/workflows
      - .gitignore
      - bin
      - Makefile
      - packages/components.yaml
      - tools/shlib
