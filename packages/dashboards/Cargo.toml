[package]
name = "mz-dashboards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Datadog's official client, for its dashboard models only. The client half is
# never called; rustls keeps it off native-tls, matching mz-monitoring-build.
datadog-api-client = { version = "0.38", default-features = false, features = ["rustls-tls"] }
mzmon-lib = { path = "../mzmon-lib" }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The type of a Datadog dashboard tab's id, already built by datadog-api-client.
uuid = "1"
