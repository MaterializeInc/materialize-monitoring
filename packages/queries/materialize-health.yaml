# yaml-language-server: $schema=../mzmon-lib/schemas/query/mzmon-query.schema.yaml
# Health checking queries

description: |
  Common queries for checking the health of a Materialize deployment.

metricImportanceHint: recommended

queries:
  - id: materialize.scraper.mzmon.environmentd
    stability: best-effort
    description:
      summary: |
        environmentd metrics are reaching the gateway. If this goes to 0 or
        disappears, every environmentd-backed panel and alert for the
        environment is blind — the environment may be perfectly healthy and you
        simply can't see it, so rule this out first.
      unhealthy: |
        The gateway isn't scraping environmentd. Confirm the PodMonitor is
        installed and the gateway's scrape target is up before trusting (or
        distrusting) any other environmentd signal.
      notes: |
        best-effort rather than canonical: the job label pins the `monitoring`
        namespace, which we don't want to hard-require of every deployment.
    promQL: |
      up{
        job="monitoring/mzmon-materialize-environmentd",
        %%{mzEnvironmentNamespaceFilter}
      } == 1
    datadogQuery: |
      avg:up{job:monitoring/mzmon-materialize-environmentd, %%{mzEnvironmentNamespaceFilter}}
  - id: materialize.scraper.mzmon.clusterd
    stability: best-effort
    description:
      summary: |
        clusterd (compute replica) metrics are reaching the gateway. When this
        drops, per-cluster compute signals — arrangements, peeks, dataflows —
        go dark even though the replicas may still be serving.
      unhealthy: |
        The gateway isn't scraping clusterd. A replica that was just recreated
        can take a scrape or two to reappear; a persistent gap points at the
        PodMonitor or the gateway target.
      notes: |
        best-effort rather than canonical: the job label pins the `monitoring`
        namespace, which we don't want to hard-require of every deployment.
    promQL: |
      up{
        job="monitoring/mzmon-materialize-clusterd",
        %%{mzEnvironmentNamespaceFilter}
      } == 1
    datadogQuery: |
      avg:up{job:monitoring/mzmon-materialize-clusterd, %%{mzEnvironmentNamespaceFilter}}
  - id: materialize.scraper.mzmon.orchestratord
    stability: best-effort
    description:
      summary: |
        The Materialize operator (orchestratord) is being scraped. Losing it
        blinds you to cluster and replica lifecycle — creation, resize, and
        rollout progress — not to the running workloads themselves.
    promQL: |
      up{
        job="materialize/mzmon-materialize-operator",
        %%{mzOperatorNamespaceFilter}
      } == 1
    datadogQuery: |
      avg:up{job:materialize/mzmon-materialize-operator, %%{mzOperatorNamespaceFilter}}
  - id: materialize.health.clusters.status.percentage
    stability: best-effort
    description:
      summary: |
        The share of the environment's clusters currently reporting ready —
        the at-a-glance health headline for the whole environment.
      nominal: Every cluster is ready.
      degraded: |
        Some clusters aren't ready, but most are. Usually a rollout in flight —
        replicas cycling during an upgrade or resize — rather than a real
        outage. Find which clusters are affected before reacting; a brief dip
        during a known change is expected.
      unhealthy: |
        A large fraction of clusters are down and not recovering on their own.
        Check pod restart history and narrow to the specific clusters and
        replicas involved; this is an outage, not a rollout.
      notes: |
        The healthy/degraded/unhealthy bands (100% / 80-100% / <80%) are set by
        the consuming dashboard, not by this query.
    promQL: |
      count(
        %%{mzSqlPrefix}compute_cluster_status{
          %%{mzEnvironmentFilter}
        } == 1
      ) / count(
        %%{mzSqlPrefix}compute_cluster_status{
          %%{mzEnvironmentFilter}
        }
      ) * 100
    datadogQuery: |
      avg:%%{mzSqlPrefix}compute_cluster_status{%%{mzEnvironmentFilter}} * 100
  # --- alerts --------------------------------------------------------------
  # Every alert whose `namespace` is one of the selected environments', whoever
  # wrote the rule: the Materialize rules, the workload rules, and the platform
  # rules about the pods there. An alert about every environment at once, such
  # as `environmentd-not-scraped`, carries no namespace and is not drawn. No
  # Datadog form: Datadog alerts are monitors, not a series.
  - id: materialize.health.alerts_firing
    stability: experimental
    description:
      summary: |
        Alerts about the environment that are firing now.
      nominal: Zero.
      unhealthy: |
        Any. _Alerts_ below names each one, and links to what it means.
      notes: |
        Reads zero only while the Thanos ruler has evaluated a rule and written
        its results back within five minutes, and so has the Loki ruler where
        one runs. A ruler that has stopped evaluating fires nothing, and one
        whose write-back has stalled fires alerts that never reach Thanos, so
        either would read as no alerts. An empty reading means the alert path
        itself needs checking, on the Thanos Meta Monitoring dashboard's Ruler
        tab.
    promQL: |
      count(
        max without (ruler_replica) (
          ALERTS{namespace=~"%%{mzNamespaceList}", alertstate="firing"}
        )
      )
      or
      0 * (
        (
          (
            time()
            - max(
              prometheus_rule_group_last_evaluation_timestamp_seconds{
                app="thanos",
                container="ruler"
              }
            )
            < 300
          )
          and on ()
          (
            min(
              max by (pod) (
                prometheus_remote_storage_highest_timestamp_in_seconds{
                  app="thanos",
                  container="ruler"
                }
              )
              - on (pod)
              max by (pod) (
                prometheus_remote_storage_queue_highest_sent_timestamp_seconds{
                  app="thanos",
                  container="ruler"
                }
              )
            )
            < 300
          )
        )
        unless on ()
        (
          (
            time()
            - max(
              loki_prometheus_rule_group_last_evaluation_timestamp_seconds{
                app="loki",
                container="ruler"
              }
            )
            >= 300
          )
          or on ()
          (
            max(
              max by (pod, tenant) (
                loki_ruler_wal_prometheus_remote_storage_highest_timestamp_in_seconds{
                  app="loki",
                  container="ruler"
                }
              )
              - on (pod, tenant)
              max by (pod, tenant) (
                loki_ruler_wal_prometheus_remote_storage_queue_highest_sent_timestamp_seconds{
                  app="loki",
                  container="ruler"
                }
              )
            )
            >= 300
          )
        )
      )

  - id: materialize.health.alerts
    stability: experimental
    description:
      summary: |
        Every alert about the environment that is firing or pending now, with
        the cluster or pod it is about.
      nominal: Empty.
      unhealthy: |
        Any firing row. A pending row has met its condition and is waiting out
        its `for` duration; it fires if the condition holds.
      notes: |
        `ALERTS` carries a rule's labels and not its annotations, so the
        summary and the advice are a click away: each alert name links to its
        entry under Common Alerts. `component` says which part of the
        environment the rule watches, and `audience` is left out: it says who a
        notification goes to, not what is wrong.

        Rows are matched by namespace, so where two environments share one, an
        alert about either shows under both. A rule that groups by environment
        names it in the `environment` column.
    instant: true
    promQL: |
      max without (ruler_replica, instance, tenant_id, cluster, audience) (
        label_replace(
          ALERTS{namespace=~"%%{mzNamespaceList}"},
          "job", "", "job", "thanos-ruler|loki-ruler"
        )
      )

  - id: materialize.health.alert_history
    stability: experimental
    description:
      summary: |
        Which alerts about the environment were firing over the selected time
        range.
      nominal: Empty.
      notes: |
        A line is the number of firing instances of that alert. Read it beside
        the tab that alert is about to see what changed when it started.
    promQL: |
      count by (alertname) (
        max without (ruler_replica) (
          ALERTS{namespace=~"%%{mzNamespaceList}", alertstate="firing"}
        )
      )

  - id: materialize.health.environment.availability.percentage
    stability: best-effort
    description:
      summary: |
        An SLO-style snapshot: how much of the selected window the
        environment's clusters were ready. Sustained dips are the signal that
        something restarted or went down while you weren't watching.
      nominal: |
        At or near full availability. Watch the decimals — 99.999% is
        five-nines, a very different story from 100%.
      degraded: |
        Availability slipped below target over the window. Correlate the dip
        with cluster restarts and outages; widen the range to pin down when it
        happened, then work backwards from there.
      notes: |
        Four-nines is about the ceiling this can measure: at a 30s scrape
        resolution over a week, a single missed scrape already costs a nine, so
        don't chase phantom sub-nine dips that are really scrape granularity.
    promQL: |
      avg by (materialize_cloud_organization_namespace) (
        avg_over_time(
          %%{mzSqlPrefix}compute_cluster_status{
            %%{mzEnvironmentFilter}
          }%%{range}
        ) * 100
      )
    datadogQuery: |
      avg:%%{mzSqlPrefix}compute_cluster_status{%%{mzEnvironmentFilter}}
        by {materialize_cloud_organization_namespace}.rollup(avg, %%{range}) * 100
  - id: materialize.info.version
    stability: best-effort
    description:
      summary: |
        The version of Materialize running in the environment. A single version
        is the steady state; multiple values appear briefly during a rolling
        upgrade.
      notes: |
        The presentation layer extracts the commit hash from the `mz_version`
        label (e.g. to link the commit). If the version isn't what you expect,
        check the environment's manifest in the deployment pipeline.
    promQL: |
      group by (mz_version) (
        %%{mzSqlPrefix}compute_cluster_status{%%{mzEnvironmentFilter}}
      )
    datadogQuery: |
      avg:%%{mzSqlPrefix}compute_cluster_status{%%{mzEnvironmentFilter}} by {mz_version}
    instant: true
  # The subquery window comes from `rangeWindow`, the bare (unbracketed) range:
  # `range` renders a bracketed range-vector, which is not a subquery step. In a
  # dashboard this follows the panel's own time picker; extraction sees a fixed
  # window. The Datadog form below uses its own rollup rather than a subquery.
  - id: materialize.info.max_lag
    stability: best-effort
    description:
      summary: |
        The worst freshness seen anywhere in the environment over the
        selected window — how far the most-behind object's output trailed
        real time. A top-level freshness pointer.
      degraded: |
        Climbing toward an hour means some object is falling behind; drill
        into per-cluster and per-object freshness to find which, and into
        hydration / source health for why.
      notes: |
        Not-yet-hydrated objects are excluded (they report the sentinel and
        surface as "currently hydrating"). This is the peak over the window, so
        it reflects the worst moment rather than the current value.
    promQL: |
      max(
        max_over_time(
          (
            mz_dataflow_wallclock_lag_seconds{%%{mzEnvironmentFilter}, instance_id!="", quantile="1"} < 1e9
          )[%%{rangeWindow}:1m]
        )
      )
    datadogQuery: |
      max:mz_dataflow_wallclock_lag_seconds{%%{mzEnvironmentFilter}, quantile:1}.rollup(max, 3600)
    instant: true
