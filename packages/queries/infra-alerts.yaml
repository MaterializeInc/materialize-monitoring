        ) > 0

  # --- Infra pod health ----------------------------------------------------
  - alert: k8s-infra-pod-pending-too-long
    group: infra_pod_health
    stability: best-effort
    for: 15m
    labels:
      severity: warning
      component: kubernetes
    description:
      summary: An infra pod has been Pending for 15m — the cluster may be unhealthy or out of capacity.
    query:
      id: infra.kubernetes.infra_pod_pending
      stability: best-effort
      description:
        summary: Non-environment pods stuck in Pending.
      promQL: |
        max by (namespace, pod) (
          kube_pod_status_phase{namespace!~"environment.*", phase="Pending"}
        ) > 0
  - alert: pod-restart-rate-high
    group: infra_pod_health
    stability: best-effort
    for: 15m
    labels:
      severity: warning
      component: kubernetes
    description:
      summary: An important infra container is restarting frequently, which may indicate a crash loop.
    query:
      id: infra.kubernetes.pod_restart_rate_high
      stability: best-effort
      description:
        summary: Restart rate of important infra containers.
      promQL: |
        avg by (container, namespace) (
          rate(kube_pod_container_status_restarts_total{namespace!~"environment.*", container!~"awslimitchecker|backend|egress-check.*|egress-noop.*|exporter|external-uptime-checker|frontend|hubble-ui|loki.*|memcached|metrics-proxy|nginx|overprovisioning-placeholder|pause|polarsignals-scraper|tbot|teleport|cert-manager-csi-driver|lvm-exporter|parca-agent|vector"}[10m])
        ) * 100 > 0
  - alert: pod-restart-rate-high-nonessential
    group: infra_pod_health
    stability: best-effort
    for: 15m
    labels:
      severity: notice
      component: kubernetes
    description:
      summary: A non-essential infra container is restarting frequently, which may indicate a crash loop.
    query:
      id: infra.kubernetes.pod_restart_rate_high_nonessential
      stability: best-effort
      description:
        summary: Restart rate of non-essential infra containers.
      promQL: |
        avg by (container, namespace) (
          rate(kube_pod_container_status_restarts_total{container=~"awslimitchecker|backend|egress-check.*|egress-noop.*|exporter|external-uptime-checker|frontend|hubble-ui|loki.*|memcached|metrics-proxy|nginx|overprovisioning-placeholder|pause|polarsignals-scraper|tbot|teleport|cert-manager-csi-driver|lvm-exporter|parca-agent|vector"}[10m])
        ) * 100 > 0
  - alert: pods-stuck-in-waiting
    group: infra_pod_health
    stability: best-effort
    for: 1m
    labels:
      severity: notice
      component: kubernetes
    description:
      summary: A pod has been stuck in Waiting for over 10m, which can indicate a scheduling or resource problem.
    query:
      id: infra.kubernetes.pods_stuck_in_waiting
      stability: best-effort
      description:
        summary: Pods in a Waiting state for longer than 10 minutes.
      promQL: |
        sum by (namespace, pod) (
          kube_pod_container_status_waiting == 1
          and time() - kube_pod_start_time > 10 * 60
        ) > 0

  # --- Egress gateway ------------------------------------------------------
  # Each expression restricts node network throughput to egress-gateway nodes via
  # a join against the materialize-egress workload. The `^ 0` normalizes that
  # join series to 1 so it acts purely as a node filter + workload-label attach,
  # not a multiplier.
  - alert: egress-traffic-missing-metrics
    group: egress_gateway
    stability: best-effort
    for: 5m
    labels:
      severity: warning
      component: egress-gateway
    description:
      summary: Egress-gateway node throughput metrics are missing, which may indicate an egress-gateway problem.
    query:
      id: infra.egress_gateway.traffic_missing_metrics
      stability: best-effort
      description:
        summary: Absence of receive-throughput series for egress-gateway nodes.
      promQL: |
        absent(
          sum by (node) (
            rate(node_network_receive_bytes_total{device="eth0"}[2m])
          )
          * on (node) group_left (workload) sum by (node, workload) (
            label_replace(container_network_receive_bytes_total{workload="materialize-egress"}, "node", "$1", "instance", "(.+)")
          ) ^ 0
        )
  - alert: excessive-egress-traffic
    group: egress_gateway
    stability: best-effort
    for: 20m
    labels:
      severity: warning
      component: egress-gateway
    description:
      summary: An egress-gateway node has very high traffic, which may indicate traffic is not routing through the internet gateway.
    query:
      id: infra.egress_gateway.excessive_traffic
      stability: best-effort
      description:
        summary: Receive throughput (bytes/s) on egress-gateway nodes, above 5.5 Gbit/s.
      promQL: |
        sum by (node) (
          rate(node_network_receive_bytes_total{device="eth0"}[2m])
        )
        * on (node) group_left (workload) sum by (node, workload) (
          label_replace(container_network_receive_bytes_total{workload="materialize-egress"}, "node", "$1", "instance", "(.+)")
        ) ^ 0
        > 5.5 * 1000 * 1000 * 1000 / 8
  - alert: high-egress-traffic
    group: egress_gateway
    stability: best-effort
    for: 20m
    labels:
      severity: notice
      component: egress-gateway
    description:
      summary: An egress-gateway node is above 90% of its allowed traffic and may soon exceed capacity.
    query:
      id: infra.egress_gateway.high_traffic
      stability: best-effort
      description:
        summary: Receive throughput (bytes/s) on egress-gateway nodes, above 4.5 Gbit/s.
      promQL: |
        sum by (node) (
          rate(node_network_receive_bytes_total{device="eth0"}[2m])
        )
        * on (node) group_left (workload) sum by (node, workload) (
          label_replace(container_network_receive_bytes_total{workload="materialize-egress"}, "node", "$1", "instance", "(.+)")
        ) ^ 0
        > 4.5 * 1000 * 1000 * 1000 / 8
  - alert: low-egress-traffic
    group: egress_gateway
    stability: best-effort
    for: 2m
    labels:
      severity: warning
      component: egress-gateway
    description:
      summary: An egress-gateway node has unusually low traffic, which may indicate the gateway is unhealthy.
    query:
      id: infra.egress_gateway.low_traffic
      stability: best-effort
      description:
        summary: Receive throughput (bytes/s) on egress-gateway nodes, below 100 bytes/s.
      promQL: |
        sum by (node) (
          rate(node_network_receive_bytes_total{device="eth0"}[2m])
        )
        * on (node) group_left (workload) sum by (node, workload) (
          label_replace(container_network_receive_bytes_total{workload="materialize-egress"}, "node", "$1", "instance", "(.+)")
        ) ^ 0
        < 100
  - alert: no-egress-traffic
    group: egress_gateway
    stability: best-effort
    for: 5m
    labels:
      severity: warning
      component: egress-gateway
    description:
      summary: An egress-gateway node has had no traffic for 5m, which may indicate external traffic is blocked.
    query:
      id: infra.egress_gateway.no_traffic
      stability: best-effort
      description:
        summary: Egress-gateway nodes with zero receive/transmit throughput.
      promQL: |
        (
          min by (node) (
            rate(node_network_receive_bytes_total{device="eth0"}[5m:1m])
            or rate(node_network_transmit_bytes_total{device="eth0"}[5m:1m])
          )
          and on (node) kubelet_node_name{workload="materialize-egress"}
        ) == 0
