# yaml-language-server: $schema=../mzmon-lib/schemas/query/mzmon-query.schema.yaml
# Karpenter: how it adds, replaces and removes the cluster's nodes on EKS.

description: |
  Karpenter's own account of provisioning and disruption, from the metrics its
  controller publishes and the events it records. Infrastructure Autoscaling
  reads these on its Karpenter rows and its Karpenter tab, beside the
  cloud-agnostic queries in `infra-autoscaling.yaml`.

  Karpenter adds nodes on EKS in the self-managed Terraform: it watches for
  pods the scheduler cannot place, launches an EC2 instance that fits them,
  and later removes or replaces nodes that are empty, underused, drifted from
  their NodePool's spec, or being interrupted by AWS. Everything it does to a
  node goes through a NodeClaim, one per instance.

  The controller runs two replicas and only the leader does any work, so most
  families here come from one pod. Counters restart on a leader change; every
  query reads them through `rate` or `increase`, which tolerates that.

  ## Scrape
  The chart's ServiceMonitor is enabled by the Terraform's `karpenter` module.
  It drops the offering price estimates and per-instance-type CPU and memory,
  which describe every instance type in the region rather than the cluster,
  and keeps offering availability only for the node pools' instance types.
  Karpenter's generic families (`controller_runtime_*`, `workqueue_*`,
  `client_go_*`, `aws_sdk_go_*`) carry no `karpenter_` prefix, so they are
  scoped by `app="karpenter"`, which the gateway sets from the pod's name label.

  ## Names ending in `_count`
  `karpenter_scheduler_unschedulable_pods_count` and the
  `operator_*_status_condition_count` families are gauges, not the counts of a
  histogram.

  ## Rare events
  Karpenter launches and removes nodes a few times a day at most, and between
  those its counters and histograms stand still. So what it did is read over
  the selected time range, as a count or a percentile, rather than as a rate
  that is zero but for a spike. When it happened is in the events, which
  `infra-autoscaling.yaml` reads. Percentiles are wrapped in `>= 0`, which
  drops the `NaN` a histogram with nothing in it returns, so the panel shows
  its empty state instead.

metricImportanceHint: extended

queries:
  # --- Overview: the verdict ----------------------------------------------------
  - id: infra.karpenter.health.nodepools_not_ready
    stability: experimental
    description:
      summary: NodePools that are not Ready.
      nominal: Zero.
      unhealthy: |
        A NodePool that is not Ready launches nothing. _Karpenter NodePools_,
        on the Node Pools tab, lists the condition that is false: usually its
        EC2NodeClass cannot find an AMI, subnet or security group, or
        `NodeRegistrationHealthy` is false because the nodes it launched never
        joined the cluster.
    promQL: |
      count(
        max by (name) (operator_nodepool_status_condition_count{type="Ready", status!="True"}) == 1
      )
      or 0 * count(max by (name) (operator_nodepool_status_condition_count{type="Ready"}))
    datadogQuery: |
      default_zero(
        count_nonzero(
          max:operator_nodepool_status_condition_count{type:ready AND NOT status:true} by {name}
        )
      )

  - id: infra.karpenter.health.pods_unplaceable
    stability: experimental
    description:
      summary: |
        Pods Karpenter could not find or create a node for in its last
        scheduling pass.
      nominal: Zero.
      unhealthy: |
        Non-zero for more than a pass or two: no NodePool can hold these pods.
        Their node selectors, affinities or tolerations match no pool, a pool
        is at its limits, or no instance type in the pool is big enough. The
        pods' `FailedScheduling` events, on the Pending Pods tab, name the
        constraint.
    promQL: |
      max(karpenter_scheduler_unschedulable_pods_count{controller="provisioner"})
    datadogQuery: |
      max:karpenter_scheduler_unschedulable_pods_count{controller:provisioner}

  - id: infra.karpenter.health.launch_errors
    stability: experimental
    description:
      summary: Instance launches EC2 refused in the selected time range.
      nominal: Zero.
      unhealthy: |
        Any. Karpenter retries with another instance type or zone where the
        NodePool allows one; a NodePool with a single instance type, like the
        Terraform examples' Materialize pool, has nowhere else to go.
        _EC2 Errors_, on the Cloud Capacity tab, says whether it was capacity,
        quota or a configuration problem.
    promQL: |
      sum(increase(karpenter_cloudprovider_errors_total{method="Create"}%%{range}))
      or 0 * max(karpenter_build_info)
    datadogQuery: |
      default_zero(sum:karpenter_cloudprovider_errors_total{method:create}.as_count())
    instant: true

  - id: infra.karpenter.health.synced
    stability: experimental
    description:
      summary: |
        Whether Karpenter's view of the cluster's nodes and pods is in step
        with Kubernetes.
      nominal: 1, synced.
      unhealthy: |
        0 for more than a few seconds. Karpenter makes no scheduling or
        disruption decision until it is back in step, so pods wait and nodes
        are not removed. Usually an API server problem; the Karpenter tab's
        Controller row has the error rates.
    promQL: |
      max(karpenter_cluster_state_synced)
    datadogQuery: |
      max:karpenter_cluster_state_synced{*}

  - id: infra.karpenter.health.version
    stability: experimental
    description:
      summary: The Karpenter version running.
    promQL: |
      max by (version) (karpenter_build_info)
    datadogQuery: |
      max:karpenter_build_info{*} by {version}
    instant: true

  # --- Node Pools -----------------------------------------------------------------
  - id: infra.karpenter.nodepools
    stability: experimental
    description:
      summary: |
        Each NodePool's nodes, the CPU and memory they provide against the
        NodePool's limits, and how many nodes its disruption budget allows
        removing right now.
      degraded: |
        CPU or memory at its limit: the NodePool launches nothing more, and
        pods that need it wait. Raise the limit in the NodePool's `limits`.
      notes: |
        Every column but the limits and the budget is the NodePool's own
        `status.resources`, which Karpenter publishes for every NodePool from a
        base of zero, so a pool with no nodes reads 0 rather than going
        missing. A NodePool that sets no limit, as the Terraform examples' do
        not, has no limit to draw. The disruption budget is per reason, and the
        column is the fewest any reason allows; zero is a budget that allows
        none at the moment, by design or because nodes are already being
        disrupted.
    promQL:
      - |
        max by (nodepool) (karpenter_nodepools_usage{resource_type="nodes"})
      - |
        max by (nodepool) (karpenter_nodepools_usage{resource_type="cpu"})
      - |
        max by (nodepool) (karpenter_nodepools_limit{resource_type="cpu"})
      - |
        max by (nodepool) (karpenter_nodepools_usage{resource_type="memory"})
      - |
        max by (nodepool) (karpenter_nodepools_limit{resource_type="memory"})
      - |
        min by (nodepool) (karpenter_nodepools_allowed_disruptions)
    datadogQuery:
      - |
        max:karpenter_nodepools_usage{resource_type:nodes} by {nodepool}
      - |
        max:karpenter_nodepools_usage{resource_type:cpu} by {nodepool}
      - |
        max:karpenter_nodepools_limit{resource_type:cpu} by {nodepool}
      - |
        max:karpenter_nodepools_usage{resource_type:memory} by {nodepool}
      - |
        max:karpenter_nodepools_limit{resource_type:memory} by {nodepool}
      - |
        min:karpenter_nodepools_allowed_disruptions{*} by {nodepool}
    instant: true

  - id: infra.karpenter.conditions
    stability: experimental
    description:
      summary: |
        Every NodePool and EC2NodeClass condition that is False, and its
        reason.
      nominal: Empty.
      unhealthy: |
        Any row. On an EC2NodeClass, `AMIsReady`, `SubnetsReady`,
        `SecurityGroupsReady` or `InstanceProfileReady` false means Karpenter
        cannot build a launch request at all. On a NodePool,
        `NodeRegistrationHealthy` false means instances launched but did not
        join the cluster.
      notes: |
        Unknown is left out. Karpenter reports `NodeRegistrationHealthy`
        Unknown until a NodePool's first node joins after the pool last
        changed, which for a pool that rarely launches is most of the time. A
        NodePool whose `Ready` is Unknown still counts in _NodePools Not
        Ready_.
    promQL: |
      max by (kind, name, type, reason) (
        operator_status_condition_count{kind=~"NodePool|EC2NodeClass", status="False"}
      ) == 1
    datadogQuery: |
      cutoff_min(
        max:operator_status_condition_count{kind IN (nodepool,ec2nodeclass) AND status:false}
          by {kind,name,type,reason},
        1
      )
    instant: true

  # --- Pending Pods: how long a launch took ---------------------------------------
  - id: infra.karpenter.provisioning.stages
    stability: experimental
    description:
      summary: |
        How long NodeClaims took to reach each stage of launching, at the 99th
        percentile over the selected time range.
      notes: |
        `Launched` is EC2 accepting the request, `Registered` the node joining
        the cluster, and `Initialized` the node Ready with its startup taints
        removed. A slow `Registered` is usually the node's bootstrap; a
        missing one is a node that never joined.
    promQL:
      - |
        histogram_quantile(0.99,
          sum by (le) (increase(operator_nodeclaim_status_condition_transition_seconds_bucket{type="Launched"}%%{range}))
        ) >= 0
      - |
        histogram_quantile(0.99,
          sum by (le) (increase(operator_nodeclaim_status_condition_transition_seconds_bucket{type="Registered"}%%{range}))
        ) >= 0
      - |
        histogram_quantile(0.99,
          sum by (le) (increase(operator_nodeclaim_status_condition_transition_seconds_bucket{type="Initialized"}%%{range}))
        ) >= 0
    datadogQuery:
      - |
        p99:operator_nodeclaim_status_condition_transition_seconds{type:launched}
      - |
        p99:operator_nodeclaim_status_condition_transition_seconds{type:registered}
      - |
        p99:operator_nodeclaim_status_condition_transition_seconds{type:initialized}
    instant: true

  - id: infra.karpenter.provisioning.startup
    stability: experimental
    description:
      summary: |
        How long pods that needed a new node took to start running, from when
        the scheduler gave up on existing nodes, over the selected time range.
      nominal: |
        A minute or two: the time to launch an instance, boot it and join the
        cluster.
      degraded: |
        Much longer: slow EC2 capacity, a slow AMI, or a node that joins but
        is slow to become Ready. _Node Launch Stages_ says which stage.
    promQL:
      - |
        histogram_quantile(0.5, sum by (le) (increase(karpenter_pods_provisioning_startup_duration_seconds_bucket%%{range}))) >= 0
      - |
        histogram_quantile(0.99, sum by (le) (increase(karpenter_pods_provisioning_startup_duration_seconds_bucket%%{range}))) >= 0
    datadogQuery:
      - |
        p50:karpenter_pods_provisioning_startup_duration_seconds{*}
      - |
        p99:karpenter_pods_provisioning_startup_duration_seconds{*}
    instant: true

  # --- Cloud Capacity: what EC2 refused -------------------------------------------
  - id: infra.karpenter.provisioning.errors
    stability: experimental
    description:
      summary: |
        Errors from EC2 in the selected time range, by operation and error
        type.
      nominal: Empty.
      unhealthy: |
        On `Create`: `InsufficientCapacityError` is EC2 out of the instance
        type in a zone, which Karpenter works around if the NodePool allows
        other types or zones. `UnfulfillableCapacity` and quota errors need a
        change on the AWS side, and the others usually a change to the
        EC2NodeClass.
      notes: |
        `NodeClaimNotFoundError` is left out. It is an instance already gone
        when Karpenter checked on it, which happens after every termination.
    promQL: |
      sum by (method, error) (
        increase(karpenter_cloudprovider_errors_total{error!="NodeClaimNotFoundError"}%%{range})
      ) > 0
    datadogQuery: |
      cutoff_min(
        sum:karpenter_cloudprovider_errors_total{NOT error:nodeclaimnotfounderror}
          by {method,error}.as_count(),
        1e-9
      )
    instant: true

  - id: infra.karpenter.provisioning.offerings
    stability: experimental
    description:
      summary: |
        Zones where each of the node pools' instance types can be launched,
        by capacity type: now, and the fewest at any point in the selected
        time range.
      nominal: The two columns equal.
      degraded: |
        Fewer at some point than now: EC2 refused a launch for capacity, and
        Karpenter stopped asking that zone for that type for a few minutes. A
        dip in the only type a NodePool allows is a pool that could not grow
        in that zone until it recovered.
      notes: |
        Only the types the Terraform's `service_monitor_instance_types` names
        are kept. Reserved capacity is left out: it reads unavailable wherever
        there is no reservation.
    promQL:
      - |
        sum by (instance_type, capacity_type) (
          max by (instance_type, capacity_type, zone) (karpenter_cloudprovider_instance_type_offering_available{capacity_type!="reserved"})
        )
      - |
        min_over_time(
          (
            sum by (instance_type, capacity_type) (
              max by (instance_type, capacity_type, zone) (karpenter_cloudprovider_instance_type_offering_available{capacity_type!="reserved"})
            )
          )[%%{rangeWindow}:1m]
        )
    # Datadog rolls each series up in time before it sums across them, so the
    # fewest cannot be taken after the sum inside the query. The widget's own
    # aggregator takes it instead, over the summed series; the one-minute
    # rollup keeps each zone's bucket at the subquery's step, so dips in two
    # zones at different times are not added together. Over a window long
    # enough that Datadog widens the bucket, they can be.
    datadogQuery:
      - |
        sum(
          max:karpenter_cloudprovider_instance_type_offering_available{NOT capacity_type:reserved}
            by {instance_type,capacity_type,zone},
          {instance_type,capacity_type}
        )
      - |
        sum(
          max:karpenter_cloudprovider_instance_type_offering_available{NOT capacity_type:reserved}
            by {instance_type,capacity_type,zone}.rollup(min, 60),
          {instance_type,capacity_type}
        )
    instant: true

  # --- Karpenter: replacements and removals ---------------------------------------
  - id: infra.karpenter.nodeclaims.by_reason
    stability: experimental
    description:
      summary: |
        NodeClaims created and disrupted in the selected time range, by
        NodePool and reason.
      notes: |
        `provisioned` is a new node for waiting pods. `empty` and
        `underutilized` are consolidation; `drifted` a node that no longer
        matches its NodePool or EC2NodeClass, such as after an AMI update;
        `expired` one past its NodePool's `expireAfter`; `interrupted` one AWS
        is reclaiming, read from Karpenter's interruption queue. A replacement
        is created and disrupted under the same reason, so the two columns
        match.
    promQL:
      - |
        sum by (nodepool, reason) (increase(karpenter_nodeclaims_created_total%%{range})) > 0
      - |
        sum by (nodepool, reason) (increase(karpenter_nodeclaims_disrupted_total%%{range})) > 0
    datadogQuery:
      - |
        cutoff_min(sum:karpenter_nodeclaims_created_total{*} by {nodepool,reason}.as_count(), 1e-9)
      - |
        cutoff_min(sum:karpenter_nodeclaims_disrupted_total{*} by {nodepool,reason}.as_count(), 1e-9)
    instant: true

  - id: infra.karpenter.disruption.blocked
    stability: experimental
    description:
      summary: |
        What kept each node in place in the selected time range, from
        Karpenter's `DisruptionBlocked` and `Unconsolidatable` events: the
        reason, and the pod or PodDisruptionBudget responsible.
      nominal: |
        On a Materialize cluster, the `do-not-disrupt` annotation on the
        Materialize pool's nodes: the operator marks every Materialize pod so,
        because moving a replica means rehydrating it. That is the design
        working, not a fault. The other pools read whatever their
        consolidation policy says.
      degraded: |
        A PodDisruptionBudget holding nodes that could otherwise be removed or
        replaced, including drifted nodes that should be.
      notes: |
        Karpenter records these on the NodeClaim and the Node alike; only the
        Node's are read. It repeats them every few minutes for as long as a
        node is held.
    logQL: |
      sum by (name, why, holder) (
        count_over_time(
          {job="loki.source.kubernetes_events"}
            | reportingcontroller="karpenter"
            | reason=~"DisruptionBlocked|Unconsolidatable"
            | kind="Node"
            | line_format "{{.msg}}"
            | regexp "^(?P<why>Pod has .karpenter.sh/do-not-disrupt. annotation|Pdb prevents pod evictions|NodePool .[^ ]+. has [a-z-]+ consolidation disabled|[A-Z][^(]+)(?: ?[(](?P<holder>[^)]*)[)])?"
        %%{range})
      )
    instant: true

  # --- Karpenter: draining and interruptions --------------------------------------
  - id: infra.karpenter.disruption.evictions
    stability: experimental
    description:
      summary: |
        Pod evictions Karpenter requested in the selected time range: those
        allowed, and those a PodDisruptionBudget refused.
      degraded: |
        Refusals. Karpenter retries, and the node is not removed until the
        budget allows it.
    promQL:
      - |
        sum(increase(karpenter_nodes_eviction_requests_total{code=~"2.."}%%{range}))
        or 0 * max(karpenter_build_info)
      - |
        sum(increase(karpenter_nodes_eviction_requests_total{code="429"}%%{range}))
        or 0 * max(karpenter_build_info)
    datadogQuery:
      - |
        default_zero(sum:karpenter_nodes_eviction_requests_total{code:2*}.as_count())
      - |
        default_zero(sum:karpenter_nodes_eviction_requests_total{code:429}.as_count())
    instant: true

  - id: infra.karpenter.disruption.termination
    stability: experimental
    description:
      summary: |
        How long NodeClaims took to terminate, from the decision to the
        instance gone, at the 99th percentile over the selected time range.
      degraded: |
        Hours: pods that could not be evicted held the node. Nodes in the
        Materialize pool wait for a Materialize rollout to move their pods.
    promQL: |
      histogram_quantile(0.99,
        sum by (le) (increase(operator_nodeclaim_termination_duration_seconds_bucket%%{range}))
      ) >= 0
    datadogQuery: |
      p99:operator_nodeclaim_termination_duration_seconds{*}
    instant: true

  - id: infra.karpenter.interruption.queue_delay
    stability: experimental
    description:
      summary: |
        How long notices waited in the interruption queue before Karpenter read
        them, at the 99th percentile over the selected time range.
      nominal: Seconds.
      unhealthy: |
        Minutes: Karpenter is not keeping up, or was down. A notice read late
        leaves less of AWS's warning to drain the node in.
      notes: |
        The queue receives every instance event in the account and region,
        whoever owns the instance, so this is how well Karpenter keeps up with
        all of them. The ones about its own nodes that it acted on are its
        `interrupted` disruptions.
    promQL: |
      histogram_quantile(0.99,
        sum by (le) (increase(karpenter_interruption_message_queue_duration_seconds_bucket%%{range}))
      ) >= 0
    datadogQuery: |
      p99:karpenter_interruption_message_queue_duration_seconds{*}
    instant: true

  # --- Karpenter: the controller --------------------------------------------------
  - id: infra.karpenter.controller.reconcile_errors
    stability: experimental
    description:
      summary: Reconcile errors per minute, by controller.
      nominal: |
        Near zero. A few are routine: an object changed while it was being
        reconciled, and the next attempt succeeds.
      degraded: |
        A controller erroring steadily. _Warning and Error Logs_ carries the
        error.
    promQL: |
      sum by (controller) (
        rate(controller_runtime_reconcile_errors_total{app="karpenter"}%%{interval})
      ) * 60 > 0
    datadogQuery: |
      cutoff_min(
        sum:controller_runtime_reconcile_errors_total{app:karpenter}
          by {controller}.as_rate().rollup(sum, 60) * 60,
        1e-9
      )

  - id: infra.karpenter.controller.workqueue
    stability: experimental
    description:
      summary: Items waiting in each of Karpenter's work queues.
      nominal: Near zero.
      degraded: |
        A queue that grows and does not drain: that controller is behind.
    promQL: |
      max by (name) (workqueue_depth{app="karpenter"}) > 0
    datadogQuery: |
      cutoff_min(max:workqueue_depth{app:karpenter} by {name}, 1e-9)

  - id: infra.karpenter.controller.aws_errors
    stability: experimental
    description:
      summary: AWS API calls that did not succeed per minute, by service, action and status.
      nominal: |
        A trickle of `400` on `DescribeLaunchTemplates`, which is Karpenter
        looking for a launch template before it creates it.
      degraded: |
        `403` is a permission Karpenter's IAM role lacks; `429` or
        `RequestLimitExceeded` is API throttling, often from something else in
        the account. `CreateFleet` errors are launches EC2 refused; _EC2
        Errors_, on the Cloud Capacity tab, says why.
      notes: |
        `412` is left out: EC2 answers every dry run with it, and Karpenter dry
        runs `CreateFleet` and `RunInstances` to check its EC2NodeClasses. The
        SDK's own `service` label arrives as `exported_service`, since the
        scrape stamps the Kubernetes Service name on `service`.
    promQL: |
      sum by (exported_service, action, code) (
        rate(aws_sdk_go_request_total{app="karpenter", code!~"2..|412"}%%{interval})
      ) * 60 > 0
    datadogQuery: |
      cutoff_min(
        sum:aws_sdk_go_request_total{app:karpenter AND NOT code:2* AND NOT code:412}
          by {exported_service,action,code}.as_rate().rollup(sum, 60) * 60,
        1e-9
      )

  - id: infra.karpenter.controller.kube_errors
    stability: experimental
    description:
      summary: Kubernetes API calls that did not succeed per minute, by method and status.
      nominal: |
        Near zero. `404` and `409` are an object gone or changed underneath
        Karpenter, which it retries, and come in bursts whenever it replaces
        nodes.
      degraded: |
        `429` is the API server throttling Karpenter; `5xx` an API server in
        trouble, which also shows as _Cluster State_ dropping.
    promQL: |
      sum by (method, code) (
        rate(client_go_request_total{app="karpenter", code!~"2.."}%%{interval})
      ) * 60 > 0
    datadogQuery: |
      cutoff_min(
        sum:client_go_request_total{app:karpenter AND NOT code:2*}
          by {method,code}.as_rate().rollup(sum, 60) * 60,
        1e-9
      )

  - id: infra.karpenter.controller.cpu
    stability: experimental
    description:
      summary: CPU each Karpenter replica uses, in cores.
      notes: |
        Only the replica holding the leader lease provisions and disrupts, so
        it is the one using CPU; the standby uses almost none. A change of
        leader shows as the two lines swapping.
    promQL: |
      sum by (pod) (
        rate(container_cpu_usage_seconds_total{container="controller", pod=~"karpenter-.+"}%%{interval})
      )
    datadogQuery: |
      sum:container_cpu_usage_seconds_total{container:controller AND pod:karpenter-*}
        by {pod}.as_rate().rollup(sum, 60)

  - id: infra.karpenter.controller.memory
    stability: experimental
    description:
      summary: Memory each Karpenter replica holds, against its limit.
      degraded: |
        The leader near its limit. Karpenter's memory grows with the number of
        nodes, pods and instance types it tracks, and an out-of-memory restart
        stops all provisioning while the standby takes over.
    promQL:
      - |
        max by (pod) (container_memory_working_set_bytes{container="controller", pod=~"karpenter-.+"})
      - |
        max by (pod) (kube_pod_container_resource_limits{container="controller", pod=~"karpenter-.+", resource="memory"})
    datadogQuery:
      - |
        max:container_memory_working_set_bytes{container:controller AND pod:karpenter-*} by {pod}
      - |
        max:kube_pod_container_resource_limits{container:controller AND pod:karpenter-* AND resource:memory}
          by {pod}

  # --- Karpenter: logs ------------------------------------------------------------
  - id: infra.karpenter.logs.problems
    stability: experimental
    description:
      summary: Karpenter's warning and error log lines, newest first.
      notes: |
        Karpenter logs JSON; expanding a line shows its fields, including the
        NodeClaim or NodePool it concerns.
    logQL: |
      {app="karpenter", level=~"WARN|ERROR"}
