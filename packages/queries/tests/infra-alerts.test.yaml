# promtool unit tests for the rules rendered from infra-alerts.yaml.
#
# Run by `make rules-check`; see materialize-alerts.test.yaml for how the rule
# files beside this one are produced and which placeholder values they carry.
rule_files:
  - infra-alerts.yaml
evaluation_interval: 1m
tests:
  # --- infra-memory-high: a missing limit is not 100% ------------------------
  #
  # A container with no memory limit reports a limit of 0, and dividing by it
  # gave +Inf, which is above every threshold: on a reference install this kept
  # a dozen series firing permanently. The rule also grades only the core tier
  # (`rules.infraWorkloads.core`, which by default includes coredns), so an
  # application container just as close to its limit is not its business.
  - name: infra-memory-high fires near a real limit and ignores no limit
    interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="web-a", container="web"}'
        values: "95x30"
      - series: 'container_spec_memory_limit_bytes{namespace="shop", pod="web-a", container="web"}'
        values: "100x30"
      - series: 'container_memory_working_set_bytes{namespace="kube-system", pod="coredns-a", container="coredns"}'
        values: "100x30"
      - series: 'container_spec_memory_limit_bytes{namespace="kube-system", pod="coredns-a", container="coredns"}'
        values: "0x30"
      - series: 'container_memory_working_set_bytes{namespace="kube-system", pod="coredns-b", container="coredns"}'
        values: "90x30"
      - series: 'container_spec_memory_limit_bytes{namespace="kube-system", pod="coredns-b", container="coredns"}'
        values: "100x30"
    promql_expr_test:
      - expr: count by (pod) (ALERTS{alertname="infra-memory-high", alertstate="firing"})
        eval_time: 15m
        exp_samples:
          - labels: '{pod="coredns-b"}'
            value: 1

  # --- pods-stuck-in-waiting: the join that never matched ---------------------
  #
  # The waiting series is per container and the start-time series per pod, so
  # without `on (namespace, pod)` the two never shared a label set and the rule
  # could not fire at all.
  - name: pods-stuck-in-waiting fires for a pod waiting past its first 10 minutes
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting{namespace="monitoring", pod="old", container="app"}'
        values: "1x20"
      - series: 'kube_pod_start_time{namespace="monitoring", pod="old", container="kube-state-metrics"}'
        values: "0x20"
      # Started at 10m, so only 5m old at the evaluation.
      - series: 'kube_pod_container_status_waiting{namespace="monitoring", pod="young", container="app"}'
        values: "1x20"
      - series: 'kube_pod_start_time{namespace="monitoring", pod="young", container="kube-state-metrics"}'
        values: "600x20"
    promql_expr_test:
      - expr: count by (pod) (ALERTS{alertname="pods-stuck-in-waiting", alertstate="firing"})
        eval_time: 15m
        exp_samples:
          - labels: '{pod="old"}'
            value: 1

  # --- logging-collection-down: zero and absent both mean down ---------------
  #
  # `sum()` over no series is empty rather than zero, so a distributor that had
  # stopped reporting at all could never fire the rule.
  - name: logging-collection-down fires when the distributor reports nothing
    interval: 1m
    input_series:
      - series: 'up{job="loki/loki-distributor"}'
        values: "0x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="logging-collection-down", alertstate="firing"})
        eval_time: 20m
        exp_samples:
          - labels: "{}"
            value: 1

  - name: logging-collection-down stays quiet while logs arrive
    interval: 1m
    input_series:
      - series: 'loki_distributor_bytes_received_total{job="loki/loki-distributor", pod="loki-distributor-0"}'
        values: "0+1000x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="logging-collection-down"})
        eval_time: 20m
        exp_samples: []

  # --- k8s-container-disk-usage: per node ------------------------------------
  #
  # Grouped by a node label the gateway does not keep, every node collapsed into
  # one series; `node` is the label cAdvisor series carry here.
  - name: k8s-container-disk-usage reports the full node, not the whole cluster
    interval: 1m
    input_series:
      - series: 'container_fs_usage_bytes{node="node-a", container="app"}'
        values: "80x20"
      - series: 'container_fs_limit_bytes{node="node-a", container="app"}'
        values: "100x20"
      - series: 'container_fs_usage_bytes{node="node-b", container="app"}'
        values: "10x20"
      - series: 'container_fs_limit_bytes{node="node-b", container="app"}'
        values: "100x20"
    promql_expr_test:
      - expr: count by (node) (ALERTS{alertname="k8s-container-disk-usage", alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{node="node-a"}'
            value: 1

  # --- materialize-node-draining and its escalations ------------------------
  #
  # One condition graded by how long it lasts: a notice at 10m, a warning at
  # 2h, a page at 24h. Only environmentd and clusterd count, because a drain
  # restarts them even when a replacement node is ready; balancerd and the
  # console have replicas to spare. Node series carry the scraping
  # kube-state-metrics pod's own `namespace` and `pod`, as they do on a real
  # install, so a join that kept those labels would match nothing.
  - name: materialize-node-draining escalates on a node hosting environmentd or clusterd
    interval: 5m
    input_series:
      # node-a: cordoned, running environmentd and a replica, plus a pod
      # outside Materialize whose name happens to fit the pattern.
      - series: 'kube_node_spec_unschedulable{node="node-a", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "1x300"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-environmentd-3-0", node="node-a"}'
        values: "1x300"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-cluster-u1-replica-u1-gen-3-0", node="node-a"}'
        values: "1x300"
      - series: 'kube_pod_info{namespace="shop", pod="web-gen-1-0", node="node-a"}'
        values: "1x300"
      # node-b: cordoned, running only balancerd and the console.
      - series: 'kube_node_spec_unschedulable{node="node-b", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "1x300"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-balancerd-7c9f8d6b5-abcde", node="node-b"}'
        values: "1x300"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-console-5d8b7c9f4-fghij", node="node-b"}'
        values: "1x300"
      # node-c: schedulable, running a replica.
      - series: 'kube_node_spec_unschedulable{node="node-c", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "0x300"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-cluster-u2-replica-u2-gen-3-0", node="node-c"}'
        values: "1x300"
    promql_expr_test:
      - expr: count by (alertname, pod) (ALERTS{alertname=~"materialize-node-.*", alertstate="firing"})
        eval_time: 1h
        exp_samples:
          - labels: '{alertname="materialize-node-draining", pod="mz1-environmentd-3-0"}'
            value: 1
          - labels: '{alertname="materialize-node-draining", pod="mz1-cluster-u1-replica-u1-gen-3-0"}'
            value: 1
      - expr: count by (alertname) (ALERTS{alertname=~"materialize-node-.*", alertstate="firing"})
        eval_time: 3h
        exp_samples:
          - labels: '{alertname="materialize-node-draining"}'
            value: 2
          - labels: '{alertname="materialize-node-drain-slow"}'
            value: 2
      - expr: count by (alertname) (ALERTS{alertname=~"materialize-node-.*", alertstate="firing"})
        eval_time: 25h
        exp_samples:
          - labels: '{alertname="materialize-node-draining"}'
            value: 2
          - labels: '{alertname="materialize-node-drain-slow"}'
            value: 2
          - labels: '{alertname="materialize-node-drain-stuck"}'
            value: 2

  # An autoscaler that removes a node taints it rather than cordoning it.
  # A node the cluster autoscaler only lists as a candidate is not draining,
  # and a cordon lifted within 10m never reaches the notice.
  - name: materialize-node-draining reads the autoscalers' removal taints and skips a brief cordon
    interval: 1m
    input_series:
      - series: 'kube_node_spec_unschedulable{node="node-k", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "0x20"
      - series: 'kube_node_spec_taint{node="node-k", key="karpenter.sh/disrupted", value="", effect="NoSchedule", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "1x20"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-cluster-u1-replica-u1-gen-3-0", node="node-k"}'
        values: "1x20"
      - series: 'kube_node_spec_unschedulable{node="node-d", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "0x20"
      - series: 'kube_node_spec_taint{node="node-d", key="DeletionCandidateOfClusterAutoscaler", value="1767225600", effect="PreferNoSchedule", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "1x20"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-environmentd-3-0", node="node-d"}'
        values: "1x20"
      # Cordoned for 5m, then uncordoned.
      - series: 'kube_node_spec_unschedulable{node="node-q", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "1x5 0x15"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-cluster-u2-replica-u2-gen-3-0", node="node-q"}'
        values: "1x20"
    promql_expr_test:
      - expr: count by (alertname, node) (ALERTS{alertname=~"materialize-node-.*", alertstate="firing"})
        eval_time: 15m
        exp_samples:
          - labels: '{alertname="materialize-node-draining", node="node-k"}'
            value: 1

  # --- node-drain-stuck: every other node, after GKE's upgrade wait ---------
  #
  # GKE's blue-green upgrades keep every old node cordoned for three days by
  # default, so a routine upgrade must stay under the rule's 4d. A node that
  # runs a replica is the materialize-node-* alerts' to report instead.
  - name: node-drain-stuck waits out a GKE upgrade and leaves Materialize nodes to their own alerts
    interval: 5m
    input_series:
      # node-g: cordoned for 5 days, running balancerd and an application.
      - series: 'kube_node_spec_unschedulable{node="node-g", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "1x1440"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-balancerd-7c9f8d6b5-abcde", node="node-g"}'
        values: "1x1440"
      - series: 'kube_pod_info{namespace="shop", pod="web-0", node="node-g"}'
        values: "1x1440"
      # node-m: cordoned for 5 days, running a replica.
      - series: 'kube_node_spec_unschedulable{node="node-m", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "1x1440"
      - series: 'kube_pod_info{namespace="materialize-environment", pod="mz1-cluster-u1-replica-u1-gen-3-0", node="node-m"}'
        values: "1x1440"
      # node-w: cordoned for the 3 days of a blue-green upgrade's wait, then
      # uncordoned.
      - series: 'kube_node_spec_unschedulable{node="node-w", namespace="monitoring", pod="kube-state-metrics-0"}'
        values: "1x864 0x576"
    promql_expr_test:
      - expr: count by (node) (ALERTS{alertname="node-drain-stuck", alertstate="firing"})
        eval_time: 95h
        exp_samples: []
      - expr: count by (node) (ALERTS{alertname="node-drain-stuck", alertstate="firing"})
        eval_time: 97h
        exp_samples:
          - labels: '{node="node-g"}'
            value: 1

  # --- k8s-infra-pod-pending-too-long: everything but Materialize -----------
  #
  # Written against Cloud's `environment-*` namespaces, it treated Materialize's
  # own pods as infrastructure on self-managed.
  - name: k8s-infra-pod-pending-too-long leaves the Materialize deployment to its own rules
    interval: 1m
    input_series:
      - series: 'kube_pod_status_phase{namespace="materialize-environment", pod="mz-environmentd-gen-2-0", phase="Pending"}'
        values: "1x30"
      - series: 'kube_pod_status_phase{namespace="materialize", pod="operator-0", phase="Pending"}'
        values: "1x30"
      - series: 'kube_pod_status_phase{namespace="monitoring", pod="loki-ingester-0", phase="Pending"}'
        values: "1x30"
    promql_expr_test:
      - expr: count by (namespace) (ALERTS{alertname="k8s-infra-pod-pending-too-long", alertstate="firing"})
        eval_time: 25m
        exp_samples:
          - labels: '{namespace="monitoring"}'
            value: 1
