# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# JSONSchema for prometheus.* components in alloy pipeline definitions.
#
# DESIGN NOTE: typed schemas are strict (additionalProperties: false on each
# typed block). Undocumented attributes are rejected deliberately — extend the
# relevant $def to add one, or wrap the whole block in a `raw:` escape (see
# raw.schema.yaml).
#
# The typed shape is intentionally FLAT — attributes live directly under the
# discriminator key alongside `label` and (where applicable) `blocks`. This
# differs from the raw shape, which keeps a `component / label / attributes /
# blocks` partition because raw needs `component` as its own discriminator.
#
# SCOPE: this covers the metrics building blocks we expect to use, running
# in-cluster. Deliberately left to the `raw:` escape for now (graduate as usage
# demands): remote_write endpoint auth/TLS/queue tuning, the operator `client`
# (Kubernetes API) block, oauth2/authorization/sigv4/azuread, and the
# receive_http `tls` block.
#
# Schemas grow with usage; they are not meant to mirror alloy upstream
# exhaustively. The full policy lives in:
#   docs/content/reference/development/pipelines/authoring.md
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://materializeinc.github.io/materialize-monitoring/reference/development/schemas/alloy/prometheus.schema.yaml"
title: "Alloy Prometheus components"
description: |
  Schemas for the prometheus.* alloy components used by materialize-monitoring pipelines.

  Only the attributes we commonly set are documented here.
  For anything outside this schema, fall back to the `raw:` escape hatch from raw.schema.yaml.

  See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/

type: object
# Externally-tagged: each branch requires its component key and forbids the others,
# so `oneOf` matches exactly one component per block.
oneOf:
  - type: object
    properties:
      prometheus.echo:
        $ref: "#/$defs/prometheus.echo"
    required: [prometheus.echo]
    additionalProperties: false
  - type: object
    properties:
      prometheus.relabel:
        $ref: "#/$defs/prometheus.relabel"
    required: [prometheus.relabel]
    additionalProperties: false
  - type: object
    properties:
      prometheus.scrape:
        $ref: "#/$defs/prometheus.scrape"
    required: [prometheus.scrape]
    additionalProperties: false
  - type: object
    properties:
      prometheus.receive_http:
        $ref: "#/$defs/prometheus.receive_http"
    required: [prometheus.receive_http]
    additionalProperties: false
  - type: object
    properties:
      prometheus.remote_write:
        $ref: "#/$defs/prometheus.remote_write"
    required: [prometheus.remote_write]
    additionalProperties: false
  - type: object
    properties:
      prometheus.operator.podmonitors:
        $ref: "#/$defs/prometheus.operator.podmonitors"
    required: [prometheus.operator.podmonitors]
    additionalProperties: false
  - type: object
    properties:
      prometheus.operator.servicemonitors:
        $ref: "#/$defs/prometheus.operator.servicemonitors"
    required: [prometheus.operator.servicemonitors]
    additionalProperties: false
  - type: object
    properties:
      prometheus.exporter.cadvisor:
        $ref: "#/$defs/prometheus.exporter.cadvisor"
    required: [prometheus.exporter.cadvisor]
    additionalProperties: false
  - type: object
    properties:
      prometheus.exporter.cloudwatch:
        $ref: "#/$defs/prometheus.exporter.cloudwatch"
    required: [prometheus.exporter.cloudwatch]
    additionalProperties: false
  - type: object
    properties:
      prometheus.exporter.gcp:
        $ref: "#/$defs/prometheus.exporter.gcp"
    required: [prometheus.exporter.gcp]
    additionalProperties: false
  - type: object
    properties:
      prometheus.exporter.azure:
        $ref: "#/$defs/prometheus.exporter.azure"
    required: [prometheus.exporter.azure]
    additionalProperties: false

$defs:
  label:
    description: User-defined identifier to distinguish multiple instances.
    type: string

  expressionOrString:
    description: |
      A value that can be either a literal string or an expression string.
      Used for fields that support dynamic expressions but often just need a constant.

      See: https://grafana.com/docs/alloy/latest/reference/compatibility/#expression-or-string
    oneOf:
      - type: string
      - $ref: "./common/expression.schema.yaml"

  expressionOrDuration:
    description: |
      A value that can be either a literal Go duration string or an expression
      (e.g. sourced from an environment variable via `{env: VAR_NAME}`).
      Used for duration fields that are often wired to a runtime knob.
    oneOf:
      - type: string
        format: go-duration
      - $ref: "./common/expression.schema.yaml"

  metricsReceiver:
    description: |
      Reference to a prometheus.* component that can receive metric samples.

      Used by `forward_to` to specify where to send scraped/processed metrics.
      Exported as `receiver` by prometheus.echo / prometheus.relabel /
      prometheus.remote_write / prometheus.receive_http.

      See: https://grafana.com/docs/alloy/latest/reference/compatibility/#metricsreceiver
    type: string

  # ============================================================
  # Top-level components
  # ============================================================

  prometheus.echo:
    description: |
      Metrics receiver that prints incoming samples to stdout in Prometheus
      exposition format.

      Mainly useful as a debug sink during development.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.echo/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      format:
        description: |
          Output encoding.
          `text` (default) is the Prometheus text exposition format;
          `openmetrics` is the OpenMetrics format.
        type: string
        enum: [text, openmetrics]
    additionalProperties: false

  prometheus.relabel:
    description: |
      Rewrites the label set of every metric that passes through using `rule`
      blocks before forwarding downstream.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.relabel/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      forward_to:
        description: Metrics receivers to forward relabeled samples to.
        type: array
        items:
          $ref: "#/$defs/metricsReceiver"
      max_cache_size:
        description: |
          Maximum number of entries in the relabeling result cache.
          Defaults to 100,000.
        type: number
        examples: [100000]
      cache_ttl:
        description: |
          How long a relabeling result stays cached.
          Defaults to `0` (no expiry).
        type: string
        format: go-duration
      blocks:
        description: |
          One or more `rule` blocks defining the relabel sequence.
        type: array
        items:
          # Cross-file ref — the `rule` def is shared, defined in loki.schema.yaml.
          $ref: "./loki.schema.yaml#/$defs/ruleBlock"
    required: [forward_to]
    additionalProperties: false

  prometheus.scrape:
    description: |
      Scrapes metrics from a set of `targets` and forwards them downstream.

      Running in-cluster, most targets are unauthenticated app `/metrics`
      endpoints; `basic_auth` / `bearer_token*` / `tls_config` cover the
      authenticated cases (e.g. the kubelet).

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.scrape/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      targets:
        description: |
          Targets to scrape. Each entry is a `map(string)` of labels
          (including `__address__`), or a reference to another component's
          targets export (e.g. `discovery.relabel.pods.output`).
        type: array
        items:
          # Cross-file ref — the generic `target` def lives in discovery.schema.yaml.
          $ref: "./discovery.schema.yaml#/$defs/target"
      forward_to:
        description: Metrics receivers to forward scraped samples to.
        type: array
        items:
          $ref: "#/$defs/metricsReceiver"
      scrape_interval:
        description: |
          How frequently to scrape the targets.
          Defaults to `60s`. Accepts an expression, so it can be wired to an
          environment variable — the scrape interval is the dominant cost lever
          for a high-cardinality target such as a per-node cAdvisor.
        $ref: "#/$defs/expressionOrDuration"
        examples: ["60s", "30s", "15s"]
      scrape_timeout:
        description: |
          Per-scrape timeout.
          Defaults to `10s`. Accepts an expression, so it can be wired to an
          environment variable.
        $ref: "#/$defs/expressionOrDuration"
      metrics_path:
        description: |
          HTTP path to scrape.
          Defaults to `/metrics`.
        type: string
      scheme:
        description: |
          URL scheme to use (`http` or `https`).
        type: string
      job_name:
        description: |
          Value of the `job` label applied to scraped metrics.
          Defaults to the component name.
        type: string
      honor_labels:
        description: |
          When true, label conflicts between the target and the scraped metric
          keep the metric's labels rather than being renamed with an `exported_`
          prefix.
        type: boolean
      honor_timestamps:
        description: |
          When true (default), timestamps present in the scraped data are kept.
          Accepts an expression, so a `declare` body can take it as an argument.
        anyOf:
          - type: boolean
          - $ref: "./common/expression.schema.yaml"
      honor_metadata:
        description: |
          When true, pass the target's metric metadata (`# TYPE` / `# HELP`)
          downstream. Without it `otelcol.receiver.prometheus` has no types and
          makes every series a gauge.

          Experimental: the component fails to build unless Alloy runs with
          `--stability.level=experimental`. `alloy validate` does not check
          this, so a config that sets it validates at any level.
        type: boolean
      follow_redirects:
        description: |
          When true (default), HTTP 3xx redirects are followed.
        type: boolean
      enable_compression:
        description: |
          When true (default), request gzip compression from the target.
        type: boolean
      enable_http2:
        description: |
          When true (default), allow HTTP/2 for scrape requests.
        type: boolean
      bearer_token:
        description: |
          Bearer token for target authentication (a secret; often sourced from
          an environment variable via an expression). Mutually exclusive with
          the other auth methods.
        $ref: "#/$defs/expressionOrString"
      bearer_token_file:
        description: |
          Path to a file containing a bearer token for target authentication
          (e.g. `/var/run/secrets/kubernetes.io/serviceaccount/token`).
        type: string
      blocks:
        description: |
          Optional nested blocks (`basic_auth`, `tls_config`, `clustering`).
          Anything else (e.g. `oauth2`, `authorization`) uses the `raw:` escape.
        type: array
        items:
          $ref: "#/$defs/scrapeSubBlock"
    required: [targets, forward_to]
    additionalProperties: false

  prometheus.receive_http:
    description: |
      Runs an HTTP server exposing a Prometheus remote-write endpoint
      (`POST /api/v1/metrics/write`) and forwards received samples downstream.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.receive_http/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      forward_to:
        description: Metrics receivers to forward received samples to.
        type: array
        items:
          $ref: "#/$defs/metricsReceiver"
      blocks:
        description: |
          Optional nested blocks. `http` configures the server; a `tls` block
          uses the `raw:` escape.
        type: array
        items:
          $ref: "#/$defs/receiveHttpSubBlock"
    required: [forward_to]
    additionalProperties: false

  prometheus.remote_write:
    description: |
      Delivers metrics to one or more Prometheus-compatible remote-write
      endpoints, buffering through a write-ahead log.

      Only the `endpoint` `url` and common scalars are typed. Endpoint auth
      (`basic_auth`, `bearer_token`, `tls_config`), `queue_config`, and
      `write_relabel_config` are reachable via a `raw:` block nested inside the
      `endpoint` (see `remoteWriteEndpoint.blocks`).

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.remote_write/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      external_labels:
        description: |
          Labels added to every metric before it is sent to the endpoints.
        type: object
        additionalProperties:
          type: string
      blocks:
        description: |
          One or more `endpoint` blocks describing where to send metrics.
        type: array
        items:
          $ref: "#/$defs/remoteWriteSubBlock"
    additionalProperties: false

  prometheus.operator.podmonitors:
    description: |
      Discovers `PodMonitor` custom resources and scrapes the pods they select,
      forwarding the metrics downstream. Runs the equivalent of the Prometheus
      Operator's PodMonitor handling.

      Running in-cluster, no `client` block is needed — Alloy uses the pod's
      service account automatically.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.operator.podmonitors/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      forward_to:
        description: Metrics receivers to forward scraped samples to.
        type: array
        items:
          $ref: "#/$defs/metricsReceiver"
      namespaces:
        description: |
          Namespaces to search for PodMonitors in.
          Defaults to all namespaces.
        type: array
        items:
          type: string
      informer_sync_timeout:
        description: |
          Timeout for the initial Kubernetes informer sync.
          Defaults to `1m`.
        type: string
        format: go-duration
      blocks:
        description: |
          Optional nested blocks (`clustering`, `selector`, `scrape`, `rule`).
          The `client` (Kubernetes API) block uses the `raw:` escape.
        type: array
        items:
          $ref: "#/$defs/operatorSubBlock"
    required: [forward_to]
    additionalProperties: false

  prometheus.operator.servicemonitors:
    description: |
      Discovers `ServiceMonitor` custom resources and scrapes the endpoints they
      select, forwarding the metrics downstream. Runs the equivalent of the
      Prometheus Operator's ServiceMonitor handling.

      Running in-cluster, no `client` block is needed — Alloy uses the pod's
      service account automatically.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.operator.servicemonitors/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      forward_to:
        description: Metrics receivers to forward scraped samples to.
        type: array
        items:
          $ref: "#/$defs/metricsReceiver"
      namespaces:
        description: |
          Namespaces to search for ServiceMonitors in.
          Defaults to all namespaces.
        type: array
        items:
          type: string
      kubernetes_role:
        description: |
          Kubernetes role used to discover scrape targets.
          Defaults to `endpoints`.
        type: string
        examples: ["endpoints", "endpointslice"]
      informer_sync_timeout:
        description: |
          Timeout for the initial Kubernetes informer sync.
          Defaults to `1m`.
        type: string
        format: go-duration
      blocks:
        description: |
          Optional nested blocks (`clustering`, `selector`, `scrape`, `rule`).
          The `client` (Kubernetes API) block uses the `raw:` escape.
        type: array
        items:
          $ref: "#/$defs/operatorSubBlock"
    required: [forward_to]
    additionalProperties: false

  # ============================================================
  # Sub-block lists (each ends with the `raw` escape branch)
  # ============================================================

  scrapeSubBlock:
    description: |
      One sub-block in a `prometheus.scrape` body.
      The final `raw` branch is the escape hatch for sub-blocks not typed here.
    oneOf:
      - type: object
        properties:
          basic_auth:
            $ref: "#/$defs/basic_auth"
        required: [basic_auth]
        additionalProperties: false
      - type: object
        properties:
          tls_config:
            $ref: "#/$defs/tls_config"
        required: [tls_config]
        additionalProperties: false
      - type: object
        properties:
          clustering:
            $ref: "#/$defs/clustering"
        required: [clustering]
        additionalProperties: false
      - $ref: "./common/raw.schema.yaml"

  receiveHttpSubBlock:
    description: |
      One sub-block in a `prometheus.receive_http` body.
      The final `raw` branch is the escape hatch (e.g. for the `tls` block).
    oneOf:
      - type: object
        properties:
          http:
            $ref: "#/$defs/httpServer"
        required: [http]
        additionalProperties: false
      - $ref: "./common/raw.schema.yaml"

  remoteWriteSubBlock:
    description: |
      One sub-block in a `prometheus.remote_write` body.
      The final `raw` branch is the escape hatch for sub-blocks not typed here.
    oneOf:
      - type: object
        properties:
          endpoint:
            $ref: "#/$defs/remoteWriteEndpoint"
        required: [endpoint]
        additionalProperties: false
      - $ref: "./common/raw.schema.yaml"

  operatorSubBlock:
    description: |
      One sub-block in a `prometheus.operator.*` body.
      The final `raw` branch is the escape hatch for sub-blocks not typed here
      (notably the `client` Kubernetes API block).
    oneOf:
      - type: object
        properties:
          clustering:
            $ref: "#/$defs/clustering"
        required: [clustering]
        additionalProperties: false
      - type: object
        properties:
          selector:
            $ref: "#/$defs/operatorSelector"
        required: [selector]
        additionalProperties: false
      - type: object
        properties:
          scrape:
            $ref: "#/$defs/operatorScrape"
        required: [scrape]
        additionalProperties: false
      - type: object
        properties:
          rule:
            # Cross-file ref — the `rule` def is shared, defined in loki.schema.yaml.
            $ref: "./loki.schema.yaml#/$defs/rule"
        required: [rule]
        additionalProperties: false
      - $ref: "./common/raw.schema.yaml"

  rawOnlyBlock:
    description: |
      A nested-block list that only supports the `raw:` escape (no typed
      sub-blocks yet). Used where the surrounding block's scalars are typed but
      its nested blocks are deferred to raw.
    type: array
    items:
      $ref: "./common/raw.schema.yaml"

  # ============================================================
  # Shared block defs
  # ============================================================

  clustering:
    description: |
      Distributes scrape targets across the nodes of an Alloy cluster so each
      target is scraped by exactly one instance.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.scrape/#clustering-block
    type: object
    properties:
      enabled:
        description: |
          When true, participate in cluster-wide target distribution.
        type: boolean
    required: [enabled]
    additionalProperties: false

  basic_auth:
    description: |
      HTTP Basic authentication for the scrape request.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.scrape/#basic_auth-block
    type: object
    properties:
      username:
        description: Basic auth username.
        type: string
      password:
        description: |
          Basic auth password (a secret; often sourced from an environment
          variable via an expression). Mutually exclusive with `password_file`.
        $ref: "#/$defs/expressionOrString"
      password_file:
        description: |
          Path to a file containing the basic auth password.
        type: string
    additionalProperties: false

  tls_config:
    description: |
      TLS settings for the scrape connection.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.scrape/#tls_config-block
    type: object
    properties:
      ca_file:
        description: Path to the CA certificate used to validate the server.
        type: string
      ca_pem:
        description: Inline PEM CA certificate used to validate the server.
        type: string
      cert_file:
        description: Path to the client certificate.
        type: string
      cert_pem:
        description: Inline PEM client certificate.
        type: string
      key_file:
        description: Path to the client key.
        type: string
      key_pem:
        description: Inline PEM client key (a secret).
        type: string
      insecure_skip_verify:
        description: |
          When true, skip server certificate verification. Common for scraping
          the kubelet with its self-signed certificate.
        anyOf:
          - type: boolean
          - $ref: "./common/expression.schema.yaml"
      server_name:
        description: ServerName (SNI) used to verify the server certificate.
        type: string
      min_version:
        description: Minimum acceptable TLS version (e.g. `TLS12`).
        type: string
    additionalProperties: false

  httpServer:
    description: |
      Configures the HTTP server that `prometheus.receive_http` runs.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.receive_http/#http-block
    type: object
    properties:
      listen_address:
        description: |
          Address to listen on.
          Defaults to all interfaces.
        type: string
      listen_port:
        description: |
          Port to listen on.
          Defaults to `8080`.
        type: number
        examples: [8080]
      conn_limit:
        description: |
          Maximum number of simultaneous connections.
          Defaults to `0` (unlimited).
        type: number
      server_idle_timeout:
        description: |
          Idle timeout for connections.
          Defaults to `120s`.
        type: string
        format: go-duration
      server_read_timeout:
        description: |
          Read timeout for requests.
          Defaults to `30s`.
        type: string
        format: go-duration
      server_write_timeout:
        description: |
          Write timeout for responses.
          Defaults to `30s`.
        type: string
        format: go-duration
    additionalProperties: false

  operatorSelector:
    description: |
      Label selector restricting which PodMonitor/ServiceMonitor resources the
      operator component picks up.

      Only `match_labels` is typed; the repeatable `match_expression` block uses
      the `raw:` escape.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.operator.podmonitors/#selector-block
    type: object
    properties:
      match_labels:
        description: |
          Map of label name to value; a resource must carry all of them to match.
        type: object
        additionalProperties:
          type: string
      blocks:
        description: |
          `match_expression` blocks (set-based selectors), via the `raw:` escape.
        $ref: "#/$defs/rawOnlyBlock"
    additionalProperties: false

  operatorScrape:
    description: |
      Default scrape settings applied to targets discovered by the operator
      component (overridable per PodMonitor/ServiceMonitor).

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.operator.podmonitors/#scrape-block
    type: object
    properties:
      default_scrape_interval:
        description: |
          Default scrape interval when a monitor doesn't specify one.
          Defaults to `1m`. Accepts an expression, so it can be wired to an
          environment variable.
        $ref: "#/$defs/expressionOrDuration"
      default_scrape_timeout:
        description: |
          Default scrape timeout when a monitor doesn't specify one.
          Defaults to `10s`. Accepts an expression, so it can be wired to an
          environment variable.
        $ref: "#/$defs/expressionOrDuration"
      default_sample_limit:
        description: |
          Default per-scrape sample limit when a monitor doesn't specify one.
        type: number
      honor_metadata:
        description: |
          When true, keep metric metadata (type/help) reported by the target.
        type: boolean
      scrape_native_histograms:
        description: |
          When true, scrape native histogram samples.
        type: boolean
      enable_type_and_unit_labels:
        description: |
          When true, expose metric type and unit as labels.
        type: boolean
    additionalProperties: false

  remoteWriteEndpoint:
    description: |
      One remote-write destination for `prometheus.remote_write`.

      Only `url` and common scalars are typed. Auth (`basic_auth`, `oauth2`,
      `authorization`, `tls_config`), `queue_config`, `metadata_config`, and
      `write_relabel_config` are reachable via a `raw:` block nested in `blocks`.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.remote_write/#endpoint-block
    type: object
    properties:
      url:
        description: |
          Full URL of the remote-write endpoint. Accepts an expression, so it
          can be wired to an environment variable with an in-cluster default.
        anyOf:
          - type: string
          - $ref: "./common/expression.schema.yaml"
      name:
        description: |
          Optional human-readable name for the endpoint (surfaced in metrics).
        type: string
      remote_timeout:
        description: |
          Timeout for requests to the endpoint.
          Defaults to `30s`.
        type: string
        format: go-duration
      headers:
        description: |
          Extra HTTP headers to send with every remote-write request.
        type: object
        additionalProperties:
          type: string
      send_exemplars:
        description: |
          When true (default), send exemplars along with samples.
        type: boolean
      send_native_histograms:
        description: |
          When true, send native histogram samples.
        type: boolean
      enable_http2:
        description: |
          When true, allow HTTP/2 for remote-write requests.
        type: boolean
      follow_redirects:
        description: |
          When true (default), follow HTTP 3xx redirects.
        type: boolean
      blocks:
        description: |
          Nested endpoint blocks (`basic_auth`, `tls_config`, `queue_config`,
          `write_relabel_config`, ...) via the `raw:` escape.
        $ref: "#/$defs/rawOnlyBlock"
    required: [url]
    additionalProperties: false

  expressionOrStringList:
    description: |
      A `list(string)` attribute that may instead come from an expression — for
      example `encoding.from_json(sys.env("VAR"))`, which is how a JSON array in
      an environment variable becomes a list here.

      The members of a literal list may themselves be expressions, such as
      `[argument.region.value]` inside a `declare` body.

      Unlike a literal *map*, a literal *list* is shape-distinguishable from the
      expression object, so this union is unambiguous.
    oneOf:
      - type: array
        items:
          anyOf:
            - type: string
            - $ref: "./common/expression.schema.yaml"
      - $ref: "./common/expression.schema.yaml"

  prometheus.exporter.cadvisor:
    description: |
      Runs cAdvisor in-process and exports per-container resource metrics as
      scrape targets.

      Two argument interactions are easy to get wrong:

        * A NON-EMPTY `enabled_metrics` replaces `disabled_metrics` outright
          rather than merging per collector — it is the exhaustive list, not
          extras on top. Empty means "unset", leaving `disabled_metrics` in
          charge.
        * `allowlisted_container_labels` is honored ONLY when
          `store_container_labels` is false. Left at its `true` upstream
          default, every container label becomes a metric label, which in
          Kubernetes means every pod label on every container series.

      Reading container metadata needs the CRI socket mounted into the pod
      (`containerd_host`, default `/run/containerd/containerd.sock`); without it
      the `io.kubernetes.*` labels never appear.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.exporter.cadvisor/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      enabled_metrics:
        description: |
          Collectors to enable. A non-empty list overrides `disabled_metrics`
          entirely.
        $ref: "#/$defs/expressionOrStringList"
      disabled_metrics:
        description: |
          Collectors to disable, overriding cAdvisor's own default-disabled set.
        $ref: "#/$defs/expressionOrStringList"
      store_container_labels:
        description: |
          Promote every container label and environment variable to metric
          labels. Defaults to true upstream; false is almost always correct in
          Kubernetes.
        type: boolean
      allowlisted_container_labels:
        description: |
          Container labels to promote. Honored only when
          `store_container_labels` is false.
        $ref: "#/$defs/expressionOrStringList"
      env_metadata_allowlist:
        description: Environment-variable prefixes to collect for containers.
        $ref: "#/$defs/expressionOrStringList"
      raw_cgroup_prefix_allowlist:
        description: cgroup path prefixes to collect even under `docker_only`.
        $ref: "#/$defs/expressionOrStringList"
      docker_only:
        description: Report only Docker containers plus root stats.
        type: boolean
      disable_root_cgroup_stats:
        description: Skip the root cgroup's own stats.
        type: boolean
      docker_host:
        description: Docker endpoint.
        anyOf:
          - type: string
          - $ref: "./common/expression.schema.yaml"
      containerd_host:
        description: |
          containerd socket path. Defaults to
          `/run/containerd/containerd.sock`, which must be mounted into the pod.
        anyOf:
          - type: string
          - $ref: "./common/expression.schema.yaml"
      containerd_namespace:
        description: containerd namespace to read. Defaults to `k8s.io`.
        anyOf:
          - type: string
          - $ref: "./common/expression.schema.yaml"
      storage_duration:
        description: How long to retain samples in memory.
        type: string
        format: go-duration
      resctrl_interval:
        description: Interval for refreshing resctrl monitoring groups.
        type: string
        format: go-duration
      perf_events_config:
        description: |
          Path to a perf-events configuration file, required by the
          `perf_event` collector.
        anyOf:
          - type: string
          - $ref: "./common/expression.schema.yaml"
    additionalProperties: false

  prometheus.exporter.cloudwatch:
    description: |
      Pulls CloudWatch metrics through the embedded YACE exporter and exports
      them as a scrape target.

      Three behaviours decide how this is used on a clustered gateway:

        * AWS is called ON SCRAPE, so a clustered `prometheus.scrape` owning the
          target is the only replica that calls it. `decoupled_scraping`
          (reachable through `raw:`) polls on a timer in EVERY replica, owner
          or not, and multiplies the bill by the replica count.
        * The exported target's `instance` is a hash of these arguments. It is
          the same on every replica, and it changes whenever an argument does,
          which re-labels every series. Pin it with a `discovery.relabel`.
        * `nil_to_zero` defaults to TRUE in Alloy, which reports a value-less
          datapoint as zero. Set it false on each job.

      `custom_namespace` and `decoupled_scraping` are deferred to the `raw:`
      escape. The deprecated no-op `debug` and `aws_sdk_version_v2` are not
      modelled.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.exporter.cloudwatch/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      sts_region:
        description: |
          Region for STS, which role assumption and the `account_id` label use.
        $ref: "#/$defs/expressionOrString"
      fips_disabled:
        description: Do not use FIPS endpoints. Defaults to true.
        type: boolean
      labels_snake_case:
        description: Snake-case the `dimension_*` label names.
        type: boolean
      discovery_exported_tags:
        description: |
          Per discovery namespace, the resource tags to copy onto every series
          of that namespace, as `tag_<key>`. Every `discovery` job also emits an
          `aws_<service>_info` series carrying ALL of a resource's tags, whatever
          this says; drop it downstream if tags are free text.
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      blocks:
        description: "`static` and `discovery` jobs, plus anything else through `raw:`."
        type: array
        items:
          $ref: "#/$defs/cloudwatchSubBlock"
    required: [sts_region]
    additionalProperties: false

  cloudwatchSubBlock:
    description: |
      One sub-block in a `prometheus.exporter.cloudwatch` body.
      The final `raw` branch is the escape hatch, and the way to reach
      `custom_namespace` and `decoupled_scraping`.
    oneOf:
      - type: object
        properties:
          static:
            $ref: "#/$defs/cloudwatchStatic"
        required: [static]
        additionalProperties: false
      - type: object
        properties:
          discovery:
            $ref: "#/$defs/cloudwatchDiscovery"
        required: [discovery]
        additionalProperties: false
      - $ref: "./common/raw.schema.yaml"

  cloudwatchStatic:
    description: |
      A `static "<name>"` job: one resource, addressed by its exact dimensions,
      read through `GetMetricStatistics`.

      The label becomes every series' `name` label and must be an identifier.
      `period` and `length` belong on each `metric`; the exporter ignores them
      on the job.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.exporter.cloudwatch/#static-block
    type: object
    properties:
      label:
        description: The job name. Written to every series as `name`.
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      regions:
        description: Regions to query. Members may be expressions.
        $ref: "#/$defs/expressionOrStringList"
      namespace:
        description: CloudWatch namespace, such as `AWS/RDS`.
        type: string
      dimensions:
        description: |
          The exact dimension set of the resource. Values may be expressions,
          which is how a `declare` body names its resource.
        type: object
        additionalProperties:
          anyOf:
            - type: string
            - $ref: "./common/expression.schema.yaml"
      custom_tags:
        description: Extra labels, written as `custom_tag_<key>`.
        type: object
        additionalProperties:
          type: string
      nil_to_zero:
        description: |
          Report a value-less datapoint as zero. Defaults to TRUE in Alloy;
          false keeps absence distinguishable from zero.
        type: boolean
      blocks:
        description: "`metric` and `role` blocks."
        type: array
        items:
          $ref: "#/$defs/cloudwatchJobSubBlock"
    required: [label, regions, namespace, dimensions]
    additionalProperties: false

  cloudwatchDiscovery:
    description: |
      A `discovery` job: every resource of a namespace whose tags match, read
      through `GetMetricData`.

      Resources are found through the Resource Groups Tagging API
      (`tag:GetResources`), or `autoscaling:DescribeAutoScalingGroups` for
      `AWS/AutoScaling`, and their metrics through `ListMetrics`. Each
      `search_tags` value is an unanchored regular expression, and all must
      match.

      A metric whose dimensions name no discovered resource is kept too, as a
      series with `name="global"`: for `AWS/EC2` that is the per-group
      aggregate of every Auto Scaling group in the region, whoever owns it.
      `dimension_name_requirements` is what keeps them out.

      Unlike a `static` job, a discovery job has no label, and its series carry
      the resource ARN as `name`.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.exporter.cloudwatch/#discovery-block
    type: object
    properties:
      type:
        description: The namespace to discover, such as `AWS/EC2`.
        type: string
      regions:
        description: Regions to search. Members may be expressions.
        $ref: "#/$defs/expressionOrStringList"
      search_tags:
        description: |
          Tag key to value regular expression, all of which must match. Keys may
          contain `:` and `/`; values may be expressions.
        type: object
        additionalProperties:
          anyOf:
            - type: string
            - $ref: "./common/expression.schema.yaml"
      custom_tags:
        description: Extra labels, written as `custom_tag_<key>`.
        type: object
        additionalProperties:
          type: string
      dimension_name_requirements:
        description: |
          Keep only metrics whose dimension names are exactly these. Without it
          a namespace's aggregate series are pulled and billed as well.
        type: array
        items:
          type: string
      recently_active_only:
        description: Only list metrics with a datapoint in the last three hours.
        type: boolean
      nil_to_zero:
        description: |
          Report a value-less datapoint as zero. Defaults to TRUE in Alloy;
          false keeps absence distinguishable from zero.
        type: boolean
      blocks:
        description: "`metric` and `role` blocks."
        type: array
        items:
          $ref: "#/$defs/cloudwatchJobSubBlock"
    required: [type, regions]
    additionalProperties: false

  cloudwatchJobSubBlock:
    description: |
      One sub-block in a CloudWatch job.
      The final `raw` branch is the escape hatch.
    oneOf:
      - type: object
        properties:
          metric:
            $ref: "#/$defs/cloudwatchMetric"
        required: [metric]
        additionalProperties: false
      - type: object
        properties:
          role:
            $ref: "#/$defs/cloudwatchRole"
        required: [role]
        additionalProperties: false
      - $ref: "./common/raw.schema.yaml"

  cloudwatchMetric:
    description: |
      One CloudWatch metric and the statistics to request for it. Each
      statistic is a separately billed series.

      On a `static` job the list needs at least one of `Average`, `Minimum`,
      `Maximum`, `Sum` or `SampleCount` beside any percentile, because the
      exporter indexes that list unconditionally.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.exporter.cloudwatch/#metric-block
    type: object
    properties:
      name:
        description: The CloudWatch metric name.
        type: string
      statistics:
        description: Statistics to request.
        type: array
        items:
          type: string
          pattern: "^(Average|Minimum|Maximum|Sum|SampleCount|p(\\d{1,2}(\\.\\d{0,2})?|100))$"
        minItems: 1
      period:
        description: Statistic period. Defaults to 300s.
        type: string
        format: go-duration
      length:
        description: How far back to request. Defaults to `period`, and must not be shorter.
        type: string
        format: go-duration
      nil_to_zero:
        description: Report a value-less datapoint as zero.
        type: boolean
      add_cloudwatch_timestamp:
        description: |
          Stamp samples with CloudWatch's timestamp rather than the scrape's.
          A daily metric stamped a day back is older than a remote-write
          receiver accepts.
        type: boolean
    required: [name, statistics]
    additionalProperties: false

  cloudwatchRole:
    description: |
      An IAM role to assume for the job. Without one the job uses the ambient
      AWS credential chain: IRSA, EKS Pod Identity, or static keys.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.exporter.cloudwatch/#role-block
    type: object
    properties:
      role_arn:
        description: ARN of the role to assume.
        $ref: "#/$defs/expressionOrString"
      external_id:
        description: External ID presented when assuming the role.
        $ref: "#/$defs/expressionOrString"
    required: [role_arn]
    additionalProperties: false

  prometheus.exporter.gcp:
    description: |
      Pulls Cloud Monitoring time series through the embedded
      `stackdriver_exporter` and exports them as a scrape target. Google Cloud
      is called on scrape, as with the CloudWatch exporter.

      Four behaviours decide how this is used:

        * Each `metrics_prefixes` entry is a PREFIX:
          `.../postgresql/num_backends` also pulls `num_backends_by_state`.
        * An `extra_filters` entry is `<prefix>:<filter>`, split on the FIRST
          colon and ANDed onto every metric type under that prefix. The prefix
          must start some `metrics_prefixes` entry or the config is refused.
          Without a filter, a prefix pulls every resource in the project.
        * Samples carry Cloud Monitoring's own timestamps, minutes old.
        * DELTA metrics become counters built from the newest point of each
          pull only, so a DELTA sampled more often than the scrape under-counts.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.exporter.gcp/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      project_ids:
        description: Projects to read.
        $ref: "#/$defs/expressionOrStringList"
      metrics_prefixes:
        description: Metric-type prefixes to pull.
        $ref: "#/$defs/expressionOrStringList"
      extra_filters:
        description: "`<prefix>:<filter>` entries narrowing what each prefix pulls."
        $ref: "#/$defs/expressionOrStringList"
      request_interval:
        description: |
          How far back each pull reaches. Only the newest point per series is
          kept. Defaults to 5m.
        $ref: "#/$defs/expressionOrDuration"
      request_offset:
        description: Shift the window back by this much. Defaults to 0.
        type: string
        format: go-duration
      ingest_delay:
        description: Shift the window back by each metric type's published ingest delay.
        type: boolean
      drop_delegated_projects:
        description: Drop series from projects other than the one being read.
        type: boolean
      gcp_client_timeout:
        description: HTTP timeout for the Cloud Monitoring client. Defaults to 15s.
        type: string
        format: go-duration
    required: [project_ids, metrics_prefixes]
    additionalProperties: false

  prometheus.exporter.azure:
    description: |
      Pulls Azure Monitor metrics through the embedded `azure-metrics-exporter`
      and exports them as a scrape target. Azure is called on scrape, as with
      the CloudWatch exporter, and the credential is resolved on the first
      call rather than when the component is built.

      Four behaviours decide how this is used:

        * Each scrape runs one Resource Graph query for `resource_type`,
          narrowed by `resource_graph_query_filter`, then one metrics call per
          resource per twenty metrics. Without a filter it pulls every resource
          of that type the identity can read.
        * `metric_aggregations` applies to EVERY metric in the block. A metric
          that needs a different aggregation asks for both, and the unwanted
          series are dropped downstream.
        * Only the newest datapoint of `timespan` with a value is kept, at
          `interval` granularity. The window ends at the scrape, so that
          datapoint is usually a partial bucket. Samples carry the scrape's
          timestamp.
        * `included_resource_tags` defaults to `["owner"]`, which turns a
          resource tag into a label on every series.

      See: https://grafana.com/docs/alloy/latest/reference/components/prometheus/prometheus.exporter.azure/
    type: object
    properties:
      label:
        $ref: "#/$defs/label"
      subscriptions:
        description: Subscriptions to query.
        $ref: "#/$defs/expressionOrStringList"
      resource_type:
        description: The Resource Graph resource type, such as `Microsoft.DBforPostgreSQL/flexibleServers`.
        type: string
      metrics:
        description: Azure Monitor metric names, up to twenty per call.
        $ref: "#/$defs/expressionOrStringList"
      resource_graph_query_filter:
        description: A Kusto clause appended to the Resource Graph query after a `|`.
        $ref: "#/$defs/expressionOrString"
      metric_aggregations:
        description: |
          Aggregations to request for every metric: `average`, `minimum`,
          `maximum`, `total` or `count`. Defaults to each metric's primary one.
        $ref: "#/$defs/expressionOrStringList"
      timespan:
        description: ISO 8601 window each pull reads, ending at the scrape. Defaults to `PT5M`.
        type: string
        pattern: "^P"
      interval:
        description: ISO 8601 datapoint granularity. Defaults to `PT1M`.
        type: string
        pattern: "^P"
      metric_namespace:
        description: Sub-namespace for resource types with several, such as `Microsoft.Storage/storageAccounts/blobServices`.
        type: string
      included_dimensions:
        description: Dimensions to split each metric by. Every one applies to every metric.
        $ref: "#/$defs/expressionOrStringList"
      included_resource_tags:
        description: Resource tags to copy onto every series. Defaults to `["owner"]`.
        $ref: "#/$defs/expressionOrStringList"
      regions:
        description: Regions to read at subscription scope. Cannot be combined with `resource_graph_query_filter`.
        $ref: "#/$defs/expressionOrStringList"
      azure_cloud_environment:
        description: "`azurecloud`, `azurechinacloud` or `azureusgovernmentcloud`. Defaults to `azurecloud`."
        $ref: "#/$defs/expressionOrString"
      validate_dimensions:
        description: Refuse a dimension a metric does not have. Defaults to false.
        type: boolean
    required: [subscriptions, resource_type, metrics]
    additionalProperties: false
    not:
      required: [regions, resource_graph_query_filter]
