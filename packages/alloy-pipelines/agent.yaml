# yaml-language-server: $schema=../mzmon-lib/schemas/alloy/mzmon-alloy.schema.yaml
# Alloy agent pipeline definitions.
# These are processed by mz-monitoring-build gen-pipelines to produce an agent.alloy config.

description: |
  This file defines the pipelines that run on alloy-agent.
  alloy-agent is responsible for scraping local data from its node
  and forwarding it to alloy-gateway for processing and export.

  Shape mirrors the staging agent: journal logs and node-local pod logs are
  collected, lightly relabeled, and forwarded to the gateway; a sampled debug
  tap echoes a slice of pod logs locally.

  A few values are configurable:
    - pod_logs `cluster` static label comes from sys.env("CLUSTER_NAME").
    - pod_logs `stage.limit` rate/burst are plain literals, tunable in place.
    - loki.write.gateway is a static stub for now (endpoint will gain richer
      configuration later).

logging:
  level: info
  format: logfmt

blocks:
  # --- systemd journal -> gateway -------------------------------------------

  # Relabel rules applied to journal entries before processing.
  - loki.relabel:
      label: journal
      forward_to: []
      blocks:
        - rule:
            action: replace
            source_labels: ["__journal__systemd_unit"]
            target_label: unit

  # Process journal entries: tag with the node's hostname, forward to gateway.
  - loki.process:
      label: node_logs
      forward_to: ["loki.write.gateway.receiver"]
      blocks:
        - stage.static_labels:
            values:
              # HOSTNAME is passed from the Alloy agent daemonset
              node:
                env: HOSTNAME

  # Read the host's systemd journal.
  - loki.source.journal:
      label: node_logs
      labels:
        component: loki.source.journal
      relabel_rules: loki.relabel.journal.rules
      forward_to: ["loki.process.node_logs.receiver"]

  # --- node-local pod logs -> gateway ---------------------------------------

  # Discover pods scheduled on this node and attach node/namespace metadata.
  - discovery.kubernetes:
      label: local_pods
      role: pod
      blocks:
        # `field` is an expression ("spec.nodeName=" + coalesce(...)); the typed
        # `selectors.field` is Expressable, so it accepts a literal or expression.
        - selectors:
            role: pod
            field:
              operator: "+"
              arguments:
                - "spec.nodeName="
                - function: coalesce
                  arguments:
                    - env: HOSTNAME
                    - ref: constants.hostname
        - attach_metadata:
            node: true
            namespace: true

  # Normalize discovered pod metadata into stable label names and a log path.
  - discovery.relabel:
      label: local_pods
      targets: ["discovery.kubernetes.local_pods.targets"]
      blocks:
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_namespace"]
            target_label: namespace
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_name"]
            target_label: pod
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_node_name"]
            target_label: node
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_container_name"]
            target_label: container
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_uid"]
            target_label: pod_id
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_container_id"]
            target_label: container_id
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_ready"]
            target_label: pod_ready
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label: app
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
            target_label: component
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_node_label_workload"]
            target_label: node_workload
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_node_label_topology_kubernetes_io_region"]
            target_label: region
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_node_label_topology_kubernetes_io_zone"]
            target_label: zone
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_node_label_node_kubernetes_io_instance_type"]
            target_label: instance_type
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_node_label_karpenter_sh_nodepool"]
            target_label: nodepool
        - rule:
            action: replace
            source_labels: ["__meta_kubernetes_pod_label_materialize_cloud_organization_name"]
            target_label: organization_name
        - rule:
            action: replace
            source_labels:
              - "__meta_kubernetes_namespace"
              - "__meta_kubernetes_pod_container_name"
            separator: "/"
            target_label: job
        - rule:
            action: replace
            source_labels:
              - "__meta_kubernetes_pod_uid"
              - "__meta_kubernetes_pod_container_name"
            separator: "/"
            replacement: "/var/log/pods/*$1/*.log"
            target_label: __path__

  # Process pod logs: parse CRI, rate-limit, drop noisy labels, tag cluster.
  - loki.process:
      label: pod_logs
      forward_to: ["loki.write.gateway.receiver"]
      blocks:
        # Parse CRI-formatted log lines (empty block — presence is the config).
        - stage.cri: {}
        - stage.limit:
            # Tunable in place; rate is lines/sec, burst is the short-term ceiling.
            rate:
              # HACK: we don't get a to_int function, so this converts a string->int for us
              function: encoding.from_json
              arguments:
                - function: coalesce
                  arguments:
                    - env: AGENT_POD_LOG_RATE_LIMIT
                    - "5000"
            burst:
              # HACK: to_int
              function: encoding.from_json
              arguments:
                - function: coalesce
                  arguments:
                    - env: AGENT_POD_LOG_BURST
                    - "20000"
            drop: false
        - stage.label_drop:
            values: ["filename"]
        # CLUSTER_NAME is recommended to be set in the environment
        - stage.static_labels:
            values:
              cluster:
                env: CLUSTER_NAME

  # Tail the pod log files discovered above.
  # loki.source.file has no typed `blocks` support, and we need a `file_match`
  # sub-block, so the whole component is a raw escape.
  - raw:
      component: loki.source.file
      label: pod_logs
      attributes:
        targets:
          ref: discovery.relabel.local_pods.output
        forward_to:
          - ref: loki.process.pod_logs.receiver
      blocks:
        - component: file_match
          attributes:
            enabled: true

  # --- local sampled debug tap ----------------------------------------------

  # Echo a 1% sample of non-alloy pod logs locally for debugging.
  - loki.process:
      label: sampleDebug
      forward_to: ["loki.echo.stub.receiver"]
      blocks:
        - stage.drop:
            source: app
            value: alloy
            drop_counter_reason: "skip self"
        - stage.sampling:
            rate: 0.01
            drop_counter_reason: sampleDebug

  - loki.echo:
      label: stub

  # --- node-local container metrics -> gateway ------------------------------
  #
  # cAdvisor runs in-process here rather than being scraped off the kubelet.
  # The kubelet exposes whatever cAdvisor metrics *it* chooses and reaching it
  # needs the API-server proxy; running the exporter ourselves makes the metric
  # set ours and removes the proxy from the collection path. See the Terraform
  # modules design doc for the full argument.
  #
  # `prometheus.exporter.*` has no typed schema yet, so this is a `raw:` escape.
  # Harden it into `prometheus.schema.yaml` once the argument set settles.
  - raw:
      component: prometheus.exporter.cadvisor
      label: local
      attributes:
        # Collector selection, both from the environment as JSON arrays.
        #
        # Precedence is cAdvisor's own and is blunt: a NON-EMPTY enabled_metrics
        # replaces disabled_metrics outright rather than merging per collector.
        # So ALLOY_CADVISOR_ENABLED wins over ALLOY_CADVISOR_DISABLED — but
        # setting it also turns off every collector it does not name. Treat it as
        # "the exhaustive list", not "these extras on top".
        #
        # HACK: the `encoding.from_json` wrapper is the same string->typed
        # coercion used for stage.limit's rate/burst — sys.env returns a string
        # and these want list(string). Provisional, not a blessed pattern.
        enabled_metrics:
          function: encoding.from_json
          arguments:
            - function: coalesce
              arguments:
                - env: ALLOY_CADVISOR_ENABLED
                # Empty means "unset", which leaves disabled_metrics in charge.
                - "[]"
        disabled_metrics:
          function: encoding.from_json
          arguments:
            - function: coalesce
              arguments:
                - env: ALLOY_CADVISOR_DISABLED
                # cAdvisor's own default-disabled set, plus three we add:
                #
                #  * `percpu` — per-container x per-CPU. On a 96-vCPU node
                #    running 100 containers that one collector is ~10k series.
                #  * `perf_event` — emits nothing without `perf_events_config`,
                #    and wants perf_event_open privileges we do not grant.
                #  * `sched` — per-container scheduler detail whose cost
                #    outweighs its value outside an investigation.
                #
                # `process` stays disabled (as upstream has it) for a reason
                # worth knowing before turning it on: it is the only source of
                # `container_file_descriptors`, which some shipped infra alerts
                # read — but reading another container's fd count means reading
                # /proc/<pid>/fd, which needs the host PID namespace. With
                # `controller.hostPid: false` (our default) cAdvisor still emits
                # the series and reports **0** for every container but its own.
                # That is worse than absent: a "descriptors near the limit"
                # alert silently never fires. Enabling `process` therefore means
                # also setting `alloy-agent.controller.hostPid: true`, which is a
                # real privilege increase and an operator's call, not a default.
                # (`container_processes` / `container_threads` come from the
                # cgroup and are accurate either way.)
                #
                # Everything not listed here is collected: app, cpu, cpuLoad,
                # disk, diskIO, memory, network, oom_event — including the
                # per-container PSI series (`container_pressure_*`), which pair
                # with the node-level pressure metrics from node-exporter.
                - '["advtcp","cpu_topology","cpuset","hugetlb","memory_numa","percpu","perf_event","process","referenced_memory","resctrl","sched","tcp","udp"]'
        # Do NOT promote every container label to a metric label — in Kubernetes
        # that is every pod label on every container series. The allowlist below
        # keeps only the four the CRI sets, which are what carries pod identity;
        # `allowlisted_container_labels` is honored ONLY when this is false.
        store_container_labels: false
        allowlisted_container_labels:
          - io.kubernetes.pod.namespace
          - io.kubernetes.pod.name
          - io.kubernetes.pod.uid
          - io.kubernetes.container.name

  # Scrape the in-process exporter. Interval is the dominant cost lever for
  # per-container metrics, so it is env-driven like the gateway's.
  - prometheus.scrape:
      label: cadvisor
      job_name: cadvisor
      # A bare string is the ref form. `- ref: …` would deserialize as a literal
      # target map and render `targets = [{ref = "…"}]`, which `alloy validate`
      # accepts and `alloy run` rejects.
      targets: ["prometheus.exporter.cadvisor.local.targets"]
      forward_to: ["prometheus.relabel.cadvisor.receiver"]
      scrape_interval:
        function: coalesce
        arguments:
          - env: AGENT_CADVISOR_SCRAPE_INTERVAL
          - "60s"

  # Normalize cAdvisor's native label shape onto the one the dashboards and
  # alerts already use (`namespace` / `pod` / `container` / `node`), matching what
  # the kubelet-proxy ScrapeConfig produces. Without this the series are
  # unjoinable with everything else in the stack.
  - prometheus.relabel:
      label: cadvisor
      forward_to: ["otelcol.receiver.prometheus.cadvisorBridge.receiver"]
      blocks:
        - rule:
            action: replace
            source_labels: ["container_label_io_kubernetes_pod_namespace"]
            target_label: namespace
        - rule:
            action: replace
            source_labels: ["container_label_io_kubernetes_pod_name"]
            target_label: pod
        - rule:
            action: replace
            source_labels: ["container_label_io_kubernetes_pod_uid"]
            target_label: pod_id
        - rule:
            action: replace
            source_labels: ["container_label_io_kubernetes_container_name"]
            target_label: container
        # The node this DaemonSet pod runs on. `replacement` is a plain String on
        # the typed rule, so an env-derived value needs the raw escape. An empty
        # `source_labels` with the default `(.*)` regex is the standard
        # set-a-constant-label idiom.
        - raw:
            component: rule
            attributes:
              action: replace
              target_label: node
              replacement:
                function: coalesce
                arguments:
                  - env: HOSTNAME
                  - ref: constants.hostname
        # Drop the originals now that they have been copied to short names.
        - rule:
            action: labeldrop
            regex: "container_label_.*"
        # cAdvisor emits a series per cgroup, including the pod sandbox, which
        # carries the pod's labels but no container and duplicates the pod total.
        #
        # Deliberately keyed on "has a pod but no container" rather than the
        # simpler "container is empty". If the allowlist above ever stops
        # matching what the CRI sets — a containerd label rename, a different
        # runtime — then NOTHING gets a `container` label, and the simpler rule
        # would silently drop every series. This one drops nothing in that case,
        # so the failure surfaces as metrics with no pod label rather than as no
        # metrics at all.
        - rule:
            action: drop
            source_labels: ["pod", "container"]
            separator: ";"
            regex: ".+;"

  # --- OTLP egress to the gateway -------------------------------------------
  #
  # Metrics leave the agent as OTLP, landing on the gateway's
  # otelcol.receiver.otlp (grpc :4317), which feeds its metrics pipeline. Logs
  # still leave via loki.write above; folding them into this exporter is
  # tracked separately.

  # Bridge: converts the scraped Prometheus metrics into OTLP.
  # otelcol.receiver.* is not typed yet, so raw.
  - raw:
      component: otelcol.receiver.prometheus
      label: cadvisorBridge
      blocks:
        - component: output
          attributes:
            metrics:
              - ref: otelcol.exporter.otlp.gateway.input

  # Static stub, like loki.write.gateway above: the endpoint is the gateway and
  # nothing else. Richer/remote configuration comes later.
  - raw:
      component: otelcol.exporter.otlp
      label: gateway
      blocks:
        - component: client
          attributes:
            endpoint:
              function: coalesce
              arguments:
                - env: AGENT_OTLP_DEST
                - "alloy-gateway.alloy.svc:4317"
          blocks:
            # In-cluster hop to a sibling Deployment. TLS lands with the
            # cert-manager work, at which point this becomes configurable.
            - component: tls
              attributes:
                insecure: true

  # --- forwarding sink ------------------------------------------------------

  # Static stub: forwards everything to the alloy-gateway. This endpoint will
  # gain richer (per-tenant / configurable) wiring later.
  - raw:
      component: loki.write
      label: gateway
      blocks:
        - component: endpoint
          attributes:
            url:
              function: coalesce
              arguments:
                - env: AGENT_LOKI_DEST
                - "http://alloy-gateway.alloy.svc:3100/loki/api/v1/push"
