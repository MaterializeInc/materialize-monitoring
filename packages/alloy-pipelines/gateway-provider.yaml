# yaml-language-server: $schema=../mzmon-lib/schemas/alloy/mzmon-alloy.schema.yaml
# Alloy gateway cloud provider pulls, as custom components.
# These are processed by mz-monitoring-build gen-pipelines to produce a gateway-provider.alloy config.

description: |
  Custom components for the gateway's cloud provider pulls. This file deploys:
  the chart includes it in every gateway config, where it is inert until
  something instantiates it.

  The shape lives here, validated and typed; the count lives in the chart. Each
  `declare` below is one pull, with its metric set fixed, and the chart's
  `mzmon.alloyGateway.pipeline.provider` renders one instance per resource
  named in `pipeline.metrics.provider.*`. A `declare` body cannot repeat a
  block, which is why CloudWatch takes one instance per resource and why the
  metric sets are not values.

  Every pull ends in `provider_scrape`: the `instance` pin and the clustered
  scrape. Clustering is what makes the provider be called once per interval
  however many gateway replicas there are. Both exporters call the provider on
  scrape, and export an identical target on every replica, so exactly one
  replica owns it.

  `forward_to` is a single receiver, not a list: the chart passes
  `otelcol.receiver.prometheus.inputBridge.receiver`.

blocks:
  # --- the shared tail ---------------------------------------------------------

  - declare:
      label: provider_scrape
      blocks:
        - argument:
            label: targets
            comment: The exporter's targets export.
        - argument:
            label: instance
            comment: >-
              The `instance` label for every series. The exporter sets it to a
              hash of its own arguments, which changes whenever they do.
        - argument:
            label: forward_to
            comment: One metrics receiver.
        - argument:
            label: scrape_interval
        - argument:
            label: scrape_timeout
            comment: Must not exceed scrape_interval, or the gateway fails to start.
        - argument:
            label: honor_timestamps
            optional: true
            default: true
            comment: >-
              False stamps every sample at the scrape, for a pull whose newest
              point can be hours old and would otherwise be refused as stale.

        - discovery.relabel:
            label: pin
            targets: ["argument.targets.value"]
            blocks:
              - rule:
                  target_label: instance
                  replacement: {ref: argument.instance.value}

        - prometheus.scrape:
            label: provider
            targets: ["discovery.relabel.pin.output"]
            forward_to: ["argument.forward_to.value"]
            scrape_interval: {ref: argument.scrape_interval.value}
            scrape_timeout: {ref: argument.scrape_timeout.value}
            honor_timestamps: {ref: argument.honor_timestamps.value}
            # Typed, like the gateway's other scrapes; see gateway-metrics.yaml.
            honor_metadata: true
            blocks:
              - clustering:
                  enabled: true

  # --- CloudWatch ----------------------------------------------------------------

  # One RDS instance. Static jobs go through GetMetricStatistics, one call per
  # metric per pull, and each statistic is its own series.
  #
  # nil_to_zero is false on every job because Alloy defaults it to true, which
  # reports a value-less datapoint as zero. `period` and `length` sit on each
  # metric because the exporter ignores them on the job; a five-minute period
  # summarises the whole default interval rather than sampling one minute of
  # it, and the ten-minute length covers CloudWatch's publication delay.
  - declare:
      label: provider_cloudwatch_rds
      blocks:
        - argument:
            label: instance_id
            comment: The DBInstanceIdentifier.
        - argument: &region
            label: region
        - argument: &forward_to
            label: forward_to
        - argument: &scrape_interval
            label: scrape_interval
        - argument: &scrape_timeout
            label: scrape_timeout

        - prometheus.exporter.cloudwatch:
            label: rds
            sts_region: {ref: argument.region.value}
            blocks:
              - static:
                  label: rds
                  regions: [{ref: argument.region.value}]
                  namespace: AWS/RDS
                  nil_to_zero: false
                  dimensions:
                    DBInstanceIdentifier: {ref: argument.instance_id.value}
                  blocks:
                    # CPU, and the credit balance that throttles a burstable
                    # db.t* class. Absent on other classes.
                    - metric: {name: CPUUtilization, statistics: [Average, Maximum], period: 5m, length: 10m}
                    - metric: {name: CPUCreditBalance, statistics: [Minimum], period: 5m, length: 10m}
                    # Memory, storage and connection headroom.
                    - metric: {name: FreeableMemory, statistics: [Minimum], period: 5m, length: 10m}
                    - metric: {name: FreeStorageSpace, statistics: [Minimum], period: 5m, length: 10m}
                    - metric: {name: DatabaseConnections, statistics: [Maximum], period: 5m, length: 10m}
                    # I/O latency and queueing.
                    - metric: {name: ReadLatency, statistics: [Average], period: 5m, length: 10m}
                    - metric: {name: WriteLatency, statistics: [Average], period: 5m, length: 10m}
                    - metric: {name: DiskQueueDepth, statistics: [Average], period: 5m, length: 10m}
                    # The gp2/gp3 burst and EBS balances. Exhausting one slows
                    # every write while every in-database metric stays flat.
                    - metric: {name: BurstBalance, statistics: [Minimum], period: 5m, length: 10m}
                    - metric: {name: EBSIOBalance%, statistics: [Minimum], period: 5m, length: 10m}
                    - metric: {name: EBSByteBalance%, statistics: [Minimum], period: 5m, length: 10m}
                    # Transaction-ID consumption, the wraparound signal.
                    - metric: {name: MaximumUsedTransactionIDs, statistics: [Maximum], period: 5m, length: 10m}

        - custom:
            component: provider_scrape
            label: rds
            attributes:
              targets: {ref: prometheus.exporter.cloudwatch.rds.targets}
              instance: {ref: argument.instance_id.value}
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

  # One S3 bucket: size and object count, which S3 publishes once a day under
  # different StorageType dimensions, so two jobs. The 48-hour length is what
  # keeps the latest daily point in reach. Standard storage only: a bucket that
  # never transitions objects, which is every bucket the Terraform wrappers
  # create.
  - declare:
      label: provider_cloudwatch_s3
      blocks:
        - argument:
            label: bucket
            comment: The bucket name.
        - argument: *region
        - argument: *forward_to
        - argument: *scrape_interval
        - argument: *scrape_timeout

        - prometheus.exporter.cloudwatch:
            label: s3
            sts_region: {ref: argument.region.value}
            blocks:
              - static:
                  label: s3
                  regions: [{ref: argument.region.value}]
                  namespace: AWS/S3
                  nil_to_zero: false
                  dimensions:
                    BucketName: {ref: argument.bucket.value}
                    StorageType: StandardStorage
                  blocks:
                    - metric: {name: BucketSizeBytes, statistics: [Average], period: 24h, length: 48h}
              - static:
                  label: s3
                  regions: [{ref: argument.region.value}]
                  namespace: AWS/S3
                  nil_to_zero: false
                  dimensions:
                    BucketName: {ref: argument.bucket.value}
                    StorageType: AllStorageTypes
                  blocks:
                    - metric: {name: NumberOfObjects, statistics: [Average], period: 24h, length: 48h}

        - custom:
            component: provider_scrape
            label: s3
            attributes:
              targets: {ref: prometheus.exporter.cloudwatch.s3.targets}
              instance: {ref: argument.bucket.value}
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

  # Every listed EKS cluster's nodes in one region, and the region's On-Demand
  # vCPU usage: whether the provider can supply the instances an autoscaler
  # asks for, and whether the ones it supplied are healthy. One instance per
  # service, as with Cloud Monitoring, since the tag filters name every cluster.
  #
  # Nodes are found by tag rather than named, because Karpenter and the node
  # groups replace them. EKS tags every node it or Karpenter launches with
  # `aws:eks:cluster-name`, and every managed node group's Auto Scaling group
  # with `eks:cluster-name`. Each value is an unanchored regex, so the names
  # are anchored and joined here; the chart refuses names with other
  # characters. Without `dimension_name_requirements`, each EC2 metric would
  # also pull the per-group aggregate of every Auto Scaling group in the
  # region, whoever owns it.
  #
  # Status checks: `System` is the host, which only AWS can repair, `Instance`
  # is the node's own OS, and `AttachedEBS` is an EBS volume the node cannot
  # reach. Group sizes: desired capacity above in-service instances for more
  # than a launch is the provider not supplying instances. Karpenter's pools
  # have no group; its own metrics cover them.
  #
  # Usage: the vCPUs of running On-Demand instances in the standard families
  # (A, C, D, H, I, M, R, T, Z), account-wide, which is what the quota counts.
  # CloudWatch does not publish the quota itself; that is the Service Quotas
  # console's `L-1216C47A`.
  #
  # Every discovery job also writes an `aws_<service>_info` series with ALL of
  # a resource's tags, whatever `discovery_exported_tags` says. Tags are free
  # text that can name anyone, so the relabel below drops them. The two kept
  # tags are set by EKS and Karpenter.
  - declare:
      label: provider_cloudwatch_eks
      blocks:
        - argument:
            label: clusters
            comment: EKS cluster names.
        - argument: *region
        - argument: *forward_to
        - argument: *scrape_interval
        - argument: *scrape_timeout

        - prometheus.exporter.cloudwatch:
            label: eks
            sts_region: {ref: argument.region.value}
            discovery_exported_tags:
              AWS/EC2: [karpenter.sh/nodepool, eks:nodegroup-name]
              AWS/AutoScaling: [eks:nodegroup-name]
            blocks:
              - discovery:
                  type: AWS/EC2
                  regions: [{ref: argument.region.value}]
                  search_tags:
                    aws:eks:cluster-name: &eks_cluster_names
                      function: string.format
                      arguments:
                        - "^(%s)$"
                        - function: string.join
                          arguments:
                            - {ref: argument.clusters.value}
                            - "|"
                  dimension_name_requirements: [InstanceId]
                  nil_to_zero: false
                  blocks:
                    - metric: {name: StatusCheckFailed_System, statistics: [Maximum], period: 5m, length: 10m}
                    - metric: {name: StatusCheckFailed_Instance, statistics: [Maximum], period: 5m, length: 10m}
                    - metric: {name: StatusCheckFailed_AttachedEBS, statistics: [Maximum], period: 5m, length: 10m}
              - discovery:
                  type: AWS/AutoScaling
                  regions: [{ref: argument.region.value}]
                  search_tags:
                    eks:cluster-name: *eks_cluster_names
                  dimension_name_requirements: [AutoScalingGroupName]
                  nil_to_zero: false
                  blocks:
                    - metric: {name: GroupDesiredCapacity, statistics: [Average], period: 5m, length: 10m}
                    - metric: {name: GroupInServiceInstances, statistics: [Average], period: 5m, length: 10m}
                    - metric: {name: GroupPendingInstances, statistics: [Average], period: 5m, length: 10m}
                    - metric: {name: GroupMaxSize, statistics: [Average], period: 5m, length: 10m}
              - static:
                  label: vcpu
                  regions: [{ref: argument.region.value}]
                  namespace: AWS/Usage
                  nil_to_zero: false
                  dimensions:
                    Service: EC2
                    Type: Resource
                    Resource: vCPU
                    Class: Standard/OnDemand
                  blocks:
                    - metric: {name: ResourceCount, statistics: [Maximum], period: 5m, length: 10m}

        - custom:
            component: provider_scrape
            label: eks
            attributes:
              targets: {ref: prometheus.exporter.cloudwatch.eks.targets}
              instance: eks
              forward_to: {ref: prometheus.relabel.eks.receiver}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

        - prometheus.relabel:
            label: eks
            forward_to: ["argument.forward_to.value"]
            blocks:
              - rule:
                  action: drop
                  source_labels: [__name__]
                  regex: "aws_[a-z0-9]+_info"

  # --- Cloud Monitoring -----------------------------------------------------------

  # Every listed Cloud SQL instance in one project. One instance per service
  # rather than per resource: the filter names them all, and without it the
  # prefixes would pull every instance in the project.
  #
  # Each entry is a prefix, as the exporter matches them: `num_backends` also
  # pulls `num_backends_by_state`, and `up` also pulls `uptime`. The filter is
  # split on its first colon, so a `project:instance` database_id survives.
  - declare:
      label: provider_gcp_cloudsql
      blocks:
        - argument: &project_id
            label: project_id
        - argument:
            label: database_ids
            comment: Cloud SQL database_ids, as project:instance.
        - argument: &request_interval
            label: request_interval
            comment: How far back each pull reaches. Only the newest point per series is kept.
        - argument: *forward_to
        - argument: *scrape_interval
        - argument: *scrape_timeout

        - prometheus.exporter.gcp:
            label: cloudsql
            project_ids: [{ref: argument.project_id.value}]
            metrics_prefixes:
              - cloudsql.googleapis.com/database/cpu/utilization
              - cloudsql.googleapis.com/database/memory/utilization
              - cloudsql.googleapis.com/database/disk/utilization
              - cloudsql.googleapis.com/database/postgresql/num_backends
              - cloudsql.googleapis.com/database/postgresql/transaction_id_utilization
              - cloudsql.googleapis.com/database/up
            extra_filters:
              - function: string.format
                arguments:
                  - 'cloudsql.googleapis.com/database:resource.labels.database_id=one_of("%s")'
                  - function: string.join
                    arguments:
                      - {ref: argument.database_ids.value}
                      - '","'
            request_interval: {ref: argument.request_interval.value}
            ingest_delay: true

        - custom:
            component: provider_scrape
            label: cloudsql
            attributes:
              targets: {ref: prometheus.exporter.gcp.cloudsql.targets}
              instance: cloudsql
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

  # Every listed GCS bucket in one project. The v2 storage metrics split bytes
  # and objects into live, noncurrent and soft-deleted, which shows reclaimable
  # waste. `api/request_count` is deliberately absent: it is a per-minute
  # DELTA, and the exporter counts only the newest point of each pull, so it
  # would read about a fifth of the truth.
  - declare:
      label: provider_gcp_gcs
      blocks:
        - argument: *project_id
        - argument:
            label: buckets
            comment: GCS bucket names.
        - argument: *request_interval
        - argument: *forward_to
        - argument: *scrape_interval
        - argument: *scrape_timeout

        - prometheus.exporter.gcp:
            label: gcs
            project_ids: [{ref: argument.project_id.value}]
            metrics_prefixes:
              - storage.googleapis.com/storage/v2/total_bytes
              - storage.googleapis.com/storage/v2/total_count
            extra_filters:
              - function: string.format
                arguments:
                  - 'storage.googleapis.com:resource.labels.bucket_name=one_of("%s")'
                  - function: string.join
                    arguments:
                      - {ref: argument.buckets.value}
                      - '","'
            request_interval: {ref: argument.request_interval.value}
            ingest_delay: true

        - custom:
            component: provider_scrape
            label: gcs
            attributes:
              targets: {ref: prometheus.exporter.gcp.gcs.targets}
              instance: gcs
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

  # Compute Engine quota in every listed region and its zones: the CPUs and
  # local SSD each machine family may use, against its limit, and each refusal
  # for want of either. A node pool that cannot grow for quota fails exactly
  # like one that cannot grow for capacity, and only this says which.
  #
  # Families such as C4 and C4A have quotas of their own, which these are; the
  # regional `CPUS` quota covers only the older families, and reads zero on a
  # cluster that uses none. A family appears only once something in the project
  # uses it. Zonal limits read 2^63 − 1 where no zonal quota applies.
  #
  # Usage and limit are published hours apart, not every minute: measured on
  # 2026-09-30, three points a day. So the state pull reaches back a day, and
  # is stamped at the scrape, as a daily S3 datapoint is; a sample stamped
  # hours back is older than the bundled Thanos Receive accepts. `exceeded` is
  # a DELTA written only when a request is refused, so it keeps its own
  # timestamps and the usual window, and becomes a counter.
  #
  # Each location is matched whole, so `europe-west1` does not match
  # `europe-west10`.
  - declare:
      label: provider_gcp_compute_quota
      blocks:
        - argument: *project_id
        - argument:
            label: regions
            comment: Compute Engine regions, such as us-east1.
        - argument: *request_interval
        - argument: *forward_to
        - argument: *scrape_interval
        - argument: *scrape_timeout

        - prometheus.exporter.gcp:
            label: quota
            project_ids: [{ref: argument.project_id.value}]
            metrics_prefixes:
              - compute.googleapis.com/quota/cpus_per_vm_family/usage
              - compute.googleapis.com/quota/cpus_per_vm_family/limit
              - compute.googleapis.com/quota/local_ssd_total_storage_per_vm_family/usage
              - compute.googleapis.com/quota/local_ssd_total_storage_per_vm_family/limit
            extra_filters: &compute_quota_locations
              - function: string.format
                arguments:
                  - 'compute.googleapis.com/quota:resource.labels.location=monitoring.regex.full_match("(%s)(-[a-z])?")'
                  - function: string.join
                    arguments:
                      - {ref: argument.regions.value}
                      - "|"
            request_interval: 24h
            ingest_delay: true

        - prometheus.exporter.gcp:
            label: quota_exceeded
            project_ids: [{ref: argument.project_id.value}]
            metrics_prefixes:
              - compute.googleapis.com/quota/cpus_per_vm_family/exceeded
              - compute.googleapis.com/quota/local_ssd_total_storage_per_vm_family/exceeded
            extra_filters: *compute_quota_locations
            request_interval: {ref: argument.request_interval.value}
            ingest_delay: true

        - custom:
            component: provider_scrape
            label: quota
            attributes:
              targets: {ref: prometheus.exporter.gcp.quota.targets}
              instance: compute_quota
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}
              honor_timestamps: false

        - custom:
            component: provider_scrape
            label: quota_exceeded
            attributes:
              targets: {ref: prometheus.exporter.gcp.quota_exceeded.targets}
              instance: compute_quota_exceeded
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

  # --- Azure Monitor --------------------------------------------------------------

  # Every listed PostgreSQL Flexible Server in one subscription. One instance
  # per service, as with Cloud Monitoring: each scrape is one Resource Graph
  # query that the filter narrows to the named servers, then one metrics call
  # per server, since the set is under Azure's twenty-per-call limit. Names are
  # unique across Azure, so no resource group is needed.
  #
  # `metric_aggregations` applies to every metric in the call, so the call asks
  # for all four and the `keep` below drops what no metric here uses. The result
  # is one or two series per metric, as on CloudWatch.
  #
  # A five-minute interval summarises the whole default scrape interval rather
  # than sampling one minute of it. The window ends at the scrape, so the newest
  # bucket is a minute or so short: fine for the averages and extremes, and a
  # lower bound for `connections_failed`, where any value above zero is the
  # signal. Resource tags are not copied, since they are free text that could
  # name anyone.
  - declare:
      label: provider_azure_postgres
      blocks:
        - argument: &subscription_id
            label: subscription_id
        - argument:
            label: servers
            comment: Flexible Server names, not FQDNs or resource IDs.
        - argument: &cloud_environment
            label: cloud_environment
            comment: azurecloud, azurechinacloud or azureusgovernmentcloud.
        - argument: *forward_to
        - argument: *scrape_interval
        - argument: *scrape_timeout

        - prometheus.exporter.azure:
            label: postgres
            subscriptions: [{ref: argument.subscription_id.value}]
            resource_type: Microsoft.DBforPostgreSQL/flexibleServers
            resource_graph_query_filter:
              function: string.format
              arguments:
                - "where name in~ ('%s')"
                - function: string.join
                  arguments:
                    - {ref: argument.servers.value}
                    - "','"
            metrics:
              # CPU, and the credit balance that throttles a Burstable tier.
              # Absent on other tiers.
              - cpu_percent
              - cpu_credits_remaining
              # Memory, storage and connection headroom, and refused connections.
              - memory_percent
              - storage_percent
              - active_connections
              - connections_failed
              # Queueing, and how much of the disk's provisioned IOPS and
              # throughput is in use. At 100% the disk throttles every write
              # while every in-database metric stays flat.
              - disk_queue_depth
              - disk_iops_consumed_percentage
              - disk_bandwidth_consumed_percentage
              # Transaction-ID consumption, the wraparound signal.
              - maximum_used_transactionIDs
              # Whether Azure could reach the server.
              - is_db_alive
            metric_aggregations: [average, maximum, minimum, total]
            interval: PT5M
            timespan: PT10M
            included_resource_tags: []
            azure_cloud_environment: {ref: argument.cloud_environment.value}

        - custom:
            component: provider_scrape
            label: postgres
            attributes:
              targets: {ref: prometheus.exporter.azure.postgres.targets}
              instance: postgres
              forward_to: {ref: prometheus.relabel.postgres.receiver}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

        # The series each metric keeps, and the scrape's own `up` and
        # `scrape_*`. Names are the exporter's
        # `azure_{type}_{metric}_{aggregation}_{unit}`, lowercased.
        - prometheus.relabel:
            label: postgres
            forward_to: ["argument.forward_to.value"]
            blocks:
              - rule:
                  action: keep
                  source_labels: [__name__]
                  regex: "azure_microsoft_dbforpostgresql_flexibleservers_(cpu_percent_(average|maximum)|cpu_credits_remaining_minimum|memory_percent_maximum|storage_percent_maximum|active_connections_maximum|connections_failed_total|disk_queue_depth_average|disk_(iops|bandwidth)_consumed_percentage_maximum|maximum_used_transactionids_maximum|is_db_alive_minimum)_[a-z]+|up|scrape_.+"

  # Every listed storage account's blob service in one subscription, as two
  # pulls with different windows. Names are unique across Azure.
  #
  # Capacity: stored bytes and blob count, which Azure refreshes about once a
  # day and publishes at hourly granularity. The one-day window keeps the
  # latest value in reach. A new account has none for its first day.
  #
  # Requests: availability, which throttling and server errors lower, and
  # latency measured at the service and end to end. The gap between the two
  # latencies is the network and the client. Transaction counts are left out:
  # the window ends at the scrape, so a count reads its newest bucket a minute
  # or so short. The Loki, Thanos and persist clients report the same requests
  # exactly.
  - declare:
      label: provider_azure_blob
      blocks:
        - argument: *subscription_id
        - argument:
            label: storage_accounts
            comment: Storage account names.
        - argument: *cloud_environment
        - argument: *forward_to
        - argument: *scrape_interval
        - argument: *scrape_timeout

        - prometheus.exporter.azure:
            label: capacity
            subscriptions: [{ref: argument.subscription_id.value}]
            resource_type: Microsoft.Storage/storageAccounts
            metric_namespace: Microsoft.Storage/storageAccounts/blobServices
            resource_graph_query_filter: &storage_account_filter
              function: string.format
              arguments:
                - "where name in~ ('%s')"
                - function: string.join
                  arguments:
                    - {ref: argument.storage_accounts.value}
                    - "','"
            metrics: [BlobCapacity, BlobCount]
            metric_aggregations: [average]
            interval: PT1H
            timespan: P1D
            included_resource_tags: []
            azure_cloud_environment: {ref: argument.cloud_environment.value}

        - prometheus.exporter.azure:
            label: requests
            subscriptions: [{ref: argument.subscription_id.value}]
            resource_type: Microsoft.Storage/storageAccounts
            metric_namespace: Microsoft.Storage/storageAccounts/blobServices
            resource_graph_query_filter: *storage_account_filter
            metrics: [Availability, SuccessServerLatency, SuccessE2ELatency]
            metric_aggregations: [average]
            interval: PT5M
            timespan: PT10M
            included_resource_tags: []
            azure_cloud_environment: {ref: argument.cloud_environment.value}

        - custom:
            component: provider_scrape
            label: capacity
            attributes:
              targets: {ref: prometheus.exporter.azure.capacity.targets}
              instance: blob_capacity
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

        - custom:
            component: provider_scrape
            label: requests
            attributes:
              targets: {ref: prometheus.exporter.azure.requests.targets}
              instance: blob_requests
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

  # Every listed AKS cluster in one subscription: its cluster autoscaler, and
  # the node VMs under it. Names are unique within a resource group, not across
  # Azure, so two clusters of one name in a subscription are both pulled.
  #
  # AKS runs the cluster autoscaler in its own control plane, where nothing in
  # the cluster can scrape it, and publishes these four gauges instead: pods it
  # cannot place, whether it considers the cluster healthy enough to scale,
  # whether scale-down is paused after a scale-up, and nodes it would remove.
  # Pods that stay unschedulable while it is allowed to scale are the provider
  # not supplying nodes, for capacity or quota. Each keeps the aggregation
  # that shows the worst of its five minutes.
  #
  # `VmAvailabilityMetric` is Azure's own view of each node VM: 1 while it
  # runs, 0 while it is down, whatever Kubernetes says. `Context` says whether
  # the platform or the owner took it down. The node pools are scale sets in
  # the cluster's node resource group, which the Resource Graph query finds
  # through the cluster, since AKS tags them with the pool's name but not the
  # cluster's. Both sides are lowercased, because Kusto compares case.
  - declare:
      label: provider_azure_aks
      blocks:
        - argument: *subscription_id
        - argument:
            label: clusters
            comment: AKS cluster names, not resource IDs.
        - argument: *cloud_environment
        - argument: *forward_to
        - argument: *scrape_interval
        - argument: *scrape_timeout

        - prometheus.exporter.azure:
            label: autoscaler
            subscriptions: [{ref: argument.subscription_id.value}]
            resource_type: Microsoft.ContainerService/managedClusters
            resource_graph_query_filter:
              function: string.format
              arguments:
                - "where name in~ ('%s')"
                - &aks_cluster_names
                  function: string.join
                  arguments:
                    - {ref: argument.clusters.value}
                    - "','"
            metrics:
              - cluster_autoscaler_unschedulable_pods_count
              - cluster_autoscaler_cluster_safe_to_autoscale
              - cluster_autoscaler_scale_down_in_cooldown
              - cluster_autoscaler_unneeded_nodes_count
            metric_aggregations: [maximum, minimum]
            interval: PT5M
            timespan: PT10M
            included_resource_tags: []
            azure_cloud_environment: {ref: argument.cloud_environment.value}

        - prometheus.exporter.azure:
            label: nodes
            subscriptions: [{ref: argument.subscription_id.value}]
            resource_type: Microsoft.Compute/virtualMachineScaleSets
            resource_graph_query_filter:
              function: string.format
              arguments:
                - >-
                  extend nodeResourceGroup = tolower(resourceGroup)
                  | join kind=inner (Resources
                  | where type =~ 'microsoft.containerservice/managedclusters' and name in~ ('%s')
                  | project nodeResourceGroup = tolower(tostring(properties.nodeResourceGroup)))
                  on nodeResourceGroup
                - *aks_cluster_names
            metrics: [VmAvailabilityMetric]
            metric_aggregations: [minimum]
            included_dimensions: [VMName, Context]
            interval: PT5M
            timespan: PT10M
            included_resource_tags: []
            azure_cloud_environment: {ref: argument.cloud_environment.value}

        - custom:
            component: provider_scrape
            label: autoscaler
            attributes:
              targets: {ref: prometheus.exporter.azure.autoscaler.targets}
              instance: aks_autoscaler
              forward_to: {ref: prometheus.relabel.autoscaler.receiver}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

        - custom:
            component: provider_scrape
            label: nodes
            attributes:
              targets: {ref: prometheus.exporter.azure.nodes.targets}
              instance: aks_nodes
              forward_to: {ref: argument.forward_to.value}
              scrape_interval: {ref: argument.scrape_interval.value}
              scrape_timeout: {ref: argument.scrape_timeout.value}

        # The worst of each five minutes: the most pods waiting, cooldown or
        # unneeded nodes at any point, and any moment it was unsafe to scale.
        - prometheus.relabel:
            label: autoscaler
            forward_to: ["argument.forward_to.value"]
            blocks:
              - rule:
                  action: keep
                  source_labels: [__name__]
                  regex: "azure_microsoft_containerservice_managedclusters_cluster_autoscaler_((unschedulable_pods_count|scale_down_in_cooldown|unneeded_nodes_count)_maximum|cluster_safe_to_autoscale_minimum)_[a-z]+|up|scrape_.+"
