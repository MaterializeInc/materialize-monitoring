# yaml-language-server: $schema=../mzmon-lib/schemas/alloy/mzmon-alloy.schema.yaml
# Alloy gateway cloud provider instances stub.
# These are processed by mz-monitoring-build gen-pipelines to produce a gateway-provider-stub.alloy config.

description: |
  BUILD-TIME stand-in for the chart's provider instances. This is NOT what
  deploys.

  gateway-provider.yaml holds the custom components and deploys as-is. What
  the chart adds at install is only instances of them, one per resource, from
  `mzmon.alloyGateway.pipeline.provider` in
  charts/materialize-monitoring/templates/_alloy_provider_helpers.tpl.

  This file makes one instance of each, with the arguments the chart passes,
  so `make pipelines` checks those argument names against the components at
  the Alloy version CI pins — `alloy validate` rejects an argument a
  `declare` does not have. Keep it in step with the helper's instances. The
  helper is the source of truth.

blocks:
  - custom:
      component: provider_cloudwatch_rds
      label: rds_example_db
      attributes:
        instance_id: example-db
        region: us-east-1
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_cloudwatch_s3
      label: s3_example_bucket
      attributes:
        bucket: example-bucket
        region: us-east-1
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_cloudwatch_eks
      label: provider
      attributes:
        clusters: ["example-eks"]
        region: us-east-1
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_cloudwatch_nlb
      label: nlb_example_nlb
      attributes:
        load_balancer: net/example-nlb/0123456789abcdef
        region: us-east-1
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_cloudwatch_nlb_target_group
      label: nlb_target_group_example_tg
      attributes:
        load_balancer: net/example-nlb/0123456789abcdef
        target_group: targetgroup/example-tg/0123456789abcdef
        region: us-east-1
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_cloudwatch_nat_gateway
      label: nat_gateway_nat_0123456789abcdef0
      attributes:
        nat_gateway_id: nat-0123456789abcdef0
        region: us-east-1
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_gcp_cloudsql
      label: provider
      attributes:
        project_id: example-project
        database_ids: ["example-project:example-pg"]
        request_interval: 10m
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_gcp_gcs
      label: provider
      attributes:
        project_id: example-project
        buckets: ["example-bucket"]
        request_interval: 10m
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_gcp_compute_quota
      label: provider
      attributes:
        project_id: example-project
        regions: ["us-east1"]
        request_interval: 10m
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_gcp_load_balancing
      label: provider
      attributes:
        project_id: example-project
        forwarding_rules: ["a0123456789abcdef0123456789abcde"]
        networks: ["example-network"]
        request_interval: 10m
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_gcp_cloud_nat
      label: provider
      attributes:
        project_id: example-project
        gateways: ["example-nat"]
        request_interval: 10m
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_azure_postgres
      label: provider
      attributes:
        subscription_id: 00000000-0000-0000-0000-000000000000
        servers: ["example-pg"]
        cloud_environment: azurecloud
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_azure_blob
      label: provider
      attributes:
        subscription_id: 00000000-0000-0000-0000-000000000000
        storage_accounts: ["examplestorage"]
        cloud_environment: azurecloud
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_azure_aks
      label: provider
      attributes:
        subscription_id: 00000000-0000-0000-0000-000000000000
        clusters: ["example-aks"]
        cloud_environment: azurecloud
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_azure_load_balancer
      label: provider
      attributes:
        subscription_id: 00000000-0000-0000-0000-000000000000
        clusters: ["example-aks"]
        cloud_environment: azurecloud
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m

  - custom:
      component: provider_azure_nat_gateway
      label: provider
      attributes:
        subscription_id: 00000000-0000-0000-0000-000000000000
        gateways: ["example-nat"]
        cloud_environment: azurecloud
        forward_to: {ref: otelcol.receiver.prometheus.inputBridge.receiver}
        scrape_interval: 5m
        scrape_timeout: 2m
