# Lines that packages/mzmon-lib/tests/gateway_level_corpus.rs pushes through the
# gateway's inputProcessor, on the pinned Alloy binary.
#
# Each fixture is one log line and the stream labels it arrives with. `level` is
# the level it must leave with. `heuristic` is the `levelheuristic` structured
# metadata the UNKNOWN detectors must record; leave it out for a line a
# per-application parser levels before the detectors run, which must carry none.
#
# The shapes come from a day of an AKS install's UNKNOWN lines, with names and
# addresses made generic.

# --- a line already leveled is left alone -----------------------------------

- id: parsed-logfmt
  labels: {namespace: monitoring, app: loki, container: querier, job: monitoring/querier}
  line: 'level=warn ts=2026-11-08T20:03:00.191063124Z caller=metrics.go:285 component=querier msg="query slow"'
  level: WARN

# --- the Loki canary ----------------------------------------------------------

- id: canary-payload
  labels: {namespace: monitoring, app: loki, container: canary, job: monitoring/canary}
  line: '1794168045978708054 ppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppp'
  level: TRACE
  heuristic: canary

- id: canary-missing-entry
  labels: {namespace: monitoring, app: loki, container: canary, job: monitoring/canary}
  line: 'websocket missing entry: 1794168770978357559'
  level: DEBUG
  heuristic: canary

- id: canary-cannot-connect
  labels: {namespace: monitoring, app: loki, container: canary, job: monitoring/canary}
  line: 'failed to connect to wss://loki-query-frontend:3100/loki/api/v1/tail?query=%7B%7D with err websocket: bad handshake'
  level: ERROR
  heuristic: keyword

# A canary-shaped line from another container is not a canary payload.
- id: canary-shape-elsewhere
  labels: {namespace: default, app: probe, container: probe, job: default/probe}
  line: '1794168045978708054 ppppppppppppppppppppppppppppppppppppppppppppp'
  level: UNKNOWN
  heuristic: none

