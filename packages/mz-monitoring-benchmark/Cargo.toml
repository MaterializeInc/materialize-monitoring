[package]
name = "mz-monitoring-benchmark"
description = "Synthetic Materialize metrics and logs for load-testing the monitoring stack."
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["capture"]
# `fixture-gen`'s live capture: pod discovery and port-forwards through the
# Kubernetes API. The load image builds without it, because `gen-load` never
# talks to the API server and the TLS stack is most of the compile.
capture = ["dep:base64", "dep:kube", "dep:k8s-openapi", "dep:rustls"]

[dependencies]
anyhow = "1.0.104"
bytes = "1"
# Log timestamps in tracing's and nginx's formats.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
regex = "1"
# String escaping for the JSON log lines.
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
uuid = "1.29.2"

base64 = { version = "0.23.1", optional = true }

k8s-openapi = { version = "0.28.0", features = ["latest"], optional = true }
# `client` + `config` + `ws` only, as in `mz-monitoring-e2e`: the capture reads
# a kubeconfig, lists pods, reads one Secret, and port-forwards.
kube = { version = "5.0.0", default-features = false, features = ["client", "rustls-tls", "config", "ws"], optional = true }
# Named to install a crypto provider at startup. `aws-lc-rs` and `ring` both
# reach the dependency graph when the workspace builds together, and rustls
# refuses to pick one on its own.
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"], optional = true }
