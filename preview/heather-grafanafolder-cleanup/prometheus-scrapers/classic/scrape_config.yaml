global:
  evaluation_interval: 1m
  scrape_interval: 30s
  scrape_timeout: 10s
scrape_configs:
- job_name: podMonitor/clusterd/metrics
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: pod
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_cluster_environmentd_materialize_cloud_type
    - __meta_kubernetes_pod_labelpresent_cluster_environmentd_materialize_cloud_type
    regex: (cluster);true
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: internal-http
    action: keep
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_container_name
    target_label: container
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_label_materialize_cloud_organization_name
    target_label: materialize_cloud_organization_name
  - source_labels:
    - __meta_kubernetes_pod_label_materialize_cloud_organization_namespace
    target_label: materialize_cloud_organization_namespace
  - source_labels:
    - __meta_kubernetes_pod_label_materialize_cloud_organization_id
    target_label: materialize_cloud_organization_id
  - source_labels:
    - __meta_kubernetes_pod_label_cluster_environmentd_materialize_cloud_cluster_id
    target_label: cluster_environmentd_materialize_cloud_cluster_id
  - source_labels:
    - __meta_kubernetes_pod_label_cluster_environmentd_materialize_cloud_replica_id
    target_label: cluster_environmentd_materialize_cloud_replica_id
- job_name: podMonitor/cni-aws-vpc/metrics-0
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - kube-system
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_k8s_app
    - __meta_kubernetes_pod_labelpresent_k8s_app
    regex: (aws-node);true
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: metrics
    action: keep
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_container_name
    target_label: container
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - target_label: network_component
    replacement: aws-vpc-cni
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: awscni_assigned_ip_per_cidr
    action: drop
- job_name: podMonitor/cni-aws-vpc/metrics-1
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - kube-system
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_k8s_app
    - __meta_kubernetes_pod_labelpresent_k8s_app
    regex: (aws-node);true
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: agentmetrics
    action: keep
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_container_name
    target_label: container
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - target_label: network_component
    replacement: aws-vpc-cni
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
