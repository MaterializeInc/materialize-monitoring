- job_name: mz-kubelet-cadvisor
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_node_label_topology_kubernetes_io_region
    target_label: topology_kubernetes_io_region
  - source_labels:
    - __meta_kubernetes_node_label_topology_kubernetes_io_zone
    target_label: topology_kubernetes_io_zone
  - source_labels:
    - __meta_kubernetes_node_label_karpenter_sh_nodepool
    target_label: karpenter_sh_nodepool
  - source_labels:
    - __meta_kubernetes_node_label_karpenter_sh_capacity_type
    target_label: karpenter_sh_capacity_type
  - source_labels:
    - __meta_kubernetes_node_label_node_kubernetes_io_instance_type
    target_label: node_kubernetes_io_instance_type
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: node
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    regex: (.+)
    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
- job_name: kube-proxy
  kubernetes_sd_configs:
  - role: pod
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_k8s_app
    regex: kube-proxy
    action: keep
  - source_labels:
    - __meta_kubernetes_namespace
    regex: kube-system
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_phase
    regex: Pending|Succeeded|Failed
    action: drop
  - source_labels:
    - __meta_kubernetes_pod_ip
    target_label: __address__
    regex: (.+)
    replacement: ${1}:10249
  - target_label: network_component
    replacement: kube-proxy
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
