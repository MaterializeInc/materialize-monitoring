# Profile: call-home-alerts. Sets the `alerts` call-home level: alert state, on
# top of the `heartbeat` level.
#
# In this chart version, the level sends nothing: alert state doesn't pass
# through the gateway's fan-out, which is the only path to the control plane.
# The gateway reads the client certificate only when the level sends something.
#
# Nothing is sent unless you apply a call-home profile. Each one sets
# `callHome.level` and touches nothing else. The levels, lowest first, are in
# profiles/call-home.values.yaml, and the operator page is
# docs/content/operating/call-home.md.
callHome:
  level: alerts
