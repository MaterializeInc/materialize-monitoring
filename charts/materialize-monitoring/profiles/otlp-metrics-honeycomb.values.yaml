# Send gateway metrics to a generic OTLP backend (Honeycomb shown).
#
# Pairs with the docs: "Metrics > Storing > Generic OTLP".
# Combine with your platform profile (e.g. gcp-example / aws-example) as needed.
#
# Honeycomb authenticates with an `x-honeycomb-team` API-key header rather than a
# bearer token, so this uses `authType: headers`. The key is read at runtime from
# the GATEWAY_OTEL_DEST_HONEYCOMB_API_KEY environment variable, which you supply
# through the gateway Secret (the chart does NOT create it):
#
#   kubectl create secret generic mzmon-alloy-gateway-env \
#     --namespace monitoring \
#     --from-literal=GATEWAY_OTEL_DEST_HONEYCOMB_API_KEY='<honeycomb-api-key>'
#
# The Secret name must match <fullnameOverride>-alloy-gateway-env (mzmon by
# default) and live in the gateway's namespace. The variable name is not special
# — pick whatever you like and name it in `valueEnv` below.

pipeline:
  metrics:
    gateway:
      destination:
        # Keep the default in-cluster Thanos remote-write sink on if you also want
        # cheap, full-fidelity local storage; set enabled: false to send metrics
        # only to OTLP.
        prometheusRemoteWrite:
          enabled: true

        otel:
          enabled: true

          otlpExporter:
            enabled: true
            # Host[:port], with no http:// or https:// prefix.
            url: "api.honeycomb.io"
            # grpc -> otlp exporter, http -> otlphttp exporter.
            protocol: grpc
            # Honeycomb is metered, so ship only the metrics you use. "recommended"
            # keeps essentials + dashboard metrics; use "all" for everything
            # scraped, or "essential" for alerting metrics only. (extended and
            # diagnostic currently resolve to the same set as recommended.)
            minMetricImportance: recommended

          auth:
            authType: headers
            headers:
              headers:
                # The API key. `valueEnv` keeps it out of the rendered pipeline
                # ConfigMap — it is read from the gateway's environment instead.
                - key: x-honeycomb-team
                  valueEnv: GATEWAY_OTEL_DEST_HONEYCOMB_API_KEY
                # The target Honeycomb dataset for these metrics. Not a secret, so
                # it is set inline.
                - key: x-honeycomb-dataset
                  value: mzmon
