# Profile: back the bundled Grafana with an external PostgreSQL database.
#
# Grafana keeps its own state — users, service accounts and tokens, annotations,
# dashboard versions and permissions, preferences, and alert-rule state — in a
# database separate from the observability data in Thanos and Loki.
#
# The chart default is SQLite on an `emptyDir`, which loses that state on every
# pod restart. SQLite on a PersistentVolume survives restarts but tolerates one
# writer, so it caps you at a single replica. An external PostgreSQL is the only
# option that lifts both constraints, so it is the production shape.
#
# Layer this over your platform profile:
#
#   helm upgrade --install mzmon charts/materialize-monitoring -n monitoring \
#     -f charts/materialize-monitoring/profiles/aws-example.values.yaml \
#     -f charts/materialize-monitoring/profiles/grafana-postgres.values.yaml
#
# Prerequisites, none of which this chart creates:
#
#   1. A PostgreSQL database and a user that OWNS it. Grafana runs its own schema
#      migrations at startup, so a read/write-only grant fails the migration.
#   2. A Secret named below, in the namespace the Grafana POD runs in — under the
#      `split-namespace` profile that is `grafana`, not the release namespace.
#      Provision it with External Secrets Operator, Vault Agent, SOPS, or your
#      cloud's CSI driver so the value never lands in Git:
#
#        kubectl create secret generic grafana-db -n monitoring \
#          --from-literal=password="$GRAFANA_DB_PASSWORD" \
#          --from-file=ca.pem=./rds-ca.pem
#
#   3. Network reach from the Grafana pod to the database.
#
# On IAM: RDS and Cloud SQL both support IAM database authentication, but Grafana
# reads its password once at startup and has no refresh hook, so the 15-minute
# (RDS) or one-hour (Cloud SQL) token expiry breaks the first reconnect. A static
# secret is the practical answer on AWS today — see grafana/grafana#75965. On GCP
# you can avoid it by running the Cloud SQL Auth Proxy as a sidecar with
# `--auto-iam-authn` and pointing `host` at `127.0.0.1:5432` with no password.

grafana:
  # Safe to run more than one replica now that state is not on local disk.
  # Unused while `autoscaling` is on below — the subchart stops rendering a
  # static `replicas` once an HPA exists, so `minReplicas` is the floor that
  # actually applies. Kept in step with it so turning autoscaling off does not
  # silently drop back to one.
  replicas: 2

  # Grafana is stateless once its database is external, so it scales
  # horizontally. `targetCPU` is a percentage of the CPU request, which comes
  # from the chart defaults.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: "60"

  # Explicit: no PersistentVolume is wanted or needed. Grafana still writes its
  # plugin and search-index scratch to `emptyDir`, both of which it rebuilds.
  persistence:
    enabled: false

  grafana.ini:
    database:
      type: postgres
      # MUST include the port.
      host: <YOUR-DB-HOST>:5432
      name: grafana
      user: grafana
      # Read from the mounted Secret rather than inlined, because `grafana.ini`
      # renders into a ConfigMap — an inline password would sit in plaintext in
      # the release manifest and in `helm get values`.
      password: $__file{/etc/secrets/grafana-db/password}
      # `require` encrypts but does not authenticate the server. Prefer
      # `verify-full`, which needs `ca_cert_path` below.
      ssl_mode: verify-full
      ca_cert_path: /etc/secrets/grafana-db/ca.pem
      # Keep the pool under the database's connection limit, remembering this is
      # per replica: max_open_conn * replicas is the real ceiling.
      max_open_conn: 30
      max_idle_conn: 10

    # The other half of `headlessService` below. String values in this block are
    # run through `tpl` by the subchart, so the namespace resolves correctly under
    # `split-namespace` too. `grafana-headless` follows the static
    # `grafana.fullnameOverride` the chart pins.
    unified_alerting:
      ha_peers: 'grafana-headless.{{ include "grafana.namespace" . }}.svc:9094'
      # POD_IP is set on the container by the subchart.
      ha_listen_address: ${POD_IP}:9094
      ha_advertise_address: ${POD_IP}:9094

  extraSecretMounts:
    - name: grafana-db
      secretName: grafana-db
      mountPath: /etc/secrets/grafana-db
      readOnly: true

  # The chart already sets `maxUnavailable: 1`, which is what keeps one replica
  # serving through a node drain and still scales with the replica count. It is
  # left alone here deliberately: `podDisruptionBudget` deep-merges, so adding
  # `minAvailable` here would not replace `maxUnavailable` but sit alongside it,
  # and the API rejects a budget that sets both.

  # Gossip between the replicas, so Grafana-managed alert rules notify once for
  # the cluster instead of once per replica.
  #
  # This lives here rather than in the chart defaults because it is inert — and
  # not free — at one replica: the Alertmanager cluster waits out `ha_peer_timeout`
  # for peers to settle before it evaluates anything, so a single-replica install
  # pays a startup delay and logs join failures for a cluster of one. Multiple
  # replicas is exactly the condition that makes it worth having, and this profile
  # is the only shipped shape that has them.
  #
  # It only affects rules created *in* Grafana. The rules this chart ships are
  # Prometheus rules, evaluated by Thanos Ruler and routed by Alertmanager, and
  # they are unaffected either way.
  headlessService: true

# NOTE: gossip needs pod-to-pod traffic on 9094, TCP *and* UDP, and something does
# block it now: `grafana.networkPolicy` is on by default and the subchart's policy
# template opens `service.targetPort` and nothing else. The chart closes that gap
# itself — `networkPolicies.grafanaGossip` renders the missing 9094 rule alongside,
# and it renders precisely because `ha_peers` is set above. Turn that off and the
# replicas start healthy, never find each other, and duplicate every notification
# rather than failing; the render warns when it sees that combination.
