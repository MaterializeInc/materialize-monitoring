# Profile: call-home. Sends a reduced copy of telemetry to Materialize's
# control plane at the `diagnostics` call-home level, alongside the full copy
# the install keeps.
#
# Nothing is sent unless you apply a call-home profile. Each one sets
# `callHome.level` and touches nothing else, so compose it with the cloud and
# sizing profiles the install already uses. Each level sends everything the one
# above it in this list sends, and more:
#
#   call-home-heartbeat.values.yaml  heartbeat    nothing in this chart version
#   call-home-alerts.values.yaml     alerts       nothing in this chart version
#   call-home-metrics.values.yaml    metrics      metrics at the `essential` tier
#   call-home.values.yaml            diagnostics  this profile
#
# Bring Your Own Cloud stacks apply this profile too; the only difference is how
# the client certificate is issued, which happens outside this chart. The
# operator page is docs/content/operating/call-home.md.
#
# At `diagnostics`, the gateway sends:
#
#   * Metrics at the `essential` tier.
#   * Logs at WARN and above, at most 500 lines per second per gateway replica,
#     in bursts of at most 5000. Lines whose level the gateway couldn't
#     determine aren't sent; the gateway levels Rust and Go panics CRITICAL, so
#     they are.
#
# The gateway's secret filter is on at this level, whatever
# `pipeline.logging.secretFilter.mode` says, so a credential a component logs
# is replaced before the line is stored or sent.
#
# To send less, write an entry under `pipeline.destinations.controlPlane` in a
# values file after this profile, such as `logs.minLevel: ERROR`, or
# `logs.enabled: false` to send metrics only. The render refuses an entry that
# sends more than the level. The bundled Loki and Thanos keep everything either
# way.
#
# When the control plane is unreachable, its copy drops entries at a full queue
# and the local copies keep receiving. The drops are counted in
# `otelcol_exporter_enqueue_failed_{log_records,metric_points}_total`.
#
# Before installing, create the Secret `mzmon-alloy-gateway-destination-tls` in
# the gateway's namespace: a `kubernetes.io/tls` Secret holding the client
# certificate Materialize issued for the install. Its URI SAN is the install's
# identity, `spiffe://c.materialize.cloud/stack/<clientStack>`. The control
# plane's load balancer reads the identity from the certificate, so the gateway
# sends none of its own. The chart mounts the Secret at
# /etc/mzmon/destination-tls. Without it, the gateway fails to load its
# configuration, naming the missing file.
#
# The level sends to https://telemetry.c.cloud.materialize.com. Materialize's
# own non-production stacks (internal) override the URL:
#
#   pipeline:
#     destinations:
#       controlPlane:
#         # staging:         https://telemetry.c.staging.cloud.materialize.com
#         # personal stack:  https://telemetry.c.<personalStack>.dev.cloud.materialize.com
#         url: https://telemetry.c.staging.cloud.materialize.com
callHome:
  level: diagnostics
