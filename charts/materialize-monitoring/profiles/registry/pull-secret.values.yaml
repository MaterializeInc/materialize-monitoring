# Overlay: image pull secrets for an authenticated registry.
#
# Every hardened-image vendor in `profiles/registry/` ships from a registry that
# requires credentials, so this overlay is the shared half of all three and is
# meant to be composed *before* the vendor profile:
#
#   helm upgrade --install mzmon materialize-monitoring/materialize-monitoring \
#     -f profiles/registry/pull-secret.values.yaml \
#     -f profiles/registry/chainguard.values.yaml \
#     -f my-values.yaml
#
# It sets no registries and no repositories — it only names the Secret — so it
# composes just as well with a plain mirror of the upstream images.
#
# Replace every `<REPLACE-ME>` with the name of a `kubernetes.io/dockerconfigjson`
# Secret that exists in each namespace the stack renders into. Helm does not
# create it, and a Secret is namespaced, so a split-namespace install
# (`profiles/split-namespace.values.yaml`) needs one copy per namespace:
#
#   kubectl create secret docker-registry <REPLACE-ME> \
#     --namespace monitoring \
#     --docker-server=<REGISTRY-HOST> \
#     --docker-username=<USER> \
#     --docker-password=<TOKEN>
#
# ---------------------------------------------------------------------------
# Why this is not just two lines under `global`
# ---------------------------------------------------------------------------
# Helm propagates `global` into every subchart, but each subchart decides for
# itself whether to read it, and the subcharts here do not agree. Verified by
# rendering the chart with only the `global` keys set:
#
#   Reads a global                          Ignores every global
#   -----------------------------------     ---------------------------------
#   alloy-agent  (global.image.pullSecrets)  loki
#   alloy-gateway(global.image.pullSecrets)  grafana-operator
#   thanos       (global.imagePullSecrets)   alertmanager
#   grafana      (global.imagePullSecrets)   metrics-server
#   kube-state-metrics                       (each takes its own key, below)
#   node-exporter
#
# Both global spellings are therefore set, *and* the four holdouts are named
# individually. Setting only `global.imagePullSecrets` leaves Loki — the largest
# pod count in the release — pulling anonymously, which surfaces as
# `ImagePullBackOff` on the ingesters long after `helm install` has reported
# success.
#
# Every one of these keys takes the Kubernetes shape (a list of `{name: ...}`
# maps), including Alloy's, which renders through `toYaml` into the pod spec
# verbatim. A bare list of strings is accepted by some charts and silently
# produces an invalid pod spec in others; do not mix the two styles.
#
# ---------------------------------------------------------------------------
# Known gaps — workloads this overlay cannot reach
# ---------------------------------------------------------------------------
# Three resources this chart renders itself carry no `imagePullSecrets` support
# at all, so no value can put one on them:
#
#   * `templates/cleanup/job-grafana-operator.yaml` — the pre-delete hook, and
#     the more painful of the two: if its image is unpullable, `helm uninstall`
#     hangs on the hook rather than failing at install time. This is why the
#     vendor profiles leave `cleanup.grafanaOperator.image` pointed at
#     `registry.k8s.io/kubectl`, which is anonymously pullable.
#   * `templates/pipelines/validator/job-validate-{agent,gateway}.yaml` — these
#     run the Alloy image, which the vendor profiles also leave alone.
#
# All three would need either an `imagePullSecrets` passthrough on the pod specs
# or one on the ServiceAccounts they use. Until then, keep those two images on a
# registry that permits anonymous pulls.
#
# The `Grafana` CR rendered in `connections.grafana.mode: operator` is not a gap:
# you supply its whole `spec` through `connections.grafana.operator.spec`, so put
# `imagePullSecrets` in the pod template there.

# Reaches alloy-agent and alloy-gateway. The Alloy chart looks only at
# `global.image.pullSecrets` and never at `global.imagePullSecrets`.
#
# Deliberately does NOT set `global.imageRegistry`. Loki's image helper
# coalesces that ahead of every per-component `image.registry`, so setting it
# would silently flatten all of Loki's images — including memcached and the
# canary — onto one host, overriding whatever a vendor profile chose.
global:
  image:
    pullSecrets:
      - name: "<REPLACE-ME>"
  # Reaches thanos, grafana, kube-state-metrics, and node-exporter.
  imagePullSecrets:
    - name: "<REPLACE-ME>"

# Applied to every Loki pod, including memcached, the canary, and the
# StatefulSet-recreate Job.
loki:
  imagePullSecrets:
    - name: "<REPLACE-ME>"

grafana-operator:
  imagePullSecrets:
    - name: "<REPLACE-ME>"

alertmanager:
  imagePullSecrets:
    - name: "<REPLACE-ME>"

# Inert unless `tags.cluster-metrics` or `tags.metrics-server` is on —
# metrics-server is outside the `default` tag.
metrics-server:
  imagePullSecrets:
    - name: "<REPLACE-ME>"
