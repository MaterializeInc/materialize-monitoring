# No-StorageClass profile: the four PersistentVolumeClaims, turned into emptyDir.
#
# Compose after the sizing profiles:
#   -f profiles/no-storage-class.values.yaml
#
# For clusters with no StorageClass, or none that the nodes can attach. Every
# other workload in the stack is already volumeless; these four are not, and
# their pods stay Pending on an unbound claim. `storage-class.values.yaml` is the
# other half of the same choice: it names a class rather than dropping the
# volumes.
#
# What each one gives up:
#
#   * **Alertmanager** — silences and the notification log, lost on restart.
#     The only loss here that nothing else can reconstruct.
#   * **The Loki ruler** — its remote-write WAL. Recording-rule samples buffered
#     while Thanos is unreachable are lost on restart.
#   * **The Thanos Store Gateway** — the index-header cache, rebuilt from the
#     bucket on every start. Slower, not lossy.
#   * **The Thanos Compactor** — scratch only. Nothing is lost, but it needs real
#     node disk, because compaction downloads whole block groups.
#
# The ephemeral-storage requests are what make the scheduler place these pods on
# nodes with room. Check what the nodes offer before you install:
#
#   kubectl get nodes -o custom-columns='NODE:.metadata.name,EPH:.status.allocatable.ephemeral-storage'
#
# A pod Pending on `Insufficient ephemeral-storage` needs a smaller request here.
# Changing this on an existing install does not move data: the old PVCs stay
# behind until you delete them.

alertmanager:
  persistence:
    enabled: false
  resources:
    requests:
      ephemeral-storage: 256Mi

loki:
  ruler:
    persistence:
      enabled: false
    resources:
      requests:
        ephemeral-storage: 1Gi

thanos:
  storegateway:
    persistence:
      enabled: false
    resources:
      requests:
        ephemeral-storage: 2Gi
  compactor:
    persistence:
      enabled: false
    resources:
      requests:
        # Compaction downloads whole block groups. Raise this as retention and
        # volume grow; a node that runs out evicts the pod mid-compaction.
        ephemeral-storage: 10Gi
