# Loki profile: test (integration / CI)
#
# Overlay on top of the chart defaults. Compose after the base values, e.g.
# `-f profiles/loki-test.values.yaml`.
#
# Loki is a black-box interface to us, so integration tests run it in the
# simplest hermetic shape: single binary + local filesystem, no object store,
# no caches, replication_factor 1. This profile is NOT for production.
#
# The microservice settings from the base values are inert here because
# deploymentMode is SingleBinary; our validator will emit a (non-fatal)
# deploymentMode warning, which is expected for this profile.

tags:
  loki: true

# -- Endpoints for consumers of Loki.
# SingleBinary renders exactly one `loki` Service. The chart defaults name the
# microservice Services — `loki-query-frontend` for reads, `loki-distributor` for
# writes — so every consumer resolves a host that does not exist unless it is
# repointed here. The write path is the one that fails silently: the gateway
# retries DNS forever and no logs reach Loki.
# (The canary reads through `loki-query-frontend` too, but it is disabled below.)
connections:
  datasources:
    loki:
      url: 'http://loki.{{ include "mzmon.loki.namespace" $ }}.svc:3100'

pipeline:
  logging:
    gateway:
      destination:
        loki:
          url: 'http://loki.{{ include "mzmon.loki.namespace" $ }}.svc:3100/loki/api/v1/push'

loki:
  # -- Single-process Loki for hermetic tests.
  deploymentMode: SingleBinary

  # -- No network policy in test clusters.
  networkPolicy:
    enabled: false

  loki:
    commonConfig:
      # -- No replication in a single-process test.
      replication_factor: 1
    storage:
      # -- Local filesystem instead of object storage.
      type: filesystem
      # -- Bucket names are unused by the filesystem backend, but our validator
      # requires non-placeholder values, so set throwaway names.
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
      # -- The thanos object-store client is not used with the filesystem backend.
      use_thanos_objstore: false
    # -- Schema must reference the filesystem object store in test.
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    compactor:
      # -- Must match storage.type, like every other backend name here.
      # Left at the base default (s3) the compactor crash-loops with
      # "failed to create delete request store object client: at least one
      # bucket name must be specified" — the backend-consistency validator only
      # covers the thanos objstore path, which this profile turns off.
      delete_request_store: filesystem

  # -- Run exactly one Loki pod.
  singleBinary:
    replicas: 1

  # -- The chart's built-in Helm test requires the Loki Canary; we run our own
  # e2e instead, so disable both.
  test:
    enabled: false

  # -- Zero the distributed microservices. In SingleBinary mode Loki's own
  # validation rejects running monolithic and distributed targets together;
  # the base values enable these for the default Distributed mode.
  ingester:
    replicas: 0
  queryScheduler:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  ruler:
    replicas: 0

  # -- No memcached in test; the single binary serves directly.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # -- No canary in test (avoids extra workload and log noise).
  lokiCanary:
    enabled: false

  # -- Use the filesystem backend, not the bundled MinIO.
  minio:
    enabled: false
