# Profile: call-home-metrics. Sends metrics at the `essential` tier to
# Materialize's control plane, at the `metrics` call-home level, alongside the
# full copy the install keeps. No logs cross.
#
# Nothing is sent unless you apply a call-home profile. Each one sets
# `callHome.level` and touches nothing else, so compose it with the cloud and
# sizing profiles the install already uses. The levels, lowest first, are in
# profiles/call-home.values.yaml, and the operator page is
# docs/content/operating/call-home.md.
#
# To send less, write an entry under `pipeline.destinations.controlPlane` in a
# values file after this profile, such as `metrics.enabled: false`. The render
# refuses an entry that sends more than the level, such as a lower tier floor
# or a `logs` block.
#
# When the control plane is unreachable, its copy drops samples at a full queue
# and the local copies keep receiving. The drops are counted in
# `otelcol_exporter_enqueue_failed_metric_points_total`.
#
# Before installing, create the Secret `mzmon-alloy-gateway-destination-tls` in
# the gateway's namespace: a `kubernetes.io/tls` Secret holding the client
# certificate Materialize issued for the install. The chart mounts it at
# /etc/mzmon/destination-tls. Without it, the gateway fails to load its
# configuration, naming the missing file.
callHome:
  level: metrics
