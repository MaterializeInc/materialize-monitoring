# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: bundled dashboards
chart:
  version: 1.2.3
  appVersion: 4.5.6
release:
  name: test-mon
  revision: 5
  namespace: test-monitoring
templates:
  - templates/dashboards/grafana-operator/dashboards.yaml
tests:
  # `dashboards.selected` is a list of *patterns* globbed against the
  # pre-rendered tree, so a new dashboard ships the moment its artifact lands
  # under a matching stem. That is convenient and completely silent, which is
  # why it is worth asserting: nothing else would notice a stem that stopped
  # matching, or an artifact that stopped being written.
  - it: should ship every dashboard the default patterns select
    asserts:
      - containsDocument:
          any: true
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaManifest
          name: mzmon-env-top-dashboard
      - containsDocument:
          any: true
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaManifest
          name: mzmon-env-logs-dashboard
      - containsDocument:
          any: true
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaManifest
          name: mzmon-env-upgrade-dashboard
      - containsDocument:
          any: true
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaManifest
          name: mzmon-infra-logs-dashboard
      - containsDocument:
          any: true
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaManifest
          name: mzmon-infra-nodes-dashboard

  # Both families are selected by default. Narrowing to one is the supported way
  # to hold the other back, so the pattern list has to actually narrow.
  - it: should install only what the patterns match
    set:
      dashboards.selected:
        - env-top
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          any: true
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaManifest
          name: mzmon-env-top-dashboard

  - it: should template nothing when dashboards are disabled
    set:
      dashboards.config.grafana.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # The render names its folder (`materialize`); the chart rewrites that to the
  # UID it creates, the same way it rewrites `apiVersion`. Assert the rewrite
  # happened at all — a passthrough would leave the bare name here, which Grafana
  # would read as a UID and fail to resolve.
  - it: should resolve each dashboard's folder to a UID the chart creates
    asserts:
      - equal:
          path: spec.template.metadata.annotations["grafana.app/folder"]
          value: mzmon-materialize
        documentSelector:
          path: metadata.name
          value: mzmon-env-top-dashboard
      - equal:
          path: spec.template.metadata.annotations["grafana.app/folder"]
          value: mzmon-infra
        documentSelector:
          path: metadata.name
          value: mzmon-infra-nodes-dashboard

  # The whole point of resolving in the chart rather than at render time: the UID
  # moves with the release, and the dashboards follow it without being re-rendered.
  - it: should follow the folder UID when the release name moves
    set:
      fullnameOverride: custom
    asserts:
      - equal:
          path: spec.template.metadata.annotations["grafana.app/folder"]
          value: custom-materialize
        documentSelector:
          path: metadata.name
          value: custom-env-top-dashboard

  - it: should follow an adopted folder UID
    set:
      dashboards.config.grafana.folders.materialize.existingUid: adopted-uid
    asserts:
      - equal:
          path: spec.template.metadata.annotations["grafana.app/folder"]
          value: adopted-uid
        documentSelector:
          path: metadata.name
          value: mzmon-env-top-dashboard

  # A render naming a folder the chart does not have would otherwise ship a name
  # where Grafana expects a UID. Dropping it is the honest version of what
  # Grafana does with it anyway.
  - it: should drop the annotation when the folder is not configured
    set:
      # Null removes the key on merge; a replacement map would be merged *into*
      # the defaults and leave the entry in place.
      dashboards.config.grafana.folders.materialize: null
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["grafana.app/folder"]
        documentSelector:
          path: metadata.name
          value: mzmon-env-top-dashboard
      - equal:
          path: spec.template.metadata.annotations["grafana.app/folder"]
          value: mzmon-infra
        documentSelector:
          path: metadata.name
          value: mzmon-infra-nodes-dashboard
      # The other annotations are untouched by the rewrite.
      - equal:
          path: spec.template.metadata.annotations["monitoring.materialize.cloud/min-mz-version"]
          value: v26.24.0
        documentSelector:
          path: metadata.name
          value: mzmon-env-top-dashboard
