# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# Node-local cAdvisor collection on the Alloy agent, and its OTLP egress.
#
# The pipeline itself is pre-rendered and validated by `make pipelines`; what
# these cover is the chart half — the env vars the pipeline reads, and the host
# mounts and security context the exporter needs to work.
suite: alloy agent cAdvisor collection
release:
  name: test-mon
  namespace: test-monitoring
set:
  tags.default: false
  tags.pipeline: true
  pipeline.logging.gateway.destination.loki.enabled: false
  pipeline.metrics.gateway.destination.prometheusRemoteWrite.enabled: false
tests:
  # --- collector selection ---------------------------------------------------
  - it: should pass both collector lists as JSON arrays
    template: templates/pipelines/cm-alloy-agent-env.yaml
    asserts:
      # `encoding.from_json` in the pipeline turns these back into list(string).
      - equal:
          path: data.ALLOY_CADVISOR_DISABLED
          value: '["advtcp","cpu_topology","cpuset","hugetlb","memory_numa","percpu","perf_event","process","referenced_memory","resctrl","sched","tcp","udp"]'
      # Empty means "unset", which leaves disabled_metrics in charge. It must
      # still be emitted as `[]` rather than omitted.
      - equal:
          path: data.ALLOY_CADVISOR_ENABLED
          value: "[]"

  # cAdvisor's precedence is blunt and worth pinning: a non-empty
  # enabled_metrics replaces disabled_metrics outright rather than merging, so
  # the enabled list is exhaustive rather than additive.
  - it: should pass an explicit enabled list through unchanged
    set:
      pipeline.metrics.agent.cadvisor.enabledCollectors: ["cpu", "memory"]
    template: templates/pipelines/cm-alloy-agent-env.yaml
    asserts:
      - equal:
          path: data.ALLOY_CADVISOR_ENABLED
          value: '["cpu","memory"]'

  # `percpu` is per-container x per-CPU; on a large dense node it is ~10k series
  # on its own. `process` is off because it reads 0 without hostPid.
  - it: should keep the high-cardinality collectors off by default
    template: templates/pipelines/cm-alloy-agent-env.yaml
    asserts:
      - matchRegex:
          path: data.ALLOY_CADVISOR_DISABLED
          pattern: '"percpu"'
      - matchRegex:
          path: data.ALLOY_CADVISOR_DISABLED
          pattern: '"process"'

  # Turning the feature off cannot be expressed as an empty enabled list, since
  # `[]` reads as "unset" — every collector has to be named.
  - it: should disable every collector when cadvisor is off
    set:
      pipeline.metrics.agent.cadvisor.enabled: false
    template: templates/pipelines/cm-alloy-agent-env.yaml
    asserts:
      - equal:
          path: data.ALLOY_CADVISOR_ENABLED
          value: "[]"
      - matchRegex:
          path: data.ALLOY_CADVISOR_DISABLED
          pattern: '"cpu".*"memory".*"network"'
      - notExists:
          path: data.AGENT_CADVISOR_SCRAPE_INTERVAL

  # --- OTLP egress -----------------------------------------------------------
  # host:port, not a URL — the OTLP gRPC exporter takes no scheme. The gateway
  # Service exposes 4317 as `otlp-grpc`.
  - it: should point OTLP egress at the gateway grpc listener
    template: templates/pipelines/cm-alloy-agent-env.yaml
    asserts:
      - equal:
          path: data.AGENT_OTLP_DEST
          value: alloy-gateway.test-monitoring.svc:4317

  - it: should follow the gateway into a split namespace
    values:
      - ../profiles/split-namespace.values.yaml
    template: templates/pipelines/cm-alloy-agent-env.yaml
    asserts:
      - matchRegex:
          path: data.AGENT_OTLP_DEST
          pattern: ':4317$'

  # --- host access -----------------------------------------------------------
  # Each of these is load-bearing: /sys is the cgroup hierarchy every counter
  # comes from, /run/containerd is where container->pod identity comes from
  # (without it the io.kubernetes.* labels never appear and the pipeline's
  # relabeling has nothing to map), / carries machine identity, /dev/disk names
  # block devices.
  - it: should mount the host paths cAdvisor reads, all read-only
    template: ../charts/alloy-agent/templates/controllers/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sys
            mountPath: /sys
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: containerd
            mountPath: /run/containerd
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: rootfs
            mountPath: /rootfs
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: containerd
            hostPath:
              path: /run/containerd

  # The headline security property: cAdvisor needs NO added capabilities in this
  # configuration. Verified out-of-band by running the rendered config under
  # `alloy run` with exactly this context. Guarding it so nobody "fixes" a
  # cAdvisor problem by reaching for SYS_ADMIN or privileged.
  - it: should need no added capabilities and no privilege escalation
    template: ../charts/alloy-agent/templates/controllers/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
      - notExists:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - notExists:
          path: spec.template.spec.containers[0].securityContext.privileged

  # `process` is the one collector that needs more, and what it needs is the host
  # PID namespace rather than a capability. Left false, cAdvisor reports 0
  # descriptors for every container but its own — silently, which is why the
  # collector ships disabled.
  - it: should not share the host PID namespace by default
    template: ../charts/alloy-agent/templates/controllers/daemonset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.hostPID
