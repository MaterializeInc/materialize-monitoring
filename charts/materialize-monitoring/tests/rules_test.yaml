# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Tests for which bundled alerting rules install, and what they say once they do.
#
# The rules are rendered at build time into pre-rendered/rules/prometheus/ and
# filtered here. Every mistake these tests lock down is silent at runtime: a rule
# gated on a capability the deployment has, a namespace placeholder left in an
# expression, or a misspelt name in `rules.disabled` all produce a healthy ruler
# evaluating the wrong set, and an alert that never fires reads exactly like one
# that has nothing to report.
#
# Presence is asserted with JSONPath filters on the parsed document
# (`spec.groups[*].rules[?(@.alert == "x")]`) rather than with the `*Raw` regex
# asserts, which read only non-YAML templates and pass vacuously on a manifest.
suite: alerting rules
release:
  name: test-mon
  namespace: test-monitoring
set:
  tags.default: true
  loki.loki.storage.bucketNames.chunks: "test-chunks"
  loki.loki.storage.bucketNames.ruler: "test-ruler"
  loki.networkPolicy.metrics.namespaceSelector:
    matchLabels:
      test-metrics: "true"
  loki.networkPolicy.ingress.namespaceSelector:
    matchLabels:
      loki-ok: "true"
  thanos.global.objstore.createSecret: true
  thanos.global.objstore.config: |
    type: s3
    config:
      bucket: test-thanos
      endpoint: s3.amazonaws.com
      region: us-east-1
templates:
  - templates/alerts/prometheusrules.yaml
  - templates/validate.yaml
  - templates/NOTES.txt
tests:
  # --- what installs --------------------------------------------------------

  # Three alert files and the ext-consensus recording rules.
  - it: installs the vetted default set as PrometheusRules
    template: templates/alerts/prometheusrules.yaml
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: materialize-monitoring
      - equal:
          path: metadata.namespace
          value: test-monitoring

  - it: installs a vetted rule without it being selected
    template: templates/alerts/prometheusrules.yaml
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - exists:
          path: spec.groups[*].rules[?(@.alert == "clusterd-error-kill")]

  - it: leaves an unvetted rule out until it is selected
    template: templates/alerts/prometheusrules.yaml
    documentSelector:
      path: metadata.name
      value: mzmon-infra-alerts
    asserts:
      - notExists:
          path: spec.groups[*].rules[?(@.alert == "k8s-daemonset-saturating-cpu")]

  # Capability-gated rules stay out until the deployment says it has what they
  # need. The CockroachDB rules read CockroachDB Cloud's export prefix, which no
  # stock install produces.
  - it: leaves capability-gated rules out even when every rule is selected
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.selected: ["*"]
    documentSelector:
      path: metadata.name
      value: mzmon-infra-alerts
    asserts:
      - notExists:
          path: spec.groups[?(@.name == "crdb")]

  - it: installs capability-gated rules once the capability is listed
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.selected: ["crdb"]
      rules.capabilities: ["crdb-dedicated"]
    documentSelector:
      path: metadata.name
      value: mzmon-infra-alerts
    asserts:
      - exists:
          path: spec.groups[?(@.name == "crdb")].rules[?(@.alert == "crdb-disk-usage-critical")]

  # The `loki` group also holds `alloy-log-drops`, which needs Alloy rather than
  # Loki, so the group survives and only the Loki rules leave it.
  - it: drops rules for a component the chart no longer collects
    template: templates/alerts/prometheusrules.yaml
    set:
      loki.monitoring.serviceMonitor.enabled: false
      rules.selected: ["loki"]
    documentSelector:
      path: metadata.name
      value: mzmon-infra-alerts
    asserts:
      - notExists:
          path: spec.groups[*].rules[?(@.alert == "loki-push-err-high")]
      - exists:
          path: spec.groups[*].rules[?(@.alert == "alloy-log-drops")]

  - it: disables a default rule by name
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.disabled: ["envd-terminated"]
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - notExists:
          path: spec.groups[*].rules[?(@.alert == "envd-terminated")]
      - exists:
          path: spec.groups[*].rules[?(@.alert == "clusterd-error-kill")]

  - it: renders nothing when rules are off
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # The template fails on any placeholder it does not fill, so a render with
  # every rule in it is the leftover check.
  - it: fills every placeholder when every rule installs
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.selected: ["*"]
      rules.capabilities:
        - synthetic-uptime
        - external-uptime
        - feature-flags
        - frontegg-auth
        - memory-limiter
        - crdb-dedicated
        - cilium
        - coredns
        - cert-manager
        - kubelet-metrics
        - swap-nodes
        - egress-gateway
      # Every provider adapter, with a declared database each, so the
      # externalDependencies placeholders are filled too.
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.rds.instances: [mz-metadata]
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: test-project
      pipeline.metrics.provider.gcp.cloudSql.instances: [mz-metadata]
      pipeline.metrics.provider.azure.enabled: true
      pipeline.metrics.provider.azure.subscriptionId: 00000000-0000-0000-0000-000000000000
      pipeline.metrics.provider.azure.postgres.servers: [mz-metadata]
      externalDependencies.consensus:
        - {flavor: rds, resourceId: mz-metadata}
        - {flavor: cloudsql, resourceId: mz-metadata}
        - {flavor: azure-postgres, resourceId: mz-metadata}
    asserts:
      - hasDocuments:
          count: 4

  # --- placeholders ---------------------------------------------------------

  - it: scopes environment rules to the configured namespaces
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.namespaces.environment: ["env-a", "env-b"]
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name == "environment_health")].rules[?(@.alert == "environment-pod-pending-critical")].expr
          pattern: 'namespace=~"env-a\|env-b"'

  - it: defaults the environment namespace to materialize-system.namespace
    template: templates/alerts/prometheusrules.yaml
    set:
      materialize-system.namespace: my-env
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name == "environment_health")].rules[?(@.alert == "environment-pod-pending-critical")].expr
          pattern: 'namespace=~"my-env"'

  - it: prefers materialize.namespaces over materialize-system.namespace
    template: templates/alerts/prometheusrules.yaml
    set:
      materialize.namespaces: ["scoped-a", "scoped-b"]
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name == "environment_health")].rules[?(@.alert == "environment-pod-pending-critical")].expr
          pattern: 'namespace=~"scoped-a\|scoped-b"'

  - it: excludes the configured namespaces
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.namespaces.exclude: ["scratch"]
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name == "environment_health")].rules[?(@.alert == "environment-pod-pending-critical")].expr
          pattern: 'namespace!~"scratch"'

  # `a^` matches no string. An empty alternation would be `namespace!~""`, which
  # drops every series that has a namespace at all.
  - it: renders an empty exclusion as a regex that matches nothing
    template: templates/alerts/prometheusrules.yaml
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name == "environment_health")].rules[?(@.alert == "environment-pod-pending-critical")].expr
          pattern: 'namespace!~"a\^"'

  - it: excludes the whole Materialize deployment from the infrastructure rules
    template: templates/alerts/prometheusrules.yaml
    documentSelector:
      path: metadata.name
      value: mzmon-infra-alerts
    asserts:
      - matchRegex:
          path: spec.groups[*].rules[?(@.alert == "k8s-infra-pod-pending-too-long")].expr
          pattern: 'namespace!~"materialize\|materialize-environment"'

  - it: grades infrastructure by the default workload tiers
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.selected: ["infra-memory-high"]
    documentSelector:
      path: metadata.name
      value: mzmon-infra-alerts
    asserts:
      - matchRegex:
          path: spec.groups[*].rules[?(@.alert == "infra-memory-high")].expr
          pattern: 'container=~"aws-load-balancer-controller\|aws-node\|[^"]*\|coredns\|'

  - it: grades infrastructure by the configured workload tiers
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.selected: ["infra-memory-high", "k8s-deployment-unavailable-critical"]
      rules.infraWorkloads.core: ["my-dns", "my-cni-.*"]
    documentSelector:
      path: metadata.name
      value: mzmon-infra-alerts
    asserts:
      - matchRegex:
          path: spec.groups[*].rules[?(@.alert == "infra-memory-high")].expr
          pattern: 'container=~"my-dns\|my-cni-\.\*"'
      - matchRegex:
          path: spec.groups[*].rules[?(@.alert == "k8s-deployment-unavailable-critical")].expr
          pattern: 'deployment=~"my-dns\|my-cni-\.\*"'

  # The complement is the case that matters: `pod-restart-rate-high` covers every
  # container not in the non-essential tier, so an empty tier has to widen it to
  # every container. `!~"a^"` does; `!~""` would keep only unnamed containers.
  - it: renders an empty workload tier as a regex that matches nothing
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.selected: ["pod-restart-rate-high"]
      rules.infraWorkloads.nonessential: []
    documentSelector:
      path: metadata.name
      value: mzmon-infra-alerts
    asserts:
      - matchRegex:
          path: spec.groups[*].rules[?(@.alert == "pod-restart-rate-high")].expr
          pattern: 'container!~"a\^"'

  # --- who an alert is for, and per-deployment overrides --------------------

  - it: labels the deployment's alerts for the platform
    template: templates/alerts/prometheusrules.yaml
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - equal:
          path: spec.groups[*].rules[?(@.alert == "environmentd-down")].labels.audience
          value: platform

  - it: labels a user cluster's alerts for the workload
    template: templates/alerts/prometheusrules.yaml
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-workload-alerts
    asserts:
      - equal:
          path: spec.groups[*].rules[?(@.alert == "cluster-hydration-stuck")].labels.audience
          value: workload
      - equal:
          path: spec.groups[*].rules[?(@.alert == "cluster-hydration-stuck")].for
          value: 1h

  - it: lets a deployment lengthen a rule's for
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.overrides:
        cluster-hydration-stuck:
          for: 6h
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-workload-alerts
    asserts:
      - equal:
          path: spec.groups[*].rules[?(@.alert == "cluster-hydration-stuck")].for
          value: 6h
      # Only the named rule changes.
      - equal:
          path: spec.groups[*].rules[?(@.alert == "cluster-memory-near-limit")].for
          value: 1m

  - it: merges override labels over the rule's own
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.overrides:
        cluster-memory-near-limit:
          labels:
            severity: warning
            team: analytics
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-workload-alerts
    asserts:
      - equal:
          path: spec.groups[*].rules[?(@.alert == "cluster-memory-near-limit")].labels
          value:
            severity: warning
            component: clusterd
            audience: workload
            team: analytics

  - it: reads Cloud's SQL metric prefix in cloud mode
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.selected: ["env-uptime-sla"]
      rules.capabilities: ["synthetic-uptime"]
      materialize.deploymentMode: cloud
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - matchRegex:
          path: spec.groups[*].rules[?(@.alert == "env-uptime-sla")].expr
          pattern: "v2_mz_can_connect"

  - it: reads the self-managed SQL metric prefix by default
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.selected: ["env-uptime-sla"]
      rules.capabilities: ["synthetic-uptime"]
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - matchRegex:
          path: spec.groups[*].rules[?(@.alert == "env-uptime-sla")].expr
          pattern: '\bmz_can_connect'
      - notMatchRegex:
          path: spec.groups[*].rules[?(@.alert == "env-uptime-sla")].expr
          pattern: "v2_mz_"

  - it: keeps the runbook link built from the alert name
    template: templates/alerts/prometheusrules.yaml
    documentSelector:
      path: metadata.name
      value: mzmon-materialize-alerts
    asserts:
      - matchRegex:
          path: spec.groups[*].rules[?(@.alert == "clusterd-error-kill")].annotations.runbook_url
          pattern: "common-alerts/#clusterd-error-kill$"

  # --- recording rules ------------------------------------------------------

  # The persist adapter reads Materialize's own calls, so it needs nothing
  # configured and nothing selected.
  - it: records the persist adapter wherever Materialize is
    template: templates/alerts/prometheusrules.yaml
    documentSelector:
      path: metadata.name
      value: mzmon-ext-consensus
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: recording-rules
      - equal:
          path: metadata.labels["mzmon.materialize.cloud/flavor"]
          value: promql
      - equal:
          path: spec.groups[?(@.name == "ext_consensus_persist")].rules[?(@.record == "ext:consensus_up")].labels.flavor
          value: persist
      - exists:
          path: spec.groups[?(@.name == "ext_consensus_persist")].rules[?(@.record == "ext:consensus_commit_latency_seconds:p99")]

  - it: leaves a provider adapter out where its pull is off
    template: templates/alerts/prometheusrules.yaml
    set:
      externalDependencies.consensus:
        - {flavor: rds, resourceId: mz-metadata}
    documentSelector:
      path: metadata.name
      value: mzmon-ext-consensus
    asserts:
      - notExists:
          path: spec.groups[?(@.name == "ext_consensus_rds")]
      - notExists:
          path: spec.groups[?(@.name == "ext_consensus_cloudsql")]
      - notExists:
          path: spec.groups[?(@.name == "ext_consensus_azure_postgres")]

  # The pull watches Grafana's database too, and the provider cannot tell the
  # two apart; only the declared one is a metadata database.
  - it: records a provider adapter for the declared database only
    template: templates/alerts/prometheusrules.yaml
    set:
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.rds.instances: [mz-metadata, mz-grafana]
      externalDependencies.consensus:
        - {flavor: rds, resourceId: mz-metadata}
    documentSelector:
      path: metadata.name
      value: mzmon-ext-consensus
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name == "ext_consensus_rds")].rules[?(@.record == "ext:consensus_xid_used_ratio")].expr
          pattern: 'dimension_DBInstanceIdentifier=~"\(\?i\)mz-metadata"'
      - notMatchRegex:
          path: spec.groups[?(@.name == "ext_consensus_rds")].rules[?(@.record == "ext:consensus_xid_used_ratio")].expr
          pattern: "mz-grafana"
      - equal:
          path: spec.groups[?(@.name == "ext_consensus_rds")].rules[?(@.record == "ext:consensus_xid_used_ratio")].labels.flavor
          value: rds

  - it: records nothing for a provider adapter until its database is declared
    template: templates/alerts/prometheusrules.yaml
    set:
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: test-project
      pipeline.metrics.provider.gcp.cloudSql.instances: [mz-metadata, mz-grafana]
    documentSelector:
      path: metadata.name
      value: mzmon-ext-consensus
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name == "ext_consensus_cloudsql")].rules[?(@.record == "ext:consensus_up")].expr
          pattern: 'database_id=~"\(\?i\)\.\+:\(a\^\)"'

  - it: joins several declared databases of one flavor into one matcher
    template: templates/alerts/prometheusrules.yaml
    set:
      pipeline.metrics.provider.azure.enabled: true
      pipeline.metrics.provider.azure.subscriptionId: 00000000-0000-0000-0000-000000000000
      pipeline.metrics.provider.azure.postgres.servers: [mz-a, mz-b]
      externalDependencies.consensus:
        - {flavor: azure-postgres, resourceId: mz-a}
        - {flavor: azure-postgres, resourceId: mz-b}
    documentSelector:
      path: metadata.name
      value: mzmon-ext-consensus
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name == "ext_consensus_azure_postgres")].rules[?(@.record == "ext:consensus_storage_used_ratio")].expr
          pattern: 'resourceName=~"\(\?i\)mz-a\|mz-b"'

  - it: records nothing when rules are off
    template: templates/alerts/prometheusrules.yaml
    set:
      rules.enabled: false
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.rds.instances: [mz-metadata]
      externalDependencies.consensus:
        - {flavor: rds, resourceId: mz-metadata}
    asserts:
      - hasDocuments:
          count: 0

  - it: warns when a pull watches databases none of which is declared
    template: templates/NOTES.txt
    set:
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.rds.instances: [mz-metadata, mz-grafana]
    asserts:
      - matchRegexRaw:
          pattern: 'pipeline.metrics.provider.cloudwatch.rds.instances watches mz-metadata, mz-grafana, but externalDependencies.consensus names none of them'

  - it: warns when a declared database is not watched by its pull
    template: templates/NOTES.txt
    set:
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.rds.instances: [mz-grafana]
      externalDependencies.consensus:
        - {flavor: rds, resourceId: mz-metadata}
    asserts:
      - matchRegexRaw:
          pattern: 'names the rds database "mz-metadata", which pipeline.metrics.provider.cloudwatch.rds.instances does not list'

  - it: warns when a declared database's pull is off
    template: templates/NOTES.txt
    set:
      externalDependencies.consensus:
        - {flavor: cloudsql, resourceId: mz-metadata}
    asserts:
      - matchRegexRaw:
          pattern: 'names the cloudsql database mz-metadata, but pipeline.metrics.provider.gcp is off'

  - it: matches a declared database to its pull regardless of case
    template: templates/NOTES.txt
    set:
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.rds.instances: [MZ-Metadata]
      externalDependencies.consensus:
        - {flavor: rds, resourceId: mz-metadata}
    asserts:
      - notMatchRegexRaw:
          pattern: "externalDependencies"

  - it: warns that a tiered thanos destination drops recorded series
    template: templates/NOTES.txt
    set:
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.minMetricImportance: recommended
    asserts:
      - matchRegexRaw:
          pattern: 'recorded series such as ext:consensus_up carry no tier'

  # --- validators -----------------------------------------------------------

  - it: rejects an unknown consensus flavor
    template: templates/validate.yaml
    set:
      externalDependencies.consensus:
        - {flavor: mysql, resourceId: mz-metadata}
    asserts:
      - failedTemplate:
          errorPattern: 'externalDependencies.consensus\[0\].flavor is "mysql"; it is one of azure-postgres, cloudsql, rds'

  # The id lands in a PromQL string unescaped.
  - it: rejects a resource id that is not a provider name
    template: templates/validate.yaml
    set:
      externalDependencies.consensus:
        - {flavor: rds, resourceId: 'mz"db'}
    asserts:
      - failedTemplate:
          errorPattern: 'externalDependencies.consensus\[0\].resourceId is "mz\\"db"'

  - it: rejects a field the chart does not read yet
    template: templates/validate.yaml
    set:
      externalDependencies.consensus:
        - {flavor: rds, resourceId: mz-metadata, environments: [main]}
    asserts:
      - failedTemplate:
          errorPattern: 'externalDependencies.consensus\[0\].environments is not a field'

  - it: rejects a dependency the chart does not read yet
    template: templates/validate.yaml
    set:
      externalDependencies.objectStore: []
    asserts:
      - failedTemplate:
          errorPattern: 'externalDependencies.objectStore is not a dependency this chart reads'

  - it: rejects consensus given as a single entry rather than a list
    template: templates/validate.yaml
    set:
      externalDependencies.consensus:
        flavor: rds
        resourceId: mz-metadata
    asserts:
      - failedTemplate:
          errorPattern: 'externalDependencies.consensus is .*; it is a list'

  - it: rejects an unknown capability
    template: templates/validate.yaml
    set:
      rules.capabilities: ["cockroach"]
    asserts:
      - failedTemplate:
          errorPattern: 'rules.capabilities names "cockroach", which is not a capability'

  - it: rejects a misspelt name in rules.disabled
    template: templates/validate.yaml
    set:
      rules.disabled: ["envd-terminted"]
    asserts:
      - failedTemplate:
          errorPattern: 'rules.disabled names "envd-terminted", which is not an alert'

  - it: rejects a misspelt name in rules.selected
    template: templates/validate.yaml
    set:
      rules.selected: ["crbd"]
    asserts:
      - failedTemplate:
          errorPattern: 'rules.selected names "crbd", which is neither an alert nor a rule group'

  - it: rejects a namespace that is not a Kubernetes name
    template: templates/validate.yaml
    set:
      rules.namespaces.exclude: ["Not_A_Namespace"]
    asserts:
      - failedTemplate:
          errorPattern: 'rules.namespaces.exclude contains "Not_A_Namespace"'

  # An entry is pasted into a PromQL string literal, so a quote would end it.
  - it: rejects a workload entry that would break out of the expression
    template: templates/validate.yaml
    set:
      rules.infraWorkloads.important: ['cert-manager", foo="bar']
    asserts:
      - failedTemplate:
          errorPattern: 'rules.infraWorkloads.important contains .*may not be empty or contain a quote'

  - it: rejects a workload tier that does not exist
    template: templates/validate.yaml
    set:
      rules.infraWorkloads.critical: ["coredns"]
    asserts:
      - failedTemplate:
          errorPattern: 'rules.infraWorkloads.critical is not a tier'

  - it: rejects an override for an alert that does not exist
    template: templates/validate.yaml
    set:
      rules.overrides:
        cluster-hydraton-stuck:
          for: 6h
    asserts:
      - failedTemplate:
          errorPattern: 'rules.overrides names "cluster-hydraton-stuck", which is not an alert'

  - it: rejects an override whose for is not a duration
    template: templates/validate.yaml
    set:
      rules.overrides:
        cluster-hydration-stuck:
          for: six hours
    asserts:
      - failedTemplate:
          errorPattern: 'rules.overrides.cluster-hydration-stuck.for is "six hours", which is not a Prometheus duration'

  # `with` would read `0` as absent and drop it without a word.
  - it: rejects an override whose for is falsy rather than ignoring it
    template: templates/validate.yaml
    set:
      rules.overrides:
        cluster-hydration-stuck:
          for: 0
    asserts:
      - failedTemplate:
          errorPattern: 'rules.overrides.cluster-hydration-stuck.for is 0, which is not a Prometheus duration'

  - it: rejects override labels that are not a map
    template: templates/validate.yaml
    set:
      rules.overrides:
        cluster-hydration-stuck:
          labels: ""
    asserts:
      - failedTemplate:
          errorPattern: 'rules.overrides.cluster-hydration-stuck.labels is ""; it must be a map'

  - it: rejects an override that would change the expression
    template: templates/validate.yaml
    set:
      rules.overrides:
        cluster-stale:
          expr: vector(1)
    asserts:
      - failedTemplate:
          errorPattern: 'rules.overrides.cluster-stale.expr is not something an override can change'

  - it: rejects an override severity the routes do not know
    template: templates/validate.yaml
    set:
      rules.overrides:
        cluster-stale:
          labels:
            severity: page
    asserts:
      - failedTemplate:
          errorPattern: 'rules.overrides.cluster-stale.labels.severity is "page"'

  - it: rejects an unknown deployment mode
    template: templates/validate.yaml
    set:
      materialize.deploymentMode: hybrid
    asserts:
      - failedTemplate:
          errorPattern: 'materialize.deploymentMode is "hybrid"'

  - it: warns when a selected rule is gated out by a missing capability
    template: templates/NOTES.txt
    set:
      rules.selected: ["crdb-backup-missing"]
    asserts:
      - matchRegexRaw:
          pattern: 'rules.selected names "crdb-backup-missing", which requires crdb-dedicated'

  - it: warns that an override for a rule that is not installed does nothing
    template: templates/NOTES.txt
    set:
      rules.overrides:
        cluster-cpu-high:
          for: 30m
    asserts:
      - matchRegexRaw:
          pattern: 'rules.overrides names "cluster-cpu-high", which is not installed'

  - it: warns when rules render with no ruler to evaluate them
    template: templates/NOTES.txt
    set:
      thanos.ruler.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "thanos.ruler is off, so nothing in this release evaluates the PromQL rules"

  - it: warns that the retired config.rules keys do nothing
    template: templates/NOTES.txt
    set:
      config.rules.prometheus.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "config.rules and config.alerts were never read"

  # A destination filtering below a rule's metrics starves the rule, and the rule
  # reads as healthy.
  - it: warns when the thanos destination filters out a selected rule's metrics
    template: templates/NOTES.txt
    set:
      rules.selected: ["loki-req-duration-high"]
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.minMetricImportance: recommended
    asserts:
      - matchRegexRaw:
          pattern: 'Alert "loki-req-duration-high" reads a metric in the "extended" tier'
