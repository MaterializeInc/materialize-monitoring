# Scenario for `bin/check-alertmanager-config.sh`: the smallest real deployment —
# one chat channel, the `evaluation` preset, and a suppressed severity.
alerting:
  preset: evaluation
  receivers:
    chat:
      class: normal
      config:
        slack_configs:
          - channel: "#materialize"
            api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack-url
