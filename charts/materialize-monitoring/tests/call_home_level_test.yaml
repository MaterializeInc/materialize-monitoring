# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# callHome.level: the call-home consent ladder (DEP-280).
#
# The first section is the assertion the ladder rests on: an install that
# hasn't chosen a level sends nothing to Materialize. A default that drifted
# on in a refactor would install cleanly, so every shipped profile that touches
# the pipeline is rendered here too. Add a new one to that list.
suite: call-home level
release:
  name: test-mon
  namespace: monitoring
set:
  tags.default: false
  tags.pipeline: true
  pipeline.destinations.loki.url: https://logs.example.com/loki/api/v1/push
  pipeline.destinations.thanos.url: https://metrics.example.com/api/v1/receive
tests:
  # --- the default sends nothing -----------------------------------------------
  - it: should send nothing to the control plane by default
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'
        template: templates/pipelines/cm-alloy-gateway.yaml
      - notMatchRegex:
          path: data.GATEWAY_CONTROLPLANE_DEST
          pattern: '.'
        template: templates/pipelines/cm-alloy-gateway-env.yaml

  - it: should say so in the install notes
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'Call-home level: off \(nothing is sent to Materialize\)'

  # An endpoint in the environment is not consent.
  - it: should send nothing with a control-plane endpoint in the environment
    set:
      pipeline.env.GATEWAY_CONTROLPLANE_DEST: https://telemetry.c.cloud.materialize.com
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane'

  # YAML 1.1 reads an unquoted `off` as `false`.
  - it: should read an unquoted off as off
    set:
      callHome.level: false
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'Call-home level: off'

  - it: should send nothing with the aws-amp-fanout profile
    values:
      - ../profiles/aws-amp-fanout.values.yaml
    set:
      # The profile keeps the bundled Thanos on, which wants a bucket, and its
      # placeholder URL fails the reachability validator.
      thanos.global.objstore.config: |
        type: FILESYSTEM
      pipeline.destinations.amp.url: https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-1/api/v1/remote_write
      pipeline.destinations.amp.sigv4.region: us-east-1
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'

  - it: should send nothing with the adhoc profile
    values:
      - ../profiles/adhoc.values.yaml
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'

  # Composed as the tier-1 install composes it.
  - it: should send nothing with the kind-tier1 profile
    values:
      - ../profiles/loki-test.values.yaml
      - ../profiles/kind-tier1.values.yaml
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'

  - it: should send nothing with the loki-test profile
    values:
      - ../profiles/loki-test.values.yaml
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'

  - it: should send nothing with the mtls profiles
    values:
      - ../profiles/mtls.values.yaml
      - ../profiles/mtls-phase2.values.yaml
      - ../profiles/mtls-phase3.values.yaml
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'

  - it: should send nothing with the otel-metrics-fanout profile
    values:
      - ../profiles/otel-metrics-fanout.values.yaml
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'

  - it: should send nothing with the otlp-metrics-honeycomb profile
    values:
      - ../profiles/otlp-metrics-honeycomb.values.yaml
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'

  - it: should send nothing with the s3-worm profile
    values:
      - ../profiles/s3-worm.values.yaml
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane|telemetry\.c\.'

  # --- off is not a destination ------------------------------------------------
  # An entry written by hand, with no level, would otherwise stop sending
  # without a word.
  - it: should refuse a control-plane entry at off
    set:
      pipeline.destinations.controlPlane.url: https://telemetry.c.cloud.materialize.com
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "pipeline.destinations.controlPlane is the destination for Materialize's control plane, but callHome.level is off"

  - it: should accept a disabled control-plane entry at off, and send nothing
    set:
      pipeline.destinations.controlPlane.enabled: false
      pipeline.destinations.controlPlane.url: https://telemetry.c.cloud.materialize.com
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane'

  - it: should refuse a level that isn't on the ladder
    set:
      callHome.level: everything
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'callHome.level is "everything". It must be off, heartbeat, alerts, metrics, or diagnostics'

  - it: should refuse an unquoted on, which YAML reads as true
    set:
      callHome.level: true
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'callHome.level is "true"'

  # --- each rung -----------------------------------------------------------------
  - it: should send only the heartbeat at heartbeat
    set:
      callHome.level: heartbeat
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - equal:
          path: data.GATEWAY_CONTROLPLANE_DEST_METRICS_ALLOWLIST
          value: "mzmon:build_info:count|mzmon:cluster_created_timestamp_seconds|mzmon:environment_info|mzmon:heartbeat|mzmon:node_uname_info:count|mzmon:rule_evaluation_failures:rate5m|mzmon:rules:count"

  - it: should say heartbeat sends to the control plane
    set:
      callHome.level: heartbeat
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'Destination: controlPlane \(otlp: heartbeat metrics\)'
      - matchRegexRaw:
          pattern: 'Call-home level: heartbeat \(sends to the controlPlane destination\)'

  - it: should render no log path at heartbeat
    set:
      callHome.level: heartbeat
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol\.exporter\.otlphttp "dest_controlPlane"'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol\.receiver\.loki "dest_controlPlane"'

  - it: should add alert state at alerts
    set:
      callHome.level: alerts
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - equal:
          path: data.GATEWAY_CONTROLPLANE_DEST_METRICS_ALLOWLIST
          value: "ALERTS|mzmon:build_info:count|mzmon:cluster_created_timestamp_seconds|mzmon:environment_info|mzmon:heartbeat|mzmon:node_uname_info:count|mzmon:rule_evaluation_failures:rate5m|mzmon:rules:count"

  - it: should name the alerts tier in the notes at alerts
    set:
      callHome.level: alerts
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'Destination: controlPlane \(otlp: alerts metrics\)'

  # The control plane reads a missing heartbeat as an install gone dark. This
  # suite runs without Thanos, so the heartbeat isn't recorded by default.
  - it: should warn when a level is set but the heartbeat isn't recorded
    set:
      callHome.level: heartbeat
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "callHome.level is heartbeat, but this release doesn't record the heartbeat"

  - it: should not warn about the heartbeat where this release records it
    set:
      callHome.level: heartbeat
      tags.thanos: true
      thanos.global.objstore.createSecret: false
    template: NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: "doesn't record the heartbeat"

  - it: should not warn about the heartbeat where another release runs Thanos
    set:
      callHome.level: heartbeat
      otherReleases.thanos: true
    template: NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: "doesn't record the heartbeat"

  - it: should not warn about the heartbeat at off
    set:
      rules.enabled: false
    template: NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: "doesn't record the heartbeat"

  - it: should send essential metrics and no logs at metrics
    set:
      callHome.level: metrics
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'Destination: controlPlane \(otlp: essential metrics\)'
      - matchRegexRaw:
          pattern: 'Call-home level: metrics \(sends to the controlPlane destination\)'

  - it: should render no log path at metrics
    set:
      callHome.level: metrics
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol\.exporter\.otlphttp "dest_controlPlane"'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol\.receiver\.loki "dest_controlPlane"'

  - it: should leave the secret filter to its mode at metrics
    set:
      callHome.level: metrics
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - notExists:
          path: data.GATEWAY_SECRETFILTER_RATE

  - it: should send essential metrics and logs at diagnostics
    values:
      - ../profiles/call-home.values.yaml
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'Destination: controlPlane \(otlp: logs, essential metrics\)'

  # --- the level is a ceiling --------------------------------------------------
  - it: should refuse logs below diagnostics
    set:
      callHome.level: metrics
      pipeline.destinations.controlPlane.logs.enabled: true
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "callHome.level is metrics, which sends no logs"

  - it: should refuse a tier wider than the level's
    set:
      callHome.level: alerts
      pipeline.destinations.controlPlane.metrics.minMetricImportance: essential
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'callHome.level is alerts, which sends metrics at the alerts tier, but pipeline.destinations.controlPlane.metrics.minMetricImportance is "essential". An entry can only send less than its level: set it to heartbeat, alerts.'

  - it: should refuse a tier wider than essential
    set:
      callHome.level: metrics
      pipeline.destinations.controlPlane.metrics.minMetricImportance: recommended
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'pipeline.destinations.controlPlane.metrics.minMetricImportance is "recommended"'

  - it: should refuse a log floor below WARN
    values:
      - ../profiles/call-home.values.yaml
    set:
      pipeline.destinations.controlPlane.logs.minLevel: INFO
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'logs.minLevel is "INFO". An entry can only send less than its level: set it to WARN, ERROR, CRITICAL'

  - it: should refuse a higher rate
    values:
      - ../profiles/call-home.values.yaml
    set:
      pipeline.destinations.controlPlane.logs.rateLimit.rate: 501
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "logs.rateLimit.rate is 501"

  - it: should refuse a higher burst
    values:
      - ../profiles/call-home.values.yaml
    set:
      pipeline.destinations.controlPlane.logs.rateLimit.burst: 5001
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "logs.rateLimit.burst is 5001"

  - it: should refuse another type
    set:
      callHome.level: metrics
      pipeline.destinations.controlPlane.type: prometheus
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'pipeline.destinations.controlPlane.type is "prometheus"'

  # --- an entry can send less, and change the wire -----------------------------
  - it: should send less when an entry narrows the level
    values:
      - ../profiles/call-home.values.yaml
    set:
      pipeline.destinations.controlPlane.logs.minLevel: ERROR
      pipeline.destinations.controlPlane.logs.selector: '{namespace=~"environment-.+"}'
      pipeline.destinations.controlPlane.logs.rateLimit.rate: 100
      pipeline.destinations.controlPlane.logs.rateLimit.burst: 1000
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.process "dest_controlPlane" \{[\s\S]*?selector = "\{level=~\\"TRACE\|DEBUG\|INFO\|WARN\|UNKNOWN\\"\}"\s*action = "drop"[\s\S]*?stage\.limit \{\s*rate = 100\s*burst = 1000'

  - it: should send a narrower tier when the entry names one
    set:
      callHome.level: metrics
      pipeline.destinations.controlPlane.metrics.minMetricImportance: alerts
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - equal:
          path: data.GATEWAY_CONTROLPLANE_DEST_METRICS_ALLOWLIST
          value: "ALERTS|mzmon:build_info:count|mzmon:cluster_created_timestamp_seconds|mzmon:environment_info|mzmon:heartbeat|mzmon:node_uname_info:count|mzmon:rule_evaluation_failures:rate5m|mzmon:rules:count"

  - it: should send to another control plane when the entry names one
    set:
      callHome.level: metrics
      pipeline.destinations.controlPlane.url: https://telemetry.c.staging.cloud.materialize.com
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - equal:
          path: data.GATEWAY_CONTROLPLANE_DEST
          value: https://telemetry.c.staging.cloud.materialize.com

  - it: should send nothing when the entry turns the destination off
    values:
      - ../profiles/call-home.values.yaml
    set:
      pipeline.destinations.controlPlane.enabled: false
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'dest_controlPlane'
