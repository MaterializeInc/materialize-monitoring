# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# `pipeline.gateway.clientCertificateTenancy`: each OTLP request's tenant from
# the header a TLS-terminating proxy sets from the client certificate.
#
# The identity stages themselves are tested on `alloy run`, in
# packages/mzmon-lib/tests/gateway_client_tenant.rs. These hold the chart to
# wiring them in only when asked, with the header and format the values name,
# and to refusing the setting while every pod could reach the OTLP ports and
# send the header itself.
suite: client certificate tenancy
release:
  name: test-mon
  namespace: test-monitoring
set:
  tags.default: false
  tags.pipeline: true
  pipeline.destinations.loki.enabled: false
  pipeline.destinations.thanos.enabled: false
tests:
  - it: should leave the OTLP receiver and inputBridge as they are by default
    templates:
      - templates/pipelines/cm-alloy-gateway.yaml
      - templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'include_metadata'
        template: templates/pipelines/cm-alloy-gateway.yaml
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol\.receiver\.otlp "gateway" \{[\s\S]*?logs = \[\s*otelcol\.exporter\.loki\.bridge\.input,'
        template: templates/pipelines/cm-alloy-gateway.yaml
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol\.receiver\.prometheus "inputBridge" \{\s*output \{\s*metrics = \[\s*otelcol\.processor\.transform\.inputMetricProcessor\.input,'
        template: templates/pipelines/cm-alloy-gateway.yaml
      - notExists:
          path: data.GATEWAY_CLIENT_TENANT_HEADER
        template: templates/pipelines/cm-alloy-gateway-env.yaml

  - it: should read the ALB's subject header on both listeners and scrub every other metric path when on
    templates:
      - templates/pipelines/cm-alloy-gateway.yaml
      - templates/pipelines/validator/cm-validate-gateway.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      alloy-gateway.networkPolicy.ingress: &proxySubnets
        - ports:
            - port: 4317
              protocol: TCP
            - port: 4318
              protocol: TCP
          from:
            - ipBlock:
                cidr: 10.0.0.0/24
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'grpc \{\s*include_metadata = true[\s\S]*http \{\s*include_metadata = true'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'output \{\s*metrics = \[\s*otelcol\.processor\.attributes\.clientTenantSubject\.input,\s*\]\s*logs = \[\s*otelcol\.processor\.attributes\.clientTenantSubject\.input,'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol\.receiver\.prometheus "inputBridge" \{\s*output \{\s*metrics = \[\s*otelcol\.processor\.transform\.localTenant\.input,'

  - it: should pass the header to the gateway lowercased
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      pipeline.gateway.clientCertificateTenancy.header: X-SSL-Client-S-DN
      alloy-gateway.networkPolicy.ingress: *proxySubnets
    asserts:
      - equal:
          path: data.GATEWAY_CLIENT_TENANT_HEADER
          value: x-ssl-client-s-dn

  - it: should read Envoy's X-Forwarded-Client-Cert as xfcc unless told otherwise
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      pipeline.gateway.clientCertificateTenancy.header: X-Forwarded-Client-Cert
      alloy-gateway.networkPolicy.ingress: *proxySubnets
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'logs = \[\s*otelcol\.processor\.attributes\.clientTenantXfcc\.input,'

  - it: should take an explicit format over the header's
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      pipeline.gateway.clientCertificateTenancy.header: X-Forwarded-Client-Cert
      pipeline.gateway.clientCertificateTenancy.format: subject
      alloy-gateway.networkPolicy.ingress: *proxySubnets
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'logs = \[\s*otelcol\.processor\.attributes\.clientTenantSubject\.input,'

  - it: should refuse a header name that isn't one
    template: templates/validate.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      pipeline.gateway.clientCertificateTenancy.header: "X-SSL Client: DN"
      alloy-gateway.networkPolicy.ingress: *proxySubnets
    asserts:
      - failedTemplate:
          errorPattern: "isn't an HTTP header name"

  - it: should refuse a format it can't read
    template: templates/validate.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      pipeline.gateway.clientCertificateTenancy.format: pem
      alloy-gateway.networkPolicy.ingress: *proxySubnets
    asserts:
      - failedTemplate:
          errorPattern: 'format is "pem"\. It must be subject'

  - it: should refuse it while the chart's default policy admits every pod to the OTLP ports
    template: templates/validate.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'alloy-gateway\.networkPolicy\.ingress\[0\] admits every pod to the OTLP ports'

  - it: should refuse it with no NetworkPolicy
    template: templates/validate.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      alloy-gateway.networkPolicy.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "alloy-gateway.networkPolicy doesn't restrict ingress"

  # A rule that lists no ports covers every port, a rule with no `from` admits
  # every source, and an empty selector matches everything.
  - it: should refuse a rule that covers the OTLP ports by omission
    template: templates/validate.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      alloy-gateway.networkPolicy.ingress:
        - from:
            - podSelector: {}
        - ports:
            - port: otlp-http
              protocol: TCP
        - ports:
            - port: 4317
              protocol: TCP
          from:
            - namespaceSelector:
                matchLabels: {}
              podSelector: {}
    asserts:
      - failedTemplate:
          errorPattern: 'alloy-gateway\.networkPolicy\.ingress\[0\], ingress\[1\], ingress\[2\] admits every pod'

  - it: should accept an in-cluster proxy its selector names
    template: templates/validate.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      pipeline.gateway.clientCertificateTenancy.header: X-Forwarded-Client-Cert
      alloy-gateway.networkPolicy.ingress:
        - ports:
            - port: 4317
              protocol: TCP
            - port: 4318
              protocol: TCP
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: envoy-gateway-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
    asserts:
      - notFailedTemplate: {}

  - it: should refuse a receiver that asks the AWS load balancer for a client certificate
    template: templates/validate.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      alloy-gateway.networkPolicy.ingress: *proxySubnets
      pipeline.logging.gateway.server.tls: &clientCertRequired
        enabled: true
        certFile: /etc/tls/tls.crt
        keyFile: /etc/tls/tls.key
        clientCAFile: /etc/tls/ca.crt
        clientAuth: RequireAndVerifyClientCert
    asserts:
      - failedTemplate:
          errorPattern: 'But pipeline\.logging\.gateway\.server\.tls\.clientAuth is RequireAndVerifyClientCert'

  # nginx and Envoy can present a certificate of their own.
  - it: should let a receiver behind another proxy require a client certificate
    template: templates/validate.yaml
    set:
      pipeline.gateway.clientCertificateTenancy.enabled: true
      pipeline.gateway.clientCertificateTenancy.header: X-SSL-Client-S-DN
      alloy-gateway.networkPolicy.ingress: *proxySubnets
      pipeline.logging.gateway.server.tls: *clientCertRequired
      pipeline.logging.agent.destination.loki.tls:
        enabled: true
        certFile: /etc/tls/agent.crt
        keyFile: /etc/tls/agent.key
    asserts:
      - notFailedTemplate: {}
