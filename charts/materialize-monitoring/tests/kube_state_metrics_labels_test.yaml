# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# Node and pod labels on `kube_node_labels` and `kube_pod_labels`.
#
# kube-state-metrics 2.x publishes neither family unless the allowlist names a
# label for that resource, so losing an entry does not thin the metric — it
# removes it. Without `nodes`, every per-pool panel on Infrastructure Autoscaling
# goes empty. Without `pods`, nothing joins a `kube_pod_*` family to a
# Materialize cluster or replica. Neither fails anything else.
#
# Both entries render into one flag, so the whole flag is pinned: a value
# written to a path the subchart does not read is still valid YAML.
suite: kube-state-metrics node and pod labels
chart:
  version: 1.2.3
  appVersion: 4.5.6
release:
  name: test-mon
  namespace: test-monitoring
set:
  tags.default: false
  tags.kube-state-metrics: true
tests:
  - it: should copy the node pool, instance type and zone, and the Materialize replica identity
    template: ../charts/kube-state-metrics/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metric-labels-allowlist=nodes=[karpenter.sh/nodepool,eks.amazonaws.com/nodegroup,cloud.google.com/gke-nodepool,kubernetes.azure.com/agentpool,node.kubernetes.io/instance-type,topology.kubernetes.io/zone],pods=[cluster.environmentd.materialize.cloud/cluster-id,cluster.environmentd.materialize.cloud/replica-id,cluster.environmentd.materialize.cloud/size,materialize.cloud/environment-id]

  # One series per object either way; every label on every object is not cheap,
  # and a wildcard also copies labels an operator never meant to export.
  - it: should never copy every node or pod label
    template: ../charts/kube-state-metrics/templates/deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--metric-labels-allowlist=/)]
          pattern: '(nodes|pods)=\[\*\]'

  # The allowlist and the rename are two halves of one change in two subchart
  # keys. With the allowlist alone the join keys are the long `label_*` names.
  - it: should publish the Materialize pod labels under their canonical names
    template: ../charts/kube-state-metrics/templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: http
      - equal:
          path: spec.endpoints[0].metricRelabelings
          value:
            - sourceLabels: [label_cluster_environmentd_materialize_cloud_cluster_id]
              targetLabel: cluster_id
            - sourceLabels: [label_cluster_environmentd_materialize_cloud_replica_id]
              targetLabel: replica_id
            - sourceLabels: [label_cluster_environmentd_materialize_cloud_size]
              targetLabel: replica_size
            - sourceLabels: [label_materialize_cloud_environment_id]
              targetLabel: environment_id
            - action: labeldrop
              regex: label_cluster_environmentd_materialize_cloud_(cluster_id|replica_id|size)|label_materialize_cloud_environment_id

  # `honorLabels` and the rename share an endpoint, and an override of one block
  # can drop the other. Losing `honorLabels` rewrites every `namespace` and `pod`
  # to the exporter's own; see `kube_state::labels_are_honored`.
  - it: should keep honoring the exporter's labels beside the rename
    template: ../charts/kube-state-metrics/templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].honorLabels
          value: true
