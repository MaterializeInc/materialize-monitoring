# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# The gateway's ingest secret filter.
#
# `packages/mzmon-lib/tests/gateway_secret_filter.rs` walks the pre-rendered
# pipeline and its stubs, and fails if any log source reaches a sink without a
# `loki.secretfilter`. The chart renders the real `loki.source.api` from a
# helper instead of the stub, so these hold the helper to the same edge.
suite: alloy gateway secret filter
release:
  name: test-mon
  namespace: test-monitoring
set:
  tags.default: false
  tags.pipeline: true
  pipeline.destinations.loki.enabled: false
  pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.enabled: false
tests:
  # A second receiver here, such as the debug tap, would see every pushed line
  # before the filter does.
  - it: should forward Loki pushes only to the prefilter
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.source\.api "gateway" \{\s*forward_to = \[\s*loki\.process\.inputPrefilter\.receiver,\s*\]'

  - it: should scan both tiers, off until the rate is set
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter "ingest" \{'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter "ingestBulk" \{'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'rate\s+= encoding\.from_json\(coalesce\(sys\.env\("GATEWAY_SECRETFILTER_RATE"\), "0"\)\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'rate\s+= encoding\.from_json\(coalesce\(sys\.env\("GATEWAY_SECRETFILTER_BULK_RATE"\), "0"\)\)'

  # Alloy refuses to start when `gitleaks_config` names a file that is not
  # there. The subchart mounts every key of the gateway's ConfigMap at
  # /etc/alloy/, so the rules ride in the same ConfigMap as the config that
  # reads them, and no mount override can separate the two.
  - it: should ship the ingest rules beside the config that reads them
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["secretfilter-ingest.toml"]
          pattern: '(?m)^\[extend\]\nuseDefault = true$'
      - matchRegex:
          path: data["secretfilter-ingest.toml"]
          pattern: 'id = "mzmon-url-userinfo"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter "ingest" \{[^}]*gitleaks_config\s+= "/etc/alloy/secretfilter-ingest\.toml"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter "ingestBulk" \{[^}]*gitleaks_config\s+= "/etc/alloy/secretfilter-ingest\.toml"'

  - it: should mount the whole gateway ConfigMap at /etc/alloy
    template: ../charts/alloy-gateway/templates/controllers/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: mzmon-alloy-gateway
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/alloy

  # Shadow mode scans a copy of every line, so off must copy nothing: the chart
  # takes the shadow receiver out of the prefilter's fan-out instead of wiring
  # a branch that drops every line. The template fails the render if that entry
  # stops matching, so these hold both states.
  - it: should leave the shadow branch unwired by default
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.process "inputPrefilter" \{\s*forward_to = \[\s*loki\.relabel\.tierFull\.receiver,\s*loki\.relabel\.tierBulk\.receiver,\s*\]'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter\.shadow\.receiver'

  - it: should wire the shadow branch in shadow mode
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      pipeline.logging.secretFilter.mode: shadow
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.process "inputPrefilter" \{\s*forward_to = \[\s*loki\.relabel\.tierFull\.receiver,\s*loki\.relabel\.tierBulk\.receiver,\s*loki\.secretfilter\.shadow\.receiver,\s*\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter "shadow" \{[^}]*gitleaks_config\s+= "/etc/alloy/secretfilter-ingest\.toml"'

  # `on` scans every line by setting both instances' rates, which the pipeline
  # reads from the environment. Off and shadow leave them unset, so the pipeline
  # defaults them to 0.
  - it: should leave both rates unset unless the mode is on
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - notExists:
          path: data.GATEWAY_SECRETFILTER_RATE
      - notExists:
          path: data.GATEWAY_SECRETFILTER_BULK_RATE

  - it: should scan every line when the mode is on
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    set:
      pipeline.logging.secretFilter.mode: "on"
    asserts:
      - equal:
          path: data.GATEWAY_SECRETFILTER_RATE
          value: "1"
      - equal:
          path: data.GATEWAY_SECRETFILTER_BULK_RATE
          value: "1"

  - it: should leave the shadow branch unwired when the mode is on
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      pipeline.logging.secretFilter.mode: "on"
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter\.shadow\.receiver'

  # A rate in pipeline.env is how an install scans only part of the bulk tier.
  - it: should let pipeline.env set a rate when the mode is on
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    set:
      pipeline.logging.secretFilter.mode: "on"
      pipeline.env.GATEWAY_SECRETFILTER_BULK_RATE: "0.25"
    asserts:
      - equal:
          path: data.GATEWAY_SECRETFILTER_RATE
          value: "1"
      - equal:
          path: data.GATEWAY_SECRETFILTER_BULK_RATE
          value: "0.25"

  # YAML 1.1 reads an unquoted `on` as true, and `values` here is parsed as
  # YAML the same way a values file is.
  - it: should read an unquoted on as on
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    values:
      - ./fixtures/secret-filter-mode-unquoted-on.values.yaml
    asserts:
      - equal:
          path: data.GATEWAY_SECRETFILTER_RATE
          value: "1"

  - it: should refuse an unknown mode
    template: templates/validate.yaml
    set:
      pipeline.logging.secretFilter.mode: enforce
    asserts:
      - failedTemplate:
          errorPattern: 'pipeline.logging.secretFilter.mode is "enforce"; it must be off, shadow, or on'
