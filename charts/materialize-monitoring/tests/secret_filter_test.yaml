# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# The gateway's ingest secret filter.
#
# `packages/mzmon-lib/tests/gateway_secret_filter.rs` walks the pre-rendered
# pipeline and its stubs, and fails if any log source reaches a sink without a
# `loki.secretfilter`. The chart renders the real `loki.source.api` from a
# helper instead of the stub, so these hold the helper to the same edge.
suite: alloy gateway secret filter
release:
  name: test-mon
  namespace: test-monitoring
set:
  tags.default: false
  tags.pipeline: true
  pipeline.logging.gateway.destination.loki.enabled: false
  pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.enabled: false
tests:
  # A second receiver here, such as the debug tap, would see every pushed line
  # before the filter does.
  - it: should forward Loki pushes only to the prefilter
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.source\.api "gateway" \{\s*forward_to = \[\s*loki\.process\.inputPrefilter\.receiver,\s*\]'

  - it: should scan both tiers, off until the rate is set
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter "ingest" \{'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.secretfilter "ingestBulk" \{'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'rate\s+= encoding\.from_json\(coalesce\(sys\.env\("GATEWAY_SECRETFILTER_RATE"\), "0"\)\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'rate\s+= encoding\.from_json\(coalesce\(sys\.env\("GATEWAY_SECRETFILTER_BULK_RATE"\), "0"\)\)'
