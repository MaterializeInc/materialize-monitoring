# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Log destinations in `pipeline.destinations` (DEP-124).
#
# Everything this suite guards renders valid Alloy and installs cleanly when it
# is wrong. What breaks is where the logs go, or whether one destination can
# hold back another:
#
#   1. A destination that renders a writer but is not forwarded to.
#      Alloy accepts an orphan component, so it simply never receives.
#   2. Environment variables the pipeline reads and the env ConfigMap does not
#      write. `sys.env` of an unset variable is "", which Alloy accepts at load.
#   3. A `blockOnOverflow: false` that does not take. It is a zero value, so a
#      merge-based resolver would discard it, and the destination would block
#      the fan-out on the day it stalls.
#   4. The deprecated single destination no longer applying. An install that
#      still sets `pipeline.logging.gateway.destination.loki.url` must keep
#      writing where it says.
suite: alloy-gateway log destinations
release:
  name: test-mon
  namespace: monitoring
set:
  # Only the Alloy pipeline; backends off so the subchart validators do not
  # demand bucket and objstore values.
  tags.default: false
  tags.pipeline: true
  # Off-cluster, which keeps the reachability validators quiet about backends
  # this suite does not deploy.
  pipeline.destinations.loki.url: https://logs.example.com/loki/api/v1/push
  pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.url: https://metrics.example.com/api/v1/receive
tests:
  # --- the default ------------------------------------------------------------
  - it: should render one destination by default
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.write "loki" \{\s*endpoint \{\s*url = sys\.env\("GATEWAY_LOKI_DEST"\)'
      # Exactly one edge: the closing `]` straight after it.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.process "egress" \{\s*forward_to = \[\s*loki\.write\.loki\.receiver,\s*\]'
      # A destination that sets no queue field leaves Alloy's defaults alone.
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: "queue_config"

  - it: should write the default destination's URL under its old variable name
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - equal:
          path: data.GATEWAY_LOKI_DEST
          value: https://logs.example.com/loki/api/v1/push

  # --- two destinations -------------------------------------------------------
  - it: should give each destination its own writer and fan-out edge
    set:
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.write "archive" \{\s*endpoint \{\s*url = sys\.env\("GATEWAY_ARCHIVE_DEST"\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.process "egress" \{\s*forward_to = \[\s*loki\.write\.archive\.receiver,\s*loki\.write\.loki\.receiver,\s*\]'

  - it: should write a URL variable per destination, named from the destination
    set:
      pipeline.destinations.controlPlane:
        type: loki
        url: https://ingest.example.com/loki/api/v1/push
        tls:
          enabled: true
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - equal:
          path: data.GATEWAY_CONTROLPLANE_DEST
          value: https://ingest.example.com/loki/api/v1/push
      - equal:
          path: data.GATEWAY_LOKI_DEST
          value: https://logs.example.com/loki/api/v1/push

  - it: should read credentials from variables named after the destination
    set:
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
        authType: basicAuth
        basicAuth:
          username: mzmon
          password: hunter2
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.write "archive" \{[\s\S]*?username = sys\.env\("GATEWAY_ARCHIVE_DEST_USERNAME"\)\s*password = sys\.env\("GATEWAY_ARCHIVE_DEST_PASSWORD"\)'

  - it: should drop a disabled destination from the fan-out and the env
    set:
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
        enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.write "archive"'
        template: templates/pipelines/cm-alloy-gateway.yaml
      - notExists:
          path: data.GATEWAY_ARCHIVE_DEST
        template: templates/pipelines/cm-alloy-gateway-env.yaml

  # --- the queue --------------------------------------------------------------
  - it: should render queue_config with every field the destination sets
    set:
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
        queue:
          capacity: 64MiB
          minShards: 2
          blockOnOverflow: false
          drainTimeout: 5s
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.write "archive" \{[\s\S]*?queue_config \{\s*block_on_overflow = false\s*capacity = "64MiB"\s*drain_timeout = "5s"\s*min_shards = 2\s*\}'
      # Only on the destination that asked for it.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.write "loki" \{\s*endpoint \{[^}]*\}\s*\}'

  - it: should warn when more than one log destination blocks on a full queue
    set:
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "Log destinations archive, loki all block when their queue fills"

  - it: should not warn when every destination but one sheds
    set:
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
        queue:
          blockOnOverflow: false
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "block when their queue fills"
        not: true

  # --- validation -------------------------------------------------------------
  - it: should refuse a name Alloy cannot use as a label
    set:
      pipeline.destinations.control-plane:
        type: loki
        url: https://ingest.example.com/loki/api/v1/push
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "pipeline.destinations.control-plane is not a usable name"

  - it: should refuse a reserved name
    set:
      pipeline.destinations.egress:
        type: loki
        url: https://ingest.example.com/loki/api/v1/push
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "pipeline.destinations.egress uses a name this pipeline has already taken"

  - it: should refuse an unknown type
    set:
      pipeline.destinations.archive:
        type: elasticsearch
        url: https://archive.example.com
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'pipeline.destinations.archive.type is "elasticsearch"'

  - it: should refuse an enabled destination with no URL
    set:
      pipeline.destinations.archive:
        type: loki
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "pipeline.destinations.archive is enabled but has no url"

  # A destination with every signal off renders nothing, so nothing it would
  # need is checked: not its URL, and not credentials no component reads.
  - it: should not validate a destination that carries no signal
    set:
      pipeline.destinations.archive:
        type: loki
        authType: bearer
        logs:
          enabled: false
      alloy-gateway.alloy.envFrom: null
    template: templates/validate.yaml
    asserts:
      - notFailedTemplate: {}

  - it: should refuse two destinations whose names differ only in case
    set:
      pipeline.destinations.Loki:
        type: loki
        url: https://other.example.com/loki/api/v1/push
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "pipeline.destinations.Loki.urlEnv and pipeline.destinations.loki.urlEnv both write GATEWAY_LOKI_DEST"

  - it: should refuse two destinations sharing a urlEnv
    set:
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
        urlEnv: GATEWAY_LOKI_DEST
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "pipeline.destinations.archive.urlEnv and pipeline.destinations.loki.urlEnv both write GATEWAY_LOKI_DEST"

  # Two inline values under one name cannot both survive in the ConfigMap.
  - it: should refuse two inline credentials written under one variable
    set:
      pipeline.destinations.loki.authType: bearer
      pipeline.destinations.loki.bearer.token: one
      pipeline.destinations.loki.bearer.tokenEnv: GATEWAY_SHARED_TOKEN
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
        authType: bearer
        bearer:
          token: two
          tokenEnv: GATEWAY_SHARED_TOKEN
        queue:
          blockOnOverflow: false
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "pipeline.destinations.archive.bearer.tokenEnv and pipeline.destinations.loki.bearer.tokenEnv both write GATEWAY_SHARED_TOKEN"

  # Sharing a credential supplied from outside the ConfigMap is a legitimate
  # choice, unlike sharing a URL.
  - it: should allow two destinations to share a credential variable
    set:
      pipeline.destinations.loki.authType: bearer
      pipeline.destinations.loki.bearer.tokenEnv: GATEWAY_SHARED_TOKEN
      pipeline.destinations.archive:
        type: loki
        url: https://archive.example.com/loki/api/v1/push
        authType: bearer
        bearer:
          tokenEnv: GATEWAY_SHARED_TOKEN
        queue:
          blockOnOverflow: false
    template: templates/validate.yaml
    asserts:
      - notFailedTemplate: {}

  # --- the deprecated single destination --------------------------------------
  # The chart ships `pipeline.logging.gateway.destination.loki` empty, so every
  # key under it is an override that has to keep applying, to the `loki` entry.
  - it: should apply a deprecated URL override to the loki destination
    set:
      pipeline.logging.gateway.destination.loki.url: https://legacy.example.com/loki/api/v1/push
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - equal:
          path: data.GATEWAY_LOKI_DEST
          value: https://legacy.example.com/loki/api/v1/push

  - it: should apply a deprecated TLS override without losing the URL
    set:
      pipeline.logging.gateway.destination.loki.tls.enabled: true
      pipeline.logging.gateway.destination.loki.tls.caFile: /etc/mzmon/tls/ca.crt
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.write "loki" \{[\s\S]*?tls_config \{\s*ca_file = "/etc/mzmon/tls/ca.crt"'

  # `enabled: false` is a zero value: a merge-based fold would drop it.
  - it: should honor a deprecated enabled false
    set:
      pipeline.logging.gateway.destination.loki.enabled: false
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'loki\.write "loki"'

  - it: should warn about the deprecated keys and say where they go
    set:
      pipeline.logging.gateway.destination.loki.url: https://legacy.example.com/loki/api/v1/push
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "pipeline.logging.gateway.destination.loki is deprecated, and its keys \\(url\\) are applied to pipeline.destinations.loki"

  - it: should not warn when nothing is set on the deprecated key
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "is deprecated"
        not: true
