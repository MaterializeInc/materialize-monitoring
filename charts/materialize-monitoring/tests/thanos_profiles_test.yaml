# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: thanos size profiles
release:
  name: t
  namespace: test-monitoring
# Enablement + required inputs shared by every case. Profiles are layered on
# top per-test via `values:`.
set:
  tags.default: false
  tags.thanos: true
  thanos.global.objstore.createSecret: false
# The VPA CRD is declared present for every case here on purpose: the subchart's
# VPA templates are CRD-gated, so without this a VPA assertion would pass for
# the wrong reason (the gate, not the value) on any machine lacking the CRD.
capabilities:
  apiVersions:
    - autoscaling.k8s.io/v1/VerticalPodAutoscaler
tests:
  # --- The extraArgs footgun -------------------------------------------------
  # Helm overwrites lists rather than merging them, so a profile that sets
  # `receive.extraArgs` without restating the replication factor silently drops
  # to Thanos's default of 1 — write quorum 1, no pod loss tolerated. Every
  # size must carry it. This is the single most important assertion in the file.
  - it: medium keeps the replication factor
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --receive.replication-factor=3

  - it: small keeps the replication factor despite overriding extraArgs
    values:
      - ../profiles/thanos-small.values.yaml
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --receive.replication-factor=3

  - it: large keeps the replication factor despite overriding extraArgs
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --receive.replication-factor=3

  # --- VPA must not rewrite the profile's requests --------------------------
  # `updateMode: Auto` evicts pods to apply new requests, and Receive holds up to
  # `tsdb.retention` (6h) of blocks on an emptyDir whose only redundancy is the
  # replication factor. Off at every size; the CRD is declared present above so
  # these assert the value rather than the gate.
  - it: medium renders no Receive VPA
    template: ../charts/thanos/templates/receive/vpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: medium renders no Compactor VPA
    template: ../charts/thanos/templates/compactor/vpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Control: proves the two cases above fail for the right reason. If the
  # CRD gate were what suppressed them, this would render nothing either.
  - it: re-enabling Receive VPA does render one, so the CRD gate is satisfied
    set:
      thanos.receive.vpa.enabled: true
    template: ../charts/thanos/templates/receive/vpa.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.updatePolicy.updateMode
          value: Auto

  # --- Receive sizing -------------------------------------------------------
  - it: medium sizes Receive at 3 replicas holding every series
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 4Gi
      # No memory limit: an OOM-kill drops the un-uploaded block window.
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.memory

  - it: large shards Receive past the replication factor
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      # 6 is a multiple of both RF (3) and a three-zone topology.
      - equal:
          path: spec.replicas
          value: 6
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 8Gi
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.memory

  - it: small keeps Receive at the replication-factor floor
    values:
      - ../profiles/thanos-small.values.yaml
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      # 3 is the RF floor, not a sizing choice — it must not drop below it.
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi

  # --- Store Gateway memory pools ------------------------------------------
  # Thanos defaults to a 2GB chunk pool and 250MB index cache. The small
  # profile's 1Gi request is only viable because it shrinks those too;
  # lowering the request alone would be an OOM rather than a small install.
  - it: small shrinks the Store Gateway pools alongside its request
    values:
      - ../profiles/thanos-small.values.yaml
    template: ../charts/thanos/templates/storegateway/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --chunk-pool-size=512MB
      # Both halves of the index cache, not just the total. `--index-cache-size`
      # alone leaves `max_item_size` at Thanos's 125MiB default, and Store
      # refuses to start when the total is below it — which is what this profile
      # did until tier 2 installed it for the first time. The earlier version of
      # this assertion pinned that exact broken flag, so it is a good reminder
      # that a render test proves shape and not startup.
      #
      # `large` needs no equivalent: its 2GB total is already above the default
      # item size, so the shorthand is safe there.
      - contains:
          path: spec.template.spec.containers[0].args
          content: '--index-cache.config={"type": "IN-MEMORY", "config": {"max_size": "100MB", "max_item_size": "10MB"}}'
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --index-cache-size=100MB
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi

  - it: large raises the Store Gateway pools and read limits
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/storegateway/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --chunk-pool-size=6GB
      - contains:
          path: spec.template.spec.containers[0].args
          content: --index-cache-size=2GB
      - contains:
          path: spec.template.spec.containers[0].args
          content: --store.limits.request-series=30000000

  # --- Compactor stays a singleton at every size ---------------------------
  # Concurrent compactors against one block set corrupt data. A profile must
  # never scale this horizontally, only vertically.
  - it: compactor is a singleton at small
    values:
      - ../profiles/thanos-small.values.yaml
    template: ../charts/thanos/templates/compactor/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: compactor is a singleton at large, with room to grow vertically
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/compactor/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 8Gi
      # Scratch is a PVC, not an emptyDir. Compaction works on whole block groups,
      # so the requirement scales with days of data rather than hours — no
      # realistic node offers this much *allocatable* ephemeral storage, and a
      # request that large simply never schedules.
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 200Gi
      - notExists:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage

  # --- Receive is ephemeral, and explicitly budgeted ------------------------
  # Receive alone is emptyDir-backed: durability is the replication factor, and a
  # PVC makes an AZ failure worse rather than better (a zonal volume cannot attach
  # cross-zone, so the pod stays Pending instead of rescheduling). It declares
  # ephemeral-storage so the scheduler refuses a node that cannot hold it.
  #
  # The Compactor does NOT follow it. Its scratch scales with days of data rather
  # than hours — tens of GiB — which exceeds a typical node's *allocatable*
  # ephemeral storage, so it keeps a volume despite the same AZ argument applying.
  - it: Receive is ephemeral at every size with a declared storage budget
    values:
      - ../profiles/thanos-small.values.yaml
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: 2Gi
      # The limit must exceed the request: the kubelet's response to overrunning
      # it is eviction, which destroys the un-uploaded block window.
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: 3Gi

  - it: Receive is ephemeral at medium too
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: 4Gi
      # Must fit a node's *allocatable* ephemeral storage, which is far below its
      # disk size — GKE leaves ~18.8Gi on a 47Gi boot disk. A request above that
      # can never schedule, and the autoscaler cannot help because no node of that
      # shape would fit either.
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: 6Gi

  # Store Gateway is the deliberate exception: it keeps a PVC at every real
  # size, because the index-header cache is cheap to lose and slow to rebuild,
  # and it has no write quorum to block. Only `kind` opts out.
  - it: Store Gateway keeps its volume at small
    values:
      - ../profiles/thanos-small.values.yaml
    template: ../charts/thanos/templates/storegateway/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi

  - it: Store Gateway keeps its volume at medium and large
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/storegateway/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 20Gi

  # --- Retention keeps both downsample tiers reachable --------------------
  # Thanos produces 5m downsamples only from blocks spanning 40h+ and 1h
  # downsamples only from blocks spanning 10d+. Raw retention below those means
  # the tier is never created and long queries fall back to raw blocks.
  - it: small raw retention clears both downsampling thresholds
    values:
      - ../profiles/thanos-small.values.yaml
    template: ../charts/thanos/templates/compactor/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --retention.resolution-raw=14d

  - it: large extends downsampled retention but not raw
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/compactor/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --retention.resolution-raw=30d
      - contains:
          path: spec.template.spec.containers[0].args
          content: --retention.resolution-1h=730d

  # --- Query Frontend and the datasource must move together ---------------
  # Enabling the frontend without repointing the datasource deploys the cache
  # and routes nothing through it.
  - it: medium omits the query frontend
    template: ../charts/thanos/templates/query-frontend/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: large enables the query frontend
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/query-frontend/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi

  - it: large repoints the Grafana datasource at the query frontend
    values:
      - ../profiles/thanos-large.values.yaml
    template: templates/grafana-datasources.yaml
    asserts:
      - matchRegex:
          path: spec.datasource.url
          pattern: thanos-query-frontend

  # --- HPA floor must match replicaCount ----------------------------------
  # The subchart templates a static `replicas` even alongside an HPA, so a
  # mismatch is reset to the static value on every reconcile.
  - it: large keeps the Query HPA floor equal to replicaCount
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/query/hpa.yaml
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 8

  # --- Topology spread: what makes RF 3 mean what the quorum table says -------
  # Without zone spread the scheduler may put all three replicas in one zone, and
  # RF 3 buys nothing against the failure it exists for — a zone loss takes every
  # copy, and since write quorum is 2 it takes writes with it.
  - it: spreads Receive hard across zones and soft across hosts
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      # Hard, so an un-spread pod goes Pending — which is the signal an
      # autoscaler needs to add a node in the deficient zone. A soft rule cannot
      # summon capacity, it just places the pod wrongly and stays quiet.
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: DoNotSchedule
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].minDomains
          value: 2
      # Honor node taints, so a node still carrying a startup taint is not
      # counted as an available domain.
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].nodeTaintsPolicy
          value: Honor
      # Host spread stays soft: two pods sharing a node is a smaller problem
      # than a pod not running.
      - equal:
          path: spec.template.spec.topologySpreadConstraints[1].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[1].whenUnsatisfiable
          value: ScheduleAnyway

  # The selector must name the component being spread. A copy-paste that leaves
  # another component's label here renders fine and silently spreads against the
  # wrong pods, which is the failure mode worth pinning.
  - it: selects its own pods, since the subchart cannot template the release name
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: receive
      # StatefulSet label. Deployments carry `pod-template-hash` instead, and
      # using the wrong one matches nothing and disables the same-revision guard.
      - contains:
          path: spec.template.spec.topologySpreadConstraints[0].matchLabelKeys
          content: controller-revision-hash

  # Store Gateway is soft where Receive is hard, and the difference is the point:
  # no write quorum depends on it, and it is the one Thanos component still
  # holding a PVC — a hard zone rule against a zonal volume bound with
  # `Immediate` leaves the pod Pending forever rather than for as long as it takes
  # to add a node.
  - it: spreads Store Gateway softly, because a PVC cannot follow a hard rule
    template: ../charts/thanos/templates/storegateway/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: storegateway

  - it: spreads Query softly using the Deployment revision label
    template: ../charts/thanos/templates/query/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - contains:
          path: spec.template.spec.topologySpreadConstraints[0].matchLabelKeys
          content: pod-template-hash

  # A singleton has nothing to spread against, so a constraint here would be
  # noise that only complicates the skew math during its own replacement.
  - it: leaves the Compactor unspread, being a singleton
    template: ../charts/thanos/templates/compactor/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  # Six replicas across three zones divides evenly at maxSkew 1; the hard rule
  # must survive the large profile rather than being replaced by its overrides.
  - it: keeps the hard zone rule at large, where six replicas span three zones
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 6
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: DoNotSchedule

  # --- Spread selectors must not reach another backend ------------------------
  # `app.kubernetes.io/component` is NOT unique across backends: Loki also ships a
  # `compactor`, a `query-frontend` and a `ruler`. A component-only selector makes
  # Thanos count Loki's pods when computing its own skew — silently, and only for
  # the components whose names happen to collide, which is the worst way to find
  # out. Every selector names the chart as well.
  - it: qualifies the Receive spread selector with the chart name
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/name"]
          value: thanos
      - equal:
          path: spec.template.spec.topologySpreadConstraints[1].labelSelector.matchLabels["app.kubernetes.io/name"]
          value: thanos

  # query-frontend is the collision that actually existed: Loki has one too.
  - it: qualifies the Query Frontend selector, whose component name Loki shares
    set:
      thanos.queryFrontend.enabled: true
    template: ../charts/thanos/templates/query-frontend/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/name"]
          value: thanos
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: query-frontend

  # --- Local retention is what sets the disk budget --------------------------
  # `tsdb.retention` is a subchart key, so a rename or typo here fails silently:
  # the value is ignored, Receive keeps the subchart's 24h default, and the 4Gi
  # ephemeral request that was computed from 6h becomes an under-provision that
  # only shows up as an eviction under load. Assert the rendered flag, not the
  # value we set.
  - it: renders the 6h local retention that the ephemeral budget assumes
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --tsdb.retention=6h
      # The replication factor shares that args list, and this is the pairing the
      # helm-docs reordering broke once already — keep both pinned together.
      - contains:
          path: spec.template.spec.containers[0].args
          content: --receive.replication-factor=3

  - it: keeps the 6h retention at every size, since the profiles do not override it
    values:
      - ../profiles/thanos-large.values.yaml
    template: ../charts/thanos/templates/receive/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --tsdb.retention=6h
