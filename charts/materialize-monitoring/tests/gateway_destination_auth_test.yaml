# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Regression tests for the alloy-gateway destination auth wiring in
# `_alloy_helpers.tpl` (+ the env configMap). Two bug classes these lock down:
#
#   1. Block level. In alloy, `external_labels` is a TOP-LEVEL argument of
#      `prometheus.remote_write`, while `basic_auth`/`authorization`/`sigv4` are
#      sub-blocks of the `endpoint` block. A block at the wrong level renders a
#      config alloy rejects at load ("unrecognized attribute/block"). The
#      `endpoint \{[^}]*<block> \{` regex matches only when <block> appears
#      before `endpoint`'s closing `}` — i.e. nested inside it.
#   2. Unhandled authType. The env configMap switches on authType; a missing
#      case (e.g. sigv4) `fail`s the render. Asserting the env CM renders catches
#      that.
suite: alloy-gateway destination auth
release:
  name: test-mon
  namespace: monitoring
set:
  # Enable only the Alloy pipeline (agent + gateway); backends off so the
  # loki/thanos subchart validators don't require bucket/objstore values.
  tags.default: false
  tags.pipeline: true
  # Point both destinations off-cluster. Auth only matters against an external
  # backend, so this matches what these tests are actually about — and it keeps
  # the reachability validators quiet, since they flag in-cluster Service URLs
  # aimed at backends this suite deliberately does not deploy.
  pipeline.logging.gateway.destination.loki.url: https://logs.example.com/loki/api/v1/push
  pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.url: https://metrics.example.com/api/v1/receive
tests:
  - it: "metrics: external_labels renders at the top level, not inside endpoint"
    set:
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.authType: none
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'external_labels = \{'
      # external_labels must NOT be nested inside endpoint.
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'endpoint \{[^}]*external_labels'

  - it: "metrics: sigv4 renders inside endpoint"
    set:
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.authType: sigv4
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.sigv4.region: us-east-1
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'endpoint \{[^}]*sigv4 \{'

  - it: "metrics: sigv4 is a handled authType in the env configMap (renders, no fail)"
    set:
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.authType: sigv4
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.sigv4.region: us-east-1
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: "metrics: basic_auth renders inside endpoint"
    set:
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.authType: basicAuth
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'endpoint \{[^}]*basic_auth \{'

  - it: "metrics: bearer authorization renders inside endpoint"
    set:
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.authType: bearer
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'endpoint \{[^}]*authorization \{'

  - it: "loki: basic_auth renders inside endpoint"
    set:
      pipeline.logging.gateway.destination.loki.authType: basicAuth
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'endpoint \{[^}]*basic_auth \{'

  - it: "loki: bearer authorization renders inside endpoint"
    set:
      pipeline.logging.gateway.destination.loki.authType: bearer
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'endpoint \{[^}]*authorization \{'

  # --- otel: headers auth ---------------------------------------------------
  #
  # The `headers` authType exists so an API-key header does not need the
  # `custom` raw-config escape hatch. Two things it has to get right: the
  # handler reaches the exporter's `auth` argument, and a `valueEnv` header
  # renders as a `sys.env` lookup rather than the literal name.
  - it: "otel: headers auth renders a header block and wires the handler in"
    set:
      pipeline.metrics.gateway.destination.otel.enabled: true
      pipeline.metrics.gateway.destination.otel.otlpExporter.enabled: true
      pipeline.metrics.gateway.destination.otel.otlpExporter.url: api.honeycomb.io
      pipeline.metrics.gateway.destination.otel.auth.authType: headers
      pipeline.metrics.gateway.destination.otel.auth.headers.headers:
        - key: x-honeycomb-team
          valueEnv: GATEWAY_OTEL_DEST_HONEYCOMB_API_KEY
        - key: x-honeycomb-dataset
          value: mzmon
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol\.auth\.headers "oteldest" \{'
      # A secret header reads the environment; it must not render the variable
      # name as the literal header value.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'key   = "x-honeycomb-team"\n\s+value = sys\.env\("GATEWAY_OTEL_DEST_HONEYCOMB_API_KEY"\)'
      # A non-secret header renders inline.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'key   = "x-honeycomb-dataset"\n\s+value = "mzmon"'
      # The handler has to reach the exporter, or the headers are built and
      # never attached to a request.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'auth = otelcol\.auth\.headers\.oteldest\.handler'

  - it: "otel: headers auth is a handled authType in the env configMap (renders, no fail)"
    set:
      pipeline.metrics.gateway.destination.otel.enabled: true
      pipeline.metrics.gateway.destination.otel.otlpExporter.enabled: true
      pipeline.metrics.gateway.destination.otel.otlpExporter.url: api.honeycomb.io
      pipeline.metrics.gateway.destination.otel.auth.authType: headers
      pipeline.metrics.gateway.destination.otel.auth.headers.headers:
        - key: x-honeycomb-team
          valueEnv: GATEWAY_OTEL_DEST_HONEYCOMB_API_KEY
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: "otel: the honeycomb profile renders end to end"
    values:
      - ../profiles/otlp-metrics-honeycomb.values.yaml
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'value = sys\.env\("GATEWAY_OTEL_DEST_HONEYCOMB_API_KEY"\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'auth = otelcol\.auth\.headers\.oteldest\.handler'
