# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# Cloud provider metric pulls on the gateway (`pipeline.metrics.provider`).
#
# The pulls are custom components in the pre-rendered `gateway-provider`
# pipeline, and the chart renders only instances of them. So the suite checks
# two things: that the module the gateway actually loads keeps its contract,
# and that the chart instantiates it once per resource with the right
# arguments.
#
# Every property below regresses quietly rather than loudly. A pull that is not
# clustered is billed once per gateway replica and looks identical in the data.
# A Cloud SQL prefix without its resource filter pulls every instance in the
# project. `nil_to_zero` left at Alloy's default reports a value-less
# datapoint as zero. None of these fail a render or an `alloy validate`.
suite: provider metrics
release:
  name: test-mon
  namespace: test-monitoring
set:
  tags.default: false
  tags.pipeline: true
  pipeline.logging.gateway.destination.loki.url: https://logs.example.com/loki/api/v1/push
  pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.url: https://metrics.example.com/api/v1/receive
tests:
  # --- default ---------------------------------------------------------------

  - it: should instantiate nothing by default
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_[a-z0-9_]+ "'

  # The module is inert until instantiated, and always present, so the file the
  # pre-validate job checks is the one `make pipelines` validated.
  - it: should always include the provider module
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_scrape"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_cloudwatch_rds"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_gcp_gcs"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_azure_postgres"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_azure_blob"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_cloudwatch_eks"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_gcp_compute_quota"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_azure_aks"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_cloudwatch_nlb"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_cloudwatch_nlb_target_group"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_cloudwatch_nat_gateway"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_gcp_load_balancing"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_gcp_cloud_nat"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_azure_load_balancer"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_azure_nat_gateway"'

  # --- the module's contract ---------------------------------------------------

  - it: should cluster the shared scrape so the provider is called once per interval
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_scrape" \{[\s\S]*?prometheus\.scrape "provider" \{[\s\S]*?clustering \{\s+enabled = true'

  # The exporter's own `instance` is a hash of its arguments; any config change
  # would re-label every series.
  - it: should pin instance from an argument
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_scrape" \{[\s\S]*?target_label = "instance"\s+replacement\s+= argument\.instance\.value'

  - it: should never let a value-less CloudWatch datapoint read as zero
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'namespace = "AWS/RDS"\s+nil_to_zero = false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'namespace = "AWS/S3"\s+nil_to_zero = false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'namespace = "AWS/Usage"\s+nil_to_zero = false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'static "nlb" \{[^}]*namespace = "AWS/NetworkELB"\s+nil_to_zero = false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'static "target_group" \{[^}]*namespace = "AWS/NetworkELB"\s+nil_to_zero = false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'namespace = "AWS/NATGateway"\s+nil_to_zero = false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'type = "AWS/EC2"[\s\S]*?dimension_name_requirements = \[[^\]]*\]\s+nil_to_zero = false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'type = "AWS/AutoScaling"[\s\S]*?dimension_name_requirements = \[[^\]]*\]\s+nil_to_zero = false'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'nil_to_zero\s+= true'

  # Decoupled scraping polls on a timer in every replica, owner or not.
  - it: should never use decoupled scraping
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'decoupled_scraping'

  # Without the requirement, every EC2 metric also pulls the per-group
  # aggregate of every Auto Scaling group in the region, whoever owns it, and
  # bills for each. The tag values are regexes, so the names are anchored.
  - it: should discover only the named clusters' own nodes and groups
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'type = "AWS/EC2"\s+regions = \[[^\]]*\]\s+search_tags = \{\s+"aws:eks:cluster-name" = string\.format\("\^\(%s\)\$", string\.join\(argument\.clusters\.value, "\|"\)\),\s+\}\s+dimension_name_requirements = \[\s+"InstanceId",\s+\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'type = "AWS/AutoScaling"\s+regions = \[[^\]]*\]\s+search_tags = \{\s+"eks:cluster-name" = string\.format\("\^\(%s\)\$", string\.join\(argument\.clusters\.value, "\|"\)\),\s+\}\s+dimension_name_requirements = \[\s+"AutoScalingGroupName",\s+\]'

  # Every discovery job writes an `aws_<service>_info` series with all of a
  # resource's tags, which are free text. `ec2` has a digit in it.
  - it: should drop the discovery info series, which carry every tag
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "eks" \{[^}]*forward_to\s+= prometheus\.relabel\.eks\.receiver'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.relabel "eks" \{[\s\S]*?action\s+= "drop"[\s\S]*?regex\s+= "aws_\[a-z0-9\]\+_info"'

  # Quota usage and limits are published hours apart. Stamped with their own
  # time they would be older than Thanos Receive accepts; refusals are written
  # as they happen, so they keep theirs.
  - it: should stamp quota state at the scrape, and keep refusals' own time
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_scrape" \{[\s\S]*?argument "honor_timestamps" \{\s+optional = true\s+default\s+= true'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.gcp "quota" \{[^}]*request_interval = "24h"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "quota" \{[^}]*honor_timestamps = false'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "quota_exceeded" \{[^}]*honor_timestamps'

  # Their DELTA counters are sparse. With Cloud Monitoring's stamps a counter
  # with no new point has no new sample, and its last minute reads as current
  # for the whole lookback; stamped at the scrape, an idle minute reads zero.
  - it: should stamp the Cloud Monitoring network pulls at the scrape
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "load_balancing" \{[^}]*honor_timestamps = false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "cloud_nat" \{[^}]*honor_timestamps = false'

  # `starts_with("europe-west1")` would also match `europe-west10`.
  - it: should match each quota region whole, with its zones
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.gcp "quota" \{[^}]*compute\.googleapis\.com/quota:resource\.labels\.location=monitoring\.regex\.full_match\(\\"\(%s\)\(-\[a-z\]\)\?\\"\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.gcp "quota_exceeded" \{[^}]*monitoring\.regex\.full_match'

  # Per-minute DELTA; the exporter counts only the newest point per pull.
  # The dashboard renders a networking pull's rows on this label, read off
  # `up`. An empty value sets no label, so the older pulls' series are as they
  # were.
  - it: should stamp the networking pulls for the dashboard to find
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_scrape" \{[\s\S]*?argument "provider_pull" \{\s+optional = true\s+default\s+= ""'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'declare "provider_scrape" \{[\s\S]*?target_label = "provider_pull"\s+replacement\s+= argument\.provider_pull\.value'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "nlb" \{[^}]*provider_pull\s+= "cloudwatch_nlb"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "target_group" \{[^}]*provider_pull\s+= "cloudwatch_nlb"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "nat_gateway" \{[^}]*provider_pull\s+= "cloudwatch_nat_gateway"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "load_balancing" \{[^}]*provider_pull\s+= "gcp_load_balancing"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "cloud_nat" \{[^}]*provider_pull\s+= "gcp_cloud_nat"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "traffic" \{[^}]*provider_pull\s+= "azure_load_balancer"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "connections" \{[^}]*provider_pull\s+= "azure_nat_gateway"'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "rds" \{[^}]*provider_pull'

  # Each external forwarding rule's series are published under the current
  # resource type and the legacy `tcp_lb_rule`, so without the type every sum
  # counts its traffic twice.
  - it: should pull each external load balancer under one resource type
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'string\.format\("loadbalancing\.googleapis\.com/l3/external:resource\.type=\\"loadbalancing\.googleapis\.com/ExternalNetworkLoadBalancerRule\\" AND \(resource\.labels\.forwarding_rule_name=one_of\(\\"%s\\"\) OR resource\.labels\.backend_network_name=one_of\(\\"%s\\"\)\)", string\.join\(argument\.forwarding_rules\.value, "\\",\\""\), string\.join\(argument\.networks\.value'
      # Internal rules name the network differently, and the alternation is
      # parenthesised so it cannot widen the metric type it is ANDed onto.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'string\.format\("loadbalancing\.googleapis\.com/l3/internal:\(resource\.labels\.forwarding_rule_name=one_of\(\\"%s\\"\) OR resource\.labels\.network_name=one_of\(\\"%s\\"\)\)", string\.join\(argument\.forwarding_rules\.value, "\\",\\""\), string\.join\(argument\.networks\.value'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'string\.format\("router\.googleapis\.com/nat:resource\.labels\.gateway_name=one_of\(\\"%s\\"\)", string\.join\(argument\.gateways\.value'

  - it: should not pull GCS request counts
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'api/request_count'

  # Without a filter the Resource Graph query returns every resource of the
  # type that the identity can read.
  - it: should narrow every Azure query to the named resources
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "postgres" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''%s''\)", string\.join\(argument\.servers\.value, "'',''"\)\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "capacity" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''%s''\)", string\.join\(argument\.storage_accounts\.value'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "requests" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''%s''\)", string\.join\(argument\.storage_accounts\.value'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "autoscaler" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''%s''\)", string\.join\(argument\.clusters\.value'
      # The scale sets are found through the named clusters' node resource
      # groups, compared lowercase on both sides.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "nodes" \{[^}]*resource_graph_query_filter = string\.format\("extend nodeResourceGroup = tolower\(resourceGroup\) \| join kind=inner \(Resources \| where type =~ ''microsoft\.containerservice/managedclusters'' and name in~ \(''%s''\) \| project nodeResourceGroup = tolower\(tostring\(properties\.nodeResourceGroup\)\)\) on nodeResourceGroup", string\.join\(argument\.clusters\.value'
      # AKS's own two load balancers, through the same join, and not the
      # API server's.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "availability" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''kubernetes'', ''kubernetes-internal''\) \| extend nodeResourceGroup = tolower\(resourceGroup\) \| join kind=inner \(Resources \| where type =~ ''microsoft\.containerservice/managedclusters'' and name in~ \(''%s''\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "probes" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''kubernetes'', ''kubernetes-internal''\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "traffic" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''kubernetes'', ''kubernetes-internal''\)'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "gateway" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''%s''\)", string\.join\(argument\.gateways\.value'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "connections" \{[^}]*resource_graph_query_filter = string\.format\("where name in~ \(''%s''\)", string\.join\(argument\.gateways\.value'

  # The exporter copies the `owner` tag onto every series by default, and tags
  # are free text.
  - it: should copy no Azure resource tag onto a series
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "postgres" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "capacity" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "requests" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "autoscaler" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "nodes" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "availability" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "probes" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "traffic" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "gateway" \{[^}]*included_resource_tags = \[\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.exporter\.azure "connections" \{[^}]*included_resource_tags = \[\]'

  # Every aggregation is requested for every metric, so the keep is what holds
  # the Postgres pull to one or two series per metric. It must also pass the
  # scrape's own `up`, or a failing pull would look like a missing one.
  - it: should keep only the chosen Postgres aggregations, and the scrape health
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "postgres" \{[^}]*forward_to\s+= prometheus\.relabel\.postgres\.receiver'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.relabel "postgres" \{[\s\S]*?action = "keep"[\s\S]*?regex = "azure_microsoft_dbforpostgresql_flexibleservers_\([^"]*\)_\[a-z\]\+\|up\|scrape_\.\+"'

  - it: should keep only the chosen autoscaler aggregations, and the scrape health
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "autoscaler" \{[^}]*forward_to\s+= prometheus\.relabel\.autoscaler\.receiver'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.relabel "autoscaler" \{[\s\S]*?action = "keep"[\s\S]*?regex = "azure_microsoft_containerservice_managedclusters_cluster_autoscaler_\([^"]*\)_\[a-z\]\+\|up\|scrape_\.\+"'

  - it: should keep only the chosen NAT gateway aggregations, and the scrape health
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "gateway" \{[^}]*forward_to\s+= prometheus\.relabel\.gateway\.receiver'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'prometheus\.relabel "gateway" \{[\s\S]*?action = "keep"[\s\S]*?regex = "azure_microsoft_network_natgateways_\([^"]*\)_\[a-z\]\+\|up\|scrape_\.\+"'

  # Two targets from one component, so each needs its own `instance`, or their
  # `up` series collide.
  - it: should give each blob pull its own instance
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "capacity" \{[^}]*instance\s+= "blob_capacity"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "requests" \{[^}]*instance\s+= "blob_requests"'

  - it: should give each AKS and quota pull its own instance
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "autoscaler" \{[^}]*instance\s+= "aks_autoscaler"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "nodes" \{[^}]*instance\s+= "aks_nodes"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "quota" \{[^}]*instance\s+= "compute_quota"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "quota_exceeded" \{[^}]*instance\s+= "compute_quota_exceeded"'

  - it: should give each Azure network pull its own instance
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "availability" \{[^}]*instance\s+= "lb_availability"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "probes" \{[^}]*instance\s+= "lb_probes"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "traffic" \{[^}]*instance\s+= "lb_traffic"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "gateway" \{[^}]*instance\s+= "nat_gateway"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "connections" \{[^}]*instance\s+= "nat_connections"'

  # One target per CloudWatch resource, pinned to the dimension itself, which
  # is unique within the pull's job.
  - it: should pin each CloudWatch network pull to its resource
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "nlb" \{[^}]*instance\s+= argument\.load_balancer\.value'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "target_group" \{[^}]*instance\s+= argument\.target_group\.value'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_scrape "nat_gateway" \{[^}]*instance\s+= argument\.nat_gateway_id\.value'

  # --- CloudWatch instances ------------------------------------------------------

  - it: should instantiate one RDS pull per instance, labelled as an identifier
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: &cloudwatch
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.rds.instances: [mz-db, grafana-db]
      pipeline.metrics.provider.cloudwatch.s3.buckets: [mz-persist.a1b2]
    asserts:
      # Alloy rejects a label that is not an identifier, and RDS identifiers and
      # bucket names contain dashes and dots.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_rds "rds_mz_db" \{\s+instance_id\s+= "mz-db"\s+region\s+= "us-east-1"\s+scrape_interval = "5m"\s+scrape_timeout\s+= "2m"\s+forward_to\s+= otelcol\.receiver\.prometheus\.inputBridge\.receiver\s+\}'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_rds "rds_grafana_db" \{\s+instance_id\s+= "grafana-db"'

  - it: should instantiate one S3 pull per bucket
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: *cloudwatch
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_s3 "s3_mz_persist_a1b2" \{\s+bucket\s+= "mz-persist\.a1b2"'

  - it: should pass a single receiver, not a list
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: *cloudwatch
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'forward_to\s+= \[otelcol\.receiver\.prometheus\.inputBridge\.receiver'

  # One instance for every cluster: the tag filters name them all.
  - it: should instantiate one EKS pull naming every cluster
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: &eks
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.eks.clusters: [mz-eks, other_eks]
    asserts:
      - notFailedTemplate: {}
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_eks "provider" \{\s+clusters\s+= \["mz-eks","other_eks"\]\s+region\s+= "us-east-1"\s+scrape_interval = "5m"\s+scrape_timeout\s+= "2m"\s+forward_to\s+= otelcol\.receiver\.prometheus\.inputBridge\.receiver\s+\}'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_cloudwatch_(rds|s3) "'

  - it: should not instantiate EKS when no cluster is listed
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: *cloudwatch
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_cloudwatch_eks "'

  # CloudWatch names a load balancer by the end of its ARN, and its target
  # groups' health by the pair, so each target group names its load balancer.
  - it: should instantiate one pull per load balancer and per target group
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: &nlb
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.cloudwatch.nlb.loadBalancers:
        - arn: arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/net/mz-nlb/0123456789abcdef
          targetGroups:
            - arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/mz-pgwire/0123456789abcdef
            - targetgroup/mz-console/fedcba9876543210
        - arn: net/grafana-nlb/00112233445566ff
      pipeline.metrics.provider.cloudwatch.natGateway.ids: [nat-0123456789abcdef0]
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_nlb "nlb_net_mz_nlb_0123456789abcdef" \{\s+load_balancer\s+= "net/mz-nlb/0123456789abcdef"\s+region\s+= "us-east-1"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_nlb "nlb_net_grafana_nlb_00112233445566ff" \{\s+load_balancer\s+= "net/grafana-nlb/00112233445566ff"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_nlb_target_group "nlb_targetgroup_mz_pgwire_0123456789abcdef" \{\s+load_balancer\s+= "net/mz-nlb/0123456789abcdef"\s+target_group\s+= "targetgroup/mz-pgwire/0123456789abcdef"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_nlb_target_group "nlb_targetgroup_mz_console_fedcba9876543210" \{\s+load_balancer\s+= "net/mz-nlb/0123456789abcdef"\s+target_group\s+= "targetgroup/mz-console/fedcba9876543210"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_nat_gateway "nat_nat_0123456789abcdef0" \{\s+nat_gateway_id\s+= "nat-0123456789abcdef0"\s+region\s+= "us-east-1"'

  - it: should carry the interval through to every instance
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      <<: *cloudwatch
      pipeline.metrics.provider.cloudwatch.scrapeInterval: 10m
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_cloudwatch_s3 "s3_mz_persist_a1b2" \{[^}]*scrape_interval = "10m"'

  # --- GCP instances -----------------------------------------------------------

  - it: should instantiate one pull per GCP service, naming its resources
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: &gcp
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
      pipeline.metrics.provider.gcp.cloudSql.instances: [mz-pg, grafana-pg]
      pipeline.metrics.provider.gcp.gcs.buckets: [mz-persist]
    asserts:
      # database_id is project:instance.
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_gcp_cloudsql "provider" \{\s+project_id\s+= "my-project"\s+database_ids\s+= \["my-project:mz-pg","my-project:grafana-pg"\]\s+request_interval = "10m"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_gcp_gcs "provider" \{\s+project_id\s+= "my-project"\s+buckets\s+= \["mz-persist"\]'

  # A prefix without its filter would pull every instance in the project, so a
  # service with nothing listed is not instantiated at all.
  - it: should not instantiate a service that lists no resources
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
      pipeline.metrics.provider.gcp.gcs.buckets: [mz-persist]
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_gcp_cloudsql "'
      - matchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_gcp_gcs "provider"'

  - it: should instantiate one quota pull naming every region
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: &gcpCompute
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
      pipeline.metrics.provider.gcp.compute.regions: [us-east1, europe-west10]
    asserts:
      - notFailedTemplate: {}
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_gcp_compute_quota "provider" \{\s+project_id\s+= "my-project"\s+regions\s+= \["us-east1","europe-west10"\]\s+request_interval = "10m"'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_gcp_(cloudsql|gcs) "'

  # --- Azure instances ---------------------------------------------------------

  - it: should instantiate one pull per Azure service, naming its resources
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: &azure
      pipeline.metrics.provider.azure.enabled: true
      pipeline.metrics.provider.azure.subscriptionId: 00000000-0000-0000-0000-000000000000
      pipeline.metrics.provider.azure.postgres.servers: [mz-pg, grafana-pg]
      pipeline.metrics.provider.azure.blob.storageAccounts: [mzpersist]
      alloy-gateway.serviceAccount.annotations:
        azure.workload.identity/client-id: 11111111-1111-1111-1111-111111111111
      alloy-gateway.controller.podLabels:
        azure.workload.identity/use: "true"
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_postgres "provider" \{\s+subscription_id\s+= "00000000-0000-0000-0000-000000000000"\s+servers\s+= \["mz-pg","grafana-pg"\]\s+cloud_environment = "azurecloud"\s+scrape_interval\s+= "5m"\s+scrape_timeout\s+= "2m"\s+forward_to\s+= otelcol\.receiver\.prometheus\.inputBridge\.receiver\s+\}'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_blob "provider" \{\s+subscription_id\s+= "00000000-0000-0000-0000-000000000000"\s+storage_accounts\s+= \["mzpersist"\]'

  - it: should not instantiate an Azure service that lists no resources
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      <<: *azure
      pipeline.metrics.provider.azure.postgres.servers: []
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_azure_postgres "'
      - matchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_azure_blob "provider"'

  - it: should instantiate one AKS pull naming every cluster
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: &aks
      <<: *azure
      pipeline.metrics.provider.azure.postgres.servers: []
      pipeline.metrics.provider.azure.blob.storageAccounts: []
      pipeline.metrics.provider.azure.aks.clusters: [mz-aks, Other_AKS]
    asserts:
      - notFailedTemplate: {}
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_aks "provider" \{\s+subscription_id\s+= "00000000-0000-0000-0000-000000000000"\s+clusters\s+= \["mz-aks","Other_AKS"\]\s+cloud_environment = "azurecloud"'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_azure_(postgres|blob) "'

  - it: should not instantiate AKS when no cluster is listed
    template: templates/pipelines/cm-alloy-gateway.yaml
    set: *azure
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: '(?m)^provider_azure_aks "'

  - it: should instantiate one pull per GCP network service, naming its resources
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
      pipeline.metrics.provider.gcp.loadBalancing.forwardingRules: [a0123456789abcdef0123456789abcde, mz-ilb]
      pipeline.metrics.provider.gcp.cloudNat.gateways: [mz-nat]
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_gcp_load_balancing "provider" \{\s+project_id\s+= "my-project"\s+forwarding_rules = \["a0123456789abcdef0123456789abcde","mz-ilb"\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_gcp_cloud_nat "provider" \{\s+project_id\s+= "my-project"\s+gateways\s+= \["mz-nat"\]'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'provider_gcp_(cloudsql|gcs|compute_quota) "provider"'

  # A network alone is enough, and an absent list is passed empty, which the
  # filter matches nothing with.
  - it: should instantiate the load balancing pull for a network alone
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
      pipeline.metrics.provider.gcp.loadBalancing.networks: [mz-network]
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_gcp_load_balancing "provider" \{\s+project_id\s+= "my-project"\s+forwarding_rules = \[\]\s+networks\s+= \["mz-network"\]'

  - it: should refuse a network URL in place of its name
    set:
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
      pipeline.metrics.provider.gcp.loadBalancing.networks: ["projects/my-project/global/networks/mz-network"]
    asserts:
      - failedTemplate:
          errorPattern: 'loadBalancing.networks entry "projects/my-project/global/networks/mz-network" is not a VPC network name'

  - it: should instantiate one pull per Azure network service, naming its resources
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      pipeline.metrics.provider.azure.enabled: true
      pipeline.metrics.provider.azure.subscriptionId: 00000000-0000-0000-0000-000000000000
      pipeline.metrics.provider.azure.loadBalancer.clusters: [mz-aks]
      pipeline.metrics.provider.azure.natGateway.names: [mz-nat-gateway]
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_load_balancer "provider" \{\s+subscription_id\s+= "00000000-0000-0000-0000-000000000000"\s+clusters\s+= \["mz-aks"\]'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_nat_gateway "provider" \{\s+subscription_id\s+= "00000000-0000-0000-0000-000000000000"\s+gateways\s+= \["mz-nat-gateway"\]'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_(postgres|blob|aks) "provider"'

  - it: should carry a sovereign cloud through to every Azure instance
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      <<: *azure
      pipeline.metrics.provider.azure.cloudEnvironment: azureusgovernmentcloud
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_postgres "provider" \{[^}]*cloud_environment = "azureusgovernmentcloud"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_blob "provider" \{[^}]*cloud_environment = "azureusgovernmentcloud"'

  - it: should carry a sovereign cloud through to the AKS instance
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      <<: *aks
      pipeline.metrics.provider.azure.cloudEnvironment: azurechinacloud
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'provider_azure_aks "provider" \{[^}]*cloud_environment = "azurechinacloud"'

  # --- importance tiers --------------------------------------------------------

  - it: should admit provider families to a destination at their tier
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    set:
      <<: [*cloudwatch, *gcp]
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.extended:
        url: https://extended.example.com/api/v1/write
        minMetricImportance: extended
    asserts:
      - matchRegex:
          path: data.GATEWAY_UNFILTERED_PROM_METRICS_EXTENDED
          pattern: '\|aws_rds_\.\*\|aws_s3_\.\*\|aws_ec2_\.\*\|aws_autoscaling_\.\*\|aws_usage_\.\*\|aws_networkelb_\.\*\|aws_natgateway_\.\*\|stackdriver_cloudsql_database_\.\*\|stackdriver_gcs_bucket_\.\*\|stackdriver_compute_googleapis_com_location_\.\*\|stackdriver_loadbalancing_googleapis_com_external_network_load_balancer_rule_\.\*\|stackdriver_internal_\(tcp\|udp\)_lb_rule_\.\*\|stackdriver_nat_gateway_\.\*$'

  - it: should admit Azure families to a destination at their tier
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    set:
      <<: *azure
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.extended:
        url: https://extended.example.com/api/v1/write
        minMetricImportance: extended
    asserts:
      - matchRegex:
          path: data.GATEWAY_UNFILTERED_PROM_METRICS_EXTENDED
          pattern: '\|azure_microsoft_dbforpostgresql_flexibleservers_\.\*\|azure_microsoft_storage_storageaccounts_blobservices_\.\*\|azure_microsoft_containerservice_managedclusters_\.\*\|azure_microsoft_compute_virtualmachinescalesets_\.\*\|azure_microsoft_network_loadbalancers_\.\*\|azure_microsoft_network_natgateways_\.\*$'

  - it: should keep provider families out of a stricter destination
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    set:
      <<: *cloudwatch
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.strict:
        url: https://strict.example.com/api/v1/write
        minMetricImportance: recommended
    asserts:
      - notMatchRegex:
          path: data.GATEWAY_UNFILTERED_PROM_METRICS_STRICT
          pattern: 'aws_rds_|aws_s3_|aws_ec2_|aws_autoscaling_|aws_usage_|aws_networkelb_|aws_natgateway_'

  - it: should follow a raised importance into the stricter destination
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    set:
      <<: *cloudwatch
      pipeline.metrics.provider.cloudwatch.metricImportance: recommended
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.strict:
        url: https://strict.example.com/api/v1/write
        minMetricImportance: recommended
    asserts:
      - matchRegex:
          path: data.GATEWAY_UNFILTERED_PROM_METRICS_STRICT
          pattern: '\|aws_rds_\.\*\|aws_s3_\.\*\|aws_ec2_\.\*\|aws_autoscaling_\.\*\|aws_usage_\.\*\|aws_networkelb_\.\*\|aws_natgateway_\.\*$'

  # A disabled provider must not widen any allowlist with its families.
  #
  # The `infra-cloud` dashboard's queries name individual provider metrics, and
  # the registry tiers those at `diagnostic` — the one level no values setting
  # can undercut, so `metricImportance` stays in charge everywhere above it. A
  # `diagnostic` destination therefore lists those names whether or not a
  # provider is enabled, which costs nothing when no such series exist. What a
  # disabled provider must not add is its whole-family pattern.
  - it: should add no provider family to the allowlist when no provider is enabled
    template: templates/pipelines/cm-alloy-gateway-env.yaml
    set:
      pipeline.metrics.gateway.destination.prometheusRemoteWrite.extended:
        url: https://extended.example.com/api/v1/write
        minMetricImportance: diagnostic
    asserts:
      - notMatchRegex:
          path: data.GATEWAY_UNFILTERED_PROM_METRICS_EXTENDED
          pattern: 'aws_[a-z0-9]+_\.\*|stackdriver_[a-z_]+\.\*|azure_[a-z_]+\.\*'

  # --- validation --------------------------------------------------------------

  - it: should refuse CloudWatch without a region
    set:
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.rds.instances: [mz-db]
    asserts:
      - failedTemplate:
          errorPattern: "cloudwatch.enabled is true but region is empty"

  - it: should refuse a provider with nothing to watch
    set:
      pipeline.metrics.provider.cloudwatch.enabled: true
      pipeline.metrics.provider.cloudwatch.region: us-east-1
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
    asserts:
      - failedTemplate:
          errorPattern: "cloudwatch.enabled is true but lists no resources"
      - failedTemplate:
          errorPattern: "gcp.enabled is true but lists no resources"

  # The names become an anchored regex in the tag filters; an ARN would match
  # nothing, and a regex character would change what matches.
  - it: should refuse an EKS cluster ARN in place of its name
    set:
      <<: *eks
      pipeline.metrics.provider.cloudwatch.eks.clusters: ["arn:aws:eks:us-east-1:123456789012:cluster/mz-eks"]
    asserts:
      - failedTemplate:
          errorPattern: 'eks.clusters entry "arn:aws:eks:us-east-1:123456789012:cluster/mz-eks" is not an EKS cluster name'

  - it: should refuse an EKS cluster name that would widen the tag filter
    set:
      <<: *eks
      pipeline.metrics.provider.cloudwatch.eks.clusters: ["mz-.*"]
    asserts:
      - failedTemplate:
          errorPattern: 'eks.clusters entry "mz-\.\*" is not an EKS cluster name'

  # Each becomes a CloudWatch dimension, which must match exactly or the pull
  # returns nothing.
  - it: should refuse an Application Load Balancer
    set:
      <<: *nlb
      pipeline.metrics.provider.cloudwatch.nlb.loadBalancers:
        - arn: arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/mz-alb/0123456789abcdef
    asserts:
      - failedTemplate:
          errorPattern: 'arn "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/mz-alb/0123456789abcdef" is not a Network Load Balancer'

  - it: should refuse a load balancer given without its arn key
    set:
      <<: *nlb
      pipeline.metrics.provider.cloudwatch.nlb.loadBalancers: [net/mz-nlb/0123456789abcdef]
    asserts:
      - failedTemplate:
          errorPattern: 'loadBalancers entry net/mz-nlb/0123456789abcdef is not a map'

  - it: should refuse a target group given by name alone
    set:
      <<: *nlb
      pipeline.metrics.provider.cloudwatch.nlb.loadBalancers:
        - arn: net/mz-nlb/0123456789abcdef
          targetGroups: [mz-pgwire]
    asserts:
      - failedTemplate:
          errorPattern: 'target group "mz-pgwire" is not a target group'

  - it: should refuse a load balancer in another region
    set:
      <<: *nlb
      pipeline.metrics.provider.cloudwatch.nlb.loadBalancers:
        - arn: arn:aws:elasticloadbalancing:us-west-2:111122223333:loadbalancer/net/mz-nlb/0123456789abcdef
    asserts:
      - failedTemplate:
          errorPattern: 'which is in us-west-2, but region is us-east-1'

  - it: should refuse a load balancer listed twice
    set:
      <<: *nlb
      pipeline.metrics.provider.cloudwatch.nlb.loadBalancers:
        - arn: net/mz-nlb/0123456789abcdef
        - arn: arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/net/mz-nlb/0123456789abcdef
    asserts:
      - failedTemplate:
          errorPattern: 'lists "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/net/mz-nlb/0123456789abcdef" twice'

  - it: should refuse a NAT gateway name in place of its ID
    set:
      <<: *nlb
      pipeline.metrics.provider.cloudwatch.natGateway.ids: [mz-vpc-us-east-1a]
    asserts:
      - failedTemplate:
          errorPattern: 'natGateway.ids entry "mz-vpc-us-east-1a" is not a NAT gateway ID'

  - it: should refuse GCP without a project
    set:
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.gcs.buckets: [mz-persist]
    asserts:
      - failedTemplate:
          errorPattern: "gcp.enabled is true but projectId is empty"

  - it: should refuse a Cloud SQL connection name in place of an instance name
    set:
      <<: *gcp
      pipeline.metrics.provider.gcp.cloudSql.instances: ["my-project:us-east1:mz-pg"]
    asserts:
      - failedTemplate:
          errorPattern: 'entry "my-project:us-east1:mz-pg" contains a colon'

  # A zone inside the region regex would match nothing at all.
  - it: should refuse a zone in place of a region
    set:
      <<: *gcpCompute
      pipeline.metrics.provider.gcp.compute.regions: [us-east1-b]
    asserts:
      - failedTemplate:
          errorPattern: 'compute.regions entry "us-east1-b" is not a Compute Engine region'

  - it: should refuse a load balancer address in place of its forwarding rule
    set:
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
      pipeline.metrics.provider.gcp.loadBalancing.forwardingRules: ["34.26.2.247"]
    asserts:
      - failedTemplate:
          errorPattern: 'loadBalancing.forwardingRules entry "34.26.2.247" is not a forwarding rule name'

  - it: should refuse a Cloud NAT URL in place of its name
    set:
      pipeline.metrics.provider.gcp.enabled: true
      pipeline.metrics.provider.gcp.projectId: my-project
      pipeline.metrics.provider.gcp.cloudNat.gateways: ["projects/my-project/regions/us-east1/routers/mz-router"]
    asserts:
      - failedTemplate:
          errorPattern: 'cloudNat.gateways entry "projects/my-project/regions/us-east1/routers/mz-router" is not a Cloud NAT gateway name'

  - it: should refuse Azure without a subscription
    set:
      pipeline.metrics.provider.azure.enabled: true
      pipeline.metrics.provider.azure.blob.storageAccounts: [mzpersist]
    asserts:
      - failedTemplate:
          errorPattern: "azure.enabled is true but subscriptionId is empty"

  - it: should refuse a subscription name in place of its ID
    set:
      <<: *azure
      pipeline.metrics.provider.azure.subscriptionId: mz-production
    asserts:
      - failedTemplate:
          errorPattern: 'azure.subscriptionId is "mz-production". Use the subscription ID'

  - it: should refuse an Azure cloud the exporter does not know
    set:
      <<: *azure
      pipeline.metrics.provider.azure.cloudEnvironment: AzurePublic
    asserts:
      - failedTemplate:
          errorPattern: 'azure.cloudEnvironment is "AzurePublic"'

  - it: should refuse Azure with nothing to watch
    set:
      <<: *azure
      pipeline.metrics.provider.azure.postgres.servers: []
      pipeline.metrics.provider.azure.blob.storageAccounts: []
    asserts:
      - failedTemplate:
          errorPattern: "azure.enabled is true but lists no resources"

  # The name sits between single quotes in a Kusto filter; an FQDN matches
  # nothing, and a quote would break the query.
  - it: should refuse a Flexible Server FQDN in place of its name
    set:
      <<: *azure
      pipeline.metrics.provider.azure.postgres.servers: [mz-pg.postgres.database.azure.com]
    asserts:
      - failedTemplate:
          errorPattern: 'postgres.servers entry "mz-pg.postgres.database.azure.com" is not a Flexible Server name'

  - it: should refuse an AKS resource ID in place of its name
    set:
      <<: *aks
      pipeline.metrics.provider.azure.aks.clusters: [/subscriptions/0/resourceGroups/mz/providers/Microsoft.ContainerService/managedClusters/mz-aks]
    asserts:
      - failedTemplate:
          errorPattern: 'aks.clusters entry "/subscriptions/0/resourceGroups/mz/providers/Microsoft.ContainerService/managedClusters/mz-aks" is not an AKS cluster name'

  - it: should refuse an AKS resource ID in place of the cluster whose load balancers to watch
    set:
      <<: *azure
      pipeline.metrics.provider.azure.loadBalancer.clusters: ["/subscriptions/x/resourceGroups/rg/providers/Microsoft.ContainerService/managedClusters/mz-aks"]
    asserts:
      - failedTemplate:
          errorPattern: 'loadBalancer.clusters entry "/subscriptions/x/resourceGroups/rg/providers/Microsoft.ContainerService/managedClusters/mz-aks" is not an AKS cluster name'

  - it: should refuse a NAT gateway resource ID in place of its name
    set:
      <<: *azure
      pipeline.metrics.provider.azure.natGateway.names: ["/subscriptions/x/resourceGroups/rg/providers/Microsoft.Network/natGateways/mz-nat"]
    asserts:
      - failedTemplate:
          errorPattern: 'natGateway.names entry "/subscriptions/x/resourceGroups/rg/providers/Microsoft.Network/natGateways/mz-nat" is not a NAT gateway name'

  - it: should refuse a blob endpoint in place of an account name
    set:
      <<: *azure
      pipeline.metrics.provider.azure.blob.storageAccounts: [https://mzpersist.blob.core.windows.net]
    asserts:
      - failedTemplate:
          errorPattern: 'blob.storageAccounts entry "https://mzpersist.blob.core.windows.net" is not a storage account name'

  # Unquoted, an all-digit name is a number, and Helm reads a leading zero as
  # octal: `012345` would render as 5349 and pass the shape check.
  - it: should refuse an unquoted numeric storage account name
    set:
      <<: *azure
      pipeline.metrics.provider.azure.blob.storageAccounts: [123456]
    asserts:
      - failedTemplate:
          errorPattern: 'blob.storageAccounts entry 123456 is a (int|int64|float64), not a string. Quote it'

  - it: should accept a quoted numeric storage account name
    template: templates/pipelines/cm-alloy-gateway.yaml
    set:
      <<: *azure
      pipeline.metrics.provider.azure.blob.storageAccounts: ["012345"]
    asserts:
      - notFailedTemplate: {}
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'storage_accounts\s+= \["012345"\]'

  - it: should refuse an Azure scrape timeout longer than the interval
    set:
      <<: *azure
      pipeline.metrics.provider.azure.scrapeInterval: 1m
    asserts:
      - failedTemplate:
          errorPattern: 'azure.scrapeTimeout \(2m\) is longer than scrapeInterval \(1m\)'

  # Two components cannot share a label, and Alloy refuses the whole config at
  # load when they do.
  - it: should refuse two buckets that become the same component label
    set:
      <<: *cloudwatch
      pipeline.metrics.provider.cloudwatch.s3.buckets: [mz-persist.a1b2, mz-persist-a1b2]
    asserts:
      - failedTemplate:
          errorPattern: 'both become the component label "s3_mz_persist_a1b2"'

  # `alloy validate` passes this and `alloy run` exits on it, so the gateway
  # would crashloop with every log and metric it carries.
  - it: should refuse a scrape timeout longer than the interval
    set:
      <<: *cloudwatch
      pipeline.metrics.provider.cloudwatch.scrapeInterval: 1m
    asserts:
      - failedTemplate:
          errorPattern: 'scrapeTimeout \(2m\) is longer than scrapeInterval \(1m\)'

  - it: should refuse a duration it cannot compare
    set:
      <<: *gcp
      pipeline.metrics.provider.gcp.scrapeInterval: 5min
    asserts:
      - failedTemplate:
          errorPattern: 'gcp.scrapeInterval is "5min"'

  - it: should refuse a request interval that is not a duration
    set:
      <<: *gcp
      pipeline.metrics.provider.gcp.requestInterval: ten minutes
    asserts:
      - failedTemplate:
          errorPattern: 'gcp.requestInterval is "ten minutes"'

  - it: should accept a compound duration
    set:
      <<: *gcp
      pipeline.metrics.provider.gcp.scrapeInterval: 1h30m
      pipeline.metrics.provider.gcp.scrapeTimeout: 90s
    template: templates/pipelines/cm-alloy-gateway.yaml
    asserts:
      - notFailedTemplate: {}
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'scrape_interval\s+= "1h30m"\s+scrape_timeout\s+= "90s"'

  - it: should refuse an importance no destination understands
    set:
      <<: *cloudwatch
      pipeline.metrics.provider.cloudwatch.metricImportance: high
    asserts:
      - failedTemplate:
          errorPattern: 'cloudwatch.metricImportance is "high"'

  - it: should refuse a pull with no gateway to run it
    set:
      <<: *cloudwatch
      alloy-gateway.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "alloy-gateway is not enabled"

  # --- identity warnings -------------------------------------------------------

  - it: should warn when CloudWatch has no identity to run as
    template: NOTES.txt
    set: *cloudwatch
    asserts:
      - matchRegexRaw:
          pattern: "no eks.amazonaws.com/role-arn annotation"

  - it: should stay quiet when the gateway has an IRSA role
    template: NOTES.txt
    set:
      <<: *cloudwatch
      alloy-gateway.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/gateway
    asserts:
      - matchRegexRaw:
          pattern: "eks.amazonaws.com/role-arn annotation"
        not: true

  # Off Google Cloud with no credential, the exporter fails to build and takes
  # the gateway's initial load with it, so the warning has to say so.
  - it: should warn when GCP has no Workload Identity binding
    template: NOTES.txt
    set: *gcp
    asserts:
      - matchRegexRaw:
          pattern: "neither an iam.gke.io/gcp-service-account annotation"
      - matchRegexRaw:
          pattern: "the whole gateway fails to start"

  - it: should stay quiet when the gateway has a Workload Identity binding
    template: NOTES.txt
    set:
      <<: *gcp
      alloy-gateway.serviceAccount.annotations:
        iam.gke.io/gcp-service-account: gateway@my-project.iam.gserviceaccount.com
    asserts:
      - matchRegexRaw:
          pattern: "iam.gke.io/gcp-service-account annotation"
        not: true

  - it: should stay quiet when a credential file is supplied through extraEnv
    template: NOTES.txt
    set:
      <<: *gcp
      alloy-gateway.alloy.extraEnv:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /etc/gcp/credentials.json
    asserts:
      - matchRegexRaw:
          pattern: "iam.gke.io/gcp-service-account annotation"
        not: true

  # The webhook injects nothing into an unlabelled pod, so the annotation alone
  # leaves the pull on the node's managed identity.
  - it: should warn when the Azure identity annotation has no pod label
    template: NOTES.txt
    set:
      <<: *azure
      alloy-gateway.controller.podLabels: {}
    asserts:
      - matchRegexRaw:
          pattern: 'has no azure.workload.identity/use: "true"'

  - it: should treat an empty Azure client ID as no identity
    template: NOTES.txt
    set:
      <<: *azure
      alloy-gateway.serviceAccount.annotations:
        azure.workload.identity/client-id: ""
    asserts:
      - matchRegexRaw:
          pattern: "no azure.workload.identity/client-id annotation"

  - it: should warn when Azure has no identity to run as
    template: NOTES.txt
    set:
      <<: *azure
      alloy-gateway.serviceAccount.annotations: {}
    asserts:
      - matchRegexRaw:
          pattern: "no azure.workload.identity/client-id annotation"

  - it: should stay quiet when the gateway has a labelled workload identity
    template: NOTES.txt
    set: *azure
    asserts:
      - matchRegexRaw:
          pattern: "azure.workload.identity"
        not: true

  - it: should stay quiet when a service principal is supplied through extraEnv
    template: NOTES.txt
    set:
      <<: *azure
      alloy-gateway.serviceAccount.annotations: {}
      alloy-gateway.alloy.extraEnv:
        - name: AZURE_CLIENT_ID
          value: 11111111-1111-1111-1111-111111111111
    asserts:
      - matchRegexRaw:
          pattern: "azure.workload.identity"
        not: true
