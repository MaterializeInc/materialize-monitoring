# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# Medium (base) workloads + services, plus the non-workload resources.
# Small and large workloads/services live in their own suites
# (loki_snapshots_{small,large}_test.yaml) to keep each .snap file manageable.
suite: loki snapshots (medium + shared resources)
# `chart.version` is stubbed; `appVersion` is deliberately left real.
# helm-unittest propagates both to every dependency, so the version stub freezes
# the loki subchart's `helm.sh/chart:` label — a loki chart bump no longer churns
# ~40 snapshot lines per suite for no reviewable content. appVersion is left
# alone because it reaches `app.kubernetes.io/version` and the image tags, where
# the churn is signal: that is how the memcached registry change in loki 18.11.0
# surfaced.
chart:
  version: 1.2.3
release:
  name: t
  namespace: loki
set:
  tags.default: false
  tags.loki: true
  loki.loki.storage.bucketNames.chunks: "test-chunks"
  loki.loki.storage.bucketNames.ruler: "test-ruler"
  loki.networkPolicy.metrics.namespaceSelector.matchLabels.app: alloy
  loki.networkPolicy.ingress.namespaceSelector.matchLabels.app: grafana
tests:
  # ---- Medium (base) workloads + services ---------------------------------
  - it: medium (base) workloads
    templates:
      - ../charts/loki/templates/distributor/workload.yaml
      - ../charts/loki/templates/ingester/workload.yaml
      - ../charts/loki/templates/querier/workload.yaml
      - ../charts/loki/templates/query-frontend/workload.yaml
      - ../charts/loki/templates/query-scheduler/workload.yaml
      - ../charts/loki/templates/index-gateway/workload.yaml
      - ../charts/loki/templates/compactor/workload.yaml
      - ../charts/loki/templates/ruler/workload.yaml
      - ../charts/loki/templates/chunks-cache/statefulset.yaml
      - ../charts/loki/templates/results-cache/statefulset.yaml
      - ../charts/loki/templates/loki-canary/daemonset.yaml
    asserts:
      - matchSnapshot: {}

  - it: medium (base) services
    templates:
      - ../charts/loki/templates/distributor/service.yaml
      - ../charts/loki/templates/ingester/service.yaml
      - ../charts/loki/templates/querier/service.yaml
      - ../charts/loki/templates/query-frontend/service.yaml
      - ../charts/loki/templates/query-scheduler/service.yaml
      - ../charts/loki/templates/index-gateway/service.yaml
      - ../charts/loki/templates/compactor/service.yaml
      - ../charts/loki/templates/ruler/service.yaml
      - ../charts/loki/templates/chunks-cache/service.yaml
      - ../charts/loki/templates/results-cache/service.yaml
      - ../charts/loki/templates/loki-canary/service.yaml
    asserts:
      - matchSnapshot: {}

  # ---- Ingester-only: pdb, hpa, serviceaccount ----------------------------
  - it: ingester pdb
    template: ../charts/loki/templates/ingester/pdb.yaml
    asserts:
      - matchSnapshot: {}

  - it: ingester has no HPA (ingesters are not autoscaled)
    template: ../charts/loki/templates/ingester/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ingester serviceaccount
    template: ../charts/loki/templates/ingester/serviceaccount.yaml
    asserts:
      - matchSnapshot: {}

  # ---- Release-level resources --------------------------------------------
  - it: networkpolicy
    template: ../charts/loki/templates/networkpolicy.yaml
    asserts:
      - matchSnapshot: {}

  - it: memberlist service
    template: ../charts/loki/templates/service-memberlist.yaml
    asserts:
      - matchSnapshot: {}

  - it: role and rolebinding
    templates:
      - ../charts/loki/templates/role.yaml
      - ../charts/loki/templates/rolebinding.yaml
    asserts:
      - matchSnapshot: {}

  - it: loki config configmap
    template: ../charts/loki/templates/config.yaml
    asserts:
      - matchSnapshot: {}
