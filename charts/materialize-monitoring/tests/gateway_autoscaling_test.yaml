# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Tests for the Alloy gateway's horizontal autoscaling.
#
# The gateway scales on CPU alone, deliberately. Memory was removed as a metric
# rather than retuned, because memory utilization does not say whether a gateway
# is short of memory: the runtime lets the heap grow toward GOMEMLIMIT either
# way. Measured on a 7-node cluster, 3 replicas to 6 moved per-pod memory
# 370Mi -> 341Mi while total consumption went 1.1Gi -> 2.0Gi. The HPA's action
# did not move the HPA's metric, and with idle at ~62% of a 60% target it
# flapped against maxReplicas indefinitely.
#
# Scaling down is slow on purpose. Every scale event reshards the scrape
# targets, and a pod keeps the series of the targets it gave up until its
# write-ahead log checkpoints, so a gateway that flaps pays for both shares.
#
# These tests exist because the failure is invisible in a diff. Re-adding a
# memory target renders valid YAML, produces a healthy-looking HPA, and only
# shows up as a replica count that never comes down.
suite: alloy gateway autoscaling
release:
  name: test-mon
  namespace: test-monitoring
set:
  tags.default: false
  tags.pipeline: true
  pipeline.logging.gateway.destination.loki.url: https://logs.example.com/loki/api/v1/push
  pipeline.metrics.gateway.destination.prometheusRemoteWrite.thanos.url: https://metrics.example.com/api/v1/receive
  pipeline.logging.agent.destination.loki.url: https://logs.example.com/loki/api/v1/push
tests:
  - it: should scale the gateway on CPU alone
    template: ../charts/alloy-gateway/templates/hpa.yaml
    asserts:
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      # Exactly one metric: the subchart renders memory first when it is set, so
      # a re-added target would take index 0 and leave CPU at 1. Asserting the
      # length is what catches it rather than just the name above.
      - lengthEqual:
          path: spec.metrics
          count: 1

  - it: should not scale the gateway on memory
    template: ../charts/alloy-gateway/templates/hpa.yaml
    asserts:
      - notContains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 60
          any: true

  # `0` is the subchart's documented disable value and renders the metric away
  # entirely — it does NOT set a zero-percent target, which would scale to
  # maxReplicas immediately. Worth pinning: the two readings differ by an outage.
  - it: should treat a zero memory target as disabled rather than as zero percent
    set:
      alloy-gateway.controller.autoscaling.horizontal.targetMemoryUtilizationPercentage: 0
    template: ../charts/alloy-gateway/templates/hpa.yaml
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu

  # GOMEMLIMIT is the ceiling the Go GC works against, so it decides where the
  # gateway idles. It is derived from the container limit (AUTOMEMLIMIT) rather
  # than written down, so raising `resources` moves it too. An explicit
  # GOMEMLIMIT would take precedence and pin the old ceiling under a new limit,
  # which shows up as GC pressure rather than as a render failure.
  - it: should derive GOMEMLIMIT from the container memory limit
    template: ../charts/alloy-gateway/templates/controllers/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTOMEMLIMIT
            value: "0.8"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
          any: true

  # Memory scaling is off, so the request is the only thing standing between the
  # gateway and an OOM kill. At minReplicas each pod carries its share of every
  # series in the cluster, which is the case this has to cover.
  - it: should request the same memory it limits
    template: ../charts/alloy-gateway/templates/controllers/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 2Gi

  - it: should scale down only after an hour, one pod at a time
    template: ../charts/alloy-gateway/templates/hpa.yaml
    asserts:
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 3600
      - equal:
          path: spec.behavior.scaleDown.policies
          value:
            - type: Pods
              value: 1
              periodSeconds: 600

  - it: should still scale up quickly
    template: ../charts/alloy-gateway/templates/hpa.yaml
    asserts:
      - equal:
          path: spec.behavior.scaleUp.stabilizationWindowSeconds
          value: 30
