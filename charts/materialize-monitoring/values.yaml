# -- Values that are passed to all subcharts
# @notationType -- (sectionstart) Globals
global:
  # -- Override the registry for all images in this chart and its subcharts. Leave empty to use upstream defaults.
  imageRegistry: ""
  # -- Image pull secrets applied to every workload in this chart and its subcharts.
  imagePullSecrets: []

# -- Configuration for the main chart
# @notationType -- (sectionstart) Main chart configuration
__mainSection:

# -- Standard Helm name override.
# Note that in umbrella charts, fullname may be shorted.
# See fullnameOverride.
nameOverride: ""
# -- Standard Helm fullname override.
# Note that in umbrella charts, this may be shortened to avoid long prefixes.
# (and have more stable names in resources)
fullnameOverride: "mzmon"
# -- Namespace override for default workloads.
namespaceOverride: ""

# -- Group toggles for subchart enablement.
# @notationType -- (sectionstart) Subchart enablement (Helm tags)
# @raw
# Subchart enablement has two layers, in precedence order:
#
# 1. **Per-chart circuit breaker (`<chart>.enabled`).** Each subchart
#    dependency carries a `condition: <chart>.enabled` in `Chart.yaml`.
#    The corresponding `enabled:` key is left commented-out under each
#    subchart block in `values.yaml`; uncommenting it force-includes
#    (`true`) or force-excludes (`false`) that chart regardless of any
#    tag state. Helm evaluates `condition:` first and only falls through
#    to tags when the path is absent from values, so this is a hard
#    override.
# 2. **Helm tags (the `tags:` block).** When no `<chart>.enabled` is set,
#    enablement is decided by tags. Each dependency in `Chart.yaml`
#    carries the master `default` tag, a *group tag* (e.g.
#    `bundled-backends`), and a *per-chart tag* (e.g. `loki`); a dependency
#    is included if any of its tags evaluates true (OR semantics). To opt
#    one chart out of an otherwise-enabled group, set the group tag false
#    and flip the per-chart tags individually — or use the circuit breaker.
#
# Group ↔ chart mapping:
#
# | Group tag          | Charts                                              |
# | ------------------ | --------------------------------------------------- |
# | `default`          | `pipeline` + `bundled-backends` + `managed-grafana` |
# |                    | groups + `kube-state-metrics` (recommended stack)   |
# | `pipeline`         | `alloy-agent`, `alloy-gateway`                      |
# | `bundled-backends` | `loki`, `thanos`, `alertmanager`                    |
# | `managed-grafana`  | `grafana`, `grafana-operator`                       |
# | `cluster-metrics`  | `kube-state-metrics`, `node-exporter`,              |
# |                    | `metrics-server`                                    |
# | `crds`             | `prometheus-operator-crds`, `grafana-operator-crds` |
# |                    | (in the sibling `materialize-monitoring-crds` chart)|
#
# `default` is the only group on by default and enables the full
# recommended stack. `--set tags.default=false` turns everything off, so
# you can enable a single group (`bundled-backends`, `managed-grafana`,
# `pipeline`, `cluster-metrics`) or individual charts on top. Profile
# preset values files under `profiles/` flip these appropriately.
# (`kube-state-metrics` and `node-exporter` are in `default`, but
# `metrics-server` is not — most clusters already run metrics-server;
# enable it via `tags.cluster-metrics` or `tags.metrics-server` if yours
# doesn't. A cluster that already runs its own node-exporter should turn
# ours off with the `node-exporter.enabled: false` circuit breaker —
# setting `tags.node-exporter: false` does nothing while `tags.default`
# is true, because tags are OR'd.)
tags:
  # Group toggles
  # -- Enable all recommended defaults.
  # You can `--set tags.default=false` to disable all services and explicitly enable others.
  default: true
  # -- Enable both Alloy releases (agent + gateway).
  pipeline: false
  # -- Enable Loki, Thanos, and Alertmanager as a group. (Grafana is in the
  # `managed-grafana` group.)
  bundled-backends: false
  # -- Enable kube-state-metrics and metrics-server as a group.
  cluster-metrics: false
  # Per-chart overrides (OR'd with the group tag above)
  # -- Per-chart override: enable just the Alloy agent. OR'd with `tags.default` / `tags.pipeline`.
  alloy-agent: false
  # -- Per-chart override: enable just the Alloy gateway. OR'd with `tags.default` / `tags.pipeline`.
  alloy-gateway: false
  # -- Per-chart override: enable just Loki. OR'd with `tags.default` / `tags.bundled-backends`.
  loki: false
  # -- Per-chart override: enable just Thanos. OR'd with `tags.default` / `tags.bundled-backends`.
  thanos: false
  # -- Per-chart override: enable just Grafana standalone. OR'd with `tags.default` / `tags.managed-grafana`.
  grafana-standalone: false
  # -- Per-chart override: enable just Grafana operator. OR'd with `tags.default` / `tags.managed-grafana`.
  grafana-operator: false
  # -- Per-chart override: enable just Alertmanager. OR'd with `tags.default` / `tags.bundled-backends`.
  alertmanager: false
  # -- Per-chart override: enable just kube-state-metrics. OR'd with `tags.default` / `tags.cluster-metrics`.
  kube-state-metrics: false
  # -- Per-chart override: enable just node-exporter. OR'd with `tags.default` / `tags.cluster-metrics`.
  node-exporter: false
  # -- Per-chart override: enable just metrics-server. OR'd with `tags.cluster-metrics`.
  metrics-server: false

# -- Scheduling priority shared across the stack's subcharts.
# @notationType -- (sectionstart) Priority classes
# @raw
# Two PriorityClasses, created here and referenced by name from the subchart
# blocks further down. The split is about **what losing a pod costs you**:
#
# | Class                 | Used by                                          | Losing a pod means                                      |
# | --------------------- | ------------------------------------------------ | ------------------------------------------------------- |
# | `monitoring-critical` | `alloy-agent`, `node-exporter`, `alloy-gateway`   | a blind spot with no replica to cover it                |
# | `monitoring-scalable` | `loki`, `thanos`, `grafana`, `alertmanager`, KSM  | reduced capacity a surviving replica or a retry absorbs |
#
# The per-node collectors are singletons *per node*: when the agent or
# node-exporter is evicted from a node, nothing else reports that node, and the
# gap is permanent (there is no backfill). The backends are replicated, buffered,
# or both — Alloy retries writes, so a Loki ingester that is evicted costs
# latency rather than data. The gateway is graded critical despite being a
# Deployment because it is the single egress choke point for every signal.
#
# Both classes set **`preemptionPolicy: Never`**. That is the load-bearing
# choice: priority still decides scheduling-queue order and, more importantly,
# which pod the kubelet evicts first under node pressure — but monitoring will
# never evict a Materialize pod to make room for itself. Monitoring that takes
# down the thing it monitors is worse than monitoring that is late.
#
# Both sit well below `system-cluster-critical` (2000000000) and
# `system-node-critical` (2000001000), so cluster plumbing still outranks us.
#
# **PriorityClasses are cluster-scoped.** Two releases of this chart in one
# cluster will fight over these objects. Set `create: false` on all but one, or
# rename them per release — and if you rename, update the `priorityClassName`
# values in the subchart blocks to match. A `priorityClassName` naming a class
# that does not exist does not degrade: the API server *rejects* the pod. The
# chart warns at render time when it can tell that has happened.
priorityClasses:
  # -- Create the PriorityClass objects. Set false when they are managed
  # elsewhere (another release, or cluster-wide by a platform team); the
  # `priorityClassName` references below still apply, so the classes must
  # already exist.
  create: true
  # -- Priority for components whose loss creates an unrecoverable blind spot —
  # the per-node collectors and the egress gateway.
  critical:
    name: monitoring-critical
    value: 1000000
    preemptionPolicy: Never
    description: >-
      Materialize monitoring components whose loss creates a blind spot with no
      replica to cover it. Never preempts other workloads.
  # -- Priority for replicated or buffered components, where losing a pod costs
  # capacity rather than visibility.
  scalable:
    name: monitoring-scalable
    value: 1000
    preemptionPolicy: Never
    description: >-
      Materialize monitoring backends that are replicated or write-buffered.
      Evicted before the critical tier; never preempts other workloads.

# -- Materialize-specific configuration values.
# @notationType -- (sectionstart) Materialize Integration
materialize:
  # -- Namespaces to scrape Materialize workloads from. Empty list means all namespaces the chart can read.
  namespaces: []
  environmentd:
    # -- ServiceMonitor/PodMonitor configuration for environmentd
    serviceMonitor:
      # -- Deploy a PodMonitor to collect Materialize metrics.
      enabled: true
      # -- Override for default selector
      selector: {}
      # -- Override for default labels to copy from the pod into metrics
      targetLabels: []
      # -- Override for default metric endpoints
      metricEndpoints: []
  environmentdSQL:
    # -- ServiceMonitor/PodMonitor configuration for environmentd-sql
    serviceMonitor:
      # -- Deploy a PodMonitor to collect Materialize metrics.
      enabled: true
      # -- Override for default selector
      selector: {}
      # -- Override for default labels to copy from the pod into metrics
      targetLabels: []
      # -- Override for default metric endpoints
      metricEndpoints: []
    secret:
      create: true
      name: materialize-sql-monitor
      username: mz_support
      password: ""
  clusterd:
    # -- ServiceMonitor/PodMonitor configuration for clusterd
    serviceMonitor:
      # -- Deploy a PodMonitor to collect Materialize metrics.
      enabled: true
      # -- Override for default selector
      selector: {}
      # -- Override for default labels to copy from the pod into metrics
      targetLabels: []
      # -- Override for default metric endpoints
      metricEndpoints: []
  # -- Deployment mode normalization hint. One of: `self-managed`, `cloud`. Drives relabeling rules in the pipeline.
  deploymentMode: self-managed

materialize-system:
  # -- The namespace materialize-system was deployed into
  namespace: materialize-environment
  # -- ServiceMonitor/PodMonitor configuration
  # TODO: nothing uses this yet
  serviceMonitor:
    enabled: true

materialize-operator:
  # -- The namespace materialize-operator was deployed into
  namespace: materialize
  # -- ServiceMonitor/PodMonitor configuration
  serviceMonitor:
    enabled: true
    # -- Override for default selector
    selector: {}
    # -- Override for default labels to copy from the pod into metrics
    targetLabels: []
    # -- Override for default metric endpoints
    metricEndpoints: []


# -- Pipeline configuration values that drive Alloy behavior and defaults.
# @notationType -- (sectionstart) Pipeline configuration
# @raw
#
# The Alloy pipeline is the flagship deliverable of this chart.
# Pipeline configuration is expressed in values, rendered into ConfigMaps under
# `templates/pipelines/`, and consumed by the Alloy agent and gateway
# release instances.
pipeline:
  preValidateJob:
    # -- Run a hook/dependency to validate rendered configs before rolling them out
    enabled: true
    # -- Job specific annotations
    # This should be used to control when the job is executed.
    # The default is as a helm hook, but setting any other annotation overrides this.
    # @default -- `{"helm.sh/hook": "pre-install,pre-upgrade", "helm.sh/hook-delete-policy": "before-hook-creation"}`
    annotations: {}
    # -- Number of times to retry the job before failing the release.
    backoffLimit: 1

    # -- Security context for the pre-validate job pod.
    # This is the hardened recommendation with the alloy user.
    podSecurityContext:
      runAsUser: 473
      runAsGroup: 473
      fsGroup: 473

    # -- Security context for the pre-validate job container.
    # This is the hardened recommendation with the alloy user.
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 473
      runAsGroup: 473
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  # -- Environment variables to set in agent and gateway pods.
  # These support tpl rendering.
  # Since these are injected into an envFrom, any env entries take precedence.
  # @default -- {}
  env:
    # -- Name of the cluster to discriminate workloads from different sources.
    CLUSTER_NAME: "default"
    # -- Level for the gateway logs.
    GATEWAY_LOG_LEVEL: "info"
  # -- (h4) Configuration for log behavior
  # @notationType -- (sectionstart) Log configuration
  logging:
    agent:
      # -- Rate limit for alloy agent incoming pod logs.
      # This is per agent.
      rateLimit: 5000
      # -- Burst limit for alloy agent incoming pod logs.
      burst: 20000

      destination:
        loki:
          # -- alloy-gateway push endpoint URL.
          url: 'http://alloy-gateway.{{ include "mzmon.alloyGateway.namespace" $ }}.svc:3100/loki/api/v1/push'
          # -- Retry configuration.
          retries:
            maxBackoffRetries: 10
            minBackoffPeriod: 1s
            maxBackoffPeriod: 5m
            retryOnHttp429: true
          # -- Type of authentication to use with the alloy-gateway endpoint.
          # Use none if no authentication is required.
          authType: none
          tls:
            # -- Whether to enable TLS for alloy-gateway dest.
            enabled: false
            # -- Whether to verify the TLS certificate for the alloy-gateway dest.
            verify: true
            # -- Certificate Authority (CA) PEM contents for TLS.
            ca: ""
            caEnv: AGENT_LOKI_DEST_TLS_CA
            # -- Client certificate PEM contents for TLS.
            cert: ""
            certEnv: AGENT_LOKI_DEST_TLS_CERT
            # -- Client private key PEM contents for TLS.
            key: ""
            keyEnv: AGENT_LOKI_DEST_TLS_KEY
            # -- Alternative SNI (Server Name Indication) to specify.
            serverName: ""
            # -- Minimum TLS version to allow.
            # Use TLS12 if you need better compat.
            # TLS11 and TLS10 are not recommended for production.
            minVersion: TLS13

    gateway:
      destination:
        loki:
          # -- Enable writing to a loki destination.
          # By default, we use the in-cluster loki
          enabled: true
          # -- Loki push endpoint URL.
          url: 'http://loki-distributor.{{ include "mzmon.loki.namespace" $ }}.svc:3100/loki/api/v1/push'
          # -- Retry configuration.
          retries:
            maxBackoffRetries: 10
            minBackoffPeriod: 1s
            maxBackoffPeriod: 5m
            retryOnHttp429: true
          # -- Type of authentication to use with the loki endpoint.
          # Use none if no authentication is required.
          # Use basicAuth for username/password.
          # Use bearer for bearer token.
          # Use oauth2 for OAuth2 client credentials.
          authType: none
          # -- Configuration for auth when using authType=basicAuth
          # You will need to provide alloy-gateway.alloy.agent.extraEnv
          # TODO: add a check for this
          basicAuth:
            password: ""
            passwordEnv: GATEWAY_LOKI_DEST_PASSWORD
            username: ""
            usernameEnv: GATEWAY_LOKI_DEST_USERNAME
          # -- Configuration for bearer token when using authType=bearer
          # This is used for bearer type tokens.
          bearer:
            token: ""
            tokenEnv: GATEWAY_LOKI_DEST_BEARER_TOKEN
          # -- Configuration for OAuth2 when using authType=oauth2
          oauth2:
            clientId: ""
            clientIdEnv: GATEWAY_LOKI_DEST_OAUTH2_CLIENT_ID
            clientSecret: ""
            clientSecretEnv: GATEWAY_LOKI_DEST_OAUTH2_CLIENT_SECRET
            scopes: []
            tokenUrl: ""
            tokenUrlEnv: GATEWAY_LOKI_DEST_OAUTH2_TOKEN_URL
          tls:
            # -- Whether to enable TLS for the loki destination.
            enabled: false
            # -- Whether to verify the TLS certificate for the loki destination.
            verify: true
            # -- Certificate Authority (CA) PEM contents for TLS.
            ca: ""
            caEnv: GATEWAY_LOKI_DEST_TLS_CA
            # -- Client certificate PEM contents for TLS.
            cert: ""
            certEnv: GATEWAY_LOKI_DEST_TLS_CERT
            # -- Client private key PEM contents for TLS.
            key: ""
            keyEnv: GATEWAY_LOKI_DEST_TLS_KEY
            # -- Alternative SNI (Server Name Indication) to specify.
            serverName: ""
            # -- Minimum TLS version to allow.
            # Use TLS12 if you need better compat.
            # TLS11 and TLS10 are not recommended for production.
            minVersion: TLS13
        otel:
          # -- Enable writing to an OpenTelemetry/OTLP destination.
          # By default, we do not use the OTLP destination.
          # NOTE: This is configured in the pipeline.metrics.gateway.destination.otlp block, not the logging block.
          enabled: false
    tenancy:
      # -- Default tenant to write logs to.
      # This is used when tenantMap values is set to `static`.
      staticTenant: loki
      tenantLabel: app.kubernetes.io/name
      # -- Type of tenancy used to write logs.
      # Use static to write to the staticTenant value (recommended).
      # Use byEnvironment to separate by the environment name.
      # Use byNamespace to use the namespace of the source pod as the tenant.
      # Use byLabel to use a label (tenantLabel) to specifically identify the tenant.
      # Use none to disable tenancy (only use if loki does not have tenancy).
      tenantMap:
        default: static
        infra: static
        audit: static
        environment: static

  # -- (h4) Configuration for metrics behavior
  # @notationType -- (sectionstart) Metrics configuration
  metrics:
    # -- (h5) Node-local container metrics, scraped from each node's kubelet.
    # @raw
    #
    # The gateway scrapes `/metrics/cadvisor` on every kubelet rather than the
    # agent running its own cAdvisor. The kubelet already computes these stats,
    # so running our own meant computing them twice per node — measured at
    # ~750Mi per agent against a 200Mi logs-only envelope. Scraping the kubelet
    # removes the housekeeping cost entirely and puts the remaining scrape cost
    # on the gateway, where it is shared across replicas rather than reserved on
    # every node — the distinction that matters when bin packing.
    #
    # Coverage is not the tradeoff it was assumed to be: a GKE kubelet serves 69
    # distinct `container_*` metrics against the 70 an in-process cAdvisor
    # produced, including the descriptor / socket / thread family that otherwise
    # needs the host PID namespace. Every `container_*` metric this chart's
    # queries reference is present.
    #
    # Needs `nodes` and `nodes/metrics` RBAC, which the Alloy subchart's default
    # `clusterRules` already grant.
    kubelet:
      # -- Scrape interval for the kubelet cAdvisor endpoint.
      # The dominant cost lever — roughly 6.7k series per node per scrape.
      scrapeInterval: 60s

      # -- Skip verification of the kubelet's serving certificate.
      # @raw
      #
      # Left **false**: on GKE the kubelet certificate verifies against the
      # in-cluster CA, which the chart passes as `ca_file`. A distribution that
      # signs kubelet certs with a CA the pod does not trust needs this true, and
      # the failure is quiet — scrapes fail and container metrics stop rather
      # than anything erroring at install. Check `up{job="cadvisor"}` when
      # bringing up a new distribution.
      tlsInsecureSkipVerify: false

    gateway:
      # -- Denylist of metrics that are excluded from being exported
      # These are |'d in a regex pattern
      denyMetrics: []
      destination:
        prometheusRemoteWrite:
          # -- Enable writing to a Prometheus remote write destination.
          # We default to in-cluster Thanos.
          enabled: true

          # -- Prometheus remote write endpoint URL.
          url: 'http://thanos-receive.{{ include "mzmon.thanos.namespace" $ }}.svc:10908/api/v1/receive'

          # -- Only export metrics with the specified importance level.
          # Values are "essential", "recommended", "extended", "diagnostic", "all"
          minMetricImportance: "all"

          unfilteredMetricsEnv: GATEWAY_UNFILTERED_PROM_METRICS

          # -- Type of authentication to use with the loki endpoint.
          # Use none if no authentication is required.
          # Use basicAuth for username/password.
          # Use bearer for bearer token.
          # Use oauth2 for OAuth2 client credentials.
          # Use sigv4 for AWS SigV4 signing (For AMP).
          authType: none
          # -- Configuration for auth when using authType=basicAuth
          basicAuth:
            password: ""
            passwordEnv: GATEWAY_PROMETHEUS_DEST_PASSWORD
            username: ""
            usernameEnv: GATEWAY_PROMETHEUS_DEST_USERNAME
          # -- Configuration for bearer token when using authType=bearer
          # This is used for bearer type tokens.
          bearer:
            token: ""
            tokenEnv: GATEWAY_PROMETHEUS_DEST_BEARER_TOKEN
          # -- Configuration for OAuth2 when using authType=oauth2
          oauth2:
            clientId: ""
            clientIdEnv: GATEWAY_PROMETHEUS_DEST_OAUTH2_CLIENT_ID
            clientSecret: ""
            clientSecretEnv: GATEWAY_PROMETHEUS_DEST_OAUTH2_CLIENT_SECRET
            scopes: []
            tokenUrl: ""
            tokenUrlEnv: GATEWAY_PROMETHEUS_DEST_OAUTH2_TOKEN_URL
          # -- Configuration for AWS signatures when using authType=sigv4
          # This generally does not need to be set (it is derived from IRSA).
          sigv4:
            region: ""
            roleArn: ""
          tls:
            # -- Whether to enable TLS for the prometheus destination.
            enabled: false
            # -- Whether to verify the TLS certificate for the prometheus destination.
            verify: true
            # -- Certificate Authority (CA) PEM contents for TLS.
            ca: ""
            caEnv: GATEWAY_PROMETHEUS_DEST_TLS_CA
            # -- Client certificate PEM contents for TLS.
            cert: ""
            certEnv: GATEWAY_PROMETHEUS_DEST_TLS_CERT
            # -- Client private key PEM contents for TLS.
            key: ""
            keyEnv: GATEWAY_PROMETHEUS_DEST_TLS_KEY
            # -- Alternative SNI (Server Name Indication) to specify.
            serverName: ""
            # -- Minimum TLS version to allow.
            # Use TLS12 if you need better compat.
            # TLS11 and TLS10 are not recommended for production.
            minVersion: TLS13

        # -- (h5) OpenTelemetry/OTLP destination configuration for metrics (and logging).
        # @notationType -- (sectionstart) OpenTelemetry/OTLP destinations.
        # @raw
        #
        # This supports several components and allows further customization of endpoints.
        # Multiple exporters can be enabled at once.
        otel:
          # -- Enable writing metrics to an OpenTelemetry/OTLP destination.
          # By default, we do not use the OTel destination.
          # WARNING: if logging otel destination is enabled, this block will still be used for configuration!
          # (just not for metrics)
          enabled: false

          googleCloudExporter:
            # -- Enable writing to a Google Cloud Monitoring / Cloud Logging destination.
            enabled: false
            # -- Compression for logs/metrics
            # Only gzip is supported for Google Cloud Monitoring / Logging.
            compression: gzip

            # -- Only export metrics with the specified importance level.
            # Values are "essential", "recommended", "extended", "diagnostic", "all"
            minMetricImportance: "recommended"

            unfilteredMetricsEnv: GATEWAY_UNFILTERED_GCM_METRICS

            instrumentation_library_labels: false
            skip_create_descriptor: true
            service_resource_labels: false

            prefix: workload.googleapis.com/mzmon

            # -- Handlers to use for the Google Cloud exporter.
            handlers:
              - otelcol.exporter.googlecloud.destination.input

            # -- Raw configuration for an otelcol.exporter.googlecloud block.
            # @default -- An `otelcol.exporter.googlecloud.destination` definition.
            # The default config uses Workload Identity Federation (WIF) to authenticate to GCP.
            config: |
              otelcol.exporter.googlecloud "destination" {
                  metric {
                      compression                    = {{ .Values.pipeline.metrics.gateway.destination.otel.googleCloudExporter.compression | quote }}
                      prefix                         = {{ .Values.pipeline.metrics.gateway.destination.otel.googleCloudExporter.prefix | quote }}
                      instrumentation_library_labels = {{ .Values.pipeline.metrics.gateway.destination.otel.googleCloudExporter.instrumentation_library_labels | toString }}
                      skip_create_descriptor         = {{ .Values.pipeline.metrics.gateway.destination.otel.googleCloudExporter.skip_create_descriptor | toString }}
                      service_resource_labels        = {{ .Values.pipeline.metrics.gateway.destination.otel.googleCloudExporter.service_resource_labels | toString }}
                  }
                  log {
                      compression = {{ .Values.pipeline.metrics.gateway.destination.otel.googleCloudExporter.compression | quote }}
                  }
              }

          datadogExporter:
            # -- Enable writing to a Datadog destination.
            enabled: false
            # -- Compression for logs/metrics
            # Only gzip is supported for Datadog.
            compression: gzip

            # -- Only export metrics with the specified importance level.
            # Values are "essential", "recommended", "extended", "diagnostic", "all"
            minMetricImportance: "recommended"

            unfilteredMetricsEnv: GATEWAY_UNFILTERED_DATADOG_METRICS

            url: "datadoghq.com"
            metricEndpoint: "https://api.datadoghq.com"
            logsEndpoint: "https://http-intake.logs.datadoghq.com"

            hostMetadata:
              # -- Whether to include host metadata in the Datadog exporter.
              # FIXME: how do we support this in an Agent->Gateway architecture?
              enabled: false

            # -- Handlers to use for the Datadog exporter.
            handlers:
              - otelcol.exporter.datadog.destination.input

            # -- Raw configuration for an otelcol.exporter.datadog block.
            # @default -- An `otelcol.exporter.datadog.destination` definition.
            config: |
              otelcol.exporter.datadog "destination" {
                  api {
                      api_key = sys.env("GATEWAY_OTEL_DEST_DATADOG_API_KEY")
                      fail_on_invalid_key = true
                      site = {{ .Values.pipeline.metrics.gateway.destination.otel.datadogExporter.url | default "datadoghq.com" | quote }}
                  }
                  metrics {
                     endpoint = {{ .Values.pipeline.metrics.gateway.destination.otel.datadogExporter.metricEndpoint | quote }}
                  }
                  logs {
                      endpoint = {{ .Values.pipeline.metrics.gateway.destination.otel.datadogExporter.logsEndpoint | quote }}
                  }
                  host_metadata {
                      enabled = {{ .Values.pipeline.metrics.gateway.destination.otel.datadogExporter.hostMetadata.enabled | toString }}
                  }
              }

          otlpExporter:
            # -- Enable writing to an OpenTelemetry/OTLP destination.
            # This is the generic fallback for other destinations.
            # You can also use this if you need to set a custom destination block.
            enabled: false
            # -- OTLP push endpoint URL.
            # This does not need a protocol prefix (http:// or https://)
            url: ""
            # -- Protocol to use for OTLP.
            # Use grpc for gRPC protocol.
            # Use http for HTTP protocol.
            protocol: grpc
            # -- Compression to use
            # Use gzip for better compatibility.
            # Use snappy for better performance.
            compression: gzip

            # -- Only export metrics with the specified importance level.
            # Values are "essential", "recommended", "extended", "diagnostic", "all"
            minMetricImportance: "all"

            unfilteredMetricsEnv: GATEWAY_UNFILTERED_OTLP_METRICS

            # -- Handlers to use for the OTLP exporter.
            # @default -- ["otelcol.exporter.otlp[http].destination.input"]
            # Update this if your config was customized.
            handlers:
              - 'otelcol.exporter.{{ ternary "otlp" "otlphttp" ( eq .Values.pipeline.metrics.gateway.destination.otel.otlpExporter.protocol "grpc" ) }}.destination.input'
            # -- Raw configuration for an otelcol.exporter.otlp block.
            # Use this if you need to configure multiple destinations or use an alternative endpoint entirely.
            config: |
              {{- $exporterType := ternary "otlp" "otlphttp" ( eq .Values.pipeline.metrics.gateway.destination.otel.otlpExporter.protocol "grpc" ) }}
              otelcol.exporter.{{ $exporterType }} "destination" {
                  client {
                      endpoint = {{ .Values.pipeline.metrics.gateway.destination.otel.otlpExporter.url | required "destination.otlp.url must be set" | quote }}
                      compression = {{ .Values.pipeline.metrics.gateway.destination.otel.otlpExporter.compression | quote }}
              {{- if ( include "mzmon.alloyGateway.otelDest.authEnabled" $ ) }}
                      auth = {{ include "mzmon.alloyGateway.otelDest.authHandler" $ }}
              {{- end }}
                  }
              }

          # -- (h5) Configuration for OpenTelemetry/OTLP destinations.
          # @notationType -- (sectionstart) OpenTelemetry Authentication Configuration
          # This is only needed for destinations that require an auth handler (like otlpExporter).
          auth:
            # -- Type of authentication to use with the OpenTelemetry destination.
            # Valid values are: `none`, `basic`, `bearer`, `awsSigv4`, and `custom`.
            authType: none

            basic:
              handler: otelcol.auth.basic.oteldest.handler
              # -- Raw configuration for an otelcol.auth.basic block.
              # @default -- An `otelcol.auth.basic.oteldest` definition.
              # This uses the GATEWAY_OTEL_DEST_USERNAME/GATEWAY_OTEL_DEST_PASSWORD env vars.
              config: |
                otelcol.auth.basic "oteldest" {
                    client_auth {
                        username = sys.env("GATEWAY_OTEL_DEST_USERNAME")
                        password = sys.env("GATEWAY_OTEL_DEST_PASSWORD")
                    }
                }

            bearer:
              handler: otelcol.auth.bearer.oteldest.handler
              # -- Raw configuration for an otelcol.auth.bearer block.
              # @default -- An `otelcol.auth.bearer.oteldest` definition.
              # This uses the GATEWAY_OTEL_DEST_BEARER_TOKEN env var.
              config: |
                otelcol.auth.bearer "oteldest" {
                    header = "Authorization"
                    scheme = "Bearer"
                    token  = sys.env("GATEWAY_OTEL_DEST_BEARER_TOKEN")
                }

            awsSigv4:
              handler: otelcol.auth.sigv4.oteldest.handler
              # -- Override the region to sign requests for.
              region: ""
              # -- Override the role ARN to assume for signing requests.
              roleArn: ""
              # -- Raw configuration for an otelcol.auth.sigv4 block.
              # @default -- An `otelcol.auth.sigv4.oteldest` definition.
              config: |
                otelcol.auth.sigv4 "oteldest" {
                {{- if .Values.pipeline.metrics.gateway.destination.otel.auth.awsSigv4.region }}
                    region = {{ .Values.pipeline.metrics.gateway.destination.otel.auth.awsSigv4.region | quote }}
                {{- end }}
                {{- if .Values.pipeline.metrics.gateway.destination.otel.auth.awsSigv4.roleArn }}
                    assume_role {
                        role_arn = {{ .Values.pipeline.metrics.gateway.destination.otel.auth.awsSigv4.roleArn | quote }}
                    }
                {{- end }}
                }

            custom:
              # -- Handler for a custom auth handler (Advanced escape hatch).
              # This should point to the definition you used.
              # Most auth types use `.handler` for their capsule export.
              # If you need multiple handlers, you can skip this field and instead modify
              # your otlpExporter.config to not use "mzmon.alloyGateway.otelDest.authHandler".
              handler: '{{ fail "Be sure to set this" }}'
              # -- Raw configuration for a custom auth handler.
              config: |
                // THIS IS AN EXAMPLE
                otelcol.auth.basic "oteldest" {
                    client_auth {
                        username = sys.env("GATEWAY_OTEL_DEST_USERNAME")
                        password = sys.env("GATEWAY_OTEL_DEST_PASSWORD")
                    }
                }

# -- Configuration for dashboards, rules, and alerts
# @notationType -- (sectionstart) Monitoring configurations
# @raw
#
# Underlying content is generated into `pre-rendered/`
# from the sources under `packages/` and embedded via `.Files.Get`.
dashboards:
  config:
    grafana:
      # -- Install the bundled Grafana dashboards. Requires the Grafana operator or a writable Grafana instance.
      enabled: true
      # -- Grafana deployment mode, either "standalone" (the bundled Grafana chart) or "operator" (a separate Grafana Operator instance).
      mode: "operator"

      manifest:
        # -- Time to sync the dashboard from the manifest
        resyncPeriod: 5m
        # -- Non-default label selector for a Grafana-operator Grafana instance.
        # Defaults to the labels on the `Grafana` instance this chart creates
        # (see `connections.grafana.labels`), so the two cannot drift.
        # @default -- `{}`
        instanceSelector: {}
        # -- Allow dashboards to match a Grafana instance outside their own
        # namespace. Left unset, this is inferred — it turns on only when the
        # `Grafana` resource lands in a different namespace than the dashboards,
        # as it does under the `split-namespace` profile. Set it explicitly when
        # pointing `instanceSelector` at an instance this chart does not create.
        # Note that the CRDs forbid turning this back off in place; the resource
        # has to be recreated.
        # @default -- inferred
        allowCrossNamespaceImport: null
        # -- Dashboard API Version (v2 or v2beta1)
        apiTarget: "dashboard.grafana.app/v2"
    datadog:
      # -- Install the bundled Datadog dashboards. Requires Datadog API credentials configured out-of-band.
      enabled: false
  # -- List of dashboard patterns to render
  # @default -- `["env-*"]`
  selected:
    - env-*

config:
  # -- (h4) Configuration for rules
  # @notationType -- (sectionstart) Rule configuration
  rules:
    prometheus:
      # -- Install the bundled Prometheus recording and alerting rules as PrometheusRule resources.
      enabled: true
    loki:
      # -- Install the bundled Loki rules.
      enabled: false
    thanos:
      # -- Install the bundled Thanos rules.
      enabled: false

  # -- (h4) Configuration for alerts
  # @notationType -- (sectionstart) Alert configuration
  alerts:
    # -- Install the bundled Alertmanager routing and templates.
    enabled: true

  # -- (h4) Configuration for scrapers
  # @notationType -- (sectionstart) Scraper configuration
  scrapers:
    # -- Install ServiceMonitors / Alloy scrape configs for Materialize and adjacent components.
    enabled: true

connections:
  # -- (h4) How to talk to a grafana instance
  # @notationType -- (sectionstart) Grafana connection configuration
  grafana:
    # -- How this establishes its connection to Grafana.
    # `bundled` (default) targets the Grafana deployed by the bundled `grafana`
    # subchart; the URL and admin-credential Secret are derived from it.
    # `external` targets a Grafana you already run — Grafana Cloud, a shared
    # platform Grafana, another cluster — and requires `external.url` plus
    # either `external.apiKey` or `external.adminUser` + `external.adminPassword`.
    # `operator` hands the instance lifecycle to grafana-operator itself, which
    # builds it from the operator's own defaults and is not yet production-ready.
    mode: bundled

    # -- Additional labels applied to the Grafana instance, and to the
    # `instanceSelector` of every Grafana resource this chart targets at it.
    # Merged over a static `monitoring.materialize.cloud/grafana-instance: mzmon`
    # label, which is what keeps the selector non-empty — grafana-operator reads
    # an empty `matchLabels` as *every* instance, not none.
    # Add to this to narrow the selector further, e.g. to scope per release when
    # two `materialize-monitoring` releases share a cluster.
    # @default -- `{}`
    labels: {}

    # -- Acknowledge that Grafana is deliberately reachable from outside the
    # cluster's private network.
    # @raw
    # Left false, the chart refuses to render a `LoadBalancer` (or `NodePort`)
    # Service with no `grafana.service.loadBalancerSourceRanges`, and an Ingress
    # with no source-range allowlist it can see. That mirrors the load-balancer
    # convention the Terraform modules already enforce: internal by default, and
    # public only against an explicit allowlist.
    #
    # Setting this true is the escape hatch for a deployment whose allowlist
    # lives somewhere the chart cannot read — a security group, an egress
    # firewall, a service mesh, an authenticating proxy in front. It suppresses
    # the error, not the exposure: the render still warns, because a Grafana on
    # the open internet is protected by nothing but its admin password until you
    # configure an identity provider under `grafana.ini`.
    allowPublicAccess: false

    # -- Spec passed through to the `Grafana` resource in `mode: operator`.
    # @raw
    # Break-glass. In that mode grafana-operator owns the server lifecycle and
    # builds it from its own stock defaults — unpinned image, no persistence, no
    # admin secret, no resource requests — none of which this chart models. This
    # key is the raw `GrafanaSpec` escape hatch for configuring it anyway:
    # whatever you put here is emitted verbatim as the resource's `spec`.
    #
    # Nothing in it is validated or defaulted, and the production guidance on
    # the `grafana` block above does not reach it. Prefer `mode: bundled`, where
    # the `grafana` subchart owns the Deployment and all of that applies.
    #
    # ```yaml
    # connections:
    #   grafana:
    #     mode: operator
    #     operator:
    #       spec:
    #         version: "13.0.2"
    #         deployment:
    #           spec:
    #             template:
    #               spec:
    #                 containers:
    #                   - name: grafana
    #                     resources:
    #                       requests:
    #                         cpu: 100m
    #                         memory: 256Mi
    #         config:
    #           database:
    #             type: postgres
    #             host: grafana-db.example.internal:5432
    # ```
    #
    # Reference: https://grafana.github.io/grafana-operator/docs/api/#grafanaspec
    # @default -- `{}`
    operator:
      spec: {}

    # https://grafana.github.io/grafana-operator/docs/api/#grafanaspecexternal
    external:
      # -- External grafana uri
      url: ""
      # -- Secret for Grafana admin password
      # @default -- `{}`
      adminPassword: {}
      # -- Secret for Grafana admin user
      # @default -- `{}`
      adminUser: {}
      # -- Secret for Grafana API key
      # @default -- `{}`
      apiKey: {}

  # -- (h4) Datasources provisioned into the Grafana instance
  # @notationType -- (sectionstart) Datasource configuration
  # @raw
  #
  # Provisioned as `GrafanaDatasource` resources, pushed into the same instance
  # the dashboards target. `url` values are rendered with `tpl`, so they may
  # reference chart helpers.
  datasources:
    # -- Install the bundled datasources. Requires the Grafana operator.
    enabled: true
    # -- How often the operator re-pushes each datasource.
    resyncPeriod: 5m
    # -- Whether the datasources can be edited in the Grafana UI.
    # Edits are reverted on the next resync either way; this only hides the
    # controls so the reversion is not a surprise.
    editable: false

    thanos:
      # -- Provision the Thanos datasource.
      # Unset follows whether the bundled Thanos is enabled. Set it explicitly
      # to point Grafana at metrics storage this chart does not deploy.
      # @default -- follows `thanos.enabled`
      enabled: null
      # -- Datasource name, as shown in Grafana.
      name: Thanos
      # -- Stable datasource UID.
      uid: mzmon-thanos
      # -- Thanos Query endpoint. Rendered with `tpl`.
      url: 'http://thanos-query.{{ include "mzmon.thanos.namespace" $ }}.svc:9090'
      # -- Make this Grafana's default datasource.
      # The bundled dashboards deliberately do not pin a datasource: their
      # `${metricsDatasource}` variable resolves to whichever Prometheus-type
      # datasource is default. With no default, every panel renders empty and
      # Grafana reports no error. Only turn this off if something else in the
      # instance is already the default Prometheus datasource.
      isDefault: true
      # -- Extra `jsonData`, merged over the chart's defaults
      # (`prometheusType: Thanos`, `httpMethod: POST`).
      # @default -- `{}`
      jsonData: {}
      # -- Inline `secureJsonData`. Prefer `valuesFrom` for real secrets — this
      # renders into the release manifest.
      # @default -- `{}`
      secureJsonData: {}
      # -- Secret- or ConfigMap-sourced field injection, passed through to the
      # `GrafanaDatasource`. This is the supported way to supply credentials.
      # @default -- `[]`
      # @raw
      #
      # ```yaml
      # valuesFrom:
      #   - targetPath: secureJsonData.basicAuthPassword
      #     valueFrom:
      #       secretKeyRef:
      #         name: thanos-basic-auth
      #         key: password
      # ```
      valuesFrom: []

    loki:
      # -- Provision the Loki datasource.
      # Unset follows whether the bundled Loki is enabled.
      # @default -- follows `loki.enabled`
      enabled: null
      # -- Datasource name, as shown in Grafana.
      name: Loki
      # -- Stable datasource UID.
      uid: mzmon-loki
      # -- Loki read endpoint. Rendered with `tpl`.
      # The Loki gateway is disabled by default, so reads go to the query
      # frontend directly (see `loki.gateway.enabled`).
      url: 'http://loki-query-frontend.{{ include "mzmon.loki.namespace" $ }}.svc:3100'
      # -- Tenant to read as, sent in the `X-Scope-OrgID` header.
      # The bundled Loki runs `auth_enabled: true`, so reads without this header
      # fail with `no org id`. Unset follows the tenant the pipeline writes to.
      # Set to `""` to send no header, which is only correct against a Loki with
      # `auth_enabled: false`.
      # @default -- follows `pipeline.logging.tenancy.staticTenant`
      tenant: null
      # -- Extra `jsonData`, merged over the chart's defaults (the tenant header
      # name, and `timeout`).
      # @default -- `{}`
      jsonData: {}
      # -- Inline `secureJsonData`. Prefer `valuesFrom` for real secrets — this
      # renders into the release manifest.
      # @default -- `{}`
      secureJsonData: {}
      # -- Secret- or ConfigMap-sourced field injection, passed through to the
      # `GrafanaDatasource`. This is the supported way to supply credentials.
      # @default -- `[]`
      valuesFrom: []

# -- Configuration for bundled subcharts
# @notationType -- (sectionstart) Bundled subchart configurations
_subchartSection: stub

# -- (h4) Alloy collector instance running close to scrape targets. Pre-egress shaping happens here.
# @notationType -- (sectionstart) Alloy Agent
# @raw
#
# Upstream reference:
#   * https://github.com/grafana/alloy/tree/main/operations/helm/charts/alloy
#   * https://github.com/grafana/alloy/blob/main/operations/helm/charts/alloy/values.yaml
alloy-agent:
  # Circuit breaker (precedence over `tags.default`, `tags.pipeline`, and `tags.alloy-agent`):
  # enabled: true
  # -- Standard Helm full-name override.
  # We use a static name for deterministic relations.
  fullnameOverride: "alloy-agent"
  # -- Namespace override.
  namespaceOverride: null
  # -- Control for the PodLogs crd.
  crds:
    create: false

  global:
    # -- Security context for the alloy agent pods.
    podSecurityContext:
      runAsUser: 473
      runAsGroup: 473
      fsGroup: 473

  alloy:
    configMap:
      create: false

      name: mzmon-alloy-agent
      key: config.alloy

    clustering:
      enabled: false

    # -- Stability level of alloy components.
    stabilityLevel: generally-available

    enableReporting: false

    storagePath: /tmp/alloy

    extraArgs:
      - --feature.community-components.enabled

    # -- Extra environment variables to pass to the alloy agent pod.
    # @raw
    #
    # `GOMEMLIMIT` at ~80% of the memory limit is the part worth keeping
    # regardless of the number. Go's GC has no knowledge of a cgroup limit, so it
    # grows the heap toward a ceiling the kernel enforces by killing the process.
    # Telling the runtime about the ceiling turns an OOM-kill into GC pressure —
    # the failure mode becomes "slower", not "dead". Keep it in step with the
    # memory limit above.
    extraEnv:
      - name: GOMEMLIMIT
        value: 240MiB
    # -- Environment variable configmaps/secrets to pass to the alloy agent pod.
    envFrom:
      - configMapRef:
          name: mzmon-alloy-agent-env
      - secretRef:
          name: mzmon-alloy-agent-env
          optional: true

    # -- Volume mounts to expose to alloy agent.
    mounts:
      varlog: true

      extra:
        - name: tmp
          mountPath: /tmp

    # -- Security context for the alloy agent containers.
    # The agent MUST run as root in order to be able to read container logs.
    # No capabilities are added and none are needed: everything it reads is
    # reachable by uid 0 under ordinary DAC.
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 473
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        # Unfortunately, DAC_READ_SEARCH is not sufficient to avoid root privileges
        # add: [DAC_READ_SEARCH]

    # -- Resources for the alloy agent containers.
    # @raw
    #
    # Sized for the logs-only agent. This needed ~750Mi while an in-process
    # cAdvisor lived here; that moved to the gateway, so the envelope is back to
    # what the log path actually costs, with headroom over the ~200Mi it ran at
    # before.
    #
    # The CPU limit stays above the request: the agent is bursty, and a limit
    # equal to the request turns that into CFS throttling on the busiest nodes.
    resources:
      limits:
        cpu: 250m
        memory: 300Mi
      requests:
        cpu: 100m
        memory: 300Mi

  image:
    registry: ghcr.io
    repository: materializeinc/mzmon-alloy
    tag: v1.18.1-mz1
    digest: sha256:c47e93792dd1b6ddcd75207d49eaa6610a4db4837d950a582bf7ff8563acd68f
    pullPolicy: IfNotPresent

  configReloader:
    enabled: false

  controller:
    type: daemonset

    extraLabels: {}
    # -- Extra annotations to apply to the alloy agent pod.
    # If you are using pulumi, be sure to add
    # `config.kubernetes.io/depends-on: job/mzmon-validate-agent`
    extraAnnotations: {}

    hostNetwork: false
    # The host PID namespace is deliberately NOT shared. It was briefly enabled
    # for cAdvisor's `process` collector, which reads /proc/<pid>/fd of other
    # containers; the kubelet serves those metrics now, so the agent no longer
    # needs it — and combined with `runAsUser: 0` it granted read access to every
    # process's environment on the node.
    hostPID: false

    nodeSelector: {}
    tolerations:
      - key: node.materialize.com/daemonsets-not-scheduled
        operator: Exists

    # -- Scheduling priority. See the Priority classes section.
    # Critical: this is a per-node singleton, so an eviction is a log gap on that
    # node with no replica to cover it.
    priorityClassName: monitoring-critical

    volumes:
      extra:
        - name: tmp
          emptyDir: {}

  serviceMonitor:
    enabled: true

# -- (h4) Alloy gateway instance. Cardinality reduction and backend-specific egress happen here.
# @notationType -- (sectionstart) Alloy Gateway
# @raw
#
# Upstream reference:
#   * https://github.com/grafana/alloy/tree/main/operations/helm/charts/alloy
#   * https://github.com/grafana/alloy/blob/main/operations/helm/charts/alloy/values.yaml
alloy-gateway:
  # Circuit breaker (precedence over `tags.default`, `tags.pipeline`, and `tags.alloy-gateway`):
  # enabled: true
  # -- Standard Helm full-name override.
  # We use a static name for deterministic relations.
  fullnameOverride: "alloy-gateway"
  # -- Namespace override.
  namespaceOverride: null
  # -- Control for the PodLogs crd.
  crds:
    create: false

  global:
    # -- Security context for the alloy gateway pods.
    podSecurityContext:
      runAsUser: 473
      runAsGroup: 473
      fsGroup: 473

  alloy:
    configMap:
      create: false

      name: mzmon-alloy-gateway
      key: config.alloy

    clustering:
      enabled: true
      name: default

    # -- Stability level of alloy components.
    stabilityLevel: generally-available

    enableReporting: false

    storagePath: /tmp/alloy

    extraArgs:
      - --feature.community-components.enabled

    # -- Extra environment variables to pass to the alloy gateway pod.
    # `GOMEMLIMIT` at ~80% of the memory limit, for the same reason as the
    # agent's. The gateway now carries the kubelet cAdvisor scrape, so its heap
    # scales with node count — keep this in step with the limit.
    extraEnv:
      - name: GOMEMLIMIT
        value: 400MiB
    # -- Environment variable configmaps/secrets to pass to the alloy gateway pod.
    envFrom:
      - configMapRef:
          name: mzmon-alloy-gateway-env
      - secretRef:
          name: mzmon-alloy-gateway-env
          optional: true

    # -- Ports to expose from alloy-gateway.
    extraPorts:
      - name: loki
        port: 3100
        targetPort: 3100
        protocol: TCP
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
      - name: prom
        port: 9090
        targetPort: 9090
        protocol: TCP
      # - name: faro
      #   port: 12347

    # -- Volume mounts to expose to alloy gateway.
    mounts:
      varlog: false

      extra:
        - name: tmp
          mountPath: /tmp

    # -- Security context for the alloy gateway containers.
    securityContext:
      runAsNonRoot: true
      runAsUser: 473
      runAsGroup: 473
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    # -- Resources for the alloy gateway containers.
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 512Mi

  image:
    registry: ghcr.io
    repository: materializeinc/mzmon-alloy
    tag: v1.18.1-mz1
    digest: sha256:c47e93792dd1b6ddcd75207d49eaa6610a4db4837d950a582bf7ff8563acd68f
    pullPolicy: IfNotPresent

  configReloader:
    enabled: false

  controller:
    type: deployment

    replicas: null

    extraLabels: {}
    # -- Extra annotations to apply to the alloy gateway pod.
    # If you are using pulumi, be sure to add
    # `config.kubernetes.io/depends-on: job/mzmon-validate-gateway`
    extraAnnotations: {}

    hostNetwork: false
    hostPID: false

    nodeSelector: {}
    tolerations: []
    topologySpreadConstraints: []

    # -- Scheduling priority. See the Priority classes section.
    # Critical despite being a Deployment: every signal in the stack leaves
    # through here, so losing it stops logs and metrics at once.
    priorityClassName: monitoring-critical

    volumes:
      extra:
        - name: tmp
          emptyDir: {}

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    autoscaling:
      horizontal:
        enabled: true
        minReplicas: 2
        maxReplicas: 8
        targetCPUUtilizationPercentage: 50
        targetMemoryUtilizationPercentage: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Max
          policies:
            - type: Percent
              value: 25
              periodSeconds: 120
        scaleUp:
          stabilizationWindowSeconds: 30
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 300
            - type: Pods
              value: 2
              periodSeconds: 300

  serviceAccount:
    # -- Create a service account for alloy-gateway.
    create: true
    # -- Extra annotations to set on the alloy-gateway service account.
    # Use `eks.amazonaws.com/role-arn` to set up IRSA.
    # Use `iam.gke.io/gcp-service-account` to set up Workload Identity Federation.
    annotations: {}

  serviceMonitor:
    enabled: true

# -- (h4) Bundled Loki backend for logs.
# @notationType -- (sectionstart) Loki
# @raw
#
# Upstream reference:
#   * https://github.com/grafana-community/helm-charts/tree/main/charts/loki
#   * https://github.com/grafana-community/helm-charts/blob/main/charts/loki/values.yaml
loki:
  # Circuit breaker (precedence over `tags.default`, `tags.bundled-backends`, and `tags.loki`):
  # enabled: true
  # -- Standard Helm full-name override.
  # We use a static name for deterministic relations.
  fullnameOverride: "loki"
  # -- Namespace override.
  namespaceOverride: null

  global:
    # -- Scheduling priority for Loki. See the Priority classes section.
    # `global` covers every component that renders through the chart's
    # `_pod.tpl` — but *not* the two memcached StatefulSets, which read only
    # their own component key. They are set explicitly further down. This is the
    # same asymmetry `terraform/modules/materialize-monitoring/scheduling.tf`
    # calls out for nodeSelector and tolerations; rendering is what catches it.
    priorityClassName: monitoring-scalable

  # -- How loki is deployed.
  # We prefer to run in Distributed/Microservices mode.
  deploymentMode: Distributed

  # Zero the Simple Scalable targets in Distributed mode.
  # The upstream chart defaults read/write/backend to 3 replicas; running them
  # alongside the distributed targets is rejected by Loki's own validation.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  networkPolicy:
    # -- Whether to enable a network policy for loki
    # In production, this is recommended to be enabled.
    enabled: true
    # YAGNI: flavor not in schema (but we probably don't need cilium anyways)
    # flavor: kubernetes
    # -- Selector for incoming traffic to metric endpoints.
    # This must be configured manually (usually set to `kubernetes.io/metadata.name: monitoring`).
    metrics:
      namespaceSelector: {}
    # -- Selector for incoming traffic to the read/write endpoints.
    # This must be configured manually (usually set to `kubernetes.io/metadata.name: monitoring`).
    ingress:
      namespaceSelector: {}
    # -- Outgoing traffic from loki to the object store.
    # This is usually unrestricted, even in many production settings.
    # Adjust if you have a VPCEndpoint in front of S3/STS or are using a non-standard port.
    externalStorage:
      ports:
        - 443
        - 80
      cidrs:
        - "0.0.0.0/0"

  loki:
    storage:
      # -- Bucket names for object storage.
      # These are required to be populated.
      bucketNames:
        chunks: "<REPLACE-ME>"
        ruler: "<REPLACE-ME>"
      # -- Use the thanos object store client
      use_thanos_objstore: true
      # -- Object storage configuration.
      # Modify as needed.
      object_store:
        type: s3

    # -- Schema configuration for the loki TSDB.
    # This is append-only and MUST be copied into projects and mutated on upgrades
    # (if v13 stops being in use).
    schemaConfig:
      configs:
        # Quoted so the date stays a string. Unquoted it is a YAML timestamp, and
        # some parsers (Terraform's `yamldecode`, among others) promote it to
        # RFC 3339, which Loki rejects.
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # -- Cluster-wide replication factor.
    # Three is our HA floor and the reason at least three ingesters are required.
    # (This matches the upstream default; surfaced here because it is load-bearing.)
    commonConfig:
      replication_factor: 3

    # -- Per-tenant limits, sized for a medium install.
    # These are protective caps (per environment), not the expected volume —
    # see Operating > Production Best Practices for the throughput envelope.
    limits_config:
      # -- Default retention before the compactor deletes logs.
      # Upstream defaults to infinite retention; we set a real bound.
      retention_period: 30d
      # -- Per-tenant ingestion rate / burst, in MB. Per environment, not the fleet aggregate.
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      # -- Active-stream ceiling per tenant; a cardinality guard.
      max_global_streams_per_user: 10000
      # -- Reject writes too far in the past.
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # -- Enable the log-volume endpoints Grafana's logs drilldown relies on.
      volume_enabled: true

    # -- Compactor *configuration* (distinct from the compactor deployment below).
    # Retention is enforced by the compactor and is OFF in upstream defaults.
    compactor:
      retention_enabled: true
      # -- Where delete requests are stored; matches the object-store backend.
      delete_request_store: s3
      # -- Grace period before retention/deletes actually remove data.
      retention_delete_delay: 8h

  gateway:
    # -- Disable gateway by default.
    # We recommend using alloy-gateway for loki writes.
    # Use the query-frontend for loki reads.
    enabled: false

  # -- (h5) Configuration for each loki microservice.
  # @notationType -- (sectionstart) Loki Microservice Configuration
  # @raw
  #
  # https://grafana.com/docs/loki/latest/get-started/components/
  distributor:
    # -- Enable the distributor microservice.
    # Distributor is required.
    # The Distributor is the stateless front door for writes.
    # It validates incoming streams against per-tenant limits, enforces rate limits,
    # and normalizes labels, then splits the batch into individual streams and forwards
    # each to the owning ingesters.
    enabled: true

    # -- Number of replicas for the distributor microservice.
    # If autoscaling is enabled, this should be set to null.
    replicas: null

    # -- Type of workload for the distributor.
    kind: Deployment

    # -- Configuration for autoscaling of distributor
    # For production, this is recommended to be enabled.
    # We provide opinionated defaults.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 75

    service:
      # -- Service type for the distributor microservice.
      # Without a gateway, this is the exposed write component.
      type: ClusterIP

    # -- Configuration for pod disruption budget for the distributor microservice.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # -- Resource requests (medium install). Tune per profile.
    resources:
      requests:
        cpu: 150m
        memory: 256Mi

  ingester:
    # -- Enable the ingester microservice.
    # Ingester is required.
    # The Ingester is the stateful heart of the write path, and it also
    # serves the most recent reads.
    # It buffers incoming entries into per-stream in-memory chunks,
    # compresses them, and periodically flushes those chunks and their
    # index to object storage.
    enabled: true

    # -- Number of ingester replicas.
    # Three is the floor for replication_factor 3. Scale UP on memory /
    # stream-cardinality (so streams shard across the ring), not on bytes —
    # with replicas == replication_factor every ingester holds every stream.
    replicas: 3

    # -- Ingesters are stateful.
    kind: StatefulSet

    persistence:
      # -- Run ingesters ephemerally: no PVC, node-local emptyDir for the WAL
      # and not-yet-flushed chunks. Durability comes from replication_factor 3,
      # not from disk — a rescheduled ingester starts fresh and the ring
      # backfills from its peers. This avoids EBS zonal pinning and the slow
      # volume detach/attach that PVCs incur during node replacement.
      enabled: false

    # -- Termination grace period for ingesters.
    # flush-on-shutdown is best-effort; if the node force-kills sooner, the
    # other replicas still flush their copies, so do not depend on a long grace
    # period for durability. Kept modest to survive enterprise force-kill windows.
    terminationGracePeriodSeconds: 60

    # -- Pod affinity for ingesters.
    # Drop the chart's default *hard* per-host anti-affinity so host spread can
    # be soft (see topologySpreadConstraints); zone spread stays hard. We null
    # the nested list rather than the whole `affinity` map: `affinity: {}` is a
    # no-op against the subchart default, and `affinity: null` clears it but
    # makes helm-unittest log a noisy "cannot overwrite table" warning — nulling
    # the list avoids both.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution: null

    # -- Topology spread for ingesters: hard across zones, soft across hosts.
    # A pod that cannot satisfy the hard zone rule goes Pending, which is the
    # signal Karpenter (or the cluster-autoscaler) uses to add a node in the
    # deficient zone — soft rules cannot summon capacity that way. Host spread
    # is soft so pods still schedule when nodes are momentarily scarce.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        # minDomains must equal the number of zones your node pool can launch in.
        # Setting it above the available zone count leaves pods Pending forever.
        minDomains: 2
        # Count only same-revision pods so a rolling update does not deadlock the
        # skew math; Honor node taints so only usable nodes count (e.g. nodes
        # still carrying a startup taint are excluded until it is removed).
        matchLabelKeys:
          - controller-revision-hash
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: ingester
            app.kubernetes.io/name: '{{ include "loki.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}'
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - controller-revision-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: ingester
            app.kubernetes.io/name: '{{ include "loki.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}'

    zoneAwareReplication:
      # -- Enable zone-aware replication for the ingester microservice.
      # Not needed at our size: topologySpreadConstraints give the AZ spread
      # without the complexity.
      enabled: false

    # -- PDB for the ingester.
    # Protect ingest quorum across rollouts and node drains.
    # Do not set maxUnavailable >= 2 to avoid potential quorum loss.
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    # -- Resource requests (medium install).
    # The memory *limit* is intentionally left unset: an OOM-kill drops
    # in-memory / WAL-buffered logs, so we alert on usage rather than cap hard.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi

  querier:
    # -- Enable the querier microservice.
    # Querier is required. It executes LogQL, reading recent data from
    # ingesters and historical data from object storage.
    enabled: true

    # -- Replicas are managed by autoscaling; leave null.
    replicas: null
    kind: Deployment

    # -- Autoscale the stateless read workers with query load.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 75

    # -- PDB for querier.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # -- Resource requests.
    # This assumes a medium install by default.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi

  queryFrontend:
    # -- Enable the query-frontend microservice.
    # Query-frontend is required. It queues and splits queries and caches results.
    enabled: true

    # -- Static replicas for query-frontend when autoscaling is not enabled.
    replicas: null
    # -- Kind of workload for query-frontend.
    # Deployments are recommended for stateless components.
    kind: Deployment

    # -- Configure autoscaling for query-frontend.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 75

    # -- PDB for query-frontend.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # -- Resource requests for query-frontend.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  queryScheduler:
    # -- Enable the query-scheduler microservice.
    # Recommended for scaled deployments: it decouples the read queue from the
    # query-frontend so the two scale independently. Two replicas for availability.
    enabled: true
    replicas: 2

    # HACK: this deprecated value gets merged into querySchedulerr.podDisruptionBudget
    # which is invalid (can't have both minAvailable and maxUnavailable).
    maxUnavailable: null
    # -- PDB for query-scheduler.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # -- Resources for the query-scheduler microservice.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  compactor:
    # -- Enable the compactor.
    # Compactor is required and MUST be a singleton: it compacts the index and
    # enforces retention against shared object storage.
    enabled: true
    # -- Compactor replicas.
    # This MUST be one, since it runs as a singleton.
    replicas: 1
    # -- Kind of workload for the compactor.
    # This must be a statefulset.
    kind: StatefulSet

    annotations:
      argocd.argoproj.io/sync-wave: "20"
      config.kubernetes.io/depends-on: statefulset/loki-ingester

    persistence:
      # -- Run the compactor ephemerally (no PVC, node-local emptyDir).
      # Its local dir is just a working copy of the object-store index, and
      # compaction is idempotent and off the critical path — losing it only
      # restarts the current cycle. Ephemeral also lets the singleton float
      # freely between zones instead of being pinned by a PVC. Our production
      # index is ~30MB, so re-downloading each cycle is negligible.
      enabled: false

    # -- Resources for the compactor.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi

  indexGateway:
    # -- Enable the index-gateway.
    # Index-gateway is required: it serves index lookups so queriers do not each
    # download the whole index from object storage.
    enabled: true
    replicas: 2

    # -- Run the index-gateway ephemerally (no PVC, node-local emptyDir).
    # The local index is a read-through cache of object storage, not
    # authoritative — a fresh pod just re-downloads what it queries. This keeps
    # the read path off EBS zonal pinning; the only cost is a little cold-start
    # warmup and a burst of index reads after a reschedule.
    persistence:
      enabled: false

    # -- PDB for index-gateway.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # -- Resources for the index-gateway.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

  ruler:
    # -- Enable the ruler.
    # The ruler evaluates LogQL alerting and recording rules. Recording-rule
    # samples are remote-written back through alloy-gateway to the metric store.
    enabled: true
    replicas: 2

    persistence:
      # -- Keep a PVC for the ruler (unlike the other components, which are
      # ephemeral). Rule definitions come from object storage, but the ruler's
      # remote-write WAL buffers recording-rule samples when the metric store is
      # unreachable — genuinely useful durability in the run-up to an incident,
      # exactly when you don't want to drop derived signals.
      enabled: true
      size: 5Gi

    # -- PDB for the ruler.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # -- Resources for the ruler.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  # -- (h5) Chunk cache (memcached). Default allocation is sized for very large
  # installs; we shrink it to match our volumes. The results cache keeps its
  # upstream default.
  # `priorityClassName` is repeated on both caches because the memcached
  # StatefulSet template reads its component key only — `loki.global` does not
  # reach it.
  chunksCache:
    allocatedMemory: 2048
    priorityClassName: monitoring-scalable

  # -- (h5) Query results cache (memcached).
  resultsCache:
    priorityClassName: monitoring-scalable

  monitoring:
    serviceMonitor:
      # -- Enable a ServiceMonitor for the loki microservices.
      enabled: true
      jobPrefix: loki/

  # -- (h5) End-to-end write→read canary for meta-monitoring.
  # On by default upstream; surfaced here because self-monitoring the log store
  # is a first-class requirement for us.
  lokiCanary:
    enabled: true
    kind: Deployment
    lokiurl: loki-query-frontend:3100
    push: false
    # -- Scheduling priority. See the Priority classes section.
    # @raw
    # Set explicitly because the canary reaches neither of the two keys that
    # cover the rest of Loki: it renders from its own template rather than
    # `_pod.tpl`, so `loki.global.priorityClassName` does not reach it, and
    # `loki.defaults` does not either. Left unset it runs at priority 0 —
    # *below* ordinary workloads — so the first node under pressure evicts the
    # end-to-end write→read check, which is exactly the signal you want during
    # the incident that caused the pressure.
    priorityClassName: monitoring-scalable

# -- (h4) Bundled Thanos backend for long-term metrics.
# @notationType -- (sectionstart) Thanos
# @raw
#
# Upstream reference:
#   * https://github.com/thanos-community/helm-charts/tree/master/charts/thanos
#   * https://github.com/thanos-community/helm-charts/blob/master/charts/thanos/values.yaml
thanos:
  # Circuit breaker (precedence over `tags.default`, `tags.bundled-backends`, and `tags.thanos`):
  # enabled: true
  # -- Standard Helm full-name override.
  # We use a static name for deterministic relations.
  fullnameOverride: "thanos"
  # -- Namespace override.
  namespaceOverride: null

  global:
    # -- Scheduling priority for every Thanos pod. See the Priority classes section.
    priorityClassName: monitoring-scalable
    objstore:
      createSecret: true
      secretName: thanos-objstore-config
      secretKey: objstore.yml
      config: |
        {{ fail "Either configure this secret or set `thanos.global.objstore.createSecret` to false." }}
    serviceMonitor:
      enabled: true
    serviceAccount:
      annotations: {}
      #   eks.amazonaws.com/role-arn: ""

    # -- PodDisruptionBudgets for every Thanos component.
    # @raw
    #
    # Upstream ships these off. One switch turns them on for all components,
    # and the per-component `pdb.enabled` cannot opt back out — the subchart
    # templates test `or <component>.pdb.enabled global.pdb.enabled`.
    #
    # `maxUnavailable` rather than `minAvailable`, deliberately:
    #
    #   * It scales with replica count instead of pinning an absolute floor.
    #   * On the single-replica Compactor, `minAvailable: 1` would block every
    #     voluntary eviction and hang node drains indefinitely. `maxUnavailable: 1`
    #     permits the eviction, so the singleton is a harmless no-op rather than
    #     a drain deadlock.
    #   * On Receive it must stay within what write quorum tolerates
    #     (`replicationFactor - ((replicationFactor / 2) + 1)`), which is 1 at
    #     the replication factor of 3 set below. A validator enforces this.
    #
    # This matches the Loki convention (ingester `maxUnavailable: 1`).
    pdb:
      enabled: true
      maxUnavailable: 1

  # -- Thanos Query configuration. Query provides a PromQL query endpoint.
  query:
    enabled: true

    # -- Horizontal autoscaling for Query.
    # Query is a stateless PromQL fan-out, so it is the natural place to
    # autoscale: no local state, no ring membership, no PVC.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80

    # -- Topology spread for Query: soft on both axes.
    # @raw
    # Stateless and autoscaled, so an unbalanced placement costs query capacity
    # rather than correctness — soft is sufficient, and it keeps an HPA scale-up
    # from stalling on a hard rule when the newest zone has no room yet.
    #
    # `pod-template-hash`, not `controller-revision-hash`: Query is a Deployment,
    # and that is the label its ReplicaSets carry. Using the StatefulSet label
    # here would match nothing and quietly disable the same-revision guard.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query

    # -- Resource requests for Thanos Query. Medium sizing; see the
    # `thanos-small` / `thanos-large` profiles for the other two columns.
    # @raw
    # A CPU request is load-bearing here beyond scheduling: `targetCPUUtilization`
    # is a percentage *of the request*, so without one the HPA above has no
    # denominator and never scales. No memory limit — a fan-out query's peak
    # scales with the series it touches, and an OOM-kill mid-query is a worse
    # failure than a slow one.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi

  receive:
    # -- Enable Thanos receiver. Receive provides a Prometheus remote_write-compatible endpoint.
    enabled: true
    # -- Whether to split receive distributors from ingesters.
    # mode=split is not very stable in the helm chart
    mode: standalone
    # -- Number of receive replicas.
    replicaCount: 3

    # -- How long Receive keeps blocks on local disk before they age out.
    # @raw
    # **6h, overriding the subchart's 24h**, because local retention is what sets
    # Receive's disk requirement — and on an `emptyDir` that disk is the node's, a
    # far scarcer and much smaller pool than a provisioned volume was.
    #
    # This is a recent-query cache, not a durability window: blocks ship to object
    # storage every 2h and the Store Gateway serves everything older, so all that
    # shortens here is how far back a query is answered from local TSDB rather
    # than from the bucket. 6h covers the common dashboard ranges and leaves 4h of
    # margin after a block closes, uploads, and the Store Gateway syncs it.
    #
    # Raising it back is a real cost rather than just a number. At the medium
    # envelope (1.5M series) 24h is ~7.3Gi per pod, and a GKE node with a 47Gi boot
    # disk offers only ~18.8Gi of *allocatable* ephemeral storage — one pod would
    # claim 40% of the node's budget, and Loki's ingesters draw on the same pool.
    tsdb:
      retention: 6h

    # -- Extra CLI arguments for Receive.
    # @raw
    # **This is a list, and Helm overwrites lists rather than merging them.**
    # Anything that sets `receive.extraArgs` replaces this entry wholesale, so
    # the replication factor must be restated or it silently falls back to
    # Thanos's default of 1 — write quorum 1, no losses tolerated. The shipped
    # profiles restate it; so must yours. See Production Best Practices >
    # Metrics (Thanos) for the quorum table.
    extraArgs:
      - --receive.replication-factor=3

    # -- VerticalPodAutoscaler for Receive.
    # @raw
    # Off, overriding the subchart's `true`. Three reasons, in order:
    #
    # 1. It rewrites the requests below, so a sizing profile would not survive
    #    contact with it.
    # 2. `updateMode: Auto` evicts pods to apply new requests, and Receive holds
    #    up to `tsdb.retention` (6h) of blocks on an `emptyDir` whose only
    #    redundancy is the replication factor — an eviction discards that pod's
    #    copy of the window.
    # 3. The subchart's VPA template is CRD-gated, so leaving it on makes the
    #    stack behave differently on clusters with the VPA CRD installed than on
    #    those without — silently, in both directions.
    #
    # If you want its recommendations without its actions, set
    # `updateMode: "Off"` rather than re-enabling Auto.
    vpa:
      enabled: false

    # -- Resource requests for Receive. Medium sizing.
    # @raw
    # Memory is the cell to get right: budget ~3 KB per active series held, and
    # note that at `replicaCount == replicationFactor` **every pod holds every
    # series** — sharding begins only above RF.
    #
    # No memory limit, deliberately, and for a sharper reason than elsewhere in
    # this chart: an OOM-kill drops the un-uploaded block window, and unlike
    # Loki's ingesters that window has nothing protecting it but the replication
    # factor. Alert on usage instead.
    #
    # `ephemeral-storage` is declared because the TSDB lives on an `emptyDir`
    # (see `persistence`). The request is what the scheduler places against, so a
    # node without room refuses the pod instead of filling up silently. The limit
    # carries deliberate headroom over the request: the kubelet's response to
    # exceeding it is **eviction**, and evicting Receive destroys exactly the
    # un-uploaded window this sizing exists to protect.
    #
    # **Size these against a node's *allocatable* ephemeral storage, not its disk
    # size.** The two are nowhere near each other: GKE reserves most of the boot
    # disk for the image filesystem, so a 47Gi disk offers roughly 18.8Gi
    # allocatable. A request above that cannot schedule anywhere, and the
    # cluster-autoscaler will not rescue it — no node of that shape would fit
    # either, so the pod sits Pending indefinitely on `Insufficient
    # ephemeral-storage`. Check before raising these:
    #
    #   kubectl get nodes -o custom-columns='NODE:.metadata.name,EPH:.status.allocatable.ephemeral-storage'
    #
    # 4Gi holds 6h of the medium envelope (~1.8Gi) with room for the WAL and
    # compaction churn, and leaves the rest of the node for everything sharing that
    # pool — including Loki's ingesters, which are also `emptyDir`-backed.
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
        ephemeral-storage: 4Gi
      limits:
        ephemeral-storage: 6Gi

    # -- Topology spread for Receive: hard across zones, soft across hosts.
    # @raw
    # This is the constraint that makes `--receive.replication-factor=3` mean
    # what the quorum table says. Without it the scheduler is free to place all
    # three replicas in one zone, and RF 3 buys nothing against the failure it
    # exists for — losing a zone takes every copy and, since write quorum is 2,
    # takes writes with it.
    #
    # **Hard** (`DoNotSchedule`) on zones, deliberately. A pod that cannot
    # satisfy it goes Pending, which is the signal Karpenter or the
    # cluster-autoscaler uses to add a node in the deficient zone — a soft rule
    # cannot summon capacity that way, it just quietly places the pod wrongly.
    # Host spread stays soft so pods still schedule when nodes are momentarily
    # scarce; two pods sharing a node is a smaller problem than a pod not
    # running.
    #
    # **This became viable when Receive stopped using a PVC** (see
    # `persistence` below). A zonal volume cannot be attached from another zone,
    # so a hard zone rule and an AZ-pinned pod pull in opposite directions: the
    # rule says "go to the empty zone", the volume says "you may only run in
    # zone A", and the pod goes Pending forever rather than for as long as it
    # takes to add a node. On `emptyDir` there is nothing holding it back.
    #
    # The selector names **both** `app.kubernetes.io/name` and
    # `app.kubernetes.io/component`, and the first of those is load-bearing:
    # component names are not unique across backends. Loki also ships a
    # `compactor`, a `query-frontend` and a `ruler`, so a component-only selector
    # would make Thanos count Loki's pods when computing its own skew — silently,
    # and only for the components whose names happen to collide.
    #
    # The release name is deliberately absent: the subchart renders this through
    # `toYaml` rather than `tpl`, so a `{{ include ... }}` would land in the
    # manifest literally. Spread is namespace-scoped and this chart assumes one
    # instance of each backend per namespace, so name plus component is
    # sufficient. See the Namespace layout section.
    #
    # Note this cannot move to `thanos.global.topologySpreadConstraints`: each
    # constraint carries its own `labelSelector`, and a global one would make
    # every Thanos component count Receive's pods when computing its own skew.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        # minDomains must equal the number of zones your node pool can launch in.
        # Setting it above the available zone count leaves pods Pending forever.
        # Two is the floor at which an AZ loss is survivable at all; three is
        # what RF 3 actually wants.
        minDomains: 2
        # Count only same-revision pods, so a rolling update does not deadlock
        # the skew math against the pods it is replacing. `controller-revision-hash`
        # is the StatefulSet's label — Deployments use `pod-template-hash`.
        matchLabelKeys:
          - controller-revision-hash
        # Honor node taints, so nodes still carrying a startup taint are not
        # counted as available domains.
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: receive
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - controller-revision-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: receive

    # -- Local TSDB storage for Receive: **ephemeral, not a PVC.**
    # @raw
    # This is the same call the chart makes for Loki's ingesters, for the same
    # reason, and it is worth spelling out because Receive looks stateful.
    #
    # Durability comes from `--receive.replication-factor=3`, not from disk.
    # Blocks ship to object storage every 2h, so the window that exists only
    # locally is at most 2h — and every replica uploads its own copy under a
    # distinct `replica` external label, which the Compactor deduplicates. A pod
    # that comes back with an empty volume has lost its copy of that window, and
    # the query path still answers from the surviving replicas.
    #
    # A PVC makes an AZ failure **worse**, not merely less flexible: an EBS
    # volume cannot be attached from another zone, so a pod whose zone is gone
    # stays Pending until the zone returns rather than rescheduling into a
    # healthy one. On the write path that turns a recoverable event into an
    # outage that waits on the cloud provider — with RF 3 write quorum is 2, so
    # two pods stuck Pending block writes outright.
    #
    # The trade accepted in exchange: Thanos Receive has no peer hand-off, so
    # unlike Loki it will not backfill an emptied pod from its neighbours. That
    # window stays at two copies instead of three until the next block ships.
    persistence:
      enabled: false

  # -- Thanos Store Gateway configuration. Store Gateway provides historical block querying.
  # @raw
  #
  # Autoscaling is available upstream but left **off** deliberately. Store
  # Gateway is a PVC-backed StatefulSet that syncs the bucket's block index on
  # startup, so scale-up is slow to become useful (it serves nothing until the
  # index is warm) and CPU-triggered scaling reacts long after the load that
  # triggered it. Scale-down also leaves orphaned PVCs behind, since
  # StatefulSet volumes are not reclaimed. Size it deliberately instead.
  storegateway:
    enabled: true

    # -- Index-header cache for Store Gateway.
    # @raw
    # One of two Thanos components that keep a PVC — the Compactor is the other,
    # and Receive alone is `emptyDir`-backed. The reason here is startup cost
    # rather than durability or size: the on-disk binary index-headers are a
    # read-through cache of the bucket and lose nothing when discarded, but
    # rebuilding them means re-downloading from object storage, and the component
    # serves no historical query until that finishes. On a large bucket that is
    # minutes of degraded long-range dashboards on every restart.
    #
    # Kept on at **every** size deliberately, rather than flipping to ephemeral
    # for small installs. A volume that appears and disappears with the profile
    # is a surprise during an incident, and the AZ-pinning argument that drives
    # Receive to `emptyDir` is much weaker here: Store Gateway is a read-only
    # replica set with no quorum, so a pod stuck Pending in a dead zone costs
    # read capacity rather than blocking writes.
    #
    # The `kind` profile is the one exception, where CI would rather not wait on
    # volume provisioning for a cache.
    persistence:
      enabled: true
      size: 10Gi

    # -- Resource requests for Store Gateway. Medium sizing.
    # @raw
    # There is a floor here that is easy to trip over. Thanos defaults
    # `--chunk-pool-size=2GB` and `--index-cache-size=250MB`, and the subchart
    # passes neither, so a stock Store Gateway wants ~2.5Gi before it serves a
    # single query. A request below that is an OOM, not a small install — the
    # `thanos-small` profile shrinks the pools through `extraArgs` instead.
    resources:
      requests:
        cpu: 500m
        memory: 3Gi

    # -- Topology spread for Store Gateway: soft on both axes.
    # @raw
    # **Soft** (`ScheduleAnyway`) where Receive is hard, and the difference is
    # the point rather than an inconsistency. Two things make it the right trade
    # here:
    #
    # 1. **Nothing depends on quorum.** Store Gateway is a read-only replica set
    #    over object storage, so an unbalanced placement costs read capacity
    #    during a zone loss rather than correctness. Receive's hard rule protects
    #    write quorum; there is no equivalent to protect here.
    # 2. **It is the one Thanos component that still keeps a PVC**, and a hard
    #    zone rule against a zonal volume can deadlock rather than merely wait.
    #    With `volumeBindingMode: WaitForFirstConsumer` — the default for the
    #    zonal CSI classes and what you want — the volume follows the pod and the
    #    two agree. With `Immediate`, the PVC's zone is chosen *before* scheduling
    #    and a hard rule pointing elsewhere leaves the pod Pending forever. Soft
    #    degrades instead of deadlocking on a StorageClass we do not control.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - controller-revision-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: storegateway
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - controller-revision-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: storegateway

    # -- Extra CLI arguments for Store Gateway.
    # @raw
    # Read-path protection. Thanos has no per-tenant write limit to set; the
    # realistic failure is one query fanning out across the bucket and taking
    # this component down, which takes historical reads with it. These two caps
    # make that query fail instead.
    #
    # The subchart ships this empty, so unlike `receive.extraArgs` there is
    # nothing to lose by overriding it — but it is still a list, so restate both
    # entries when adding a third.
    extraArgs:
      - --store.limits.request-series=5000000
      - --store.limits.request-samples=200000000

  # -- (object) Thanos Compactor configuration. Compactor provides block compaction and downsampling.
  # @default -- enabled with default retention policies
  # @notationType -- desc
  compactor:
    enabled: true

    # -- Retention policies for Thanos Compactor downsampled data
    # @raw
    # The medium row of the retention table in Production Best Practices.
    #
    # Raw retention has a floor set by the downsampling thresholds: Thanos
    # produces 5m downsamples only from blocks spanning 40h or more, and 1h
    # downsamples only from blocks spanning 10d or more. Below those the tier is
    # never created at all and long-range queries silently fall back to reading
    # raw blocks — slower and more expensive, which is the opposite of the
    # intent. 30d clears both comfortably.
    retention:
      resolutionRaw: 30d
      resolution5m: 90d
      resolution1h: 365d

    # -- VerticalPodAutoscaler for the Compactor.
    # Off for the same reasons as `receive.vpa`, minus the block-loss argument —
    # the Compactor's local volume is an idempotent working copy, so an eviction
    # costs a restarted compaction rather than data. It still overwrites the
    # requests below, and still behaves differently depending on whether the VPA
    # CRD happens to be installed.
    vpa:
      enabled: false

    # -- Resource requests for the Compactor. Medium sizing.
    # @raw
    # The Compactor is a **singleton by necessity** — concurrent compactors
    # against one block set corrupt data — so it is the one component here with
    # no horizontal escape hatch. Vertical is the only lever, which makes
    # compaction falling behind something to alert on rather than discover.
    #
    # Downsampling is the memory-heavy phase, and `--compact.concurrency`
    # multiplies it; leave that at 1 unless compaction is provably behind.
    #
    # No `ephemeral-storage` here: the Compactor keeps a PersistentVolume, so its
    # scratch does not draw on the node's budget. See `persistence` for why.
    resources:
      requests:
        cpu: 1
        memory: 2Gi

    # -- Working directory for the Compactor: **a PersistentVolume**, unlike
    # Receive.
    # @raw
    # Scratch space for the block group under compaction. Nothing here is
    # authoritative — the bucket is — and a Compactor killed mid-compaction simply
    # redoes the work, so there is no *durability* argument for a volume. The
    # argument is size.
    #
    # Compaction works on whole block groups, not on the recent window, so the
    # requirement scales with days of data rather than hours. At the medium
    # envelope a 2d group is roughly six 8h blocks at ~2.4Gi each, and the
    # Compactor needs the sources and the output at once — on the order of 30Gi.
    # A GKE node with a 47Gi boot disk offers about 18.8Gi of *allocatable*
    # ephemeral storage, so that never fits: the pod stays Pending on
    # `Insufficient ephemeral-storage`, and the cluster-autoscaler cannot help
    # because no node of that shape would fit either.
    #
    # This is the reverse of the call made for Receive, and deliberately so.
    # Receive holds hours of small, replicated data and is the better trade on
    # `emptyDir`; the Compactor holds days of it and is not. The AZ-pinning cost is
    # real — a zone outage stops compaction, and while compaction is stopped
    # retention is not enforced and the bucket grows — but "compaction pauses
    # during a zone outage" is a far better failure than "compaction never runs
    # because the pod cannot be scheduled".
    persistence:
      enabled: true
      # Sources plus output for the largest compaction group, with headroom. The
      # 20Gi this chart shipped before was already short of the ~30Gi a medium
      # install needs.
      size: 50Gi

  # -- Thanos Query Frontend configuration. Query Frontend provides query parallelization and result caching. Only required for production.
  # @raw
  #
  # Note that enabling this is not sufficient on its own: point
  # `connections.datasources.thanos.url` at the query-frontend Service too, or
  # reads keep going straight to Query and the cache is never consulted. A
  # validator warns when the two disagree.
  queryFrontend:
    enabled: false

    # -- Horizontal autoscaling for Query Frontend.
    # Stateless like Query, so the same reasoning applies. Inert until
    # `queryFrontend.enabled` is true.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80

    # -- Topology spread for Query Frontend: soft on both axes, same reasoning as
    # Query. Inert until `enabled` is true.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query-frontend
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: thanos
            app.kubernetes.io/component: query-frontend

    # -- Resource requests for Query Frontend. Inert until it is enabled, which
    # `thanos-large` does. Sized for splitting and result caching rather than
    # query execution — the work happens in Query behind it.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi

  # -- Thanos Ruler configuration. Ruler provides alerting and recording rules evaluation.
  ruler:
    enabled: false

# -- (h4) Bundled Grafana-operator for managing Grafana instances.
# @notationType -- (sectionstart) Grafana Operator
# @raw
#
# Upstream references:
#   * https://grafana.github.io/grafana-operator/docs/installation/helm/#values
#   * https://github.com/grafana/grafana-operator/blob/master/deploy/helm/grafana-operator/values.yaml
grafana-operator:
  # Circuit breaker (precedence over `tags.default`, `tags.managed-grafana`, and `tags.grafana-operator`):
  # enabled:
  # -- Scheduling priority. See the Priority classes section.
  # Scalable tier: while the operator is down, dashboard and datasource
  # reconciliation stops, but Grafana keeps serving what it already has.
  priorityClassName: monitoring-scalable
  # -- Standard Helm full-name override.
  # We use a static name for deterministic relations.
  fullnameOverride: "grafana-operator"
  # -- Namespace override.
  namespaceOverride: null
  # -- CRD behavior.
  # The Grafana Operator CRDs are owned by the `materialize-monitoring-crds`
  # chart, which vendors a deflated copy of them. The operator chart offers no
  # way to skip its own CRDs outright — `immutable` only chooses where they
  # come from — so keep this `true`: that keeps them out of this chart's
  # release manifest and leaves them install-only, which
  # `helm install --skip-crds` drops entirely. Setting it `false` makes this
  # chart template and upgrade the CRDs itself, fighting the CRDs chart for
  # ownership.
  crds:
    immutable: true

  serviceMonitor:
    enabled: true

# -- (h4) Bundled Grafana for dashboard rendering.
# @notationType -- (sectionstart) Grafana Instance
# @raw
#
# Upstream reference:
#   * https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
#
# The defaults here are the *safe* shape, not the *production* shape, and the
# two differ in three places you have to close yourself:
#
# 1. **State.** Grafana stores users, service accounts and tokens, annotations,
#    dashboard versions and permissions, preferences, and alert-rule state in a
#    database of its own. The default is SQLite on an `emptyDir`, so all of it
#    is lost on every restart, upgrade, and reschedule. The dashboards this
#    chart installs come back on their own (grafana-operator re-pushes them
#    every `resyncPeriod`); anything a human created does not. Apply the
#    `grafana-postgres` profile, or `grafana-pvc` if you have no database.
# 2. **Reachability.** The Service is `ClusterIP`, so the only access path is
#    `kubectl port-forward`. Set `ingress` or `service.type` — and read
#    `connections.grafana.allowPublicAccess` before you do.
# 3. **Authentication.** The only account is the generated admin. Configure an
#    identity provider under `grafana.ini` before exposing it to anyone but
#    yourself.
#
# Everything under `grafana.ini` is passed through to Grafana's own config file
# verbatim, so any section Grafana understands can be set here — see the
# `[auth.generic_oauth]` example on that key.
#
# See [Production Best Practices > Grafana](https://materializeinc.github.io/materialize-monitoring/operating/production-best-practices/#grafana)
# for the full checklist.
grafana:
  # Circuit breaker (precedence over `tags.default`, `tags.managed-grafana`, and `tags.grafana-standalone`):
  # enabled: true
  # -- Standard Helm full-name override.
  # We use a static name for deterministic relations.
  # `connections.grafana.mode: bundled` derives the URL it hands
  # grafana-operator from this, so a release-name-derived name would leave the
  # operator dialing a host that does not resolve.
  fullnameOverride: "grafana"
  # -- Namespace override.
  namespaceOverride: null
  # -- Scheduling priority. See the Priority classes section.
  priorityClassName: monitoring-scalable

  # -- Grafana server image.
  # @raw
  # Pinned here rather than left to track the subchart's `appVersion`, so
  # Renovate can bump the server on its own cadence instead of only when a new
  # chart release happens to carry one.
  #
  # A hardened rebuild is a drop-in swap: point `registry`/`repository` at it and
  # keep the tag. Published options, all of which track upstream Grafana versions:
  #
  #   * Docker Hardened Images — https://docs.docker.com/dhi/ (subscription;
  #     images land in your own org namespace, so `registry` is yours)
  #   * Chainguard Images — https://images.chainguard.dev/directory/image/grafana/overview
  #   * Bitnami Secure Images — https://github.com/bitnami/containers/tree/main/bitnami/grafana
  #     (the versioned, hardened tags moved behind a subscription; the free
  #     `docker.io/bitnami` namespace is not the same thing)
  #
  # All of them ship no shell and no package manager, which is the point — and
  # which also means `plugins` cannot work, since that installs at container
  # start. Bake plugins into the image instead. See the note on `plugins` below.
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: "13.1.3"
    pullPolicy: IfNotPresent

  # -- Number of Grafana replicas.
  # More than one requires a shared database (`grafana.ini.database`) — each
  # replica otherwise carries its own divergent SQLite file, which is a
  # correctness bug rather than availability. A render-time check enforces this.
  replicas: 1

  # -- Horizontal autoscaling for the Grafana Deployment.
  # @raw
  # Off by default because it is meaningless on the default SQLite backend:
  # every replica would carry its own database. With `grafana.ini.database`
  # pointed at PostgreSQL, Grafana is stateless and scales horizontally, so
  # enable it then — `minReplicas` becomes the effective replica count and
  # `replicas` stops being rendered at all.
  #
  # `targetCPU` is a percentage of the CPU *request*, so `resources.requests.cpu`
  # has to be set or the HPA has no denominator and never scales. A render-time
  # check warns when it is missing.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPU: "60"
    targetMemory: ""

  # -- PodDisruptionBudget for Grafana.
  # `maxUnavailable` rather than `minAvailable`, matching the convention the
  # Loki and Thanos blocks use: it scales with the replica count, and on a
  # single replica `minAvailable: 1` would permit no voluntary eviction at all
  # and hang node drains.
  podDisruptionBudget:
    maxUnavailable: 1

  # -- Resource requests and limits for the Grafana container.
  # Requests are what the scheduler and the HPA both read — without a CPU
  # request, `autoscaling.targetCPU` has no denominator and the HPA never
  # scales. No CPU limit: query rendering is bursty and throttling it makes the
  # UI feel broken. Raise the memory limit if you run many large dashboards or
  # heavy plugins.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # -- Persistent volume for Grafana's SQLite database and plugin directory.
  # @raw
  # Off by default. Turning it on survives restarts but caps you at one replica
  # (SQLite tolerates one writer) and, on a `ReadWriteOnce` volume, requires
  # `deploymentStrategy.type: Recreate` — a rolling update otherwise deadlocks
  # with the new pod waiting for a volume the old pod has not released. Both are
  # enforced at render time. The `grafana-pvc` profile is the assembled version.
  #
  # Prefer PostgreSQL (`grafana-postgres`) wherever a database is available: it
  # is the only option that lifts both constraints.
  persistence:
    enabled: false
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  # -- Deployment update strategy.
  # Must be `Recreate` alongside a `ReadWriteOnce` PersistentVolume; see
  # `persistence`.
  deploymentStrategy:
    type: RollingUpdate

  # -- Service exposing Grafana.
  # @raw
  # `ClusterIP` is reachable only from inside the cluster, which is the safe
  # default and the reason a fresh install needs `kubectl port-forward`. Prefer
  # `ingress` over a `LoadBalancer` Service: Grafana is ordinary HTTP that wants
  # host-based routing and a certificate, which is what Ingress is for.
  #
  # A `LoadBalancer` Service with no `loadBalancerSourceRanges` is an error at
  # render time unless `connections.grafana.allowPublicAccess` is set.
  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 3000
    # Cloud-specific annotations belong here — internal-LB scheme, certificate
    # ARN, subnet selection. The Terraform module supplies them for you.
    annotations: {}
    # CIDRs permitted to reach a `LoadBalancer` Service. Leaving this empty on a
    # public load balancer exposes Grafana to every address the LB accepts.
    loadBalancerSourceRanges: []

  # -- Ingress for Grafana.
  # @raw
  # The preferred way to make Grafana reachable. Terminate TLS here: Grafana
  # authenticates with a session cookie and, without TLS, that cookie and the
  # admin password cross the network in the clear. A render-time check warns
  # when an Ingress carries no `tls` block.
  #
  # Set `grafana.ini.server.root_url` to the same URL — Grafana builds share
  # links, alert notification links, and OAuth redirect URIs from it, and all
  # three break silently when it disagrees with the Ingress host.
  ingress:
    enabled: false
    ingressClassName: ""
    annotations: {}
    labels: {}
    path: /
    pathType: Prefix
    # Explicitly nulled, not left empty: the subchart defaults this to the
    # placeholder `chart-example.local`, and an empty list would not clear it —
    # Helm's merge treats `[]` as "contributes nothing", so the default would
    # survive and Grafana would answer on a hostname nobody meant. Enabling the
    # Ingress without setting this is an error at render time.
    hosts: null
    tls: null

  # -- Grafana's own configuration file, as YAML.
  # @raw
  # Rendered verbatim into `grafana.ini`, so any section Grafana understands can
  # be set here: authentication, SMTP, feature toggles, unified alerting, user
  # provisioning. The chart sets only the handful below and merges anything you
  # add over them.
  #
  # Secrets must NOT be inlined — this block renders into a **ConfigMap**, so a
  # value here lands in plaintext in the release manifest, in `helm get values`,
  # and in whatever Git repo holds your values file. Use Grafana's own
  # expansion instead: `$__file{/path}` for a mounted Secret (see
  # `extraSecretMounts`) or `$__env{VAR}` for one injected with `envValueFrom`.
  # The subchart's `assertNoLeakedSecrets` check fails the render if you forget.
  #
  # OIDC single sign-on, as an example — this is the shape, not a default:
  #
  # ```yaml
  # grafana:
  #   grafana.ini:
  #     server:
  #       root_url: https://grafana.example.com
  #     auth:
  #       oauth_auto_login: true
  #     auth.generic_oauth:
  #       enabled: true
  #       name: SSO
  #       allow_sign_up: true
  #       client_id: <client-id>
  #       client_secret: $__file{/etc/secrets/grafana-oidc/client-secret}
  #       scopes: openid profile email groups
  #       auth_url: https://idp.example.com/oauth2/v1/authorize
  #       token_url: https://idp.example.com/oauth2/v1/token
  #       api_url: https://idp.example.com/oauth2/v1/userinfo
  #       allowed_domains: example.com
  #       # Map an IdP group claim onto a Grafana role, so membership is the
  #       # provisioning mechanism and nobody is added by hand.
  #       role_attribute_path: contains(groups[*], 'sre') && 'Admin' || 'Viewer'
  #   extraSecretMounts:
  #     - name: grafana-oidc
  #       secretName: grafana-oidc
  #       mountPath: /etc/secrets/grafana-oidc
  #       readOnly: true
  # ```
  #
  # Every provider, the role-mapping rules, and the break-glass path are in
  # [Dashboards > Grafana > Authentication](https://materializeinc.github.io/materialize-monitoring/dashboards/grafana/auth/).
  grafana.ini:
    analytics:
      # No callout to grafana.com for usage reporting or update checks. Both are
      # egress a monitoring stack does not need, and the update banner is noise
      # when the version is pinned by this chart anyway.
      reporting_enabled: false
      check_for_updates: false
    date_formats:
      # Grafana otherwise renders in each browser's local timezone, which makes
      # two people comparing the same dashboard read different numbers off the
      # same axis. Individuals can still override per dashboard.
      default_timezone: UTC

  # -- Grafana plugins to install at container start.
  # @raw
  # Each entry is downloaded from grafana.com when the pod starts, so this needs
  # egress to `grafana.com` on 443 and adds that download to every start and
  # every restart — a startup dependency on a third-party service.
  #
  # For anything load-bearing, bake plugins into the image instead and point
  # `image` at it. That is also the only option on a hardened base image, which
  # ships no shell for `grafana cli` to run in. Pin an exact plugin version
  # either way (`name@version`); an unpinned plugin silently changes underneath
  # a pinned Grafana.
  plugins: []

  # -- Grafana Image Renderer, for server-side PNG rendering of panels.
  # Deliberately off, and it should stay off in production: the renderer is a
  # headless Chromium that fetches arbitrary URLs on Grafana's behalf, which
  # makes it both a large attack surface and a server-side request forgery
  # pivot into the cluster network. A render-time check warns when it is
  # enabled.
  imageRenderer:
    enabled: false

  # -- Helm test hooks shipped by the subchart.
  # Off: it pulls a `bats` image this chart does not otherwise use or pin, and
  # the e2e suite covers what it asserts.
  testFramework:
    enabled: false

  # -- Fail the render when a secret is inlined into `grafana.ini`.
  # Leave this on. It is the guard that keeps database and OAuth credentials out
  # of the ConfigMap; see the note on `grafana.ini`.
  assertNoLeakedSecrets: true

  # -- Scrape Grafana's own metrics.
  serviceMonitor:
    enabled: true

# -- (h4) Bundled Alertmanager for routing alerts emitted by the rule packages.
# @notationType -- (sectionstart) Alertmanager
alertmanager:
  # -- Scheduling priority. See the Priority classes section.
  priorityClassName: monitoring-scalable
  persistence:
    # -- Volume for silences and the notification log.
    # Sized by cloud disk minimums, not by Alertmanager, which needs kilobytes.
    # The subchart default of 50Mi is below the 4 GiB floor on GCP Hyperdisk and
    # Azure managed disks, so provisioning fails there.
    size: 4Gi
# Circuit breaker (precedence over `tags.default`, `tags.bundled-backends`, and `tags.alertmanager`):
# enabled: true

# -- (h4) kube-state-metrics for Kubernetes resource-state metrics consumed by Materialize-adjacent dashboards.
# @notationType -- (sectionstart) Kube State Metrics
# @raw
#
# Upstream reference:
#    * https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-state-metrics/values.yaml
kube-state-metrics:
  # Circuit breaker (precedence over `tags.default`, `tags.cluster-metrics`, and `tags.kube-state-metrics`):
  # enabled: true
  # -- Scheduling priority. See the Priority classes section.
  priorityClassName: monitoring-scalable
  prometheus:
    monitor:
      enabled: true

# -- (h4) node-exporter for hardware and OS metrics from every node.
# @notationType -- (sectionstart) Node Exporter
# @raw
#
# Upstream reference:
#    * https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-node-exporter/values.yaml
#    * https://github.com/prometheus/node_exporter#collectors
#
# Run as its own DaemonSet rather than folded into the Alloy agent's
# `prometheus.exporter.unix`, so its resource envelope stays known and separate:
# a metrics regression cannot then starve log collection out of a shared limit.
# See the Terraform modules design doc for the full argument.
node-exporter:
  # Circuit breaker (precedence over `tags.default`, `tags.cluster-metrics`, and `tags.node-exporter`):
  # enabled: true
  # -- Standard Helm full-name override.
  # We use a static name for deterministic relations.
  fullnameOverride: "node-exporter"
  # -- Namespace override.
  namespaceOverride: null
  # -- Scheduling priority. See the Priority classes section.
  # Critical: a node with no node-exporter is a node nothing else reports on,
  # and the gap does not backfill.
  priorityClassName: monitoring-critical

  # -- Container image.
  # Split into registry / repository / tag so Renovate's `helm-values` manager
  # can bump the exporter independently of the subchart version — the two move
  # on different cadences and a chart release is not a prerequisite for a
  # node_exporter CVE fix.
  #
  # `distroless: true` appends `-distroless` to the tag, giving an image with no
  # shell and no package manager. node_exporter reads the host's `/proc`, `/sys`
  # and `/` — a shell in that container is a materially better foothold than a
  # shell in most others, and nothing in our configuration needs one.
  image:
    registry: quay.io
    repository: prometheus/node-exporter
    tag: v1.12.1
    distroless: true

  # -- Resource envelope, matching what Materialize runs in production today.
  # @raw
  #
  # Deliberately **no CPU limit**. This is a DaemonSet that does nothing between
  # scrapes and then bursts for the length of one collection; a CPU limit turns
  # that burst into CFS throttling, which shows up as scrape timeouts on exactly
  # the loaded nodes where you most need the sample. The 10m request is what it
  # averages, not what a scrape costs.
  #
  # Memory is request == limit, which is the opposite call for the opposite
  # reason: node_exporter's working set is flat and bounded (~20-30 MiB for this
  # collector set), so a limit equal to the request costs nothing and makes the
  # per-node footprint a number the cluster autoscaler can actually plan with.
  # This lands the pod in Burstable QoS. Guaranteed would require the CPU limit
  # we just argued against; being evicted a little earlier under node pressure
  # is the better trade, and `monitoring-critical` covers the ordering.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

  # -- Rolling update budget for the DaemonSet.
  # Upstream's `maxUnavailable: 1` walks a large fleet one node at a time, which
  # makes an image bump take hours. Metrics are gap-tolerant and the pod restarts
  # in seconds, so a percentage keeps rollout time flat as the fleet grows.
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%

  # -- kube-rbac-proxy sidecar, which would put the exporter behind
  # TokenReview/SubjectAccessReview over HTTPS.
  # @raw
  #
  # **Off deliberately.** It is a second container on *every* node, and DaemonSet
  # overhead is the constraint we are managing here — the sidecar's own request
  # is comparable to node_exporter's, so it roughly doubles the per-node cost of
  # node metrics to protect an endpoint that exposes no secrets.
  #
  # What it would buy, for when that trade changes: authenticated scrapes, and
  # (via `kubeRBACProxy.tls` + `tlsSecret`) TLS with **client-certificate auth**,
  # so only a scraper holding a cert signed by the configured CA can read
  # `/metrics`. That is the shape an in-cluster-mTLS story would use, and it is
  # parked, not rejected — see the cert-manager mTLS item on the roadmap.
  #
  # Note that with `hostNetwork: true` the exporter listens on the node's own
  # interfaces, so today the real perimeter is the node firewall / security
  # group, not anything Kubernetes enforces. Do not treat port 9100 as private
  # just because a NetworkPolicy exists.
  kubeRBACProxy:
    enabled: false

  service:
    annotations:
      # Explicitly opt out of annotation-based discovery. Collection happens
      # through the ServiceMonitor below; once generic `prometheus.io/scrape`
      # discovery lands (default off), the upstream chart's `"true"` here would
      # make every node-exporter target get scraped twice under two different
      # `job` labels, which silently double-counts in `sum()` and `rate()`.
      prometheus.io/scrape: "false"

  # -- NetworkPolicy for the exporter.
  # @raw
  #
  # Ingress is narrowed to the Alloy gateway, which is what actually scrapes it
  # (`prometheus.operator.servicemonitors` in the gateway pipeline). Egress is
  # denied outright — node_exporter never initiates a connection.
  #
  # **Read the hostNetwork caveat before relying on this.** The pods run with
  # `hostNetwork: true` (required: `netdev`, `netclass`, `netstat`, `sockstat`
  # and `conntrack` all read namespaced files under `/proc/net`, so in a pod
  # netns they would report the *pod's* traffic, not the node's). Most CNIs —
  # Cilium and Calico among them — do not apply pod NetworkPolicy to
  # host-networked pods, because that traffic belongs to the node identity. So
  # this policy is a correct declaration of intent and is enforced where the CNI
  # supports it, but it is not the control that keeps port 9100 private. The
  # node's firewall is.
  #
  # The default `from` selects by pod label within the release namespace. Running
  # the gateway in a different namespace (see `profiles/split-namespace.values.yaml`)
  # requires replacing this list with one that adds a `namespaceSelector`.
  networkPolicy:
    enabled: true
    ingress:
      - ports:
          - port: 9100
            protocol: TCP
        from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: alloy-gateway

  prometheus:
    monitor:
      # -- Emit a ServiceMonitor. This is how collection actually happens: the
      # Alloy gateway discovers ServiceMonitors cluster-wide and scrapes the
      # endpoints behind them. Without this the DaemonSet runs and is never read.
      enabled: true

  # -- Extra arguments to node_exporter, which is where the collector allowlist lives.
  # @raw
  #
  # `--collector.disable-defaults` turns everything off; each `--collector.<name>`
  # then turns one back on. An allowlist rather than a denylist because the
  # default set drifts with each node_exporter release — a new default-on
  # collector should not silently appear in our cardinality budget.
  #
  # **Every name here must exist on Linux.** An unknown `--collector.*` flag is a
  # parse error and node_exporter exits, so a typo or a platform-specific
  # collector crash-loops the DaemonSet on every node at once. In particular
  # `boottime` is a Darwin/BSD collector; on Linux `node_boot_time_seconds` comes
  # from `stat`, which is why `stat` is in the list and `boottime` is not.
  #
  # Chosen for a network- and memory-hungry Rust database that swaps on purpose:
  #
  # * **Swap, explicitly.** `swap` (per-device swap, off by default upstream) and
  #   `meminfo` (`SwapTotal`/`SwapFree`) give the level; `vmstat` gives the rate
  #   (`pswpin`/`pswpout`), which is the half that distinguishes healthy
  #   deliberate swapping from thrash. `pressure` (PSI) is the leading indicator
  #   for both.
  # * **Memory reclaim.** The `vmstat` field filter is widened below to admit
  #   `pgscan_*`/`pgsteal_*`, which separate background reclaim (`kswapd`, fine)
  #   from direct reclaim (`direct`, an allocating thread is stalled) — the
  #   difference between swap working and swap hurting.
  # * **Network.** `netdev`/`netclass` for the NICs, `netstat` for TCP
  #   retransmits, `sockstat` for socket and TCP-memory pressure, `softnet` for
  #   packets the kernel dropped before userspace saw them, `udp_queues` for DNS,
  #   and `conntrack` for table exhaustion behind NAT gateways.
  # * **CPU.** `cpu` (including `mode="steal"`), plus `schedstat` for run-queue
  #   wait — "threads were runnable and did not run", which is the contention a
  #   tightly-optimized dataflow engine feels first — and `stat` for context
  #   switches and blocked processes.
  # * **Correctness-adjacent.** `timex` for clock sync; a database with timestamp
  #   semantics on cloud VMs wants to know when NTP has given up.
  #
  # Left off on purpose, with the reason, since each is one line to re-add:
  #
  # * `slabinfo` — kernel slab accounting. Costs ~1.5k series per node (every
  #   slab cache × several metrics) and needs a root init container to chmod
  #   `/proc/slabinfo` (`permissionInitContainer.fixes.slabinfo`). `meminfo`
  #   already answers "how much kernel memory" via `Slab`/`SReclaimable`/
  #   `SUnreclaim`; `slabinfo` only adds *which cache*, which is forensics you
  #   turn on during an investigation.
  # * `ethtool` — on EC2 this is where the ENA allowance counters live
  #   (`bw_*_allowance_exceeded`, `pps_allowance_exceeded`,
  #   `conntrack_allowance_exceeded`): instance-level network throttling that is
  #   invisible in every other metric. Genuinely valuable on AWS and worth
  #   enabling there, paired with
  #   `--collector.ethtool.device-include=^(eth|ens|enp)` — held back only
  #   because the stat set is driver-specific (gVNIC and Azure expose different
  #   counters) and unverified on our images.
  # * `interrupts`, `softirqs` — per-CPU × per-IRQ, so thousands of series on a
  #   large instance. `softnet` covers the actionable part.
  # * `tcpstat` — parses every socket in `/proc/net/tcp`, which is most expensive
  #   on exactly the busiest nodes. `sockstat` gives the aggregate cheaply.
  # * `processes` — walks all of `/proc` each scrape. `stat` already reports
  #   running and blocked counts.
  # * `edac`, `rapl`, `thermal_zone`, `dmi` — hypervisors do not expose ECC,
  #   powercap or thermals to guests, and instance type comes from node labels.
  #   Worth revisiting on bare metal.
  # * `meminfo_numa`, `zoneinfo`, `buddyinfo` — NUMA and fragmentation detail for
  #   very large instances; opt in when investigating.
  # * `ipvs`, `nfs`, `nfsd`, `bonding`, `mdadm`, `zfs`, `btrfs`, `bcache` — none
  #   apply to a cloud node running ext4/xfs on network block storage with
  #   Cilium replacing kube-proxy. `ipvs` matters if you run kube-proxy in IPVS
  #   mode; `nfs` if you mount EFS/Filestore.
  # * `sysctl` — no default set, but `--collector.sysctl.include=vm.swappiness,
  #   vm.overcommit_memory,vm.overcommit_ratio` is a cheap guard against AMI
  #   drift changing swap behaviour underneath a swap-dependent workload.
  # * `textfile` — the node-local extension point, but it needs a hostPath mount
  #   this chart does not create.
  extraArgs:
    - --collector.disable-defaults
    # Compute and scheduling.
    - --collector.cpu
    - --collector.cpufreq
    - --collector.loadavg
    # Run-queue wait time. Two kernel gates worth knowing before debugging an
    # empty panel: `/proc/schedstat` needs `CONFIG_SCHEDSTATS`, and since Linux
    # 4.6 the counters are additionally off at runtime unless
    # `kernel.sched_schedstats=1`. A missing file shows up as
    # `node_scrape_collector_success{collector="schedstat"} == 0`; the sysctl
    # being off is quieter — the file reads as zeros.
    - --collector.schedstat
    - --collector.stat
    - --collector.pressure
    # Memory and swap.
    - --collector.meminfo
    - --collector.vmstat
    - --collector.swap
    # Admit the reclaim counters alongside the upstream default fields
    # (`^(oom_kill|pgpg|pswp|pg.*fault).*`). `pgscan_*` / `pgsteal_*` split
    # background reclaim from direct reclaim; `workingset_*` shows refault churn.
    - --collector.vmstat.fields=^(oom_kill|pgpg|pswp|pg.*fault|pgscan|pgsteal|workingset).*$
    # Disk and filesystem.
    - --collector.diskstats
    - --collector.filesystem
    # Upstream's default excludes container-runtime paths but not the kubelet's.
    # Every emptyDir, secret, configMap and projected token is its own mount
    # under `/var/lib/kubelet/pods/<uid>/`, so a 100-pod node contributes
    # hundreds of mountpoints whose names change on every pod restart — the same
    # cardinality-churn problem as the veths below. `/var/lib/kubelet` itself is
    # deliberately still collected: that is the ephemeral-storage filesystem, and
    # filling it is a real and common node failure.
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+|var/lib/kubelet/(pods|plugins)/.+|run/containerd/.+)($|/)
    - --collector.nvme
    - --collector.xfs
    # Network. Node-level counters only: the per-pod view comes from cAdvisor,
    # and on a Cilium node every pod adds an `lxc*` veth to the host netns. Left
    # unfiltered, `netclass` and `netdev` emit ~10 series per veth *and* churn
    # the interface names on every pod restart, which costs more in TSDB churn
    # than in raw series. The `cilium_*` devices are deliberately kept: there are
    # three or four per node, the names are stable, and drops on `cilium_vxlan`
    # are a real signal.
    - --collector.netdev
    - --collector.netdev.device-exclude=^(lo|lxc.*|veth.*|cali.*|azv.*|docker.*|br-.*|nodelocal.*|kube-ipvs.*|dummy.*)$
    - --collector.netclass
    - --collector.netclass.ignored-devices=^(lo|lxc.*|veth.*|cali.*|azv.*|docker.*|br-.*|nodelocal.*|kube-ipvs.*|dummy.*)$
    - --collector.netstat
    - --collector.sockstat
    - --collector.softnet
    - --collector.udp_queues
    - --collector.conntrack
    - --collector.arp
    # System identity and health.
    - --collector.os
    - --collector.uname
    - --collector.time
    - --collector.timex
    - --collector.filefd
    - --collector.entropy
    - --collector.hwmon
    - --collector.selinux
    # Reads `/proc/sys/kernel/hung_task_detect_count`, which is Linux 6.13 and
    # newer. On an older kernel the collector reports
    # `node_scrape_collector_success{collector="kernel_hung"} == 0` and the rest
    # of the scrape is unaffected.
    - --collector.kernel_hung

# -- (h4) metrics-server for pod and node resource usage; only needed when the cluster does not already ship one.
# @notationType -- (sectionstart) Metrics Server
# @raw
#
# Upstream reference:
#    * https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/values.yaml
metrics-server:
  # Circuit breaker (precedence over `tags.cluster-metrics` and `tags.metrics-server`):
  # enabled: true
  # -- Number of replicas for metrics-server.
  replicas: 1

  metrics:
    enabled: true

  serviceMonitor:
    enabled: true
