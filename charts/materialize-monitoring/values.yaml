# -- Values that are passed to all subcharts
# @notationType -- (sectionstart) Globals
global:
  # -- Override the registry for all images in this chart and its subcharts. Leave empty to use upstream defaults.
  imageRegistry: ""
  # -- Image pull secrets for this chart's own workloads and for the subcharts that read a global. Not all of them do.
  # @raw
  # Reaches this chart's own workloads, plus Thanos, Grafana, kube-state-metrics
  # and node-exporter. It does **not** reach every subchart on its own, because
  # they do not agree on where to read it from:
  #
  # * Alloy reads `global.image.pullSecrets` and never this key. This chart
  #   honors both spellings for the workloads it renders itself, but the Alloy
  #   subchart only sees its own.
  # * Loki, grafana-operator, Alertmanager and metrics-server read no global at
  #   all and need their own `<chart>.imagePullSecrets`.
  #
  # `profiles/registry/pull-secret.values.yaml` sets every one of those paths
  # from a single Secret name; prefer it over setting this key alone, which
  # leaves Loki — the largest pod count in the release — pulling anonymously.
  imagePullSecrets: []

  # -- The cluster's DNS domain.
  # @raw
  # `cluster.local` is a **default, not a fact** — clusters get built with
  # `--cluster-domain=cluster.internal` or a site-specific domain often enough
  # that hardcoding it is a reliable way to ship a feature that works everywhere
  # we test and nowhere a customer runs.
  #
  # It lives under `global` because two subcharts already read
  # `global.clusterDomain` and build real addresses from it — Loki's memberlist
  # join address and canary URL, and Thanos's in-cluster endpoints. Helm
  # propagates `global` into every subchart, so setting it here is what makes one
  # value mean one thing rather than three keys that can disagree.
  #
  # **One subchart is not covered by that propagation.** `metrics-server` reads
  # its own `metrics-server.tls.clusterDomain`, which is set to the same default
  # below; a render-time check warns when the two disagree, because the failure
  # is a certificate whose SANs name a domain the cluster does not use.
  #
  # Load-bearing for `certificates`: the SAN ladder ends in
  # `$svc.$ns.svc.$clusterDomain`, so a wrong value here produces certificates
  # that fail verification against the endpoints this chart itself dials.
  clusterDomain: cluster.local

# -- Configuration for the main chart
# @notationType -- (sectionstart) Main chart configuration
__mainSection:

# -- Standard Helm name override.
# Note that in umbrella charts, fullname may be shorted.
# See fullnameOverride.
nameOverride: ""
# -- Standard Helm fullname override.
# Note that in umbrella charts, this may be shortened to avoid long prefixes.
# (and have more stable names in resources)
fullnameOverride: "mzmon"
# -- Namespace override for default workloads.
namespaceOverride: ""

# -- Group toggles for subchart enablement.
# @notationType -- (sectionstart) Subchart enablement (Helm tags)
# @raw
# Subchart enablement has two layers, in precedence order:
#
# 1. **Per-chart circuit breaker (`<chart>.enabled`).** Each subchart
#    dependency carries a `condition: <chart>.enabled` in `Chart.yaml`.
#    The corresponding `enabled:` key is left commented-out under each
#    subchart block in `values.yaml`; uncommenting it force-includes
#    (`true`) or force-excludes (`false`) that chart regardless of any
#    tag state. Helm evaluates `condition:` first and only falls through
#    to tags when the path is absent from values, so this is a hard
#    override.
# 2. **Helm tags (the `tags:` block).** When no `<chart>.enabled` is set,
#    enablement is decided by tags. Each dependency in `Chart.yaml`
#    carries the master `default` tag, a *group tag* (e.g.
#    `bundled-backends`), and a *per-chart tag* (e.g. `loki`); a dependency
#    is included if any of its tags evaluates true (OR semantics). To opt
#    one chart out of an otherwise-enabled group, set the group tag false
#    and flip the per-chart tags individually — or use the circuit breaker.
#
# Group ↔ chart mapping:
#
# | Group tag          | Charts                                              |
# | ------------------ | --------------------------------------------------- |
# | `default`          | `pipeline` + `bundled-backends` + `managed-grafana` |
# |                    | groups + `kube-state-metrics` (recommended stack)   |
# | `pipeline`         | `alloy-agent`, `alloy-gateway`                      |
# | `bundled-backends` | `loki`, `thanos`, `alertmanager`                    |
# | `managed-grafana`  | `grafana`, `grafana-operator`                       |
# | `cluster-metrics`  | `kube-state-metrics`, `node-exporter`,              |
# |                    | `metrics-server`                                    |
# | `crds`             | `prometheus-operator-crds`, `grafana-operator-crds` |
# |                    | (in the sibling `materialize-monitoring-crds` chart)|
#
# `default` is the only group on by default and enables the full
# recommended stack. `--set tags.default=false` turns everything off, so
# you can enable a single group (`bundled-backends`, `managed-grafana`,
# `pipeline`, `cluster-metrics`) or individual charts on top. Profile
# preset values files under `profiles/` flip these appropriately.
# (`kube-state-metrics` and `node-exporter` are in `default`, but
# `metrics-server` is not — most clusters already run metrics-server;
# enable it via `tags.cluster-metrics` or `tags.metrics-server` if yours
# doesn't. A cluster that already runs its own node-exporter should turn
# ours off with the `node-exporter.enabled: false` circuit breaker —
# setting `tags.node-exporter: false` does nothing while `tags.default`
# is true, because tags are OR'd.)
tags:
  # Group toggles
  # -- Enable all recommended defaults.
  # You can `--set tags.default=false` to disable all services and explicitly enable others.
  default: true
  # -- Enable both Alloy releases (agent + gateway).
  pipeline: false
  # -- Enable Loki, Thanos, and Alertmanager as a group. (Grafana is in the
  # `managed-grafana` group.)
  bundled-backends: false
  # -- Enable kube-state-metrics and metrics-server as a group.
  cluster-metrics: false
  # Per-chart overrides (OR'd with the group tag above)
  # -- Per-chart override: enable just the Alloy agent. OR'd with `tags.default` / `tags.pipeline`.
  alloy-agent: false
  # -- Per-chart override: enable just the Alloy gateway. OR'd with `tags.default` / `tags.pipeline`.
  alloy-gateway: false
  # -- Per-chart override: enable just Loki. OR'd with `tags.default` / `tags.bundled-backends`.
  loki: false
  # -- Per-chart override: enable just Thanos. OR'd with `tags.default` / `tags.bundled-backends`.
  thanos: false
  # -- Per-chart override: enable just Grafana standalone. OR'd with `tags.default` / `tags.managed-grafana`.
  grafana-standalone: false
  # -- Per-chart override: enable just Grafana operator. OR'd with `tags.default` / `tags.managed-grafana`.
  grafana-operator: false
  # -- Per-chart override: enable just Alertmanager. OR'd with `tags.default` / `tags.bundled-backends`.
  alertmanager: false
  # -- Per-chart override: enable just kube-state-metrics. OR'd with `tags.default` / `tags.cluster-metrics`.
  kube-state-metrics: false
  # -- Per-chart override: enable just node-exporter. OR'd with `tags.default` / `tags.cluster-metrics`.
  node-exporter: false
  # -- Per-chart override: enable just metrics-server. OR'd with `tags.cluster-metrics`.
  metrics-server: false

# -- Scheduling priority shared across the stack's subcharts.
# @notationType -- (sectionstart) Priority classes
# @raw
# Two PriorityClasses, created here and referenced by name from the subchart
# blocks further down. The split is about **what losing a pod costs you**:
#
# | Class                 | Used by                                          | Losing a pod means                                      |
# | --------------------- | ------------------------------------------------ | ------------------------------------------------------- |
# | `monitoring-critical` | `alloy-agent`, `node-exporter`, `alloy-gateway`   | a blind spot with no replica to cover it                |
# | `monitoring-scalable` | `loki`, `thanos`, `grafana`, `alertmanager`, KSM  | reduced capacity a surviving replica or a retry absorbs |
#
# The per-node collectors are singletons *per node*: when the agent or
# node-exporter is evicted from a node, nothing else reports that node, and the
# gap is permanent (there is no backfill). The backends are replicated, buffered,
# or both — Alloy retries writes, so a Loki ingester that is evicted costs
# latency rather than data. The gateway is graded critical despite being a
# Deployment because it is the single egress choke point for every signal.
#
# Both classes set **`preemptionPolicy: Never`**. That is the load-bearing
# choice: priority still decides scheduling-queue order and, more importantly,
# which pod the kubelet evicts first under node pressure — but monitoring will
# never evict a Materialize pod to make room for itself. Monitoring that takes
# down the thing it monitors is worse than monitoring that is late.
#
# Both sit well below `system-cluster-critical` (2000000000) and
# `system-node-critical` (2000001000), so cluster plumbing still outranks us.
#
# **PriorityClasses are cluster-scoped.** Two releases of this chart in one
# cluster will fight over these objects. Set `create: false` on all but one, or
# rename them per release — and if you rename, update the `priorityClassName`
# values in the subchart blocks to match. A `priorityClassName` naming a class
# that does not exist does not degrade: the API server *rejects* the pod. The
# chart warns at render time when it can tell that has happened.
priorityClasses:
  # -- Create the PriorityClass objects. Set false when they are managed
  # elsewhere (another release, or cluster-wide by a platform team); the
  # `priorityClassName` references below still apply, so the classes must
  # already exist.
  create: true
  # -- Priority for components whose loss creates an unrecoverable blind spot —
  # the per-node collectors and the egress gateway.
  critical:
    name: monitoring-critical
    value: 1000000
    preemptionPolicy: Never
    description: >-
      Materialize monitoring components whose loss creates a blind spot with no
      replica to cover it. Never preempts other workloads.
  # -- Priority for replicated or buffered components, where losing a pod costs
  # capacity rather than visibility.
  scalable:
    name: monitoring-scalable
    value: 1000
    preemptionPolicy: Never
    description: >-
      Materialize monitoring backends that are replicated or write-buffered.
      Evicted before the critical tier; never preempts other workloads.

# -- NetworkPolicies for the components whose own charts ship none.
# @notationType -- (sectionstart) Network policies
# @raw
# Most of the stack polices itself, and each component is configured in its own
# block further down:
#
# | Component            | Key                              |
# | -------------------- | -------------------------------- |
# | Alloy agent          | `alloy-agent.networkPolicy`      |
# | Alloy gateway        | `alloy-gateway.networkPolicy`    |
# | Loki                 | `loki.networkPolicy`             |
# | Thanos               | `thanos.global.networkPolicies`  |
# | Grafana              | `grafana.networkPolicy`          |
# | kube-state-metrics   | `kube-state-metrics.networkPolicy` |
# | node-exporter        | `node-exporter.networkPolicy`    |
#
# This block covers the three subcharts that render no `networkpolicy.yaml` at
# all — **Alertmanager**, **grafana-operator**, and **metrics-server** — so the
# stack does not leave three unpoliced pods in an otherwise policed namespace.
# The policies are rendered by this chart, from `templates/networkpolicies.yaml`.
#
# The shape mirrors Loki's, because Loki is the component whose policy set this
# repo has actually operated: allow the release to talk to itself, allow DNS,
# name the destinations that live outside the cluster, deny the rest. Each app
# gets one `Ingress`+`Egress` policy plus a separate DNS policy, for the same
# reason Loki splits them — a rule you have to disable should not take the rest
# of the policy with it.
#
# **A NetworkPolicy is a declaration, not always a control.** Four limits are
# worth knowing before treating any of this as a boundary:
#
#   * It does nothing unless the CNI enforces it. `kindnet` (the default in
#     `kind`, and therefore in the E2E tiers) ignores NetworkPolicy entirely;
#     Cilium and Calico enforce it.
#   * Most CNIs do not apply pod policy to host-networked pods. Nothing in this
#     block is host-networked today, but `node-exporter.networkPolicy` carries
#     the same caveat at greater length, and it is the same caveat.
#   * Rules written with `podSelector` alone stop at the namespace boundary.
#     Under `profiles/split-namespace.values.yaml` the components no longer share
#     a namespace, so those rules match nothing — add `namespaceSelector` entries
#     through the `extra` hooks below, or turn the affected policy off.
#   * Nothing here allows the kubelet's liveness and readiness probes, which
#     arrive from the node's own IP. Cilium and Calico both exempt host-to-pod
#     traffic so probes keep working; a CNI that does not would fail every pod in
#     the namespace, Loki's included, and that is the symptom to recognize.
#
# Egress is where a wrong rule hurts: it fails silently, minutes or hours later,
# somewhere other than the pod you changed. So egress is narrowed only where the
# destination set is knowable from the chart. Where it is not — the API server's
# address, kubelet ports on node IPs, an arbitrary notification provider — the
# rule is broad and says so, and `egress.extra` is where you narrow it against
# facts only your cluster has.
#
# Every component below takes the same eight keys, so they are described once
# here rather than three times over. Each component's own entry then says only
# what is particular to it — which ports, and why that egress is as wide as it is.
#
# | Key | Meaning |
# | --- | --- |
# | `enabled` | Render this policy. Unset follows `networkPolicies.enabled`. |
# | `ingress.ports` | Ports opened to the rest of the component's namespace. A bare number means TCP; `{port, protocol}` spells out anything else. |
# | `ingress.allowExternal` | Drop the source restriction entirely, so the ports above accept connections from any namespace and from outside the cluster. |
# | `ingress.extra` | Raw `NetworkPolicyIngressRule` entries, appended verbatim. The hook for a cross-namespace source. |
# | `egress.inNamespace` | Reach the other pods of this release, on any port. |
# | `egress.dns` | Reach cluster DNS. Rendered as a policy of its own. |
# | `egress.external.ports` / `.cidrs` | Ports and CIDRs outside the cluster. Ports with no CIDRs means those ports *anywhere*. |
# | `egress.extra` | Raw `NetworkPolicyEgressRule` entries, appended verbatim. |
networkPolicies:
  # -- Render the policies in this block. Off skips all three at once; the
  # per-component `enabled` keys below override it either way.
  enabled: true

  # -- Alertmanager: reachable from the release namespace, free to egress to
  # notification providers.
  # @raw
  #
  # Ingress covers `9093` (the API — Loki's ruler, the Alloy gateway's scrape,
  # and Grafana's alerting all arrive here) and `9094`, the gossip port a
  # multi-replica Alertmanager uses to deduplicate notifications between peers.
  #
  # **`9094` is listed twice, TCP and UDP, and both are required.** Alertmanager's
  # mesh is memberlist: it joins and pushes state over TCP and gossips over UDP,
  # and the upstream chart's Service declares `clusterpeer-tcp` and
  # `clusterpeer-udp` on the same port for exactly that reason. A TCP-only rule
  # produces the worst version of this failure — the peers find each other, the
  # cluster forms, and it never converges, so every notification goes out once
  # per replica.
  #
  # Both are listed even at the default `replicaCount: 1`, where nothing dials
  # either: the cost is an open port that no pod connects to, and the alternative
  # is a cluster that silently sends every notification twice the day someone
  # scales it up.
  #
  # Egress is deliberately wide. Alertmanager's job is to reach PagerDuty, Slack,
  # an SMTP relay, or a webhook on someone's internal network, and this chart
  # cannot know which — `443` and the SMTP ports are the defaults because they
  # are what receivers use, not because they are a boundary.
  alertmanager:
    # Render this policy. Unset follows `networkPolicies.enabled`.
    enabled: null
    ingress:
      # Ports opened to the rest of the release namespace. `9094` needs both
      # transports; see the note above for what a TCP-only rule does.
      ports:
        - 9093
        - port: 9094
          protocol: TCP
        - port: 9094
          protocol: UDP
      # Also accept these ports from outside the namespace, and from outside
      # the cluster. Leave false unless something off-cluster posts alerts here.
      allowExternal: false
      # Raw `NetworkPolicyIngressRule` entries, appended verbatim.
      # This is the hook for a cross-namespace source — a Grafana or a Prometheus
      # the release does not own.
      extra: []
    egress:
      # Reach other pods in the same namespace (the Alloy gateway, Grafana).
      inNamespace: true
      # Reach cluster DNS. Off makes every hostname in a receiver fail.
      dns: true
      # Destinations outside the cluster.
      # Notification providers are internet-facing and their addresses are not
      # knowable here. Narrow `cidrs` to an egress proxy where you have one.
      external:
        ports:
          - 443
          - 587
          - 465
        cidrs:
          - "0.0.0.0/0"
      # Raw `NetworkPolicyEgressRule` entries, appended verbatim.
      extra: []

  # -- grafana-operator: metrics scraped by the Alloy gateway, egress to the API
  # server and to whichever Grafana it reconciles.
  # @raw
  #
  # Ingress is only the metrics port. `8888` (pprof) is deliberately left out —
  # it is a debugging surface, and a policy that opens it by default defeats the
  # point of having one.
  #
  # Egress carries `443`/`6443` to `0.0.0.0/0` because the operator is an API
  # client first: it watches `Grafana`, `GrafanaDashboard` and `GrafanaDatasource`
  # resources continuously, and a policy that cannot reach the API server leaves
  # it running, healthy, and reconciling nothing. The API server's address is not
  # something a chart can derive — in-cluster it is a Service ClusterIP that most
  # CNIs evaluate against the real endpoint behind it, which on a managed control
  # plane is outside the cluster network entirely.
  #
  # `connections.grafana.mode: external` puts the Grafana it writes to outside the
  # cluster as well; `443` already covers the usual case, but a self-hosted
  # Grafana on another port needs an `egress.extra` entry. The render warns when
  # it can tell that applies.
  grafana-operator:
    # Render this policy. Unset follows `networkPolicies.enabled`.
    enabled: null
    ingress:
      # Ports opened to the rest of the release namespace. The metrics port
      # only; `8888` (pprof) stays closed.
      ports:
        - 9090
      # Accept the ports above from outside the namespace and cluster.
      allowExternal: false
      # Raw `NetworkPolicyIngressRule` entries, appended verbatim.
      extra: []
    egress:
      # Reach the bundled Grafana, which shares the namespace by default.
      inNamespace: true
      # Reach cluster DNS.
      dns: true
      # Destinations outside the cluster: the API server, and an external
      # Grafana under `connections.grafana.mode: external`.
      external:
        ports:
          - 443
          - 6443
        cidrs:
          - "0.0.0.0/0"
      # Raw `NetworkPolicyEgressRule` entries, appended verbatim.
      extra: []

  # -- Grafana's unified-alerting gossip port, which the `grafana` subchart's own
  # policy cannot open.
  # @raw
  #
  # A supplement, not a replacement: `grafana.networkPolicy` stays on and keeps
  # doing what it does. That template emits exactly one ingress rule, on
  # `service.targetPort`, with no way to add a second port through values — so a
  # multi-replica Grafana running HA alerting has its `9094` gossip closed by the
  # very policy that protects its UI. The failure is quiet in the worst way: the
  # replicas start healthy, never find each other, and every Grafana-managed alert
  # notifies once per replica.
  #
  # This renders the missing rule from the umbrella chart, which can. TCP *and*
  # UDP, because memberlist uses both — TCP for the join and for state pushes, UDP
  # for the gossip itself — and a TCP-only rule produces a cluster that forms and
  # then does not converge.
  #
  # It renders only when `grafana.ini.unified_alerting.ha_peers` is set, which is
  # what makes the replicas dial `9094` in the first place;
  # `profiles/grafana-postgres.values.yaml` is the shipped shape that sets it.
  # Nothing is created for a single-replica Grafana that never gossips.
  grafanaGossip:
    # Render the gossip policy. Unset follows `networkPolicies.enabled`.
    enabled: null
    # Gossip port. Keep in step with `grafana.ini.unified_alerting.ha_peers`
    # and `ha_listen_address`, which name it explicitly.
    port: 9094

  # -- metrics-server: serves the metrics API to the API server, scrapes every
  # kubelet.
  # @raw
  #
  # Both directions are broad, and both for the same reason: the peers are the
  # control plane and the nodes, neither of which has an address this chart can
  # select. `allowExternal` is **true** by default here, unlike the other two —
  # the aggregation layer dials `10250` from the API server, which on a managed
  # control plane is not a pod, not in the cluster's pod CIDR, and not reachable
  # by any `podSelector`. A policy that closed that port would break every `kubectl
  # top` and every HPA in the cluster, not just this release.
  #
  # What the policy still buys is the rest of the surface: no other port on the
  # pod accepts a connection, and egress is limited to the kubelet port plus the
  # API server rather than anywhere at all.
  #
  # Egress `10250` to `0.0.0.0/0` is the kubelet summary API on each node. Node
  # IPs are not selectable either, and narrowing this to the node CIDR is a good
  # idea wherever you know it — `egress.extra` with an `ipBlock`, and drop
  # `10250` from `external.ports`.
  metrics-server:
    # Render this policy. Unset follows `networkPolicies.enabled`.
    enabled: null
    ingress:
      # Ports opened for the metrics API (`--secure-port`, `containerPort`).
      # Keep this in step with `metrics-server.containerPort` if you change it.
      ports:
        - 10250
      # True by default: the API server is the client, and it is not
      # selectable. See the note above before turning this off.
      allowExternal: true
      # Raw `NetworkPolicyIngressRule` entries, appended verbatim.
      extra: []
    egress:
      # Nothing in the release is a peer, but leaving this on costs nothing
      # and keeps the shape uniform with the other two.
      inNamespace: true
      # Reach cluster DNS.
      dns: true
      # The kubelet summary API on every node, and the API server.
      external:
        ports:
          - 10250
          - 443
          - 6443
        cidrs:
          - "0.0.0.0/0"
      # Raw `NetworkPolicyEgressRule` entries, appended verbatim.
      extra: []

# -- cert-manager `Certificate` resources for in-cluster TLS.
# @notationType -- (sectionstart) Certificates
# @raw
# **Off by default, and cert-manager is never a hard dependency.** With
# `enabled: false` this section renders nothing at all, which is what keeps a
# hardening feature from becoming a new prerequisite for an install that does not
# want it.
#
# When it is on, the chart renders one `Certificate` per component with the full
# SAN ladder for that component's Services. It does **not** turn TLS on anywhere:
# issuing a certificate and using it are separate switches, on purpose. Each hop
# moves through the phases in
# [Securing](https://materializeinc.github.io/materialize-monitoring/operating/securing/)
# under its own flag, once that component's renewal behaviour has been proven.
#
# **Gated on values, never on `.Capabilities`.** The obvious implementation is to
# probe the API server for `cert-manager.io/v1`, and it is wrong: the same chart
# would then render differently under `helm template`, the tier-0 Terraform render
# check, and an ArgoCD server-side diff than it does under a live install — which
# is exactly the class of bug the render tests exist to catch. A missing CRD with
# this flag on is a clear apply-time failure with a name in it.
#
# ## Two issuers, because they cannot be one
#
# | | Internal | External |
# | --- | --- | --- |
# | Names | `$svc`, `$svc.$ns`, `$svc.$ns.svc`, `$svc.$ns.svc.$clusterDomain`, `localhost` | the public DNS name the load balancer answers on |
# | Typical issuer | a self-signed root, or a private CA | ACME, or a private CA that signs your public names |
# | Who verifies it | the stack's own components | a browser |
#
# A public ACME issuer cannot sign `loki-distributor.monitoring.svc`, and a
# self-signed root means nothing to a browser, so collapsing these into one key
# would make one of the two unusable. They are separate `issuerRef`s for that
# reason and no other.
#
# **The external certificate is only needed for an L4 load balancer**, which
# passes TCP through and leaves TLS to terminate at the pod — so the material has
# to exist in the cluster. An L7 load balancer terminating with a cloud-managed
# certificate (ACM, Google Certificate Manager, Azure Key Vault) attaches it by
# ARN or resource ID and the key never enters the cluster; for that shape, leave
# `external` unset and pass the annotation through `grafana.service.annotations`.
certificates:
  # -- Render the cert-manager resources in this section.
  enabled: false

  # -- The internal mesh: certificates the stack's components present to each
  # other, carrying in-cluster DNS names.
  # @raw
  #
  # Supply an issuer with `issuerRef`, or let the chart bootstrap a self-signed
  # root with `selfSigned.enabled`. The two are mutually exclusive and the render
  # refuses both at once.
  #
  # **Prefer an issuer scoped to this stack over the cluster's general-purpose
  # one.** None of the receiving components here implement per-client
  # authorization — Loki, Thanos receive and Alloy's receivers can be told to
  # require a certificate signed by a given CA, and none of them can be told that
  # *this* identity may write and *that* one may not. The whole authorization
  # decision is "is this signed by the CA we trust", so the size of the trust
  # domain is the security property. Reusing a `ClusterIssuer` that signs for
  # every workload in the cluster reduces mTLS to "has any certificate", which is
  # a real improvement over "can reach the Service" and much narrower than it
  # sounds.
  internal:
    # -- An existing cert-manager issuer to sign internal certificates.
    # `kind` is `Issuer` or `ClusterIssuer`. Leave `name` empty to use
    # `selfSigned` instead.
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    # -- Have the chart bootstrap a self-signed root and issue from it.
    # @raw
    #
    # Renders the three resources cert-manager needs for a private CA: a
    # `selfSigned` issuer, a CA `Certificate` signed by it, and an issuer backed
    # by that CA which every component certificate then references.
    #
    # Convenient rather than principled — a real deployment usually has a PKI
    # already, and `issuerRef` above is the path for it. This exists so that
    # trying the feature does not start with a cert-manager tutorial, and so the
    # chart-only test tier has a root to issue from.
    #
    # **`kind: ClusterIssuer` is the default deliberately.** A namespaced
    # `Issuer` can only sign for `Certificate` resources in its own namespace,
    # and `profiles/split-namespace.values.yaml` puts components in several — so
    # a namespaced issuer silently signs some components and leaves the rest
    # stuck `Pending`. `Issuer` is correct and cheaper for the single-namespace
    # default; the render warns when it sees the combination that does not work.
    selfSigned:
      enabled: false
      kind: ClusterIssuer
      # -- Subject common name on the generated root.
      commonName: mzmon-internal-ca
      # -- Lifetime of the **root**, not of the leaves. Long, because rotating a
      # root means re-trusting it everywhere at once.
      duration: 43800h
      renewBefore: 2160h
      # -- Secret the generated root's key pair lands in.
      secretName: mzmon-internal-ca
      # -- Namespace that Secret is created in.
      # @raw
      # **cert-manager's cluster resource namespace, not this release's.** A
      # `ClusterIssuer` of kind `ca` reads its Secret from wherever cert-manager
      # was told its cluster resources live — `cert-manager` unless the install
      # overrode `--cluster-resource-namespace` — regardless of where the
      # `Certificate` that produced it was created. Render the CA into the
      # release namespace and the issuer sits `False` with `secret not found`
      # while the Secret it wants is one namespace away.
      #
      # Only read for `kind: ClusterIssuer`. A namespaced `Issuer` has the
      # opposite rule and takes its own namespace; the chart handles both.
      caSecretNamespace: cert-manager

  # -- The browser-facing name, for a Grafana behind an L4 load balancer.
  # @raw
  #
  # Only Grafana takes an external certificate today, because it is the only
  # component in the stack meant for a human and the only one this chart helps
  # expose. Set `dnsNames` to the hostname the load balancer answers on; it must
  # match what users actually type, and what `grafana.ini.server.root_url` says.
  #
  # Leave `issuerRef.name` empty and nothing external is rendered, which is the
  # right answer for an L7 load balancer holding a cloud-managed certificate.
  external:
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    # -- Public DNS names to put on the certificate.
    # @default -- `[]`
    dnsNames: []

  # -- Lifetime of each component certificate, and how long before expiry
  # cert-manager renews it.
  # @raw
  # Short durations are the only mitigation available for the fact that nothing
  # here can check revocation — `otelcol.receiver.otlp` has no CRL support, and
  # in-cluster there is no load balancer to act as a checkpoint, so revoking
  # means re-issuing the CA. They also raise the cost of a component that does
  # not reload its certificate cleanly, which is why no hop turns on until its
  # rotation behaviour is proven. 90 days with 30 days of headroom is a starting
  # point rather than a researched one.
  duration: 2160h
  renewBefore: 720h

  # -- Per-component certificates.
  # @raw
  # One `Certificate` per component rather than one shared across the stack: the
  # SANs differ, the namespaces differ under `split-namespace`, and a single key
  # shared by every workload makes any one compromise total.
  #
  # `services` is the list the SAN ladder is built from, and it is a list rather
  # than a single name because Loki and Thanos are several Services behind one
  # trust boundary. The defaults name exactly the Services this chart's own URLs
  # dial — a render check asserts that every in-cluster destination URL matches a
  # SAN on the corresponding certificate, so a Service added to a destination and
  # forgotten here fails the render rather than the handshake.
  #
  # Each entry takes:
  #
  # | Key | Meaning |
  # | --- | --- |
  # | `enabled` | Render this certificate. Unset follows `certificates.enabled`. |
  # | `services` | Service names the SAN ladder is built for. |
  # | `extraDnsNames` | Appended verbatim — an ingress host, a mesh name. |
  # | `extraIpAddresses` | Appended to the IP SANs, which already carry `127.0.0.1`. |
  # | `secretName` | Where the material lands. Defaults to `<release>-<component>-tls`. |
  components:
    alloy-agent:
      enabled: null
      services:
        - alloy-agent
      extraDnsNames: []
      extraIpAddresses: []
      secretName: ""
    alloy-gateway:
      enabled: null
      # `alloy-gateway-cluster` is the headless Service the replicas gossip
      # over; it is a different name and needs its own SANs.
      services:
        - alloy-gateway
        - alloy-gateway-cluster
      extraDnsNames: []
      extraIpAddresses: []
      secretName: ""
    loki:
      enabled: null
      # The two Loki Services this chart's own URLs dial. Intra-Loki hops
      # (distributor to ingester, the memberlist ring) are a separate trust
      # boundary and are not covered here.
      services:
        - loki-distributor
        - loki-query-frontend
      extraDnsNames: []
      extraIpAddresses: []
      secretName: ""
    thanos:
      enabled: null
      services:
        - thanos-receive
        - thanos-query
      extraDnsNames: []
      extraIpAddresses: []
      secretName: ""
    grafana:
      enabled: null
      services:
        - grafana
      extraDnsNames: []
      extraIpAddresses: []
      secretName: ""
    alertmanager:
      enabled: null
      services:
        - mzmon-alertmanager
      extraDnsNames: []
      extraIpAddresses: []
      secretName: ""

# -- Materialize-specific configuration values.
