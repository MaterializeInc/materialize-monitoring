      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, instance_id)
      (
      max by (namespace, materialize_cloud_organization_name, instance_id) (
        avg_over_time(
          (
            min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
              mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"u.*", namespace!~"__mzmon_excluded_namespaces__"}
            ) < 1e18
          )[15m:1m]
        )
      ) > 600
      )
    for: 5m
    labels:
      severity: critical
      component: clusterd
      audience: workload
    annotations:
      summary: A cluster's collections have averaged over 10m of lag for 15m.
      description: |-
        Queries are still answering, but with data this far behind its inputs,
        and nothing downstream can tell. Check the cluster's replicas for CPU
        or memory pressure and restarts, and the sources upstream of the
        lagging collections.

        Not in the default set, for the reasons cluster-falling-behind gives.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#cluster-stale
