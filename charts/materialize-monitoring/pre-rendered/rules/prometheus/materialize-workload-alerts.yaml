          mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"u.*", namespace!~"__mzmon_excluded_namespaces__"}
        ) >= 1e18
      ) > 0
      )
      * on (namespace, instance_id) group_left(cluster_name)
      (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      and on (namespace, instance_id)
      (
      count by (namespace, instance_id) (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, instance_id)
      (
      count by (namespace, materialize_cloud_organization_name, instance_id) (
        min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
          mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"u.*", namespace!~"__mzmon_excluded_namespaces__"}
        ) >= 1e18
      ) > 0
      )
    for: 1h
    labels:
      severity: warning
      component: clusterd
      audience: workload
    annotations:
      summary: A cluster has had collections with no hydrated replica for 1h.
      description: |-
        Reads of those collections block rather than return stale data. If
        this cluster normally takes this long to hydrate, lengthen the rule's
        `for` with `rules.overrides`. Otherwise check for a crash-looping or
        undersized replica, and for a source or upstream cluster the
        collections are waiting on.

        Counts only collections that no replica has hydrated, so a restart of
        one replica of several does not fire it.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#cluster-hydration-stuck
