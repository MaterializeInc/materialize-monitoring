          max_over_time(mz_metrics_resource_usage{metric="heap", cluster_environmentd_materialize_cloud_cluster_id=~"u.*", namespace!~"__mzmon_excluded_namespaces__"}[15m])
        )
        / on (namespace, pod) group_left ()
