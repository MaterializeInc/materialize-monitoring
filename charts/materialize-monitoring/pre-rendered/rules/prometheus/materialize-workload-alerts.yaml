# from ../_index.yaml.
groups:
- name: freshness
  rules:
  - alert: cluster-falling-behind
    expr: |-
      (
      (
      max by (namespace, materialize_cloud_organization_name, instance_id) (
        avg_over_time(
          (
            min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
              mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"u.*", namespace!~"__mzmon_excluded_namespaces__"}
            ) < 1e18
          )[15m:1m]
        )
      ) > 60
      )
      * on (namespace, instance_id) group_left(cluster_name)
      (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      and on (namespace, instance_id)
      (
      count by (namespace, instance_id) (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, instance_id)
      (
      max by (namespace, materialize_cloud_organization_name, instance_id) (
        avg_over_time(
          (
            min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
              mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"u.*", namespace!~"__mzmon_excluded_namespaces__"}
            ) < 1e18
          )[15m:1m]
        )
      ) > 60
      )
    for: 5m
    labels:
      severity: warning
      component: clusterd
      audience: workload
    annotations:
      summary: A cluster's collections have averaged over 60s of lag for 15m.
      description: |-
        Data is reaching queries later than usual. Check the cluster's replicas
        for CPU or memory pressure first, then the sources upstream of the
        lagging collections: a source that is itself behind makes everything
        downstream of it lag too.

        Lag is measured on each collection's freshest replica, the one serving
        reads, and a collection no replica has hydrated yet is left out, so a
        restart alone does not fire it; cluster-hydration-stuck covers that
        case.

        Not in the default set. Some clusters are behind by design: a
        materialized view on a refresh schedule lags by up to its interval
        between refreshes, and a collection nobody reads may stay frozen for
        months. Across a large fleet those are most of the clusters an
        absolute threshold catches, so select this where freshness matters.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#cluster-falling-behind
  - alert: cluster-stale
    expr: |-
      (
      (
      max by (namespace, materialize_cloud_organization_name, instance_id) (
        avg_over_time(
          (
            min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
