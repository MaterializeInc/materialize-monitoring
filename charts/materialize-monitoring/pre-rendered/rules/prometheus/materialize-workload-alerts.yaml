      max by (namespace, pod, cluster_environmentd_materialize_cloud_cluster_id) (
        label_replace(
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container="clusterd", pod=~".*-cluster-u[0-9]+-replica-.*", namespace=~"__mzmon_environment_namespaces__", namespace!~"__mzmon_excluded_namespaces__"},
          "cluster_environmentd_materialize_cloud_cluster_id", "$1", "pod", ".*-cluster-([a-z0-9]+)-replica-.*"
        )
      )
      and on (namespace, pod)
      max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{container="clusterd"}[10m:1m])) > 0
      )
      )
    for: 1m
    labels:
      severity: warning
      component: clusterd
      audience: workload
    annotations:
      summary: A cluster replica was OOM-killed in the last 10m.
      description: |-
        The replica outgrew its memory and swap and is rehydrating from
        scratch. Size the cluster up, or find what grew in
        `mz_internal.mz_dataflow_arrangement_sizes`. Repeated kills leave the
        cluster unable to finish hydrating.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#cluster-replica-oomkilled
- name: sources
  rules:
  - alert: source-disconnected
    expr: |-
      max by (namespace, materialize_cloud_organization_name, source_id) (
        mz_source_offset_committed{namespace!~"__mzmon_excluded_namespaces__"}
      )
      > max by (namespace, materialize_cloud_organization_name, source_id) (
        mz_source_offset_known{namespace!~"__mzmon_excluded_namespaces__"}
      )
    for: 5m
    labels:
      severity: warning
      component: storage
      audience: workload
    annotations:
      summary: A source has lost sight of its upstream for 5m.
      description: |-
        The source's known offset has fallen below the offset it last
        committed, which happens when the broker or database it reads is
        unreachable. Throughput stops and everything downstream of it starts to
        lag. Read the error with
        `SELECT name, status, error FROM mz_internal.mz_source_statuses WHERE status <> 'running'`.

        Not in the default set yet: neither test install runs a source, so it
        has not been seen to fire. It catches an unreachable upstream, not every
        way a source can stall; the freshness alerts catch the rest.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#source-disconnected
