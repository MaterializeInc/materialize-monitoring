          max by (namespace, pod) (mz_metrics_resource_usage{metric="swap_max"})
        )
      ) > 90
      )
    for: 1m
    labels:
      severity: critical
      component: clusterd
      audience: workload
    annotations:
      summary: A cluster replica's heap has reached 90% of the point where the kernel OOM-kills it.
      description: |-
        At the limit the replica is killed and the cluster rehydrates from
        scratch. Size the cluster up, or find what is holding the memory in
        `mz_internal.mz_dataflow_arrangement_sizes`.

