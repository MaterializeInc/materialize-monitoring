# Generated by `mz-monitoring-build gen-rules` from packages/queries/. DO NOT EDIT.
#
# Tokens of the form __mzmon_*__ are replaced by the chart at install time
# (templates/alerts/prometheusrules.yaml); which rules install is decided there
# from ../_index.yaml.
groups:
- name: mzmon_heartbeat
  rules:
  - record: mzmon:heartbeat
    expr: vector(1)
    labels:
      chart_version: __mzmon_chart_version__
- name: mzmon_heartbeat_kube_state_metrics
  rules:
  - record: mzmon:cluster_created_timestamp_seconds
    expr: min(kube_namespace_created{namespace="kube-system"})
  - record: mzmon:environment_info
    expr: group by (environment_id) (kube_mz_environment_info)
  - record: mzmon:build_info:count
    expr: |-
      count by (version) (
        label_replace(kube_node_info, "version", "$1", "kubelet_version", "(.+)")
      )
    labels:
      component: kubelet
- name: mzmon_heartbeat_materialize
  rules:
  - record: mzmon:build_info:count
    expr: count by (version) (mz_start_time_environmentd)
    labels:
      component: environmentd
- name: mzmon_heartbeat_alloy
  rules:
  - record: mzmon:build_info:count
    expr: count by (version) (alloy_build_info)
    labels:
      component: alloy
- name: mzmon_heartbeat_loki
  rules:
  - record: mzmon:build_info:count
    expr: count by (version) (loki_build_info)
    labels:
      component: loki
- name: mzmon_heartbeat_node_exporter
  rules:
  - record: mzmon:build_info:count
    expr: count by (version) (node_exporter_build_info)
    labels:
      component: node-exporter
- name: mzmon_heartbeat_thanos
  rules:
  - record: mzmon:build_info:count
    expr: count by (version) (thanos_build_info)
    labels:
      component: thanos
  - record: mzmon:rules:count
    expr: |-
      max(
        sum by (pod) (prometheus_rule_group_rules{app="thanos", container="ruler"})
      )
  - record: mzmon:rule_evaluation_failures:rate5m
    expr: |-
      max(
        sum by (pod) (
          rate(prometheus_rule_evaluation_failures_total{app="thanos", container="ruler"}[5m])
        )
      )
