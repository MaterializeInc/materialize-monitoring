# Generated by `mz-monitoring-build gen-rules` from packages/queries/. DO NOT EDIT.
#
# Tokens of the form __mzmon_*__ are replaced by the chart at install time
# (templates/alerts/prometheusrules.yaml); which rules install is decided there
# from ../_index.yaml.
groups:
- name: log_pipeline
  rules:
  - alert: oversized-log-lines
    expr: |-
      sum by (namespace, app, component_id) (
          (
            loki_process_truncated_fields_total{field="line"}
            unless
            loki_process_truncated_fields_total{field="line"} offset 1h
          )
        or
          increase(loki_process_truncated_fields_total{field="line"}[1h])
      ) > 0
    for: 0s
    labels:
      component: alloy
      audience: development
      severity: notice
    annotations:
      summary: Alloy cut log lines too long to store in the last hour. Find the source in Loki with `{level=~".+"} |= "[TRUNCATED:"` and shorten what it logs.
      description: |-
        Each cut line is stored up to the limit, and the rest of it is lost.
        The suffix names the rule that cut it: `[TRUNCATED:SAFETYCLAMP]` for
        the 1MiB clamp on the agent and the gateway, `[TRUNCATED:LINE]` for the
        gateway's line limit, and `[TRUNCATED:FIELDS]` for its fixed backstop.
        A line cut by the clamp no longer parses, so it also arrives without
        its fields.

        Counts cuts to the line only. The gateway cuts structured metadata
        values to a budget by design, so a cut there is routine.

        `component_id` says where the cut happened. `loki.process.pod_logs` and
        `loki.process.node_logs` are an agent's clamp, and
        `loki.process.inputProcessor` is the gateway's clamp or line limit. A
        line cut by both counts twice.

        Alloy creates the counter at its first cut, so a series that is newer
        than the window counts as cut. Without that, the first oversized line
        after every restart would never fire.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#oversized-log-lines
