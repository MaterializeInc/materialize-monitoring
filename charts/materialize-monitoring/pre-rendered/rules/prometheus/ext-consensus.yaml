# Generated by `mz-monitoring-build gen-rules` from packages/queries/. DO NOT EDIT.
#
# Tokens of the form __mzmon_*__ are replaced by the chart at install time
# (templates/alerts/prometheusrules.yaml); which rules install is decided there
# from ../_index.yaml.
groups:
- name: ext_consensus_persist
  rules:
  - record: ext:consensus_up
    expr: |-
      sum by (namespace) (
        rate(mz_persist_external_succeeded_count{op=~"consensus_.*"}[5m])
      ) > bool 0
    labels:
      flavor: persist
  - record: ext:consensus_commit_latency_seconds:p99
    expr: |-
      histogram_quantile(0.99,
        sum by (namespace, le) (
          rate(mz_persist_external_op_latency_bucket{op="consensus_cas"}[5m])
        )
      ) >= 0
    labels:
      flavor: persist
- name: ext_consensus_rds
  rules:
  - record: ext:consensus_xid_used_ratio
    expr: |-
      max by (resource) (
        label_replace(
          last_over_time(aws_rds_maximum_used_transaction_ids_maximum{dimension_DBInstanceIdentifier=~"(?i)__mzmon_consensus_rds__"}[15m]),
          "resource", "$1", "dimension_DBInstanceIdentifier", "(.+)"
        )
      ) / 2147483648
    labels:
      flavor: rds
- name: ext_consensus_cloudsql
  rules:
  - record: ext:consensus_up
    expr: |-
      max by (resource) (
        label_replace(
          last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_up{database_id=~"(?i).+:(__mzmon_consensus_cloudsql__)"}[15m]),
          "resource", "$1", "database_id", ".+:(.+)"
        )
      )
    labels:
      flavor: cloudsql
  - record: ext:consensus_storage_used_ratio
    expr: |-
      max by (resource) (
        label_replace(
          last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_disk_utilization{database_id=~"(?i).+:(__mzmon_consensus_cloudsql__)"}[15m]),
          "resource", "$1", "database_id", ".+:(.+)"
        )
      )
    labels:
      flavor: cloudsql
  - record: ext:consensus_xid_used_ratio
    expr: |-
      max by (resource) (
        label_replace(
          last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_postgresql_transaction_id_utilization{database_id=~"(?i).+:(__mzmon_consensus_cloudsql__)"}[15m]),
          "resource", "$1", "database_id", ".+:(.+)"
        )
      )
    labels:
      flavor: cloudsql
- name: ext_consensus_azure_postgres
  rules:
  - record: ext:consensus_up
    expr: |-
      max by (resource) (
        label_replace(
          last_over_time(azure_microsoft_dbforpostgresql_flexibleservers_is_db_alive_minimum_count{resourceName=~"(?i)__mzmon_consensus_azure_postgres__"}[15m]),
          "resource", "$1", "resourceName", "(.+)"
        )
      )
    labels:
      flavor: azure-postgres
  - record: ext:consensus_storage_used_ratio
    expr: |-
      max by (resource) (
        label_replace(
          last_over_time(azure_microsoft_dbforpostgresql_flexibleservers_storage_percent_maximum_percent{resourceName=~"(?i)__mzmon_consensus_azure_postgres__"}[15m]),
          "resource", "$1", "resourceName", "(.+)"
        )
      ) / 100
    labels:
      flavor: azure-postgres
  - record: ext:consensus_xid_used_ratio
    expr: |-
      max by (resource) (
        label_replace(
          last_over_time(azure_microsoft_dbforpostgresql_flexibleservers_maximum_used_transactionids_maximum_count{resourceName=~"(?i)__mzmon_consensus_azure_postgres__"}[15m]),
          "resource", "$1", "resourceName", "(.+)"
        )
      ) / 2147483648
    labels:
      flavor: azure-postgres
- name: ext_consensus_postgres
  rules:
  - record: ext:consensus_up
    expr: |-
      max by (resource) (
        label_replace(
          pg_up{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__"},
          "resource", "$1", "target", "(.+)"
        )
      )
    labels:
      flavor: postgres
  - record: ext:consensus_connections_used_ratio
    expr: |-
      max by (resource) (
        label_replace(
          sum by (target) (pg_stat_activity_count{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__", backend_type="client backend"})
          / on (target) (
              max by (target) (pg_settings_max_connections{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__"})
            - on (target) max by (target) (pg_settings_superuser_reserved_connections{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__"})
            - on (target) (
                max by (target) (pg_settings_reserved_connections{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__"})
                or 0 * max by (target) (pg_settings_max_connections{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__"})
              )
          ),
          "resource", "$1", "target", "(.+)"
        )
      )
    labels:
      flavor: postgres
  - record: ext:consensus_xid_used_ratio
    expr: |-
      max by (resource) (
        label_replace(
          pg_database_wraparound_age_datfrozenxid_seconds{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__"},
          "resource", "$1", "target", "(.+)"
        )
      ) / 2147483648
    labels:
      flavor: postgres
  - record: ext:consensus_database_bytes
    expr: |-
      max by (resource, database) (
        label_replace(
          label_replace(
            pg_database_size_bytes{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__"},
            "resource", "$1", "target", "(.+)"
          ),
          "database", "$1", "datname", "(.+)"
        )
      )
    labels:
      flavor: postgres
  - record: ext:consensus_version_info
    expr: |-
      max by (resource, version) (
        label_replace(
          label_replace(
            pg_static{job="postgres-exporter", target=~"(?i)__mzmon_consensus_postgres__"},
            "resource", "$1", "target", "(.+)"
          ),
          "version", "$1", "short_version", "(.+)"
        )
      )
    labels:
      flavor: postgres
