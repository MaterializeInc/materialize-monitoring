      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
