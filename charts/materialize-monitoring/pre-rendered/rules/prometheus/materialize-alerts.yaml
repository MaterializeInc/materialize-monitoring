# Generated by `mz-monitoring-build gen-rules` from packages/queries/. DO NOT EDIT.
#
# Tokens of the form __mzmon_*__ are replaced by the chart at install time
# (templates/alerts/prometheusrules.yaml); which rules install is decided there
# from _index.yaml.
groups:
- name: environmentd
  rules:
  - alert: env-uptime-sla
    expr: |-
      (
      (
      avg by (namespace, pod) (
        __mzmon_sql_prefix__can_connect{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      and on (namespace, pod) (
        time() - kube_pod_start_time > 5 * 60
      )
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      avg by (namespace, pod) (
        __mzmon_sql_prefix__can_connect{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      and on (namespace, pod) (
        time() - kube_pod_start_time > 5 * 60
      )
      )
    for: 5m
    labels:
      severity: critical
      component: environmentd
      audience: platform
    annotations:
      summary: environmentd is not accepting basic connections and may be unreachable.
      description: |-
        The environment has been failing basic connection checks for 5m (past the
        grace period after pod start). Check environmentd health and reachability,
        and network path to the environment.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#env-uptime-sla
  - alert: env-uptime-slo
    expr: |-
      (
      (
      avg by (namespace, pod) (
        __mzmon_sql_prefix__can_connect{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      and on (namespace, pod) (
        time() - kube_pod_start_time > 5 * 60
      )
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      avg by (namespace, pod) (
        __mzmon_sql_prefix__can_connect{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      and on (namespace, pod) (
        time() - kube_pod_start_time > 5 * 60
      )
      )
    for: 3m
    labels:
      severity: warning
      component: environmentd
      audience: platform
    annotations:
      summary: environmentd is not accepting basic connections and may be unreachable.
      description: |-
        Early warning of the same condition as env-uptime-sla, at a shorter
        duration. If it persists it will escalate to critical.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#env-uptime-slo
  - alert: envd-simplest-query
    expr: |-
      (
      (
      avg by (namespace) (
        __mzmon_sql_prefix__envd_up{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      avg by (namespace) (
        __mzmon_sql_prefix__envd_up{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      )
    for: 15m
    labels:
      severity: critical
      component: environmentd
      audience: platform
    annotations:
      summary: environmentd is not responding to a SELECT 1 and may be unhealthy.
      description: |-
        The engine is failing the most basic query path. Inspect environmentd
        logs for crashes, stalls, or resource exhaustion.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#envd-simplest-query
  - alert: env-query-views-critical
    expr: |-
      (
      (
      avg by (namespace) (
        __mzmon_sql_prefix__views_query_successful{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      avg by (namespace) (
        __mzmon_sql_prefix__views_query_successful{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      )
    for: 15m
    labels:
      severity: critical
      component: environmentd
      audience: platform
    annotations:
      summary: environmentd is not answering a simple query that reads from object storage.
      description: |-
        A query that touches object storage has been failing for 15m — the engine
        may be unhealthy or unable to reach its storage backend. Check environmentd
        logs and object-storage connectivity.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#env-query-views-critical
  - alert: env-query-views-warning
    expr: |-
      (
      (
      avg by (namespace) (
        __mzmon_sql_prefix__views_query_successful{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      avg by (namespace) (
        __mzmon_sql_prefix__views_query_successful{namespace!~"__mzmon_excluded_namespaces__"}
      ) <= 0.1
      )
    for: 5m
    labels:
      severity: warning
      component: environmentd
      audience: platform
    annotations:
      summary: environmentd is not answering a simple query that reads from object storage.
      description: |-
        Early warning of the same condition as env-query-views-critical, at a
        shorter duration.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#env-query-views-warning
  - alert: clusterd-not-receiving-commands
    expr: |-
      (
      (
      max by (namespace, materialize_cloud_organization_name, cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id, pod) (
        rate(mz_cluster_server_last_command_received{server_name="compute", pod=~".*0", cluster_environmentd_materialize_cloud_cluster_id!~"s.*[1345]", namespace!~"__mzmon_excluded_namespaces__"}[5m:1m])
      ) == 0
      and on (namespace, pod) (
        time() - kube_pod_start_time > 5 * 60
      )
      and on (namespace, pod) (
        max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{container="clusterd"}[6h:1m])) == 0
      )
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      max by (namespace, materialize_cloud_organization_name, cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id, pod) (
        rate(mz_cluster_server_last_command_received{server_name="compute", pod=~".*0", cluster_environmentd_materialize_cloud_cluster_id!~"s.*[1345]", namespace!~"__mzmon_excluded_namespaces__"}[5m:1m])
      ) == 0
      and on (namespace, pod) (
        time() - kube_pod_start_time > 5 * 60
      )
      and on (namespace, pod) (
        max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{container="clusterd"}[6h:1m])) == 0
      )
      )
    for: 2m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A clusterd has not received commands from environmentd for 5m — the replica may be stalled or disconnected.
      description: |-
        environmentd may have failed to connect to the replica, or the replica is
        stuck. Check the environmentd↔clusterd connection and the replica's health.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#clusterd-not-receiving-commands
  - alert: storage-collection-finalization-stuck
    expr: |-
      (
      (
      max by (namespace, materialize_cloud_organization_name) (
        mz_shard_finalization_outstanding{namespace!~"__mzmon_excluded_namespaces__"}
      ) > 0
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      max by (namespace, materialize_cloud_organization_name) (
        mz_shard_finalization_outstanding{namespace!~"__mzmon_excluded_namespaces__"}
      ) > 0
      )
    for: 8h
    labels:
      severity: notice
      component: storage
      audience: platform
    annotations:
      summary: Storage shards have been stuck finalizing for 8h.
      description: |-
        Shard finalization is a background cleanup step; a sustained outstanding
        count suggests it is not making progress. Check storage controller logs.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#storage-collection-finalization-stuck
  - alert: environmentd-down
    expr: |-
      max by (namespace, materialize_cloud_organization_name, pod) (
        up{job=~".*/.*materialize-environmentd", namespace!~"__mzmon_excluded_namespaces__"}
      ) == 0
    for: 5m
    labels:
      severity: critical
      component: environmentd
      audience: platform
    annotations:
      summary: environmentd has not answered its scrape for 5m, so the environment is likely down.
      description: |-
        environmentd is the environment: with it down nothing serves, neither
        SQL nor the console. Check the environmentd pod's status, events and
        logs. A pod that is running but not answering is usually wedged or
        starved of CPU.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#environmentd-down
  - alert: environmentd-not-scraped
    expr: absent(up{job=~".*/.*materialize-environmentd"})
    for: 10m
    labels:
      severity: critical
      component: monitoring
      audience: platform
    annotations:
      summary: No environmentd is being scraped at all.
      description: |-
        Distinct from environmentd being down: the monitoring has lost sight
        of it, so environmentd-down cannot fire. The pod may be gone, or its
        PodMonitor no longer selects it, or the gateway has stopped scraping.
        Check that the environmentd pod exists and that the gateway's
        Materialize scrape targets are healthy.

        Fires only when no environmentd is scraped anywhere. With several
        environments, one of them vanishing is not covered.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#environmentd-not-scraped
  - alert: envd-terminated
    expr: |-
      (
      (
      kube_pod_container_status_last_terminated_exitcode{container="environmentd"} != 166
      and on (namespace, pod)
      max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{container="environmentd"}[10m:1m])) > 0
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      kube_pod_container_status_last_terminated_exitcode{container="environmentd"} != 166
      and on (namespace, pod)
      max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{container="environmentd"}[10m:1m])) > 0
      )
    for: 1m
    labels:
      severity: warning
      component: environmentd
      audience: platform
    annotations:
      summary: An environmentd was unexpectedly terminated — this should not happen.
      description: |-
        Restarts interrupt availability and repeated terminations can indicate a
        deterministic crashing query or an engine bug. Pull the environment's
        environmentd logs around the termination (look for stack-overflow
        signatures) and correlate with recent query activity.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#envd-terminated
  - alert: environmentd-high-cpu
    expr: |-
      (
