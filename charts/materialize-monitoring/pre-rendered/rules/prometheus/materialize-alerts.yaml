          kube_pod_status_phase{namespace=~"__mzmon_environment_namespaces__", phase="Pending", namespace!~"__mzmon_excluded_namespaces__"},
          "pod_base", "$1", "pod", "(.*?)(?:-gen-[0-9]+-[0-9]+|([0-9]+)-[0-9]+)?"
        )
      ) > 0
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      min by (namespace, pod_base) (
        label_replace(
          kube_pod_status_phase{namespace=~"__mzmon_environment_namespaces__", phase="Pending", namespace!~"__mzmon_excluded_namespaces__"},
          "pod_base", "$1", "pod", "(.*?)(?:-gen-[0-9]+-[0-9]+|([0-9]+)-[0-9]+)?"
        )
      ) > 0
      )
    for: 15m
    labels:
      severity: critical
      component: environmentd
      audience: platform
    annotations:
      summary: An environment pod has been Pending for 15m — the cluster may be unhealthy or out of capacity.
      description: |-
        Kubernetes cannot schedule the pod. Usually insufficient node capacity or
        an unsatisfiable scheduling constraint; describe the pod to see the reason.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#environment-pod-pending-critical
  - alert: environment-pod-pending
    expr: |-
      (
      (
      max by (namespace, pod) (
        kube_pod_status_phase{namespace=~"__mzmon_environment_namespaces__", phase="Pending", namespace!~"__mzmon_excluded_namespaces__"}
      ) > 0
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      max by (namespace, pod) (
        kube_pod_status_phase{namespace=~"__mzmon_environment_namespaces__", phase="Pending", namespace!~"__mzmon_excluded_namespaces__"}
      ) > 0
      )
    for: 15m
    labels:
      severity: warning
      component: environmentd
      audience: platform
    annotations:
      summary: An environment pod has been Pending for 15m — the cluster may be unhealthy or out of capacity.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#environment-pod-pending
  - alert: cluster-replica-not-ready
    expr: |-
      (
      (
      (
      (
      max by (namespace, pod, cluster_environmentd_materialize_cloud_cluster_id) (
        label_replace(
          avg_over_time(kube_pod_status_ready{condition="true", pod=~".*-cluster-[a-z0-9]+-replica-.*", namespace=~"__mzmon_environment_namespaces__", namespace!~"__mzmon_excluded_namespaces__"}[10m]),
          "cluster_environmentd_materialize_cloud_cluster_id", "$1", "pod", ".*-cluster-([a-z0-9]+)-replica-.*"
        )
      ) < 0.5
      and on (namespace, pod) (time() - kube_pod_created > 20 * 60)
      )
      * on (namespace, cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
      (
      group by (namespace, cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      and on (namespace, cluster_environmentd_materialize_cloud_cluster_id)
      (
      count by (namespace, cluster_environmentd_materialize_cloud_cluster_id) (
      group by (namespace, cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, cluster_environmentd_materialize_cloud_cluster_id)
      (
      max by (namespace, pod, cluster_environmentd_materialize_cloud_cluster_id) (
        label_replace(
          avg_over_time(kube_pod_status_ready{condition="true", pod=~".*-cluster-[a-z0-9]+-replica-.*", namespace=~"__mzmon_environment_namespaces__", namespace!~"__mzmon_excluded_namespaces__"}[10m]),
          "cluster_environmentd_materialize_cloud_cluster_id", "$1", "pod", ".*-cluster-([a-z0-9]+)-replica-.*"
        )
      ) < 0.5
      and on (namespace, pod) (time() - kube_pod_created > 20 * 60)
      )
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      (
      (
      max by (namespace, pod, cluster_environmentd_materialize_cloud_cluster_id) (
        label_replace(
          avg_over_time(kube_pod_status_ready{condition="true", pod=~".*-cluster-[a-z0-9]+-replica-.*", namespace=~"__mzmon_environment_namespaces__", namespace!~"__mzmon_excluded_namespaces__"}[10m]),
          "cluster_environmentd_materialize_cloud_cluster_id", "$1", "pod", ".*-cluster-([a-z0-9]+)-replica-.*"
        )
      ) < 0.5
      and on (namespace, pod) (time() - kube_pod_created > 20 * 60)
      )
      * on (namespace, cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
      (
      group by (namespace, cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      and on (namespace, cluster_environmentd_materialize_cloud_cluster_id)
      (
      count by (namespace, cluster_environmentd_materialize_cloud_cluster_id) (
      group by (namespace, cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, cluster_environmentd_materialize_cloud_cluster_id)
      (
      max by (namespace, pod, cluster_environmentd_materialize_cloud_cluster_id) (
        label_replace(
          avg_over_time(kube_pod_status_ready{condition="true", pod=~".*-cluster-[a-z0-9]+-replica-.*", namespace=~"__mzmon_environment_namespaces__", namespace!~"__mzmon_excluded_namespaces__"}[10m]),
          "cluster_environmentd_materialize_cloud_cluster_id", "$1", "pod", ".*-cluster-([a-z0-9]+)-replica-.*"
        )
      ) < 0.5
      and on (namespace, pod) (time() - kube_pod_created > 20 * 60)
      )
      )
    for: 5m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A cluster replica's pod has been ready for less than half of the last 10m.
      description: |-
        The replica is Pending, crash-looping, or failing its readiness probe.
        Replicas are replaced routinely during upgrades and resizes, which is
        why this warns rather than pages. Check the pod's events and restart
        history; a replica left with nothing hydrated also raises the cluster's
        hydration alert.

        Ready for less than half the window, rather than not ready now: a
        crash-looping pod passes its probe briefly on every start, and a plain
        not-ready condition would reset `for` each time it did. A pod under 20m
        old is left out, because a new replica waiting on a node is the
        pending-pod alerts' to report, and on a busy fleet it is nearly every
        not-ready window there is.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#cluster-replica-not-ready
  - alert: certificate-not-ready
    expr: |-
      (
      (
      max by (name, namespace, condition) (
        certmanager_certificate_ready_status{condition!="True", namespace!~"__mzmon_excluded_namespaces__"} == 1
      )
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      max by (name, namespace, condition) (
        certmanager_certificate_ready_status{condition!="True", namespace!~"__mzmon_excluded_namespaces__"} == 1
      )
      )
    for: 20m
    labels:
      severity: notice
      component: environmentd
      audience: platform
    annotations:
      summary: A certificate has not become ready in 20m, which can prevent an environment from coming up.
      description: |-
        The environment cannot serve TLS until its certificate is ready. Check the
        certificate's issuer and the cert-manager logs for the blocking condition.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#certificate-not-ready
  - alert: console-query-latency
    expr: |-
      (
      (
      sum by (namespace) (
        histogram_quantile(0.95,
          sum by (le, namespace) (
            rate(mz_time_to_first_row_seconds_bucket{instance_id=~"s2", application_name="web_console", namespace!~"__mzmon_excluded_namespaces__"}[2m])
          )
        )
      ) > 10
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      sum by (namespace) (
        histogram_quantile(0.95,
          sum by (le, namespace) (
            rate(mz_time_to_first_row_seconds_bucket{instance_id=~"s2", application_name="web_console", namespace!~"__mzmon_excluded_namespaces__"}[2m])
          )
        )
      ) > 10
      )
    for: 15m
    labels:
      severity: warning
      component: console
      audience: platform
    annotations:
      summary: Web-console query p95 latency has exceeded 10s for 15m.
      description: |-
        The catalog cluster (s2) is answering console queries slowly. Check the
        catalog cluster's load and health.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#console-query-latency
- name: system_clusters
  rules:
  - alert: system-cluster-falling-behind
    expr: |-
      (
      (
      max by (namespace, materialize_cloud_organization_name, instance_id) (
        avg_over_time(
          (
            min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
              mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"s.*", namespace!~"__mzmon_excluded_namespaces__"}
            ) < 1e18
          )[15m:1m]
        )
      ) > 60
      )
      * on (namespace, instance_id) group_left(cluster_name)
      (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      and on (namespace, instance_id)
      (
      count by (namespace, instance_id) (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, instance_id)
      (
      max by (namespace, materialize_cloud_organization_name, instance_id) (
        avg_over_time(
          (
            min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
              mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"s.*", namespace!~"__mzmon_excluded_namespaces__"}
            ) < 1e18
          )[15m:1m]
        )
      ) > 60
      )
    for: 10m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A system cluster has averaged over 60s of lag for 15m.
      description: |-
        Catalog and introspection answers are behind, so the console and `SHOW`
        commands show a stale picture. Check the cluster's replica for CPU or
        memory pressure, and environmentd's logs for slow catalog transactions.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#system-cluster-falling-behind
  - alert: system-cluster-stale
    expr: |-
      (
      (
      max by (namespace, materialize_cloud_organization_name, instance_id) (
        avg_over_time(
          (
            min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
              mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"s.*", namespace!~"__mzmon_excluded_namespaces__"}
            ) < 1e18
          )[15m:1m]
        )
      ) > 600
      )
      * on (namespace, instance_id) group_left(cluster_name)
      (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      and on (namespace, instance_id)
      (
      count by (namespace, instance_id) (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, instance_id)
      (
      max by (namespace, materialize_cloud_organization_name, instance_id) (
        avg_over_time(
          (
            min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
              mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"s.*", namespace!~"__mzmon_excluded_namespaces__"}
            ) < 1e18
          )[15m:1m]
        )
      ) > 600
      )
    for: 5m
    labels:
      severity: critical
      component: clusterd
      audience: platform
    annotations:
      summary: A system cluster has averaged over 10m of lag for 15m.
      description: |-
        The catalog and introspection data the console reads is far behind.
        Check the replica's CPU and memory, whether it is restarting, and
        environmentd's logs.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#system-cluster-stale
  - alert: system-cluster-hydration-stuck
    expr: |-
      (
      (
      count by (namespace, materialize_cloud_organization_name, instance_id) (
        min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
          mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"s.*", namespace!~"__mzmon_excluded_namespaces__"}
        ) >= 1e18
      ) > 0
      )
      * on (namespace, instance_id) group_left(cluster_name)
      (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      and on (namespace, instance_id)
      (
      count by (namespace, instance_id) (
      group by (namespace, instance_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "instance_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, instance_id)
      (
      count by (namespace, materialize_cloud_organization_name, instance_id) (
        min by (namespace, materialize_cloud_organization_name, instance_id, collection_id) (
          mz_dataflow_wallclock_lag_seconds{quantile="1", instance_id=~"s.*", namespace!~"__mzmon_excluded_namespaces__"}
        ) >= 1e18
      ) > 0
      )
    for: 15m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A system cluster has had collections with no hydrated replica for 15m.
      description: |-
        Reads of those collections block rather than return stale data, so the
        console and introspection queries hang. Check for a crash-looping or
        undersized replica, and the cluster's clusterd logs.

        Counts only collections that no replica has hydrated, so a restart of
        one replica of several does not fire it.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#system-cluster-hydration-stuck
  - alert: system-cluster-memory-near-limit
    expr: |-
      (
      (
      100 * (
        max by (namespace, materialize_cloud_organization_name, cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id, pod) (
          max_over_time(mz_metrics_resource_usage{metric="heap", cluster_environmentd_materialize_cloud_cluster_id=~"s.*", namespace!~"__mzmon_excluded_namespaces__"}[15m])
        )
        / on (namespace, pod) group_left ()
        (
          max by (namespace, pod) (mz_metrics_resource_usage{metric="memory_max"})
          + on (namespace, pod)
          max by (namespace, pod) (mz_metrics_resource_usage{metric="swap_max"})
        )
      ) > 90
      )
      * on (namespace, cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
      (
      group by (namespace, cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      and on (namespace, cluster_environmentd_materialize_cloud_cluster_id)
      (
      count by (namespace, cluster_environmentd_materialize_cloud_cluster_id) (
      group by (namespace, cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
      label_replace(
      label_replace(last_over_time(mz_cluster_info[1h]), "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"),
      "cluster_name", "$1", "name", "(.*)"
      )
      )
      ) == 1
      )
      )
      )
      or on (namespace, cluster_environmentd_materialize_cloud_cluster_id)
      (
      100 * (
        max by (namespace, materialize_cloud_organization_name, cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id, pod) (
          max_over_time(mz_metrics_resource_usage{metric="heap", cluster_environmentd_materialize_cloud_cluster_id=~"s.*", namespace!~"__mzmon_excluded_namespaces__"}[15m])
        )
        / on (namespace, pod) group_left ()
        (
          max by (namespace, pod) (mz_metrics_resource_usage{metric="memory_max"})
          + on (namespace, pod)
          max by (namespace, pod) (mz_metrics_resource_usage{metric="swap_max"})
        )
      ) > 90
      )
    for: 1m
    labels:
      severity: critical
      component: clusterd
      audience: platform
    annotations:
      summary: A system cluster replica's heap has reached 90% of the point where the kernel OOM-kills it.
      description: |-
        At the limit the replica is killed and rehydrates from scratch, taking
        the catalog and introspection with it. Size the system cluster up, or
        find what is holding the memory in `mz_internal.mz_dataflow_arrangement_sizes`.

        Heap is RAM and swap in use, against the replica's cgroup memory plus
        swap limits. With swap enabled, container memory normally reads close to
        its limit, because spilling to swap is the design, so it cannot be used
        here. Measured as the maximum over 15m: heap can climb fast enough that
        an average stays under the threshold until the kill.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#system-cluster-memory-near-limit
- name: release_health
  rules:
  - alert: new-clusterd-restarts
    expr: |-
      label_replace(
        max by (namespace, pod) (kube_pod_container_status_restarts_total{container="clusterd"}) > 0
        and on (namespace, pod) (
          min by (namespace, pod) (time() - kube_pod_created)
        ) < 60 * 60 * 24,
        "pod_base", "$1", "pod", ".*-(cluster-.*)-gen-([0-9]+)-[0-9]+$"
      )
      and on (namespace, pod_base) label_replace(
        max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{container="clusterd"}[12h:1m])) == 0
        and on (namespace, pod) (
          min by (namespace, pod) (time() - kube_pod_created)
        ) > 60 * 60 * 24,
        "pod_base", "$1", "pod", ".*-(cluster-.*)-gen-([0-9]+)-[0-9]+$"
      )
    for: 1m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A previously healthy clusterd is restarting during a release.
      description: |-
        A clusterd generation that had been stable for over a day started
        restarting after a new generation rolled out — a sign the release may be
        unhealthy. Compare the new and previous generations.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#new-clusterd-restarts
- name: external_uptime
  rules:
  - alert: external-env-uptime
    expr: |-
      (
      (
      avg by (namespace) (
        mz_external_envd_up
      ) < 1
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      avg by (namespace) (
        mz_external_envd_up
      ) < 1
      )
    for: 5m
    labels:
      severity: critical
      component: external-uptime
      audience: platform
    annotations:
      summary: environmentd is unreachable from outside the network by the external uptime checker.
      description: |-
        The external prober cannot reach the environment even though internal
        checks may pass — points at ingress, DNS, or network-path problems.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#external-env-uptime
  - alert: external-env-uptime-failed
    expr: |-
      (
      (
      sum by (connection_type, namespace) (
        rate(mz_external_calls_count{status="failed"}[2m])
      ) > 0
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      sum by (connection_type, namespace) (
        rate(mz_external_calls_count{status="failed"}[2m])
      ) > 0
      )
    for: 5m
    labels:
      severity: warning
      component: external-uptime
      audience: platform
    annotations:
      summary: New external connections to environmentd are failing, per the external uptime checker.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#external-env-uptime-failed
  - alert: external-uptime-checker-not-calling
    expr: |-
      sum by (connection_type, namespace) (
        increase(mz_external_calls_count{status="attempted"}[2m])
      ) == 0
    for: 5m
    labels:
      severity: warning
      component: external-uptime
      audience: platform
    annotations:
      summary: The external uptime checker has stopped making calls — the checker itself may be down.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#external-uptime-checker-not-calling
- name: launchdarkly
  rules:
  - alert: launchdarkly-stale-sse
    expr: |-
      (
      (
      sum by (namespace) (
        timestamp(mz_parameter_frontend_last_sse_time_seconds{namespace!~"__mzmon_excluded_namespaces__"})
        - mz_parameter_frontend_last_sse_time_seconds{namespace!~"__mzmon_excluded_namespaces__"}
      ) >= 40 * 60
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      sum by (namespace) (
        timestamp(mz_parameter_frontend_last_sse_time_seconds{namespace!~"__mzmon_excluded_namespaces__"})
        - mz_parameter_frontend_last_sse_time_seconds{namespace!~"__mzmon_excluded_namespaces__"}
      ) >= 40 * 60
      )
    for: 5m
    labels:
      severity: warning
      component: launchdarkly
      audience: platform
    annotations:
      summary: The last LaunchDarkly server-side event is more than 40 minutes old — flag updates may not be reaching environmentd.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#launchdarkly-stale-sse
  - alert: launchdarkly-stale-cse
    expr: |-
      (
      (
      sum by (namespace) (
        timestamp(mz_parameter_frontend_last_cse_time_seconds{namespace!~"__mzmon_excluded_namespaces__"})
        - mz_parameter_frontend_last_cse_time_seconds{namespace!~"__mzmon_excluded_namespaces__"}
      ) >= 40 * 60
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      sum by (namespace) (
        timestamp(mz_parameter_frontend_last_cse_time_seconds{namespace!~"__mzmon_excluded_namespaces__"})
        - mz_parameter_frontend_last_cse_time_seconds{namespace!~"__mzmon_excluded_namespaces__"}
      ) >= 40 * 60
      )
    for: 5m
    labels:
      severity: notice
      component: launchdarkly
      audience: platform
    annotations:
      summary: The last LaunchDarkly client-side event is more than 40 minutes old — client analytics may be stale.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#launchdarkly-stale-cse
