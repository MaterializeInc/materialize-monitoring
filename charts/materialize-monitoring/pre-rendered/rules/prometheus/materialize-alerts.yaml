- name: auth
  rules:
  - alert: auth-errors
    expr: |-
      (
      (
      avg by (namespace, status) (
        rate(mz_auth_request_count{status!~"(2|401).*"}[30m])
      ) > 0.01
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      avg by (namespace, status) (
        rate(mz_auth_request_count{status!~"(2|401).*"}[30m])
      ) > 0.01
      )
    for: 30m
    labels:
      severity: warning
      component: auth
      audience: platform
    annotations:
      summary: An elevated rate of unexpected authentication errors.
      description: |-
        A high rate of non-2xx/401 auth responses usually points at the auth
        provider or the network path to it. Users may see dropped or reset
        connections.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#auth-errors
  - alert: auth-refresh-failures
    expr: |-
      avg(
        rate(mz_auth_request_count{status=~"401.*", path="refresh_token"}[15m])
      ) > 0.002
    for: 15m
    labels:
      severity: warning
      component: auth
      audience: platform
    annotations:
      summary: An elevated rate of failed auth-token refreshes.
      description: |-
        Token refreshes are returning 401s, which can surface to users as sessions
        being dropped. Check the auth provider and the refresh path.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#auth-refresh-failures
- name: console
  rules:
  - alert: console-errors
    expr: |-
      (
        sum by (application_name) (
          rate(mz_adapter_commands{application_name="web_console", status="error", namespace!~"__mzmon_excluded_namespaces__"}[5m])
        )
        / sum by (application_name) (
          rate(mz_adapter_commands{application_name="web_console", namespace!~"__mzmon_excluded_namespaces__"}[5m])
        )
      ) * 100 > 2
      and
      count by (application_name) (
        (
          sum by (application_name, namespace) (
            rate(mz_adapter_commands{application_name="web_console", status="error", namespace!~"__mzmon_excluded_namespaces__"}[5m])
          )
          / sum by (application_name, namespace) (
            rate(mz_adapter_commands{application_name="web_console", namespace!~"__mzmon_excluded_namespaces__"}[5m])
          )
        ) * 100 > 2
      ) > 1
    for: 30m
    labels:
      severity: warning
      component: console
      audience: platform
    annotations:
      summary: The web console has returned an error for 2% or more of commands for 30m, across more than one environment.
      description: |-
        A sustained console error rate above 2% affecting multiple environments
        suggests a platform-wide issue rather than a single environment. Check
        console and environmentd health.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#console-errors
- name: persist
  rules:
  - alert: persist-failures
    expr: |-
      sum by (namespace, metric) (rate(label_replace(mz_persist_blob_failures, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_consensus_failures, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_state_update_state_slow_path, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_lease_timeout_read, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 3
      or sum by (namespace, metric) (rate(label_replace(mz_persist_compaction_noop, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 3
      or sum by (namespace, metric) (rate(label_replace(mz_persist_compaction_failed, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_external_blob_delete_noop_count, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_external_failed_count, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_cmd_failed_count, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_compaction_dropped, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_pushdown_parts_mismatched_stats_count, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_columnar_validation_count{result="invalid"}, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_txn_placeholder_schema_apply, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_columnar_op_count{op="validation", result="invalid"}, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_schema_cache_fetch_state_count, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
      or sum by (namespace, metric) (rate(label_replace(mz_persist_shard_unconsolidated_snapshot, "metric", "$1", "__name__", "(.*)")[1m:15s])) > 1
    for: 15m
    labels:
      severity: notice
      component: persist
      audience: platform
    annotations:
      summary: Failures in Persist that should be rare are happening frequently.
      description: |-
        Persist retries most transient errors, so a sustained failure rate points
        at object storage or metadata-database (consensus) trouble. The `metric`
        label names the specific failure counter.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#persist-failures
- name: environment_health
  rules:
  - alert: clusterd-error-kill
    expr: |-
      (
      (
      max by (namespace, pod) (
        increase(kube_pod_container_status_restarts_total{namespace=~"__mzmon_environment_namespaces__", container="clusterd"}[1h])
      ) > 0
      and max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode) != 137
      and max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode) != 135
      and max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode) != 166
      and max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode) != 167
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      max by (namespace, pod) (
        increase(kube_pod_container_status_restarts_total{namespace=~"__mzmon_environment_namespaces__", container="clusterd"}[1h])
      ) > 0
      and max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode) != 137
      and max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode) != 135
      and max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode) != 166
      and max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode) != 167
      )
    for: 1m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A clusterd was terminated with an unexpected exit code — this should not happen.
      description: |-
        Exit codes 135/137/166/167 are expected (OOM/graceful/sentinel); any other
        code on a restarted clusterd points at a crash. Check the clusterd logs.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#clusterd-error-kill
  - alert: system-cluster-terminated
    expr: |-
      (
      (
      kube_pod_container_status_last_terminated_exitcode{pod=~".*cluster-s.*"} != 166
      and on (namespace, pod)
      max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{pod=~".*cluster-s.*"}[10m:1m])) > 0
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      kube_pod_container_status_last_terminated_exitcode{pod=~".*cluster-s.*"} != 166
      and on (namespace, pod)
      max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{pod=~".*cluster-s.*"}[10m:1m])) > 0
      )
    for: 1m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A system cluster was unexpectedly terminated — this should not happen.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#system-cluster-terminated
  - alert: system-cluster-high-memory
    expr: |-
      (
      (
      100 * (
        sum by (namespace, pod) (
          mz_memory_limiter_memory_usage_bytes{pod=~".*cluster-s.+"}
        )
        / sum by (namespace, pod) (
          mz_memory_limiter_memory_limit_bytes{pod=~".*cluster-s.+"} != 0
        )
      ) > 80
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      100 * (
        sum by (namespace, pod) (
          mz_memory_limiter_memory_usage_bytes{pod=~".*cluster-s.+"}
        )
        / sum by (namespace, pod) (
          mz_memory_limiter_memory_limit_bytes{pod=~".*cluster-s.+"} != 0
        )
      ) > 80
      )
    for: 15m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A system cluster is above 80% memory usage — this should not happen for system clusters.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#system-cluster-high-memory
  - alert: clusterd-expiration-7d
    expr: |-
      (
      (
      mz_dataflow_replica_expiration_remaining_seconds{pod=~".*cluster.+", namespace!~"__mzmon_excluded_namespaces__"} > 0
      < 60 * 60 * 24 * 7
      )
      * on (namespace) group_left(materialize_cloud_organization_name)
      (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      and on (namespace)
      (
      count by (namespace) (
      group by (namespace, materialize_cloud_organization_name) (
      last_over_time(up{job=~".*/.*materialize-(environmentd|clusterd)", materialize_cloud_organization_name!=""}[1h])
      )
      ) == 1
      )
      )
      )
      or on (namespace)
      (
      mz_dataflow_replica_expiration_remaining_seconds{pod=~".*cluster.+", namespace!~"__mzmon_excluded_namespaces__"} > 0
      < 60 * 60 * 24 * 7
      )
    for: 10m
    labels:
      severity: warning
      component: clusterd
      audience: platform
    annotations:
      summary: A cluster replica will expire in less than a week.
      description: |-
        Replica expiration is a bounded lease; let it lapse and the replica is torn
        down. Renew or reconfigure the replica before it expires.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#clusterd-expiration-7d
  - alert: swap-cluster-oom
    expr: |-
      increase(
        (
          max by (namespace, pod) (
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace=~"__mzmon_environment_namespaces__"}
          )
          or on (namespace, pod) count by (namespace, pod) (
            container_last_seen{materialize_cloud_swap="true", namespace!~"__mzmon_excluded_namespaces__"}
          ) * 0
        )[10m:1m]
      ) > 0
      and on (namespace, pod) (
        max_over_time(
          (
            max by (namespace, pod) (container_memory_swap)
            / max by (namespace, pod) (container_spec_memory_swap_limit_bytes)
          )[10m:1m]
        ) < 0.8
      )
      and on (namespace, pod) (
        increase(
          max by (namespace, pod) (kube_pod_container_status_restarts_total)[10m:1m]
        ) > 0
      )
    for: 1m
    labels:
      severity: notice
      component: clusterd
      audience: platform
    annotations:
      summary: A swap-enabled cluster was OOMKilled while below 80% swap usage.
      description: |-
        An OOM kill despite swap headroom suggests a sharp allocation spike rather
        than gradual growth. Check the workload that ran just before the kill.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/stable-metrics/common-alerts/#swap-cluster-oom
  - alert: environment-pod-pending-critical
    expr: |-
      (
      (
      min by (namespace, pod_base) (
