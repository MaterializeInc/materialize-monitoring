# Generated by `mz-monitoring-build gen-rules` from packages/queries/. DO NOT EDIT.
#
# Tokens of the form __mzmon_*__ are replaced by the chart at install time
# (templates/alerts/prometheusrules.yaml); which rules install is decided there
# from ../_index.yaml.
groups:
- name: crdb
  rules:
  - alert: crdb-disk-usage-critical
    expr: |-
      max(
        crdb_dedicated_capacity_used / crdb_dedicated_capacity
      ) * 100 > 90
    for: 1m
    labels:
      severity: critical
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB disk usage is above 90% and likely to impact Materialize.
      description: |-
        Near capacity the cluster can go read-only or nodes can crash. Cancel the
        offending workload first (immediate; scaling takes minutes), then increase
        the cluster's storage capacity.

        Above ~70% used, plan a capacity increase and pace or cancel heavy write
        workloads (large materialized views, sinks, bulk inserts/deletes).
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-disk-usage-critical
  - alert: crdb-disk-usage-high
    expr: |-
      max(
        crdb_dedicated_capacity_used / crdb_dedicated_capacity
      ) * 100 > 70
    for: 5m
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB disk usage is above 70% and may need a capacity increase.
      description: |-
        Pace or cancel heavy write workloads and plan a capacity increase before
        utilization climbs further. Keep steady-state utilization below ~60%.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-disk-usage-high
  - alert: crdb-disk-usage-elevated
    expr: |-
      max(
        crdb_dedicated_capacity_used / crdb_dedicated_capacity
      ) * 100 > 30
    for: 30m
    labels:
      severity: notice
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB disk usage is above 30% and worth keeping an eye on.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-disk-usage-elevated
  - alert: crdb-cpu-usage-critical
    expr: |-
      max(
        avg_over_time(crdb_dedicated_sys_cpu_combined_percent_normalized[30m]) * 100
      ) > 89
    for: 1m
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB CPU usage is critically high (>89%) and likely to impact Materialize.
      description: |-
        Sustained CPU saturation spikes query latency and triggers admission
        control, which throttles lower-priority work. Identify and cancel or pace
        the heaviest workloads; increase node size if saturation persists.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-cpu-usage-critical
  - alert: crdb-cpu-usage-high
    expr: |-
      max(
        avg_over_time(crdb_dedicated_sys_cpu_combined_percent_normalized[2h]) * 100
      ) > 85
    for: 1m
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB CPU usage is above 85% over 2h and may impact Materialize.
      description: |-
        Look for heavy or runaway queries; consider node resizing if the load is
        legitimate and sustained.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-cpu-usage-high
  - alert: crdb-query-latency
    expr: |-
      histogram_quantile(0.95,
        sum by (le, node) (
          rate(crdb_dedicated_sql_service_latency_bucket[20m])
        )
      ) > 250 * 1000 * 1000
    for: 1m
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB p95 SQL service latency has been above 250ms for an extended period.
      description: |-
        Elevated CRDB latency propagates to Materialize catalog and timestamp
        operations. Check for CPU saturation, disk stalls, or LSM read
        amplification as the underlying cause.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-query-latency
  - alert: crdb-lsm-read-amplification-critical
    expr: max(crdb_dedicated_rocksdb_read_amplification) > 150
    for: 15m
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB LSM read amplification is critically high (>150), indicating severe I/O overload.
      description: |-
        Heavy writes (materialized views, Iceberg sinks) are outpacing compaction
        and reads slow dramatically. Cancel or throttle the heavy write workload;
        setting heavy jobs to background QoS lets compaction catch up.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-lsm-read-amplification-critical
  - alert: crdb-lsm-read-amplification-high
    expr: max(crdb_dedicated_rocksdb_read_amplification) > 50
    for: 1h
    labels:
      severity: notice
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB LSM read amplification is elevated (>50), a sign writes may be outpacing compaction.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-lsm-read-amplification-high
  - alert: crdb-ranges-unavailable
    expr: max(crdb_dedicated_ranges_unavailable) > 0
    for: 1h
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB has unavailable ranges, which may indicate node failures or replication issues.
      description: |-
        Unavailable ranges mean some data cannot be served. Check for dead or
        flapping nodes and disk stalls; a persistently impaired node may need
        replacement.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-ranges-unavailable
  - alert: crdb-ranges-underreplicated
    expr: max(crdb_dedicated_ranges_underreplicated) > 0
    for: 1h
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB has under-replicated ranges, which may indicate node failures or replication issues.
      description: |-
        Under-replication reduces fault tolerance. It often self-heals as nodes
        recover; if it persists, investigate node health.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-ranges-underreplicated
  - alert: crdb-sql-memory-rapid-growth
    expr: |-
      max by (node_id) (
        deriv(crdb_dedicated_sql_mem_distsql_current[5m])
      ) > 8 * 1000 * 1000
    for: 5m
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB SQL memory is growing faster than 8 MB/s, a sign of a runaway query heading toward OOM.
      description: |-
        Find and cancel the runaway session before nodes OOM (an OOM cascade can
        crash-loop the cluster). Scale up node size if memory pressure is legitimate.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-sql-memory-rapid-growth
  - alert: crdb-sql-memory-pressure-high
    expr: |-
      max by (node_id) (
        crdb_dedicated_sql_mem_distsql_current
      )
      / on (node_id) max by (node_id) (
        crdb_dedicated_sys_totalmem
      )
      > 0.18
    for: 3m
    labels:
      severity: notice
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB distsql memory exceeds 18% of node RAM, indicating high user-query memory pressure.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-sql-memory-pressure-high
  - alert: crdb-write-intent-accumulation-critical
    expr: max(crdb_dedicated_intentcount) > 10 * 1000 * 1000
    for: 10m
    labels:
      severity: warning
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB write-intent count has exceeded 10M for 10m, indicating large transactions holding locks.
      description: |-
        Large-scope transactions are holding locks too long and causing contention.
        Find and cancel the offending transaction; break bulk operations into
        smaller batches to avoid accumulating intents.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-write-intent-accumulation-critical
  - alert: crdb-write-intent-accumulation-high
    expr: max(crdb_dedicated_intentcount) > 10 * 1000 * 1000
    for: 5m
    labels:
      severity: notice
      component: cockroachdb
      audience: platform
    annotations:
      summary: CockroachDB write-intent count has exceeded 10M, a sign of large transactions accumulating locks.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-write-intent-accumulation-high
  - alert: crdb-backup-missing
    expr: |-
      (
        time() - max(max_over_time(crdb_dedicated_schedules_backup_last_completed_time[60m]))
      ) / 60 > 80
    for: 30m
    labels:
      severity: notice
      component: cockroachdb
      audience: platform
    annotations:
      summary: A CockroachDB backup may be missing — the last completed backup is more than 80 minutes old.
      description: |-
        Confirm the backup schedule exists and its recent jobs are succeeding;
        investigate backup job errors if they are failing.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#crdb-backup-missing
- name: cilium
  rules:
  - alert: cilium-bpf-map-pressure
    expr: |-
      max by (map_name, instance) (
        cilium_bpf_map_pressure
      ) > 0.7
    for: 15m
    labels:
      severity: warning
      component: cilium
      audience: platform
    annotations:
      summary: A Cilium BPF map is filling up, which will cause networking issues if left unaddressed.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#cilium-bpf-map-pressure
  - alert: cilium-drop-rate-elevated
    expr: |-
      max by (direction, reason, pod) (
        rate(cilium_drop_count_total[5m:1m])
      ) > 10
    for: 30m
    labels:
      severity: notice
      component: cilium
      audience: platform
    annotations:
      summary: Cilium is dropping more packets than expected, which can indicate networking issues.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#cilium-drop-rate-elevated
- name: coredns
  rules:
  - alert: coredns-slow-queries
    expr: |-
      histogram_quantile(0.99,
        sum by (le, service) (
          rate(coredns_dns_request_duration_seconds_bucket{zone="."}[5m])
        )
      ) > 0.5
    for: 5m
    labels:
      severity: notice
      component: coredns
      audience: platform
    annotations:
      summary: CoreDNS p99 request latency is above 500ms, which can cause or accompany broader outages.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#coredns-slow-queries
- name: node_unreachable
  rules:
  - alert: node-unreachable
    expr: kube_node_spec_taint{key="node.kubernetes.io/unreachable"}
    for: 10m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: A Kubernetes node is marked unreachable, which may indicate a node or network problem.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#node-unreachable
- name: hpa
  rules:
  - alert: k8s-horizontalpodautoscaler-replicas-critical
    expr: |-
      (
        kube_horizontalpodautoscaler_status_current_replicas
        / kube_horizontalpodautoscaler_spec_max_replicas
      ) > 0.9
    for: 10m
    labels:
      severity: critical
      component: kubernetes
      audience: platform
    annotations:
      summary: A HorizontalPodAutoscaler is above 90% of its maximum replicas — nearly out of headroom to scale.
      description: |-
        Once an HPA is pinned at max replicas it can no longer absorb load. Raise
        the maximum, or address the workload driving the scale-up.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-horizontalpodautoscaler-replicas-critical
  - alert: k8s-horizontalpodautoscaler-replicas-high
    expr: |-
      (
        kube_horizontalpodautoscaler_status_current_replicas
        / kube_horizontalpodautoscaler_spec_max_replicas
      ) > 0.7
    for: 10m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: A HorizontalPodAutoscaler is above 70% of its maximum replicas.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-horizontalpodautoscaler-replicas-high
- name: k8s_disk
  rules:
  - alert: k8s-container-disk-usage
    expr: |-
      100 * (
        max by (node) (container_fs_usage_bytes)
        / max by (node) (container_fs_limit_bytes)
      ) > 70
    for: 5m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: A container filesystem is above 70% usage and should be cleaned up or resized.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-container-disk-usage
  - alert: k8s-node-disk-pressure
    expr: |-
      max by (node) (
        kube_node_status_condition{condition="DiskPressure", status="true"}
      ) > 0
    for: 15m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: A Kubernetes node is under disk pressure, which can cause pods to fail scheduling or be evicted.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-node-disk-pressure
  - alert: k8s-volume-usage
    expr: |-
      100 * (
        max by (namespace, persistentvolumeclaim) (
          kubelet_volume_stats_used_bytes{persistentvolumeclaim!~".*cluster-s2-.*|.*cluster-u.*"}
        )
        / max by (namespace, persistentvolumeclaim) (
          kubelet_volume_stats_capacity_bytes{persistentvolumeclaim!~".*cluster-s2-.*|.*cluster-u.*"}
        )
      ) > 70
    for: 15m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: A Kubernetes persistent volume is above 70% usage and should be cleaned up or resized.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-volume-usage
- name: loki
  rules:
  - alert: alloy-log-drops
    expr: |-
      sum by (namespace, job, reason) (
        rate(loki_write_dropped_entries_total[2m])
      ) > 0
    for: 5m
    labels:
      severity: warning
      component: loki
      audience: platform
    annotations:
      summary: Alloy is dropping log entries — logs are being lost right now.
      description: |-
        Check the drop `reason`: deadline_exceeded / rate_limited / stream_limit_exceeded
        all point at Loki being unable to accept the write volume. Check the
        alloy-gateway autoscaler and Loki ingestion health.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#alloy-log-drops
  - alert: loki-push-err-high
    expr: |-
      100 * (
        sum by (namespace, job) (
          rate(loki_request_duration_seconds_count{status_code=~"4.*|5.*", route=~".*push.*"}[2m])
        )
        / sum by (namespace, job) (
          rate(loki_request_duration_seconds_count{route=~".*push.*"}[2m])
        )
      ) > 10
    for: 5m
    labels:
      severity: warning
      component: loki
      audience: platform
    annotations:
      summary: Loki's push endpoint is returning 10%+ write errors, so logs are being rejected.
      description: |-
        429s indicate ingestion rate limits; 5xx indicate a Loki component failure.
        Inspect distributor logs and pod health.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#loki-push-err-high
  - alert: loki-panics
    expr: |-
      sum by (namespace, job) (
        increase(loki_panic_total[10m])
      ) > 0
    for: 15m
    labels:
      severity: notice
      component: loki
      audience: platform
    annotations:
      summary: A Loki component has panicked.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#loki-panics
  - alert: loki-req-duration-high
    expr: |-
      histogram_quantile(0.95,
        sum by (le, job) (
          rate(loki_request_duration_seconds_bucket{route!~"(?i).*tail.*|/schedulerpb.SchedulerForQuerier/QuerierLoop"}[5m])
        )
      ) > 1
    for: 15m
    labels:
      severity: notice
      component: loki
      audience: platform
    annotations:
      summary: Loki p95 request duration is above 1s (excluding tail/long-poll routes).
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#loki-req-duration-high
  - alert: loki-req-err-high
    expr: |-
      100 * (
        sum by (namespace, job, route) (
          rate(loki_request_duration_seconds_count{status_code=~"5.*"}[2m])
        )
        / sum by (namespace, job, route) (
          rate(loki_request_duration_seconds_count[2m])
        )
      ) > 10
    for: 15m
    labels:
      severity: notice
      component: loki
      audience: platform
    annotations:
      summary: Loki read requests are returning 10%+ 5xx errors.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#loki-req-err-high
  - alert: loki-writer-err-high
    expr: |-
      100 * (
        sum by (namespace, job, route) (
          rate(loki_request_duration_seconds_count{status_code="error"}[2m])
        )
        / sum by (namespace, job, route) (
          rate(loki_request_duration_seconds_count[2m])
        )
      ) > 10
    for: 15m
    labels:
      severity: notice
      component: loki
      audience: platform
    annotations:
      summary: Loki write requests are erroring for 10%+ of requests.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#loki-writer-err-high
- name: metric_collection
  rules:
  - alert: clusterd-metrics-missing
    expr: |-
      max by (pod, namespace) (
        up{job=~".*/.*materialize-(environmentd|clusterd)", cluster_environmentd_materialize_cloud_cluster_id!="s5"}
      ) == 0
    for: 60m
    labels:
      severity: warning
      component: monitoring
      audience: platform
    annotations:
      summary: All metrics for a Materialize pod have been missing for 60m — the scrape target is likely down.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#clusterd-metrics-missing
  - alert: critical-metrics-missing
    expr: |-
      (
        count by (job, app) (
          up{job=~"cadvisor|kube-state-metrics|node-exporter|alloy-agent|alloy-gateway"} == 0
        )
        / count by (job, app) (
          up{job=~"cadvisor|kube-state-metrics|node-exporter|alloy-agent|alloy-gateway"}
        )
      ) * 100 > 30
    for: 30m
    labels:
      severity: warning
      component: monitoring
      audience: platform
    annotations:
      summary: More than 30% of a critical scrape job's targets have been down for 30m.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#critical-metrics-missing
  - alert: logging-collection-down
    expr: (sum(rate(loki_distributor_bytes_received_total[5m])) or vector(0)) == 0
    for: 15m
    labels:
      severity: warning
      component: monitoring
      audience: platform
    annotations:
      summary: Loki has received no logs for 15m — log collection is down.
      description: |-
        Read from the distributor's metrics, and their absence counts as no
        logs. A distributor whose metrics stop arriving fires this while logs
        still flow: the gateway pod that scrapes it may be refusing its
        scrapes, in which case `alloy-gateway-refusing-scrapes` fires too.
        Before treating log collection as down, check that recent lines show
        on the Logs & Events dashboard.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#logging-collection-down
- name: deployment
  rules:
  - alert: k8s-deployment-unavailable-critical
    expr: |-
      group by (deployment, namespace) (
        kube_deployment_status_condition{condition=~"Available", status=~"true", deployment=~"__mzmon_core_workloads__", namespace!~"__mzmon_excluded_namespaces__"} == 0
      )
    for: 10m
    labels:
      severity: critical
      component: kubernetes
      audience: platform
    annotations:
      summary: A core control-plane deployment is unavailable.
      description: |-
        The deployment has no available replicas. Describe it and inspect its
        pods for scheduling, image, or crash-loop problems.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-deployment-unavailable-critical
  - alert: k8s-deployment-unavailable-warning
    expr: |-
      group by (deployment, namespace) (
        kube_deployment_status_condition{condition=~"Available", status=~"true", deployment=~"__mzmon_important_workloads__", namespace!~"__mzmon_excluded_namespaces__"} == 0
      )
    for: 10m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: An important supporting deployment is unavailable.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-deployment-unavailable-warning
  - alert: k8s-deployment-unavailable-notice
    expr: |-
      group by (deployment, namespace) (
        kube_deployment_status_condition{condition=~"Available", status=~"true", deployment=~"__mzmon_nonessential_workloads__", namespace!~"__mzmon_excluded_namespaces__"} == 0
      )
    for: 10m
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: A non-essential deployment is unavailable.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-deployment-unavailable-notice
- name: daemonset
  rules:
  - alert: k8s-daemonset-saturating-cpu
    expr: |-
      (
        1.77 - sum(
          max by (container) (
            kube_pod_container_resource_requests{container=~"__mzmon_daemonset_workloads__", unit="core", resource="cpu"}
          )
        )
      ) < 0.01
    for: 30m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: Daemonsets are requesting nearly all the CPU reserved for them, squeezing clusterd headroom.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-daemonset-saturating-cpu
  - alert: k8s-daemonset-saturating-mem
    expr: |-
      (
        10730942464 - sum(
          max by (container) (
            kube_pod_container_resource_requests{container=~"__mzmon_daemonset_workloads__", unit="byte", resource="memory"}
          )
        )
      ) < 5243000
    for: 30m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: Daemonsets are requesting nearly all the memory reserved for them, squeezing clusterd headroom.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-daemonset-saturating-mem
  - alert: k8s-daemonset-high-cpu
    expr: |-
      (
        1.77 - sum(
          max by (container) (
            kube_pod_container_resource_requests{container=~"__mzmon_daemonset_workloads__", unit="core", resource="cpu"}
          )
        )
      ) < 0.1
    for: 60m
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: Daemonsets are approaching the CPU budget reserved for them.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-daemonset-high-cpu
- name: file_descriptors
  rules:
  - alert: container-file-descriptors-critical
    expr: |-
      100 * (
        sum by (pod, namespace, container) (
          container_file_descriptors{container=~"__mzmon_core_workloads__"}
        )
        / min by (pod, namespace, container) (
          container_ulimits_soft{ulimit="max_open_files"}
        )
      ) > 70
    for: 1m
    labels:
      severity: critical
      component: kubernetes
      audience: platform
    annotations:
      summary: A core container's open file descriptors are above 70% of its limit and it may be killed.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#container-file-descriptors-critical
  - alert: container-file-descriptors-warning
    expr: |-
      100 * (
        sum by (pod, namespace, container) (
          container_file_descriptors{container!~"__mzmon_core_workloads__"}
        )
        / min by (pod, namespace, container) (
          container_ulimits_soft{ulimit="max_open_files"}
        )
      ) > 70
    for: 1m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: A non-core container's open file descriptors are above 70% of its limit and it may be killed.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#container-file-descriptors-warning
  - alert: container-file-descriptors-elevated
    expr: |-
      100 * (
        sum by (pod, namespace, container) (container_file_descriptors)
        / min by (pod, namespace, container) (
          container_ulimits_soft{ulimit="max_open_files"}
        )
      ) > 20
    for: 5m
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: A container's open file descriptors are above 20% of its limit.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#container-file-descriptors-elevated
- name: infra_cpu
  rules:
  - alert: infra-pod-high-cpu-ratio
    expr: |-
      (
        sum by (pod, namespace, container) (
          rate(container_cpu_usage_seconds_total{container!="", pod=~"vector-.*"}[5m])
        )
        / max by (pod, namespace, container) (
          kube_pod_container_resource_requests{resource="cpu", container!="", pod=~"vector-.*"}
        )
      ) > 1
    for: 6h
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: A vector pod has used more than its full CPU request for 6h and may be throttled.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#infra-pod-high-cpu-ratio
  - alert: infra-pods-high-cpu-ratio
    expr: |-
      (
        sum by (pod, namespace, container) (
          rate(container_cpu_usage_seconds_total{namespace!~"__mzmon_operator_namespaces__|__mzmon_environment_namespaces__", container!="", pod!~"parca-agent-.*|vector-.*|cilium-egress-.*"}[5m])
        )
        / max by (pod, namespace, container) (
          kube_pod_container_resource_requests{namespace!~"__mzmon_operator_namespaces__|__mzmon_environment_namespaces__", resource="cpu", container!="", pod!~"parca-agent-.*|vector-.*|cilium-egress-.*"}
        )
      ) > 1
    for: 30m
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: An infra pod is using more than its full CPU request and may be throttled.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#infra-pods-high-cpu-ratio
- name: infra_memory
  rules:
  - alert: infra-memory-high
    expr: |-
      100 * (
        sum by (namespace, pod, container) (
          container_memory_working_set_bytes{container=~"__mzmon_core_workloads__"}
        )
        / sum by (namespace, pod, container) (
          container_spec_memory_limit_bytes{container=~"__mzmon_core_workloads__"} != 0
        )
      ) > 80
    for: 10m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: An important infra container is above 80% memory usage.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#infra-memory-high
  - alert: infra-memory-elevated
    expr: |-
      100 * (
        sum by (namespace, pod, container) (
          container_memory_working_set_bytes{container=~"__mzmon_important_workloads__"}
        )
        / sum by (namespace, pod, container) (
          container_spec_memory_limit_bytes{container=~"__mzmon_important_workloads__"} != 0
        )
      ) > 80
    for: 60m
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: A supporting infra container is above 80% memory usage.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#infra-memory-elevated
  - alert: infra-oomkill-core-systems
    expr: |-
      sum by (container, namespace, pod) (
        kube_pod_container_status_restarts_total{container=~"__mzmon_core_workloads__"}
        - kube_pod_container_status_restarts_total{container=~"__mzmon_core_workloads__"} offset 3h > 1
        and ignoring(reason)
        kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container=~"__mzmon_core_workloads__"}
      ) > 0
    for: 1m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: A core infra container has been OOMKilled.
      description: |-
        The container was killed for exceeding its memory limit within the last
        3h. Repeated OOM kills indicate an under-provisioned limit or a leak.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#infra-oomkill-core-systems
  - alert: infra-oomkill-important-systems
    expr: |-
      sum by (container, namespace, pod) (
        kube_pod_container_status_restarts_total{container=~"__mzmon_important_workloads__"}
        - kube_pod_container_status_restarts_total{container=~"__mzmon_important_workloads__"} offset 3h > 1
        and ignoring(reason)
        kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container=~"__mzmon_important_workloads__"}
      ) > 0
    for: 1m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: An important infra container has been OOMKilled.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#infra-oomkill-important-systems
  - alert: infra-oomkill-nonessential-systems
    expr: |-
      sum by (container, namespace, pod) (
        kube_pod_container_status_restarts_total{container=~"__mzmon_nonessential_workloads__"}
        - kube_pod_container_status_restarts_total{container=~"__mzmon_nonessential_workloads__"} offset 3h > 1
        and ignoring(reason)
        kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container=~"__mzmon_nonessential_workloads__"}
      ) > 0
    for: 1m
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: A non-essential infra container has been OOMKilled.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#infra-oomkill-nonessential-systems
- name: infra_pod_health
  rules:
  - alert: k8s-infra-pod-pending-too-long
    expr: |-
      max by (namespace, pod) (
        kube_pod_status_phase{namespace!~"__mzmon_operator_namespaces__|__mzmon_environment_namespaces__", phase="Pending"}
      ) > 0
    for: 20m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: An infra pod has been Pending for 20m — the cluster may be unhealthy or out of capacity.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#k8s-infra-pod-pending-too-long
  - alert: pod-restart-rate-high
    expr: |-
      avg by (container, namespace) (
        rate(kube_pod_container_status_restarts_total{namespace!~"__mzmon_operator_namespaces__|__mzmon_environment_namespaces__", container!~"__mzmon_nonessential_workloads__"}[10m])
      ) * 100 > 0
    for: 15m
    labels:
      severity: warning
      component: kubernetes
      audience: platform
    annotations:
      summary: An important infra container is restarting frequently, which may indicate a crash loop.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#pod-restart-rate-high
  - alert: pod-restart-rate-high-nonessential
    expr: |-
      avg by (container, namespace) (
        rate(kube_pod_container_status_restarts_total{container=~"__mzmon_nonessential_workloads__"}[10m])
      ) * 100 > 0
    for: 15m
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: A non-essential infra container is restarting frequently, which may indicate a crash loop.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#pod-restart-rate-high-nonessential
  - alert: pods-stuck-in-waiting
    expr: |-
      sum by (namespace, pod) (
        kube_pod_container_status_waiting == 1
        and on (namespace, pod) (time() - kube_pod_start_time > 10 * 60)
      ) > 0
    for: 1m
    labels:
      severity: notice
      component: kubernetes
      audience: platform
    annotations:
      summary: A pod has been stuck in Waiting for over 10m, which can indicate a scheduling or resource problem.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#pods-stuck-in-waiting
- name: egress_gateway
  rules:
  - alert: egress-traffic-missing-metrics
    expr: |-
      absent(
        sum by (node) (
          rate(node_network_receive_bytes_total{device="eth0"}[2m])
        )
        * on (node) group_left (workload) sum by (node, workload) (
          label_replace(container_network_receive_bytes_total{workload="materialize-egress"}, "node", "$1", "instance", "(.+)")
        ) ^ 0
      )
    for: 5m
    labels:
      severity: warning
      component: egress-gateway
      audience: platform
    annotations:
      summary: Egress-gateway node throughput metrics are missing, which may indicate an egress-gateway problem.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#egress-traffic-missing-metrics
  - alert: excessive-egress-traffic
    expr: |-
      sum by (node) (
        rate(node_network_receive_bytes_total{device="eth0"}[2m])
      )
      * on (node) group_left (workload) sum by (node, workload) (
        label_replace(container_network_receive_bytes_total{workload="materialize-egress"}, "node", "$1", "instance", "(.+)")
      ) ^ 0
      > 5.5 * 1000 * 1000 * 1000 / 8
    for: 20m
    labels:
      severity: warning
      component: egress-gateway
      audience: platform
    annotations:
      summary: An egress-gateway node has very high traffic, which may indicate traffic is not routing through the internet gateway.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#excessive-egress-traffic
  - alert: high-egress-traffic
    expr: |-
      sum by (node) (
        rate(node_network_receive_bytes_total{device="eth0"}[2m])
      )
      * on (node) group_left (workload) sum by (node, workload) (
        label_replace(container_network_receive_bytes_total{workload="materialize-egress"}, "node", "$1", "instance", "(.+)")
      ) ^ 0
      > 4.5 * 1000 * 1000 * 1000 / 8
    for: 20m
    labels:
      severity: notice
      component: egress-gateway
      audience: platform
    annotations:
      summary: An egress-gateway node is above 90% of its allowed traffic and may soon exceed capacity.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#high-egress-traffic
  - alert: low-egress-traffic
    expr: |-
      sum by (node) (
        rate(node_network_receive_bytes_total{device="eth0"}[2m])
      )
      * on (node) group_left (workload) sum by (node, workload) (
        label_replace(container_network_receive_bytes_total{workload="materialize-egress"}, "node", "$1", "instance", "(.+)")
      ) ^ 0
      < 100
    for: 2m
    labels:
      severity: warning
      component: egress-gateway
      audience: platform
    annotations:
      summary: An egress-gateway node has unusually low traffic, which may indicate the gateway is unhealthy.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#low-egress-traffic
  - alert: no-egress-traffic
    expr: |-
      (
        min by (node) (
          rate(node_network_receive_bytes_total{device="eth0"}[5m:1m])
          or rate(node_network_transmit_bytes_total{device="eth0"}[5m:1m])
        )
        and on (node) kubelet_node_name{workload="materialize-egress"}
      ) == 0
    for: 5m
    labels:
      severity: warning
      component: egress-gateway
      audience: platform
    annotations:
      summary: An egress-gateway node has had no traffic for 5m, which may indicate external traffic is blocked.
      runbook_url: https://materializeinc.github.io/materialize-monitoring/reference/common-alerts/#no-egress-traffic
