apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: meta-o11y
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-infra-loki
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    Is the log store healthy — and if not, which half of it broke.

    The monitoring stack watching itself: ingest, queries, object storage, and Loki's own logs. Start at Scrape Health and the canary; an empty panel here can mean the instrument is down rather than that nothing happened.
  editable: true
  elements:
    logs-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        app="loki",
                        namespace=~"$lokiNamespace",
                        component=~"$lokiComponent",
                        level=~"$logLevelList"
                      }
                        |~ "(?i)$logSearch"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Loki's own log feed, newest first, for the selected components and levels.**

          Reading Loki's logs out of Loki works right up until the moment it matters most. If the store is broken badly enough, this panel is empty for the same reason everything else is — and that is the point at which `kubectl logs` is the tool, not this dashboard.

          An empty search matches every line rather than none, so the panel is useful before anything is typed.
        id: 1044
        links: []
        title: All Logs
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No lines match the current filters — or Loki cannot serve its own logs
              overrides: []
            options:
              dedupStrategy: exact
              detailsMode: inline
              displayedFields: []
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: false
              wrapLogMessage: true
          version: ''
    logs-rate-by-component:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (component) (
                        rate(
                          {
                            app="loki",
                            namespace=~"$lokiNamespace",
                            component=~"$lokiComponent",
                            level=~"$logLevelList"
                          }
                            |~ "(?i)$logSearch"
                          [$__auto]
                        )
                      )
                    legendFormat: '{{component}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Loki's own log lines per second, split by component.**

          **Nominal:** A steady baseline dominated by the canary, which is expected — it exists to write and read a line on a loop, and says so each time.

          **Unhealthy:** A sharp step up confined to one component. That is a single process in a retry loop, and it is the shape that precedes most of the failures the other tabs measure.
        id: 1040
        links: []
        title: Log Rate by Component
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No lines match the current filters — or Loki cannot serve its own logs
                unit: suffix:logs/s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    logs-warning-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        app="loki",
                        namespace=~"$lokiNamespace",
                        component=~"$lokiComponent",
                        level=~"WARN|WARNING|ERROR|CRITICAL|FATAL"
                      }
                        |~ "(?i)$logSearch"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Warning-and-worse lines from Loki, newest first.**

          **Nominal:** Quiet. Loki is talkative at INFO and reticent above it.

          **Unhealthy:** A steady stream. Read the component: an ingester complaining is a write path problem, a querier complaining is usually a query someone ran, and a compactor complaining is the storage tab's business.

          Independent of the level picker, like the other warning feeds in this repository: this panel answers "is anything wrong", and narrowing the selection to INFO would silently zero it.
        id: 1043
        links: []
        title: Warnings and Errors
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No warnings in this time range
              overrides: []
            options:
              dedupStrategy: exact
              detailsMode: inline
              displayedFields: []
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: false
              wrapLogMessage: true
          version: ''
    logs-warning-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        rate(
                          {
                            app="loki",
                            namespace=~"$lokiNamespace",
                            component=~"$lokiComponent",
                            level=~"WARN|WARNING|ERROR|CRITICAL|FATAL"
                          }
                            |~ "(?i)$logSearch"
                          [1m]
                        )
                      ) * 60
                    legendFormat: warnings/min
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Warning-and-worse lines per minute from Loki, across the selected components.**

          **Nominal:** Zero, or close to it.

          **Unhealthy:** A sustained non-zero rate. The feed below says which component and why.
        id: 1041
        links: []
        title: Warning Rate
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#33BBEE'
                  mode: shades
                min: 0
                noValue: No warnings in this time range
                unit: suffix:logs/min
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    loki-volume-hidden-note:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries: []
            queryOptions: {}
            transformations: []
        description: Why the volume panels are not drawn over long ranges.
        id: 1042
        links: []
        title: Volume (skipped)
        vizConfig:
          group: text
          kind: VizConfig
          spec:
            fieldConfig:
              defaults: {}
              overrides: []
            options:
              code:
                language: plaintext
                showLineNumbers: false
                showMiniMap: false
              content: |-
                **Volume panels are hidden for ranges longer than 7 days.**

                Counting log lines means reading every one of them — Loki indexes labels, not counts — so these panels scan the whole selection rather than an index.

                Shorten the time range, or narrow the namespace and app pickers, and they come back. The feeds below are unaffected at any range: they stop at the first page of matches. For counting over longer spans, [Explore](/explore) is the better tool.
              mode: markdown
          version: ''
    overview-canary-latency:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(
                        0.50,
                        sum by (le) (
                          rate(
                            loki_canary_response_latency_seconds_bucket{
                              app_instance="loki",
                              namespace=~"$lokiNamespace"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                    legendFormat: p50
                    qryType: 1
                    query: |
                      histogram_quantile(
                        0.50,
                        sum by (le) (
                          rate(
                            loki_canary_response_latency_seconds_bucket{
                              app_instance="loki",
                              namespace=~"$lokiNamespace"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(
                        0.99,
                        sum by (le) (
                          rate(
                            loki_canary_response_latency_seconds_bucket{
                              app_instance="loki",
                              namespace=~"$lokiNamespace"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                    legendFormat: p99
                    qryType: 1
                    query: |
                      histogram_quantile(
                        0.99,
                        sum by (le) (
                          rate(
                            loki_canary_response_latency_seconds_bucket{
                              app_instance="loki",
                              namespace=~"$lokiNamespace"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **How long the canary waited between writing a line and reading it back, at the median and the 99th percentile.**

          **Nominal:** Under a second at p99. The canary queries a tiny time range for a single stream, so this is close to the floor of what the read path can do.

          **Unhealthy:** Seconds, or a p99 pulling away from the median. Both point at the read path rather than the write path — a line that arrived slowly would show up as missing first.
        id: 1001
        links: []
        title: Canary Round Trip (p99)
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#0077BB'
                  mode: shades
                min: 0
                noValue: Canary not collected — check Collection Health below
                unit: s
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                fields: /p99/
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    overview-canary-losses:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        rate(
                          loki_canary_missing_entries_total{
                            app_instance="loki",
                            namespace=~"$lokiNamespace"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: missing on write
                    qryType: 1
                    query: |
                      sum(
                        rate(
                          loki_canary_missing_entries_total{
                            app_instance="loki",
                            namespace=~"$lokiNamespace"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        rate(
                          loki_canary_spot_check_missing_entries_total{
                            app_instance="loki",
                            namespace=~"$lokiNamespace"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: missing on re-read
                    qryType: 1
                    query: |
                      sum(
                        rate(
                          loki_canary_spot_check_missing_entries_total{
                            app_instance="loki",
                            namespace=~"$lokiNamespace"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Canary lines that went missing, split by *when* they went missing.**

          **Nominal:** Zero on both series.

          **Unhealthy:** Either series non-zero — and which one is the diagnosis rather than the total.

          **Missing on write** means a line was written and never became readable: the write path, or the store losing it before it was durable.

          **Missing on re-read** means a line was readable once and no longer is. Nothing in the write path can cause that, so it is retention, compaction or object storage — and it is the only signal here that notices data disappearing hours after it landed.

          A burst on the first series at startup is not a finding: entries written before the canary's own scrape target existed are counted missing once and never recovered. Read the sustained level, not the first few minutes after a rollout.

          The re-read series comes from the canary re-querying a sample of its own older lines on a schedule, which is what makes it independent of the ingest-time check rather than a lagging copy of it.
        id: 1009
        links: []
        title: Canary Losses
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No canary losses in this range
                unit: suffix:lines/s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    overview-canary-missing:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        rate(
                          loki_canary_missing_entries_total{
                            app_instance="loki",
                            namespace=~"$lokiNamespace"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: lost/s
                    qryType: 1
                    query: |
                      sum(
                        rate(
                          loki_canary_missing_entries_total{
                            app_instance="loki",
                            namespace=~"$lokiNamespace"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Log lines the canary wrote to Loki and then could not read back, per second.**

          **Nominal:** Zero.

          **Unhealthy:** Anything sustained. This is the one signal here that is end-to-end: the canary writes a line on a loop and reads it back, so a non-zero rate means the write path, the read path or the storage between them is losing data — regardless of what every other panel reports.

          A burst at startup is not a finding: entries written before the canary's own scrape target existed are counted missing once and never recovered. Read the sustained level, not the first few minutes after a rollout.
        id: 1000
        links: []
        title: Canary Lines Lost
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: Canary not collected — check Collection Health below
                unit: suffix:lines/s
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    overview-canary-roundtrip:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(
                        0.50,
                        sum by (le) (
                          rate(
                            loki_canary_response_latency_seconds_bucket{
                              app_instance="loki",
                              namespace=~"$lokiNamespace"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                    legendFormat: p50
                    qryType: 1
                    query: |
                      histogram_quantile(
                        0.50,
                        sum by (le) (
                          rate(
                            loki_canary_response_latency_seconds_bucket{
                              app_instance="loki",
                              namespace=~"$lokiNamespace"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(
                        0.99,
                        sum by (le) (
                          rate(
                            loki_canary_response_latency_seconds_bucket{
                              app_instance="loki",
                              namespace=~"$lokiNamespace"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                    legendFormat: p99
                    qryType: 1
                    query: |
                      histogram_quantile(
                        0.99,
                        sum by (le) (
                          rate(
                            loki_canary_response_latency_seconds_bucket{
                              app_instance="loki",
                              namespace=~"$lokiNamespace"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **How long the canary waited between writing a line and reading it back, at the median and the 99th percentile.**

          **Nominal:** Under a second at p99. The canary queries a tiny time range for a single stream, so this is close to the floor of what the read path can do.

          **Unhealthy:** Seconds, or a p99 pulling away from the median. Both point at the read path rather than the write path — a line that arrived slowly would show up as missing first.
        id: 1008
        links: []
        title: Canary Round Trip
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: Canary not collected
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    overview-error-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        rate(
                          loki_request_duration_seconds_count{
                            app_instance="loki",
                            namespace=~"$lokiNamespace",
                            container=~"$lokiComponent",
                            status_code=~"5.."
                          }
                          [$__rate_interval]
                        )
                      )
                      /
                      sum(
                        rate(
                          loki_request_duration_seconds_count{
                            app_instance="loki",
                            namespace=~"$lokiNamespace",
                            container=~"$lokiComponent"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: 5xx share
                    qryType: 1
                    query: |
                      sum(
                        rate(
                          loki_request_duration_seconds_count{
                            app_instance="loki",
                            namespace=~"$lokiNamespace",
                            container=~"$lokiComponent",
                            status_code=~"5.."
                          }
                          [$__rate_interval]
                        )
                      )
                      /
                      sum(
                        rate(
                          loki_request_duration_seconds_count{
                            app_instance="loki",
                            namespace=~"$lokiNamespace",
                            container=~"$lokiComponent"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The share of Loki API requests returning a 5xx, as a proportion of all requests.**

          **Nominal:** Zero.

          **Unhealthy:** Anything sustained above a fraction of a percent. Read it beside the per-route latency panel: a 5xx rate that tracks a latency spike is saturation, while one that does not is usually storage or configuration.

          `status_code` on this metric carries the string `error` as well as numeric codes, for failures that never reached an HTTP status. Those are counted separately by `infra.loki.health.request_failures`; this one is the HTTP-level view.
        id: 1003
        links: []
        title: 5xx Rate
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No requests in this range
                unit: percentunit
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    overview-failures:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (container) (
                        rate(
                          loki_request_duration_seconds_count{
                            app_instance="loki",
                            namespace=~"$lokiNamespace",
                            container=~"$lokiComponent",
                            status_code="error"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: '{{container}}'
                    qryType: 1
                    query: |
                      sum by (container) (
                        rate(
                          loki_request_duration_seconds_count{
                            app_instance="loki",
                            namespace=~"$lokiNamespace",
                            container=~"$lokiComponent",
                            status_code="error"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Requests per second that failed without producing an HTTP status, split by component.**

          **Nominal:** Zero.

          **Unhealthy:** Non-zero. These are the failures no 5xx panel sees — a connection that died, a gRPC call that never completed — so a store can look clean on status codes and be visibly broken here.
        id: 1007
        links: []
        title: Failures Without a Status Code
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No requests failed without an HTTP status.
                unit: reqps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    overview-ingest:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        rate(
                          loki_distributor_lines_received_total{
                            app_instance="loki",
                            namespace=~"$lokiNamespace"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: lines/s
                    qryType: 1
