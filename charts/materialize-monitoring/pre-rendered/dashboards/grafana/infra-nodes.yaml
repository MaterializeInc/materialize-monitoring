                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (instance) (
                        max by (instance, device) (
                          rate(node_network_receive_bytes_total{instance=~"$nodeList"}[$__rate_interval])
