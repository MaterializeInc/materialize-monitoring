                  type: special
                noValue: 'No metrics: kube-state-metrics is required'
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#AB0003'
                    value: null
                  - color: '#F19903'
                    value: 1
                  - color: '#A2F49B'
                    value: 1
