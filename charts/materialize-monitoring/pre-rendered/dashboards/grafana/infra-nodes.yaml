              kind: Transformation
              spec:
                options: {}
            - group: organize
              kind: Transformation
              spec:
                options:
                  excludeByName:
                    Time: true
                  indexByName:
                    CPU Limit: 3
                    CPU Requested: 2
                    Memory Limit: 5
                    Memory Requested: 4
                    'Value #query-0': 6
                    'Value #query-1': 7
                    'Value #query-2': 8
                    'Value #query-3': 9
                    namespace: 0
                    pod: 1
                  renameByName:
                    'Value #query-0': CPU Requested
                    'Value #query-1': CPU Limit
                    'Value #query-2': Memory Requested
                    'Value #query-3': Memory Limit
        description: |-
          **What each pod on this node reserved and what it is capped at — CPU and memory, requests beside limits.**

          **Nominal:** Requests that reflect what the workload actually uses, and limits set wherever an overrun would hurt the neighbours.

          **Degraded:** A pod whose request is far below its real usage is one the scheduler under-counted, which is how a node ends up oversubscribed while its gauges look calm. A pod with no memory limit can take the node down with it; a pod that crosses one is OOM-killed without warning.

          **Four expressions in one query so they land in one table**, joined on `namespace` and `pod`. Split across four panels an operator has to read four sorted lists and hold the pod names in their head to compare a request against its own limit — which is the only comparison that matters.

          **Instant.** These are current facts, not a series: evaluated over a range each pod would repeat once per scrape and the table would be unreadable. This is the same mistake the version table on `env-upgrade` guards against, from the other direction.

          Limits are absent for any pod that sets none, so those cells are empty rather than zero — which is the honest reading, and the difference worth seeing.
