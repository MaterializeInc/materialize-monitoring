          **Nominal:** Below ~0.8.

          **Degraded:** Near 1.0 the node accepts no further work. Memory is the request that usually runs out first on a Materialize node, because a replica asks for what its dataflows need resident.

          Requests rather than usage, with the same caveat as `infra.nodes.allocation.cpu`: this can be full while the memory graphs look calm.
