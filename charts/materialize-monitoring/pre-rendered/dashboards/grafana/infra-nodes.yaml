                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (node) (kube_node_status_condition{node="$node", condition="Ready", status="true"})
                    qryType: 1
                    query: |
                      max by (node) (kube_node_status_condition{node="$node", condition="Ready", status="true"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Whether Kubernetes considers the node healthy enough to run work.**

          **Nominal:** 1 — the node is Ready.

          **Degraded:** 0 means the control plane has stopped hearing from the kubelet or the kubelet is reporting itself unhealthy. Pods on it will be evicted after the toleration window. **This is an escalation, not a tuning exercise.**

          Ready is the single most load-bearing bit on this dashboard. It is also the one that lags: a node can be failing for minutes before Ready flips, which is why the pressure conditions sit beside it.
