    summary-node-conditions:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (node, condition) (
                        kube_node_status_condition{
                          node="$node",
                          condition=~"MemoryPressure|DiskPressure|PIDPressure|NetworkUnavailable",
                          status="true"
                        }
                      )
                    legendFormat: '{{condition}}'
                    qryType: 1
                    query: |
                      max by (node, condition) (
                        kube_node_status_condition{
                          node="$node",
                          condition=~"MemoryPressure|DiskPressure|PIDPressure|NetworkUnavailable",
                          status="true"
                        }
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The node's pressure and availability conditions — memory, disk, PIDs and network — each 1 when the condition is active.**

          **Nominal:** All zero.

          **Degraded:** Any of these at 1 means the kubelet has started defending itself. `MemoryPressure` and `DiskPressure` cause eviction, `PIDPressure` blocks new processes, `NetworkUnavailable` means the node has no working pod network. All four are infrastructure problems rather than Materialize ones — report the node name and the condition.

          These turn on *before* Ready turns off, which is what makes them worth watching: they are the early warning that the node is in trouble.

          Only the four conditions every cluster reports are selected. A node may publish many more — cloud vendors add their own — and the extras are deliberately not shown, since their vocabulary differs by provider.
