apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-infra-nodes
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    Everything about one node a Materialize deployment runs on.

    What the machine is, how hard it is working, how much of it is already promised to pods, and what it and Kubernetes have said about it.
  editable: true
  elements:
    arp-entries:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance, device) (
                        node_arp_entries{instance=~"$nodeList"}
                      )
                    legendFormat: '{{device}}'
                    qryType: 1
                    query: |
                      max by (instance, device) (
                        node_arp_entries{instance=~"$nodeList"}
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **ARP table entries per interface.**

          Approaching `gc_thresh3` makes the kernel start evicting neighbours, which presents as intermittent unreachability to pods on other nodes. Large flat clusters are how you get there.
        id: 1054
        links: []
        title: ARP Entries
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    conntrack:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (node_nf_conntrack_entries{instance=~"$nodeList"})
                      /
                      max by (instance) (node_nf_conntrack_entries_limit{instance=~"$nodeList"})
                    legendFormat: in use
                    qryType: 1
                    query: |
                      max by (instance) (node_nf_conntrack_entries{instance=~"$nodeList"})
                      /
                      max by (instance) (node_nf_conntrack_entries_limit{instance=~"$nodeList"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Netfilter connection-tracking table occupancy as a fraction of its limit.**

          **Nominal:** Below ~0.7.

          **Degraded:** At 1.0 the kernel drops new connections and logs `nf_conntrack: table full`. This is the classic failure behind a NAT gateway, and it presents as intermittent connection timeouts from a node that looks otherwise healthy.

          Both sides are aggregated before dividing, so the ratio still resolves if the entries and the limit ever arrive under different `job` labels.
        id: 1053
        links: []
        title: Conntrack Table
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#CCBB44'
                  mode: shades
                max: 1
                min: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#CEFFFF'
                    value: null
                  - color: '#F94902'
                    value: 0.8
                  - color: '#E40515'
                    value: 0.8500000000000001
                  - color: '#E40515'
                    value: 0.9000000000000001
                  - color: '#AB0003'
                    value: 0.9500000000000002
                  - color: '#AB0003'
                    value: 1
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cpu-by-mode:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="system", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                    legendFormat: system
                    qryType: 1
                    query: |
                      max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="system", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="user", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                    legendFormat: user
                    qryType: 1
                    query: |
                      max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="user", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                  version: v0
                refId: query-1
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="iowait", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                    legendFormat: iowait
                    qryType: 1
                    query: |
                      max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="iowait", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                  version: v0
                refId: query-2
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (
                        avg by (instance, job) (
                          sum without (mode) (
                            rate(node_cpu_seconds_total{mode=~".*irq", instance=~"$nodeList"}[$__rate_interval])
                          )
                        )
                      )
                    legendFormat: irq
                    qryType: 1
                    query: |
                      max by (instance) (
                        avg by (instance, job) (
                          sum without (mode) (
                            rate(node_cpu_seconds_total{mode=~".*irq", instance=~"$nodeList"}[$__rate_interval])
                          )
                        )
                      )
                  version: v0
                refId: query-3
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="steal", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                    legendFormat: steal
                    qryType: 1
                    query: |
                      max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="steal", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                  version: v0
                refId: query-4
            queryOptions: {}
            transformations: []
        description: |-
          **CPU time by mode — system, user, iowait, and the interrupt modes — averaged across cores.**

          The first split to make when `node.cpu.utilization` is high. `iowait` points at storage rather than compute; a large `system` share on a network-heavy node often means softirq work, which `node.debug.softnet.*` quantifies.
        id: 1026
        links: []
        title: CPU by Mode
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cpu-context-switches:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (
                        rate(node_context_switches_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                    legendFormat: context switches
                    qryType: 1
                    query: |
                      max by (instance) (
                        rate(node_context_switches_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (
                        rate(node_intr_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                    legendFormat: interrupts
                    qryType: 1
                    query: |
                      max by (instance) (
                        rate(node_intr_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Context switches and hardware interrupts per second.**

          A climb with no matching rise in throughput suggests thrashing between runnable threads or an interrupt storm.
        id: 1029
        links: []
        title: Context Switches and Interrupts
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                unit: cps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cpu-load:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (node_load1{instance=~"$nodeList"})
                      /
                      max by (instance) (
                        count by (instance, job) (
                          count by (instance, job, cpu) (node_cpu_seconds_total{instance=~"$nodeList"})
                        )
                      )
                    legendFormat: load / cores
                    qryType: 1
                    query: |
                      max by (instance) (node_load1{instance=~"$nodeList"})
                      /
                      max by (instance) (
                        count by (instance, job) (
                          count by (instance, job, cpu) (node_cpu_seconds_total{instance=~"$nodeList"})
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **One-minute load average divided by the node's core count, so it is comparable across instance sizes.**

          **Nominal:** Below 1.0 — runnable work fits in the cores available.

          **Degraded:** Above 1.0 means more threads are runnable than there are cores to run them. On a database doing deliberate I/O this is not automatically bad; read it with `node.cpu.pressure`, which distinguishes "busy" from "waiting".
        id: 1024
        links: []
        title: Load Average (normalized)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                min: 0
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cpu-per-core:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      1 - max by (instance, cpu) (
                        rate(node_cpu_seconds_total{mode="idle", instance=~"$nodeList"}[$__rate_interval])
                      )
                    legendFormat: core {{cpu}}
                    qryType: 1
                    query: |
                      1 - max by (instance, cpu) (
                        rate(node_cpu_seconds_total{mode="idle", instance=~"$nodeList"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Non-idle CPU time per core, so a single saturated core is visible.**

          `node.cpu.utilization` averages across cores and therefore hides this. A workload pinned to one core, or a NIC whose interrupts all land on CPU 0, shows up here and nowhere else.
        id: 1027
        links: []
        title: CPU per Core
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                max: 1
                min: 0
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cpu-pressure:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance) (
                        rate(node_pressure_cpu_waiting_seconds_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                    legendFormat: stalled
                    qryType: 1
                    query: |
                      max by (instance) (
                        rate(node_pressure_cpu_waiting_seconds_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **PSI: the fraction of wall time at least one task was stalled waiting for CPU.**

          **Nominal:** Near zero.

          **Degraded:** Rising means runnable threads are queueing. For a latency-sensitive dataflow engine this is the signal that shows up as peek latency before it shows up as CPU utilization.

          Needs Linux 4.20+. Where `/proc/pressure` is absent the collector reports `node_scrape_collector_success{collector="pressure"} == 0` rather than returning a misleading zero.
        id: 1025
        links: []
        title: CPU Pressure
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                max: 1
                min: 0
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cpu-runqueue:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance, cpu) (
                        rate(node_schedstat_waiting_seconds_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                    legendFormat: core {{cpu}}
                    qryType: 1
                    query: |
                      max by (instance, cpu) (
                        rate(node_schedstat_waiting_seconds_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Time tasks spent runnable but not running, per core, from `/proc/schedstat`.**

          The direct measure of scheduling contention — threads were ready and the CPU was not available. More actionable than load average for a latency-sensitive engine, because it is measured rather than smoothed.

          Two kernel gates, and the second fails quietly: `CONFIG_SCHEDSTATS` must be built in, and since Linux 4.6 the counters are additionally off at runtime unless `kernel.sched_schedstats=1`. A missing file shows up in `node.collector.success`; the sysctl being off does not — the file just reads as zeros.
        id: 1028
        links: []
        title: Run Queue Wait
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cpu-utilization:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      1 - max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="idle", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                    legendFormat: busy
                    qryType: 1
                    query: |
                      1 - max by (instance) (
                        avg by (instance, job) (
                          rate(node_cpu_seconds_total{mode="idle", instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Fraction of CPU time the node spent doing anything other than idling, averaged across its cores.**

          **Nominal:** Well below 1.0, with headroom for the bursty half of the workload.

          **Degraded:** Sustained above ~0.8 means the node has no burst capacity left; check `node.cpu.pressure` to see whether threads are actually waiting.

          The average across cores, not the busiest core — a single saturated core on a large node is invisible here and shows up in `node.debug.cpu.by_mode` and `node.debug.schedstat.waiting`.
        id: 1023
        links: []
        title: CPU Utilization
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                max: 1
                min: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#CEFFFF'
                    value: null
                  - color: '#F94902'
                    value: 0.8
                  - color: '#E40515'
                    value: 0.8500000000000001
                  - color: '#E40515'
                    value: 0.9000000000000001
                  - color: '#AB0003'
                    value: 0.9500000000000002
                  - color: '#AB0003'
                    value: 1
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disk-iops:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance, device) (
                        rate(node_disk_reads_completed_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                    legendFormat: read {{device}}
                    qryType: 1
                    query: |
                      max by (instance, device) (
                        rate(node_disk_reads_completed_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance, device) (
                        rate(node_disk_writes_completed_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                    legendFormat: write {{device}}
                    qryType: 1
                    query: |
                      max by (instance, device) (
                        rate(node_disk_writes_completed_total{instance=~"$nodeList"}[$__rate_interval])
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Completed reads and writes per second, per device.**

          Pair with `node.debug.disk.throughput`: high IOPS at low throughput is a small-random-I/O pattern, which is what exhausts cloud volume IOPS budgets long before it exhausts bandwidth.
        id: 1058
        links: []
        title: Disk IOPS
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                unit: cps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disk-latency:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance, device) (
                        (rate(node_disk_reads_completed_total{instance=~"$nodeList"}[$__rate_interval]) > bool 0)
                        *
                        (
                          rate(node_disk_read_time_seconds_total{instance=~"$nodeList"}[$__rate_interval])
                          / rate(node_disk_reads_completed_total{instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                    legendFormat: read {{device}}
                    qryType: 1
                    query: |
                      max by (instance, device) (
                        (rate(node_disk_reads_completed_total{instance=~"$nodeList"}[$__rate_interval]) > bool 0)
                        *
                        (
                          rate(node_disk_read_time_seconds_total{instance=~"$nodeList"}[$__rate_interval])
                          / rate(node_disk_reads_completed_total{instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (instance, device) (
                        (rate(node_disk_writes_completed_total{instance=~"$nodeList"}[$__rate_interval]) > bool 0)
                        *
                        (
                          rate(node_disk_write_time_seconds_total{instance=~"$nodeList"}[$__rate_interval])
                          / rate(node_disk_writes_completed_total{instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                    legendFormat: write {{device}}
                    qryType: 1
                    query: |
                      max by (instance, device) (
                        (rate(node_disk_writes_completed_total{instance=~"$nodeList"}[$__rate_interval]) > bool 0)
                        *
                        (
                          rate(node_disk_write_time_seconds_total{instance=~"$nodeList"}[$__rate_interval])
                          / rate(node_disk_writes_completed_total{instance=~"$nodeList"}[$__rate_interval])
                        )
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Average time per completed read and per completed write, per device.**

          Time divided by completions, guarded with `> bool 0` so an idle device reports 0 rather than dividing by zero and dropping out of the panel. This is device-level service time, not the latency any one process saw.
        id: 1060
        links: []
        title: Disk Latency
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
