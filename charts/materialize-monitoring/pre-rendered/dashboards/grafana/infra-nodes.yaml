                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (namespace, pod) (
                        kube_pod_status_ready{condition="true"}
                        and on (namespace, pod) kube_pod_info{node="$node"}
                      ) == 0
                      unless on (namespace, pod) (kube_pod_status_phase{phase="Succeeded"} == 1)
                    format: table
                    instant: true
                    qryType: 2
                    query: |
                      max by (namespace, pod) (
                        kube_pod_status_ready{condition="true"}
                        and on (namespace, pod) kube_pod_info{node="$node"}
                      ) == 0
                      unless on (namespace, pod) (kube_pod_status_phase{phase="Succeeded"} == 1)
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations:
            - group: organize
              kind: Transformation
              spec:
                options:
                  excludeByName:
                    Time: true
                    Value: true
                    __name__: true
                  indexByName:
                    namespace: 0
                    pod: 1
        description: |-
          **Pods on this node that are not reporting Ready.**

          **Nominal:** Empty.

          **Degraded:** A pod that is Running but not Ready is failing its readiness probe — it is up and refusing traffic. Several at once on one node, when the same workload is healthy elsewhere, is the signature of a node problem rather than an application one, and is worth escalating with the node name.

          **Completed Jobs are excluded.** A `Succeeded` pod is never Ready, because it has finished and exited — so without the `unless` every completed Job on the node sits here permanently, and a panel whose whole purpose is to be empty when things are well is never empty. `Failed` pods are kept: not ready is the correct reading there.
