          **Nominal:** Comfortably above 0.2.

          **Degraded:** Approaching zero means the next allocation reclaims or swaps. Read with `node.memory.pressure` — pressure is what says the reclaim is hurting.

          `MemAvailable`, not `MemFree`: free memory is expected to be near zero on a healthy Linux box, because the page cache uses what is not otherwise claimed.
