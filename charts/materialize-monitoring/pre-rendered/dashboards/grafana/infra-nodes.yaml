                    qryType: 1
                    query: |
                      max by (node) (kube_node_created{node="$node"}) * 1000
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Wall-clock time the node joined the cluster.**

          **Nominal:** Old enough that the workload on it has settled.

          **Degraded:** A node much younger than its siblings was replaced recently — by an autoscaler, a node-pool upgrade, or a failure. If pods are unhappy and the node is minutes old, the replacement is the more likely story.

          Distinct from the machine's own uptime (`node.uptime`, from node-exporter): this is when Kubernetes first saw it. The two disagree when a node is rebooted without being removed from the cluster.

          **Scaled to milliseconds.** kube-state-metrics reports a Unix timestamp in *seconds*, and every Grafana date unit reads milliseconds — handed the raw value, a panel renders a date in January 1970 rather than an obviously wrong number, which is the kind of wrong that gets believed.
