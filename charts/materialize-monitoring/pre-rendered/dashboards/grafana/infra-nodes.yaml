                    result:
                      color: '#A2F49B'
                      index: 1
                      text: Healthy
                    to: 2147483647
                  type: range
                - options:
                    from: 1
                    result:
                      color: '#F19903'
                      index: 2
                      text: Degraded
                    to: 1
                  type: range
                - options:
                    from: -2147483647
                    result:
                      color: '#AB0003'
                      index: 3
                      text: Unhealthy
                    to: 1
                  type: range
                - options:
