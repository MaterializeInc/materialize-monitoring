                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (namespace, pod) (
                        sum by (namespace, pod, instance) (
                          kube_pod_container_resource_limits{node="$node", resource="memory"}
                        )
                      )
                    format: table
                    instant: true
                    legendFormat: Memory Limit
                    qryType: 2
                    query: |
                      max by (namespace, pod) (
                        sum by (namespace, pod, instance) (
                          kube_pod_container_resource_limits{node="$node", resource="memory"}
                        )
                      )
                  version: v0
                refId: query-3
            queryOptions: {}
            transformations:
