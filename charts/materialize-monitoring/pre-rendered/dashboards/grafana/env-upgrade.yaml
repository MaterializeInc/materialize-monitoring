                    legendFormat: '{{step}} / {{outcome}}'
                    qryType: 1
                    query: |
                      sum by (step, outcome) (
                        rate(
                          orchestratord_reconciliation_steps_total{
                            namespace=~"$operatorNamespace", outcome=~"failed|abandoned"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Steps that did not complete, by step and by how they ended — the panel that turns "reconciliation is failing" into "reconciliation is failing *here*".**

          **Nominal:** Nothing.

          **Unhealthy:** Any sustained rate names the phase to investigate. Pair it with the matching event on _Events -> Operator Health_, which carries the cause; this panel says where and that one says why.

          **`abandoned` is not by itself a failure.** A step records it when it did not reach a conclusion, which covers an error propagating out of it *and* a pass cancelled by a leadership handoff or a shutdown — a `Drop` cannot tell those apart. So a burst of `abandoned` around an operator restart is expected. Alert on _Operator Status -> Failed Passes (Select Time Range)_, which is recorded from the reconciler's actual result and which a cancelled pass never reaches, and read this to locate the step.

          An `abandoned` step alongside a `failed` pass is the useful pairing: the pass says it errored, and the step says where it was when it did.
