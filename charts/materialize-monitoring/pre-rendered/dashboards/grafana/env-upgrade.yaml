            queryOptions: {}
            transformations: []
        description: |-
          **What reconciliation passes concluded, by outcome. The shape of a rollout: `waiting` climbs while the new generation's pods come up, then gives way to `applied` when they are ready.**

          **Nominal:** `applied` with `waiting` alongside it during a change. Both are success.

          **Degraded:** `waiting` that stays high long after a change should have settled. The operator is still trying and the thing it is waiting for has not happened — usually pods that will not become ready.

          **Unhealthy:** A sustained `failed` rate. The pass is erroring rather than waiting, and _Steps -> Step Failures and Abandonments_ localizes which phase.

          The five outcomes are the operator's own vocabulary: `applied` reached the desired state or found it already there; `waiting` made progress and asked to run again; `skipped` had nothing to act on, because what it manages is disabled or absent from the spec; `failed` returned an error; `abandoned` did not reach a conclusion.

          `abandoned` is rare at the pass level and is not a failure signal — it covers a pass cancelled by a leadership handoff or a shutdown as well as one that errored out.

          `apply` and `cleanup` passes are summed together here. Cleanup runs when a resource is being deleted, so it is rare, and splitting it out would double every series to distinguish a case that is usually absent.
