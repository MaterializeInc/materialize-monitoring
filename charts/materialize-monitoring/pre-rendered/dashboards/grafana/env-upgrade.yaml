                    legendFormat: '{{step}}'
                    qryType: 1
                    query: |
                      histogram_quantile(0.99, sum by (le, step) (
                        rate(
                          orchestratord_reconciliation_step_duration_seconds_bucket{
                            namespace=~"$operatorNamespace"
                          }
                          [$__rate_interval]
                        )
                      ))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The slowest phase of a reconciliation pass, at the 99th percentile per step — where the time in a pass actually goes.**

          **Nominal:** Most steps in the low tens of milliseconds. The two that touch a generation's resources — `global_resources` and `generation_resources` — are the expensive ones, in the hundreds.

          **Unhealthy:** A step that leaves its usual band. Because each step is a group of Kubernetes API calls, a step that slows down names the resource kind whose writes are being held up.

          Same coarse buckets as the whole-pass histogram, and the same reading: an order of magnitude rather than a measurement. Steps and passes share one bucket set precisely so a step's latency reads against the pass it belongs to.
