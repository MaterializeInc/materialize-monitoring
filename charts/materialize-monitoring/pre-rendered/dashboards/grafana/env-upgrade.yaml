          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      group by (generation, mz_version) (
                        label_replace(
                          max_over_time(
                            mz_compute_cluster_status{
                              materialize_cloud_organization_name=~"$environmentNameList", pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+"
                            }
                            [$__range]
                          ),
                          "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
