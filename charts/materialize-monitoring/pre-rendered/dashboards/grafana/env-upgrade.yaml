          **Nominal:** A low steady rate, rising while something is changing. The controllers re-run on every watch event and on a backoff, so an idle operator still ticks over.

          **Unhealthy:** Flat at zero while work is outstanding. Check _Operator Status -> Reconciling Replicas_ first: an operator that lost the lease stops reconciling and this is what that looks like.

