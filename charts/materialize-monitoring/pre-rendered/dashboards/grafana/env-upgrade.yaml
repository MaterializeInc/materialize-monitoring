                  - mz_version
            - group: merge
              kind: Transformation
              spec:
                options: {}
            - group: organize
              kind: Transformation
              spec:
                options:
                  excludeByName:
                    Time: true
                    Value: true
                    mz_compute_cluster_status: true
                    v2_mz_compute_cluster_status: true
                  indexByName:
                    generation: 0
                    mz_version: 1
            - group: sortBy
              kind: Transformation
              spec:
                options:
                  fields: {}
                  sort:
                  - desc: true
                    field: generation
        description: |-
          **The Materialize version each generation is running — what the rollout is actually changing.**

          **Nominal:** One row between rollouts. Two during one, and the pair of versions is the upgrade you are performing: the older is what is serving now, the newer is what will serve once the new generation is promoted.

          **Unhealthy:** Two rows showing the *same* version. The rollout is replacing a generation with its own version, which is a restart rather than an upgrade — usually a forced rollout, and worth confirming that is what was intended before it costs a rehydration.

          Read off `compute_cluster_status`, whose `mz_version` label each generation's own environmentd reports, so the two sides genuinely disagree during a rollout rather than one overwriting the other. The string carries the build commit and the Helm chart version alongside the release.

          **Covers the whole selected time range, not the current instant.** A promoted generation is torn down, so a table evaluated at "now" would show only the survivor and a finished rollout would look like it never happened. `max_over_time` over the range is what keeps both sides present: widen the time picker to span a rollout and its old generation comes back, which is the same reason `$mzGenerationList` refreshes on a time-range change.

          Evaluated once rather than per step, so the table has one row per generation rather than one per generation per scrape.

