apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    monitoring.materialize.cloud/min-mz-version: v26.41.0
    monitoring.materialize.cloud/rec-mz-version: v26.41.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-env-upgrade
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    What happened during a Materialize upgrade.

    The operator's own account of a rollout, alongside
    what the cluster did underneath it.
  editable: true
  elements:
    active-generations:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      count(
                        count by (generation) (
                          label_replace(
                            mz_compute_commands_total{
                              materialize_cloud_organization_name=~"$environmentNameList", pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+"
                            },
                            "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                          )
                        )
                      )
                    legendFormat: generations
                    qryType: 1
                    query: |
                      count(
                        count by (generation) (
                          label_replace(
                            mz_compute_commands_total{
                              materialize_cloud_organization_name=~"$environmentNameList", pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+"
                            },
                            "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                          )
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How many deployment generations are currently running — one between rollouts, two while one is in flight.**

          **Nominal:** One. A settled environment runs a single generation.

          **Degraded:** Two, for as long as a rollout takes. Both generations hold read holds and both cost compute, so this is the state you want to leave promptly rather than linger in.

          **Unhealthy:** Two for far longer than a rollout should take. Either the new generation never became ready, or it is ready and waiting for a manual promotion — _Events -> Rollout_ tells you which, and a `WaitingForApproval` there means the rollout is doing what it was configured to do.

          Counted from the environmentd pods that are reporting, so a generation appears here as soon as its environmentd starts serving metrics and disappears once it is torn down.
        id: 1010
        links: []
        title: Active Generations
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                decimals: 0
                min: 0
                noValue: No generations match the current filters
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    all-event-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                        | name=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+" or name!~".*-(environmentd|gen)-([0-9]+)-[0-9]+"
                        | line_format "{{.reason}} {{.kind}}/{{.name}} — {{.msg}}"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Every Kubernetes event from the operator and environment namespaces, newest first — the unfiltered record of what the cluster did.**

          The reading of last resort. Prefer the warning and lifecycle feeds first; come here when the cause is something neither of them names, or to see an ordinary event in the context of the ones around it.

          Lines are reformatted to `Reason Kind/name — message`. The raw event carries a dozen more fields, most of them resource versions and forwarding addresses, and expanding a line shows all of them.
        id: 1009
        links: []
        title: All Events
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No events in this time range
              overrides: []
            options:
              dedupStrategy: none
              enableLogDetails: true
              prettifyLogMessage: false
              showCommonLabels: false
              showLabels: false
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              wrapLogMessage: true
          version: ''
    collections-by-generation:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      count by (generation) (
                        max by (generation, instance_id, collection_id) (
                          label_replace(
                            mz_dataflow_wallclock_lag_seconds{
                              materialize_cloud_organization_name=~"$environmentNameList",
                              pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+",
                              instance_id=~"$mzClusterList",
                              instance_id!="",
                              quantile="1"
                            },
                            "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                          )
                        )
                      )
                    legendFormat: gen {{generation}}
                    qryType: 1
                    query: |
                      count by (generation) (
                        max by (generation, instance_id, collection_id) (
                          label_replace(
                            mz_dataflow_wallclock_lag_seconds{
                              materialize_cloud_organization_name=~"$environmentNameList",
                              pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+",
                              instance_id=~"$mzClusterList",
                              instance_id!="",
                              quantile="1"
                            },
                            "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                          )
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Collections each generation is tracking — the denominator for hydration, and the shape of a new generation building out its dataflows.**

          **Nominal:** Both generations converging on the same count. The new one is meant to end up serving what the old one served.

          **Unhealthy:** A new generation whose count settles well below the old one's. It did not build every dataflow, so promoting it would lose what is missing.

          Counts every collection reporting a wallclock lag, hydrated or not, which is what makes it the denominator for _Hydration -> Hydrating Collections by Generation_.
        id: 1016
        links: []
        title: Collections by Generation
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No generations match the current filters
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cpu-by-generation:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (generation) (
                        label_replace(
                          rate(
                            container_cpu_usage_seconds_total{
                              namespace=~"$mzNamespaceList",container!="",container!="POD", pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+"
                            }
                            [$__rate_interval]
                          ),
                          "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                        )
                      )
                    legendFormat: gen {{generation}}
                    qryType: 1
                    query: |
                      sum by (generation) (
                        label_replace(
                          rate(
                            container_cpu_usage_seconds_total{
                              namespace=~"$mzNamespaceList",container!="",container!="POD", pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+"
                            }
                            [$__rate_interval]
                          ),
                          "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **CPU used by each generation's pods — what a rollout costs while both sides are up.**

          **Nominal:** The new generation drawing heavily while it hydrates, then settling to something like the old one's draw.

          **Unhealthy:** A new generation pinned at its limit long after hydration should have finished, or an old one still drawing after promotion, which means it was never torn down.

          Covers environmentd and the cluster replicas of each generation together. This is the panel that says whether the cluster can actually afford to run two generations at once — the answer is roughly double, for as long as the rollout lasts.
        id: 1018
        links: []
        title: CPU by Generation
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: 'No metrics: cadvisor metrics are required (via kubelet)'
                unit: cores
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    environments-needing-update:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        environmentd_needs_update{namespace=~"$operatorNamespace"}
                      )
                    legendFormat: outdated
                    qryType: 1
                    query: |
                      sum(
                        environmentd_needs_update{namespace=~"$operatorNamespace"}
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How many environments in this cluster are still running an outdated pod template — the count an upgrade is working to bring to zero.**

          **Nominal:** Zero between upgrades. Non-zero during one, falling as environments are rolled.

          **Unhealthy:** A count that stops falling. The rollout has stalled rather than finished; read _Reconciliation Passes -> Pass Outcomes_ for whether the operator is still trying, and the Events tab for what it said about why.

          Deliberately not alarm-coloured. A non-zero reading is what an upgrade in progress looks like, and colouring it red would fire on every routine one. What matters is the *direction*, which is why this is a sparkline rather than a bare number.

          Only the leader observes this, and it resets to zero when a replica loses the lease, so summing across replicas does not double-count an environment across a leadership handoff.
        id: 1021
        links: []
        title: Environments Needing Update
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#009988'
                  mode: shades
                decimals: 0
                min: 0
                noValue: 'No metrics: the Materialize operator is not being scraped'
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    event-rate-by-reason:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (reason) (
                        count_over_time(
                          {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                          | name=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+" or name!~".*-(environmentd|gen)-([0-9]+)-[0-9]+"
                          [$__auto]
                        )
                      )
                    legendFormat: '{{reason}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How often each kind of event is being reported, by reason. The shape of a rollout: `Pulled`, `Created` and `Started` rise together as pods are replaced, and fall back to nothing when it finishes.**

          **Nominal:** Quiet, apart from bursts that coincide with a deliberate change.

          **Unhealthy:** A reason that keeps firing at a steady rate is a loop rather than a transition. `FailedScheduling` and `BackOff` are the two that most often look like this, and both mean the rollout is not going to finish on its own.

          Counts events as Loki received them. Kubernetes aggregates a repeated event into one object with a rising `count` rather than sending it again, so a tight loop reports fewer lines than it has occurrences — the `count` on each line is the number this one stands for.
        id: 1007
        links: []
        title: Event Rate by Reason
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No events in this time range
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    failed-passes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        increase(
                          orchestratord_reconciliations_total{
                            namespace=~"$operatorNamespace", outcome="failed"
                          }
                          [$__range]
                        )
                      )
                    legendFormat: failed
                    qryType: 1
                    query: |
                      sum(
                        increase(
                          orchestratord_reconciliations_total{
                            namespace=~"$operatorNamespace", outcome="failed"
                          }
                          [$__range]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Reconciliation passes that returned an error over the selected time range.**

          **Nominal:** Zero.

          **Degraded:** A handful that stopped. The operator retries on a backoff, and a cause that clears itself — a webhook still starting, a secret created moments later — resolves without intervention.

          **Unhealthy:** A count that keeps climbing. Something the operator needs is not there and retrying will not make it appear. Each failure is also published as a Kubernetes event carrying the error's cause chain — see _Events -> Operator Health_.

          A count over the selected range rather than a rate, so the number answers "how many" directly. The rate over time is the `failed` series on _Reconciliation Passes -> Pass Outcomes_.
        id: 1023
        links: []
        title: Failed Passes (Select Time Range)
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: 'No metrics: the Materialize operator is not being scraped'
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#FEDA8B'
                    value: 1
                  - color: '#FDB366'
                    value: 25.75
                  - color: '#F67E4B'
                    value: 50.5
                  - color: '#DD3D2D'
                    value: 75.25
                  - color: '#A50026'
                    value: 100
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    failures-by-controller:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (controller, event_type) (
                        rate(
                          orchestratord_reconciliations_total{
                            namespace=~"$operatorNamespace", outcome="failed"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: '{{controller}} / {{event_type}}'
                    qryType: 1
                    query: |
                      sum by (controller, event_type) (
                        rate(
                          orchestratord_reconciliations_total{
                            namespace=~"$operatorNamespace", outcome="failed"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Failing passes broken out by which controller failed and which of its entry points was running — the first question after "something is failing".**

          **Nominal:** Nothing.

          **Unhealthy:** `materialize` failing is the environment itself not reaching the state it was asked for. `balancer` or `console` failing leaves the environment running but unreachable or unmanageable, which is a different urgency.

          `event_type` is which entry point ran: `apply` is the ordinary path, and `cleanup` runs while a resource is being deleted. A `cleanup` failure is what leaves a resource stuck with its finalizer still attached.
        id: 1025
        links: []
        title: Failed Passes by Controller
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No failing passes
                unit: reqps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    hydrating-by-generation:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (generation) (
                        max by (generation, instance_id, collection_id) (
                          label_replace(
                            mz_dataflow_wallclock_lag_seconds{
                              materialize_cloud_organization_name=~"$environmentNameList",
                              pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+",
                              instance_id=~"$mzClusterList",
                              instance_id!="",
                              quantile="1"
                            },
                            "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                          ) > bool 1e15
                        )
                      )
                    legendFormat: gen {{generation}}
                    qryType: 1
                    query: |
                      sum by (generation) (
                        max by (generation, instance_id, collection_id) (
                          label_replace(
                            mz_dataflow_wallclock_lag_seconds{
                              materialize_cloud_organization_name=~"$environmentNameList",
                              pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+",
                              instance_id=~"$mzClusterList",
                              instance_id!="",
                              quantile="1"
                            },
                            "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                          ) > bool 1e15
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Collections still rebuilding their in-memory state, split by generation — the panel that answers whether a new generation is ready to promote.**

          **Nominal:** Nothing for the serving generation. A new generation starts high and drains toward zero as its dataflows rebuild from persisted storage; that descent *is* the rollout making progress.

          **Degraded:** A new generation whose count is still falling. Normal, and the rate of descent is the honest estimate of how much longer it needs.

          **Unhealthy:** A count that stops falling while still above zero. Something cannot finish hydrating, and the rollout will not complete on its own. Confirm what with `SELECT * FROM mz_internal.mz_hydration_statuses WHERE NOT hydrated`.

          **A proxy, not a hydration state.** Self-managed Materialize exposes no hydration-state metric, so this counts collections parked at the wallclock-lag `u64::MAX` sentinel (`> 1e15`) — a collection with no established output frontier. Retire it once a real hydration metric exists. It is the same signal the environment overview reports as "Currently Hydrating", split by generation instead of summed across both sides of a rollout.

          **`> bool` rather than a filtering `>`.** A filtering comparison drops the series that do not match, so `count` emits no sample at all once a generation finishes hydrating — the line stops instead of reaching zero, and a stat reducing on the last non-null value goes on showing the last count it saw, indefinitely. `> bool` scores every collection 1 or 0 and `sum` adds them, so the series stays present and lands on zero, which is the descent this panel exists to show. The environment overview's unsplit version gets the same effect with `or vector(0)`; that appends a series carrying no labels, which is unusable once the panel groups by generation.

          A generation drops out only when it has no collections at all, which is true of a brand-new one for its first moments and of one that has been torn down.

          `instance_id!=""` is load-bearing — it keeps this to collections attached to a compute instance.
        id: 1015
        links: []
        title: Hydrating Collections by Generation
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No collections reporting for the selected generations
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    hydrating-now:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (generation) (
                        max by (generation, instance_id, collection_id) (
                          label_replace(
                            mz_dataflow_wallclock_lag_seconds{
                              materialize_cloud_organization_name=~"$environmentNameList",
                              pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+",
                              instance_id=~"$mzClusterList",
                              instance_id!="",
                              quantile="1"
                            },
                            "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                          ) > bool 1e15
                        )
                      )
                    legendFormat: gen {{generation}}
                    qryType: 1
                    query: |
                      sum by (generation) (
                        max by (generation, instance_id, collection_id) (
                          label_replace(
                            mz_dataflow_wallclock_lag_seconds{
                              materialize_cloud_organization_name=~"$environmentNameList",
                              pod=~".*-(environmentd|gen)-(${mzGenerationList:regex})-[0-9]+",
                              instance_id=~"$mzClusterList",
                              instance_id!="",
                              quantile="1"
                            },
                            "generation", "$1", "pod", ".*-(?:environmentd|gen)-([0-9]+)-[0-9]+"
                          ) > bool 1e15
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Collections still rebuilding their in-memory state, split by generation — the panel that answers whether a new generation is ready to promote.**

          **Nominal:** Nothing for the serving generation. A new generation starts high and drains toward zero as its dataflows rebuild from persisted storage; that descent *is* the rollout making progress.

          **Degraded:** A new generation whose count is still falling. Normal, and the rate of descent is the honest estimate of how much longer it needs.

          **Unhealthy:** A count that stops falling while still above zero. Something cannot finish hydrating, and the rollout will not complete on its own. Confirm what with `SELECT * FROM mz_internal.mz_hydration_statuses WHERE NOT hydrated`.

          **A proxy, not a hydration state.** Self-managed Materialize exposes no hydration-state metric, so this counts collections parked at the wallclock-lag `u64::MAX` sentinel (`> 1e15`) — a collection with no established output frontier. Retire it once a real hydration metric exists. It is the same signal the environment overview reports as "Currently Hydrating", split by generation instead of summed across both sides of a rollout.

          **`> bool` rather than a filtering `>`.** A filtering comparison drops the series that do not match, so `count` emits no sample at all once a generation finishes hydrating — the line stops instead of reaching zero, and a stat reducing on the last non-null value goes on showing the last count it saw, indefinitely. `> bool` scores every collection 1 or 0 and `sum` adds them, so the series stays present and lands on zero, which is the descent this panel exists to show. The environment overview's unsplit version gets the same effect with `or vector(0)`; that appends a series carrying no labels, which is unusable once the panel groups by generation.

          A generation drops out only when it has no collections at all, which is true of a brand-new one for its first moments and of one that has been torn down.

          `instance_id!=""` is load-bearing — it keeps this to collections attached to a compute instance.
