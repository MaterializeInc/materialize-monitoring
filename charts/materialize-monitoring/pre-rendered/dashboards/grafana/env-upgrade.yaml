            queryOptions: {}
            transformations: []
        description: |-
          **How many operator replicas hold the leadership lease and are therefore reconciling. This should be exactly one.**

          **Nominal:** One. The lease is held, and something is acting on your resources.

          **Unhealthy:** Zero means no replica can take the lease and the operator is reconciling nothing — every other panel here goes quiet and nothing on the cluster changes, however healthy the pods look. The usual cause is the service account lacking permission on leases. More than one should not be possible; treat it as a stale reading rather than a real split.

          Summed across replicas on purpose. A non-leader exports the metric at zero rather than not at all, so this is a count of leaders and not a count of pods.
