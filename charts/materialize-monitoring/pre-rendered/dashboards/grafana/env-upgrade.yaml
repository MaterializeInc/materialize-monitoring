            queryOptions: {}
            transformations: []
        description: |-
          **Which phases of reconciliation are running, and how often. A rollout moves through these in order, so the set that is active says where the operator has got to.**

          **Nominal:** The steps of whichever controllers have work. `promote` and `teardown_generation` appear only around a deployment; the rest tick over with the loop.

          A step is the only level at which "there was nothing to do" is distinguishable from "the desired state was reached" — the reconciler interface reports both as success. That distinction is the `outcome` label, which this panel sums over; see _Steps -> Step Failures and Abandonments_ for the half that matters.
