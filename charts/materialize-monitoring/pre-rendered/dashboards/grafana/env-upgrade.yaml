        description: |-
          **Why the operator could not reconcile a resource. The event carries the error's whole cause chain, which is usually the actionable half — an admission webhook that is down, a secret that does not exist yet, a license key that will not parse.**

          **Nominal:** Nothing. A reconciliation that succeeds reports no failure.

          **Degraded:** A failure that appears once and stops. The operator retries on a backoff, and a cause that clears itself — a webhook still starting up, a resource created moments later — resolves without intervention.

          **Unhealthy:** Failures that keep arriving. The `Kind` says which resource is stuck: `Materialize` is the environment itself, `Balancer` and `Console` are the components around it, and a failure on those leaves the environment running but unreachable or unmanageable.

          Repeats of one failure aggregate into a single event carrying a count, rather than one line each. When the message changes — a missing secret first, the real cause once it appears — the operator files a fresh event, so a changing cause reads as several lines rather than one stale one.

          A `FailedDeploy` reports twice: once here with the cause, and once in _Rollout -> Lifecycle Events_ with the phase.
