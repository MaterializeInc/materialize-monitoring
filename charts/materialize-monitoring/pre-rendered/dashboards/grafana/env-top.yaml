          **Total CPU cores configured across the environment's containers (sum of cAdvisor CPU limits), excluding the monitoring exporter — i.e. the CPU available to the actual workload.**

          Steps track `ALTER CLUSTER REPLICA SIZE`, replica create/drop, and pod restarts. Requires cAdvisor. For the same total *including* the monitoring exporter see `.all_containers`.
        id: 1008
        links: []
        title: Total CPU Capacity
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#0077BB'
                  mode: shades
                noValue: 'No metrics: cadvisor metrics are required (via kubelet)'
                unit: cores
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value_and_name
              wideLayout: true
          version: ''
    summary-currently-hydrating:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (count(
                        max by (instance_id, collection_id) (
                          mz_dataflow_wallclock_lag_seconds{materialize_cloud_organization_name=~"$environmentNameList", instance_id=~"$mzClusterList", instance_id!="", quantile="1"} > 1e15
                        )
                      )
                      ) or vector(0)
                    legendFormat: hydrating
                    qryType: 1
                    query: |-
                      (count(
                        max by (instance_id, collection_id) (
                          mz_dataflow_wallclock_lag_seconds{materialize_cloud_organization_name=~"$environmentNameList", instance_id=~"$mzClusterList", instance_id!="", quantile="1"} > 1e15
                        )
                      )
                      ) or vector(0)
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Collections still rebuilding their in-memory state — a live hydration-queue proxy. After a restart, replica creation, or some DDL, a dataflow has to rebuild from persisted storage before it can serve, and until it does it has no output frontier.**

          **Nominal:** 0, with brief spikes right after a replica restart that drain back to 0 as dataflows catch up. Those spikes are healthy re-hydration, not a problem.

          **Unhealthy:** A count that stays elevated means something can't finish hydrating — a source whose CREATE never completed, or a wedged dataflow. Confirm what with `SELECT * FROM mz_internal.mz_hydration_statuses WHERE NOT hydrated`.

          Stopgap, not a real signal: self-managed has no hydration-state metric, so this counts collections parked at the wallclock-lag u64::MAX sentinel (> 1e15) as a proxy. Deprecate this query once an actual hydration-state metric exists.
        id: 1003
        links: []
        title: Currently Hydrating
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                min: 0
                noValue: No matches for the current filters
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    summary-max-lag:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(
                        max_over_time(
                          (
                            mz_dataflow_wallclock_lag_seconds{materialize_cloud_organization_name=~"$environmentNameList", instance_id!="", quantile="1"} < 1e9
                          )[$__range:1m]
                        )
                      )
                    instant: true
                    legendFormat: max lag
                    qryType: 1
                    query: |
                      max(
                        max_over_time(
                          (
                            mz_dataflow_wallclock_lag_seconds{materialize_cloud_organization_name=~"$environmentNameList", instance_id!="", quantile="1"} < 1e9
                          )[$__range:1m]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The worst frontier lag seen anywhere in the environment over the selected window — how far the most-behind collection's output trailed real time. A top-level freshness pointer.**

          **Degraded:** Climbing toward an hour means some collection is falling behind; drill into per-cluster and per-collection freshness to find which, and into hydration / source health for why.

          Not-yet-hydrated collections are excluded (they report the sentinel and surface as "currently hydrating"). This is the peak over the window, so it reflects the worst moment rather than the current value.
        id: 1004
        links: []
        title: Max Lag (Select Time Range)
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No matches for the current filters
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#CEFFFF'
                    value: null
                  - color: '#CEFFFF'
                    value: 2
                  - color: '#C6F7D6'
                    value: 4
                  - color: '#A2F49B'
                    value: 9
                  - color: '#BBE453'
                    value: 19
                  - color: '#D5CE04'
                    value: 41
                  - color: '#E7B503'
                    value: 87
                  - color: '#F19903'
                    value: 183
                  - color: '#F6790B'
                    value: 385
                  - color: '#F94902'
                    value: 812
                  - color: '#E40515'
                    value: 1710
                  - color: '#AB0003'
                    value: 3600
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
