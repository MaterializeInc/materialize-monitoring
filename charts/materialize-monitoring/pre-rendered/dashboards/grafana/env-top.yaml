apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.29.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-env-top
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    Overview of a Materialize Environment.

    This provides a high-level summary to catch more obvious issues
    that may require further investigation.
  editable: true
  elements:
    active-indexes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (max(sum by (instance) (mz_indexes_count{materialize_cloud_organization_name=~"$environmentNameList"}))
                      ) or vector(0)
                    legendFormat: indexes
                    qryType: 1
                    query: |-
                      (max(sum by (instance) (mz_indexes_count{materialize_cloud_organization_name=~"$environmentNameList"}))
                      ) or vector(0)
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Indexes in the catalog. An index is an in-memory arrangement that makes reads against its relation effectively instant, in exchange for memory — so growth here is a leading indicator of cluster memory growth.**

          Environment-scoped. Hardened to read 0 on a fresh environment (the metric is absent until the first index exists).
        id: 1035
        links: []
        title: Active Indexes
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                min: 0
                noValue: No matches for the current filters
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    active-mzd-views:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(mz_mzd_views_count{materialize_cloud_organization_name=~"$environmentNameList"})
                    legendFormat: materialized-views
                    qryType: 1
                    query: |
                      max(mz_mzd_views_count{materialize_cloud_organization_name=~"$environmentNameList"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Materialized views Materialize is actively maintaining. Each one is a query whose result is kept continuously up to date, so this tracks roughly how much standing compute the environment carries.**

          Environment-scoped — the cluster/replica selectors don't narrow it. Steps on CREATE/DROP MATERIALIZED VIEW; steady otherwise.
        id: 1034
        links: []
        title: Active Materialized Views
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                min: 0
                noValue: No matches for the current filters
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    active-subscribes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (session_type) (mz_active_subscribes{materialize_cloud_organization_name=~"$environmentNameList"})
                    instant: true
                    legendFormat: '{{session_type}}'
                    qryType: 1
                    query: |
                      sum by (session_type) (mz_active_subscribes{materialize_cloud_organization_name=~"$environmentNameList"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Live SUBSCRIBE sessions — long-running queries that stream updates to a client as data changes. A handful of `system` subscribes are Materialize's own internal probes; a persistently climbing `user` count is a classic leaked-connection signal.**

          Environment-scoped.
        id: 1037
        links: []
        title: Active Subscribes
        vizConfig:
          group: piechart
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                noValue: No matches for the current filters
              overrides: []
            options:
              displayLabels:
              - name
              - value
              legend:
                asTable: true
                calcs: []
                displayMode: table
                isVisible: true
                placement: right
                showLegend: true
                values:
                - value
              orientation: auto
              pieType: donut
              reduceOptions:
                calcs: []
                values: false
              tooltip:
                mode: single
                sort: asc
          version: ''
    active-views:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(mz_views_count{materialize_cloud_organization_name=~"$environmentNameList"})
                    legendFormat: views
                    qryType: 1
                    query: |
                      max(mz_views_count{materialize_cloud_organization_name=~"$environmentNameList"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Non-materialized views — query templates evaluated on demand. They cost nothing until something reads them, so this is a catalog-shape signal rather than a load one.**

          Environment-scoped.
        id: 1036
        links: []
        title: Active Views
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE7733'
                  mode: shades
                min: 0
                noValue: No matches for the current filters
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    adapter-commands-by-app:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (application_name, status) (increase(mz_adapter_commands{materialize_cloud_organization_name=~"$environmentNameList"}[$__range]))
                    instant: true
                    qryType: 1
                    query: |
                      sum by (application_name, status) (increase(mz_adapter_commands{materialize_cloud_organization_name=~"$environmentNameList"}[$__range]))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations:
            - group: labelsToFields
              kind: Transformation
              spec:
                options:
                  keepLabels:
                  - application_name
                  - status
            - group: merge
              kind: Transformation
              spec:
                options: {}
            - group: groupingToMatrix
              kind: Transformation
              spec:
                options:
                  columnField: status
                  emptyValue: zero
                  rowField: application_name
                  valueField: Value
            - group: organize
              kind: Transformation
              spec:
                options:
                  indexByName:
                    application_name\status: 0
                    error: 2
                    success: 1
                  renameByName:
                    application_name\status: Application
                    error: Errors
                    success: Success
            - group: sortBy
              kind: Transformation
              spec:
                options:
                  fields: {}
                  sort:
                  - desc: true
                    field: Errors
        description: |-
          **SQL control-plane command totals per client `application_name` over the window, so you can see which clients drive the adapter and which are failing. Most clients set `application_name` in their connection string; those that don't bucket as `unrecognized`/`unspecified` (normal).**

          **Unhealthy:** Sustained errors against a real application mean that app is consistently failing its commands — correlate with the app's own logs and the `mz_internal` activity-log views for the specific failures.

          The presentation layer pivots the `status` label into Success/Errors columns. Environment-scoped.
        id: 1029
        links: []
        title: SQL Control Plane Commands by Application
        vizConfig:
          group: table
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  align: auto
                  filterable: true
                  inspect: false
                noValue: No matches for the current filters
                unit: short
              overrides:
              - matcher:
                  id: byName
                  options: Errors
                properties:
                - id: thresholds
                  value:
                    mode: absolute
                    steps:
                    - color: '#A2F49B'
                      value: null
                    - color: '#FEDA8B'
                      value: 1
                    - color: '#FDB366'
                      value: 25.75
                    - color: '#F67E4B'
                      value: 50.5
                    - color: '#DD3D2D'
                      value: 75.25
                    - color: '#A50026'
                      value: 100
                - id: custom.cellOptions
                  value:
                    type: color-background
            options:
              cellHeight: sm
              footer:
                countRows: false
                reducer: []
                show: false
              frameIndex: 0
              showHeader: true
              showTypeIcons: false
          version: ''
    arrangement-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      sum by (cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id) (
                        max without (job) (rate(
                          mz_arrangement_maintenance_seconds_total{materialize_cloud_organization_name=~"$environmentNameList", cluster_environmentd_materialize_cloud_cluster_id=~"$mzClusterList", cluster_environmentd_materialize_cloud_replica_id=~"$mzReplicaList"}[$__rate_interval]
                        ))
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id) (
                        max without (job) (rate(
                          mz_arrangement_maintenance_seconds_total{materialize_cloud_organization_name=~"$environmentNameList", cluster_environmentd_materialize_cloud_cluster_id=~"$mzClusterList", cluster_environmentd_materialize_cloud_replica_id=~"$mzReplicaList"}[$__rate_interval]
                        ))
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                    legendFormat: '{{cluster_name}} / {{cluster_environmentd_materialize_cloud_replica_id}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      sum by (cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id) (
                        max without (job) (rate(
                          mz_arrangement_maintenance_seconds_total{materialize_cloud_organization_name=~"$environmentNameList", cluster_environmentd_materialize_cloud_cluster_id=~"$mzClusterList", cluster_environmentd_materialize_cloud_replica_id=~"$mzReplicaList"}[$__rate_interval]
                        ))
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id) (
                        max without (job) (rate(
                          mz_arrangement_maintenance_seconds_total{materialize_cloud_organization_name=~"$environmentNameList", cluster_environmentd_materialize_cloud_cluster_id=~"$mzClusterList", cluster_environmentd_materialize_cloud_replica_id=~"$mzReplicaList"}[$__rate_interval]
                        ))
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **CPU-cores spent maintaining arrangements — the in-memory indexed snapshots behind every index and materialized view — summed across a replica's workers, so an N-worker replica can reach N.**

          **Nominal:** Well below the worker count.

          **Degraded:** Sustained near the worker count means the replica is bottlenecked on maintenance, usually a high upstream change rate or many heavy indexes. The catalog cluster's baseline runs higher than typical user clusters.

          Uses the long-form cluster_environmentd_* id labels. Reads high under the same multi-job scrape pitfall as the dataflow elapsed rate.
        id: 1047
        links: []
        title: Arrangement Maintenance Rate
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: none
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    arrangement-rate-by-worker:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      sum by (cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id, worker_id) (
                        max without (job) (rate(
                          mz_arrangement_maintenance_seconds_total{materialize_cloud_organization_name=~"$environmentNameList", cluster_environmentd_materialize_cloud_cluster_id=~"$mzClusterList", cluster_environmentd_materialize_cloud_replica_id=~"$mzReplicaList"}[$__rate_interval]
                        ))
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id, worker_id) (
                        max without (job) (rate(
                          mz_arrangement_maintenance_seconds_total{materialize_cloud_organization_name=~"$environmentNameList", cluster_environmentd_materialize_cloud_cluster_id=~"$mzClusterList", cluster_environmentd_materialize_cloud_replica_id=~"$mzReplicaList"}[$__rate_interval]
                        ))
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                    legendFormat: '{{cluster_name}} / {{cluster_environmentd_materialize_cloud_replica_id}} / w{{worker_id}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      sum by (cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id, worker_id) (
                        max without (job) (rate(
                          mz_arrangement_maintenance_seconds_total{materialize_cloud_organization_name=~"$environmentNameList", cluster_environmentd_materialize_cloud_cluster_id=~"$mzClusterList", cluster_environmentd_materialize_cloud_replica_id=~"$mzReplicaList"}[$__rate_interval]
                        ))
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (cluster_environmentd_materialize_cloud_cluster_id, cluster_environmentd_materialize_cloud_replica_id, worker_id) (
                        max without (job) (rate(
                          mz_arrangement_maintenance_seconds_total{materialize_cloud_organization_name=~"$environmentNameList", cluster_environmentd_materialize_cloud_cluster_id=~"$mzClusterList", cluster_environmentd_materialize_cloud_replica_id=~"$mzReplicaList"}[$__rate_interval]
                        ))
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The same maintenance CPU, split per worker — each worker tops out at 1.0.**

          **Degraded:** Watch for skew: one worker sitting near 1.0 while its siblings idle near 0 means the cluster is bottlenecked on a single worker (a hot key or hot arrangement) — the most common reason an 8-worker cluster performs like a 1-worker one. `EXPLAIN PHYSICAL PLAN` on the heavy object is the usual next step.
        id: 1048
        links: []
        title: Arrangement Maintenance Rate (per worker)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    arrangement-records-system:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      max by (collection_id) (
                        mz_arrangement_record_count{materialize_cloud_organization_name=~"$environmentNameList", instance_id=~"$mzClusterList", replica_id=~"$mzReplicaList", collection_id=~"s.*"}
                      )

                      )
                      * on (collection_id) group_left(name)
                      max by (collection_id, name) (
                      label_replace(mz_object_info{materialize_cloud_organization_name=~"$environmentNameList"}, "collection_id", "$1", "global_id", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      max by (collection_id) (
                        mz_arrangement_record_count{materialize_cloud_organization_name=~"$environmentNameList", instance_id=~"$mzClusterList", replica_id=~"$mzReplicaList", collection_id=~"s.*"}
                      )

                      )
                      unless on (collection_id) (
                      group by (collection_id) (
                      label_replace(mz_object_info{materialize_cloud_organization_name=~"$environmentNameList"}, "collection_id", "$1", "global_id", "(.*)")
                      )
                      ),
                      "name", "$1", "collection_id", "(.*)"
                      )
                    instant: true
                    legendFormat: '{{name}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      max by (collection_id) (
                        mz_arrangement_record_count{materialize_cloud_organization_name=~"$environmentNameList", instance_id=~"$mzClusterList", replica_id=~"$mzReplicaList", collection_id=~"s.*"}
                      )

                      )
                      * on (collection_id) group_left(name)
                      max by (collection_id, name) (
                      label_replace(mz_object_info{materialize_cloud_organization_name=~"$environmentNameList"}, "collection_id", "$1", "global_id", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      max by (collection_id) (
                        mz_arrangement_record_count{materialize_cloud_organization_name=~"$environmentNameList", instance_id=~"$mzClusterList", replica_id=~"$mzReplicaList", collection_id=~"s.*"}
                      )

                      )
                      unless on (collection_id) (
                      group by (collection_id) (
                      label_replace(mz_object_info{materialize_cloud_organization_name=~"$environmentNameList"}, "collection_id", "$1", "global_id", "(.*)")
                      )
                      ),
                      "name", "$1", "collection_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations:
            - group: reduce
              kind: Transformation
              spec:
                options:
                  mode: seriesToRows
                  reducers:
                  - min
                  - max
                  - lastNotNull
            - group: organize
              kind: Transformation
              spec:
                options:
                  renameByName:
                    Field: Collection
            - group: sortBy
              kind: Transformation
              spec:
                options:
                  fields: {}
                  sort:
                  - desc: true
                    field: Last *
        description: '**Row counts of arrangements for Materialize''s internal system collections (collection id starts with `s`). These back the catalog and internal probes, not user data, so they shouldn''t grow with your workload — unexpected growth here can point at a Materialize bug.**'
        id: 1049
        links: []
        title: System Collections — Record Counts
        vizConfig:
          group: table
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  align: auto
                  filterable: true
                  inspect: false
                noValue: No matches for the current filters
                unit: short
              overrides: []
            options:
              cellHeight: sm
              footer:
                countRows: false
                reducer: []
                show: false
              frameIndex: 0
              showHeader: true
              showTypeIcons: false
          version: ''
    arrangement-records-transient:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
