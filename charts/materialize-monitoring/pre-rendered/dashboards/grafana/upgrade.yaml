        description: |-
          **Kubernetes events the reporting component flagged as warnings — a pod that will not schedule, an image that will not pull, a container failing its probes.**

          **Nominal:** Nothing, or a brief flurry that stops on its own. Warnings during a rollout are expected while pods are replaced: a new pod is unschedulable for as long as it takes a node to appear.

          **Unhealthy:** Warnings that keep arriving after a rollout should have settled. Read the reason: `FailedScheduling` and `NotTriggerScaleUp` mean the cluster has nowhere to put the new pods, `BackOff` means they start and die, `Unhealthy` means they start and never become ready.

