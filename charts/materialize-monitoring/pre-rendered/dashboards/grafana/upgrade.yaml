apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    monitoring.materialize.cloud/min-mz-version: v26.40.0
    monitoring.materialize.cloud/rec-mz-version: v26.40.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-cloud: generic
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-upgrade
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    What happened during a Materialize upgrade.

    The operator's own account of a rollout, alongside
    what the cluster did underneath it.
  editable: true
  elements:
    all-event-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                        | line_format "{{.reason}} {{.kind}}/{{.name}} — {{.msg}}"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Every Kubernetes event from the operator and environment namespaces, newest first — the unfiltered record of what the cluster did.**

          The reading of last resort. Prefer the warning and lifecycle feeds first; come here when the cause is something neither of them names, or to see an ordinary event in the context of the ones around it.

          Lines are reformatted to `Reason Kind/name — message`. The raw event carries a dozen more fields, most of them resource versions and forwarding addresses, and expanding a line shows all of them.
        id: 1009
        links: []
        title: All Events
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No events in this time range
              overrides: []
            options:
              dedupStrategy: none
              enableLogDetails: true
              prettifyLogMessage: false
              showCommonLabels: false
              showLabels: false
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              wrapLogMessage: true
          version: ''
    environments-needing-update:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        environmentd_needs_update{namespace=~"$operatorNamespace"}
                      )
                    legendFormat: outdated
                    qryType: 1
                    query: |
                      sum(
                        environmentd_needs_update{namespace=~"$operatorNamespace"}
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How many environments in this cluster are still running an outdated pod template — the count an upgrade is working to bring to zero.**

          **Nominal:** Zero between upgrades. Non-zero during one, falling as environments are rolled.

          **Unhealthy:** A count that stops falling. The rollout has stalled rather than finished; read _Reconciliation Passes -> Pass Outcomes_ for whether the operator is still trying, and the Events tab for what it said about why.

          Deliberately not alarm-coloured. A non-zero reading is what an upgrade in progress looks like, and colouring it red would fire on every routine one. What matters is the *direction*, which is why this is a sparkline rather than a bare number.

          Only the leader observes this, and it resets to zero when a replica loses the lease, so summing across replicas does not double-count an environment across a leadership handoff.
        id: 1011
        links: []
        title: Environments Needing Update
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#009988'
                  mode: shades
                decimals: 0
                min: 0
                noValue: 'No metrics: the Materialize operator is not being scraped'
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    event-rate-by-reason:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (reason) (
                        count_over_time(
                          {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                          [$__auto]
                        )
                      )
                    legendFormat: '{{reason}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How often each kind of event is being reported, by reason. The shape of a rollout: `Pulled`, `Created` and `Started` rise together as pods are replaced, and fall back to nothing when it finishes.**

          **Nominal:** Quiet, apart from bursts that coincide with a deliberate change.

          **Unhealthy:** A reason that keeps firing at a steady rate is a loop rather than a transition. `FailedScheduling` and `BackOff` are the two that most often look like this, and both mean the rollout is not going to finish on its own.

          Counts events as Loki received them. Kubernetes aggregates a repeated event into one object with a rising `count` rather than sending it again, so a tight loop reports fewer lines than it has occurrences — the `count` on each line is the number this one stands for.
        id: 1007
        links: []
        title: Event Rate by Reason
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No events in this time range
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    failed-passes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        increase(
                          orchestratord_reconciliations_total{
                            namespace=~"$operatorNamespace", outcome="failed"
                          }
                          [$__range]
                        )
                      )
                    legendFormat: failed
                    qryType: 1
                    query: |
                      sum(
                        increase(
                          orchestratord_reconciliations_total{
                            namespace=~"$operatorNamespace", outcome="failed"
                          }
                          [$__range]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Reconciliation passes that returned an error over the selected time range.**

          **Nominal:** Zero.

          **Degraded:** A handful that stopped. The operator retries on a backoff, and a cause that clears itself — a webhook still starting, a secret created moments later — resolves without intervention.

          **Unhealthy:** A count that keeps climbing. Something the operator needs is not there and retrying will not make it appear. Each failure is also published as a Kubernetes event carrying the error's cause chain — see _Events -> Operator Health_.

          A count over the selected range rather than a rate, so the number answers "how many" directly. The rate over time is the `failed` series on _Reconciliation Passes -> Pass Outcomes_.
        id: 1013
        links: []
        title: Failed Passes (Select Time Range)
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: 'No metrics: the Materialize operator is not being scraped'
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#FEDA8B'
                    value: 1
                  - color: '#FDB366'
                    value: 25.75
                  - color: '#F67E4B'
                    value: 50.5
                  - color: '#DD3D2D'
                    value: 75.25
                  - color: '#A50026'
                    value: 100
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    failures-by-controller:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (controller, event_type) (
                        rate(
                          orchestratord_reconciliations_total{
                            namespace=~"$operatorNamespace", outcome="failed"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: '{{controller}} / {{event_type}}'
                    qryType: 1
                    query: |
                      sum by (controller, event_type) (
                        rate(
                          orchestratord_reconciliations_total{
                            namespace=~"$operatorNamespace", outcome="failed"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Failing passes broken out by which controller failed and which of its entry points was running — the first question after "something is failing".**

          **Nominal:** Nothing.

          **Unhealthy:** `materialize` failing is the environment itself not reaching the state it was asked for. `balancer` or `console` failing leaves the environment running but unreachable or unmanageable, which is a different urgency.

          `event_type` is which entry point ran: `apply` is the ordinary path, and `cleanup` runs while a resource is being deleted. A `cleanup` failure is what leaves a resource stuck with its finalizer still attached.
        id: 1015
        links: []
        title: Failed Passes by Controller
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No failing passes
                unit: reqps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    lifecycle-events:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                        | reportingcontroller="orchestratord.materialize.cloud"
                        | kind="Materialize"
                        | reason!="ReconciliationFailed"
                        | line_format "{{.reason}} — {{.msg}}"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Every phase the Materialize resource moved through, as the operator reported it: `Applying`, `ReadyToPromote`, `WaitingForApproval`, `Promoting`, `Applied`, and the two that end a rollout badly, `RolloutTimeout` and `FailedDeploy`.**

          **Nominal:** A rollout reads as a short sequence ending in `Applied`. Nothing between rollouts, since a phase is only reported when the status actually changes.

          **Unhealthy:** `RolloutTimeout` or `FailedDeploy`. Both say the rollout stopped without reaching the requested state; neither says why, which is what _Operator Health -> Reconciliation Failures_ carries.

          The resource's status conditions record only the phase it is in *now*, so a rollout that has moved on leaves no account of what it passed through. This is that account.

          Selected by `reportingcontroller` rather than by the operator's namespace: the event is filed against the `Materialize` resource, which lives in the environment's namespace rather than the operator's.

          One line per transition rather than one per reconciliation pass: the operator publishes an event only when the status substantively moved, so a reconciler re-running on every watch event does not repeat itself here.

          A `WaitingForApproval` that persists is not a failure — the rollout is doing what it was configured to do and is waiting for a human to promote it.
        id: 1004
        links: []
        title: Lifecycle Events
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No rollout activity in this time range
              overrides: []
            options:
              dedupStrategy: none
              enableLogDetails: true
              prettifyLogMessage: false
              showCommonLabels: false
              showLabels: false
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              wrapLogMessage: true
          version: ''
    lifecycle-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (reason) (
                        count_over_time(
                          {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                          | reportingcontroller="orchestratord.materialize.cloud"
                          | kind="Materialize"
                          | reason!="ReconciliationFailed"
                          [$__auto]
                        )
                      )
                    legendFormat: '{{reason}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Lifecycle transitions over time, by phase — where a rollout got to, and when.**

          Read as a sequence rather than a rate: each point is one transition, and the interesting reading is which phases appear and in what order. A rollout that reaches `Promoting` and never reaches `Applied` stopped in promotion.
        id: 1003
        links: []
        title: Lifecycle Transitions
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No rollout activity in this time range
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    lifecycle-transitions:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (reason) (
                        count_over_time(
                          {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                          | reportingcontroller="orchestratord.materialize.cloud"
                          | kind="Materialize"
                          | reason!="ReconciliationFailed"
                          [$__auto]
                        )
                      )
                    legendFormat: '{{reason}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Lifecycle transitions over time, by phase — where a rollout got to, and when.**

          Read as a sequence rather than a rate: each point is one transition, and the interesting reading is which phases appear and in what order. A rollout that reaches `Promoting` and never reaches `Applied` stopped in promotion.
        id: 1002
        links: []
        title: Lifecycle Transitions
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE3377'
                  mode: shades
                min: 0
                noValue: No rollout activity in this time range
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value_and_name
              wideLayout: true
          version: ''
    pass-duration:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(0.5, sum by (le) (
                        rate(
                          orchestratord_reconciliation_duration_seconds_bucket{
                            namespace=~"$operatorNamespace"
                          }
                          [$__rate_interval]
                        )
                      ))
                    legendFormat: p50
                    qryType: 1
                    query: |
                      histogram_quantile(0.5, sum by (le) (
                        rate(
                          orchestratord_reconciliation_duration_seconds_bucket{
                            namespace=~"$operatorNamespace"
                          }
                          [$__rate_interval]
                        )
                      ))
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(0.9, sum by (le) (
                        rate(
                          orchestratord_reconciliation_duration_seconds_bucket{
                            namespace=~"$operatorNamespace"
                          }
                          [$__rate_interval]
                        )
                      ))
                    legendFormat: p90
                    qryType: 1
                    query: |
                      histogram_quantile(0.9, sum by (le) (
                        rate(
                          orchestratord_reconciliation_duration_seconds_bucket{
                            namespace=~"$operatorNamespace"
                          }
                          [$__rate_interval]
                        )
                      ))
                  version: v0
                refId: query-1
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(0.99, sum by (le) (
                        rate(
                          orchestratord_reconciliation_duration_seconds_bucket{
                            namespace=~"$operatorNamespace"
                          }
                          [$__rate_interval]
                        )
                      ))
                    legendFormat: p99
                    qryType: 1
                    query: |
                      histogram_quantile(0.99, sum by (le) (
                        rate(
                          orchestratord_reconciliation_duration_seconds_bucket{
                            namespace=~"$operatorNamespace"
                          }
                          [$__rate_interval]
                        )
                      ))
                  version: v0
                refId: query-2
            queryOptions: {}
            transformations: []
        description: |-
          **How long one reconciliation pass takes, at the 50th, 90th and 99th percentiles.**

          **Nominal:** Tens to hundreds of milliseconds. Reconciliation is a handful of Kubernetes API calls, not a long-running job.

          **Unhealthy:** Passes stretching into seconds, which points at the Kubernetes API rather than at Materialize — a slow or throttling API server, or an admission webhook the operator's writes have to wait on.

          **This is not how long a rollout takes.** A pass that is waiting on the new generation's pods returns promptly and asks to be run again rather than blocking, so this measures work done per pass, not the wall-clock length of the change. The rollout's own duration is the span between its first and last transition on the Events tab.

          The histogram's buckets are deliberately coarse — 10ms, 50ms, 250ms, 1s, 5s, 30s — so a percentile here is the boundary of the bucket the value fell in rather than the value itself. Read it as an order of magnitude. That is the trade the operator made on purpose: finer buckets would cost several times the series for detail no operator question asks for.

          Covers the reconciler only, not the finalizer bookkeeping the controller does around it.
        id: 1016
        links: []
        title: Pass Duration
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: 'No metrics: the Materialize operator is not being scraped'
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    pass-outcomes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (outcome) (
                        rate(
                          orchestratord_reconciliations_total{namespace=~"$operatorNamespace"}
                          [$__rate_interval]
                        )
                      )
                    legendFormat: '{{outcome}}'
                    qryType: 1
                    query: |
                      sum by (outcome) (
                        rate(
                          orchestratord_reconciliations_total{namespace=~"$operatorNamespace"}
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **What reconciliation passes concluded, by outcome. The shape of a rollout: `waiting` climbs while the new generation's pods come up, then gives way to `applied` when they are ready.**

          **Nominal:** `applied` with `waiting` alongside it during a change. Both are success.

          **Degraded:** `waiting` that stays high long after a change should have settled. The operator is still trying and the thing it is waiting for has not happened — usually pods that will not become ready.

          **Unhealthy:** A sustained `failed` rate. The pass is erroring rather than waiting, and _Steps -> Step Failures and Abandonments_ localizes which phase.

          The five outcomes are the operator's own vocabulary: `applied` reached the desired state or found it already there; `waiting` made progress and asked to run again; `skipped` had nothing to act on, because what it manages is disabled or absent from the spec; `failed` returned an error; `abandoned` did not reach a conclusion.

          `abandoned` is rare at the pass level and is not a failure signal — it covers a pass cancelled by a leadership handoff or a shutdown as well as one that errored out.

          `apply` and `cleanup` passes are summed together here. Cleanup runs when a resource is being deleted, so it is rare, and splitting it out would double every series to distinguish a case that is usually absent.
        id: 1014
        links: []
        title: Pass Outcomes
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: 'No metrics: the Materialize operator is not being scraped'
                unit: reqps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    reconciliation-failure-events:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                        | reportingcontroller="orchestratord.materialize.cloud"
                        | reason="ReconciliationFailed"
                        | line_format "{{.kind}}/{{.name}} — {{.msg}}"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Why the operator could not reconcile a resource. The event carries the error's whole cause chain, which is usually the actionable half — an admission webhook that is down, a secret that does not exist yet, a license key that will not parse.**

          **Nominal:** Nothing. A reconciliation that succeeds reports no failure.

          **Degraded:** A failure that appears once and stops. The operator retries on a backoff, and a cause that clears itself — a webhook still starting up, a resource created moments later — resolves without intervention.

          **Unhealthy:** Failures that keep arriving. The `Kind` says which resource is stuck: `Materialize` is the environment itself, `Balancer` and `Console` are the components around it, and a failure on those leaves the environment running but unreachable or unmanageable.

          Repeats of one failure aggregate into a single event carrying a count, rather than one line each. When the message changes — a missing secret first, the real cause once it appears — the operator files a fresh event, so a changing cause reads as several lines rather than one stale one.

          A `FailedDeploy` reports twice: once here with the cause, and once in _Rollout -> Lifecycle Events_ with the phase.
        id: 1006
        links: []
        title: Reconciliation Failure Events
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No reconciliation failures in this time range
              overrides: []
            options:
              dedupStrategy: none
              enableLogDetails: true
              prettifyLogMessage: false
              showCommonLabels: false
              showLabels: false
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              wrapLogMessage: true
          version: ''
    reconciliation-failure-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (kind) (
                        count_over_time(
                          {job="loki.source.kubernetes_events", namespace=~"${operatorNamespace:regex}|${mzNamespaceList:regex}"}
                          | reportingcontroller="orchestratord.materialize.cloud"
                          | reason="ReconciliationFailed"
