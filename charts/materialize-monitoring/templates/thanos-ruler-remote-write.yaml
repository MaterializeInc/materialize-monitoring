{{- /*
Remote-write configuration for the stateless Thanos Ruler.

The subchart runs the Ruler stateless under `thanos.ruler.remoteWrite.enabled`:
it passes `--remote-write.config-file` from a Secret and drops
`--objstore.config-file`, so no block shipper runs. **The umbrella renders that
Secret rather than handing the subchart an inline `remoteWrite.config`**,
because the target is the alloy-gateway's address, and the subchart's `tpl`
context cannot read the umbrella values that address is derived from
(`mzmon.alloyGateway.remoteWriteUrl`): the gateway's namespace under
`split-namespace`, and its scheme. `thanos.ruler.remoteWrite.secretName` names
the Secret, with `createSecret` left off.

The target is the gateway's `prometheus.receive_http` listener, the same one the
agent pushes to, so rule results take the path every other series in this
stack takes.

**Two Secrets, one per TLS mode, and both names carry a revision**
(`mzmon.thanos.ruler.remoteWriteSecretName`). The plaintext one writes over
plaintext. The `-tls` one writes over TLS: the Ruler trusts the internal CA and
presents the Thanos certificate, both from `thanos.ruler.extraVolumes`, from
phase 1, which the listener ignores until phase 2, so phase 3 can require a
certificate in any rollout order.

The mode and the revision are in the name because the Ruler reads this file
once, at startup, and nothing else would roll it. The subchart checksums the
config into a pod annotation only when it renders the Secret itself, and the
mount is a `subPath`, so a change to a Secret's contents reaches no running
Ruler. Pointing `secretName` at a different name changes the pod template
instead, which rolls it. So switching modes rolls the Ruler, and so does
upgrading to a chart whose contents changed, provided the revision was bumped
with them. `profiles/mtls.values.yaml` does that, and
`mzmon.thanos.validate.ruler` fails the render when the named Secret and
`pipeline.metrics.gateway.server.tls` disagree. Left on plaintext against a TLS
listener, every write fails the handshake, and the gateway logs each failure.

**No `write_relabel_configs`, deliberately.** The gateway converts every
series to OTLP, which needs a `job` and an `instance` that rule results lack,
and the obvious fix is a `replace` here that fills them when they are missing.
Thanos loads this file without a label-name validation scheme, and a `replace`
that reads a label panics the Ruler on its first sample ("Invalid name
validation scheme requested: unset"). The gateway fills both instead, before
its OTLP bridge; see `prometheus.relabel.receiveIdentity` in
`mzmon.alloyGateway.pipeline.sources`.

**Rendered whenever the Ruler is enabled, including when the gateway is not.**
The subchart mounts the Secret unconditionally in stateless mode, so gating it
on the gateway would leave every Ruler pod in `FailedMount` on a metrics-only
install — turning a lost remote-write into lost alert evaluation, which is the
opposite of what the validator promises. With no gateway the samples go nowhere
and the alerts still fire; `mzmon.thanos.validate.ruler` says so.
*/}}
{{- if ( include "mzmon.thanos.ruler.enabled" $ ) }}
{{- range $tls := list false true }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mzmon.thanos.ruler.remoteWriteSecretName" ( dict "tls" $tls ) }}
  namespace: {{ include "mzmon.thanos.namespace" $ }}
  labels:
    {{- include "mzmon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ruler
  annotations:
    {{- include "mzmon.annotations" $ | nindent 4 }}
type: Opaque
stringData:
  {{- /* The key the subchart mounts, `thanos.ruler.remoteWrite.secretKey`. */}}
  {{ dig "ruler" "remoteWrite" "secretKey" "remote-write.yml" ( $.Values.thanos | default dict ) }}: |
    remote_write:
      - name: alloy-gateway
        url: {{ printf "%s://%s" ( ternary "https" "http" $tls ) ( include "mzmon.alloyGateway.remoteWriteAddress" $ ) | quote }}
        remote_timeout: 30s
        {{- if $tls }}
        tls_config:
          ca_file: /etc/mzmon/tls/ca.crt
          cert_file: /etc/mzmon/tls/tls.crt
          key_file: /etc/mzmon/tls/tls.key
        {{- end }}
        {{- /* The ruler writes ALERTS, ALERTS_FOR_STATE and every recording-rule
               result. That is a small, steady stream rather than a scrape-shaped
               burst, so the queue stays well under the Prometheus defaults. */}}
        queue_config:
          capacity: 2500
          max_shards: 10
          min_shards: 1
          max_samples_per_send: 500
          batch_send_deadline: 5s
{{- end }}
{{- end }}
