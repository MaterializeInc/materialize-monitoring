{{- if ( include "mzmon.alloyGateway.enabled" $ ) }}
{{- $fullname := printf "%s-%s" ( include "mzmon.fullname" $ ) "alloy-gateway-env" }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ $fullname }}
  namespace: {{ include "mzmon.alloyGateway.namespace" $ }}
  labels:
    {{- include "mzmon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: alloy-gateway
  annotations:
    {{- include "mzmon.annotations" $ | nindent 4 }}
data:
  {{- tpl ( toYaml .Values.pipeline.env ) $ | nindent 2 }}
  {{- $kubelet := .Values.pipeline.metrics.kubelet }}
  GATEWAY_CADVISOR_SCRAPE_INTERVAL: {{ $kubelet.scrapeInterval | quote }}
  {{- /* Rendered as a JSON literal because the pipeline unwraps it with
         `encoding.from_json` — sys.env yields a string and the attribute wants
         a bool. */}}
  GATEWAY_KUBELET_TLS_INSECURE: {{ $kubelet.tlsInsecureSkipVerify | toJson | quote }}
  {{- $lokiDest := .Values.pipeline.logging.gateway.destination.loki }}
  {{- if $lokiDest.enabled }}
  GATEWAY_LOKI_DEST: {{ include "mzmon.alloy.destUrl" ( dict "url" ( tpl $lokiDest.url $ ) "tls" $lokiDest.tls ) | quote }}
    {{- if eq $lokiDest.authType "none" }}
    {{- else if eq $lokiDest.authType "basicAuth" }}
      {{- if $lokiDest.basicAuth.username }}
  {{ $lokiDest.basicAuth.usernameEnv }}: {{ tpl $lokiDest.basicAuth.username $ | quote }}
      {{- end }}
      {{- if $lokiDest.basicAuth.password }}
  {{ $lokiDest.basicAuth.passwordEnv }}: {{ tpl $lokiDest.basicAuth.password $ | quote }}
      {{- end }}
    {{- else if eq $lokiDest.authType "bearer" }}
      {{- if $lokiDest.bearer.token }}
  {{ $lokiDest.bearer.tokenEnv }}: {{ tpl $lokiDest.bearer.token $ | quote }}
      {{- end }}
    {{- else }}
      {{- printf "Unsupported .Values.pipeline.logging.gateway.destination.loki.authType (%s)" $lokiDest.authType | fail }}
    {{- end }}
  {{- end }}
  {{- /* </lokiDest> */}}

  {{- /* One block of variables per named remote-write destination. The names are
         resolved by the same helper the pipeline uses, so the variable this
         writes and the variable `sys.env(...)` reads cannot drift. */}}
  {{- range $promDest := ( include "mzmon.alloyGateway.promDests" $ | fromYamlArray ) }}
    {{- if $promDest.enabled }}
  {{ $promDest.urlEnv }}: {{ include "mzmon.alloy.destUrl" ( dict "url" ( tpl $promDest.url $ ) "tls" $promDest.tls ) | quote }}
      {{- if eq $promDest.authType "none" }}
      {{- else if eq $promDest.authType "basicAuth" }}
        {{- if $promDest.basicAuth.username }}
  {{ $promDest.basicAuth.usernameEnv }}: {{ tpl $promDest.basicAuth.username $ | quote }}
        {{- end }}
        {{- if $promDest.basicAuth.password }}
  {{ $promDest.basicAuth.passwordEnv }}: {{ tpl $promDest.basicAuth.password $ | quote }}
        {{- end }}
      {{- else if eq $promDest.authType "bearer" }}
        {{- if $promDest.bearer.token }}
  {{ $promDest.bearer.tokenEnv }}: {{ tpl $promDest.bearer.token $ | quote }}
        {{- end }}
      {{- else if eq $promDest.authType "sigv4" }}
        {{- /* SigV4 signs with ambient AWS credentials (IRSA); region/roleArn go
               straight into the alloy config, so no env secrets are needed here. */}}
      {{- else }}
        {{- printf "Unsupported .Values.pipeline.metrics.gateway.destination.prometheusRemoteWrite.%s.authType (%s)" $promDest.name $promDest.authType | fail }}
      {{- end }}

  {{ $promDest.unfilteredMetricsEnv }}: {{ include "mzmon.alloyGateway.metricFilter" ( dict
      "context" $
      "minMetricImportance" $promDest.minMetricImportance
    ) | quote }}
    {{- end }}
  {{- end }}
  {{- /* </promDests> */}}

  {{- $tenancy := $.Values.pipeline.logging.tenancy | required "pipeline.logging.tenancy is required" }}
  GATEWAY_STATIC_TENANT: {{ $tenancy.staticTenant | quote }}
  {{- if hasPrefix $tenancy.tenantLabel "__meta_kubernetes" }}
  GATEWAY_TENANT_LABEL: {{ $tenancy.tenantLabel | quote }}
  {{- else }}
  GATEWAY_TENANT_LABEL: __meta_kubernetes_pod_label_{{ $tenancy.tenantLabel | replace "/" "_" | replace "." "_" | quote }}
  {{- end }}
  GATEWAY_TENANT_MAP_INFRA: {{ $tenancy.tenantMap.infra | quote }}
  GATEWAY_TENANT_MAP_AUDIT: {{ $tenancy.tenantMap.audit | quote }}
  GATEWAY_TENANT_MAP_ENVIRONMENT: {{ $tenancy.tenantMap.environment | quote }}

  {{- if .Values.pipeline.metrics.gateway.denyMetrics }}
  GATEWAY_DENY_METRICS: {{ .Values.pipeline.metrics.gateway.denyMetrics | join "|" | quote }}
  {{- end }}

  {{- $otelDestValues := $.Values.pipeline.metrics.gateway.destination.otel }}
  {{- if ( include "mzmon.alloyGateway.otelDest.enabled" $ ) }}
    {{- if $otelDestValues.otlpExporter.enabled }}
  {{ $otelDestValues.otlpExporter.unfilteredMetricsEnv }}: {{ include "mzmon.alloyGateway.metricFilter" ( dict
      "context" $
      "minMetricImportance" $otelDestValues.otlpExporter.minMetricImportance
    ) | quote }}
    {{- end }}
    {{- if $otelDestValues.googleCloudExporter.enabled }}
  {{ $otelDestValues.googleCloudExporter.unfilteredMetricsEnv }}: {{ include "mzmon.alloyGateway.metricFilter" ( dict
      "context" $
      "minMetricImportance" $otelDestValues.googleCloudExporter.minMetricImportance
    ) | quote }}
    {{- end }}
    {{- if $otelDestValues.datadogExporter.enabled }}
  {{ $otelDestValues.datadogExporter.unfilteredMetricsEnv }}: {{ include "mzmon.alloyGateway.metricFilter" ( dict
      "context" $
      "minMetricImportance" $otelDestValues.datadogExporter.minMetricImportance
    ) | quote }}
    {{- end }}
  {{- end }}
  {{/* </otelDestValues> */}}
{{- end }}
