{{- if ( include "mzmon.alloyGateway.enabled" $ ) }}
{{- $fullname := printf "%s-%s" ( include "mzmon.fullname" $ ) "alloy-gateway-env" }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ $fullname }}
  namespace: {{ include "mzmon.alloyGateway.namespace" $ }}
  labels:
    {{- include "mzmon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: alloy-gateway
  annotations:
    {{- include "mzmon.annotations" $ | nindent 4 }}
data:
  {{- tpl ( toYaml .Values.pipeline.env ) $ | nindent 2 }}
  {{- $kubelet := .Values.pipeline.metrics.kubelet }}
  GATEWAY_CADVISOR_SCRAPE_INTERVAL: {{ $kubelet.scrapeInterval | quote }}
  {{- /* Rendered as a JSON literal because the pipeline unwraps it with
         `encoding.from_json` — sys.env yields a string and the attribute wants
         a bool. */}}
  GATEWAY_KUBELET_TLS_INSECURE: {{ $kubelet.tlsInsecureSkipVerify | toJson | quote }}
  {{- $kubeProxy := .Values.pipeline.metrics.kubeProxy }}
  GATEWAY_KUBE_PROXY_SCRAPE_INTERVAL: {{ $kubeProxy.scrapeInterval | quote }}
  {{- /* `on` scans every line in both tiers. A rate already in pipeline.env
         wins, which is how an install scans only part of the bulk tier, and
         keeps the key from being written twice. */}}
  {{- if eq ( include "mzmon.secretFilter.mode" $ ) "on" }}
    {{- range $key := list "GATEWAY_SECRETFILTER_RATE" "GATEWAY_SECRETFILTER_BULK_RATE" }}
      {{- if not ( hasKey ( $.Values.pipeline.env | default dict ) $key ) }}
  {{ $key }}: "1"
      {{- end }}
    {{- end }}
  {{- end }}
  {{- /* The destinations' variables, from the helper the validator checks for
         duplicate keys. */}}
  {{- range $entry := ( include "mzmon.destinations.envEntries" $ | fromYamlArray ) }}
  {{ $entry.key }}: {{ $entry.value | quote }}
  {{- end }}
  {{- /* </logDests> */}}



  {{- $tenancy := $.Values.pipeline.logging.tenancy | required "pipeline.logging.tenancy is required" }}
  GATEWAY_STATIC_TENANT: {{ $tenancy.staticTenant | quote }}
  {{- if hasPrefix $tenancy.tenantLabel "__meta_kubernetes" }}
  GATEWAY_TENANT_LABEL: {{ $tenancy.tenantLabel | quote }}
  {{- else }}
  GATEWAY_TENANT_LABEL: __meta_kubernetes_pod_label_{{ $tenancy.tenantLabel | replace "/" "_" | replace "." "_" | quote }}
  {{- end }}
  GATEWAY_TENANT_MAP_INFRA: {{ $tenancy.tenantMap.infra | quote }}
  GATEWAY_TENANT_MAP_AUDIT: {{ $tenancy.tenantMap.audit | quote }}
  GATEWAY_TENANT_MAP_ENVIRONMENT: {{ $tenancy.tenantMap.environment | quote }}

  {{- if .Values.pipeline.metrics.gateway.denyMetrics }}
  GATEWAY_DENY_METRICS: {{ .Values.pipeline.metrics.gateway.denyMetrics | join "|" | quote }}
  {{- end }}

  {{- $otelDestValues := $.Values.pipeline.metrics.gateway.destination.otel }}
  {{- if ( include "mzmon.alloyGateway.otelDest.enabled" $ ) }}
    {{- if $otelDestValues.otlpExporter.enabled }}
  {{ $otelDestValues.otlpExporter.unfilteredMetricsEnv }}: {{ include "mzmon.alloyGateway.metricFilter" ( dict
      "context" $
      "minMetricImportance" $otelDestValues.otlpExporter.minMetricImportance
    ) | quote }}
    {{- end }}
    {{- if $otelDestValues.googleCloudExporter.enabled }}
  {{ $otelDestValues.googleCloudExporter.unfilteredMetricsEnv }}: {{ include "mzmon.alloyGateway.metricFilter" ( dict
      "context" $
      "minMetricImportance" $otelDestValues.googleCloudExporter.minMetricImportance
    ) | quote }}
    {{- end }}
    {{- if $otelDestValues.datadogExporter.enabled }}
  {{ $otelDestValues.datadogExporter.unfilteredMetricsEnv }}: {{ include "mzmon.alloyGateway.metricFilter" ( dict
      "context" $
      "minMetricImportance" $otelDestValues.datadogExporter.minMetricImportance
    ) | quote }}
    {{- end }}
  {{- end }}
  {{/* </otelDestValues> */}}
{{- end }}
