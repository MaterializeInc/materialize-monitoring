{{- /*
The bundled PromQL alerting rules, as PrometheusRule resources.

The rules are rendered at build time from the query registry into
`pre-rendered/rules/prometheus/` (`mz-monitoring-build gen-rules`), one file per
registry file. Each file is filled in and filtered by `mzmon.rules.groups`, and
whatever is left is emitted as one PrometheusRule. A file with nothing left
emits nothing.

The one consumer of a PrometheusRule in this stack is the Thanos ruler's import
sidecar (`thanos.ruler.autoImportPrometheusRules`); a Prometheus Operator in the
same cluster would also pick these up, which is what the `part-of` label is for.
The LogQL rules are not PrometheusRules, for the same reason: every consumer of
the kind parses its expressions as PromQL. They go to the Loki ruler from
`lokirules.yaml`.
*/}}
{{- if .Values.rules.enabled }}
{{- range $path, $_ := $.Files.Glob "pre-rendered/rules/prometheus/*.yaml" }}
  {{- $file := base $path }}
  {{- $doc := include "mzmon.rules.groups" ( dict "root" $ "path" $path ) | fromYaml }}
  {{- if $doc.groups }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-%s" ( include "mzmon.fullname" $ ) ( trimSuffix ".yaml" $file ) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "mzmon.namespace" $ }}
  labels:
    {{- include "mzmon.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: materialize-monitoring
    app.kubernetes.io/component: alerting-rules
spec:
  groups:
    {{- toYaml $doc.groups | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
