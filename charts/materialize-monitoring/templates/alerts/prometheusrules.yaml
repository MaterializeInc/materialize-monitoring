{{- /*
The bundled PromQL alerting and recording rules, as PrometheusRule resources.

The rules are rendered at build time from the query registry into
`pre-rendered/rules/prometheus/` (`mz-monitoring-build gen-rules`), one file per
registry file. Each file is filled in and filtered by `mzmon.rules.groups`, and
whatever is left is emitted as one PrometheusRule. A file with nothing left
emits nothing. One holding only recording rules is labelled
`app.kubernetes.io/component: recording-rules`.

These are read by the Thanos ruler's import sidecar
(`thanos.ruler.autoImportPrometheusRules`); a Prometheus Operator in the same
cluster would also pick these up, which is what the `part-of` label is for. Each
carries `mzmon.materialize.cloud/flavor: promql`. The LogQL rules are
PrometheusRules too, labelled `logql`, which the importer's selector leaves out
(`lokirules.yaml`).
*/}}
{{- if .Values.rules.enabled }}
{{- range $path, $_ := $.Files.Glob "pre-rendered/rules/prometheus/*.yaml" }}
  {{- $file := base $path }}
  {{- $doc := include "mzmon.rules.groups" ( dict "root" $ "path" $path ) | fromYaml }}
  {{- if $doc.groups }}
    {{- $component := "recording-rules" }}
    {{- range $doc.groups }}
      {{- range .rules }}
        {{- if .alert }}
          {{- $component = "alerting-rules" }}
        {{- end }}
      {{- end }}
    {{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-%s" ( include "mzmon.fullname" $ ) ( trimSuffix ".yaml" $file ) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "mzmon.namespace" $ }}
  labels:
    {{- include "mzmon.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: materialize-monitoring
    app.kubernetes.io/component: {{ $component }}
    {{ include "mzmon.rules.flavorLabel" $ }}: promql
spec:
  groups:
    {{- toYaml $doc.groups | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
