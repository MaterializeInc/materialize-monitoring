{{- /*
The bundled LogQL alerting rules, as ConfigMaps the Loki ruler loads.

The rules are rendered at build time from the query registry into
`pre-rendered/rules/loki/` (`mz-monitoring-build gen-rules`), one file per
registry file, and filled in and filtered by `mzmon.rules.groups` exactly as the
PromQL rules are.

**Delivery is the Loki subchart's rules sidecar.** It watches ConfigMaps in the
Loki namespace carrying `loki.sidecar.rules.label`, and writes each one's data
into `loki.sidecar.rules.folder`, under the subdirectory its
`loki.sidecar.rules.folderAnnotation` names. The ruler reads that folder as a
local rule store, where a subdirectory is a tenant and a file in it is a rule
namespace (`loki.loki.rulerConfig.storage`). So each file is emitted once per
tenant in `mzmon.rules.logTenants`, annotated with the tenant.

A PrometheusRule is not used, although the file format is the same: the Thanos
ruler's import sidecar reads every PrometheusRule in the cluster as PromQL, and
so does a Prometheus Operator's admission webhook, which would refuse the object.

The files are read as data and never passed through `tpl`; see
`mzmon.rules.groups`.
*/}}
{{- if and .Values.rules.enabled ( include "mzmon.loki.ruler.enabled" $ ) }}
{{- $sidecar := $.Values.loki.sidecar.rules }}
{{- $tenants := include "mzmon.rules.logTenants" $ | fromYamlArray }}
{{- range $path, $_ := $.Files.Glob "pre-rendered/rules/loki/*.yaml" }}
  {{- $file := base $path }}
  {{- $doc := include "mzmon.rules.groups" ( dict "root" $ "path" $path ) | fromYaml }}
  {{- if $doc.groups }}
    {{- range $tenant := $tenants }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- /* A tenant id may hold characters an object name may not. The name only
         has to be unique; the annotation carries the tenant as written. */}}
  name: {{ printf "%s-%s-%s" ( include "mzmon.fullname" $ ) ( trimSuffix ".yaml" $file ) ( regexReplaceAll "[^a-z0-9-]+" ( lower $tenant ) "-" ) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "mzmon.loki.namespace" $ }}
  labels:
    {{- include "mzmon.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: materialize-monitoring
    app.kubernetes.io/component: alerting-rules
    {{ $sidecar.label }}: {{ $sidecar.labelValue | default "" | quote }}
  annotations:
    {{- include "mzmon.annotations" $ | nindent 4 }}
    {{ $sidecar.folderAnnotation }}: {{ $tenant | quote }}
data:
  {{ $file }}: |
    {{- toYaml $doc | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
