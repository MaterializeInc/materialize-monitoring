{{- /*
The bundled Alertmanager's configuration, rendered from `alerting`.

**This exists because the subchart cannot compute its configuration.** It renders
`alertmanager.config` into a ConfigMap with `toYaml` and no `tpl`, and the
severity presets, the receiver classes and the checks in
`mzmon.alertmanager.validate` all need computing. So `alertmanager.config.enabled`
is off and the StatefulSet mounts this Secret instead, through
`alertmanager.extraVolumes`, with `alertmanager.extraArgs.config.file` pointing at
it. See `mzmon.alertmanager.config` for the shape of the routing tree.

A Secret rather than a ConfigMap, although `alerting.assertNoInlineCredentials`
keeps credentials out of it by default: a deployment that turns the check off
still gets a configuration that is not readable to everything that can list
ConfigMaps.

The name is static because `alertmanager.extraVolumes` is rendered by the
subchart through `toYaml`, so it cannot follow the release name. Changes reach
the running replicas through the config-reloader sidecar, not a restart: the
subchart's pod-template checksum covers only the ConfigMap it no longer renders.
*/}}
{{- if ( include "mzmon.alertmanager.enabled" $ ) }}
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: {{ include "mzmon.alertmanager.namespace" $ }}
  labels:
    {{- include "mzmon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: alertmanager
  annotations:
    {{- include "mzmon.annotations" $ | nindent 4 }}
type: Opaque
stringData:
  alertmanager.yml: |
    {{- include "mzmon.alertmanager.config" $ | nindent 4 }}
  {{- /* Read by Alertmanager when `alertmanager.extraArgs.web.config.file` names
         it, and by `amtool` from `/etc/amtool`. Neither matches the `*.tmpl`
         glob the configuration loads templates from. */}}
  web.yml: |
    {{- include "mzmon.alertmanager.webConfig" $ | nindent 4 }}
  amtool.yml: |
    {{- include "mzmon.alertmanager.amtoolConfig" $ | nindent 4 }}
  amtool-http.yml: |
    {{- include "mzmon.alertmanager.amtoolHTTPConfig" $ | nindent 4 }}
  {{- range $name := keys ( $.Values.alerting.templates | default dict ) | sortAlpha }}
  {{ $name }}: |
    {{- index $.Values.alerting.templates $name | nindent 4 }}
  {{- end }}
{{- end }}
