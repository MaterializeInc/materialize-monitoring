apiVersion: v2
name: materialize-monitoring-dashboards-meta
description: |
  Grafana dashboards for Materialize Monitoring: the meta-monitoring set.
  Installs the dashboards that watch the monitoring stack itself — Alloy, Loki,
  and Thanos — into a Grafana provisioned by the materialize-monitoring chart.
  Installs nothing else.
type: application
version: 0.20.0
appVersion: "0.0.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/MaterializeInc/materialize-monitoring
sources:
  - https://github.com/MaterializeInc/materialize-monitoring
maintainers:
  - name: Materialize
    email: support@materialize.com
    url: https://materialize.com
keywords:
  - materialize
  - observability
  - monitoring
  - grafana
  - dashboards
  - meta-monitoring
dependencies:
  # The templates shared by the dashboards charts. `charts/dashboards-common` is a
  # symlink to `charts/_dashboards-common`, which `helm package` follows, so the
  # packaged chart carries its own copy and needs no `helm dependency build`.
  - name: dashboards-common
    version: 0.1.0
    repository: file://../_dashboards-common
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Split out of materialize-monitoring-dashboards.

# One of three dashboards charts, one per Grafana folder; this one carries the
# `meta-o11y` folder. Why there are three, and how they share a version stream,
# is in `materialize-monitoring-dashboards/Chart.yaml`.
