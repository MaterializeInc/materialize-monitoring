apiVersion: v2
name: materialize-monitoring-crds
description: |
  CRDs for Materialize Monitoring components.
  This does not install any additional resources other than CRDs.
type: application
version: 0.4.0
appVersion: "0.0.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/MaterializeInc/materialize-monitoring
sources:
  - https://github.com/MaterializeInc/materialize-monitoring
maintainers:
  - name: Materialize
    email: support@materialize.com
    url: https://materialize.com
keywords:
  - materialize
  - observability
  - monitoring
  - prometheus
  - crds
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Initial CRD chart skeleton.


# Subchart sourcing
# -----------------
# Upstream CRD charts are pulled from an OCI registry where one exists.
#
# The Grafana Operator publishes no standalone CRDs chart — its CRDs ship
# inside the operator chart and cannot be turned off there, only moved
# between `templates/` and `crds/` via `crds.immutable`. The main chart pins
# `grafana-operator.crds.immutable=true` so they stay out of its release
# manifest, and we vendor a deflated copy here (a local subchart resolved by
# path) so this chart owns their lifecycle. Regenerate that copy with
# `make grafana-operator-crds` after bumping the vendored operator.
dependencies:
  - name: prometheus-operator-crds
    version: "^29.0.0"
    repository: oci://ghcr.io/prometheus-community/charts
    condition: prometheus-operator-crds.enabled
    tags:
      - crds
      - prometheus-operator-crds
  - name: grafana-operator-crds
    version: "0.0.0"
    repository: ""
    condition: grafana-operator-crds.enabled
    tags:
      - crds
      - grafana-operator-crds
