# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: grafana-operator CRDs subchart
chart:
  version: 1.2.3
  appVersion: 4.5.6
release:
  name: test-mon-crds
  revision: 1
  namespace: test-monitoring
tests:
  - it: should render the Grafana CRD with the keep policy
    template: ../charts/grafana-operator-crds/templates/crd-grafanas.yaml
    asserts:
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: grafanas.grafana.integreatly.org
      # The keep policy is what stops `helm uninstall` from cascading into
      # every Grafana custom resource in the cluster.
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.group
          value: grafana.integreatly.org

  - it: should render the GrafanaDashboard CRD
    template: ../charts/grafana-operator-crds/templates/crd-grafanadashboards.yaml
    asserts:
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: grafanadashboards.grafana.integreatly.org

  - it: should honor the per-CRD toggle
    set:
      grafana-operator-crds.crds.grafanas.enabled: false
    template: ../charts/grafana-operator-crds/templates/crd-grafanas.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should honor an annotation override
    set:
      grafana-operator-crds.crds.annotations:
        example.com/owner: platform
    template: ../charts/grafana-operator-crds/templates/crd-grafanafolders.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      # Overriding annotations must not clobber what upstream ships.
      - exists:
          path: metadata.annotations["controller-gen.kubebuilder.io/version"]
