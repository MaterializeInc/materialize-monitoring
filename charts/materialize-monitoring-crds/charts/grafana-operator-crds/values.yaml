# Settings for the Grafana Operator CRDs.
#
# The shape mirrors the upstream prometheus-operator-crds chart so both CRD
# sets are configured the same way from the parent chart:
#
#   grafana-operator-crds:
#     crds:
#       annotations: {...}
#       grafanas:
#         enabled: true
#
# templates/crd-*.yaml is generated by bin/extract-grafana-operator-crds.sh.
# The toggles below are hand-maintained; that script fails if this list drifts
# from what the vendored operator ships.
crds:
  # Annotations added to every CRD in this chart.
  annotations: {}

  # Grafana — a Grafana instance the operator reconciles.
  grafanas:
    enabled: true

  # GrafanaAlertRuleGroup — alert rules grouped for evaluation.
  grafanaalertrulegroups:
    enabled: true

  # GrafanaContactPoint — alerting notification targets.
  grafanacontactpoints:
    enabled: true

  # GrafanaDashboard — dashboards pushed into a Grafana instance.
  grafanadashboards:
    enabled: true

  # GrafanaDatasource — datasources pushed into a Grafana instance.
  grafanadatasources:
    enabled: true

  # GrafanaFolder — folders that dashboards and rules are filed under.
  grafanafolders:
    enabled: true

  # GrafanaLibraryPanel — reusable panels shared across dashboards.
  grafanalibrarypanels:
    enabled: true

  # GrafanaManifest — arbitrary Grafana API objects applied as manifests.
  grafanamanifests:
    enabled: true

  # GrafanaMuteTiming — recurring windows that suppress notifications.
  grafanamutetimings:
    enabled: true

  # GrafanaNotificationPolicy — the alerting notification tree.
  grafananotificationpolicies:
    enabled: true

  # GrafanaNotificationPolicyRoute — individual routes within that tree.
  grafananotificationpolicyroutes:
    enabled: true

  # GrafanaNotificationTemplate — message templates for notifications.
  grafananotificationtemplates:
    enabled: true

  # GrafanaServiceAccount — service accounts and tokens inside Grafana.
  grafanaserviceaccounts:
    enabled: true
