            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      min(mz_balancer_connection_accepting{materialize_cloud_organization_name=~"$environmentNameList"})
                    legendFormat: state
