apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: materialize
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-env-ingress
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    How users reach a Materialize environment.

    Rate, errors and latency at each hop: the cloud load balancer, where its metrics are pulled; balancerd, which every SQL and HTTPS connection passes through; the console, which serves the web app and forwards its API calls; and environmentd's SQL and HTTP APIs behind them both.
  editable: true
  elements:
    api-console-commands:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (application_name, status) (
                        rate(mz_adapter_commands{materialize_cloud_organization_name=~"$environmentNameList", application_name=~"web_console|web_console_shell"}[$__rate_interval])
                      )
                    legendFormat: "{{application_name}} {{status}}"
                    qryType: 1
                    query: |
                      sum by (application_name, status) (
                        rate(mz_adapter_commands{materialize_cloud_organization_name=~"$environmentNameList", application_name=~"web_console|web_console_shell"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **SQL commands the console ran per second, by part of the console and outcome.**

          **Nominal:** `web_console` is the console's own queries, which it runs to draw every page. `web_console_shell` is what users type into the SQL shell.

          **Degraded:** `error` from `web_console` is the console failing to load data, which users see as empty or broken pages. `error` from the shell is usually users' own SQL errors.
        id: 1049
        links: []
        title: Console SQL Commands
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: The console ran no SQL in this environment in this time range.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    api-console-latency:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(0.99,
                        sum by (le, application_name) (
                          rate(mz_time_to_first_row_seconds_bucket{materialize_cloud_organization_name=~"$environmentNameList", application_name=~"web_console|web_console_shell"}[$__rate_interval])
                        )
                      ) >= 0
                    legendFormat: "{{application_name}}"
                    qryType: 1
                    query: |
                      histogram_quantile(0.99,
                        sum by (le, application_name) (
                          rate(mz_time_to_first_row_seconds_bucket{materialize_cloud_organization_name=~"$environmentNameList", application_name=~"web_console|web_console_shell"}[$__rate_interval])
                        )
                      ) >= 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How long the slowest 1% of the console's queries take to return their first row.**

          **Nominal:** Steady for `web_console`, whose queries read Materialize's catalog. The shell follows whatever users run.

          **Degraded:** Slow `web_console` queries make every console page slow. They run on the `mz_catalog_server` cluster, so check its CPU first.
        id: 1050
        links: []
        title: Console Query Time to First Row (p99)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: The console ran no queries in this environment in this time range.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    api-http-errors:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (path, status) (rate(mz_http_requests_total{materialize_cloud_organization_name=~"$environmentNameList", source="external", status=~"5.."}[$__rate_interval]))
                    legendFormat: "{{path}} {{status}}"
                    qryType: 1
                    query: |
                      sum by (path, status) (rate(mz_http_requests_total{materialize_cloud_organization_name=~"$environmentNameList", source="external", status=~"5.."}[$__rate_interval]))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **HTTP API requests per second that environmentd answered with a server error, by path and status code.**

          **Nominal:** Zero.

          **Degraded:** environmentd itself failed the request. A query error is not a server error: `/api/sql` reports those inside a `200` response.
        id: 1045
        links: []
        title: HTTP Server Errors by Path
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: environmentd answered no HTTP request with a server error in this time range.
                unit: reqps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    api-http-requests:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (path) (rate(mz_http_requests_total{materialize_cloud_organization_name=~"$environmentNameList", source="external"}[$__rate_interval]))
                    legendFormat: "{{path}}"
                    qryType: 1
                    query: |
                      sum by (path) (rate(mz_http_requests_total{materialize_cloud_organization_name=~"$environmentNameList", source="external"}[$__rate_interval]))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **HTTP API requests environmentd served per second, by path.**

          **Nominal:** `/api/sql` is SQL over HTTP, from the console and from HTTP clients. `/api/experimental/sql` is a WebSocket upgrade, one per streaming session.

          Only requests that arrived through balancerd. The operator's own calls and the metric scrapes are left out.
        id: 1044
        links: []
        title: HTTP Requests by Path
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: No metrics from environmentd in this environment. Check the environment picker, and that Materialize is running.
                unit: reqps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    api-http-response:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(0.99,
                        sum by (le, path) (
                          rate(mz_http_request_duration_seconds_bucket{materialize_cloud_organization_name=~"$environmentNameList", source="external", path!="/api/experimental/sql"}[$__rate_interval])
                        )
                      ) >= 0
                    legendFormat: "{{path}}"
                    qryType: 1
                    query: |
                      histogram_quantile(0.99,
                        sum by (le, path) (
                          rate(mz_http_request_duration_seconds_bucket{materialize_cloud_organization_name=~"$environmentNameList", source="external", path!="/api/experimental/sql"}[$__rate_interval])
                        )
                      ) >= 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The time the slowest 1% of HTTP API requests take, by path.**

          **Nominal:** For `/api/sql`, the slowest queries clients run over HTTP.

          WebSocket upgrades are left out: their time is the handshake, not the session.
        id: 1046
        links: []
        title: HTTP Response Time (p99)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: No metrics from environmentd in this environment. Check the environment picker, and that Materialize is running.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    api-pgwire:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (status) (rate(mz_connection_status{materialize_cloud_organization_name=~"$environmentNameList", source="external"}[$__rate_interval]))
                    legendFormat: "{{status}}"
                    qryType: 1
                    query: |
                      sum by (status) (rate(mz_connection_status{materialize_cloud_organization_name=~"$environmentNameList", source="external"}[$__rate_interval]))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **SQL connections environmentd finished per second, by outcome, as environmentd counts them.**

          **Nominal:** Close to balancerd's `pgwire` rate on _Balancer -> Connection Outcomes_. Each SQL connection is one connection at each hop.

          environmentd's `error` is any connection that ended in an error, whichever side caused it, so it does not match balancerd's.
        id: 1048
        links: []
        title: SQL Connections Completed
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: No metrics from environmentd in this environment. Check the environment picker, and that Materialize is running.
                unit: cps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    api-sessions:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (session_type) (mz_active_sessions{materialize_cloud_organization_name=~"$environmentNameList"})
                    legendFormat: "{{session_type}}"
                    qryType: 1
                    query: |
                      sum by (session_type) (mz_active_sessions{materialize_cloud_organization_name=~"$environmentNameList"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Open SQL sessions, split into `system` (Materialize's internal probing — a few are always present) and `user` (client connections).**

          **Degraded:** A `user` count that climbs and never settles usually means a client is opening connections and never closing them; cross-check whether query activity rose to match, or whether connections are just accumulating idle.

          Environment-scoped — the cluster/replica selectors don't narrow it.
        id: 1047
        links: []
        title: Open Sessions
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                decimals: 0
                noValue: No metrics from environmentd in this environment. Check the environment picker, and that Materialize is running.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    balancer-accepting:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      min by (pod) (mz_balancer_connection_accepting{materialize_cloud_organization_name=~"$environmentNameList"})
                    legendFormat: "{{pod}}"
                    qryType: 1
                    query: |
                      min by (pod) (mz_balancer_connection_accepting{materialize_cloud_organization_name=~"$environmentNameList"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Whether each balancerd pod is in the load balancer's rotation: 1 in, 0 out.**

          **Nominal:** 1 everywhere, all the time.

          **Degraded:** A pod at 0 passed its high watermark. It keeps its connections and rejoins at its low watermark.
        id: 1030
        links: []
        title: Taking New Connections by Pod
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                max: 1
                min: 0
                noValue: balancerd does not report its capacity state. Older Materialize versions don't publish it.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    balancer-capacity:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (pod) (mz_balancer_connection_active{materialize_cloud_organization_name=~"$environmentNameList"})
                    legendFormat: "{{pod}}"
                    qryType: 1
                    query: |
                      sum by (pod) (mz_balancer_connection_active{materialize_cloud_organization_name=~"$environmentNameList"})
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(mz_balancer_connection_limit{materialize_cloud_organization_name=~"$environmentNameList"}) > 0
                    legendFormat: limit
                    qryType: 1
                    query: |
                      max(mz_balancer_connection_limit{materialize_cloud_organization_name=~"$environmentNameList"}) > 0
                  version: v0
                refId: query-1
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(mz_balancer_connection_high_watermark{materialize_cloud_organization_name=~"$environmentNameList"}) > 0
                    legendFormat: high watermark
                    qryType: 1
                    query: |
                      max(mz_balancer_connection_high_watermark{materialize_cloud_organization_name=~"$environmentNameList"}) > 0
                  version: v0
                refId: query-2
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(mz_balancer_connection_low_watermark{materialize_cloud_organization_name=~"$environmentNameList"}) > 0
                    legendFormat: low watermark
                    qryType: 1
                    query: |
                      max(mz_balancer_connection_low_watermark{materialize_cloud_organization_name=~"$environmentNameList"}) > 0
                  version: v0
                refId: query-3
            queryOptions: {}
            transformations: []
        description: |-
          **Each balancerd pod's open connections, against the limits it enforces.**

          **Nominal:** Well under the high watermark, where one is drawn. Without a limit or watermarks configured, only the pods are drawn.

          **Degraded:** A pod at its **high watermark** leaves the load balancer's rotation and takes no new connections until it falls to its **low watermark**. A pod at its **limit** refuses connections outright.

          The limit and the watermarks are the same on every pod.
        id: 1029
        links: []
        title: Open Connections Against the Limit
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: No metrics from balancerd in this environment. Check the environment picker, and that the balancerd PodMonitor is installed.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    balancer-lifetime:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(0.50,
                        sum by (le, source) (
                          rate(mz_balancer_connection_duration_seconds_bucket{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        )
                      ) >= 0
                    legendFormat: "{{source}} p50"
                    qryType: 1
                    query: |
                      histogram_quantile(0.50,
                        sum by (le, source) (
                          rate(mz_balancer_connection_duration_seconds_bucket{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        )
                      ) >= 0
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(0.99,
                        sum by (le, source) (
                          rate(mz_balancer_connection_duration_seconds_bucket{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        )
                      ) >= 0
                    legendFormat: "{{source}} p99"
                    qryType: 1
                    query: |
                      histogram_quantile(0.99,
                        sum by (le, source) (
                          rate(mz_balancer_connection_duration_seconds_bucket{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        )
                      ) >= 0
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **How long connections stay open, from accept to close, by protocol.**

          **Nominal:** Whatever the clients do. HTTP API calls last seconds, and pooled SQL connections last hours.

          **Degraded:** A sudden drop for `pgwire` while clients did not change means something is cutting sessions short: an environmentd restart, or a load balancer idle timeout shorter than the clients expect.

          Measured from one second up, so connections shorter than that all read as one second.
        id: 1034
        links: []
        title: Connection Lifetime
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: No connection timings from balancerd. Older Materialize versions don't publish them.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    balancer-logs:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        namespace=~"$mzNamespaceList",
                        app="balancerd",
                        level=~"WARN|WARNING|ERROR|CRITICAL|FATAL"
                      }
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **What balancerd logged at warning level or above.**

          **Nominal:** A shutdown notice each time a pod is replaced.

          **Degraded:** `failed to connect to upstream server` is environmentd refusing or not answering. Lines about the connection limit or the watermarks mark a pod running out of room.
        id: 1035
        links: []
        title: Warnings and Errors
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: balancerd logged no warnings or errors in this time range.
              overrides: []
            options:
              dedupStrategy: exact
              detailsMode: inline
              displayedFields: []
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: false
              wrapLogMessage: true
          version: ""
    balancer-open-by-pod:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (pod) (mz_balancer_connection_active{materialize_cloud_organization_name=~"$environmentNameList"})
                    legendFormat: "{{pod}}"
                    qryType: 1
                    query: |
                      sum by (pod) (mz_balancer_connection_active{materialize_cloud_organization_name=~"$environmentNameList"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Open connections on each balancerd pod.**

          **Nominal:** Roughly even. The load balancer in front spreads new connections across the pods.

          **Degraded:** One pod holding most of them is normal for a while after a pod restarts, because existing connections stay where they are. A lasting imbalance usually means the load balancer is not routing to every pod.
        id: 1027
        links: []
        title: Open Connections by Pod
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: No metrics from balancerd in this environment. Check the environment picker, and that the balancerd PodMonitor is installed.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ""
    balancer-outcomes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (source, status) (rate(mz_balancer_connection_status{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: "{{source}} {{status}}"
                    qryType: 1
                    query: |
