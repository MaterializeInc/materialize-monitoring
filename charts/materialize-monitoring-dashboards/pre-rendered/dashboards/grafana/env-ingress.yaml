                    query: |
                      min(mz_balancer_connection_accepting{materialize_cloud_organization_name=~"$environmentNameList"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Whether every balancerd pod is taking new connections.**

          **Nominal:** Accepting. Without connection watermarks configured, balancerd always is.

          **Degraded:** At least one balancerd pod has passed its high watermark and asked the load balancer to stop sending it new connections. Its existing connections carry on. The other pods take the new ones, so this is capacity running short rather than an outage, unless every pod is out.

          _Balancer -> Open Connections Against the Limit_ shows which pod, and how close the rest are.
        id: 1002
        links: []
        title: Taking New Connections
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                mappings:
                - options:
                    "1":
                      color: "#A2F49B"
                      index: 1
                      text: "Yes"
                  type: value
                - options:
                    "0":
                      color: "#F19903"
                      index: 2
                      text: At Capacity
                  type: value
                noValue: balancerd does not report its capacity state. Older Materialize versions don't publish it.
                thresholds:
                  mode: absolute
                  steps:
                  - color: "#F19903"
                    value: null
                  - color: "#A2F49B"
                    value: 1
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ""
