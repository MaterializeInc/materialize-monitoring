apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: materialize
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-env-consensus
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    The metadata database, as Materialize experiences it.

    Commits, failures, latency and connection pools, measured by the processes that use the database — the same on every database flavor. What the database itself reports is on the Infrastructure Cloud Provider dashboard.
  editable: true
  elements:
    ops-by-type:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (op) (
                        rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"consensus_.*"}[$__rate_interval])
                      )
                    legendFormat: '{{op}}'
                    qryType: 1
                    query: |
                      sum by (op) (
                        rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"consensus_.*"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Metadata database calls per second, by operation.**

          **Nominal:** `consensus_cas` — commits — is nearly all of it. `consensus_scan` reads a collection's recent history and `consensus_truncate` deletes history nothing needs any more, both at a few per second.

          **Degraded:** A step change in commits without a matching change in the number of collections usually means something is being rewritten in a loop — a collection that cannot settle.
        id: 1012
        links: []
        title: Operations by Type
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-bytes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (op) (
                        rate(mz_persist_external_bytes_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"consensus_.*"}[$__rate_interval])
                      )
                    legendFormat: '{{op}}'
                    qryType: 1
                    query: |
                      sum by (op) (
                        rate(mz_persist_external_bytes_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"consensus_.*"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Bytes per second exchanged with the metadata database, by operation.**

          **Nominal:** Small — the state record of a collection is kilobytes, not data. A commit writes one; a scan reads several.

          **Degraded:** Rising commit bytes with a steady commit rate means the state records themselves are growing, which the _State and Cleanup_ tab explains.
        id: 1014
        links: []
        title: Data Exchanged by Operation
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: Bps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-commit-latency-by-process:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      histogram_quantile(0.99,
                        sum by (le, app, cluster_environmentd_materialize_cloud_cluster_id) (
                          rate(mz_persist_external_op_latency_bucket{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval])
                        )
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      histogram_quantile(0.99,
                        sum by (le, app, cluster_environmentd_materialize_cloud_cluster_id) (
                          rate(mz_persist_external_op_latency_bucket{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval])
                        )
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                    legendFormat: '{{app}} {{cluster_name}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      histogram_quantile(0.99,
                        sum by (le, app, cluster_environmentd_materialize_cloud_cluster_id) (
                          rate(mz_persist_external_op_latency_bucket{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval])
                        )
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      histogram_quantile(0.99,
                        sum by (le, app, cluster_environmentd_materialize_cloud_cluster_id) (
                          rate(mz_persist_external_op_latency_bucket{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval])
                        )
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Slowest 1% of commits, by the process making them.**

          **Nominal:** Every process close to the others.

          **Degraded:** One process well above the rest is local to it — its network path, or its own pool running out of connections (compare _Connections -> Waiting for a Connection by Process_). All of them rising together is the database.
        id: 1016
        links: []
        title: Commit Latency by Process (p99)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-commits-by-process:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval])
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval])
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                    legendFormat: '{{app}} {{cluster_name}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval])
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval])
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Commits per second, by the process making them.**

          **Nominal:** environmentd and the system cluster (`mz_catalog_server`) commit continuously even with no user workload. User clusters add commits in proportion to the sources, tables and materialized views they maintain.

          **Degraded:** The process at the top is the one to look at when the database is busier than expected.
        id: 1013
        links: []
        title: Commits by Process
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-conflicts:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_cmd_cas_mismatch_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_cmd_cas_mismatch_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                    legendFormat: '{{app}} {{cluster_name}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_cmd_cas_mismatch_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_cmd_cas_mismatch_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Commits that lost a race with another writer and were retried, per second, by process.**

          **Nominal:** A trickle. Several processes write the same collections, so the odd conflict is expected and costs one retry.

          **Degraded:** A burst during an upgrade is the two generations overlapping, and stops when the old one is retired. A sustained high rate outside a rollout means two processes are fighting over the same collections — usually a replica that should have been shut down and was not.
        id: 1017
        links: []
        title: Write Conflicts by Process
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-mean-latency:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      (
                        sum by (op) (
                          rate(mz_persist_external_seconds{materialize_cloud_organization_name=~"$environmentNameList", op=~"consensus_.*"}[$__rate_interval])
                        )
                        /
                        sum by (op) (
                          rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"consensus_.*"}[$__rate_interval])
                        )
                      ) >= 0
                    legendFormat: '{{op}}'
                    qryType: 1
                    query: |
                      (
                        sum by (op) (
                          rate(mz_persist_external_seconds{materialize_cloud_organization_name=~"$environmentNameList", op=~"consensus_.*"}[$__rate_interval])
                        )
                        /
                        sum by (op) (
                          rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"consensus_.*"}[$__rate_interval])
                        )
                      ) >= 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Average time per metadata database call, by operation.**

          **Nominal:** Milliseconds, and similar across operations.

          **Degraded:** Truncate alone slowing down is the database struggling to delete — on PostgreSQL, usually a sign that autovacuum is behind on the table persist writes to.

          A mean hides the tail. The commit has a real percentile on _Commit Latency by Process (p99)_.
        id: 1015
        links: []
        title: Mean Latency by Operation
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-oracle-latency:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      (
                        sum by (op) (
                          rate(mz_ts_oracle_seconds{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        )
                        /
                        sum by (op) (
                          rate(mz_ts_oracle_started_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        )
                      ) >= 0
                    legendFormat: '{{op}}'
                    qryType: 1
                    query: |
                      (
                        sum by (op) (
                          rate(mz_ts_oracle_seconds{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        )
                        /
                        sum by (op) (
                          rate(mz_ts_oracle_started_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        )
                      ) >= 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Average time per timestamp oracle call, by operation.**

          **Nominal:** A millisecond or two.

          **Degraded:** Every `SELECT` waits for `read_ts`, so this adds directly to query latency. A rise here beside a rise in commit latency is the database; a rise here alone points at the oracle's own single connection pool, on _Connections_.
        id: 1020
        links: []
        title: Timestamp Oracle Latency (mean)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No timestamp oracle metrics. The oracle runs in environmentd, so check that it is up.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-oracle-ops:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (op) (
                        rate(mz_ts_oracle_started_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )
                    legendFormat: '{{op}}'
                    qryType: 1
                    query: |
                      sum by (op) (
                        rate(mz_ts_oracle_started_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Timestamp oracle calls per second, by operation.**

          **Nominal:** A few per second. `read_ts` is asked for by queries, `write_ts` and `apply_write` by writes.

          The timestamp oracle keeps the timestamps every query and write is assigned, in the metadata database. It runs in environmentd only, so a failure here stops queries and writes environment-wide rather than on one cluster.
        id: 1019
        links: []
        title: Timestamp Oracle Operations
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No timestamp oracle metrics. The oracle runs in environmentd, so check that it is up.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-retries:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (op) (
                        rate(mz_persist_retry_retries_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"fetch_state::scan|apply_unbatched_cmd::cas|gc::truncate|maybe_init::cas|consensus::open"}[$__rate_interval])
                      )
                    legendFormat: '{{op}}'
                    qryType: 1
                    query: |
                      sum by (op) (
                        rate(mz_persist_retry_retries_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"fetch_state::scan|apply_unbatched_cmd::cas|gc::truncate|maybe_init::cas|consensus::open"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (op) (
                        rate(mz_ts_oracle_retry_retries_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )
