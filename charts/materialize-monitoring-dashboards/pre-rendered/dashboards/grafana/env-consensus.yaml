                    expr: |
                      sum by (datname) (rate(cnpg_pg_stat_database_xact_commit{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                    legendFormat: '{{datname}} committed'
                    qryType: 1
                    query: |
                      sum by (datname) (rate(cnpg_pg_stat_database_xact_commit{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (datname) (rate(cnpg_pg_stat_database_xact_rollback{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                    legendFormat: '{{datname}} rolled back'
                    qryType: 1
                    query: |
                      sum by (datname) (rate(cnpg_pg_stat_database_xact_rollback{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Transactions committed and rolled back per second, by database.**

          **Nominal:** Materialize's database committing steadily — tens per second on an idle environment — and few rollbacks.

          **Degraded:** A commit rate well below Materialize's own count of commits means its calls are not arriving. Rising rollbacks on Materialize's database are usually commits that lost a race, which persist expects and retries.

          Compare with _Commits_ on the Overview tab, which is the same work counted by Materialize.
