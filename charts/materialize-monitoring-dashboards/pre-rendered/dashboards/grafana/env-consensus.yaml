apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: materialize
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-env-consensus
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    The metadata database, as Materialize experiences it.

    Commits, failures, latency and connection pools, measured by the processes that use the database — the same on every database flavor. What a CloudNativePG database reports about itself is on the Database Internals tab, and what a managed database's cloud provider reports is on the Infrastructure Cloud Provider dashboard.
  editable: true
  elements:
    cnpg-archive-failures:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (pod) (rate(cnpg_pg_stat_archiver_failed_count{pod=~"($cnpgClusterList)-[0-9]+"}[$__rate_interval]))
                    legendFormat: '{{pod}}'
                    qryType: 1
                    query: |
                      sum by (pod) (rate(cnpg_pg_stat_archiver_failed_count{pod=~"($cnpgClusterList)-[0-9]+"}[$__rate_interval]))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **WAL segments that failed to archive, per second.**

          **Nominal:** Zero, or no data where WAL archiving is not configured.

          **Degraded:** Failed archiving makes point-in-time recovery impossible past the last good segment, and keeps WAL on disk until it succeeds.
        id: 1048
        links: []
        title: WAL Archiving Failures
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cnpg-backup-age:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      time() - max(cnpg_collector_last_available_backup_timestamp{pod=~"($cnpgClusterList)-[0-9]+"} > 0)
                    legendFormat: age
                    qryType: 1
                    query: |
                      time() - max(cnpg_collector_last_available_backup_timestamp{pod=~"($cnpgClusterList)-[0-9]+"} > 0)
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Time since the most recent backup CNPG can restore from.**

          **Nominal:** Under the backup schedule's interval — typically under a day.

          **Degraded:** Older than the schedule means backups are failing. The metadata database cannot be rebuilt from object storage, so it is the backup that makes a lost database recoverable.

          Absent when the cluster has no completed backup, which is what a cluster with no backup configured reports.
        id: 1036
        links: []
        title: Last Backup
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#009988'
                  mode: shades
                min: 0
                noValue: No completed backup. CNPG reports none when backups are not configured.
                unit: s
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    cnpg-cache-hit:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      (
                        sum by (datname) (rate(cnpg_pg_stat_database_blks_hit{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval]))
                        / (
                            sum by (datname) (rate(cnpg_pg_stat_database_blks_hit{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval]))
                          + sum by (datname) (rate(cnpg_pg_stat_database_blks_read{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval]))
                        )
                      ) >= 0
                    legendFormat: '{{datname}}'
                    qryType: 1
                    query: |
                      (
                        sum by (datname) (rate(cnpg_pg_stat_database_blks_hit{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval]))
                        / (
                            sum by (datname) (rate(cnpg_pg_stat_database_blks_hit{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval]))
                          + sum by (datname) (rate(cnpg_pg_stat_database_blks_read{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval]))
                        )
                      ) >= 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The fraction of block reads served from PostgreSQL's shared buffers rather than from disk, by database.**

          **Nominal:** Close to 100%. The consensus table is small and hot, and should live in memory.

          **Degraded:** Well below 99% means reads are going to disk, so commits wait on I/O. The instance needs more memory, or its `shared_buffers` setting is smaller than the working set.
        id: 1043
        links: []
        title: Buffer Cache Hit Ratio
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                max: 1
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cnpg-connections-by-database:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (datname, usename) (cnpg_backends_total{pod=~"($cnpgClusterList)-[0-9]+"})
                    legendFormat: '{{datname}} ({{usename}})'
                    qryType: 1
                    query: |
                      sum by (datname, usename) (cnpg_backends_total{pod=~"($cnpgClusterList)-[0-9]+"})
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      min(
                          max by (pod) (cnpg_pg_settings_setting{pod=~"($cnpgClusterList)-[0-9]+", name="max_connections"})
                        - on (pod) sum by (pod) (cnpg_pg_settings_setting{pod=~"($cnpgClusterList)-[0-9]+", name=~"superuser_reserved_connections|reserved_connections"})
                      )
                    legendFormat: ceiling
                    qryType: 1
                    query: |
                      min(
                          max by (pod) (cnpg_pg_settings_setting{pod=~"($cnpgClusterList)-[0-9]+", name="max_connections"})
                        - on (pod) sum by (pod) (cnpg_pg_settings_setting{pod=~"($cnpgClusterList)-[0-9]+", name=~"superuser_reserved_connections|reserved_connections"})
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Client connections open on each instance, by database and role, beside the ceiling an ordinary role is refused at.**

          **Nominal:** Materialize's role holding nearly all of them, well under the ceiling.

          **Degraded:** Connections near the ceiling. If they are Materialize's, its pools have grown with the number of replicas; if they are another database's, something else is sharing the instance and Materialize is competing with it.

          Materialize's own count of the connections it holds is on the Connections tab, and should match its line here.
        id: 1038
        links: []
        title: Connections by Database and Role
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cnpg-connections-by-state:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (state) (cnpg_backends_total{pod=~"($cnpgClusterList)-[0-9]+"})
                    legendFormat: '{{state}}'
                    qryType: 1
                    query: |
                      sum by (state) (cnpg_backends_total{pod=~"($cnpgClusterList)-[0-9]+"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Client connections by what they are doing: running a statement (`active`), waiting for the next one (`idle`), or holding a transaction open between statements (`idle in transaction`).**

          **Nominal:** Mostly `idle`. A connection pool keeps connections open between uses.

          **Degraded:** `idle in transaction` that does not drain is a client holding a transaction open, which blocks vacuum and can hold locks. It is a different fault from too many connections, and the fix is in the client that opened it.
        id: 1039
        links: []
        title: Connections by State
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cnpg-connections-used:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(
                        sum by (pod) (cnpg_backends_total{pod=~"($cnpgClusterList)-[0-9]+"})
                        / on (pod) (
                            max by (pod) (cnpg_pg_settings_setting{pod=~"($cnpgClusterList)-[0-9]+", name="max_connections"})
                          - on (pod) sum by (pod) (cnpg_pg_settings_setting{pod=~"($cnpgClusterList)-[0-9]+", name=~"superuser_reserved_connections|reserved_connections"})
                        )
                      )
                    legendFormat: used
                    qryType: 1
                    query: |
                      max(
                        sum by (pod) (cnpg_backends_total{pod=~"($cnpgClusterList)-[0-9]+"})
                        / on (pod) (
                            max by (pod) (cnpg_pg_settings_setting{pod=~"($cnpgClusterList)-[0-9]+", name="max_connections"})
                          - on (pod) sum by (pod) (cnpg_pg_settings_setting{pod=~"($cnpgClusterList)-[0-9]+", name=~"superuser_reserved_connections|reserved_connections"})
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Client connections open on the primary, as a fraction of the connections an ordinary role may open.**

          **Nominal:** Well below 1. Materialize holds a pool of connections per process, so the count rises with every cluster replica added.

          **Degraded:** Above 80%, the next cluster scale-up or rollout — which briefly runs two generations of every process — can exhaust it.

          **Unhealthy:** At 1, PostgreSQL refuses new connections with `remaining connection slots are reserved`, and every Materialize process reports connection errors at once.

          The ceiling is `max_connections` less `superuser_reserved_connections` and `reserved_connections`, which is where an ordinary role is refused. Connections from every database on the instance count against it, not only Materialize's.
        id: 1033
        links: []
        title: Connections Used
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                max: 1
                min: 0
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#F19903'
                    value: 0.8
                  - color: '#AB0003'
                    value: 0.95
                unit: percentunit
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    cnpg-database-size:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (datname) (cnpg_pg_database_size_bytes{pod=~"($cnpgClusterList)-[0-9]+"})
                    legendFormat: '{{datname}}'
                    qryType: 1
                    query: |
                      max by (datname) (cnpg_pg_database_size_bytes{pod=~"($cnpgClusterList)-[0-9]+"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The size of each database on the instance.**

          **Nominal:** Materialize's database small and roughly flat: persist keeps only current state there, and the data itself is in object storage.

          **Degraded:** Materialize's database growing without bound means truncation has stopped. Another database growing is a neighbour consuming the volume — a full disk looks the same either way from outside the database, and this is what tells them apart.
        id: 1044
        links: []
        title: Size by Database
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                unit: bytes
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cnpg-not-serving:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      (count(cnpg_collector_up{pod=~"($cnpgClusterList)-[0-9]+"} == 0) or vector(0))
                      + (count(up{pod=~"($cnpgClusterList)-[0-9]+", container="postgres"} == 0) or vector(0))
                    legendFormat: instances
                    qryType: 1
                    query: |
                      (count(cnpg_collector_up{pod=~"($cnpgClusterList)-[0-9]+"} == 0) or vector(0))
                      + (count(up{pod=~"($cnpgClusterList)-[0-9]+", container="postgres"} == 0) or vector(0))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **PostgreSQL instances in the selected CNPG clusters that are not serving: the exporter cannot reach PostgreSQL, or cannot be scraped.**

          **Nominal:** Zero.

          **Unhealthy:** One or more instances is down. If it is the primary, Materialize's commits fail until CNPG promotes a replica; with a single instance, until the pod comes back.

          Counts both ways an instance can go dark: CNPG's own `cnpg_collector_up` reading 0, and the pod's metrics endpoint not answering at all.
        id: 1031
        links: []
        title: Instances Not Serving
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#FEDA8B'
                    value: 1
                  - color: '#FDB366'
                    value: 1
                  - color: '#F67E4B'
                    value: 1
                  - color: '#DD3D2D'
                    value: 1
                  - color: '#A50026'
                    value: 1
                unit: short
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    cnpg-oldest-transaction:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(cnpg_backends_max_tx_duration_seconds{pod=~"($cnpgClusterList)-[0-9]+"})
                    legendFormat: oldest
                    qryType: 1
                    query: |
                      max(cnpg_backends_max_tx_duration_seconds{pod=~"($cnpgClusterList)-[0-9]+"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How long the oldest open transaction on any instance has been running.**

          **Nominal:** Under a second. Persist's commits are single, short transactions.

          **Degraded:** Minutes. A long-running transaction holds back vacuum on every table, so the consensus table grows and every commit slows. It is usually something other than Materialize: a migration, a backup tool, or a session left `idle in transaction`.

          _Oldest Transaction by Database_ on this tab names the database and state it is in.
        id: 1034
        links: []
        title: Oldest Open Transaction
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#F19903'
                    value: 60
                  - color: '#AB0003'
                    value: 900
                unit: s
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    cnpg-primary:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (pod) (cnpg_pg_replication_in_recovery{pod=~"($cnpgClusterList)-[0-9]+"} == 0)
                    instant: true
                    legendFormat: '{{pod}}'
                    qryType: 1
                    query: |
                      max by (pod) (cnpg_pg_replication_in_recovery{pod=~"($cnpgClusterList)-[0-9]+"} == 0)
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations:
            - group: labelsToFields
              kind: Transformation
              spec:
                options: {}
        description: |-
          **The instance currently serving as primary — the only one that accepts Materialize's writes.**

          **Nominal:** One instance, which stays the same between maintenance windows.

          **Degraded:** A change of name is a switchover or a failover. Materialize reconnects on its own; expect a burst of connection errors on the other tabs at the same moment.

          **Unhealthy:** No instance at all means there is no primary, and nothing can commit.
        id: 1032
        links: []
        title: Primary
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#009988'
                  mode: shades
                noValue: No instance reports itself as primary.
              overrides: []
            options:
              colorMode: none
              graphMode: none
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                fields: /^pod$/
                values: false
              showPercentChange: false
              text:
                valueSize: 20
              textMode: value
              wideLayout: true
          version: ''
    cnpg-replication-lag:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (pod) (cnpg_pg_replication_lag{pod=~"($cnpgClusterList)-[0-9]+"})
                    legendFormat: '{{pod}}'
                    qryType: 1
                    query: |
                      max by (pod) (cnpg_pg_replication_lag{pod=~"($cnpgClusterList)-[0-9]+"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How far each replica is behind the primary, in seconds.**

          **Nominal:** Under a second. A cluster with one instance has no replicas and reads zero.

          **Degraded:** A replica that falls behind is a replica that would lose recent commits if it were promoted in a failover, or take longer to promote.

          Materialize reads and writes only the primary, so replica lag never slows it down directly.
        id: 1047
        links: []
        title: Replication Lag
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: The selected CNPG cluster has not reported this. Check the CNPG Cluster picker.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cnpg-rows:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (datname) (rate(cnpg_pg_stat_database_tup_inserted{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                    legendFormat: '{{datname}} inserted'
                    qryType: 1
                    query: |
                      sum by (datname) (rate(cnpg_pg_stat_database_tup_inserted{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (datname) (rate(cnpg_pg_stat_database_tup_updated{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                    legendFormat: '{{datname}} updated'
                    qryType: 1
                    query: |
                      sum by (datname) (rate(cnpg_pg_stat_database_tup_updated{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                  version: v0
                refId: query-1
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (datname) (rate(cnpg_pg_stat_database_tup_deleted{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                    legendFormat: '{{datname}} deleted'
                    qryType: 1
                    query: |
                      sum by (datname) (rate(cnpg_pg_stat_database_tup_deleted{pod=~"($cnpgClusterList)-[0-9]+", datname!=""}[$__rate_interval])) > 0
                  version: v0
                refId: query-2
            queryOptions: {}
            transformations: []
        description: |-
          **Rows inserted, updated and deleted per second, by database.**

          **Nominal:** A steady churn on Materialize's database. Every commit rewrites a small state record and truncation deletes the versions behind it, so deletes track inserts.

          **Degraded:** Inserts with no matching deletes means truncation has stopped and the consensus table is growing; _State and Cleanup_ shows it from Materialize's side. Heavy churn on another database is a neighbour competing for the same disk.
