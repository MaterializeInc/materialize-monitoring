            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      topk(10, max by (shard) (mz_persist_shard_seqnos_held{materialize_cloud_organization_name=~"$environmentNameList"}))
                    legendFormat: '{{shard}}'
                    qryType: 1
                    query: |
                      topk(10, max by (shard) (mz_persist_shard_seqnos_held{materialize_cloud_organization_name=~"$environmentNameList"}))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The ten objects holding the most old state versions, which cleanup cannot delete until whatever is reading them moves on.**

          **Nominal:** Hundreds at most, and moving.

          **Degraded:** An object whose count only ever grows has a reader stuck in the past: a subscription or a replica that is not keeping up, or one that went away without releasing its hold. Its hold is released when the reader's lease expires.

          Translate a shard id to an object with `SELECT o.name, o.type FROM mz_internal.mz_storage_shards s JOIN mz_objects o ON o.id = s.object_id WHERE s.shard_id = '<shard>'`.
        id: 1028
        links: []
        title: Versions Held by Object
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    state-lease-timeouts:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_lease_timeout_read{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: expired/s
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_lease_timeout_read{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Readers whose lease on an object expired, per second.**

          **Nominal:** Occasional, around restarts: a process that goes away without saying so has its leases expire instead.

          **Degraded:** Steady expirations with no restarts mean readers are being starved — a process too busy to renew its leases. Each expiry releases the old state versions that reader was holding, so this is also what un-sticks _Versions Held by Object_.
        id: 1030
        links: []
        title: Expired Reader Leases
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    state-live:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(max by (shard) (mz_persist_shard_gc_live_diffs{materialize_cloud_organization_name=~"$environmentNameList"}))
                    legendFormat: versions
                    qryType: 1
                    query: |
                      sum(max by (shard) (mz_persist_shard_gc_live_diffs{materialize_cloud_organization_name=~"$environmentNameList"}))
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **State versions currently stored in the metadata database, summed across every object — roughly the number of rows persist keeps there.**

          **Nominal:** Flat, at a few hundred per object.

          **Degraded:** Steady growth is the backlog that _Versions Written and Deleted_ shows as a gap. It is not urgent on its own, but it is the database's storage and vacuum load growing without anything new being stored.

          Measured at each object's last cleanup, so it moves in steps.
        id: 1027
        links: []
        title: Versions Stored
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#EE3377'
                  mode: shades
                decimals: 0
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: short
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    state-written-deleted:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_external_succeeded_count{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval]))
                    legendFormat: written
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_external_succeeded_count{materialize_cloud_organization_name=~"$environmentNameList", op="consensus_cas"}[$__rate_interval]))
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_external_consensus_truncated_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: deleted
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_external_consensus_truncated_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **State versions written to the metadata database per second, beside versions deleted.**

          **Nominal:** The two lines on top of each other: every commit adds a version, and cleanup deletes the ones nothing needs any more.

          **Degraded:** Written staying above deleted for hours means the table persist writes to is growing. The usual cause is a reader holding old versions — _Versions Held by Object_ names it. On PostgreSQL a growing table is also more work for autovacuum, which is how this eventually shows up as commit latency.
        id: 1026
        links: []
        title: Versions Written and Deleted
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: suffix:versions/s
              overrides: []
            options:
