    provisioning-stages:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      histogram_quantile(0.99,
                        sum by (type, le) (
                          increase(operator_nodeclaim_status_condition_transition_seconds_bucket{type=~"Launched|Registered|Initialized", karpenter_sh_nodepool=~"$karpenterNodePool"}[1h])
                        )
                      )
                    legendFormat: '{{type}}'
                    qryType: 1
                    query: |
                      histogram_quantile(0.99,
                        sum by (type, le) (
                          increase(operator_nodeclaim_status_condition_transition_seconds_bucket{type=~"Launched|Registered|Initialized", karpenter_sh_nodepool=~"$karpenterNodePool"}[1h])
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **How long NodeClaims took to reach each stage of launching, at the 99th percentile over the last hour.**

          `Launched` is EC2 accepting the request, `Registered` the node joining the cluster, and `Initialized` the node Ready with its startup taints removed. A slow `Registered` is usually the node's bootstrap; a missing one is a node that never joined.
        id: 1018
        links: []
        title: Node Launch Stages (p99)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No NodeClaims launched in the last hour
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
