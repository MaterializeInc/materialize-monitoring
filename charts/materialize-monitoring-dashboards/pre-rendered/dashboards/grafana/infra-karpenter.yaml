apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: infra
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-infra-karpenter
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    How Karpenter adds, replaces and removes the cluster's nodes on EKS.

    Launches and their errors, capacity EC2 refused, how long nodes take to join, what keeps nodes from being consolidated, and the controller's health. The cloud-agnostic view is Infrastructure Autoscaling.
  editable: true
  elements:
    controller-aws-errors:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (exported_service, action, code) (
                        rate(aws_sdk_go_request_total{app="karpenter", code!~"2..|412"}[$__rate_interval])
                      ) * 60 > 0
                    legendFormat: '{{exported_service}} {{action}} {{code}}'
                    qryType: 1
                    query: |
                      sum by (exported_service, action, code) (
                        rate(aws_sdk_go_request_total{app="karpenter", code!~"2..|412"}[$__rate_interval])
                      ) * 60 > 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **AWS API calls that did not succeed per minute, by service, action and status.**

          **Nominal:** A trickle of `400` on `DescribeLaunchTemplates`, which is Karpenter looking for a launch template before it creates it.

          **Degraded:** `403` is a permission Karpenter's IAM role lacks; `429` or `RequestLimitExceeded` is API throttling, often from something else in the account. `CreateFleet` errors are launches EC2 refused; the Provisioning tab's _EC2 Errors_ says why.

          `412` is left out: EC2 answers every dry run with it, and Karpenter dry runs `CreateFleet` and `RunInstances` to check its EC2NodeClasses. The SDK's own `service` label arrives as `exported_service`, since the scrape stamps the Kubernetes Service name on `service`.
        id: 1037
        links: []
        title: Failed AWS Calls per Minute
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No failed AWS calls
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    controller-cpu:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (pod) (
                        rate(container_cpu_usage_seconds_total{container="controller", pod=~"karpenter-.+"}[$__rate_interval])
                      )
                    legendFormat: '{{pod}}'
                    qryType: 1
                    query: |
                      sum by (pod) (
                        rate(container_cpu_usage_seconds_total{container="controller", pod=~"karpenter-.+"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **CPU each Karpenter replica uses, in cores.**

          The standby replica uses almost none.
        id: 1040
        links: []
        title: CPU by Replica
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: 'No metrics: cadvisor metrics are required (via kubelet)'
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    controller-kube-errors:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (method, code) (
                        rate(client_go_request_total{app="karpenter", code!~"2.."}[$__rate_interval])
                      ) * 60 > 0
                    legendFormat: '{{method}} {{code}}'
                    qryType: 1
                    query: |
                      sum by (method, code) (
                        rate(client_go_request_total{app="karpenter", code!~"2.."}[$__rate_interval])
                      ) * 60 > 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Kubernetes API calls that did not succeed per minute, by method and status.**

          **Nominal:** Near zero. `409` conflicts are an object changed underneath Karpenter, which it retries.

          **Degraded:** `429` is the API server throttling Karpenter; `5xx` an API server in trouble, which also shows as _Cluster State Synced_ dropping.
        id: 1038
        links: []
        title: Failed Kubernetes API Calls per Minute
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No failed Kubernetes API calls
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    controller-leader:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (pod) (leader_election_master_status{app="karpenter"})
                    legendFormat: '{{pod}}'
                    qryType: 1
                    query: |
                      max by (pod) (leader_election_master_status{app="karpenter"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Which Karpenter replica holds the leader lease.**

          Only the leader provisions and disrupts. A change of leader restarts its counters, and Karpenter spends a few seconds syncing its state.
        id: 1039
        links: []
        title: Leader
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                max: 1
                min: 0
                noValue: Karpenter has not reported this yet.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    controller-memory:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (pod) (container_memory_working_set_bytes{container="controller", pod=~"karpenter-.+"})
                    legendFormat: '{{pod}}'
                    qryType: 1
                    query: |
                      max by (pod) (container_memory_working_set_bytes{container="controller", pod=~"karpenter-.+"})
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (pod) (kube_pod_container_resource_limits{container="controller", pod=~"karpenter-.+", resource="memory"})
                    legendFormat: '{{pod}} limit'
                    qryType: 1
                    query: |
                      max by (pod) (kube_pod_container_resource_limits{container="controller", pod=~"karpenter-.+", resource="memory"})
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Memory each Karpenter replica holds, against its limit.**

          **Degraded:** The leader near its limit. Karpenter's memory grows with the number of nodes, pods and instance types it tracks, and an out-of-memory restart stops all provisioning while the standby takes over.
        id: 1041
        links: []
        title: Memory by Replica
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: 'No metrics: cadvisor and kube-state-metrics are required'
                unit: bytes
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    controller-no-karpenter:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries: []
            queryOptions: {}
            transformations: []
        description: Why this tab has no rows on it.
        id: 1042
        links: []
        title: Karpenter Not Detected
        vizConfig:
          group: text
          kind: VizConfig
          spec:
            fieldConfig:
              defaults: {}
              overrides: []
            options:
              code:
                language: plaintext
                showLineNumbers: false
                showMiniMap: false
              content: |-
                **Karpenter is not reporting on this cluster.**

                Karpenter adds nodes on EKS in the self-managed Terraform. GKE and AKS use their managed cluster autoscaler instead, which has no equivalent of this dashboard: **Infrastructure Autoscaling** covers every cloud.

                On EKS, this dashboard needs the ServiceMonitor that the Terraform `karpenter` module creates with `enable_service_monitor`, and the monitoring CRDs installed before Karpenter, which the examples' `monitoring-crds` module does. Karpenter's chart leaves the ServiceMonitor out when the CRDs are not there yet, and does not add it later on its own; re-apply once they are.
              mode: markdown
          version: ''
    controller-reconcile-errors:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (controller) (
                        rate(controller_runtime_reconcile_errors_total{app="karpenter"}[$__rate_interval])
                      ) * 60 > 0
                    legendFormat: '{{controller}}'
                    qryType: 1
                    query: |
                      sum by (controller) (
                        rate(controller_runtime_reconcile_errors_total{app="karpenter"}[$__rate_interval])
                      ) * 60 > 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Reconcile errors per minute, by controller.**

          **Nominal:** Near zero. A few are routine: an object changed while it was being reconciled, and the next attempt succeeds.

          **Degraded:** A controller erroring steadily. Its log lines, on the Events and Logs tab, carry the error.
        id: 1035
        links: []
        title: Reconcile Errors per Minute
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No reconcile errors
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    controller-workqueue:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (name) (workqueue_depth{app="karpenter"}) > 0
                    legendFormat: '{{name}}'
                    qryType: 1
                    query: |
                      max by (name) (workqueue_depth{app="karpenter"}) > 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Items waiting in each of Karpenter's work queues.**

          **Nominal:** Near zero.

          **Degraded:** A queue that grows and does not drain: that controller is behind.
        id: 1036
        links: []
        title: Work Queue Depth
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: Every queue is empty
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disruption-blocked:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (why) (
                        count_over_time(
                          {job="loki.source.kubernetes_events"}
                            | reportingcontroller="karpenter"
                            | reason=~"DisruptionBlocked|Unconsolidatable"
                            | line_format "{{.msg}}"
                            | regexp "^(?P<why>Pod has .karpenter.sh/do-not-disrupt. annotation|Pdb prevents pod evictions|NodePool .[^ ]+. has [a-z-]+ consolidation disabled|[A-Z][^(]+)"
                        [5m])
                      )
                    legendFormat: '{{why}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Why Karpenter is leaving nodes in place, from its `DisruptionBlocked` and `Unconsolidatable` events per five minutes.**

          **Nominal:** On a Materialize cluster, mostly the `do-not-disrupt` annotation: the operator marks every Materialize pod so, because moving a replica means rehydrating it. That is the design working, not a fault.

          **Degraded:** A PodDisruptionBudget blocking the same pods for hours holds nodes that could otherwise be removed or replaced, including drifted nodes that should be.

          Karpenter repeats these events every few minutes for every blocked node, so the numbers track how long, not how many.
        id: 1025
        links: []
        title: Why Disruption Is Blocked
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No blocked disruptions in this time range
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disruption-blocked-events:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {job="loki.source.kubernetes_events"}
                        | reportingcontroller="karpenter"
                        | reason=~"DisruptionBlocked|Unconsolidatable"
                        | line_format "{{.reason}} {{.kind}}/{{.name}} — {{.msg}}"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Karpenter's blocked-disruption events, newest first.**

          The message names the pod or PodDisruptionBudget holding each node.
        id: 1026
        links: []
        title: Blocked Disruption Events
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No blocked disruptions in this time range
              overrides: []
            options:
              dedupStrategy: signature
              detailsMode: inline
              displayedFields: []
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: false
              wrapLogMessage: true
          version: ''
    disruption-budget:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      min by (nodepool, reason) (karpenter_nodepools_allowed_disruptions{nodepool=~"$karpenterNodePool"})
                    legendFormat: '{{nodepool}} {{reason}}'
                    qryType: 1
                    query: |
                      min by (nodepool, reason) (karpenter_nodepools_allowed_disruptions{nodepool=~"$karpenterNodePool"})
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Nodes each NodePool's disruption budget allows removing right now, by reason.**

          Zero is a budget that allows none at the moment, by design or because nodes are already being disrupted.
        id: 1027
        links: []
        title: Disruptions the Budget Allows
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: Karpenter has not reported this yet.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disruption-decisions:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (reason, decision) (
                        rate(karpenter_voluntary_disruption_decisions_total[$__rate_interval])
                      ) * 3600
                    legendFormat: '{{reason}} {{decision}}'
                    qryType: 1
                    query: |
                      sum by (reason, decision) (
                        rate(karpenter_voluntary_disruption_decisions_total[$__rate_interval])
                      ) * 3600
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Disruptions Karpenter decided on per hour, by reason and action.**

          `delete` removes a node whose pods fit elsewhere; `replace` launches a cheaper or up-to-date node first.
        id: 1023
        links: []
        title: Disruption Decisions per Hour
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No disruption decisions
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disruption-disrupted:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (nodepool, reason) (
                        rate(karpenter_nodeclaims_disrupted_total{nodepool=~"$karpenterNodePool"}[$__rate_interval])
                      ) * 3600
                    legendFormat: '{{nodepool}} {{reason}}'
                    qryType: 1
                    query: |
                      sum by (nodepool, reason) (
                        rate(karpenter_nodeclaims_disrupted_total{nodepool=~"$karpenterNodePool"}[$__rate_interval])
                      ) * 3600
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **NodeClaims removed or replaced per hour, by NodePool and reason.**

          `empty` and `underutilized` are consolidation; `drifted` a node that no longer matches its NodePool or EC2NodeClass, such as after an AMI update; `expired` one past its NodePool's `expireAfter`; `interrupted` one AWS is reclaiming.
        id: 1022
        links: []
        title: NodeClaims Disrupted per Hour
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No nodes disrupted
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disruption-eligible:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (reason) (karpenter_voluntary_disruption_eligible_nodes)
                    legendFormat: '{{reason}}'
                    qryType: 1
                    query: |
                      max by (reason) (karpenter_voluntary_disruption_eligible_nodes)
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Nodes Karpenter considers candidates for disruption, by reason.**

          Candidates stay candidates while something blocks them. A count that stays high while _NodeClaims Disrupted_ stays at zero is a blocked disruption; _Why Disruption Is Blocked_ says by what.
        id: 1024
        links: []
        title: Nodes Eligible for Disruption
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: Karpenter has not reported this yet.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disruption-evictions:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (code) (rate(karpenter_nodes_eviction_requests_total[$__rate_interval])) * 60
                    legendFormat: '{{code}}'
                    qryType: 1
                    query: |
                      sum by (code) (rate(karpenter_nodes_eviction_requests_total[$__rate_interval])) * 60
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Pod evictions Karpenter requested per minute, by response.**

          **Nominal:** Mostly `200`, the eviction allowed.

          **Degraded:** `429` is an eviction a PodDisruptionBudget refused. Karpenter retries, and the node is not removed until the budget allows it.
        id: 1028
        links: []
        title: Eviction Requests per Minute
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No evictions requested
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    disruption-interruptions:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (message_type) (
                        rate(karpenter_interruption_received_messages_total[$__rate_interval])
                      ) * 3600
                    legendFormat: '{{message_type}}'
                    qryType: 1
                    query: |
                      sum by (message_type) (
