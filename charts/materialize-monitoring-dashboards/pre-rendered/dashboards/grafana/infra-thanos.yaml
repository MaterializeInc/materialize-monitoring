apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: meta-o11y
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-infra-thanos
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    Is the metrics store healthy, and if not, which part of it broke.

    The monitoring stack watching itself: remote writes into the receivers, queries through Thanos Query, the ruler, the compactor, and object storage, and any Thanos alert firing now. Thanos answers every panel here, so a dashboard that is empty throughout most likely means Thanos Query is down; the Logs tab reads Loki and still works.
  editable: true
  elements:
    logs-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        app="thanos",
                        namespace=~"$thanosNamespace",
                        component=~"$thanosComponent",
                        level=~"$logLevelList"
                      }
                        |~ "(?i)$logSearch"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Thanos's own log feed, newest first, for the selected components and levels.**

          These logs are stored in Loki, not Thanos, so this feed keeps working when Thanos does not. That makes it the place to start when every other panel is empty.
        id: 1063
        links: []
        title: All Logs
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No lines match the current filters
              overrides: []
            options:
              dedupStrategy: exact
              detailsMode: inline
              displayedFields: []
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: false
              wrapLogMessage: true
          version: ''
    logs-rate-by-component:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (component) (
                        rate(
                          {
                            app="thanos",
                            namespace=~"$thanosNamespace",
                            component=~"$thanosComponent",
                            level=~"$logLevelList"
                          }
                            |~ "(?i)$logSearch"
                          [$__auto]
                        )
                      )
                    legendFormat: '{{component}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Thanos's own log lines per second, split by component.**

          **Nominal:** A steady, low baseline.

          **Unhealthy:** A sharp step up confined to one component. That is a single process in a retry loop.
        id: 1059
        links: []
        title: Log Rate by Component
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No lines match the current filters
                unit: suffix:logs/s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    logs-warning-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        app="thanos",
                        namespace=~"$thanosNamespace",
                        component=~"$thanosComponent",
                        level=~"WARN|WARNING|ERROR|CRITICAL|FATAL"
                      }
                        != "PromQL info:"
                        |~ "(?i)$logSearch"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Warning-and-worse lines from Thanos, newest first.**

          **Nominal:** Quiet, apart from occasional retries.

          **Unhealthy:** A steady stream from one component. A compactor that halted logs the reason here once and then goes quiet, so look back to when it stopped.

          Independent of the level picker, like the other warning feeds in this repository.

          Leaves out the ruler's `PromQL info:` lines. The ruler logs PromQL's informational annotations at WARN, such as `rate()` over a counter whose name lacks `_total`, once per evaluation. On a reference install that is four lines a minute about rules that are working.
        id: 1062
        links: []
        title: Warnings and Errors
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No warnings in this time range
              overrides: []
            options:
              dedupStrategy: exact
              detailsMode: inline
              displayedFields: []
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: false
              wrapLogMessage: true
          version: ''
    logs-warning-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        rate(
                          {
                            app="thanos",
                            namespace=~"$thanosNamespace",
                            component=~"$thanosComponent",
                            level=~"WARN|WARNING|ERROR|CRITICAL|FATAL"
                          }
                            != "PromQL info:"
                            |~ "(?i)$logSearch"
                          [1m]
                        )
                      ) * 60
                    legendFormat: warnings/min
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Warning-and-worse lines per minute from Thanos, across the selected components.**

          **Nominal:** Zero, or close to it.

          **Unhealthy:** A sustained non-zero rate. The feed below says which component and why.

          Leaves out the ruler's `PromQL info:` lines, for the reason the warning feed gives.
        id: 1060
        links: []
        title: Warning Rate
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#33BBEE'
                  mode: shades
                min: 0
                noValue: No warnings in this time range
                unit: suffix:logs/min
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    overview-alert-history:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      count by (alertname) (
                        max by (alertname, job, pod) (
                          ALERTS{alertname=~"Thanos.*", alertstate="firing"}
                        )
                      )
                    legendFormat: '{{alertname}}'
                    qryType: 1
                    query: |
                      count by (alertname) (
                        max by (alertname, job, pod) (
                          ALERTS{alertname=~"Thanos.*", alertstate="firing"}
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Which Thanos alerts were firing over the selected time range.**

          **Nominal:** Empty.

          A line is the number of firing instances of that alert. Read it beside the tab that alert is about to see what changed when it started.
        id: 1007
        links: []
        title: Alerts Firing Over Time
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: No Thanos alert fired in this range
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    overview-alerts:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (alertname, alertstate, severity, job, pod) (
                        ALERTS{alertname=~"Thanos.*"}
                      )
                    format: table
                    instant: true
                    qryType: 2
                    query: |
                      max by (alertname, alertstate, severity, job, pod) (
                        ALERTS{alertname=~"Thanos.*"}
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations:
            - group: organize
              kind: Transformation
              spec:
                options:
                  excludeByName:
                    Time: true
                    Value: true
                  indexByName:
                    alertname: 0
                    alertstate: 1
                    job: 3
                    pod: 4
                    severity: 2
                  renameByName:
                    alertname: alert
                    alertstate: state
        description: |-
          **Every Thanos alert that is firing or pending now, with the process it is about.**

          **Nominal:** Empty.

          **Unhealthy:** Any firing row. A pending row has met its condition and is waiting out its `for` duration; it fires if the condition holds.

          The rules are the upstream Thanos mixin's, installed by the Thanos subchart. `ALERTS` carries a rule's labels and not its annotations, so the table has no runbook link. The mixin's runbook, <https://github.com/thanos-io/thanos/tree/main/mixin/runbook.md>, has a section for each alert name. Rows without a pod are about a whole component, such as a compactor that has not run.
        id: 1006
        links: []
        title: Alerts
        vizConfig:
          group: table
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  align: auto
                  filterable: true
                  inspect: false
                noValue: No Thanos alert is firing or pending, or none reached Thanos. The Ruler tab's Evaluation and Write-back rows say which.
              overrides:
              - matcher:
                  id: byName
                  options: severity
                properties:
                - id: noValue
                  value: —
              - matcher:
                  id: byName
                  options: job
                properties:
                - id: noValue
                  value: —
              - matcher:
                  id: byName
                  options: pod
                properties:
                - id: noValue
                  value: —
            options:
              cellHeight: sm
              footer:
                countRows: false
                reducer: []
                show: false
              frameIndex: 0
              showHeader: true
              showTypeIcons: false
          version: ''
    overview-alerts-firing:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      count(
                        max by (alertname, job, pod) (
                          ALERTS{alertname=~"Thanos.*", alertstate="firing"}
                        )
                      )
                      or
                      0 * (
                        (
                          time()
                          - max(
                            prometheus_rule_group_last_evaluation_timestamp_seconds{
                              app="thanos",
                              namespace=~"$thanosNamespace",
                              container="ruler"
                            }
                          )
                          < 300
                        )
                        and on ()
                        (
                          min(
                            max by (pod) (
                              prometheus_remote_storage_highest_timestamp_in_seconds{
                                app="thanos",
                                namespace=~"$thanosNamespace",
                                container="ruler"
                              }
                            )
                            - on (pod)
                            max by (pod) (
                              prometheus_remote_storage_queue_highest_sent_timestamp_seconds{
                                app="thanos",
                                namespace=~"$thanosNamespace",
                                container="ruler"
                              }
                            )
                          )
                          < 300
                        )
                      )
                    legendFormat: alerts
                    qryType: 1
                    query: |
                      count(
                        max by (alertname, job, pod) (
                          ALERTS{alertname=~"Thanos.*", alertstate="firing"}
                        )
                      )
                      or
                      0 * (
                        (
                          time()
                          - max(
                            prometheus_rule_group_last_evaluation_timestamp_seconds{
                              app="thanos",
                              namespace=~"$thanosNamespace",
                              container="ruler"
                            }
                          )
                          < 300
                        )
                        and on ()
                        (
                          min(
                            max by (pod) (
                              prometheus_remote_storage_highest_timestamp_in_seconds{
                                app="thanos",
                                namespace=~"$thanosNamespace",
                                container="ruler"
                              }
                            )
                            - on (pod)
                            max by (pod) (
                              prometheus_remote_storage_queue_highest_sent_timestamp_seconds{
                                app="thanos",
                                namespace=~"$thanosNamespace",
                                container="ruler"
                              }
                            )
                          )
                          < 300
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Thanos alerts firing now.**

          **Nominal:** Zero.

          **Unhealthy:** Any. _Alerts_ below names each one. The upstream Thanos mixin's runbook, <https://github.com/thanos-io/thanos/tree/main/mixin/runbook.md>, has a section for each alert name.

          Reads zero only while a ruler has evaluated a rule in the last five minutes and written its results back within five minutes. A ruler that has stopped evaluating fires nothing, and one whose write-back has stalled fires alerts that never reach Thanos, so either reads as no alerts. An empty reading means the alert path itself needs checking: _Ruler -> Evaluation_ and _Ruler -> Write-back_ say which part.
        id: 1000
        links: []
        title: Thanos Alerts Firing
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: No ruler has evaluated and written back in five minutes, so no alert can show. Check the Ruler tab.
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#FEDA8B'
                    value: 1
                  - color: '#FDB366'
                    value: 1.5
                  - color: '#F67E4B'
                    value: 2
                  - color: '#DD3D2D'
                    value: 2.5
                  - color: '#A50026'
                    value: 3
                unit: short
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    overview-compactor:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max(
                        thanos_compact_halted{
                          app="thanos",
                          namespace=~"$thanosNamespace",
                          container="compactor"
                        }
                      )
                    legendFormat: compactor
                    qryType: 1
                    query: |
                      max(
                        thanos_compact_halted{
                          app="thanos",
                          namespace=~"$thanosNamespace",
                          container="compactor"
                        }
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Whether the compactor has halted.**

          **Nominal:** Running.

          **Unhealthy:** Halted. The compactor stops for good on an error it does not risk repeating, most often overlapping blocks in the bucket. While it is halted, retention is not enforced and the bucket grows, and queries over long ranges read ever more small blocks. Its log names the cause, and a restart is needed after the cause is fixed.
        id: 1005
        links: []
        title: Compactor
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                mappings:
                - options:
                    '0':
                      color: '#A2F49B'
                      index: 1
                      text: Running
                  type: value
                - options:
                    '1':
                      color: '#AB0003'
                      index: 2
                      text: Halted
                  type: value
                noValue: Compactor not collected
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#AB0003'
                    value: 1
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    overview-components-down:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      count(
                        up{
                          app="thanos",
                          namespace=~"$thanosNamespace",
                          container=~"$thanosComponent"
                        } == 0
                      )
                      or
                      0 * count(
                        up{
                          app="thanos",
                          namespace=~"$thanosNamespace",
                          container=~"$thanosComponent"
                        }
                      )
                    legendFormat: processes
                    qryType: 1
                    query: |
                      count(
                        up{
                          app="thanos",
                          namespace=~"$thanosNamespace",
                          container=~"$thanosComponent"
                        } == 0
                      )
                      or
                      0 * count(
                        up{
                          app="thanos",
                          namespace=~"$thanosNamespace",
                          container=~"$thanosComponent"
                        }
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Thanos processes whose metrics endpoint the gateway cannot scrape.**

          **Nominal:** Zero.

          **Unhealthy:** Any. Every panel about that process is then empty, and an empty panel reads the same as a quiet one. _Collection Health_ below names it.
        id: 1001
        links: []
        title: Processes Down
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: No Thanos process found. Check the namespace picker.
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#FEDA8B'
                    value: 1
                  - color: '#FDB366'
                    value: 1.25
                  - color: '#F67E4B'
                    value: 1.5
                  - color: '#DD3D2D'
                    value: 1.75
                  - color: '#A50026'
                    value: 2
                unit: short
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    overview-query-errors:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      (
                        sum(
                          rate(
                            http_requests_total{
                              app="thanos",
                              namespace=~"$thanosNamespace",
                              container="query",
                              handler=~"query|query_range",
                              code=~"5.."
                            }
                            [$__rate_interval]
                          )
                        )
                        or
                        0 * sum(
                          rate(
                            http_requests_total{
                              app="thanos",
                              namespace=~"$thanosNamespace",
                              container="query",
                              handler=~"query|query_range"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                      / sum(
                        rate(
                          http_requests_total{
                            app="thanos",
                            namespace=~"$thanosNamespace",
                            container="query",
                            handler=~"query|query_range"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: 5xx share
                    qryType: 1
                    query: |
                      (
                        sum(
                          rate(
                            http_requests_total{
                              app="thanos",
                              namespace=~"$thanosNamespace",
                              container="query",
                              handler=~"query|query_range",
                              code=~"5.."
                            }
                            [$__rate_interval]
                          )
                        )
                        or
                        0 * sum(
                          rate(
                            http_requests_total{
                              app="thanos",
                              namespace=~"$thanosNamespace",
                              container="query",
                              handler=~"query|query_range"
                            }
                            [$__rate_interval]
                          )
                        )
                      )
                      / sum(
                        rate(
                          http_requests_total{
                            app="thanos",
                            namespace=~"$thanosNamespace",
                            container="query",
                            handler=~"query|query_range"
                          }
                          [$__rate_interval]
                        )
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The share of PromQL queries Thanos Query answered with a server error.**

          **Nominal:** Zero.

          **Unhealthy:** Anything sustained. Every dashboard and every rule evaluation goes through Thanos Query, so its errors show up as empty panels everywhere and as alerts that do not fire.

          A client error, such as a query that does not parse, is a 4xx and is not counted.
        id: 1003
        links: []
        title: Query Errors (5xx)
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No queries in this range
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#FEDA8B'
                    value: 0.001
                  - color: '#FDB366'
                    value: 0.013250000000000001
                  - color: '#F67E4B'
                    value: 0.025500000000000002
                  - color: '#DD3D2D'
                    value: 0.037750000000000006
                  - color: '#A50026'
                    value: 0.05
                unit: percentunit
              overrides: []
            options:
              colorMode: background
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    overview-query-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (handler) (
                        rate(
                          http_requests_total{
                            app="thanos",
                            namespace=~"$thanosNamespace",
                            container="query",
                            handler=~"query|query_range"
                          }
                          [$__rate_interval]
                        )
                      )
                    legendFormat: '{{handler}}'
                    qryType: 1
                    query: |
                      sum by (handler) (
                        rate(
                          http_requests_total{
                            app="thanos",
                            namespace=~"$thanosNamespace",
                            container="query",
                            handler=~"query|query_range"
                          }
