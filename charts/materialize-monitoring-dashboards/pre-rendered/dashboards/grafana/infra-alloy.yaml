                        alloy_config_last_load_successful{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                    format: table
                    instant: true
                    legendFormat: last load succeeded
                    qryType: 2
                    query: |
                      max by (app, pod, sha256) (
                        alloy_config_hash{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                        * on (namespace, pod) group_left ()
                        alloy_config_last_load_successful{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (app, pod) (
                        time()
                        - alloy_resources_process_start_time_seconds{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                    format: table
                    instant: true
                    legendFormat: uptime
                    qryType: 2
                    query: |
                      max by (app, pod) (
                        time()
                        - alloy_resources_process_start_time_seconds{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations:
            - group: merge
              kind: Transformation
              spec:
                options: {}
            - group: organize
              kind: Transformation
              spec:
                options:
                  excludeByName:
                    Time: true
                  indexByName:
                    'Value #query-0': 5
                    'Value #query-1': 6
                    app: 0
                    last load succeeded: 3
                    pod: 1
                    sha256: 2
                    uptime: 4
                  renameByName:
                    'Value #query-0': last load succeeded
                    'Value #query-1': uptime
                    sha256: config hash
        description: |-
          **The configuration each collector is running, by content hash, whether its last load succeeded, and how long the collector has been up.**

          **Nominal:** One hash per role, every load successful, and uptimes that differ only by when each pod last rolled.

          **Degraded:** One collector with a much shorter uptime than its peers. It restarted on its own rather than in a rollout, and _Overview -> Collection Health_ counts the restarts.

          **Unhealthy:** A failed load. The collector is still running the hash shown, which is the last configuration that loaded, rather than the one it was given.

          The chart restarts a collector to change its configuration, so a collector's uptime is also how long it has run the hash shown. Two hashes for one role is a rollout in progress. _Distinct Configurations_ beside this says whether it finished.
        id: 1061
        links: []
        title: Configuration by Collector
        vizConfig:
          group: table
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
