    components-config-by-pod:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (app, pod, sha256) (
                        alloy_config_hash{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
