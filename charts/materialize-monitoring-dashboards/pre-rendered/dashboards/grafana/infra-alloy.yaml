apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: meta-o11y
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-infra-alloy
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    Is telemetry collection healthy, and if not, which stage of it broke.

    The collectors watching themselves: the per-node agents, the gateway, both pipelines, and Alloy's own logs. Everything here reaches the dashboard through the gateway, so a dashboard that is empty throughout most likely means the gateway is down.
  editable: true
  elements:
    alloy-event-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        job="loki.source.kubernetes_events",
                        namespace=~"$alloyNamespace"
                      }
                        |~ "(?i)$logSearch"
                        | name=~"(${alloyRole:regex}).*|.+-validate-(agent|gateway)(-.*)?"
                        | name=~"$alloyPod"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Every Kubernetes event about the collectors, newest first.**

          Matched on the involved object's name, since events carry no `app` label. Choosing one collector narrows the feed to that pod's own events, which leaves out its DaemonSet's or Deployment's.

          The validation Jobs are named after the release, as `<release>-validate-agent` and `<release>-validate-gateway`, rather than after the role. Both run together on every install and upgrade, so their events are shown whatever the role picker is set to.
        id: 1083
        links: []
        title: All Events
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No events about the collectors in this time range
              overrides: []
            options:
              dedupStrategy: signature
              detailsMode: inline
              displayedFields:
              - reason
              - name
              - msg
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: true
              wrapLogMessage: false
          version: ''
    alloy-event-rate-by-kind:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (kind) (
                        count_over_time(
                          {
                            job="loki.source.kubernetes_events",
                            namespace=~"$alloyNamespace"
                          }
                            |~ "(?i)$logSearch"
                            | name=~"(${alloyRole:regex}).*|.+-validate-(agent|gateway)(-.*)?"
                            | name=~"$alloyPod"
                          [$__auto]
                        )
                      )
                    legendFormat: '{{kind}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Kubernetes events about the collectors, per kind of object they concern.**

          **Nominal:** `Pod` and `ReplicaSet` during a gateway rollout, `Pod` alone during an agent rollout, and `HorizontalPodAutoscaler` when the gateway scales.

          **Degraded:** A steady stream of `HorizontalPodAutoscaler` events. The gateway is scaling up and down repeatedly, which restarts scrapes each time.
        id: 1081
        links: []
        title: Event Rate by Object Kind
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No events about the collectors in this time range
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    alloy-event-rate-by-reason:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (reason) (
                        count_over_time(
                          {
                            job="loki.source.kubernetes_events",
                            namespace=~"$alloyNamespace"
                          }
                            |~ "(?i)$logSearch"
                            | name=~"(${alloyRole:regex}).*|.+-validate-(agent|gateway)(-.*)?"
                            | name=~"$alloyPod"
                          [$__auto]
                        )
                      )
                    legendFormat: '{{reason}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Kubernetes events about the collectors' pods, DaemonSet, Deployment and autoscaler, and about the configuration-validation Jobs that run before each install and upgrade, per reason.**

          **Nominal:** Bursts during a rollout or a scale-up, such as `ScalingReplicaSet`, `Scheduled` and `Killing`, and quiet in between. Each upgrade adds a `SuccessfulCreate` and a `Completed` per validation Job.

          **Unhealthy:** A reason that repeats. `BackOff` is a collector that starts and dies, `Unhealthy` one whose probe fails, `FailedMount` a volume or certificate secret that did not attach, and `FailedScheduling` an agent with no room on a new node. `BackoffLimitExceeded` on a validation Job is a pipeline configuration that failed to validate, and the install or upgrade that ran it stopped there.

          Counts events as Loki received them. Kubernetes folds a repeat into one event with a rising `count`, so a tight loop reports fewer lines than it has occurrences.
        id: 1080
        links: []
        title: Event Rate by Reason
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No events about the collectors in this time range
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    alloy-logs-errors-by-component:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (component_id) (
                        rate(
                          {
                            app=~"$alloyRole",
                            namespace=~"$alloyNamespace",
                            level=~"WARN|WARNING|ERROR|CRITICAL|FATAL"
                          }
                            |~ "(?i)$logSearch"
                            | pod=~"$alloyPod"
                            | logfmt component_id
                          [$__auto]
                        )
                      ) * 60
                    legendFormat: '{{component_id}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Warning-and-worse lines per minute from the collectors, split by the pipeline component that logged them.**

          **Nominal:** Empty, or close to it.

          **Unhealthy:** One component dominating. Its name says which stage of the pipeline is failing: `loki.write` and `prometheus.remote_write` are deliveries, `otelcol.exporter` an extra destination, `discovery` and `prometheus.operator` finding targets.

          Independent of the level picker, for the same reason as the warning feed.
        id: 1085
        links: []
        title: Error Rate by Component
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No warnings in this time range
                unit: suffix:logs/min
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    alloy-logs-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        app=~"$alloyRole",
                        namespace=~"$alloyNamespace",
                        level=~"$logLevelList"
                      }
                        |~ "(?i)$logSearch"
                        | pod=~"$alloyPod"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The collectors' own log feed, newest first, for the selected roles and levels.**

          These lines reach Loki through the gateway. The agents' own lines are read by the gateway over the Kubernetes API, and the gateway's lines are read off disk by the agent on its node. A gateway that is down takes both with it, and `kubectl logs` is then the tool.

          An empty search matches every line rather than none.
        id: 1089
        links: []
        title: All Logs
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No lines match the current filters, or the gateway is not delivering logs
              overrides: []
            options:
              dedupStrategy: exact
              detailsMode: inline
              displayedFields: []
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: false
              wrapLogMessage: true
          version: ''
    alloy-logs-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (app, level) (
                        rate(
                          {
                            app=~"$alloyRole",
                            namespace=~"$alloyNamespace",
                            level=~"$logLevelList"
                          }
                            |~ "(?i)$logSearch"
                            | pod=~"$alloyPod"
                          [$__auto]
                        )
                      )
                    legendFormat: '{{app}} {{level}}'
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **The collectors' own log lines per second, split by role and level.**

          **Nominal:** A low, steady baseline. The agents log each file they start or stop tailing, so pod churn shows up here.

          **Degraded:** `UNKNOWN` climbing. Those are lines Alloy did not write in its own format, most often the Go HTTP server reporting failed TLS handshakes on a listener.
        id: 1084
        links: []
        title: Log Rate by Role and Level
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No lines match the current filters, or the gateway is not delivering logs
                unit: suffix:logs/s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    alloy-logs-warning-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        app=~"$alloyRole",
                        namespace=~"$alloyNamespace",
                        level=~"WARN|WARNING|ERROR|CRITICAL|FATAL"
                      }
                        |~ "(?i)$logSearch"
                        | pod=~"$alloyPod"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Warning-and-worse lines from the collectors, newest first.**

          **Nominal:** Quiet. Alloy logs component starts and stops at INFO and little above it.

          **Unhealthy:** A steady stream from one component. The `component_id` on each line names it.

          Independent of the level picker, like the other warning feeds in this repository. Narrowing the selection to INFO would otherwise silently empty it.
        id: 1088
        links: []
        title: Warnings and Errors
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No warnings in this time range
              overrides: []
            options:
              dedupStrategy: exact
              detailsMode: inline
              displayedFields: []
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: false
              wrapLogMessage: true
          version: ''
    alloy-logs-warning-rate:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(
                        rate(
                          {
                            app=~"$alloyRole",
                            namespace=~"$alloyNamespace",
                            level=~"WARN|WARNING|ERROR|CRITICAL|FATAL"
                          }
                            |~ "(?i)$logSearch"
                            | pod=~"$alloyPod"
                          [1m]
                        )
                      ) * 60
                    legendFormat: warnings/min
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Warning-and-worse lines per minute from the selected collectors.**

          **Nominal:** Zero, or close to it.

          **Unhealthy:** A sustained non-zero rate. _Error Rate by Component_ says which stage, and the feed below says why.
        id: 1086
        links: []
        title: Warning Rate
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#33BBEE'
                  mode: shades
                min: 0
                noValue: No warnings in this time range
                unit: suffix:logs/min
              overrides: []
            options:
              colorMode: none
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    alloy-volume-hidden-note:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries: []
            queryOptions: {}
            transformations: []
        description: Why the volume panels are not drawn over long ranges.
        id: 1087
        links: []
        title: Volume (skipped)
        vizConfig:
          group: text
          kind: VizConfig
          spec:
            fieldConfig:
              defaults: {}
              overrides: []
            options:
              code:
                language: plaintext
                showLineNumbers: false
                showMiniMap: false
              content: |-
                **Volume panels are hidden for ranges longer than 7 days.**

                Counting log lines means reading every one of them — Loki indexes labels, not counts — so these panels scan the whole selection rather than an index.

                Shorten the time range, or narrow the namespace and app pickers, and they come back. The feeds below are unaffected at any range: they stop at the first page of matches. For counting over longer spans, [Explore](/explore) is the better tool.
              mode: markdown
          version: ''
    alloy-warning-event-feed:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${logsDatasource}
                  group: loki
                  kind: DataQuery
                  spec:
                    expr: |
                      {
                        job="loki.source.kubernetes_events",
                        namespace=~"$alloyNamespace",
                        level="WARN"
                      }
                        |~ "(?i)$logSearch"
                        | name=~"(${alloyRole:regex}).*|.+-validate-(agent|gateway)(-.*)?"
                        | name=~"$alloyPod"
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Kubernetes warning events about the collectors, newest first.**

          **Nominal:** Nothing.

          **Unhealthy:** Warnings that keep arriving. The reason and message name the cause.

          `Warning` is the reporting component's own judgement, not a threshold of ours.
        id: 1082
        links: []
        title: Warning Events
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                noValue: No warning events about the collectors in this time range
              overrides: []
            options:
              dedupStrategy: signature
              detailsMode: inline
              displayedFields:
              - reason
              - name
              - msg
              enableInfiniteScrolling: true
              enableLogDetails: true
              fontSize: small
              prettifyLogMessage: false
              showCommonLabels: false
              showControls: true
              showFieldSelector: true
              showLabels: false
              showLevel: true
              showLogContextToggle: false
              showTime: true
              sortOrder: Descending
              syntaxHighlighting: true
              timestampResolution: ms
              unwrappedColumns: true
              wrapLogMessage: false
          version: ''
    cluster-health-score:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (pod) (
                        cluster_node_gossip_health_score{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                    legendFormat: '{{pod}}'
                    qryType: 1
                    query: |
                      max by (pod) (
                        cluster_node_gossip_health_score{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Each gateway replica's gossip health score, where zero is healthy.**

          **Nominal:** Zero.

          **Degraded:** Above zero. The replica is missing gossip messages, usually from CPU starvation or network trouble between replicas. _Resources -> CPU_ says whether it is being throttled.
        id: 1068
        links: []
        title: Gossip Health Score
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: Only the gateway runs clustered
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cluster-members:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      min by (pod, state) (
                        cluster_ready_for_traffic{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                        * on (namespace, pod) group_left (state)
                        cluster_node_info{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                    format: table
                    instant: true
                    qryType: 2
                    query: |
                      min by (pod, state) (
                        cluster_ready_for_traffic{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                        * on (namespace, pod) group_left (state)
                        cluster_node_info{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations:
            - group: organize
              kind: Transformation
              spec:
                options:
                  excludeByName:
                    Time: true
                  indexByName:
                    Value: 2
                    pod: 0
                    state: 1
                  renameByName:
                    Value: ready for traffic
        description: |-
          **Each gateway replica's own cluster state, and whether it considers the cluster ready for traffic.**

          **Nominal:** Every replica a `participant`, and every one ready.

          **Degraded:** A replica not ready. The cluster has fewer members than its configured minimum, and the replica's clustered components wait rather than scrape.

          `terminating` is a replica shutting down and handing its targets on. It is expected during a rollout and should clear within a minute.
        id: 1071
        links: []
        title: Cluster Members
        vizConfig:
          group: table
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  align: auto
                  filterable: true
                  inspect: false
                noValue: Only the gateway runs clustered
                unit: bool_yes_no
              overrides: []
            options:
              cellHeight: sm
              footer:
                countRows: false
                reducer: []
                show: false
              frameIndex: 0
              showHeader: true
              showTypeIcons: false
          version: ''
    cluster-peers:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (pod) (
                        cluster_node_peers{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                    legendFormat: '{{pod}} sees'
                    qryType: 1
                    query: |
                      sum by (pod) (
                        cluster_node_peers{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      count(
                        cluster_node_info{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                    legendFormat: gateways running
                    qryType: 1
                    query: |
                      count(
                        cluster_node_info{
                          app=~"$alloyRole",
                          namespace=~"$alloyNamespace",
                          pod=~"$alloyPod"
                        }
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **How many cluster members each gateway replica can see, beside how many replicas are running.**

          **Nominal:** Every replica sees the same number, and it equals the number running.

          **Unhealthy:** A replica seeing fewer. It has lost gossip contact with its peers, and both sides assign themselves the targets they think are unowned. The result is targets scraped twice, and duplicate samples the store rejects.

          Only the gateway runs clustered. The agent reads only its own node and publishes no cluster metrics.
        id: 1067
        links: []
        title: Peers Seen
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: Only the gateway runs clustered
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cluster-targets:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
