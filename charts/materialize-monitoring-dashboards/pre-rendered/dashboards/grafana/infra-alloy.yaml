  links: []
  liveNow: false
  preload: false
  tags:
  - infrastructure
  - mzmon
  - meta-monitoring
  timeSettings:
    autoRefresh: ''
    autoRefreshIntervals:
    - 5s
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 2h
    - 1d
    fiscalYearStartMonth: 0
    from: now-6h
    hideTimepicker: false
    timezone: browser
    to: now
  title: Alloy Meta Monitoring
  variables:
  - kind: DatasourceVariable
    spec:
      allowCustomValue: false
      current:
        text: ''
        value: ''
      description: Datasource for metrics queries
      hide: dontHide
      includeAll: false
      label: Metrics Datasource
      multi: false
      name: metricsDatasource
      options: []
      pluginId: prometheus
      refresh: never
      regex: ''
      skipUrlSync: false
  - kind: DatasourceVariable
    spec:
      allowCustomValue: false
      current:
        text: ''
        value: ''
      description: Datasource for log and event queries
      hide: dontHide
      includeAll: false
      label: Logs Datasource
      multi: false
      name: logsDatasource
      options: []
      pluginId: loki
      refresh: never
      regex: ''
      skipUrlSync: false
  - kind: QueryVariable
    spec:
      allValue: .+
      allowCustomValue: true
      current:
        text: ''
        value: ''
      definition: label_values(up{app=~"alloy-agent|alloy-gateway"}, namespace)
      description: Namespace(s) the collectors run in
      hide: dontHide
      includeAll: true
      label: Alloy Namespace
      multi: true
      name: alloyNamespace
      options: []
      query:
        datasource:
          name: ${metricsDatasource}
        group: prometheus
        kind: DataQuery
        spec:
          expr: label_values(up{app=~"alloy-agent|alloy-gateway"}, namespace)
          qryType: 1
          query: label_values(up{app=~"alloy-agent|alloy-gateway"}, namespace)
        version: v0
      refresh: never
      regex: ''
      regexApplyTo: value
      skipUrlSync: false
      sort: alphabeticalAsc
  - kind: QueryVariable
    spec:
      allValue: alloy-agent|alloy-gateway
      allowCustomValue: true
      current:
        text: ''
        value: ''
      definition: label_values(up{app=~"alloy-agent|alloy-gateway", namespace=~"$alloyNamespace"}, app)
      description: 'Which collectors to read: the per-node agents, the gateway, or both'
      hide: dontHide
      includeAll: true
      label: Role
      multi: true
      name: alloyRole
      options: []
      query:
        datasource:
          name: ${metricsDatasource}
        group: prometheus
        kind: DataQuery
        spec:
          expr: label_values(up{app=~"alloy-agent|alloy-gateway", namespace=~"$alloyNamespace"}, app)
          qryType: 1
          query: label_values(up{app=~"alloy-agent|alloy-gateway", namespace=~"$alloyNamespace"}, app)
        version: v0
      refresh: never
      regex: ''
      regexApplyTo: value
      skipUrlSync: false
      sort: alphabeticalAsc
  - kind: QueryVariable
    spec:
      allValue: .+
      allowCustomValue: true
      current:
        text: ''
        value: ''
      definition: label_values(up{app=~"$alloyRole", namespace=~"$alloyNamespace"}, pod)
      description: Which collector pods to read
      hide: dontHide
      includeAll: true
      label: Collector
      multi: true
      name: alloyPod
      options: []
      query:
        datasource:
          name: ${metricsDatasource}
        group: prometheus
        kind: DataQuery
        spec:
          expr: label_values(up{app=~"$alloyRole", namespace=~"$alloyNamespace"}, pod)
          qryType: 1
          query: label_values(up{app=~"$alloyRole", namespace=~"$alloyNamespace"}, pod)
        version: v0
      refresh: never
      regex: ''
      regexApplyTo: value
      skipUrlSync: false
      sort: alphabeticalAsc
  - kind: QueryVariable
    spec:
      allValue: .*
      allowCustomValue: true
      current:
        text: ''
        value: ''
      definition: label_values(level)
      description: The severity level(s) to include
      hide: dontHide
      includeAll: true
      label: Level
      multi: true
      name: logLevelList
      options: []
      query:
        datasource:
          name: ${logsDatasource}
        group: loki
        kind: DataQuery
        spec:
          label: level
          refId: LokiVariableQueryEditor-VariableQuery
          stream: '{app=~"$alloyRole", namespace=~"$alloyNamespace"}'
          type: 1
        version: v0
      refresh: onTimeRangeChanged
      regex: ''
      regexApplyTo: value
      skipUrlSync: false
      sort: alphabeticalAsc
  - kind: TextVariable
    spec:
      current:
        text: ''
        value: ''
      description: Case-insensitive text to match anywhere in the log line
      hide: dontHide
      label: Search
      name: logSearch
      query: ''
      skipUrlSync: false
  - datasource:
      name: $metricsDatasource
    group: ''
    kind: AdhocVariable
    spec:
      allowCustomValue: true
      baseFilters:
      - key: namespace
        operator: =~
        origin: dashboard
        value: $alloyNamespace
      defaultKeys: []
      description: Adhoc filters to apply to all metrics queries
      enableGroupBy: false
      filters: []
      hide: inControlsMenu
      label: Advanced Metric Filter
      name: metricAdhoc
      skipUrlSync: false
  - datasource:
      name: $logsDatasource
    group: ''
    kind: AdhocVariable
    spec:
      allowCustomValue: true
      baseFilters: []
      defaultKeys: []
      description: Adhoc filters to apply to all logs queries
      enableGroupBy: false
      filters: []
      hide: inControlsMenu
      label: Advanced Log Filter
      name: logsAdhoc
      skipUrlSync: false
