                  align: auto
                  filterable: true
                  inspect: false
                noValue: No data from the collectors. Check that the gateway is running.
              overrides:
              - matcher:
                  id: byName
                  options: last load succeeded
                properties:
                - id: unit
                  value: bool_yes_no
              - matcher:
                  id: byName
                  options: uptime
                properties:
                - id: unit
                  value: dtdurations
            options:
              cellHeight: sm
              footer:
                countRows: false
                reducer: []
                show: false
              frameIndex: 0
              showHeader: true
              showTypeIcons: false
          version: ''
