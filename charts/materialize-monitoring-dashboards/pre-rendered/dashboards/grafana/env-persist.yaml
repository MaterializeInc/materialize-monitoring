              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs: []
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: ''
    writes-amplification:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_user_bytes{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: new data
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_user_bytes{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_compaction_bytes{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: compaction rewrites
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_compaction_bytes{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Bytes per second of new data written to object storage, beside the bytes compaction rewrites.**

          **Nominal:** Compaction rewriting a small multiple of what is written: every update is rewritten a few times as files are merged.

          **Degraded:** Compaction far above new data for a long time is a workload whose updates are being rewritten repeatedly — each one billed as storage writes.
        id: 1023
        links: []
        title: New Data and Compaction Rewrites
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: Bps
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    writes-stalls:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_user_write_stall_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        + rate(mz_persist_compaction_write_stall_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_user_write_stall_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        + rate(mz_persist_compaction_write_stall_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                    legendFormat: '{{app}} {{cluster_name}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_user_write_stall_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        + rate(mz_persist_compaction_write_stall_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_user_write_stall_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                        + rate(mz_persist_compaction_write_stall_count{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Writes that waited for in-flight uploads to finish, per second, by process.**

          **Nominal:** Nothing drawn above zero.

          **Degraded:** The process at the top is the one whose writes object storage is not keeping up with.
        id: 1024
        links: []
        title: Write Stalls by Process
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
