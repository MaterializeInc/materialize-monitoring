apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: materialize
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.41.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-env-persist
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    Object storage, as Materialize experiences it.

    Reads, writes, failures, compaction and what the stored data is for, measured by the processes that use the bucket — the same on every store. What the bucket itself reports is on the Infrastructure Cloud Provider dashboard.
  editable: true
  elements:
    compaction-busy:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_compaction_seconds{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_compaction_seconds{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                    legendFormat: '{{app}} {{cluster_name}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_compaction_seconds{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      sum by (app, cluster_environmentd_materialize_cloud_cluster_id) (
                        rate(mz_persist_compaction_seconds{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval])
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Compactions running at once, on average, by process.**

          **Nominal:** Well under one. Compaction is background work and usually idle.

          **Degraded:** A process pinned at its limit is compacting continuously, which competes with its real work for CPU and object storage bandwidth.

          Seconds spent compacting per second, which is the average number in flight.
        id: 1022
        links: []
        title: Compactions Running by Process
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    compaction-outcomes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_compaction_requested{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: requested
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_compaction_requested{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_compaction_started{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: started
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_compaction_started{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-1
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_compaction_applied{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: applied
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_compaction_applied{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-2
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_compaction_failed{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: failed
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_compaction_failed{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-3
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_compaction_timed_out{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: timed out
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_compaction_timed_out{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-4
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_compaction_dropped{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: dropped
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_compaction_dropped{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-5
            queryOptions: {}
            transformations: []
        description: |-
          **What happened to compaction requests, per second.**

          **Nominal:** Requested, started and applied on top of each other; failed, timed out and dropped at zero.

          **Degraded:** Dropped means the queue was full and work was abandoned — compaction is not keeping up with writes. Applied falling behind started means compactions are finishing too late to be used, usually because the data changed underneath them.

          Compaction merges the small data files that every write produces into larger ones, which keeps reads fast and lets the replaced files be deleted.
        id: 1020
        links: []
        title: Compaction Outcomes
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    compaction-queue-wait:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      (
                        sum(rate(mz_persist_compaction_queued_seconds{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                        /
                        sum(rate(mz_persist_compaction_started{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                      ) >= 0
                    legendFormat: waiting
                    qryType: 1
                    query: |
                      (
                        sum(rate(mz_persist_compaction_queued_seconds{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                        /
                        sum(rate(mz_persist_compaction_started{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                      ) >= 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Average time a compaction request waits in the queue before it starts.**

          **Nominal:** Effectively zero.

          **Degraded:** Rising wait is compaction running out of capacity. Reads slow as uncompacted files accumulate, and dropped requests on _Compaction Outcomes_ follow if it keeps up.
        id: 1021
        links: []
        title: Queue Wait (mean)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-by-type:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (op) (
                        rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"blob_.*"}[$__rate_interval])
                      )
                    legendFormat: '{{op}}'
                    qryType: 1
                    query: |
                      sum by (op) (
                        rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"blob_.*"}[$__rate_interval])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Object storage calls per second, by operation.**

          **Nominal:** Writes and deletes roughly equal — compaction deletes about as many parts as are written — and reads depending on how much hydration and querying is going on.

          **Degraded:** Deletes falling well behind writes for a long time means storage is growing faster than the data is.
        id: 1012
        links: []
        title: Operations by Type
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-cache:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      (
                        sum(rate(mz_persist_blob_cache_hits_bytes{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                        /
                        (
                          sum(rate(mz_persist_blob_cache_hits_bytes{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                          + sum(rate(mz_persist_external_bytes_count{materialize_cloud_organization_name=~"$environmentNameList", op="blob_get"}[$__rate_interval]))
                        )
                      ) >= 0
                    legendFormat: from cache
                    qryType: 1
                    query: |
                      (
                        sum(rate(mz_persist_blob_cache_hits_bytes{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                        /
                        (
                          sum(rate(mz_persist_blob_cache_hits_bytes{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                          + sum(rate(mz_persist_external_bytes_count{materialize_cloud_organization_name=~"$environmentNameList", op="blob_get"}[$__rate_interval]))
                        )
                      ) >= 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Share of bytes read that the in-memory cache served, rather than object storage.**

          **Nominal:** Most of them. Recently written data is read back soon after, and the cache catches it.

          **Degraded:** A falling share during a steady workload means the cache is too small for the working set, so more reads go to the store — more latency and more billed requests.

          Empty for a window in which nothing was read at all.
        id: 1018
        links: []
        title: Reads Served from Cache
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: '#33BBEE'
                  mode: shades
                max: 1
                min: 0
                noValue: Nothing was read in this window, from the cache or from the store.
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-hedging:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_blob_hedges_fired{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: sent
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_blob_hedges_fired{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(rate(mz_persist_blob_hedges_won{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                    legendFormat: won
                    qryType: 1
                    query: |
                      sum(rate(mz_persist_blob_hedges_won{materialize_cloud_organization_name=~"$environmentNameList"}[$__rate_interval]))
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Reads that were slow enough to send a second, duplicate request, and how many of those the duplicate won, per second.**

          **Nominal:** Zero or close to it, and only when hedged reads are enabled.

          **Degraded:** Hedges firing constantly means the store's tail latency is regularly past the hedge threshold. Hedges winning most of the time means the tail is individual slow requests, which hedging is working around — at the cost of extra billed requests.
        id: 1019
        links: []
        title: Hedged Reads
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No hedging metrics. Hedged reads were added in Materialize v26.41.
                unit: ops
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-mean-latency:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      (
                        sum by (op) (
                          rate(mz_persist_external_seconds{materialize_cloud_organization_name=~"$environmentNameList", op=~"blob_.*"}[$__rate_interval])
                        )
                        /
                        sum by (op) (
                          rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"blob_.*"}[$__rate_interval])
                        )
                      ) >= 0
                    legendFormat: '{{op}}'
                    qryType: 1
                    query: |
                      (
                        sum by (op) (
                          rate(mz_persist_external_seconds{materialize_cloud_organization_name=~"$environmentNameList", op=~"blob_.*"}[$__rate_interval])
                        )
                        /
                        sum by (op) (
                          rate(mz_persist_external_started_count{materialize_cloud_organization_name=~"$environmentNameList", op=~"blob_.*"}[$__rate_interval])
                        )
                      ) >= 0
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Average time per object storage call, by operation.**

          **Nominal:** Tens of milliseconds for reads, writes and deletes.

          **Degraded:** Deletes slowing on their own is a store under pressure from cleanup; a listing appearing at all is a process scanning the bucket, which happens at startup and is slow on large buckets.

          A mean hides the tail; reads and writes have real percentiles on _Read and Write Latency_.
        id: 1015
        links: []
        title: Mean Latency by Operation
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-read-latency-by-process:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |-
                      (
                      (
                      histogram_quantile(0.99,
                        sum by (le, app, cluster_environmentd_materialize_cloud_cluster_id) (
                          rate(mz_persist_external_op_latency_bucket{materialize_cloud_organization_name=~"$environmentNameList", op="blob_get"}[$__rate_interval])
                        )
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      histogram_quantile(0.99,
                        sum by (le, app, cluster_environmentd_materialize_cloud_cluster_id) (
                          rate(mz_persist_external_op_latency_bucket{materialize_cloud_organization_name=~"$environmentNameList", op="blob_get"}[$__rate_interval])
                        )
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                    legendFormat: '{{app}} {{cluster_name}}'
                    qryType: 1
                    query: |-
                      (
                      (
                      histogram_quantile(0.99,
                        sum by (le, app, cluster_environmentd_materialize_cloud_cluster_id) (
                          rate(mz_persist_external_op_latency_bucket{materialize_cloud_organization_name=~"$environmentNameList", op="blob_get"}[$__rate_interval])
                        )
                      )

                      )
                      * on (cluster_environmentd_materialize_cloud_cluster_id) group_left(cluster_name)
                      max by (cluster_environmentd_materialize_cloud_cluster_id, cluster_name) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      )
                      or
                      label_replace(
                      (
                      histogram_quantile(0.99,
                        sum by (le, app, cluster_environmentd_materialize_cloud_cluster_id) (
                          rate(mz_persist_external_op_latency_bucket{materialize_cloud_organization_name=~"$environmentNameList", op="blob_get"}[$__rate_interval])
                        )
                      )

                      )
                      unless on (cluster_environmentd_materialize_cloud_cluster_id) (
                      group by (cluster_environmentd_materialize_cloud_cluster_id) (
                      label_replace(label_replace(mz_cluster_info{materialize_cloud_organization_name=~"$environmentNameList"}, "cluster_environmentd_materialize_cloud_cluster_id", "$1", "cluster_id", "(.*)"), "cluster_name", "$1", "name", "(.*)")
                      )
                      ),
                      "cluster_name", "$1", "cluster_environmentd_materialize_cloud_cluster_id", "(.*)"
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Slowest 1% of reads from object storage, by the process making them.**

          **Nominal:** Every process close to the others.

          **Degraded:** One process well above the rest is local to it — its network path or its node. All of them rising together is the store.
        id: 1016
        links: []
        title: Read Latency by Process (p99)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No metrics from this environment. Check the environment picker, and that Materialize is running.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    ops-requests:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (op) (
