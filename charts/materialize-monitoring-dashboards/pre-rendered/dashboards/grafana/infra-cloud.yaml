                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (dimension_DBInstanceIdentifier) (
                        last_over_time(aws_rds_write_latency_average[15m])
                      )
                    legendFormat: write {{dimension_DBInstanceIdentifier}}
                    qryType: 1
                    query: |
                      max by (dimension_DBInstanceIdentifier) (
                        last_over_time(aws_rds_write_latency_average[15m])
                      )
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Average time each RDS instance's disk takes to complete a read and a write.**

          **Nominal:** Around a millisecond.

          **Degraded:** Rising write latency with flat load is the volume throttling — check _Burst and I/O Balances_ — or the instance at its provisioned IOPS.
        id: 1006
        links: []
        title: Disk Latency
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
