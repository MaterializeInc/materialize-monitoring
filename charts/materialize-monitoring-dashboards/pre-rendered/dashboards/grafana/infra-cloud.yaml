                      )
                    legendFormat: read {{dimension_DBInstanceIdentifier}}
                    qryType: 1
                    query: |
                      max by (dimension_DBInstanceIdentifier) (
                        last_over_time(aws_rds_read_latency_average[15m])
                      )
