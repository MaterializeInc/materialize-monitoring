              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (dimension_DBInstanceIdentifier) (
                        last_over_time(aws_rds_disk_queue_depth_average[15m])
                      )
                    legendFormat: '{{dimension_DBInstanceIdentifier}}'
                    qryType: 1
                    query: |
                      max by (dimension_DBInstanceIdentifier) (
                        last_over_time(aws_rds_disk_queue_depth_average[15m])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Disk requests waiting on each RDS instance's volume.**

          **Nominal:** Near zero.

          **Degraded:** A sustained queue is the volume unable to keep up — it is the signal that separates a disk bottleneck from a CPU one.
