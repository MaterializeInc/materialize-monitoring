apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: infra
    monitoring.materialize.cloud/min-mz-version: v26.24.0
    monitoring.materialize.cloud/rec-mz-version: v26.24.0
    monitoring.materialize.cloud/sql-metric-prefix: mz_
    monitoring.materialize.cloud/target-export: generic
  name: mz-mon-infra-cloud
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: Crosshair
  description: |-
    The metadata database and the buckets Materialize depends on, as their cloud provider reports them.

    CloudWatch, Cloud Monitoring and Azure Monitor metrics pulled by the gateway, with rows for whichever provider is configured. Materialize's own view of the same dependencies is on Materialize Consensus and Materialize Persist.
  editable: true
  elements:
    blob-availability:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      min by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_availability_average_percent[15m])
                      ) / 100
                    legendFormat: '{{resourceName}}'
                    qryType: 1
                    query: |
                      min by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_availability_average_percent[15m])
                      ) / 100
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Fraction of requests to each storage account's blob service that Azure counted as successful.**

          **Nominal:** 100%.

          **Degraded:** Anything lower is requests failing for a reason Azure attributes to itself or to throttling — the account's request-rate or bandwidth limits. Materialize retries them, so they show there as latency first.
        id: 1026
        links: []
        title: Availability
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                max: 1
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    blob-latency:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_successserverlatency_average_milliseconds[15m])
                      ) / 1000
                    legendFormat: server {{resourceName}}
                    qryType: 1
                    query: |
                      max by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_successserverlatency_average_milliseconds[15m])
                      ) / 1000
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_successe2elatency_average_milliseconds[15m])
                      ) / 1000
                    legendFormat: end to end {{resourceName}}
                    qryType: 1
                    query: |
                      max by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_successe2elatency_average_milliseconds[15m])
                      ) / 1000
                  version: v0
                refId: query-1
            queryOptions: {}
            transformations: []
        description: |-
          **Average time Azure took to serve each storage account's successful blob requests, measured at the service and end to end.**

          **Nominal:** Milliseconds, with the two lines close together.

          **Degraded:** Server latency rising is the storage account. End-to-end rising alone is the network or the clients — compare with Materialize's own measurement on Materialize Persist, _Overview -> Latency_.
        id: 1027
        links: []
        title: Request Latency
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                min: 0
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    bucket-bytes:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (dimension_BucketName) (
                        last_over_time(aws_s3_bucket_size_bytes_average[15m])
                      )
                    legendFormat: '{{dimension_BucketName}}'
                    qryType: 1
                    query: |
                      max by (dimension_BucketName) (
                        last_over_time(aws_s3_bucket_size_bytes_average[15m])
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (bucket_name) (
                        last_over_time(stackdriver_gcs_bucket_storage_googleapis_com_storage_v_2_total_bytes[30m])
                      )
                    legendFormat: '{{bucket_name}}'
                    qryType: 1
                    query: |
                      sum by (bucket_name) (
                        last_over_time(stackdriver_gcs_bucket_storage_googleapis_com_storage_v_2_total_bytes[30m])
                      )
                  version: v0
                refId: query-1
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_blobcapacity_average_bytes[15m])
                      )
                    legendFormat: '{{resourceName}}'
                    qryType: 1
                    query: |
                      max by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_blobcapacity_average_bytes[15m])
                      )
                  version: v0
                refId: query-2
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum(max by (shard) (mz_persist_shard_usage_current_state_batches_bytes))
                      + sum(max by (shard) (mz_persist_shard_usage_current_state_rollups_bytes))
                      + sum(max by (shard) (mz_persist_shard_usage_referenced_not_current_state_bytes))
                      + sum(max by (shard) (mz_persist_shard_usage_not_leaked_not_referenced_bytes))
                      + sum(max by (shard) (mz_persist_shard_usage_leaked_bytes))
                    legendFormat: referenced by Materialize
                    qryType: 1
                    query: |
                      sum(max by (shard) (mz_persist_shard_usage_current_state_batches_bytes))
                      + sum(max by (shard) (mz_persist_shard_usage_current_state_rollups_bytes))
                      + sum(max by (shard) (mz_persist_shard_usage_referenced_not_current_state_bytes))
                      + sum(max by (shard) (mz_persist_shard_usage_not_leaked_not_referenced_bytes))
                      + sum(max by (shard) (mz_persist_shard_usage_leaked_bytes))
                  version: v0
                refId: query-3
            queryOptions: {}
            transformations: []
        description: |-
          **Bytes stored in each bucket, as the provider bills them, beside the data Materialize accounts for.**

          **Nominal:** The persist bucket close to Materialize's line; the monitoring buckets growing with retention and then levelling off. S3 and Azure publish bucket size once a day, so on a growing environment the bucket can read below Materialize's line by up to a day's growth — compare over days, not hours.

          **Degraded:** The persist bucket far above Materialize's line is storage nothing is using: object versions or soft-deleted objects the bucket's policy retains, aborted multipart uploads, or data Materialize leaked. On GCS, _GCS: Reclaimable Data_ separates the first two. A bucket that only ever grows is a lifecycle rule that is missing or a compactor that has stopped.

          Published once a day, so this moves in daily steps and a new bucket has nothing for its first day. Materialize's line sums every environment on this cluster. Drawn on a logarithmic axis, so buckets of very different sizes stay readable side by side; an empty bucket draws no line and reads 0 in the legend.
        id: 1022
        links: []
        title: Bucket Size
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                unit: bytes
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    bucket-none-detected:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries: []
            queryOptions: {}
            transformations: []
        description: Why this tab has no provider rows on it.
        id: 1028
        links: []
        title: No Provider Metrics
        vizConfig:
          group: text
          kind: VizConfig
          spec:
            fieldConfig:
              defaults: {}
              overrides: []
            options:
              code:
                language: plaintext
                showLineNumbers: false
                showMiniMap: false
              content: |-
                **No cloud provider metrics are being collected.**

                This is the default, not a fault. Pulling from CloudWatch, Cloud Monitoring or Azure Monitor is opt-in, because it needs a cloud identity with read access and every pull is billed by the provider.

                - **To turn it on**, list the metadata database and buckets under `pipeline.metrics.provider.cloudwatch`, `.gcp` or `.azure` in the `materialize-monitoring` chart's values, and give the gateway's service account read access: `cloudwatch:GetMetricStatistics` on AWS, `roles/monitoring.viewer` on GCP, or Monitoring Reader on Azure. The Cloud Provider Metrics page of the documentation has the details.
                - **A pull that is configured but not yet working still renders its rows here**, empty, so this note never hides a failing pull.
                - **Self-hosted databases and on-premise object stores** — CNPG, CockroachDB, MinIO — have no cloud provider, and nothing on this dashboard applies to them.

                Without provider metrics, Materialize's own view of both dependencies still works on every deployment: **Materialize Consensus** for the metadata database and **Materialize Persist** for object storage. That view says whether a dependency is failing Materialize; this dashboard, once enabled, says why.
              mode: markdown
          version: ''
    bucket-objects:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (dimension_BucketName) (
                        last_over_time(aws_s3_number_of_objects_average[15m])
                      )
                    legendFormat: '{{dimension_BucketName}}'
                    qryType: 1
                    query: |
                      max by (dimension_BucketName) (
                        last_over_time(aws_s3_number_of_objects_average[15m])
                      )
                  version: v0
                refId: query-0
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (bucket_name) (
                        last_over_time(stackdriver_gcs_bucket_storage_googleapis_com_storage_v_2_total_count[30m])
                      )
                    legendFormat: '{{bucket_name}}'
                    qryType: 1
                    query: |
                      sum by (bucket_name) (
                        last_over_time(stackdriver_gcs_bucket_storage_googleapis_com_storage_v_2_total_count[30m])
                      )
                  version: v0
                refId: query-1
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_blobcount_average_count[15m])
                      )
                    legendFormat: '{{resourceName}}'
                    qryType: 1
                    query: |
                      max by (resourceName) (
                        last_over_time(azure_microsoft_storage_storageaccounts_blobservices_blobcount_average_count[15m])
                      )
                  version: v0
                refId: query-2
            queryOptions: {}
            transformations: []
        description: |-
          **Objects stored in each bucket.**

          **Nominal:** Tracks bucket size. Persist writes many small objects and compaction replaces them with fewer large ones.

          **Degraded:** Objects growing much faster than bytes is small files accumulating — compaction falling behind, which Materialize Persist shows under _Compaction_.

          Published once a day. Drawn on a logarithmic axis, so buckets of very different sizes stay readable side by side; an empty bucket draws no line and reads 0 in the legend.
        id: 1023
        links: []
        title: Object Count
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  scaleDistribution:
                    log: 10
                    type: log
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cloudsql-by-database:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (database_id, database) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_postgresql_num_backends[15m])
                      )
                    legendFormat: '{{database_id}} {{database}}'
                    qryType: 1
                    query: |
                      sum by (database_id, database) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_postgresql_num_backends[15m])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Connections on each Cloud SQL instance, by the database they are connected to.**

          **Nominal:** Materialize's database holding nearly all of them, plus a couple of Cloud SQL's own (`cloudsqladmin`).

          **Degraded:** Another database holding a large share is a neighbour sharing the instance — its connections and its load come out of the same `max_connections` and the same CPU that Materialize needs.
        id: 1012
        links: []
        title: Connections by Database
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cloudsql-by-state:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      sum by (database_id, state) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_postgresql_num_backends_by_state[15m])
                      )
                    legendFormat: '{{database_id}} {{state}}'
                    qryType: 1
                    query: |
                      sum by (database_id, state) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_postgresql_num_backends_by_state[15m])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Connections on each Cloud SQL instance, by what they are doing.**

          **Nominal:** Mostly `idle`: Materialize keeps connections open between commits.

          **Degraded:** `idle in transaction` accumulating is a client that opened a transaction and stopped; it holds locks and stops vacuum. Many `active` connections at once is the instance working hard, which its CPU should confirm.
        id: 1013
        links: []
        title: Connections by State
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                min: 0
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cloudsql-disk:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (database_id) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_disk_utilization[15m])
                      )
                    legendFormat: '{{database_id}}'
                    qryType: 1
                    query: |
                      max by (database_id) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_disk_utilization[15m])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Fraction of each Cloud SQL instance's disk in use.**

          **Nominal:** Low and roughly flat: Materialize's footprint in its metadata database is small and does not grow with your data.

          **Degraded:** A steady climb is the table persist writes to growing — see Materialize Consensus, _State and Cleanup_ — or another database sharing the instance; _Connections by Database_ shows what else is on it.

          **Unhealthy:** A full disk stops the instance accepting writes. Automatic storage increases, if enabled, only add space once it runs low.
        id: 1009
        links: []
        title: Disk Used
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                max: 1
                min: 0
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                thresholds:
                  mode: absolute
                  steps:
                  - color: '#A2F49B'
                    value: null
                  - color: '#F19903'
                    value: 0.8
                  - color: '#AB0003'
                    value: 0.9
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cloudsql-memory:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      max by (database_id) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_memory_utilization[15m])
                      )
                    legendFormat: '{{database_id}}'
                    qryType: 1
                    query: |
                      max by (database_id) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_memory_utilization[15m])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Fraction of each Cloud SQL instance's memory in use.**

          **Nominal:** High is normal: PostgreSQL uses spare memory as cache.

          **Degraded:** Pinned at 100% on a small instance means it is swapping or evicting its cache, and queries slow down. Shared-core tiers reach this easily and are not recommended for a metadata database.
        id: 1010
        links: []
        title: Memory Used
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                max: 1
                min: 0
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    cloudsql-up:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
                      min by (database_id) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_up[15m])
                      )
                    legendFormat: '{{database_id}}'
                    qryType: 1
                    query: |
                      min by (database_id) (
                        last_over_time(stackdriver_cloudsql_database_cloudsql_googleapis_com_database_up[15m])
                      )
                  version: v0
                refId: query-0
            queryOptions: {}
            transformations: []
        description: |-
          **Whether Cloud SQL considers each instance to be serving.**

          **Nominal:** `1` for every instance.

          **Unhealthy:** `0` is an instance that is down, restarting or failing over. Every Materialize process sees it as connection errors at the same moment.
        id: 1011
        links: []
        title: Instance Serving
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                decimals: 0
                max: 1
                min: 0
                noValue: No data from the provider. A new pull takes a few minutes to report; see Collection if it does not.
                unit: short
              overrides: []
            options:
              legend:
                calcs:
                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    collection-about:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries: []
            queryOptions: {}
            transformations: []
        description: How old provider data is, and what that means for reading it.
        id: 1035
        links: []
        title: About Provider Data
        vizConfig:
          group: text
          kind: VizConfig
          spec:
            fieldConfig:
              defaults: {}
              overrides: []
            options:
              code:
                language: plaintext
                showLineNumbers: false
                showMiniMap: false
              content: |-
                **Everything on this dashboard is minutes old, and some of it a day old.**

                | Source | Age on arrival |
                |---|---|
                | RDS, Azure Flexible Server, Azure Blob requests | A few minutes |
                | Cloud SQL | About three minutes |
                | GCS | Over ten minutes |
                | S3 size and object count, Azure Blob capacity | Up to a day |

                Read it beside Materialize's own view — Materialize Consensus and Materialize Persist — which is current to the scrape. When the two disagree during an incident, the difference is usually the provider's delay rather than a contradiction.

                - **A restart of the gateway leaves a gap** in the Cloud SQL and GCS series as long as their delay, because samples stamped before the restart are never sent. CloudWatch and Azure samples are stamped when they are pulled and have no gap.
                - **A pull that answers is not a pull that worked.** _Provider Pulls_ reads 1 for an exporter whose call to the provider failed; _Resources Returning Data_ is the check, and the Cloud Monitoring and Azure Monitor rows say why a pull failed.
                - **Each pull is billed by the provider**, at a cost set by how many resources are listed and how often they are pulled, not by how often this dashboard is viewed.
              mode: markdown
          version: ''
    collection-azure-calls:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${metricsDatasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    expr: |
