                - max
                - mean
                - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                mode: single
                sort: asc
          version: ''
    rds-queue-depth:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
