name: Build benchmark image
description: >
  Build the multi-arch mz-monitoring-benchmark load-testing image from
  packages/mz-monitoring-benchmark and, optionally, push it to GHCR. Shared by
  the release and pull-request paths so both build the image exactly the same way.

inputs:
  push:
    description: Whether to push the built image to the registry.
    default: "false"
  image-suffix:
    description: >
      Appended to the release tag as `<version>-<suffix>`, for dev images.
      Empty builds the release tag.
    default: ""
  github-token:
    description: Token used to authenticate to GHCR when pushing.
    required: false
    default: ""

outputs:
  tag:
    description: The fully-qualified image tag that was built.
    value: ${{ steps.meta.outputs.tag }}

runs:
  using: composite
  steps:
    # Derive <registry>/mz-monitoring-benchmark:<crate version>[-<suffix>] from
    # the repo, so the tag follows the version a benchmark-images release bumps.
    - name: Resolve image tag
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        version="$(grep -E '^version = ' packages/mz-monitoring-benchmark/Cargo.toml | head -n1 | cut -d'"' -f2)"
        registry="$(grep -E '^CONTAINER_REGISTRY \?=' Makefile | head -n1 | sed 's/.*?= *//')"
        tag="${registry}/mz-monitoring-benchmark:${version}"
        if [ -n "${INPUT_SUFFIX}" ]; then
          tag="${tag}-${INPUT_SUFFIX}"
        fi
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      env:
        INPUT_SUFFIX: ${{ inputs.image-suffix }}

    # The Rust build cross-compiles on the runner's own platform; QEMU only runs
    # the final stage's smoke test for the other architecture.
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        # The crate is a workspace member, so the context is the repository
        # root; Dockerfile.dockerignore beside the Dockerfile trims it.
        context: .
        file: packages/mz-monitoring-benchmark/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tag }}
        # Supply-chain evidence (NIST SP 800-190 integrity): full build
        # provenance + an SBOM attached to the pushed manifest.
        provenance: mode=max
        sbom: true
