name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo-test:
    name: cargo test
    # Skip on version-update/* PRs: the branch is main plus a mechanical
    # version/changelog bump, already tested on main, and the merge re-runs this
    # on main. Renovate dependency bumps use a different branch prefix, so those
    # still run here. head_ref is empty on push, so main builds are unaffected.
    if: ${{ !startsWith(github.head_ref, 'version-update/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install promtool
        # promtool ships inside the prometheus release tarball. The scrape
        # transpiler tests use it as a `promtool check config` oracle (mirrors
        # how the pipelines job installs `alloy`); without it those checks skip.
        # The runner is linux/amd64; the version in the filename omits the `v`.
        run: |
          curl -sSL \
            "https://github.com/prometheus/prometheus/releases/download/v3.12.0/prometheus-3.12.0.linux-amd64.tar.gz" \
            -o /tmp/prometheus.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 /tmp/prometheus-3.12.0.linux-amd64/promtool /usr/local/bin/promtool
      - name: cargo test
        run: cargo test --workspace --all-targets --verbose

  helm-tests:
    name: helm unittest
    # Skip on version-update/* PRs. The umbrella chart version is not embedded in
    # the unittest snapshots (those carry subchart versions like `loki-15.0.1`),
    # so a version bump can't change the output. Subchart bumps arrive on
    # renovate/* branches and still run here. head_ref is empty on push.
    if: ${{ !startsWith(github.head_ref, 'version-update/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      # helm is preinstalled on the runner image. The subchart deps are vendored
      # (charts/materialize-monitoring/charts/*.tgz are committed), so no
      # `helm dependency build` / OCI registry access is needed.
      - name: Install helm-unittest plugin
        # Pinned to match the version used locally via `make helm-tests`.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3
      - name: helm unittest
        run: make helm-tests

  # Rollup gate — the single check to require in branch protection for this
  # workflow. Passes iff every job above finished `success` or `skipped` (so the
  # version-update skips still pass); any failure or cancellation fails it.
  test-gate:
    name: test-gate
    needs: [cargo-test, helm-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required job did not pass (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "All test jobs passed."
