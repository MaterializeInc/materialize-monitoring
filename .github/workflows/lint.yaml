name: lint

# Native invocations of each tool, mirroring the areas enforced locally by
# .pre-commit-config.yaml. We deliberately do NOT shell out to pre-commit
# itself: each tool reads its canonical config (.editorconfig, .yamllint.yaml,
# rustfmt defaults, pyproject.toml, .shellcheckrc, etc.) so behavior is the
# same regardless of how the tool is invoked.
#
# Most jobs here are fast enough to run on every PR. The terraform job runs only
# when its inputs change, and its path filter lives at the JOB level (the
# `changes` job), not on the trigger, for the same reason as pipelines.yaml:
# `lint-gate` is a required check, and a workflow skipped by a trigger-level
# `paths:` filter never reports, leaving the required check pending.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter lists a PR's changed files via the API.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      # Checkout is needed for push events (paths-filter diffs against the base
      # commit); pull_request events resolve changed files via the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            terraform:
              - terraform/**
              - .tflint.hcl
              - Makefile
              - .github/workflows/lint.yaml

  editorconfig:
    name: editorconfig
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install editorconfig-checker
        run: |
          curl -sSL \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.6.1/ec-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/bin/ec-linux-amd64 /usr/local/bin/editorconfig-checker
      # Reads .editorconfig and .ecrc.
      - run: editorconfig-checker

  python:
    name: python (ruff + pyright)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      # All three tools read [tool.ruff] / [tool.pyright] (when present) in
      # pyproject.toml. No flags duplicated from the pre-commit config.
      - name: ruff check
        run: uv run ruff check
      - name: ruff format (check mode)
        run: uv run ruff format --check
      - name: pyright
        run: uv run pyright

  rust:
    name: rust (fmt + clippy)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # rustfmt picks up rustfmt.toml if present (none today; defaults apply).
      - name: cargo fmt (check mode)
        run: cargo fmt --all -- --check
      # -D warnings is a policy gate (CI/pre-push only); we don't want
      # local `cargo build` to fail on every WIP warning, so it stays on
      # the invocation rather than going into [workspace.lints.rust].
      #
      # --locked fails a PR whose Cargo.lock disagrees with its manifests,
      # rather than letting cargo rewrite it here and leaving the fix to
      # whichever PR next builds locally. This is the job that holds it
      # because it also runs on version-update PRs, which `cargo test` skips.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  shell:
    name: shell (shellcheck + shfmt)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # shellcheck is preinstalled on ubuntu-24.04 runners.
      - name: Install shfmt
        run: |
          curl -sSL \
            "https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64" \
            -o /tmp/shfmt
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
      - name: Discover shell files
        # Match the same scope pre-commit's `types: [shell]` does: explicit
        # extensions plus shebang detection on extensionless executables.
        shell: bash
        run: |
          : > shfiles.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sh|*.bash) echo "$f" >> shfiles.txt ;;
              *)
                if head -c 64 "$f" 2>/dev/null | grep -qE '^#!.*(bash|sh)\b'; then
                  echo "$f" >> shfiles.txt
                fi
                ;;
            esac
          done < <(git ls-files '*.sh' '*.bash' 'bin/*' 'tools/shlib/*' | grep -v legacy)
          echo "Found $(wc -l < shfiles.txt) shell files:"
          cat shfiles.txt
      - name: shellcheck
        # No CLI flags; shellcheck reads .shellcheckrc if present.
        run: xargs -a shfiles.txt shellcheck
      - name: shfmt (diff mode)
        # Indent size, switch_case_indent, and binary_next_line come from
        # .editorconfig via shfmt's native EditorConfig support.
        run: xargs -a shfiles.txt shfmt -d

  yaml:
    name: yaml (yamllint)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install yamllint
        # Pinned to match the pre-commit hook rev for predictability.
        run: uv tool install yamllint==1.37.1
      - name: yamllint (default config)
        # .yamllint.yaml is auto-discovered; the `ignore:` block in it
        # handles generated/legacy paths and routes .kyaml elsewhere.
        run: yamllint .
      - name: yamllint (kyaml, strict)
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.kyaml')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .kyaml files found; skipping."
            exit 0
          fi
          yamllint -c .yamllint-kyaml.kyaml --strict "${files[@]}"

  helm:
    name: helm (lint + helm-docs freshness)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # LFS-tracked subchart tarballs under charts/*/charts/*.tgz are
          # needed for `helm lint` to resolve declared dependencies and for
          # helm-docs to render any subchart-aware sections.
          lfs: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: helm lint
        run: |
          helm lint charts/materialize-monitoring
          helm lint charts/materialize-monitoring-crds
          helm lint charts/materialize-monitoring-dashboards
          helm lint charts/materialize-monitoring-dashboards-infra
          helm lint charts/materialize-monitoring-dashboards-meta
          helm lint charts/_dashboards-common
      - name: helm-docs is up to date
        # Regenerate then assert no diff. Detects stale chart README or
        # docsite values reference. helm-docs version comes from go.mod.
        run: |
          make helm-docs
          if ! git diff --exit-code; then
            echo "::error::helm-docs output is stale. Run 'make helm-docs' locally and commit."
            exit 1
          fi

  terraform:
    name: terraform (tflint)
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-26.04
    env:
      # renovate: datasource=github-releases packageName=terraform-linters/tflint
      TFLINT_VERSION: v0.65.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install tflint
        # The release binary has the Terraform ruleset .tflint.hcl uses built in,
        # so this pin is the ruleset's pin too, and no `tflint --init` is needed.
        # The runner is linux/amd64.
        run: |
          base="https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}"
          cd /tmp
          curl -sSLO "$base/tflint_linux_amd64.zip"
          curl -sSLO "$base/checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          unzip -q tflint_linux_amd64.zip
          sudo install -m 0755 tflint /usr/local/bin/tflint
          tflint --version
      # Lints every root under terraform/ against .tflint.hcl. Needs no Terraform
      # and no `terraform init`: the only module calls are local paths.
      - name: tflint
        run: make terraform-lint

  # Rollup gate — the single check to require in branch protection for this
  # workflow. Passes iff every job above finished `success` or `skipped`, so
  # requiring just this one check stays correct as jobs are added or removed.
  # `!cancelled()` lets it run even when some needs skipped; any failure or
  # cancellation fails it. (test/pipelines/dashboards carry the same gate.)
  # `changes` is listed so a failed path filter fails the gate rather than
  # passing as a skipped terraform job.
  lint-gate:
    name: lint-gate
    needs: [changes, editorconfig, python, rust, shell, yaml, helm, terraform]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required job did not pass (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "All lint jobs passed."
