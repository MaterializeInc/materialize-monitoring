name: e2e

# End-to-end tiers on a kind cluster. Tier 0 (render + plan, no cluster) lives in
# `test.yaml`; tiers 1 and 2 are here because they are slow enough to want their
# own path gating, and tier 3 is downstream in materialize-terraform-self-managed.
#
# Path filtering lives at the JOB level (the `changes` job), not on the workflow
# trigger, for the same reason as pipelines.yaml: `e2e-gate` is meant to be a
# required check, and a workflow skipped by a trigger-level `paths:` filter never
# reports, leaving the required check pending on every unrelated PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter lists a PR's changed files via the API.
  pull-requests: read

env:
  # renovate: datasource=github-releases packageName=kubernetes-sigs/kind
  KIND_VERSION: v0.33.0

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            chart:
              - charts/**
              - test/e2e/**
              - packages/mz-monitoring-e2e/**
              - Makefile
              - .github/workflows/e2e.yaml
            terraform:
              - terraform/**
              - test/e2e/**
              - packages/mz-monitoring-e2e/**
              - Makefile
              - .github/workflows/e2e.yaml

  tier1:
    name: tier 1 (chart on kind)
    needs: changes
    # Skip on version-update/* PRs: a version bump cannot change behaviour here,
    # and the merge re-runs this on main.
    if: ${{ needs.changes.outputs.chart == 'true' && !startsWith(github.head_ref, 'version-update/') }}
    runs-on: ubuntu-24.04
    # A hung wait is the expected failure mode; without this the job burns the
    # 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The vendored subchart tarballs are LFS-tracked; without this they
          # check out as pointer files and the install fails.
          lfs: true

      # Installed rather than using an action, so CI and `make e2e-cluster` drive
      # the same code path — including the namespaces the chart's scrapers need.
      - name: Install kind
        run: |
          curl -sSLo /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

      # The assertion suite is a workspace member, so the tier needs a toolchain.
      # Set up before the cluster so the build overlaps nothing and a compile
      # error fails the job in seconds rather than after a 10-minute install.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the assertion suite
        run: cargo build -p mz-monitoring-e2e

      - name: Create cluster
        run: make e2e-cluster

      - name: Install the chart
        run: make e2e-tier1

      # The assertion that matters. `helm install` exits zero even when no log
      # ever reaches Loki, so proving the install succeeded proves very little.
      - name: Verify the logging round trip
        run: make e2e-verify-tier1

      - name: Collect diagnostics
        if: failure()
        run: ./test/e2e/dump-diagnostics.sh e2e-diagnostics-tier1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-diagnostics-tier1
          path: e2e-diagnostics-tier1
          retention-days: 7

  tier2:
    name: tier 2 (generic-cloud substrate on kind)
    needs: changes
    # Triggered by chart changes as well as Terraform ones. A change to Loki's or
    # Thanos's storage wiring is exactly the kind that clears a filesystem-mode
    # tier-1 gate and breaks against real object storage.
    if: ${{ (needs.changes.outputs.terraform == 'true' || needs.changes.outputs.chart == 'true') && !startsWith(github.head_ref, 'version-update/') }}
    runs-on: ubuntu-24.04
    # A green run is ~5 minutes. The bound is set well above that on purpose:
    # it has to clear a *failing* run, not a passing one.
    #
    # A job killed by `timeout-minutes` is cancelled, so its `if: failure()`
    # diagnostics step never runs and the cluster dies with the runner — the
    # exact "red E2E with no artifacts" the tier exists to avoid. Meanwhile a
    # failing run is dominated by the suite's per-assertion deadline (180s each,
    # serial), so a badly broken stack legitimately takes far longer than a
    # healthy one: locally, runs with one or two failures took 12-14 minutes.
    #
    # 20 leaves room for that while still catching a genuine hang long before the
    # 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Install kind
        run: |
          curl -sSLo /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

      # The suite is a workspace member, so this tier needs a toolchain too. Set
      # up before the cluster so a compile error fails in seconds rather than
      # after a long install.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the assertion suite
        run: cargo build -p mz-monitoring-e2e

      - name: Create cluster
        run: make e2e-cluster

      # Substrate, then the module composed onto it. `e2e-tier2` depends on
      # `e2e-generic-cloud`, so this runs both — the substrate stays separately
      # applyable, which is why it is its own root.
      - name: Provision the substrate and install the stack
        run: make e2e-tier2

      # The assertions that only this tier can run. Tier 1 has no object storage,
      # so its five Thanos trials report `ignored`; here they execute, and with
      # them the storage wiring, the static-credential path, and Grafana on a real
      # Postgres.
      - name: Verify the stack
        run: make e2e-verify-tier2

      - name: Collect diagnostics
        if: failure()
        run: ./test/e2e/dump-diagnostics.sh e2e-diagnostics-tier2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-diagnostics-tier2
          path: e2e-diagnostics-tier2
          retention-days: 7

  # Rollup gate — the single check to require in branch protection for this
  # workflow. Always runs, and passes iff every job above finished `success` or
  # `skipped`, so a PR touching neither charts nor terraform still reports green.
  e2e-gate:
    name: e2e-gate
    needs: [changes, tier1, tier2]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required job did not pass (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "All e2e jobs passed."
