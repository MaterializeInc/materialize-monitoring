name: e2e

# End-to-end tiers on a kind cluster. Tier 0 (render + plan, no cluster) lives in
# `test.yaml`; tiers 1 and 2 are here because they are slow enough to want their
# own path gating, and tier 3 is downstream in materialize-terraform-self-managed.
#
# Path filtering lives at the JOB level (the `changes` job), not on the workflow
# trigger, for the same reason as pipelines.yaml: `e2e-gate` is meant to be a
# required check, and a workflow skipped by a trigger-level `paths:` filter never
# reports, leaving the required check pending on every unrelated PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter lists a PR's changed files via the API.
  pull-requests: read

env:
  # renovate: datasource=github-releases packageName=kubernetes-sigs/kind
  KIND_VERSION: v0.32.0

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            chart:
              - charts/**
              - test/e2e/**
              - Makefile
              - .github/workflows/e2e.yaml
            terraform:
              - terraform/**
              - test/e2e/**
              - Makefile
              - .github/workflows/e2e.yaml

  tier1:
    name: tier 1 (chart on kind)
    needs: changes
    # Skip on version-update/* PRs: a version bump cannot change behaviour here,
    # and the merge re-runs this on main.
    if: ${{ needs.changes.outputs.chart == 'true' && !startsWith(github.head_ref, 'version-update/') }}
    runs-on: ubuntu-24.04
    # A hung wait is the expected failure mode; without this the job burns the
    # 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The vendored subchart tarballs are LFS-tracked; without this they
          # check out as pointer files and the install fails.
          lfs: true

      # Installed rather than using an action, so CI and `make e2e-cluster` drive
      # the same code path — including the namespaces the chart's scrapers need.
      - name: Install kind
        run: |
          curl -sSLo /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

      - name: Create cluster
        run: make e2e-cluster

      - name: Install the chart
        run: make e2e-tier1

      # The assertion that matters. `helm install` exits zero even when no log
      # ever reaches Loki, so proving the install succeeded proves very little.
      - name: Verify the logging round trip
        run: make e2e-verify-tier1

      - name: Collect diagnostics
        if: failure()
        run: ./test/e2e/dump-diagnostics.sh e2e-diagnostics-tier1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-diagnostics-tier1
          path: e2e-diagnostics-tier1
          retention-days: 7

  tier2:
    name: tier 2 (generic-cloud substrate on kind)
    needs: changes
    # Triggered by chart changes as well as Terraform ones. A change to Loki's or
    # Thanos's storage wiring is exactly the kind that clears a filesystem-mode
    # tier-1 gate and breaks against real object storage.
    if: ${{ (needs.changes.outputs.terraform == 'true' || needs.changes.outputs.chart == 'true') && !startsWith(github.head_ref, 'version-update/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Install kind
        run: |
          curl -sSLo /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

      - name: Create cluster
        run: make e2e-cluster

      # Currently the substrate only: rustfs, its buckets, and CNPG. This is
      # already a real check — it proves the storage and database a cloud wrapper
      # stands in for come up on a clean cluster. It grows into the full tier when
      # the root composing this with the monitoring module lands.
      - name: Provision the generic-cloud substrate
        run: make e2e-generic-cloud

      - name: Collect diagnostics
        if: failure()
        run: ./test/e2e/dump-diagnostics.sh e2e-diagnostics-tier2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-diagnostics-tier2
          path: e2e-diagnostics-tier2
          retention-days: 7

  # Rollup gate — the single check to require in branch protection for this
  # workflow. Always runs, and passes iff every job above finished `success` or
  # `skipped`, so a PR touching neither charts nor terraform still reports green.
  e2e-gate:
    name: e2e-gate
    needs: [changes, tier1, tier2]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required job did not pass (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "All e2e jobs passed."
