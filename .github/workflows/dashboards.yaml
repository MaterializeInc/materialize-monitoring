name: dashboards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          activate-environment: "true"

      - name: Build Dashboards
        run: >
          make -j4 dashboards

  # Rollup gate — the single check to require in branch protection for this
  # workflow. Passes iff every job above finished `success` or `skipped`; any
  # failure or cancellation fails it. Requiring just this one check stays correct
  # if the dashboards build is later split into multiple jobs.
  dashboards-gate:
    name: dashboards-gate
    needs: [dashboards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required job did not pass (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "All dashboards jobs passed."
