name: dashboards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboards:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `-B` forces the render: the Makefile targets are the output *directories*,
      # and a fresh checkout's mtimes are arbitrary, so a plain `make` could
      # consider them up to date and skip rendering — which would make the
      # freshness check below vacuous. (Deleting the outputs first does not work
      # here: removing files inside a directory target updates that directory's
      # mtime, making it look newer than its prerequisites rather than missing.)
      - name: Build Dashboards
        run: |
          make -B -j4 dashboards

      # The rendered dashboards are checked in; assert they match a fresh render so
      # a change to the generator or a panel can't merge with stale output. Uses
      # `git status` (not `git diff`) so a new-but-uncommitted render is caught too,
      # not just modifications to already-tracked files.
      #
      # All three dashboards charts' trees, because each renders one folder: a
      # dashboard that changes folder leaves one chart and lands in another, and
      # only checking both sides catches a half-committed move.
      - name: rendered dashboards are up to date
        run: |
          paths=(
            charts/materialize-monitoring-dashboards/pre-rendered/dashboards/grafana
            charts/materialize-monitoring-dashboards-infra/pre-rendered/dashboards/grafana
            charts/materialize-monitoring-dashboards-meta/pre-rendered/dashboards/grafana
            docs/assets/dashboards/grafana
          )
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "::error::Rendered dashboards are stale or uncommitted. Run 'make dashboards' locally and commit."
            git status --porcelain -- "${paths[@]}"
            exit 1
          fi

  # Rollup gate — the single check to require in branch protection for this
  # workflow. Passes iff every job above finished `success` or `skipped`; any
  # failure or cancellation fails it. Requiring just this one check stays correct
  # if the dashboards build is later split into multiple jobs.
  dashboards-gate:
    name: dashboards-gate
    needs: [dashboards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required job did not pass (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "All dashboards jobs passed."
