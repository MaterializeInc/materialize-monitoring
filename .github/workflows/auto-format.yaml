name: auto-format

# Pushes one formatting commit to PRs labeled `auto-format`. Generated PRs
# (version-update) can't run formatters when their branch is built via the API,
# and the same applies to GitHub UI edits and renovate; labeling opts a PR into
# this fixup pass instead.
#
# NOTE: this fires on PR events from the actor that created/updated the PR. The
# default GITHUB_TOKEN does NOT trigger downstream workflows, so the producer
# (e.g. `propose-bumps`) must authenticate with a PAT or GitHub App token for
# this to run. The push below likewise uses that token (MATERIALIZE_BOT_TOKEN)
# so the formatting commit triggers the PR's required checks (lint/test) and lets
# auto-merge proceed. If the token is unset the push falls back to GITHUB_TOKEN,
# restoring the old no-re-trigger behavior.
#
# Because that push uses a real token, it re-triggers this workflow. The `check`
# job below breaks the loop: if the PR head is already one of our own "apply
# auto-formatters" commits there is nothing left to reformat, so it stops the
# run before any toolchain installs. (Idempotent formatters are the backstop —
# a run that did proceed would find no diff and not push — but the guard avoids
# paying for it.)
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  # dorny/paths-filter lists a PR's changed files via the API.
  pull-requests: read

concurrency:
  group: auto-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Gate the expensive formatting job on two things: the opt-in label, and that
  # the PR head is not already one of this workflow's own auto-format commits.
  # Runs a shallow checkout only, so a re-triggered loop run stops here in a few
  # seconds instead of installing the whole toolchain to reformat nothing.
  #
  # Also decides whether the subchart archives and the vendored Grafana schemas
  # need rebuilding. Those steps are the only ones that reach out to a registry
  # or to GitHub's API, so they are kept off PRs that cannot have invalidated
  # their output rather than exposing every auto-format run to an outage.
  check:
    if: contains(github.event.pull_request.labels.*.name, 'auto-format')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      helm_deps: ${{ steps.filter.outputs.helm_deps }}
      grafana_schemas: ${{ steps.filter.outputs.grafana_schemas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Skip the workflow's own auto-format commit
        id: guard
        env:
          # Must match the commit subject the push step writes below.
          MARKER: apply auto-formatters
        run: |
          subject="$(git log -1 --pretty=%s)"
          if printf '%s' "$subject" | grep -qF "$MARKER"; then
            echo "Head is an auto-format commit ($subject); skipping to break the re-trigger loop."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      # Chart.lock names the versions the archives must hold and Chart.yaml is
      # what knocks the lock out of sync, so between them they cover every way a
      # PR can invalidate charts/*/charts/. Makefile and this workflow are in the
      # list so a change to the rebuild mechanism still exercises it.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            helm_deps:
              - charts/*/Chart.yaml
              - charts/*/Chart.lock
              - Makefile
              - .github/workflows/auto-format.yaml
            grafana_schemas:
              - bin/fetch-grafana-schemas.sh
              - bin/gen-grafana-models.sh
              - .github/workflows/auto-format.yaml

  auto-format:
    needs: check
    if: ${{ needs.check.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Persist this token (persist-credentials is on by default) so the
          # `git push` below authenticates as the bot, making the commit trigger
          # required checks. Falls back to GITHUB_TOKEN when the secret is unset.
          token: ${{ secrets.MATERIALIZE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          lfs: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      # Renovate moves Chart.yaml and Chart.lock but cannot produce the committed
      # subchart archives, so a dependency PR arrives with charts/*/charts/ still
      # holding the previous versions. Rebuilding here ships the archives in the
      # same PR as the bump.
      #
      # This is the only step that talks to a chart registry, so it runs only
      # when the PR actually touched the chart dependencies — otherwise a ghcr.io
      # outage would fail auto-format on PRs that never went near a chart.
      #
      # `git lfs install --local` is deliberate rather than redundant.
      # check-lfs.sh returns early once filter.lfs.smudge is set, which it is on
      # the runner image, and that path never installs .git/hooks/pre-push into
      # this clone. Without that hook the push below would upload pointer files
      # with no objects behind them, leaving the archives unresolvable.
      - name: Refresh Helm subchart archives
        if: ${{ needs.check.outputs.helm_deps == 'true' }}
        run: |
          ./bin/check-lfs.sh --fix
          git lfs install --local
          make helm-deps
      # Renovate moves the FSDK_REF pin in the script but cannot run the script,
      # so a schema-bump PR arrives with the vendored documents under
      # packages/mzmon-lib/schemas/grafana/ still at the previous tag.
      # Re-vendoring here ships the schema diff in the same PR as the pin, which
      # is the whole point of reviewing that PR -- and regenerating the models in
      # the same step is what makes src/grafana/generated/ reviewable alongside
      # it. cargo-typify is pinned so a generator release cannot silently reshape
      # the output on an unrelated schema bump.
      #
      # Scoped to PRs that touched the script: this is the only step that reaches
      # GitHub's API, and it is a no-op everywhere else — so running it on every
      # auto-format PR would buy nothing and still fail the run on an API hiccup.
      - name: Re-vendor Grafana schemas and regenerate models
        if: ${{ needs.check.outputs.grafana_schemas == 'true' }}
        env:
          # Unauthenticated api.github.com calls are rate-limited per runner IP,
          # which is shared; the default token lifts the ceiling.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/fetch-grafana-schemas.sh
          cargo install cargo-typify --locked --version 0.7.0
          ./bin/gen-grafana-models.sh

      - name: Run formatters
        run: |
          make helm-docs
          cargo fmt --all
          uv run ruff format
          uv run ruff check --fix --exit-zero
      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # The `check` job keys the loop guard on this subject — keep MARKER there
          # in sync if you change it.
          git commit -m "style: apply auto-formatters"
          git push
