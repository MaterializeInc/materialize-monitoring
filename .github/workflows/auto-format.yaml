name: auto-format

# Pushes one formatting commit to PRs labeled `auto-format`. Generated PRs
# (version-update) can't run formatters when their branch is built via the API,
# and the same applies to GitHub UI edits and renovate; labeling opts a PR into
# this fixup pass instead.
#
# NOTE: this fires on PR events from the actor that created/updated the PR. The
# default GITHUB_TOKEN does NOT trigger downstream workflows, so the producer
# (e.g. `propose-bumps`) must authenticate with a PAT or GitHub App token for
# this to run. The push below likewise uses that token (MATERIALIZE_BOT_TOKEN)
# so the formatting commit triggers the PR's required checks (lint/test) and lets
# auto-merge proceed. That push re-triggers this workflow once, but the formatters
# are idempotent, so the second run finds no diff and exits without pushing — the
# loop is bounded to a single no-op run. If the token is unset the push falls back
# to GITHUB_TOKEN, restoring the old no-re-trigger behavior.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write

concurrency:
  group: auto-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-format:
    if: contains(github.event.pull_request.labels.*.name, 'auto-format')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Persist this token (persist-credentials is on by default) so the
          # `git push` below authenticates as the bot, making the commit trigger
          # required checks. Falls back to GITHUB_TOKEN when the secret is unset.
          token: ${{ secrets.MATERIALIZE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          lfs: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Run formatters
        run: |
          make helm-docs
          cargo fmt --all
          uv run ruff format
          uv run ruff check --fix --exit-zero
      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply auto-formatters"
          git push
