name: pipelines

# Render the Alloy pipelines + metric-tiers and validate them (schema + `alloy
# validate`), then assert the checked-in outputs are fresh. This is one of the
# slower jobs (downloads the alloy binary, builds the Rust renderer), so the
# expensive `pipelines` job only runs when its inputs change — but the path
# filter lives at the JOB level (via the `changes` job below), not on the
# workflow trigger. That is deliberate: `pipelines-gate` is meant to be a
# required check, and a workflow skipped by a trigger-level `paths:` filter never
# reports its checks, which would leave a required check pending and block every
# unrelated PR. Running the workflow always (and skipping the work inside) keeps
# the gate reporting on every PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter lists a PR's changed files via the API.
  pull-requests: read

jobs:
  # Detect whether anything that can change the rendered pipelines/metric-tiers
  # was touched. Everything downstream keys off this instead of a trigger-level
  # `paths:` filter, so the workflow still runs (and the gate still reports) on
  # PRs that don't touch these paths.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      pipelines: ${{ steps.filter.outputs.pipelines }}
    steps:
      # Checkout is needed for push events (paths-filter diffs against the base
      # commit); pull_request events resolve changed files via the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            pipelines:
              - packages/alloy-pipelines/**
              - packages/queries/**
              - packages/mzmon-lib/**
              - packages/mz-monitoring-build/**
              - charts/materialize-monitoring/pre-rendered/pipelines/**
              - charts/materialize-monitoring/pre-rendered/metrics/**
              - Cargo.toml
              - Cargo.lock
              - Makefile
              - .github/workflows/pipelines.yaml

  pipelines:
    name: pipelines (render + alloy validate)
    needs: changes
    # Only run the expensive render/validate when a relevant input changed, and
    # not on version-update/* PRs (a Cargo.toml/Cargo.lock version bump can match
    # the paths above but never changes the render, and the merge re-runs this on
    # main). Renovate dep bumps use a different branch prefix, so those still run.
    if: ${{ needs.changes.outputs.pipelines == 'true' && !startsWith(github.head_ref, 'version-update/') }}
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=github-releases packageName=grafana/alloy
      ALLOY_VERSION: v1.18.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install alloy
        # Pinned release binary (NOT `go install` — alloy needs build tags and
        # is a heavy build). Assets follow the `alloy-<os>-<arch>.zip` naming;
        # the runner is linux/amd64. ALLOY_VERSION (job env, above) is renovate-
        # managed; keep it in step with the alloy used locally for `make
        # pipelines` and with packages/alloy/Dockerfile's ARG ALLOY_VERSION.
        run: |
          curl -sSL \
            "https://github.com/grafana/alloy/releases/download/${ALLOY_VERSION}/alloy-linux-amd64.zip" \
            -o /tmp/alloy.zip
          unzip -q /tmp/alloy.zip -d /tmp
          sudo install -m 0755 /tmp/alloy-linux-amd64 /usr/local/bin/alloy
      # Renders every packages/alloy-pipelines/*.yaml to .alloy and runs
      # `alloy validate` on each (second-layer sanity check beyond the schema).
      # Remove existing outputs first: the Makefile rule is timestamp-driven and
      # a fresh checkout's mtimes are arbitrary, so without this `make` could
      # consider the committed .alloy up to date and skip rendering — which would
      # make the freshness check below vacuous.
      - name: make pipelines
        run: |
          rm -f charts/materialize-monitoring/pre-rendered/pipelines/*.alloy
          make pipelines
      # The rendered .alloy files are checked in; assert they match a fresh
      # render so a YAML/schema/renderer change can't merge with stale output.
      # Uses `git status` (not `git diff`) so a new-but-uncommitted render is
      # caught too, not just modifications to already-tracked files.
      - name: rendered pipelines are up to date
        run: |
          dir=charts/materialize-monitoring/pre-rendered/pipelines
          if [ -n "$(git status --porcelain -- "$dir")" ]; then
            echo "::error::Rendered .alloy output is stale or uncommitted. Run 'make pipelines' locally and commit."
            git status --porcelain -- "$dir"
            exit 1
          fi
      # metric-tiers.yaml is generated from the query registry and checked in, the
      # same freshness contract as the pipelines above.
      - name: make metrics
        run: |
          rm -f charts/materialize-monitoring/pre-rendered/metrics/metric-tiers.yaml
          make metrics
      - name: generated metric-tiers.yaml is up to date
        run: |
          dir=charts/materialize-monitoring/pre-rendered/metrics
          if [ -n "$(git status --porcelain -- "$dir")" ]; then
            echo "::error::Generated metric-tiers.yaml is stale or uncommitted. Run 'make metrics' locally and commit."
            git status --porcelain -- "$dir"
            exit 1
          fi

  # Rollup gate — the single check to require in branch protection for this
  # workflow. Always runs (the workflow is not path-gated), and passes iff every
  # job above finished `success` or `skipped`, so on PRs that don't touch the
  # pipeline inputs the skipped `pipelines` job still counts as a pass.
  pipelines-gate:
    name: pipelines-gate
    needs: [changes, pipelines]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required job did not pass (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "All pipeline jobs passed."
