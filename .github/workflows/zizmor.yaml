name: zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Upload SARIF to code scanning. Findings show up as alerts and PR
      # annotations; the job itself does not fail on them.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # The action runs only the zizmor versions it shipped knowing about,
          # so this cannot move ahead of the action pin above.
          version: "1.32.0"
          config: zizmor.yml
