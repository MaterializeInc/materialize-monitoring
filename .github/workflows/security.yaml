name: security

# Misconfiguration scanning for the rendered Helm chart.
#
# Two halves, deliberately split by who can fix the finding:
#
#   misconfig-gate  blocks a pull request on HIGH/CRITICAL findings that are
#                   not baselined in .trivyignore.yaml. Everything it can fail
#                   on is a finding this repository introduced.
#   misconfig-report uploads unfiltered SARIF at every severity to code
#                   scanning. This is where the upstream-subchart population
#                   lives -- remediation there is a Renovate bump, not a PR
#                   fix, so it reports and never blocks.
#   image-gate      blocks on fixable HIGH/CRITICAL OS-package vulnerabilities
#                   in the images we publish. A rebuild is the fix.
#   image-report    uploads SARIF for every image the chart references. The
#                   upstream images and the upstream Go binaries inside our own
#                   image both land here, because neither is ours to patch.

on:
  push:
    branches: [main]
  pull_request:
  # The report half is worth running on a schedule: the checks Trivy ships
  # change without this repository changing, and a finding that appears on a
  # quiet week should still surface.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  misconfig-gate:
    name: trivy config (gate)
    # Nothing to gate on a schedule run -- the report job covers that path.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The scan renders the chart, and the vendored subchart tarballs are
          # LFS-tracked. Without this they check out as pointer files and the
          # render fails. (Same reason as the helm job in lint.yaml.)
          lfs: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: trivy config
        run: make security-scan

  misconfig-report:
    name: trivy config (report)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required to upload SARIF to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: trivy config (sarif)
        run: make security-report
      # One upload per scenario. Each needs its own `category`: uploads sharing
      # a category replace each other, so without this only the last scenario
      # would survive in code scanning.
      - name: Upload tier1
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-sarif/tier1.sarif
          category: trivy-misconfig-tier1
      - name: Upload azure
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-sarif/azure.sarif
          category: trivy-misconfig-azure
      - name: Upload mtls3
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-sarif/mtls3.sarif
          category: trivy-misconfig-mtls3

  image-gate:
    name: trivy image (gate)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reading the image we publish to GHCR.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      # Anonymous pulls work for the public images, but authenticating avoids
      # the unauthenticated rate limit on a job that pulls a dozen manifests.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy image
        run: make security-scan-images

  image-report:
    name: trivy image (report)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy image (sarif)
        run: make security-report-images
      # One merged file, one run, one category. Uploading the directory instead
      # fails: code scanning rejects several runs sharing a category, and Trivy
      # writes one run per image. A category per image would go stale as images
      # are added, bumped and removed.
      - name: Upload image reports
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-images.sarif
          category: trivy-image
      # Deliberately after the upload: an image we could not scan should not
      # cost us the reports for the ones we could, but it must not pass either.
      # A registry outage fails here; so does an image that has gone missing.
      - name: Fail if any image could not be scanned
        run: |
          if [ -s trivy-failed-images.txt ]; then
            echo "::error::Trivy could not scan these images:"
            cat trivy-failed-images.txt
            exit 1
          fi
          echo "Every referenced image was scanned."

  # Rollup gate -- the single check to require in branch protection for this
  # workflow. Passes iff every job above finished `success` or `skipped`, so
  # requiring just this one check stays correct as jobs are added or removed.
  # `!cancelled()` lets it run even when some needs skipped; any failure or
  # cancellation fails it. (lint/test/pipelines/dashboards carry the same gate.)
  security-gate:
    name: security-gate
    needs: [misconfig-gate, misconfig-report, image-gate, image-report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a required job did not pass (result: $r)"
                exit 1
                ;;
            esac
          done
          echo "All security jobs passed."
