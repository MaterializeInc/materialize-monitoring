# Cargo.toml (repo root)
[workspace]
resolver = "3"
members = [
    "packages/dashboards",
    "packages/mz-monitoring-build",
    "packages/mz-monitoring-check",
    "packages/mz-monitoring-e2e",
    "packages/mzmon-lib",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.96"
license = "BSL-1.1"
authors = ["Materialize, Inc."]
repository = "https://github.com/MaterializeInc/materialize-monitoring"

# Dependencies build without debug info, to keep dev target/ directories smaller.
# Workspace crates keep it, so backtraces and debuggers have file and line numbers for workspace code.
[profile.dev.package."*"]
debug = false
