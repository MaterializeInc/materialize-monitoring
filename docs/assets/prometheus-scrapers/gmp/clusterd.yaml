apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: clusterd
  labels:
    app.kubernetes.io/part-of: materialize
    app.kubernetes.io/name: clusterd
spec:
  selector:
    matchLabels:
      cluster.environmentd.materialize.cloud/type: cluster
  endpoints:
  - port: internal-http
    interval: 30s
    path: /metrics
    metricRelabeling:
    - sourceLabels:
      - cluster_id
      - cluster_environmentd_materialize_cloud_cluster_id
      separator: ;
      targetLabel: cluster_id
      regex: ;([su][0-9]+)
      replacement: $1
      action: replace
    - sourceLabels:
      - replica_id
      - cluster_environmentd_materialize_cloud_replica_id
      separator: ;
      targetLabel: replica_id
      regex: ;([su][0-9]+)
      replacement: $1
      action: replace
    - sourceLabels:
      - shard_id
      - shard
      separator: ;
      targetLabel: shard_id
      regex: ;(.+)
      replacement: $1
      action: replace
  targetLabels:
    fromPod:
    - from: materialize.cloud/organization-name
      to: materialize_cloud_organization_name
    - from: materialize.cloud/organization-namespace
      to: materialize_cloud_organization_namespace
    - from: materialize.cloud/organization-id
      to: materialize_cloud_organization_id
    - from: cluster.environmentd.materialize.cloud/cluster-id
      to: cluster_environmentd_materialize_cloud_cluster_id
    - from: cluster.environmentd.materialize.cloud/replica-id
      to: cluster_environmentd_materialize_cloud_replica_id
