locale = 'en-us'
title = 'materialize-monitoring Documentation'
baseURL = 'https://materializeinc.github.io/materialize-monitoring/'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"
  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/llms-txt"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  # [[module.mounts]]
  #   source = "../packages/prometheus-scrapers"
  #   target = "assets/prometheus-scrapers/"
  [[module.mounts]]
    disableWatch = true
    source = "../"
    files = ["CHANGELOG.md"]
    target = "assets/repo/"
  [[module.mounts]]
    disableWatch = true
    source = "../packages/queries"
    target = "assets/queries/"

[params]
  BookTheme = 'auto'
  BookToC = true
  BookSearch = true
  BookSection = '/'
  BookRepo = 'https://github.com/MaterializeInc/materialize-monitoring'
  BookEditPath = 'edit/main/docs/content'

[outputs]
  # Add root llms.txt and llms-full.txt (only for home)
  home = ["HTML", "RSS", "llms", "llmsfull", "md"]
  # Add markdown for all other pages
  page = ["HTML", "RSS", "md"]
  section = ["HTML", "RSS", "md"]
  taxonomy = ["HTML", "RSS", "md"]
  term = ["HTML", "RSS", "md"]
